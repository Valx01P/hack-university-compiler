# Optional shortcuts for Task (https://taskfile.dev): `task` sets everything
# up and serves the app. Every task is also an npm script, so Task isn't
# needed: `npm run up` does the same. Pass names and flags after --, like
# `task add -- cpp spring` or `task up -- --choose`.
version: "3"

tasks:
  default:
    desc: Set up whatever's missing and serve the app on http://localhost:3000 (the first run asks what to install)
    cmds:
      - npm run up -- {{.CLI_ARGS}}

  up:
    desc: The same as task
    cmds:
      - npm run up -- {{.CLI_ARGS}}

  dev:
    desc: The same, with the dev server
    cmds:
      - npm run up -- --dev {{.CLI_ARGS}}

  status:
    desc: Show what's installed, what isn't, and how much disk each takes
    cmds:
      - npm run status

  add:
    desc: Install compilers or courses, like task add -- cpp spring
    cmds:
      - npm run add -- {{.CLI_ARGS}}

  remove:
    desc: Remove compilers or courses to free disk, like task remove -- go-api
    cmds:
      - npm run remove -- {{.CLI_ARGS}}

  choose:
    desc: Pick what's installed from a checklist with the sizes
    cmds:
      - npm run choose

  clean:
    desc: Free Docker's build cache and the course images' older builds
    cmds:
      - npm run clean -- {{.CLI_ARGS}}

  down:
    desc: Stop the code sandbox (installed languages are kept)
    cmds:
      - npm run piston:down

  verify:
    desc: Check every lesson, challenge, cheatsheet, and code example, and the sandbox
    cmds:
      - npm run lessons:verify
      - npm run challenges:verify
      - npm run reference:verify
      - npm run snippets:verify
      - npm run security:verify
