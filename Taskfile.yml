# Optional shortcuts for Task (https://taskfile.dev): `task` sets everything
# up and serves the app. Every task is also an npm script, so Task isn't
# needed: `npm run up` does the same.
version: "3"

tasks:
  default:
    desc: Set up whatever's missing and serve the app on http://localhost:3000
    cmds:
      - npm run up

  dev:
    desc: The same, with the dev server
    cmds:
      - npm run up -- --dev

  down:
    desc: Stop the code sandbox (installed languages are kept)
    cmds:
      - npm run piston:down

  status:
    desc: Show which languages the sandbox has
    cmds:
      - npm run piston:status

  verify:
    desc: Check every lesson, challenge, cheatsheet, and code example
    cmds:
      - npm run lessons:verify
      - npm run challenges:verify
      - npm run reference:verify
      - npm run snippets:verify
      - npm run security:verify
