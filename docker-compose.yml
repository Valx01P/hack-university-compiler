# Local Piston, the code-execution sandbox behind the compiler.
#
#   npm run piston:up        # start it (port 2000, localhost only)
#   npm run piston:install   # install the language runtimes (once)
#
# Piston's isolate sandbox needs a privileged container (cgroups). Packages are
# x86_64 only, so on Apple Silicon this runs under emulation. Turn on "Use
# Rosetta for x86_64/amd64 emulation" in Docker Desktop for much faster runs.
#
# SECURITY: Piston has no auth. It binds to 127.0.0.1 so nothing outside this
# machine can reach it. Never change this to 0.0.0.0.
name: hack-university-compiler

services:
  piston:
    # Pinned to the Feb 2025 build so a new upstream push can't break runs.
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    container_name: hu-piston
    platform: linux/amd64
    restart: unless-stopped
    privileged: true # isolate sandbox (cgroups), required
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    # Sandbox limits. The app sends no per-request limits, so these are the
    # limits every run gets. Compile limits are generous because compilers
    # like kotlinc and swiftc are slow under emulation.
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_MAX_PROCESS_COUNT: "128"
      PISTON_OUTPUT_MAX_SIZE: "1048576" # 1 MB per stream
      PISTON_RUN_TIMEOUT: "10000"
      PISTON_RUN_CPU_TIME: "10000"
      PISTON_COMPILE_TIMEOUT: "60000"
      PISTON_COMPILE_CPU_TIME: "60000"
      PISTON_RUN_MEMORY_LIMIT: "536870912" # 512 MB
      PISTON_COMPILE_MEMORY_LIMIT: "1073741824" # 1 GB

volumes:
  piston-packages:
