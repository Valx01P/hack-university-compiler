# Runs Taskboard outside Hack University: the API and PostgreSQL 18.6, with the API
# waiting until the database's healthcheck passes. `docker compose up --build`, then
# load the seed with `DATABASE_URL=postgres://taskboard:taskboard@localhost:5432/taskboard?sslmode=disable make seed`.
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_DB: taskboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    environment:
      PORT: "8080"
      ADMIN_PORT: "0"
      DATABASE_URL: postgres://taskboard:taskboard@db:5432/taskboard?sslmode=disable
      TOKEN_SECRET: change-me-to-32-random-bytes-in-hex-00000000
      MIGRATE_ON_START: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
