# The dev profile: ./mvnw spring-boot:run turns it on (spring-boot.run.profiles in pom.xml).
spring:
  flyway:
    # db/seed/afterMigrate.sql runs after every migrate, so the dev database always has the sample shop.
    locations: classpath:db/migration,classpath:db/seed
  devtools:
    restart:
      # How often DevTools looks for recompiled classes, and how long it waits for a compile to finish.
      poll-interval: 1s
      quiet-period: 400ms
