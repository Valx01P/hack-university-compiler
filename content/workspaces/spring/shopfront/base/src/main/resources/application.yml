# Settings for every run. application-dev.yml adds to these when ./mvnw spring-boot:run starts
# the dev profile, and the tests' application-test.yml does the same for the test profile.
# ${NAME:default} reads an environment variable and falls back to the default.
spring:
  application:
    name: shopfront
  datasource:
    # The workspace passes its own database in DB_URL, DB_USER, and DB_PASSWORD.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopfront}
    username: ${DB_USER:shopfront}
    password: ${DB_PASSWORD:shopfront}
    hikari:
      # The workspace's database role allows 20 connections, shared by the app, its tests, and psql.
      maximum-pool-size: 5
  jpa:
    # Database work happens inside services, never while a response is being written.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities match it, and stops the app if not.
      ddl-auto: validate
  mvc:
    problemdetails:
      # Spring MVC's own errors (bad JSON, failed validation, unknown paths) answer as RFC 9457 problems.
      enabled: true
  data:
    web:
      pageable:
        # ?size=100000 gets 50 rows, not the whole table.
        max-page-size: 50

server:
  # The workspace leases a free port and passes it in PORT.
  port: ${PORT:8080}

app:
  clock:
    # An ISO instant like 2026-03-31T12:00:00Z fixes the shop's Clock. Empty means the real time.
    fixed: ${HU_FIXED_TIME:}

shop:
  currency: USD
  tax-rate: 0.0825
  free-shipping-over-cents: 5000
  jwt:
    # Set SHOP_JWT_SECRET anywhere real. HS256 needs at least 32 bytes.
    secret: ${SHOP_JWT_SECRET:dev-only-secret-change-me-it-must-be-32-bytes-or-longer}
    ttl: 1h

management:
  endpoints:
    web:
      exposure:
        # health and info are public, and metrics need an ADMIN token (see SecurityConfig).
        include: health,info,metrics

springdoc:
  # The OpenAPI document (/v3/api-docs) and Swagger UI (/swagger-ui.html) are on in every profile.
  # A production profile would usually turn both off.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
