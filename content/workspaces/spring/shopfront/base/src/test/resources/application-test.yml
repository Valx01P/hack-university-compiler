# The test profile, which Surefire turns on (see pom.xml): a fixed clock and migrations only, no seed.
app:
  clock:
    fixed: ${HU_FIXED_TIME:2026-03-31T12:00:00Z}

spring:
  datasource:
    # A separate test database when the workspace provides one (TEST_DB_URL), else the app's own.
    # Every test either rolls back or deletes the rows it added, so the app's data survives either way.
    url: ${TEST_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/shopfront_test}}
    username: ${TEST_DB_USER:${DB_USER:shopfront}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD:shopfront}}
    hikari:
      # Spring keeps each test context, and its pool, alive for the next test class, so test pools stay small.
      maximum-pool-size: 3
      minimum-idle: 1
