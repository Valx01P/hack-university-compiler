<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Taskboard</title>
    <script>
      // Runs before the CSS and the app load, so a saved dark theme never flashes light first.
      // The keys and values match src/lib/storage.ts and src/hooks/use-theme.ts.
      try {
        const theme = JSON.parse(localStorage.getItem("tb:theme:v1") ?? '"system"');
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.density = JSON.parse(localStorage.getItem("tb:density:v1") ?? '"comfortable"');
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
