; devtool settings. Run `devtool config --edit` to change them, or edit
; this file directly. Lines starting with ; are comments.

[core]
editor = nano
theme = dark
telemetry = false
check_updates = weekly

[paths]
projects = ~/projects
scratch = ~/tmp-cleanup
cache = ~/.cache/devtool

[sync]
enabled = true
interval_minutes = 15
remote = backup.example.net

[aliases]
st = status
co = checkout
