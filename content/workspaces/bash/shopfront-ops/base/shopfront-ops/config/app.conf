# Settings for the storefront, which the ops team owns and ships with each
# deploy. One "key = value" per line. Lines starting with # are comments.

environment = staging
site_name = Shopfront
base_url = https://shop.example.com
currency = EUR
timezone = UTC

# Checkout
max_cart_items = 50
free_shipping_over = 60.00
payment_provider = stripe-test

# Operations
log_level = info
maintenance_mode = off
cache_ttl_seconds = 300
# feature_flags = new-checkout,dark-mode
