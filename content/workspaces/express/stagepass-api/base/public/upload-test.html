<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload a poster · StagePass</title>
    <link rel="stylesheet" href="/static/css/site.css">
    <!-- An external script: the Content-Security-Policy (script-src 'self') blocks inline ones. -->
    <script src="/static/js/upload-test.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">StagePass</a>
      <span class="tagline">Poster upload test</span>
    </header>
    <main>
      <h1>Upload a poster</h1>
      <p>Logs in as an organizer, then sends <code>PUT /v1/events/:eventId/poster</code> as <code>multipart/form-data</code>, the way a browser form does.</p>
      <form class="upload-form" id="upload">
        <label>Email <input name="email" type="email" value="olu@stagepass.test" required></label>
        <label>Password <input name="password" type="password" value="stagepass-demo-2026" required></label>
        <label>Event id <input name="eventId" type="number" min="1" value="1" required></label>
        <label>Poster (PNG, JPEG, or WebP, at most 2 MB) <input name="poster" type="file" accept="image/png,image/jpeg,image/webp" required></label>
        <button type="submit">Upload</button>
      </form>
      <h2>Result</h2>
      <p class="result" id="result" aria-live="polite">Nothing sent yet.</p>
      <p id="link"></p>
    </main>
  </body>
</html>
