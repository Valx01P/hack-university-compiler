<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web playground</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/src/main.css">
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="page">
      <article class="card">
        <!-- The browser downloads only the first source whose type it supports. -->
        <picture>
          <source srcset="/images/sample-800.avif" type="image/avif">
          <source srcset="/images/sample-800.webp" type="image/webp">
          <img class="card-image" src="/images/sample-800.jpg" width="800" height="600"
               alt="A sunset behind layered purple mountains, above a still lake">
        </picture>
        <div id="app" class="card-body"></div>
      </article>
    </main>
  </body>
</html>
