<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks</title>
    <meta name="description" content="A small to-do list built with vanilla JavaScript in the Model, View, Controller pattern.">
    <link rel="stylesheet" href="/src/styles/app.css">
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="app">
      <h1 class="app-title">Tasks</h1>

      <form id="new-task" class="new-task" autocomplete="off">
        <label class="visually-hidden" for="new-task-title">New task</label>
        <input id="new-task-title" name="title" type="text" placeholder="What needs doing?">
        <button type="submit">Add</button>
      </form>

      <ul id="task-list" class="task-list" aria-label="Tasks"></ul>

      <!-- Hidden until the script knows there are tasks to count. -->
      <footer id="task-footer" class="task-footer" hidden>
        <span class="task-count" role="status"></span>
        <nav class="filters" aria-label="Filter tasks">
          <a href="?filter=all" data-filter="all">All</a>
          <a href="?filter=active" data-filter="active">Active</a>
          <a href="?filter=completed" data-filter="completed">Completed</a>
        </nav>
        <button id="clear-completed" class="clear-completed" type="button">Clear completed</button>
      </footer>
    </main>

    <!-- One row of the list. task-view.js clones it for each task and fills it in. -->
    <template id="task-item">
      <li class="task">
        <input class="task-toggle" type="checkbox" data-action="toggle">
        <span class="task-title"></span>
        <input class="task-title-input" type="text" aria-label="Task title">
        <button class="task-edit" type="button" data-action="edit">Edit</button>
        <button class="task-delete" type="button" data-action="delete">Delete</button>
      </li>
    </template>
  </body>
</html>
