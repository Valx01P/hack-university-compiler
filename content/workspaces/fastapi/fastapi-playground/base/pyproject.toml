[project]
name = "fastapi-playground"
version = "0.1.0"
description = "A blank FastAPI project for trying things out."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi[standard-no-fastapi-cloud-cli]==0.148.0",
    "psycopg[binary]==3.3.6",
    "pwdlib[argon2]==0.3.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pyjwt==2.15.1",
    "sqlalchemy[asyncio]==2.1.5",
]

[dependency-groups]
dev = [
    "httpx2==2.14.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest]
minversion = "9.0"
strict = true
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
