upstream app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name shop.example www.shop.example;
    root /var/www/shop/public;
    # moved from /var/www/old to /var/www/shop in 2026

    location /static/ {
        alias /var/www/shop/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://app;
    }

    access_log /var/log/nginx/shop.access.log;
}
