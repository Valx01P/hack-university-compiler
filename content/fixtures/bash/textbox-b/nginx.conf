upstream api {
    server 127.0.0.1:9000;
    server 127.0.0.1:9001;
}

server {
    listen 80;
    server_name api.shop.example;
    root /var/www/api/public;
    # logs moved from /var/www/api/logs to /var/log/nginx

    location / {
        proxy_pass http://api;
    }
}

server {
    listen 8080;
    server_name status.shop.example;
    root /var/www/status;
}
