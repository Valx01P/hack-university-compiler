<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>An email sent inside the transaction, or after the commit</title>
  <desc>Top: the transaction begins, inserts the booking, and sends the confirmation email in step 3. A later statement fails in step 4, and step 5 rolls the transaction back, so the email described a booking that no longer exists. Bottom: the transaction begins, inserts, and commits in step 3, and only then, in step 4, sends the email for a booking that's saved.</desc>

  <!-- Inside the transaction -->
  <text class="dg-heading" x="20" y="28" dy="0.35em">Email sent inside the transaction</text>
  <rect class="dg-frame" x="20" y="48" width="640" height="100" rx="12"/>
  <rect class="dg-box" x="36" y="72" width="96" height="40" rx="8"/>
  <text class="dg-code" x="84" y="92" dy="0.35em" text-anchor="middle">BEGIN</text>
  <rect class="dg-box" x="160" y="72" width="96" height="40" rx="8"/>
  <text class="dg-code" x="208" y="92" dy="0.35em" text-anchor="middle">INSERT</text>
  <rect class="dg-hot" x="284" y="72" width="112" height="40" rx="8"/>
  <text class="dg-on-hot" x="340" y="92" dy="0.35em" text-anchor="middle">send email</text>
  <rect class="dg-box" x="424" y="72" width="96" height="40" rx="8"/>
  <text x="472" y="92" dy="0.35em" text-anchor="middle">an error</text>
  <rect class="dg-box" x="548" y="72" width="96" height="40" rx="8"/>
  <text class="dg-code" x="596" y="92" dy="0.35em" text-anchor="middle">ROLLBACK</text>
  <path class="dg-line" d="M132 92 H156" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M256 92 H280" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M396 92 H420" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M520 92 H544" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="36" cy="72" r="10"/>
  <text class="dg-on-badge" x="36" y="72" dy="0.35em" text-anchor="middle">1</text>
  <circle class="dg-badge" cx="160" cy="72" r="10"/>
  <text class="dg-on-badge" x="160" y="72" dy="0.35em" text-anchor="middle">2</text>
  <circle class="dg-badge" cx="284" cy="72" r="10"/>
  <text class="dg-on-badge" x="284" y="72" dy="0.35em" text-anchor="middle">3</text>
  <circle class="dg-badge" cx="424" cy="72" r="10"/>
  <text class="dg-on-badge" x="424" y="72" dy="0.35em" text-anchor="middle">4</text>
  <circle class="dg-badge" cx="548" cy="72" r="10"/>
  <text class="dg-on-badge" x="548" y="72" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-note" x="340" y="130" dy="0.35em" text-anchor="middle">The email already left, and the booking never existed.</text>

  <!-- After the commit -->
  <text class="dg-heading" x="20" y="188" dy="0.35em">Email sent after the commit</text>
  <rect class="dg-frame" x="20" y="208" width="640" height="100" rx="12"/>
  <rect class="dg-box" x="36" y="232" width="96" height="40" rx="8"/>
  <text class="dg-code" x="84" y="252" dy="0.35em" text-anchor="middle">BEGIN</text>
  <rect class="dg-box" x="160" y="232" width="96" height="40" rx="8"/>
  <text class="dg-code" x="208" y="252" dy="0.35em" text-anchor="middle">INSERT</text>
  <rect class="dg-strong" x="284" y="232" width="112" height="40" rx="8"/>
  <text class="dg-code" x="340" y="252" dy="0.35em" text-anchor="middle">COMMIT</text>
  <rect class="dg-hot" x="424" y="232" width="112" height="40" rx="8"/>
  <text class="dg-on-hot" x="480" y="252" dy="0.35em" text-anchor="middle">send email</text>
  <path class="dg-line" d="M132 252 H156" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M256 252 H280" marker-end="url(#arrow)"/>
  <path class="dg-flow" d="M396 252 H420" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="36" cy="232" r="10"/>
  <text class="dg-on-badge" x="36" y="232" dy="0.35em" text-anchor="middle">1</text>
  <circle class="dg-badge" cx="160" cy="232" r="10"/>
  <text class="dg-on-badge" x="160" y="232" dy="0.35em" text-anchor="middle">2</text>
  <circle class="dg-badge" cx="284" cy="232" r="10"/>
  <text class="dg-on-badge" x="284" y="232" dy="0.35em" text-anchor="middle">3</text>
  <circle class="dg-badge" cx="424" cy="232" r="10"/>
  <text class="dg-on-badge" x="424" y="232" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="340" y="290" dy="0.35em" text-anchor="middle">The email goes only for a booking that's saved.</text>
</svg>
