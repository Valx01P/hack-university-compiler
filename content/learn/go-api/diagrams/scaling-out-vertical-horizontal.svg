<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Vertical scaling makes one server bigger, horizontal scaling adds more servers</title>
  <desc>On the left, vertical scaling: one server becomes one bigger server with more cores and memory, and it is still only one. On the right, horizontal scaling: one server becomes three instances, copies of the same API, so one can fail while the others keep answering.</desc>

  <!-- Vertical. -->
  <text class="dg-heading" x="20" y="30" dy="0.35em">Vertical: scale up</text>
  <rect class="dg-box" x="20" y="122" width="100" height="56" rx="8"/>
  <text x="70" y="150" dy="0.35em" text-anchor="middle">Server</text>
  <path class="dg-flow" d="M120 150 H166" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="170" y="70" width="150" height="160" rx="8"/>
  <text class="dg-on-hot" x="245" y="140" dy="0.35em" text-anchor="middle">Bigger server
    <tspan x="245" dy="1.4em">still just one</tspan>
  </text>
  <text class="dg-note" x="245" y="256" dy="0.35em" text-anchor="middle">more cores and memory</text>

  <path class="dg-line dg-dashed" d="M340 20 V280"/>

  <!-- Horizontal. -->
  <text class="dg-heading" x="360" y="30" dy="0.35em">Horizontal: scale out</text>
  <rect class="dg-box" x="360" y="122" width="100" height="56" rx="8"/>
  <text x="410" y="150" dy="0.35em" text-anchor="middle">Server</text>
  <path class="dg-flow" d="M460 150 H506" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="510" y="64" width="150" height="48" rx="8"/>
  <text class="dg-on-hot" x="585" y="88" dy="0.35em" text-anchor="middle">Instance 1</text>
  <rect class="dg-hot" x="510" y="126" width="150" height="48" rx="8"/>
  <text class="dg-on-hot" x="585" y="150" dy="0.35em" text-anchor="middle">Instance 2</text>
  <rect class="dg-hot" x="510" y="188" width="150" height="48" rx="8"/>
  <text class="dg-on-hot" x="585" y="212" dy="0.35em" text-anchor="middle">Instance 3</text>
  <text class="dg-note" x="585" y="256" dy="0.35em" text-anchor="middle">copies of the same API</text>
</svg>
