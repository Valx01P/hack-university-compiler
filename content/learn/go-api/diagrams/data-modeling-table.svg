<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>The rooms table: typed columns, one row per room, and a primary key</title>
  <desc>A table named rooms with three columns: id, a bigint, name, a text, and capacity, an integer. It has three rows: 1 Turing 6, 2 Lovelace 4, and 3 Hopper 8. Each row is one room. The id column is the primary key, so id 2 picks out exactly one row, Lovelace's, which is highlighted.</desc>

  <text class="dg-heading" x="40" y="36" dy="0.35em">rooms</text>

  <!-- One column, labeled. -->
  <text class="dg-note" x="380" y="24" dy="0.35em" text-anchor="middle">one column</text>
  <path class="dg-line" d="M380 34 V52" marker-end="url(#arrow)"/>

  <!-- Header: name and type of each column. -->
  <rect class="dg-strong" x="40" y="56" width="100" height="56" rx="8"/>
  <text x="90" y="75" dy="0.35em" text-anchor="middle">id
    <tspan class="dg-code" x="90" dy="1.4em">bigint</tspan>
  </text>
  <rect class="dg-strong" x="140" y="56" width="180" height="56" rx="8"/>
  <text x="230" y="75" dy="0.35em" text-anchor="middle">name
    <tspan class="dg-code" x="230" dy="1.4em">text</tspan>
  </text>
  <rect class="dg-strong" x="320" y="56" width="120" height="56" rx="8"/>
  <text x="380" y="75" dy="0.35em" text-anchor="middle">capacity
    <tspan class="dg-code" x="380" dy="1.4em">integer</tspan>
  </text>

  <!-- Row 1. -->
  <rect class="dg-box" x="40" y="116" width="100" height="36" rx="6"/>
  <text class="dg-code" x="90" y="134" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-box" x="140" y="116" width="180" height="36" rx="6"/>
  <text class="dg-code" x="230" y="134" dy="0.35em" text-anchor="middle">Turing</text>
  <rect class="dg-box" x="320" y="116" width="120" height="36" rx="6"/>
  <text class="dg-code" x="380" y="134" dy="0.35em" text-anchor="middle">6</text>

  <!-- Row 2, the one the key picks out. -->
  <rect class="dg-hot" x="40" y="156" width="100" height="36" rx="6"/>
  <text class="dg-code dg-on-hot" x="90" y="174" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-hot" x="140" y="156" width="180" height="36" rx="6"/>
  <text class="dg-code dg-on-hot" x="230" y="174" dy="0.35em" text-anchor="middle">Lovelace</text>
  <rect class="dg-hot" x="320" y="156" width="120" height="36" rx="6"/>
  <text class="dg-code dg-on-hot" x="380" y="174" dy="0.35em" text-anchor="middle">4</text>

  <!-- Row 3. -->
  <rect class="dg-box" x="40" y="196" width="100" height="36" rx="6"/>
  <text class="dg-code" x="90" y="214" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="140" y="196" width="180" height="36" rx="6"/>
  <text class="dg-code" x="230" y="214" dy="0.35em" text-anchor="middle">Hopper</text>
  <rect class="dg-box" x="320" y="196" width="120" height="36" rx="6"/>
  <text class="dg-code" x="380" y="214" dy="0.35em" text-anchor="middle">8</text>

  <!-- One row, labeled. -->
  <path class="dg-line" d="M492 174 H444" marker-end="url(#arrow)"/>
  <text class="dg-note" x="500" y="166" dy="0.35em">one row:</text>
  <text class="dg-note" x="500" y="184" dy="0.35em">one room</text>

  <!-- The primary key, labeled. -->
  <path class="dg-line" d="M90 262 V236" marker-end="url(#arrow)"/>
  <text class="dg-note" x="90" y="278" dy="0.35em" text-anchor="middle">primary key</text>
</svg>
