<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>Deleting an account: PostgreSQL first, then MongoDB, with a cleanup job behind</title>
  <desc>Step 1: the service commits the change to the user's row in PostgreSQL, the source of truth. Step 2: it clears userId on the user's feedback in MongoDB, a write that can fail. Step 3: a nightly cleanup job reads the deleted accounts from PostgreSQL and clears any feedback that still points at one.</desc>

  <rect class="dg-box" x="20" y="132" width="150" height="56" rx="8"/>
  <text x="95" y="151" dy="0.35em" text-anchor="middle">Service
    <tspan class="dg-note" x="95" dy="1.4em">delete account</tspan>
  </text>

  <!-- Step 1: commit to the source of truth. -->
  <rect class="dg-hot" x="420" y="40" width="200" height="56" rx="8"/>
  <text class="dg-on-hot" x="520" y="59" dy="0.35em" text-anchor="middle">PostgreSQL
    <tspan x="520" dy="1.4em">users row cleared</tspan>
  </text>
  <path class="dg-flow" d="M170 148 H280 V68 H416" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="320" cy="68" r="10"/>
  <text class="dg-on-badge" x="320" y="68" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="372" y="52" dy="0.35em" text-anchor="middle">commit</text>

  <!-- Step 2: the second write, which can fail. -->
  <rect class="dg-box" x="420" y="160" width="200" height="56" rx="8"/>
  <text x="520" y="179" dy="0.35em" text-anchor="middle">MongoDB
    <tspan class="dg-note" x="520" dy="1.4em">feedback userId to null</tspan>
  </text>
  <path class="dg-flow" d="M170 172 H280 V188 H416" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="320" cy="188" r="10"/>
  <text class="dg-on-badge" x="320" y="188" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="372" y="172" dy="0.35em" text-anchor="middle">may fail</text>

  <!-- Step 3: a job repairs what step 2 missed. -->
  <rect class="dg-box" x="420" y="280" width="200" height="56" rx="8"/>
  <text x="520" y="299" dy="0.35em" text-anchor="middle">Cleanup job
    <tspan class="dg-note" x="520" dy="1.4em">every night</tspan>
  </text>
  <path class="dg-flow" d="M500 280 V220" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="500" cy="250" r="10"/>
  <text class="dg-on-badge" x="500" y="250" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-note" x="420" y="250" dy="0.35em" text-anchor="end">clears leftovers</text>
  <path class="dg-line dg-dashed" d="M620 308 H650 V68 H624" marker-end="url(#arrow)"/>
</svg>
