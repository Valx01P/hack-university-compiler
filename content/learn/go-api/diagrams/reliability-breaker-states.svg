<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>A circuit breaker's three states: closed, open, and half-open</title>
  <desc>Closed lets calls through and counts failures. Too many failures trip it open, where calls fail at once. When the cool-down is over it turns half-open and lets a few trial calls through. If they work it closes again, and if one fails it opens again.</desc>

  <rect class="dg-box" x="40" y="100" width="160" height="60" rx="8"/>
  <text x="120" y="121" dy="0.35em" text-anchor="middle">Closed
    <tspan class="dg-note" x="120" dy="1.4em">calls go through</tspan>
  </text>
  <rect class="dg-hot" x="260" y="100" width="160" height="60" rx="8"/>
  <text class="dg-on-hot" x="340" y="121" dy="0.35em" text-anchor="middle">Open
    <tspan x="340" dy="1.4em">calls fail at once</tspan>
  </text>
  <rect class="dg-box" x="480" y="100" width="160" height="60" rx="8"/>
  <text x="560" y="121" dy="0.35em" text-anchor="middle">Half-open
    <tspan class="dg-note" x="560" dy="1.4em">a few trial calls</tspan>
  </text>

  <path class="dg-flow" d="M200 118 H256" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="230" y="84" dy="0.35em" text-anchor="middle">too many failures</text>

  <path class="dg-flow" d="M420 118 H476" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="450" y="84" dy="0.35em" text-anchor="middle">cool-down over</text>

  <path class="dg-line" d="M480 146 H424" marker-end="url(#arrow)"/>
  <text class="dg-note" x="450" y="180" dy="0.35em" text-anchor="middle">a trial fails</text>

  <path class="dg-flow" d="M560 160 V224 H120 V164" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="240" dy="0.35em" text-anchor="middle">the trials work</text>
</svg>
