<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A fixed window and a sliding window, both allowing 10 requests per 15 minutes</title>
  <desc>Ten requests arrive at 09:14 and ten more at 09:15. The fixed window counts 09:00 to 09:15 and 09:15 to 09:30 separately, so each window sees only ten and all twenty are allowed. The sliding window counts the 15 minutes before now, sees all twenty, and refuses ten.</desc>

  <!-- Fixed window -->
  <text class="dg-heading" x="40" y="32" dy="0.35em">Fixed window: 10 per 15 minutes</text>
  <rect class="dg-box" x="40" y="56" width="296" height="36" rx="8"/>
  <text x="188" y="74" dy="0.35em" text-anchor="middle">09:00 to 09:15</text>
  <rect class="dg-box" x="344" y="56" width="296" height="36" rx="8"/>
  <text x="492" y="74" dy="0.35em" text-anchor="middle">09:15 to 09:30</text>
  <path class="dg-line" d="M40 124 H640"/>
  <rect class="dg-hot" x="306" y="100" width="30" height="20" rx="4"/>
  <text class="dg-on-hot" x="321" y="110" dy="0.35em" text-anchor="middle">10</text>
  <rect class="dg-hot" x="344" y="100" width="30" height="20" rx="4"/>
  <text class="dg-on-hot" x="359" y="110" dy="0.35em" text-anchor="middle">10</text>
  <text class="dg-code" x="40" y="142" dy="0.35em">09:00</text>
  <text class="dg-code" x="340" y="142" dy="0.35em" text-anchor="middle">09:15</text>
  <text class="dg-code" x="640" y="142" dy="0.35em" text-anchor="end">09:30</text>
  <text class="dg-note" x="340" y="166" dy="0.35em" text-anchor="middle">each window counts 10, so all 20 get through</text>

  <!-- Sliding window -->
  <text class="dg-heading" x="40" y="200" dy="0.35em">Sliding window: the last 15 minutes</text>
  <rect class="dg-strong" x="80" y="224" width="296" height="36" rx="8"/>
  <text x="228" y="242" dy="0.35em" text-anchor="middle">the 15 minutes before now</text>
  <path class="dg-line" d="M40 292 H640"/>
  <rect class="dg-hot" x="306" y="268" width="30" height="20" rx="4"/>
  <text class="dg-on-hot" x="321" y="278" dy="0.35em" text-anchor="middle">10</text>
  <rect class="dg-hot" x="344" y="268" width="30" height="20" rx="4"/>
  <text class="dg-on-hot" x="359" y="278" dy="0.35em" text-anchor="middle">10</text>
  <text class="dg-code" x="40" y="310" dy="0.35em">09:00</text>
  <text class="dg-code" x="340" y="310" dy="0.35em" text-anchor="middle">09:15</text>
  <text class="dg-code" x="640" y="310" dy="0.35em" text-anchor="end">09:30</text>
  <text class="dg-note" x="512" y="242" dy="0.35em" text-anchor="middle">counts 20, refuses 10</text>
</svg>
