<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Code-first generates the spec from code, spec-first generates code from the spec</title>
  <desc>Two rows. In code-first, you write routes and schemas in code, a tool generates the spec from them, and docs and clients come from the spec. In spec-first, you write the spec by hand, then generate types and clients from it and check the code against it in tests.</desc>

  <!-- Code-first. -->
  <text class="dg-heading" x="20" y="34" dy="0.35em">Code-first</text>
  <rect class="dg-strong" x="20" y="60" width="190" height="56" rx="8"/>
  <text x="115" y="79" dy="0.35em" text-anchor="middle">Code
    <tspan class="dg-note" x="115" dy="1.4em">routes and schemas</tspan>
  </text>
  <path class="dg-flow" d="M210 88 H252" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="256" y="60" width="170" height="56" rx="8"/>
  <text class="dg-on-hot" x="341" y="79" dy="0.35em" text-anchor="middle">Spec
    <tspan x="341" dy="1.4em">generated</tspan>
  </text>
  <path class="dg-line" d="M426 88 H466" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="470" y="60" width="190" height="56" rx="8"/>
  <text x="565" y="79" dy="0.35em" text-anchor="middle">Docs, clients
    <tspan class="dg-note" x="565" dy="1.4em">read the spec</tspan>
  </text>

  <!-- Spec-first. -->
  <text class="dg-heading" x="20" y="170" dy="0.35em">Spec-first</text>
  <rect class="dg-hot" x="20" y="196" width="190" height="72" rx="8"/>
  <text class="dg-on-hot" x="115" y="222" dy="0.35em" text-anchor="middle">Spec
    <tspan x="115" dy="1.4em">written by hand</tspan>
  </text>
  <path class="dg-flow" d="M210 216 H252" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M230 216 V256 H252" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="256" y="196" width="190" height="40" rx="8"/>
  <text x="351" y="216" dy="0.35em" text-anchor="middle">Generated types</text>
  <rect class="dg-box" x="256" y="244" width="190" height="40" rx="8"/>
  <text x="351" y="264" dy="0.35em" text-anchor="middle">Checks in tests</text>
  <path class="dg-line" d="M446 216 H466" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M446 264 H466" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="470" y="196" width="190" height="88" rx="8"/>
  <text x="565" y="230" dy="0.35em" text-anchor="middle">Code
    <tspan class="dg-note" x="565" dy="1.4em">kept true to the spec</tspan>
  </text>
</svg>
