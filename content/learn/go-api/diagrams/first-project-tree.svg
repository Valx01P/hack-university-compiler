  <text class="dg-code" x="40" y="72" dy="0.35em">roombook/</text>
  <text class="dg-note" x="330" y="72" dy="0.35em">the module's folder</text>
  <text class="dg-code" x="68" y="100" dy="0.35em">go.mod</text>
  <text class="dg-note" x="330" y="100" dy="0.35em">the module's name, Go version, and dependencies</text>
  <text class="dg-code" x="68" y="128" dy="0.35em">go.sum</text>
  <text class="dg-note" x="330" y="128" dy="0.35em">a checksum for every dependency</text>
  <text class="dg-code" x="68" y="156" dy="0.35em">.air.toml</text>
  <text class="dg-note" x="330" y="156" dy="0.35em">what air builds and runs</text>
  <text class="dg-code" x="68" y="184" dy="0.35em">.gitignore</text>
  <text class="dg-note" x="330" y="184" dy="0.35em">what Git leaves out</text>
  <text class="dg-code" x="68" y="212" dy="0.35em">cmd/</text>
  <text class="dg-note" x="330" y="212" dy="0.35em">one folder per program</text>
  <text class="dg-code" x="96" y="240" dy="0.35em">api/</text>
  <text class="dg-note" x="330" y="240" dy="0.35em">the API server</text>
