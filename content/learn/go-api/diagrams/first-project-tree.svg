  <text class="dg-note" x="344" y="44" dy="0.35em">your code, now</text>
  <rect class="dg-off" x="480" y="34" width="20" height="20" rx="4"/>
  <text class="dg-note" x="508" y="44" dy="0.35em">added in later lessons</text>
