<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 740">
  <title>The Roombook module's folders: what's there now, and what later lessons add</title>
  <desc>The roombook folder holds go.mod, go.sum, .air.toml, .gitignore, cmd, and internal. cmd/api/main.go is the entry point, and internal/api holds routes.go and json.go, and those three files exist now. Later lessons add handler files like rooms.go, bookings.go, problems.go, and middleware.go to internal/api, the domain, service, store, auth, and cache packages under internal, and db/migrations for the database.</desc>

