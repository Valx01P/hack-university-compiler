<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Four requests share a pool of three open connections</title>
  <desc>Requests 1, 2, and 3 have each borrowed one of the pool's three open connections, and each connection leads to its own process inside PostgreSQL. Request 4 finds no free connection, so it waits in the pool until one of the others gives its connection back, or until the wait times out.</desc>

  <!-- Requests -->
  <rect class="dg-box" x="20" y="50" width="140" height="40" rx="8"/>
  <text x="90" y="70" dy="0.35em" text-anchor="middle">Request 1</text>
  <rect class="dg-box" x="20" y="110" width="140" height="40" rx="8"/>
  <text x="90" y="130" dy="0.35em" text-anchor="middle">Request 2</text>
  <rect class="dg-box" x="20" y="170" width="140" height="40" rx="8"/>
  <text x="90" y="190" dy="0.35em" text-anchor="middle">Request 3</text>
  <rect class="dg-off" x="20" y="230" width="140" height="40" rx="8"/>
  <text class="dg-faint" x="90" y="250" dy="0.35em" text-anchor="middle">Request 4</text>

  <!-- The pool -->
  <rect class="dg-frame" x="210" y="20" width="240" height="280" rx="12"/>
  <text class="dg-heading" x="230" y="40" dy="0.35em">Pool</text>
  <rect class="dg-strong" x="250" y="50" width="180" height="40" rx="8"/>
  <text x="340" y="70" dy="0.35em" text-anchor="middle">connection 1</text>
  <rect class="dg-strong" x="250" y="110" width="180" height="40" rx="8"/>
  <text x="340" y="130" dy="0.35em" text-anchor="middle">connection 2</text>
  <rect class="dg-strong" x="250" y="170" width="180" height="40" rx="8"/>
  <text x="340" y="190" dy="0.35em" text-anchor="middle">connection 3</text>
  <text class="dg-note" x="340" y="243" dy="0.35em" text-anchor="middle">none free:</text>
  <text class="dg-note" x="340" y="261" dy="0.35em" text-anchor="middle">request 4 waits</text>

  <path class="dg-flow" d="M160 70 H246" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M160 130 H246" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M160 190 H246" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M160 250 H266" marker-end="url(#arrow)"/>

  <!-- PostgreSQL -->
  <rect class="dg-hot" x="500" y="50" width="160" height="160" rx="8"/>
  <text class="dg-on-hot" x="580" y="121" dy="0.35em" text-anchor="middle">PostgreSQL
    <tspan x="580" dy="1.4em">3 processes</tspan>
  </text>
  <path class="dg-line" d="M430 70 H496" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M430 130 H496" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M430 190 H496" marker-end="url(#arrow)"/>
</svg>
