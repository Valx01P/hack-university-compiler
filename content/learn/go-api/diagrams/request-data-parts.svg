<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>Five places a request carries data, and what each one is for</title>
  <desc>On the left, a piece of a request from each place, and on the right, its job. The path, /v1/rooms/3, names which thing. The query string, ?building=main-library&amp;limit=20, carries options such as filters, sorting, and pages. Headers like Accept: application/json describe the request. A cookie carries the session, who is signed in. The body, here {"attendees": 4}, carries the content, and comes with POST, PUT, and PATCH. All but the body arrive as plain text.</desc>
  <text class="dg-heading" x="20" y="32" dy="0.35em">In the request</text>
  <text class="dg-heading" x="400" y="32" dy="0.35em">What it is for</text>

  <rect class="dg-box" x="20" y="60" width="300" height="56" rx="8"/>
  <text class="dg-code" x="36" y="88" dy="0.35em">/v1/rooms/3</text>
  <path class="dg-line" d="M320 88 H396" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="400" y="60" width="260" height="56" rx="8"/>
  <text x="416" y="78" dy="0.35em">Path: which thing
    <tspan class="dg-note" x="416" dy="1.4em">names one room or booking</tspan>
  </text>

  <rect class="dg-box" x="20" y="130" width="300" height="56" rx="8"/>
  <text class="dg-code" x="36" y="158" dy="0.35em">?building=main-library&amp;limit=20</text>
  <path class="dg-line" d="M320 158 H396" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="400" y="130" width="260" height="56" rx="8"/>
  <text x="416" y="148" dy="0.35em">Query: options
    <tspan class="dg-note" x="416" dy="1.4em">filters, sorting, and pages</tspan>
  </text>

  <rect class="dg-box" x="20" y="200" width="300" height="56" rx="8"/>
  <text class="dg-code" x="36" y="228" dy="0.35em">Accept: application/json</text>
  <path class="dg-line" d="M320 228 H396" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="400" y="200" width="260" height="56" rx="8"/>
  <text x="416" y="218" dy="0.35em">Headers: about it
    <tspan class="dg-note" x="416" dy="1.4em">formats, conditions, keys</tspan>
  </text>

  <rect class="dg-box" x="20" y="270" width="300" height="56" rx="8"/>
  <text class="dg-code" x="36" y="298" dy="0.35em">Cookie: session=7f3a9c2e</text>
  <path class="dg-line" d="M320 298 H396" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="400" y="270" width="260" height="56" rx="8"/>
  <text x="416" y="288" dy="0.35em">Cookie: the session
    <tspan class="dg-note" x="416" dy="1.4em">who is signed in</tspan>
  </text>

  <rect class="dg-box" x="20" y="340" width="300" height="56" rx="8"/>
  <text class="dg-code" x="36" y="368" dy="0.35em">{"attendees": 4}</text>
  <path class="dg-line" d="M320 368 H396" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="400" y="340" width="260" height="56" rx="8"/>
  <text x="416" y="358" dy="0.35em">Body: the content
    <tspan class="dg-note" x="416" dy="1.4em">sent with POST, PUT, PATCH</tspan>
  </text>
</svg>
