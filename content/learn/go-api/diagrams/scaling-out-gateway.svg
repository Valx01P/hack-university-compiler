<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>An API gateway in front of several services, routing by path</title>
  <desc>Three clients, a web app, a phone app, and a partner's script, send every request to one API gateway. The gateway checks tokens, applies rate limits, and adds request ids, then routes each request by its path: /v1/bookings to the bookings service, /v1/search to the search service, and /v1/notifications to the notifications service.</desc>

  <!-- Clients. -->
  <rect class="dg-box" x="20" y="60" width="150" height="40" rx="8"/>
  <text x="95" y="80" dy="0.35em" text-anchor="middle">Web app</text>
  <rect class="dg-box" x="20" y="140" width="150" height="40" rx="8"/>
  <text x="95" y="160" dy="0.35em" text-anchor="middle">Phone app</text>
  <rect class="dg-box" x="20" y="220" width="150" height="40" rx="8"/>
  <text x="95" y="240" dy="0.35em" text-anchor="middle">Partner</text>
  <path class="dg-line" d="M170 80 H200 V160"/>
  <path class="dg-line" d="M170 240 H200 V160"/>
  <path class="dg-flow" d="M170 160 H226" marker-end="url(#arrow-flow)"/>

  <!-- The gateway. -->
  <rect class="dg-hot" x="230" y="60" width="190" height="200" rx="8"/>
  <text class="dg-on-hot dg-heading" x="325" y="96" dy="0.35em" text-anchor="middle">API gateway</text>
  <text class="dg-on-hot" x="325" y="140" dy="0.35em" text-anchor="middle">checks tokens</text>
  <text class="dg-on-hot" x="325" y="168" dy="0.35em" text-anchor="middle">rate limits</text>
  <text class="dg-on-hot" x="325" y="196" dy="0.35em" text-anchor="middle">request ids</text>
  <text class="dg-on-hot" x="325" y="224" dy="0.35em" text-anchor="middle">routes by path</text>

  <!-- Services. -->
  <path class="dg-line" d="M420 160 H450"/>
  <path class="dg-line" d="M450 68 V252"/>
  <path class="dg-line" d="M450 68 H476" marker-end="url(#arrow)"/>
  <path class="dg-flow" d="M450 160 H476" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M450 252 H476" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="480" y="40" width="180" height="56" rx="8"/>
  <text x="570" y="59" dy="0.35em" text-anchor="middle">Bookings
    <tspan class="dg-code" x="570" dy="1.4em">/v1/bookings</tspan>
  </text>
  <rect class="dg-strong" x="480" y="132" width="180" height="56" rx="8"/>
  <text x="570" y="151" dy="0.35em" text-anchor="middle">Search
    <tspan class="dg-code" x="570" dy="1.4em">/v1/search</tspan>
  </text>
  <rect class="dg-box" x="480" y="224" width="180" height="56" rx="8"/>
  <text x="570" y="243" dy="0.35em" text-anchor="middle">Notifications
    <tspan class="dg-code" x="570" dy="1.4em">/v1/notifications</tspan>
  </text>
</svg>
