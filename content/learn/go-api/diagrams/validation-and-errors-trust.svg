<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The trust boundary: text from any client is parsed once, and only typed values go further in</title>
  <desc>On the left, three kinds of client send text: a web app, a script, and someone probing for weaknesses. All of it reaches the schema, at the edge of the trust boundary that surrounds your code. The schema either refuses the request with 400, 415, or 422, or passes typed values inward to the service, which passes them to the repository.</desc>

  <!-- Outside: anyone can send anything. -->
  <text class="dg-heading" x="20" y="40" dy="0.35em">Outside</text>
  <rect class="dg-box" x="20" y="64" width="170" height="40" rx="8"/>
  <text x="105" y="84" dy="0.35em" text-anchor="middle">Web app</text>
  <rect class="dg-box" x="20" y="124" width="170" height="40" rx="8"/>
  <text x="105" y="144" dy="0.35em" text-anchor="middle">Script</text>
  <rect class="dg-box" x="20" y="184" width="170" height="40" rx="8"/>
  <text x="105" y="204" dy="0.35em" text-anchor="middle">Someone probing</text>
  <path class="dg-line" d="M190 84 H256" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M190 144 H256" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M190 204 H256" marker-end="url(#arrow)"/>
  <text class="dg-note" x="223" y="68" dy="0.35em" text-anchor="middle">text</text>

  <!-- The boundary, and what's inside it. -->
  <rect class="dg-frame" x="240" y="20" width="420" height="300" rx="12"/>
  <text class="dg-heading" x="400" y="40" dy="0.35em">Inside: your code</text>
  <rect class="dg-hot" x="260" y="64" width="110" height="200" rx="8"/>
  <text class="dg-on-hot" x="315" y="154" dy="0.35em" text-anchor="middle">Schema
    <tspan x="315" dy="1.4em">parses</tspan>
  </text>
  <rect class="dg-box" x="480" y="84" width="160" height="56" rx="8"/>
  <text x="560" y="112" dy="0.35em" text-anchor="middle">Service</text>
  <rect class="dg-box" x="480" y="200" width="160" height="56" rx="8"/>
  <text x="560" y="228" dy="0.35em" text-anchor="middle">Repository</text>
  <path class="dg-flow" d="M370 112 H476" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="425" y="98" dy="0.35em" text-anchor="middle">typed values</text>
  <path class="dg-flow" d="M560 140 V196" marker-end="url(#arrow-flow)"/>

  <!-- Refused at the edge. -->
  <path class="dg-line dg-dashed" d="M260 248 H105 V228" marker-end="url(#arrow)"/>
  <text class="dg-code" x="130" y="268" dy="0.35em" text-anchor="middle">400, 415, or 422</text>
</svg>
