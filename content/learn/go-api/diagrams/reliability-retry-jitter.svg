<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Retries without jitter arrive in waves, and with full jitter they spread out</title>
  <desc>Five clients fail at the same moment. Without jitter, all five retry together after 200, 400, and 800 milliseconds, so each retry is a wave that hits the server at once. With full jitter, each client waits a random time below the same ceilings, so the same retries arrive spread out over time.</desc>

  <!-- Without jitter -->
  <text class="dg-heading" x="40" y="30" dy="0.35em">Without jitter</text>
  <path class="dg-line" d="M40 150 H640"/>
  <circle class="dg-hot" cx="120" cy="70" r="6"/>
  <circle class="dg-hot" cx="120" cy="86" r="6"/>
  <circle class="dg-hot" cx="120" cy="102" r="6"/>
  <circle class="dg-hot" cx="120" cy="118" r="6"/>
  <circle class="dg-hot" cx="120" cy="134" r="6"/>
  <circle class="dg-hot" cx="240" cy="70" r="6"/>
  <circle class="dg-hot" cx="240" cy="86" r="6"/>
  <circle class="dg-hot" cx="240" cy="102" r="6"/>
  <circle class="dg-hot" cx="240" cy="118" r="6"/>
  <circle class="dg-hot" cx="240" cy="134" r="6"/>
  <circle class="dg-hot" cx="480" cy="70" r="6"/>
  <circle class="dg-hot" cx="480" cy="86" r="6"/>
  <circle class="dg-hot" cx="480" cy="102" r="6"/>
  <circle class="dg-hot" cx="480" cy="118" r="6"/>
  <circle class="dg-hot" cx="480" cy="134" r="6"/>
  <text class="dg-code" x="120" y="166" dy="0.35em" text-anchor="middle">200 ms</text>
  <text class="dg-code" x="240" y="166" dy="0.35em" text-anchor="middle">400 ms</text>
  <text class="dg-code" x="480" y="166" dy="0.35em" text-anchor="middle">800 ms</text>
  <text class="dg-note" x="600" y="102" dy="0.35em" text-anchor="middle">five at once</text>

  <!-- With full jitter -->
  <text class="dg-heading" x="40" y="200" dy="0.35em">With full jitter</text>
  <path class="dg-line" d="M40 290 H640"/>
  <circle class="dg-hot" cx="58" cy="274" r="6"/>
  <circle class="dg-hot" cx="84" cy="258" r="6"/>
  <circle class="dg-hot" cx="104" cy="274" r="6"/>
  <circle class="dg-hot" cx="150" cy="242" r="6"/>
  <circle class="dg-hot" cx="176" cy="274" r="6"/>
  <circle class="dg-hot" cx="214" cy="258" r="6"/>
  <circle class="dg-hot" cx="262" cy="274" r="6"/>
  <circle class="dg-hot" cx="298" cy="242" r="6"/>
  <circle class="dg-hot" cx="336" cy="274" r="6"/>
  <circle class="dg-hot" cx="372" cy="258" r="6"/>
  <circle class="dg-hot" cx="420" cy="274" r="6"/>
  <circle class="dg-hot" cx="452" cy="242" r="6"/>
  <circle class="dg-hot" cx="506" cy="258" r="6"/>
  <circle class="dg-hot" cx="560" cy="274" r="6"/>
  <circle class="dg-hot" cx="612" cy="258" r="6"/>
  <text class="dg-note" x="340" y="306" dy="0.35em" text-anchor="middle">the same 15 retries, spread out</text>
</svg>
