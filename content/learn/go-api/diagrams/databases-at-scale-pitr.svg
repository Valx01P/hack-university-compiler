<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>Point-in-time recovery: a base backup plus the WAL archive, replayed up to just before a mistake</title>
  <desc>A base backup is taken at 02:00. The WAL archive keeps every change made after it. At 14:32 a bad deploy deletes rows. A new server restores the base backup and replays the archived WAL up to 14:31:59, one second before the mistake, so the data comes back as it was just before.</desc>

  <rect class="dg-box" x="40" y="40" width="140" height="56" rx="8"/>
  <text x="110" y="59" dy="0.35em" text-anchor="middle">base backup
    <tspan class="dg-code" x="110" dy="1.4em">02:00</tspan>
  </text>
  <circle class="dg-badge" cx="40" cy="40" r="10"/>
  <text class="dg-on-badge" x="40" y="40" dy="0.35em" text-anchor="middle">1</text>

  <rect class="dg-hot" x="520" y="40" width="140" height="56" rx="8"/>
  <text class="dg-on-hot" x="590" y="59" dy="0.35em" text-anchor="middle">rows deleted
    <tspan x="590" dy="1.4em">14:32</tspan>
  </text>
  <circle class="dg-badge" cx="520" cy="40" r="10"/>
  <text class="dg-on-badge" x="520" y="40" dy="0.35em" text-anchor="middle">3</text>

  <rect class="dg-box" x="110" y="120" width="550" height="40" rx="8"/>
  <text x="385" y="140" dy="0.35em" text-anchor="middle">WAL archive: every change after the backup</text>
  <circle class="dg-badge" cx="110" cy="120" r="10"/>
  <text class="dg-on-badge" x="110" y="120" dy="0.35em" text-anchor="middle">2</text>
  <path class="dg-line" d="M110 96 V116"/>

  <path class="dg-flow" d="M110 196 H496" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="110" cy="196" r="10"/>
  <text class="dg-on-badge" x="110" y="196" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="300" y="216" dy="0.35em" text-anchor="middle">restore the backup, replay the WAL</text>
  <path class="dg-line dg-dashed" d="M500 176 V256"/>
  <text class="dg-code" x="500" y="268" dy="0.35em" text-anchor="middle">14:31:59</text>
</svg>
