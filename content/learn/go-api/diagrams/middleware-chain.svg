<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500">
  <title>Roombook's handler in Go, each layer wrapping the ones below it</title>
  <desc>The server calls requestID, which wraps accessLog, which wraps recoverPanics. CORS and security headers, rate limiting, authentication, and the JSON route errors come in later lessons. Inside them all is the ServeMux, which picks the handler from the method and path, and the handler, which decodes its own body.</desc>
  <rect class="dg-box" x="40" y="20" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="38" dy="0.35em">requestID</text>
  <text class="dg-note" x="330" y="38" dy="0.35em">makes or keeps X-Request-Id</text>
  <path class="dg-line" d="M80 56 V68" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="72" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="90" dy="0.35em">accessLog(a.log)</text>
  <text class="dg-note" x="330" y="90" dy="0.35em">logs status and time</text>
  <path class="dg-line" d="M80 108 V120" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="124" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="142" dy="0.35em">a.recoverPanics</text>
  <text class="dg-note" x="330" y="142" dy="0.35em">turns a panic into a 500</text>
  <path class="dg-line" d="M80 160 V172" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="40" y="176" width="270" height="36" rx="8"/>
  <text class="dg-faint dg-code" x="56" y="194" dy="0.35em">CORS and security headers</text>
  <text class="dg-faint" x="330" y="194" dy="0.35em">lesson 21</text>
  <path class="dg-line" d="M80 212 V224" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="40" y="228" width="270" height="36" rx="8"/>
  <text class="dg-faint dg-code" x="56" y="246" dy="0.35em">rate limit</text>
  <text class="dg-faint" x="330" y="246" dy="0.35em">lesson 18</text>
  <path class="dg-line" d="M80 264 V276" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="40" y="280" width="270" height="36" rx="8"/>
  <text class="dg-faint dg-code" x="56" y="298" dy="0.35em">authenticate</text>
  <text class="dg-faint" x="330" y="298" dy="0.35em">lesson 13</text>
  <path class="dg-line" d="M80 316 V328" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="40" y="332" width="270" height="36" rx="8"/>
  <text class="dg-faint dg-code" x="56" y="350" dy="0.35em">routeErrors</text>
  <text class="dg-faint" x="330" y="350" dy="0.35em">JSON 404 and 405, lesson 7</text>
  <path class="dg-line" d="M80 368 V380" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="384" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="402" dy="0.35em">http.ServeMux</text>
  <text class="dg-note" x="330" y="402" dy="0.35em">picks the handler, or 404 and 405</text>
  <path class="dg-line" d="M80 420 V432" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="40" y="436" width="270" height="36" rx="8"/>
  <text class="dg-on-hot dg-code" x="56" y="454" dy="0.35em">handler</text>
  <text class="dg-note" x="330" y="454" dy="0.35em">decodes its own body</text>
</svg>
