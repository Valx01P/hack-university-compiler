<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>Migrations and fixtures run once, then every test resets before it starts</title>
  <desc>On the left, once per test run, the migrations bring the schema up to date and the fixtures load the buildings, users, and rooms. On the right, each test runs the same four steps: reset, which empties the bookings table, then arrange, act, and assert. Test 1 and test 2 each start from the fixtures alone.</desc>

  <!-- Once per run. -->
  <text class="dg-heading" x="20" y="30" dy="0.35em">Once per run</text>
  <rect class="dg-box" x="20" y="60" width="180" height="56" rx="8"/>
  <text x="110" y="79" dy="0.35em" text-anchor="middle">Migrate
    <tspan class="dg-note" x="110" dy="1.4em">schema up to date</tspan>
  </text>
  <path class="dg-line" d="M110 116 V136" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="20" y="140" width="180" height="56" rx="8"/>
  <text x="110" y="159" dy="0.35em" text-anchor="middle">Load fixtures
    <tspan class="dg-note" x="110" dy="1.4em">rooms and users</tspan>
  </text>
  <path class="dg-line" d="M200 168 H220 V88 H236" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M220 168 V196 H236" marker-end="url(#arrow)"/>

  <!-- Every test. -->
  <text class="dg-heading" x="240" y="30" dy="0.35em">Every test</text>
  <text class="dg-note" x="240" y="58" dy="0.35em">Test 1</text>
  <rect class="dg-hot" x="240" y="68" width="96" height="40" rx="8"/>
  <text class="dg-on-hot" x="288" y="88" dy="0.35em" text-anchor="middle">Reset</text>
  <rect class="dg-box" x="348" y="68" width="96" height="40" rx="8"/>
  <text x="396" y="88" dy="0.35em" text-anchor="middle">Arrange</text>
  <rect class="dg-box" x="456" y="68" width="96" height="40" rx="8"/>
  <text x="504" y="88" dy="0.35em" text-anchor="middle">Act</text>
  <rect class="dg-box" x="564" y="68" width="96" height="40" rx="8"/>
  <text x="612" y="88" dy="0.35em" text-anchor="middle">Assert</text>

  <text class="dg-note" x="240" y="166" dy="0.35em">Test 2</text>
  <rect class="dg-hot" x="240" y="176" width="96" height="40" rx="8"/>
  <text class="dg-on-hot" x="288" y="196" dy="0.35em" text-anchor="middle">Reset</text>
  <rect class="dg-box" x="348" y="176" width="96" height="40" rx="8"/>
  <text x="396" y="196" dy="0.35em" text-anchor="middle">Arrange</text>
  <rect class="dg-box" x="456" y="176" width="96" height="40" rx="8"/>
  <text x="504" y="196" dy="0.35em" text-anchor="middle">Act</text>
  <rect class="dg-box" x="564" y="176" width="96" height="40" rx="8"/>
  <text x="612" y="196" dy="0.35em" text-anchor="middle">Assert</text>

  <text class="dg-code" x="288" y="236" dy="0.35em" text-anchor="middle">TRUNCATE bookings</text>
  <text class="dg-note" x="450" y="236" dy="0.35em">before, so leftovers can't matter</text>
</svg>
