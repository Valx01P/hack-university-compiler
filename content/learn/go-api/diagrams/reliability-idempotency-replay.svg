<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A lost response, and the retry with the same key that replays it</title>
  <desc>Ada's app sends POST /v1/bookings with an Idempotency-Key. Roombook saves booking 1001 together with the key and answers 201, but the response is lost. The app sends the same request with the same key, and Roombook finds the key and sends the saved 201 again, with the same booking, instead of booking twice.</desc>

  <rect class="dg-box" x="40" y="20" width="160" height="48" rx="8"/>
  <text x="120" y="44" dy="0.35em" text-anchor="middle">Ada's app</text>
  <rect class="dg-strong" x="460" y="20" width="180" height="48" rx="8"/>
  <text x="550" y="44" dy="0.35em" text-anchor="middle">Roombook</text>
  <path class="dg-line dg-dashed" d="M120 68 V320"/>
  <path class="dg-line dg-dashed" d="M550 68 V320"/>

  <!-- 1: the first request -->
  <circle class="dg-badge" cx="142" cy="104" r="10"/>
  <text class="dg-on-badge" x="142" y="104" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="340" y="90" text-anchor="middle">POST, Idempotency-Key: 0b6d...</text>
  <path class="dg-flow" d="M156 104 H546" marker-end="url(#arrow-flow)"/>

  <!-- 2: saved together, response lost -->
  <rect class="dg-hot" x="470" y="124" width="160" height="56" rx="8"/>
  <text class="dg-on-hot" x="550" y="143" dy="0.35em" text-anchor="middle">booking 1001
    <tspan x="550" dy="1.4em">and the key</tspan>
  </text>
  <circle class="dg-badge" cx="448" cy="152" r="10"/>
  <text class="dg-on-badge" x="448" y="152" dy="0.35em" text-anchor="middle">2</text>
  <path class="dg-line dg-dashed" d="M550 200 H300"/>
  <text class="dg-code" x="368" y="186" text-anchor="middle">201 Created</text>
  <text class="dg-faint" x="232" y="200" dy="0.35em" text-anchor="middle">lost</text>

  <!-- 3: the retry, same key -->
  <circle class="dg-badge" cx="142" cy="248" r="10"/>
  <text class="dg-on-badge" x="142" y="248" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="340" y="234" text-anchor="middle">the same POST, the same key</text>
  <path class="dg-flow" d="M156 248 H546" marker-end="url(#arrow-flow)"/>

  <!-- 4: the replay -->
  <circle class="dg-badge" cx="142" cy="300" r="10"/>
  <text class="dg-on-badge" x="142" y="300" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="340" y="286" text-anchor="middle">201 Created, booking 1001 again</text>
  <path class="dg-flow dg-dashed" d="M550 300 H156" marker-end="url(#arrow-flow)"/>
</svg>
