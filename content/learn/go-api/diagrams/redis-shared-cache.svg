<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A cache in each instance's memory, next to one cache that every instance shares</title>
  <desc>On the left, three instances each keep their own copy of a room's availability. A booking through instance 1 clears its copy, but instances 2 and 3 keep old copies. On the right, three instances read and clear one copy kept in Redis, so a booking through any of them clears it for all.</desc>

  <!-- Left: a cache in each instance -->
  <rect class="dg-frame" x="20" y="20" width="310" height="280" rx="12"/>
  <text class="dg-heading" x="40" y="48" dy="0.35em">A cache in each instance</text>

  <rect class="dg-box" x="40" y="80" width="130" height="48" rx="8"/>
  <text x="105" y="104" dy="0.35em" text-anchor="middle">Instance 1</text>
  <path class="dg-line" d="M170 104 H196" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="200" y="80" width="110" height="48" rx="8"/>
  <text class="dg-on-hot" x="255" y="104" dy="0.35em" text-anchor="middle">fresh copy</text>

  <rect class="dg-box" x="40" y="148" width="130" height="48" rx="8"/>
  <text x="105" y="172" dy="0.35em" text-anchor="middle">Instance 2</text>
  <path class="dg-line" d="M170 172 H196" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="200" y="148" width="110" height="48" rx="8"/>
  <text class="dg-faint" x="255" y="172" dy="0.35em" text-anchor="middle">old copy</text>

  <rect class="dg-box" x="40" y="216" width="130" height="48" rx="8"/>
  <text x="105" y="240" dy="0.35em" text-anchor="middle">Instance 3</text>
  <path class="dg-line" d="M170 240 H196" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="200" y="216" width="110" height="48" rx="8"/>
  <text class="dg-faint" x="255" y="240" dy="0.35em" text-anchor="middle">old copy</text>

  <text class="dg-note" x="175" y="282" dy="0.35em" text-anchor="middle">a booking clears one copy</text>

  <!-- Right: one shared cache -->
  <rect class="dg-frame" x="350" y="20" width="310" height="280" rx="12"/>
  <text class="dg-heading" x="370" y="48" dy="0.35em">One shared cache</text>

  <rect class="dg-box" x="370" y="80" width="130" height="48" rx="8"/>
  <text x="435" y="104" dy="0.35em" text-anchor="middle">Instance 1</text>
  <rect class="dg-box" x="370" y="148" width="130" height="48" rx="8"/>
  <text x="435" y="172" dy="0.35em" text-anchor="middle">Instance 2</text>
  <rect class="dg-box" x="370" y="216" width="130" height="48" rx="8"/>
  <text x="435" y="240" dy="0.35em" text-anchor="middle">Instance 3</text>

  <rect class="dg-hot" x="540" y="128" width="100" height="88" rx="8"/>
  <text class="dg-on-hot" x="590" y="161" dy="0.35em" text-anchor="middle">Redis
    <tspan x="590" dy="1.4em">one copy</tspan>
  </text>

  <path class="dg-flow" d="M500 104 H520 V150 H536" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M500 172 H536" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M500 240 H520 V194 H536" marker-end="url(#arrow-flow)"/>

  <text class="dg-note" x="505" y="282" dy="0.35em" text-anchor="middle">a booking clears it for all</text>
</svg>
