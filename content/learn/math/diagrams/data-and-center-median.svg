<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <title>The median of an odd count and of an even count</title>
  <desc>Two sorted lists. The first, 2, 4, 5, 7, 9, has five values, and the third one, 5, is highlighted as the median. The second, 1, 3, 6, 8, has four values, so the two middle values 3 and 6 are highlighted, and the median is their mean, 4.5.</desc>
  <text class="dg-heading" x="40" y="50" dy="0.35em" text-anchor="start">n = 5, odd</text>
  <rect class="dg-box" x="200" y="30" width="48" height="40" rx="8"/>
  <text x="224" y="50" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="224" y="84" dy="0.35em" text-anchor="middle">#1</text>
  <rect class="dg-box" x="260" y="30" width="48" height="40" rx="8"/>
  <text x="284" y="50" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="284" y="84" dy="0.35em" text-anchor="middle">#2</text>
  <rect class="dg-hot" x="320" y="30" width="48" height="40" rx="8"/>
  <text class="dg-on-hot" x="344" y="50" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-note" x="344" y="84" dy="0.35em" text-anchor="middle">#3</text>
  <rect class="dg-box" x="380" y="30" width="48" height="40" rx="8"/>
  <text x="404" y="50" dy="0.35em" text-anchor="middle">7</text>
  <text class="dg-note" x="404" y="84" dy="0.35em" text-anchor="middle">#4</text>
  <rect class="dg-box" x="440" y="30" width="48" height="40" rx="8"/>
  <text x="464" y="50" dy="0.35em" text-anchor="middle">9</text>
  <text class="dg-note" x="464" y="84" dy="0.35em" text-anchor="middle">#5</text>
  <text class="dg-code" x="520" y="50" dy="0.35em" text-anchor="start">median = 5</text>
  <text class="dg-heading" x="40" y="160" dy="0.35em" text-anchor="start">n = 4, even</text>
  <rect class="dg-box" x="200" y="140" width="48" height="40" rx="8"/>
  <text x="224" y="160" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="224" y="194" dy="0.35em" text-anchor="middle">#1</text>
  <rect class="dg-hot" x="260" y="140" width="48" height="40" rx="8"/>
  <text class="dg-on-hot" x="284" y="160" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-note" x="284" y="194" dy="0.35em" text-anchor="middle">#2</text>
  <rect class="dg-hot" x="320" y="140" width="48" height="40" rx="8"/>
  <text class="dg-on-hot" x="344" y="160" dy="0.35em" text-anchor="middle">6</text>
  <text class="dg-note" x="344" y="194" dy="0.35em" text-anchor="middle">#3</text>
  <rect class="dg-box" x="380" y="140" width="48" height="40" rx="8"/>
  <text x="404" y="160" dy="0.35em" text-anchor="middle">8</text>
  <text class="dg-note" x="404" y="194" dy="0.35em" text-anchor="middle">#4</text>
  <text class="dg-code" x="460" y="160" dy="0.35em" text-anchor="start">median = (3 + 6)/2 = 4.5</text>
</svg>
