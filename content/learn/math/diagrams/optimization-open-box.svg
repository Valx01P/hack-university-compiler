<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The open box: a sheet with corners cut, and its volume V(x)</title>
  <desc>On the left, a 12 by 12 sheet with a square of side x cut from each corner. Folding up the four flaps makes an open box with a base 12 − 2x on each side and height x. On the right, the graph of the volume V(x) = x(12 − 2x)² on 0 ≤ x ≤ 6 rises from 0 to a maximum of 128 at x = 2 and falls back to 0 at x = 6.</desc>
  <!-- The sheet, with a square of side x cut from each corner -->
  <polygon class="dg-box" points="80,60 240,60 240,100 280,100 280,260 240,260 240,300 80,300 80,260 40,260 40,100 80,100"/>
  <rect class="dg-hot" x="80" y="100" width="160" height="160"/>
  <rect class="dg-off" x="40" y="60" width="40" height="40"/>
  <rect class="dg-off" x="240" y="60" width="40" height="40"/>
  <rect class="dg-off" x="40" y="260" width="40" height="40"/>
  <rect class="dg-off" x="240" y="260" width="40" height="40"/>
  <text class="dg-on-hot" x="160.0" y="170.0" dy="0.35em" text-anchor="middle">base</text>
  <text class="dg-on-hot" x="160.0" y="190.0" dy="0.35em" text-anchor="middle">(12 − 2x) by (12 − 2x)</text>
  <text class="dg-note" x="60.0" y="80.0" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="260.0" y="80.0" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="160.0" y="80.0" dy="0.35em" text-anchor="middle">fold up</text>
  <text x="160.0" y="36" dy="0.35em" text-anchor="middle">a 12 by 12 sheet</text>
  <text class="dg-note" x="160.0" y="320" dy="0.35em" text-anchor="middle">cut x from each corner, fold up the sides</text>
  <!-- Axes -->
  <line class="dg-line" x1="372" y1="300" x2="650" y2="300" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="380" y1="308" x2="380" y2="50" marker-end="url(#arrow)"/>
  <text class="dg-note" x="658" y="300" dy="0.35em">x</text>
  <text class="dg-note" x="380" y="42" text-anchor="middle">V</text>
  <line class="dg-line" x1="420.6" y1="295" x2="420.6" y2="305"/>
  <text class="dg-note" x="420.6" y="318" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="461.2" y1="295" x2="461.2" y2="305"/>
  <text class="dg-note" x="461.2" y="318" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="501.9" y1="295" x2="501.9" y2="305"/>
  <text class="dg-note" x="501.9" y="318" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="542.5" y1="295" x2="542.5" y2="305"/>
  <text class="dg-note" x="542.5" y="318" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="583.1" y1="295" x2="583.1" y2="305"/>
  <text class="dg-note" x="583.1" y="318" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="623.8" y1="295" x2="623.8" y2="305"/>
  <text class="dg-note" x="623.8" y="318" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="375" y1="220" x2="385" y2="220"/>
  <text class="dg-note" x="370" y="220" dy="0.35em" text-anchor="end">50</text>
  <line class="dg-line" x1="375" y1="140" x2="385" y2="140"/>
  <text class="dg-note" x="370" y="140" dy="0.35em" text-anchor="end">100</text>
  <line class="dg-line" x1="375" y1="95.2" x2="385" y2="95.2"/>
  <text class="dg-note" x="370" y="95.2" dy="0.35em" text-anchor="end">128</text>
