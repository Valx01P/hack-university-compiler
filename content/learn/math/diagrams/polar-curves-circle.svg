<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The polar curve r = 2 cos θ, a circle, with a point where r is negative</title>
  <desc>The curve r = 2 cos θ is the circle of radius 1 centered at (1, 0). Points are marked at θ = 0, where r = 2, at θ = π/3, where r = 1, and at θ = π/2, where r = 0 at the origin. At θ = 2π/3, r = −1, so the point is 1 unit in the opposite direction, along the dashed ray, at (1/2, −√3/2), which is still on the circle.</desc>
