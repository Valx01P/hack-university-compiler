<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A slide rule multiplying 2 × 3: lengths log 2 and log 3 add to log 6</title>
  <desc>Two scales marked 1 to 10, each number placed at a distance proportional to its logarithm, so the marks crowd together toward 10. The upper scale is slid right until its 1 sits over the 2 of the lower scale. Then the upper scale's 3 sits over the lower scale's 6, because the lengths log 2 and log 3 add to log 6.</desc>
  <rect class="dg-box" x="30" y="190" width="620" height="44" rx="8"/>
  <line class="dg-line" x1="40" y1="190" x2="40" y2="202"/>
  <text x="40" y="220" text-anchor="middle">1</text>
  <line class="dg-line" x1="220.6" y1="190" x2="220.6" y2="202"/>
  <text x="220.6" y="220" text-anchor="middle">2</text>
  <line class="dg-line" x1="326.3" y1="190" x2="326.3" y2="202"/>
  <text x="326.3" y="220" text-anchor="middle">3</text>
  <line class="dg-line" x1="401.2" y1="190" x2="401.2" y2="202"/>
  <text x="401.2" y="220" text-anchor="middle">4</text>
  <line class="dg-line" x1="459.4" y1="190" x2="459.4" y2="202"/>
  <text x="459.4" y="220" text-anchor="middle">5</text>
  <line class="dg-line" x1="506.9" y1="190" x2="506.9" y2="202"/>
  <text x="506.9" y="220" text-anchor="middle">6</text>
  <line class="dg-line" x1="547.1" y1="190" x2="547.1" y2="202"/>
  <text x="547.1" y="220" text-anchor="middle">7</text>
  <line class="dg-line" x1="581.9" y1="190" x2="581.9" y2="202"/>
  <text x="581.9" y="220" text-anchor="middle">8</text>
  <line class="dg-line" x1="612.5" y1="190" x2="612.5" y2="202"/>
  <text x="612.5" y="220" text-anchor="middle">9</text>
  <line class="dg-line" x1="640" y1="190" x2="640" y2="202"/>
  <text x="640" y="220" text-anchor="middle">10</text>
  <text class="dg-note" x="24" y="212" dy="0.35em" text-anchor="end">D</text>
  <rect class="dg-box" x="210.6" y="122" width="429.4" height="44" rx="8"/>
  <line class="dg-line" x1="220.6" y1="154" x2="220.6" y2="166"/>
  <text x="220.6" y="140" text-anchor="middle">1</text>
  <line class="dg-line" x1="401.2" y1="154" x2="401.2" y2="166"/>
  <text x="401.2" y="140" text-anchor="middle">2</text>
  <line class="dg-line" x1="506.9" y1="154" x2="506.9" y2="166"/>
  <text x="506.9" y="140" text-anchor="middle">3</text>
  <line class="dg-line" x1="581.9" y1="154" x2="581.9" y2="166"/>
  <text x="581.9" y="140" text-anchor="middle">4</text>
  <line class="dg-line" x1="640" y1="154" x2="640" y2="166"/>
  <text x="640" y="140" text-anchor="middle">5</text>
  <text class="dg-note" x="204.6" y="144" dy="0.35em" text-anchor="end">C</text>
  <line class="dg-flow" x1="40" y1="80" x2="218.6" y2="80" marker-end="url(#arrow-flow)" marker-start="url(#dot)"/>
  <text class="dg-code" x="130.3" y="64" text-anchor="middle">log 2</text>
  <line class="dg-flow" x1="220.6" y1="100" x2="504.9" y2="100" marker-end="url(#arrow-flow)" marker-start="url(#dot)"/>
  <text class="dg-code" x="363.8" y="90" text-anchor="middle">log 3</text>
  <line class="dg-line dg-dashed" x1="506.9" y1="100" x2="506.9" y2="186"/>
  <line class="dg-line dg-dashed" x1="220.6" y1="80" x2="220.6" y2="118"/>
  <circle class="dg-hot" cx="506.9" cy="212" r="13"/>
  <text class="dg-on-hot" x="506.9" y="212" dy="0.35em" text-anchor="middle">6</text>
  <text class="dg-code" x="506.9" y="262" text-anchor="middle">read 6 = 2 × 3</text>
</svg>
