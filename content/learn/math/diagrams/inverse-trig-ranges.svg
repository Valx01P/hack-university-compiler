<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>The ranges of arcsin, arccos, and arctan on the unit circle</title>
  <desc>Three unit circles. On the first, the right half is highlighted from −π/2 at the bottom to π/2 at the top, both ends included: arcsin's answers. On the second, the top half is highlighted from 0 on the right to π on the left, both ends included: arccos's answers. On the third, the right half is highlighted again, but the top and bottom ends are open circles, since tangent isn't defined there: arctan's answers.</desc>
  <!-- arcsin -->
  <line class="dg-line" x1="30" y1="130" x2="210" y2="130"/>
  <line class="dg-line" x1="120" y1="220" x2="120" y2="40"/>
  <text class="dg-heading" x="120" y="22" dy="0.35em" text-anchor="middle">arcsin</text>
  <text class="dg-note" x="120" y="244" dy="0.35em" text-anchor="middle">−π/2 to π/2</text>
  <path class="dg-flow" d="M120 60 A70 70 0 0 1 120 200"/>
  <path class="dg-line dg-dashed" d="M120 200 A70 70 0 0 1 120 60"/>
  <circle class="dg-hot" cx="120" cy="60" r="5"/>
  <circle class="dg-hot" cx="120" cy="200" r="5"/>
  <text class="dg-note" x="128" y="50">π/2</text>
  <text class="dg-note" x="128" y="216">−π/2</text>
  <!-- arccos -->
  <line class="dg-line" x1="250" y1="130" x2="430" y2="130"/>
  <line class="dg-line" x1="340" y1="220" x2="340" y2="40"/>
  <text class="dg-heading" x="340" y="22" dy="0.35em" text-anchor="middle">arccos</text>
  <text class="dg-note" x="340" y="244" dy="0.35em" text-anchor="middle">0 to π</text>
  <path class="dg-flow" d="M410 130 A70 70 0 0 0 270 130"/>
  <path class="dg-line dg-dashed" d="M270 130 A70 70 0 0 0 410 130"/>
  <circle class="dg-hot" cx="410" cy="130" r="5"/>
  <circle class="dg-hot" cx="270" cy="130" r="5"/>
  <text class="dg-note" x="416" y="118">0</text>
  <text class="dg-note" x="264" y="118" text-anchor="end">π</text>
  <!-- arctan -->
  <line class="dg-line" x1="470" y1="130" x2="650" y2="130"/>
  <line class="dg-line" x1="560" y1="220" x2="560" y2="40"/>
  <text class="dg-heading" x="560" y="22" dy="0.35em" text-anchor="middle">arctan</text>
  <text class="dg-note" x="560" y="244" dy="0.35em" text-anchor="middle">−π/2 to π/2, ends left out</text>
  <path class="dg-flow" d="M560 60 A70 70 0 0 1 560 200"/>
  <path class="dg-line dg-dashed" d="M560 200 A70 70 0 0 1 560 60"/>
  <circle class="dg-off" cx="560" cy="60" r="5"/>
  <circle class="dg-off" cx="560" cy="200" r="5"/>
  <text class="dg-note" x="568" y="50">π/2</text>
  <text class="dg-note" x="568" y="216">−π/2</text>
</svg>
