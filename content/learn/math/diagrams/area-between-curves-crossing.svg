<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>y = x³ and y = x cross at −1, 0, and 1, enclosing two pieces</title>
  <desc>The cubic y = x³ and the line y = x meet at x = −1, 0, and 1. Between −1 and 0 the cubic is on top, and between 0 and 1 the line is on top. Each piece has area 1/4, so the area is 1/2, though the integral of x³ − x from −1 to 1 is 0 because the two pieces cancel.</desc>
