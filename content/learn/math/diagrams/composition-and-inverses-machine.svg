<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200">
  <title>Composition as two machines in a row: g first, then f</title>
  <desc>The input 8 goes into the machine g(x) = x − 4 and comes out as 4. That output goes straight into the machine f(x) = √x, which gives 2. So (f ∘ g)(8) = f(g(8)) = 2: the function written on the right, g, runs first.</desc>
  <rect class="dg-strong" x="150" y="60" width="150" height="60" rx="8"/>
  <text class="dg-heading" x="225" y="90" dy="0.35em" text-anchor="middle">g(x) = x − 4</text>
  <rect class="dg-strong" x="400" y="60" width="150" height="60" rx="8"/>
  <text class="dg-heading" x="475" y="90" dy="0.35em" text-anchor="middle">f(x) = √x</text>
  <text class="dg-code" x="70" y="90" dy="0.35em" text-anchor="middle">8</text>
  <line class="dg-line" x1="84" y1="90" x2="146" y2="90" marker-end="url(#arrow)"/>
  <line class="dg-flow" x1="304" y1="90" x2="396" y2="90" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="350" y="76" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-flow" x1="554" y1="90" x2="616" y2="90" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="636" y="90" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="70" y="140" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="350" y="140" dy="0.35em" text-anchor="middle">g(x)</text>
  <text class="dg-note" x="636" y="140" dy="0.35em" text-anchor="middle">f(g(x))</text>
  <text class="dg-note" x="350" y="170" dy="0.35em" text-anchor="middle">(f ∘ g)(x) = f(g(x)): g runs first</text>
</svg>
