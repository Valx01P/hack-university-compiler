<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The distance between two points is the hypotenuse of a right triangle</title>
  <desc>A coordinate grid with points P at (1, 2) and Q at (4, 6). A corner R at (4, 2) makes a right triangle. Its horizontal leg PR has length |4 − 1| = 3, its vertical leg RQ has length |6 − 2| = 4, and the hypotenuse PQ is the distance, √(3² + 4²) = 5.</desc>
  <line class="dg-line" x1="180" y1="320" x2="476" y2="320" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="220" y1="340" x2="220" y2="24" marker-end="url(#arrow)"/>
  <text class="dg-note" x="488" y="320" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="220" y="12" dy="0.35em" text-anchor="middle">y</text>
  <line class="dg-line" x1="260" y1="316" x2="260" y2="324"/>
  <text class="dg-note" x="260" y="336" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="300" y1="316" x2="300" y2="324"/>
  <text class="dg-note" x="300" y="336" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="340" y1="316" x2="340" y2="324"/>
  <text class="dg-note" x="340" y="336" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="380" y1="316" x2="380" y2="324"/>
  <text class="dg-note" x="380" y="336" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="420" y1="316" x2="420" y2="324"/>
  <text class="dg-note" x="420" y="336" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="460" y1="316" x2="460" y2="324"/>
  <text class="dg-note" x="460" y="336" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="216" y1="280" x2="224" y2="280"/>
  <text class="dg-note" x="206" y="280" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="216" y1="240" x2="224" y2="240"/>
  <text class="dg-note" x="206" y="240" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="216" y1="200" x2="224" y2="200"/>
  <text class="dg-note" x="206" y="200" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="216" y1="160" x2="224" y2="160"/>
  <text class="dg-note" x="206" y="160" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="216" y1="120" x2="224" y2="120"/>
  <text class="dg-note" x="206" y="120" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="216" y1="80" x2="224" y2="80"/>
  <text class="dg-note" x="206" y="80" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="216" y1="40" x2="224" y2="40"/>
  <text class="dg-note" x="206" y="40" dy="0.35em" text-anchor="middle">7</text>
  <polygon class="dg-hot" points="260,240 380,240 380,80"/>
  <line class="dg-flow" x1="260" y1="240" x2="380" y2="80"/>
  <polyline class="dg-line" points="380,228 368,228 368,240"/>
  <circle class="dg-strong" cx="260" cy="240" r="5"/>
  <circle class="dg-strong" cx="380" cy="80" r="5"/>
  <circle class="dg-strong" cx="380" cy="240" r="4"/>
  <text x="260" y="262" dy="0.35em" text-anchor="middle">P(1, 2)</text>
  <text x="420" y="80" dy="0.35em" text-anchor="middle">Q(4, 6)</text>
  <text x="420" y="240" dy="0.35em" text-anchor="middle">R(4, 2)</text>
  <text class="dg-code" x="328" y="256" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="394" y="160" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="298" y="148" dy="0.35em" text-anchor="middle">d = 5</text>
  <text class="dg-note" x="560" y="150" dy="0.35em" text-anchor="middle">legs |x₂ − x₁| = 3</text>
  <text class="dg-note" x="560" y="170" dy="0.35em" text-anchor="middle">and |y₂ − y₁| = 4</text>
  <text class="dg-code" x="560" y="200" dy="0.35em" text-anchor="middle">d² = 3² + 4² = 25</text>
</svg>
