<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A 10 foot ladder sliding down a wall</title>
  <desc>A ladder 10 feet long leans against a wall, with its bottom x feet from the wall and its top y feet up. The bottom slides away from the wall at 1 foot per second, and the top slides down at an unknown rate. The ladder, the wall, and the ground form a right triangle, so x² + y² = 10² at every moment.</desc>
  <!-- the ground and the wall -->
  <line class="dg-line" x1="60" y1="250" x2="440" y2="250"/>
  <rect class="dg-box" x="80" y="30" width="20" height="220"/>
  <path class="dg-line" d="M100 236 H114 V250"/>
  <!-- the ladder: 10 ft, from (6, 0) to (0, 8), 25 units a foot -->
  <line class="dg-flow" x1="250" y1="250" x2="100" y2="50"/>
  <circle class="dg-hot" cx="250" cy="250" r="5"/>
  <circle class="dg-hot" cx="100" cy="50" r="5"/>
  <text x="190" y="140" dy="0.35em" text-anchor="start">10 ft</text>
  <!-- x along the ground, y up the wall -->
  <line class="dg-line dg-dashed" x1="100" y1="272" x2="250" y2="272"/>
  <text x="175" y="288" dy="0.35em" text-anchor="middle">x</text>
  <text x="118" y="160" dy="0.35em" text-anchor="start">y</text>
  <!-- the rates -->
  <line class="dg-flow" x1="262" y1="234" x2="330" y2="234" marker-end="url(#arrow-flow)"/>
  <text x="342" y="234" dy="0.35em" text-anchor="start">dx/dt = 1 ft/s</text>
  <line class="dg-line" x1="124" y1="56" x2="124" y2="104" marker-end="url(#arrow)"/>
  <text x="136" y="80" dy="0.35em" text-anchor="start">dy/dt = ?</text>
  <text x="560" y="110" dy="0.35em" text-anchor="middle">x² + y² = 10²</text>
  <text class="dg-note" x="560" y="136" dy="0.35em" text-anchor="middle">at every moment</text>
</svg>
