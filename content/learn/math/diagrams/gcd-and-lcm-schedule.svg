<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220">
  <title>A bus every 12 minutes and a tram every 18 minutes</title>
  <desc>A timeline from 0 to 72 minutes. The bus leaves at 0, 12, 24, 36, 48, 60, and 72. The tram leaves at 0, 18, 36, 54, and 72. They leave together only at 0, 36, and 72, the multiples of 36, which is the least common multiple of 12 and 18.</desc>
  <text x="20" y="60" dy="0.35em">bus</text>
  <line class="dg-line" x1="110.0" y1="60" x2="650.0" y2="60"/>
  <circle class="dg-hot" cx="110.0" cy="60" r="7"/>
  <circle class="dg-box" cx="200.0" cy="60" r="7"/>
  <circle class="dg-box" cx="290.0" cy="60" r="7"/>
  <circle class="dg-hot" cx="380.0" cy="60" r="7"/>
  <circle class="dg-box" cx="470.0" cy="60" r="7"/>
  <circle class="dg-box" cx="560.0" cy="60" r="7"/>
  <circle class="dg-hot" cx="650.0" cy="60" r="7"/>
  <text x="20" y="120" dy="0.35em">tram</text>
  <line class="dg-line" x1="110.0" y1="120" x2="650.0" y2="120"/>
  <circle class="dg-hot" cx="110.0" cy="120" r="7"/>
  <circle class="dg-box" cx="245.0" cy="120" r="7"/>
  <circle class="dg-hot" cx="380.0" cy="120" r="7"/>
  <circle class="dg-box" cx="515.0" cy="120" r="7"/>
  <circle class="dg-hot" cx="650.0" cy="120" r="7"/>
  <line class="dg-flow dg-dashed" x1="110.0" y1="74" x2="110.0" y2="106"/>
  <line class="dg-flow dg-dashed" x1="380.0" y1="74" x2="380.0" y2="106"/>
  <line class="dg-flow dg-dashed" x1="650.0" y1="74" x2="650.0" y2="106"/>
  <line class="dg-line" x1="110.0" y1="170" x2="666.0" y2="170" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="110.0" y1="164" x2="110.0" y2="176"/>
  <text class="dg-code" x="110.0" y="194" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line" x1="200.0" y1="164" x2="200.0" y2="176"/>
  <text class="dg-code" x="200.0" y="194" dy="0.35em" text-anchor="middle">12</text>
  <line class="dg-line" x1="245.0" y1="164" x2="245.0" y2="176"/>
  <text class="dg-code" x="245.0" y="194" dy="0.35em" text-anchor="middle">18</text>
  <line class="dg-line" x1="290.0" y1="164" x2="290.0" y2="176"/>
  <text class="dg-code" x="290.0" y="194" dy="0.35em" text-anchor="middle">24</text>
  <line class="dg-line" x1="380.0" y1="164" x2="380.0" y2="176"/>
  <text class="dg-code" x="380.0" y="194" dy="0.35em" text-anchor="middle">36</text>
  <line class="dg-line" x1="470.0" y1="164" x2="470.0" y2="176"/>
  <text class="dg-code" x="470.0" y="194" dy="0.35em" text-anchor="middle">48</text>
  <line class="dg-line" x1="515.0" y1="164" x2="515.0" y2="176"/>
  <text class="dg-code" x="515.0" y="194" dy="0.35em" text-anchor="middle">54</text>
  <line class="dg-line" x1="560.0" y1="164" x2="560.0" y2="176"/>
  <text class="dg-code" x="560.0" y="194" dy="0.35em" text-anchor="middle">60</text>
  <line class="dg-line" x1="650.0" y1="164" x2="650.0" y2="176"/>
  <text class="dg-code" x="650.0" y="194" dy="0.35em" text-anchor="middle">72</text>
  <text class="dg-note" x="20" y="170" dy="0.35em">minutes</text>
</svg>
