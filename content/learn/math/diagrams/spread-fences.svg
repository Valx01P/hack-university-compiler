  <line class="dg-line" x1="335" y1="165" x2="335" y2="175"/>
  <line class="dg-line" x1="390" y1="165" x2="390" y2="175"/>
  <line class="dg-line" x1="445" y1="165" x2="445" y2="175"/>
  <line class="dg-line" x1="500" y1="165" x2="500" y2="175"/>
