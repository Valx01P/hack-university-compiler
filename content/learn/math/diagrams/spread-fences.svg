<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <title>Commute times with the box from Q1 to Q3 and the 1.5 × IQR fences</title>
  <desc>Nine commute times in minutes on a number line from 0 to 100. Eight lie between 12 and 30, and a box from Q1 = 16.5 to Q3 = 29 covers the middle half. Dashed fences stand 1.5 × IQR = 18.75 beyond the box, at −2.25 and 47.75. The commute of 95 minutes lies past the upper fence, so it is flagged as an outlier.</desc>
