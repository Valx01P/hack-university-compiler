  <text class="dg-note" x="610" y="188" dy="0.35em" text-anchor="middle">100</text>
  <text class="dg-note" x="340" y="214" dy="0.35em" text-anchor="middle">commute, minutes</text>
  <rect class="dg-box" x="150.8" y="100" width="68.8" height="36"/>
