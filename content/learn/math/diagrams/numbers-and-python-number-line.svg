<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160">
  <title>Adding on the number line: 7 + 5 = 12</title>
  <desc>A number line from 0 to 12 with evenly spaced ticks. Starting at 7, five numbered hops each move one step right, through 8, 9, 10, and 11, and land on 12. So 7 + 5 = 12, and the same picture read backward shows that 12 − 7 is the 5 steps from 7 to 12.</desc>
  <!-- The number line, with arrows both ways. -->
  <line class="dg-line" x1="340" y1="110" x2="670" y2="110" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="110" x2="10" y2="110" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="40" y1="103" x2="40" y2="117"/>
  <text x="40" y="134" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line" x1="90" y1="103" x2="90" y2="117"/>
  <text x="90" y="134" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="140" y1="103" x2="140" y2="117"/>
  <text x="140" y="134" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="190" y1="103" x2="190" y2="117"/>
  <text x="190" y="134" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="240" y1="103" x2="240" y2="117"/>
  <text x="240" y="134" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="290" y1="103" x2="290" y2="117"/>
  <text x="290" y="134" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="340" y1="103" x2="340" y2="117"/>
  <text x="340" y="134" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="390" y1="103" x2="390" y2="117"/>
  <text x="390" y="134" dy="0.35em" text-anchor="middle">7</text>
  <line class="dg-line" x1="440" y1="103" x2="440" y2="117"/>
  <text x="440" y="134" dy="0.35em" text-anchor="middle">8</text>
  <line class="dg-line" x1="490" y1="103" x2="490" y2="117"/>
  <text x="490" y="134" dy="0.35em" text-anchor="middle">9</text>
  <line class="dg-line" x1="540" y1="103" x2="540" y2="117"/>
  <text x="540" y="134" dy="0.35em" text-anchor="middle">10</text>
  <line class="dg-line" x1="590" y1="103" x2="590" y2="117"/>
  <text x="590" y="134" dy="0.35em" text-anchor="middle">11</text>
  <line class="dg-line" x1="640" y1="103" x2="640" y2="117"/>
  <text x="640" y="134" dy="0.35em" text-anchor="middle">12</text>
  <!-- Five steps right from 7. -->
  <path class="dg-flow" d="M393 101 Q415 62 436 99" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="415" y="66" dy="0.35em" text-anchor="middle">1</text>
  <path class="dg-flow" d="M443 101 Q465 62 486 99" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="465" y="66" dy="0.35em" text-anchor="middle">2</text>
  <path class="dg-flow" d="M493 101 Q515 62 536 99" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="515" y="66" dy="0.35em" text-anchor="middle">3</text>
  <path class="dg-flow" d="M543 101 Q565 62 586 99" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="565" y="66" dy="0.35em" text-anchor="middle">4</text>
  <path class="dg-flow" d="M593 101 Q615 62 636 99" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="615" y="66" dy="0.35em" text-anchor="middle">5</text>
  <circle class="dg-hot" cx="390" cy="110" r="6"/>
  <circle class="dg-hot" cx="640" cy="110" r="6"/>
  <text class="dg-heading" x="40" y="36" dy="0.35em" text-anchor="start">7 + 5 = 12</text>
  <text class="dg-note" x="40" y="58" dy="0.35em" text-anchor="start">start at 7, take 5 steps right</text>
</svg>
