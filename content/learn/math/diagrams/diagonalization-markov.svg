<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <title>A two-state Markov chain for the weather</title>
  <desc>Two boxes, sunny and rainy. A sunny day is followed by another sunny day with probability 0.8 and by a rainy day with probability 0.2. A rainy day is followed by a sunny day with probability 0.4 and by another rainy day with probability 0.6. The probabilities leaving each state add to 1.</desc>
  <rect class="dg-hot" x="120" y="90" width="140" height="56" rx="8"/>
  <text class="dg-on-hot" x="190" y="118" dy="0.35em" text-anchor="middle">sunny</text>
  <rect class="dg-box" x="420" y="90" width="140" height="56" rx="8"/>
  <text x="490" y="118" dy="0.35em" text-anchor="middle">rainy</text>
  <path class="dg-flow" d="M260 106 H416" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="338" y="92" dy="0.35em" text-anchor="middle">0.2</text>
  <path class="dg-line" d="M420 132 H264" marker-end="url(#arrow)"/>
  <text class="dg-code" x="338" y="150" dy="0.35em" text-anchor="middle">0.4</text>
  <path class="dg-line" d="M150 90 V50 H230 V86" marker-end="url(#arrow)"/>
  <text class="dg-note" x="190" y="36" dy="0.35em" text-anchor="middle">0.8 stays sunny</text>
  <path class="dg-line" d="M450 90 V50 H530 V86" marker-end="url(#arrow)"/>
  <text class="dg-note" x="490" y="36" dy="0.35em" text-anchor="middle">0.6 stays rainy</text>
  <text class="dg-note" x="190" y="176" dy="0.35em" text-anchor="middle">column 1: 0.8 + 0.2 = 1</text>
  <text class="dg-note" x="490" y="176" dy="0.35em" text-anchor="middle">column 2: 0.4 + 0.6 = 1</text>
  <text class="dg-code" x="340" y="214" dy="0.35em" text-anchor="middle">A = [[0.8, 0.4], [0.2, 0.6]], steady state (2/3, 1/3)</text>
</svg>
