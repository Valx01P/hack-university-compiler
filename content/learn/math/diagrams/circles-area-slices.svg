<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>A circle cut into 12 sectors and rearranged into a near-parallelogram</title>
  <desc>On the left, a circle of radius r cut into 12 equal sectors, the top half highlighted. On the right, the same 12 sectors laid side by side, the highlighted ones pointing down and the others pointing up. Together they make a bumpy parallelogram whose height is about r and whose base is half the circumference, πr. More, thinner sectors make it closer to a true parallelogram, so the area is πr × r = πr².</desc>
  <path class="dg-box" d="M30 150 A100 100 0 0 0 230 150 Z"/>
  <path class="dg-hot" d="M30 150 A100 100 0 0 1 230 150 Z"/>
  <line class="dg-line" x1="130" y1="150" x2="230" y2="150"/>
  <line class="dg-line" x1="130" y1="150" x2="216.6" y2="100"/>
  <line class="dg-line" x1="130" y1="150" x2="180" y2="63.4"/>
  <line class="dg-line" x1="130" y1="150" x2="130" y2="50"/>
  <line class="dg-line" x1="130" y1="150" x2="80" y2="63.4"/>
  <line class="dg-line" x1="130" y1="150" x2="43.4" y2="100"/>
  <line class="dg-line" x1="130" y1="150" x2="30" y2="150"/>
  <line class="dg-line" x1="130" y1="150" x2="43.4" y2="200"/>
  <line class="dg-line" x1="130" y1="150" x2="80" y2="236.6"/>
  <line class="dg-line" x1="130" y1="150" x2="130" y2="250"/>
  <line class="dg-line" x1="130" y1="150" x2="180" y2="236.6"/>
  <line class="dg-line" x1="130" y1="150" x2="216.6" y2="200"/>
  <text class="dg-note" x="130" y="30" dy="0.35em" text-anchor="middle">12 equal sectors</text>
  <path class="dg-box" d="M330.4 110 L350.6 185.3 A78 78 0 0 1 310.2 185.3 Z"/>
  <path class="dg-box" d="M370.8 110 L390.9 185.3 A78 78 0 0 1 350.6 185.3 Z"/>
  <path class="dg-box" d="M411.1 110 L431.3 185.3 A78 78 0 0 1 390.9 185.3 Z"/>
  <path class="dg-box" d="M451.5 110 L471.7 185.3 A78 78 0 0 1 431.3 185.3 Z"/>
  <path class="dg-box" d="M491.9 110 L512.1 185.3 A78 78 0 0 1 471.7 185.3 Z"/>
  <path class="dg-box" d="M532.3 110 L552.4 185.3 A78 78 0 0 1 512.1 185.3 Z"/>
  <path class="dg-hot" d="M310.2 185.3 L290 110 A78 78 0 0 1 330.4 110 Z"/>
  <path class="dg-hot" d="M350.6 185.3 L330.4 110 A78 78 0 0 1 370.8 110 Z"/>
  <path class="dg-hot" d="M390.9 185.3 L370.8 110 A78 78 0 0 1 411.1 110 Z"/>
  <path class="dg-hot" d="M431.3 185.3 L411.1 110 A78 78 0 0 1 451.5 110 Z"/>
  <path class="dg-hot" d="M471.7 185.3 L451.5 110 A78 78 0 0 1 491.9 110 Z"/>
  <path class="dg-hot" d="M512.1 185.3 L491.9 110 A78 78 0 0 1 532.3 110 Z"/>
  <line class="dg-line" x1="272" y1="110" x2="272" y2="185.3"/>
  <text class="dg-heading" x="260" y="147.7" dy="0.35em" text-anchor="middle">r</text>
  <line class="dg-line" x1="310.2" y1="215.3" x2="552.4" y2="215.3"/>
  <text class="dg-note" x="431.3" y="235.3" dy="0.35em" text-anchor="middle">half the circumference: πr</text>
  <text class="dg-code" x="431.3" y="56" dy="0.35em" text-anchor="middle">area ≈ base × height = πr × r = πr²</text>
</svg>
