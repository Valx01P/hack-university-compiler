<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The area function g(x) and the strip it gains when x grows by h</title>
  <desc>The curve y = f(t) is above the t axis. The area under it from a to x is shaded and labeled g(x). Moving the right edge from x to x + h adds one thin highlighted strip of width h and height about f(x), so g grows by about f(x) times h, and the rate g grows at is f(x).</desc>
