<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A piecewise function with a jump at x = 2, marked with an open and a closed dot</title>
  <desc>The graph of g(x) = x + 1 for x &lt; 2 and g(x) = 6 − x for x ≥ 2. A rising line comes up to an open dot at (2, 3), which is not on the graph. A falling line starts at a closed dot at (2, 4), which is on the graph, so g(2) = 4 and the graph jumps at 2.</desc>
  <line class="dg-line" x1="20" y1="260" x2="660" y2="260" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="53.7" y1="256" x2="53.7" y2="264"/>
  <text class="dg-note" x="53.7" y="276" text-anchor="middle">−2</text>
  <line class="dg-line" x1="121.1" y1="256" x2="121.1" y2="264"/>
  <text class="dg-note" x="121.1" y="276" text-anchor="middle">−1</text>
  <line class="dg-line" x1="188.4" y1="256" x2="188.4" y2="264"/>
  <line class="dg-line" x1="255.8" y1="256" x2="255.8" y2="264"/>
  <text class="dg-note" x="255.8" y="276" text-anchor="middle">1</text>
  <line class="dg-line" x1="323.2" y1="256" x2="323.2" y2="264"/>
  <text class="dg-note" x="323.2" y="276" text-anchor="middle">2</text>
  <line class="dg-line" x1="390.5" y1="256" x2="390.5" y2="264"/>
  <text class="dg-note" x="390.5" y="276" text-anchor="middle">3</text>
  <line class="dg-line" x1="457.9" y1="256" x2="457.9" y2="264"/>
  <text class="dg-note" x="457.9" y="276" text-anchor="middle">4</text>
  <line class="dg-line" x1="525.3" y1="256" x2="525.3" y2="264"/>
  <text class="dg-note" x="525.3" y="276" text-anchor="middle">5</text>
  <line class="dg-line" x1="592.6" y1="256" x2="592.6" y2="264"/>
  <text class="dg-note" x="592.6" y="276" text-anchor="middle">6</text>
  <text class="dg-note" x="658" y="248" text-anchor="end">x</text>
  <line class="dg-line" x1="188.4" y1="320" x2="188.4" y2="20" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="184.4" y1="220" x2="192.4" y2="220"/>
  <text class="dg-note" x="180.4" y="220" dy="0.35em" text-anchor="end">1</text>
  <line class="dg-line" x1="184.4" y1="180" x2="192.4" y2="180"/>
  <text class="dg-note" x="180.4" y="180" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="184.4" y1="140" x2="192.4" y2="140"/>
  <text class="dg-note" x="180.4" y="140" dy="0.35em" text-anchor="end">3</text>
  <line class="dg-line" x1="184.4" y1="100" x2="192.4" y2="100"/>
  <text class="dg-note" x="180.4" y="100" dy="0.35em" text-anchor="end">4</text>
  <line class="dg-line" x1="184.4" y1="60" x2="192.4" y2="60"/>
  <text class="dg-note" x="180.4" y="60" dy="0.35em" text-anchor="end">5</text>
  <text class="dg-note" x="198.4" y="26" dy="0.35em" text-anchor="start">y</text>
  <polyline class="dg-flow" points="20,320 323.2,140"/>
  <polyline class="dg-flow" points="323.2,100 660,300"/>
  <line class="dg-line dg-dashed" x1="323.2" y1="260" x2="323.2" y2="146"/>
  <circle class="dg-box" cx="323.2" cy="140" r="5"/>
  <circle class="dg-badge" cx="323.2" cy="100" r="5"/>
  <text class="dg-code" x="311.2" y="134" dy="0.35em" text-anchor="end">(2, 3) open</text>
  <text class="dg-code" x="311.2" y="100" dy="0.35em" text-anchor="end">g(2) = 4</text>
  <text class="dg-code" x="252.3" y="202" dy="0.35em" text-anchor="start">x + 1</text>
  <text class="dg-code" x="481.4" y="182" dy="0.35em" text-anchor="start">6 − x</text>
</svg>
