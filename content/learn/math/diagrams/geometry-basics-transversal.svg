<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Two parallel lines cut by a transversal make eight angles</title>
  <desc>Two horizontal parallel lines, ℓ on top and m below, are crossed by a slanted transversal. At the top crossing P the angles are numbered 1 upper left, 2 upper right, 3 lower left, 4 lower right, and at the bottom crossing Q the same positions are 5, 6, 7, 8. Angles 1, 4, 5, and 8 are 70°, and 2, 3, 6, and 7 are 110°. The alternate interior angles 4 and 5 are highlighted and equal.</desc>
  <path class="dg-hot" d="M334.5 100 L348.2 137.6 A40 40 0 0 0 374.5 100 Z"/>
  <path class="dg-hot" d="M385.5 240 L371.8 202.4 A40 40 0 0 0 345.5 240 Z"/>
  <line class="dg-line" x1="60" y1="100" x2="620" y2="100"/>
  <line class="dg-line" x1="60" y1="240" x2="620" y2="240"/>
  <polyline class="dg-line" points="560,94 568,100 560,106"/>
  <polyline class="dg-line" points="560,234 568,240 560,246"/>
  <text class="dg-heading" x="640" y="100" dy="0.35em" text-anchor="middle">ℓ</text>
  <text class="dg-heading" x="640" y="240" dy="0.35em" text-anchor="middle">m</text>
  <line class="dg-flow" x1="414.6" y1="320" x2="305.4" y2="20"/>
  <text class="dg-heading" x="321.4" y="30" dy="0.35em" text-anchor="middle">t</text>
  <text x="309.9" y="82.8" dy="0.35em" text-anchor="middle">1</text>
  <text x="351.7" y="75.4" dy="0.35em" text-anchor="middle">2</text>
  <text x="317.3" y="124.6" dy="0.35em" text-anchor="middle">3</text>
  <text x="359.1" y="117.2" dy="0.35em" text-anchor="middle">4</text>
  <text x="360.9" y="222.8" dy="0.35em" text-anchor="middle">5</text>
  <text x="402.7" y="215.4" dy="0.35em" text-anchor="middle">6</text>
  <text x="368.3" y="264.6" dy="0.35em" text-anchor="middle">7</text>
  <text x="410.1" y="257.2" dy="0.35em" text-anchor="middle">8</text>
  <text class="dg-note" x="394.5" y="86" dy="0.35em" text-anchor="middle">P</text>
  <text class="dg-note" x="445.5" y="226" dy="0.35em" text-anchor="middle">Q</text>
  <text class="dg-note" x="150" y="170" dy="0.35em" text-anchor="middle">ℓ and m are parallel</text>
  <text class="dg-code" x="520" y="170" dy="0.35em" text-anchor="middle">∠4 = ∠5 = 70°</text>
</svg>
