<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>Complementary angles fill a right angle, supplementary angles fill a straight angle</title>
  <desc>On the left, a right angle at vertex B, marked with a small square, is split by a ray into angles of 35° and 55°, so the two are complementary: 35° + 55° = 90°. On the right, a ray from a point on a straight line splits the straight angle into 145° and 35°, so the two are supplementary: 145° + 35° = 180°.</desc>
  <path class="dg-hot" d="M100 220 L170 220 A70 70 0 0 0 157.3 179.8 Z"/>
  <line class="dg-line" x1="100" y1="220" x2="300" y2="220"/>
  <line class="dg-line" x1="100" y1="220" x2="100" y2="30"/>
  <line class="dg-flow" x1="100" y1="220" x2="272" y2="99.5"/>
  <polyline class="dg-line" points="114,220 114,206 100,206"/>
  <path class="dg-line" d="M181.9 162.6 A100 100 0 0 0 100 120"/>
  <text x="188" y="193.1" dy="0.35em" text-anchor="middle">35°</text>
  <text x="158.2" y="110.5" dy="0.35em" text-anchor="middle">55°</text>
  <text class="dg-heading" x="86" y="234" dy="0.35em" text-anchor="middle">B</text>
  <text class="dg-code" x="200" y="260" dy="0.35em" text-anchor="middle">35° + 55° = 90°</text>
  <text class="dg-heading" x="200" y="24" dy="0.35em" text-anchor="middle">complementary</text>
  <path class="dg-hot" d="M500 220 L459 191.3 A50 50 0 0 0 450 220 Z"/>
  <line class="dg-line" x1="340" y1="220" x2="660" y2="220"/>
  <line class="dg-flow" x1="500" y1="220" x2="360.7" y2="122.5"/>
  <path class="dg-line" d="M544 220 A44 44 0 0 0 464 194.8"/>
  <text x="535" y="159.4" dy="0.35em" text-anchor="middle">145°</text>
  <text x="428.2" y="202.1" dy="0.35em" text-anchor="middle">35°</text>
  <text class="dg-code" x="500" y="260" dy="0.35em" text-anchor="middle">145° + 35° = 180°</text>
  <text class="dg-heading" x="500" y="24" dy="0.35em" text-anchor="middle">supplementary</text>
</svg>
