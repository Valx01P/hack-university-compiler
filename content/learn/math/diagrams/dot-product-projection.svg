<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The projection of v onto u and the leftover at a right angle</title>
  <desc>A dashed line runs through the origin in the direction of u. The vector v points up and to the right, above that line. Its shadow on the line, the projection p, runs along u from the origin. The leftover w = v − p goes from the tip of p straight up to the tip of v and meets the line at a right angle.</desc>
  <line class="dg-line dg-dashed" x1="30.4" y1="277.4" x2="633.6" y2="126.6"/>
  <line class="dg-line" x1="100" y1="260" x2="329.1" y2="202.7" marker-end="url(#arrow)"/>
  <line class="dg-flow" x1="100" y1="260" x2="214.4" y2="76.9" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="100" y1="260" x2="249.9" y2="222.5" marker-end="url(#arrow-flow)"/>
  <line class="dg-line dg-dashed" x1="252.8" y1="221.8" x2="216.7" y2="77.3" marker-end="url(#arrow)"/>
  <polyline class="dg-line" points="242.2,224.5 239.5,213.8 250.2,211.1"/>
  <text x="336" y="218" dy="0.35em" text-anchor="start">u</text>
  <text x="208" y="64.4" dy="0.35em" text-anchor="end">v</text>
  <text x="180.4" y="256.9" dy="0.35em" text-anchor="start">p</text>
  <text x="246.4" y="148.1" dy="0.35em" text-anchor="start">w = v − p</text>
  <text class="dg-note" x="623.6" y="150.6" dy="0.35em" text-anchor="end">the line through u</text>
  <circle class="dg-strong" cx="100" cy="260" r="3"/>
</svg>
