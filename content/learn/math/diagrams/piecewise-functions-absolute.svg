<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The graph of g(x) = |x − 2| + |x + 1|: two slanted sides and a flat bottom at height 3</title>
  <desc>Break points at x = −1 and x = 2 are marked with dashed vertical lines. Left of −1 the graph is the line 1 − 2x, falling. Between −1 and 2 it's flat at height 3, the distance between the two break points. Right of 2 it's the line 2x − 1, rising.</desc>
  <line class="dg-line" x1="20" y1="290" x2="660" y2="290" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="20" y1="286" x2="20" y2="294"/>
  <text class="dg-note" x="20" y="306" text-anchor="middle">−4</text>
  <line class="dg-line" x1="91.1" y1="286" x2="91.1" y2="294"/>
  <text class="dg-note" x="91.1" y="306" text-anchor="middle">−3</text>
  <line class="dg-line" x1="162.2" y1="286" x2="162.2" y2="294"/>
  <text class="dg-note" x="162.2" y="306" text-anchor="middle">−2</text>
  <line class="dg-line" x1="233.3" y1="286" x2="233.3" y2="294"/>
  <text class="dg-note" x="233.3" y="306" text-anchor="middle">−1</text>
  <line class="dg-line" x1="304.4" y1="286" x2="304.4" y2="294"/>
  <line class="dg-line" x1="375.6" y1="286" x2="375.6" y2="294"/>
  <text class="dg-note" x="375.6" y="306" text-anchor="middle">1</text>
  <line class="dg-line" x1="446.7" y1="286" x2="446.7" y2="294"/>
  <text class="dg-note" x="446.7" y="306" text-anchor="middle">2</text>
  <line class="dg-line" x1="517.8" y1="286" x2="517.8" y2="294"/>
  <text class="dg-note" x="517.8" y="306" text-anchor="middle">3</text>
  <line class="dg-line" x1="588.9" y1="286" x2="588.9" y2="294"/>
  <text class="dg-note" x="588.9" y="306" text-anchor="middle">4</text>
  <line class="dg-line" x1="660" y1="286" x2="660" y2="294"/>
  <text class="dg-note" x="660" y="306" text-anchor="middle">5</text>
  <text class="dg-note" x="658" y="278" text-anchor="end">x</text>
  <line class="dg-line" x1="304.4" y1="320" x2="304.4" y2="20" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="300.4" y1="230" x2="308.4" y2="230"/>
  <text class="dg-note" x="296.4" y="230" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="300.4" y1="170" x2="308.4" y2="170"/>
  <text class="dg-note" x="296.4" y="170" dy="0.35em" text-anchor="end">4</text>
  <line class="dg-line" x1="300.4" y1="110" x2="308.4" y2="110"/>
  <text class="dg-note" x="296.4" y="110" dy="0.35em" text-anchor="end">6</text>
  <line class="dg-line" x1="300.4" y1="50" x2="308.4" y2="50"/>
  <text class="dg-note" x="296.4" y="50" dy="0.35em" text-anchor="end">8</text>
  <text class="dg-note" x="314.4" y="26" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-line dg-dashed" x1="233.3" y1="290" x2="233.3" y2="200"/>
  <line class="dg-line dg-dashed" x1="446.7" y1="290" x2="446.7" y2="200"/>
  <polyline class="dg-flow" points="20,20 232.8,199.6 234.4,200 445.6,200 447.2,199.5 660,20"/>
  <circle class="dg-badge" cx="233.3" cy="200" r="4"/>
  <circle class="dg-badge" cx="446.7" cy="200" r="4"/>
  <text class="dg-code" x="340" y="186" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="86.9" y="68" dy="0.35em" text-anchor="start">1 − 2x</text>
  <text class="dg-code" x="593.1" y="68" dy="0.35em" text-anchor="end">2x − 1</text>
</svg>
