<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Two points with the same ratio y/x but opposite directions</title>
  <desc>A coordinate plane with the points (−3, 3) and (3, −3) on the dashed line y = −x. Both have y/x = −1, so arctan gives −45° for both. The arrow to (3, −3) makes an angle of −45° with the positive x-axis, but the highlighted arrow to (−3, 3) makes an angle of 135°. atan2 tells them apart by the quadrant.</desc>
  <!-- Axes -->
  <line class="dg-line" x1="150" y1="150" x2="530" y2="150" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="290" x2="340" y2="12" marker-end="url(#arrow)"/>
  <text class="dg-note" x="530" y="168" text-anchor="end">x</text>
  <text class="dg-note" x="352" y="22">y</text>
  <!-- The line y = -x through both points -->
  <line class="dg-line dg-dashed" x1="200" y1="10" x2="480" y2="290"/>
  <!-- Arrows to each point -->
  <line class="dg-flow" x1="340" y1="150" x2="241.4" y2="51.4" marker-end="url(#arrow-flow)"/>
  <line class="dg-line" x1="340" y1="150" x2="438.6" y2="248.6" marker-end="url(#arrow)"/>
  <circle class="dg-hot" cx="235" cy="45" r="5"/>
  <circle class="dg-box" cx="445" cy="255" r="5"/>
  <text class="dg-code" x="247" y="37">(−3, 3)</text>
  <text class="dg-code" x="433" y="273" text-anchor="end">(3, −3)</text>
  <!-- The two angles -->
  <path class="dg-flow" d="M372 150 A32 32 0 0 0 317.4 127.4"/>
  <text x="372" y="112" dy="0.35em">135°</text>
  <path class="dg-line" d="M390 150 A50 50 0 0 1 375.4 185.4"/>
  <text x="398" y="178" dy="0.35em">−45°</text>
  <text class="dg-note" x="560" y="60" dy="0.35em" text-anchor="middle">same ratio y/x = −1</text>
  <text class="dg-note" x="560" y="80" dy="0.35em" text-anchor="middle">opposite directions</text>
</svg>
