<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>A layer of water in a cylindrical tank and the distance it must rise</title>
  <desc>A cylindrical tank partly full of water. A thin horizontal layer at height y above the bottom is highlighted: its area is A(y) and its thickness dy. An arrow shows it must rise a distance D(y) to the top of the tank, so its work is about 9800 A(y) D(y) dy.</desc>
  <line class="dg-line" x1="130" y1="70" x2="130" y2="330"/>
  <line class="dg-line" x1="390" y1="70" x2="390" y2="330"/>
  <ellipse class="dg-off" cx="260" cy="70" rx="130" ry="26"/>
  <path class="dg-line" d="M130 330 A130 26 0 0 0 390 330"/>
  <path class="dg-line dg-dashed" d="M130 330 A130 26 0 0 1 390 330"/>
  <ellipse class="dg-box" cx="260" cy="120" rx="130" ry="26"/>
  <polygon class="dg-hot" points="130,230 390,230 390,244 130,244"/>
  <ellipse class="dg-hot" cx="260" cy="230" rx="130" ry="26"/>
  <text class="dg-on-hot" x="260" y="235" text-anchor="middle">area A(y)</text>
  <line class="dg-flow" x1="420" y1="230" x2="420" y2="74" marker-end="url(#arrow-flow)"/>
  <text x="430" y="150">rises D(y) to the top</text>
  <line class="dg-line" x1="100" y1="330" x2="100" y2="230"/>
  <line class="dg-line" x1="94" y1="330" x2="106" y2="330"/>
  <line class="dg-line" x1="94" y1="230" x2="106" y2="230"/>
  <text x="92" y="285" text-anchor="end">y</text>
  <text x="430" y="248">thickness dy</text>
  <text class="dg-note" x="120" y="86" text-anchor="end">water surface</text>
</svg>
