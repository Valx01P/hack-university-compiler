<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The two integrals of integration by parts fill a rectangle</title>
  <desc>A curve runs from the point (v₁, u₁) to (v₂, u₂) in a plane with v across and u up. The region under the curve, down to the v axis, is the integral of u dv. The region left of the curve, out to the u axis, is the integral of v du. Together they fill the big rectangle of area u₂v₂ except the small corner rectangle of area u₁v₁, so they add to u₂v₂ − u₁v₁, the uv term of the formula.</desc>
