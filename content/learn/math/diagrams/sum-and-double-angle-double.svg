  <title>The heights sin a, sin 2a, and 2 sin a for a = 30 degrees</title>
  <desc>A unit circle with points at angles 30 and 60 degrees. The point at 30 degrees has height sin 30° = 1/2. The point at 60 degrees, twice the angle, has height sin 60° ≈ 0.87. Twice the first height is 1, the top of the circle, shown by a dashed line. Doubling the angle doesn't double the height.</desc>
