<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Opposite, adjacent, and hypotenuse, and two similar right triangles</title>
  <desc>A right triangle with an acute angle θ at the left corner. The side across from θ is the opposite side, the leg next to θ is the adjacent side, and the longest side, across from the right angle, is the hypotenuse. A bigger right triangle with the same angle θ shares the corner. The two are similar, so opposite over hypotenuse is the same fraction in both.</desc>
  <polygon class="dg-box" points="60,300 620,300 620,60"/>
  <polygon class="dg-hot" points="60,300 380,300 380,162.9"/>
  <path class="dg-line" d="M608 300 V288 H620"/>
  <path class="dg-line" d="M368 300 V288 H380"/>
  <polyline class="dg-line" points="110,300 110,299 110,298 109.9,297 109.8,296 109.7,294.9 109.6,293.9 109.5,292.9 109.3,291.9 109.2,290.9 109,289.9 108.8,289 108.5,288 108.3,287 108,286 107.7,285 107.4,284.1 107.1,283.1 106.7,282.2 106.3,281.2 106,280.3"/>
  <text class="dg-on-hot" x="120" y="288" dy="0.35em" text-anchor="start">θ</text>
  <text class="dg-note" x="220" y="318" dy="0.35em" text-anchor="middle">adjacent</text>
  <text class="dg-note" x="392" y="230" dy="0.35em" text-anchor="start">opposite</text>
  <text class="dg-note" x="210" y="208" dy="0.35em" text-anchor="end">hypotenuse</text>
  <text class="dg-note" x="500" y="318" dy="0.35em" text-anchor="middle">the bigger triangle's adjacent</text>
  <text class="dg-note" x="632" y="180" dy="0.35em" text-anchor="start">opposite</text>
  <text class="dg-note" x="460" y="95" dy="0.35em" text-anchor="end">hypotenuse</text>
  <text class="dg-code" x="170" y="40" dy="0.35em" text-anchor="middle">sin θ = opposite / hypotenuse</text>
  <text class="dg-code" x="170" y="60" dy="0.35em" text-anchor="middle">cos θ = adjacent / hypotenuse</text>
  <text class="dg-code" x="170" y="80" dy="0.35em" text-anchor="middle">tan θ = opposite / adjacent</text>
</svg>
