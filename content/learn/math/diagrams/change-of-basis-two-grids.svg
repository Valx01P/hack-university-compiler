<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>One point, two coordinate grids</title>
  <desc>Left, the standard grid: the point x is 5 steps along (1, 0) and 1 step along (0, 1), so its standard coordinates are (5, 1). Right, the grid of the basis b1 = (1, 1) and b2 = (1, −1): the same point is 3 steps along b1 and 2 steps along b2, so its coordinates in that basis are (3, 2).</desc>
  <line class="dg-line" x1="34.4" y1="150" x2="226.8" y2="150" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="50" y1="217.6" x2="50" y2="56.4" marker-end="url(#arrow)"/>
  <text class="dg-note" x="224.8" y="164" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="62" y="60.4" dy="0.35em" text-anchor="middle">y</text>
  <line class="dg-line dg-dashed" x1="50" y1="202" x2="50" y2="72"/>
  <line class="dg-line dg-dashed" x1="76" y1="202" x2="76" y2="72"/>
  <line class="dg-line dg-dashed" x1="102" y1="202" x2="102" y2="72"/>
  <line class="dg-line dg-dashed" x1="128" y1="202" x2="128" y2="72"/>
  <line class="dg-line dg-dashed" x1="154" y1="202" x2="154" y2="72"/>
  <line class="dg-line dg-dashed" x1="180" y1="202" x2="180" y2="72"/>
  <line class="dg-line dg-dashed" x1="206" y1="202" x2="206" y2="72"/>
  <line class="dg-line dg-dashed" x1="50" y1="202" x2="206" y2="202"/>
  <line class="dg-line dg-dashed" x1="50" y1="176" x2="206" y2="176"/>
  <line class="dg-line dg-dashed" x1="50" y1="150" x2="206" y2="150"/>
  <line class="dg-line dg-dashed" x1="50" y1="124" x2="206" y2="124"/>
  <line class="dg-line dg-dashed" x1="50" y1="98" x2="206" y2="98"/>
  <line class="dg-line dg-dashed" x1="50" y1="72" x2="206" y2="72"/>
  <line class="dg-flow" x1="50" y1="150" x2="176.1" y2="150" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="180" y1="150" x2="180" y2="127.9" marker-end="url(#arrow-flow)"/>
  <circle class="dg-hot" cx="180" cy="124" r="5"/>
  <text class="dg-heading" x="187.8" y="112.3" dy="0.35em" text-anchor="start">x</text>
  <text class="dg-note" x="115" y="163" dy="0.35em" text-anchor="middle">5e₁</text>
  <text class="dg-note" x="187.8" y="138.3" dy="0.35em" text-anchor="start">1e₂</text>
  <text x="128" y="256" dy="0.35em" text-anchor="middle">standard: x = 5e₁ + 1e₂</text>
  <line class="dg-line" x1="374.4" y1="150" x2="566.8" y2="150" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="390" y1="217.6" x2="390" y2="56.4" marker-end="url(#arrow)"/>
  <text class="dg-note" x="564.8" y="164" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="402" y="60.4" dy="0.35em" text-anchor="middle">y</text>
  <line class="dg-line dg-dashed" x1="390" y1="150" x2="442" y2="202"/>
  <line class="dg-line dg-dashed" x1="416" y1="124" x2="468" y2="176"/>
