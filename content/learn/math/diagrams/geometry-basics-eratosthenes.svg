<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>Eratosthenes: parallel sun rays make the angle at the Earth's center 7.2°</title>
  <desc>Part of a circle stands for the Earth, with its center O. Syene is at the top, where the noon sun is straight overhead, so the sun's ray there points at O. Alexandria is 5000 stadia around the circle. Its sun ray is parallel to Syene's and makes 7.2° with Alexandria's vertical stick. The vertical line through Alexandria goes to O and is a transversal of the two parallel rays, so the alternate interior angle at O is also 7.2°.</desc>
  <path class="dg-line" d="M417.4 129.3 A250 250 0 0 0 139.3 158.5"/>
  <path class="dg-hot" d="M300 350 L300 270 A80 80 0 0 0 267.5 276.9 Z"/>
  <line class="dg-flow" x1="300" y1="20" x2="300" y2="350"/>
  <line class="dg-flow" x1="198.3" y1="20" x2="198.3" y2="121.6"/>
  <line class="dg-line" x1="300" y1="350" x2="169.8" y2="57.7"/>
  <circle class="dg-strong" cx="300" cy="100" r="5"/>
  <circle class="dg-strong" cx="198.3" cy="121.6" r="5"/>
  <text x="344" y="118" dy="0.35em" text-anchor="middle">Syene</text>
  <text x="146.3" y="143.6" dy="0.35em" text-anchor="middle">Alexandria</text>
  <path class="dg-line" d="M198.3 71.6 A50 50 0 0 0 178 75.9"/>
  <text x="186.2" y="52.7" dy="0.35em" text-anchor="middle">7.2°</text>
  <text x="281.9" y="247.6" dy="0.35em" text-anchor="middle">7.2°</text>
  <text class="dg-note" x="316" y="358" dy="0.35em" text-anchor="middle">O</text>
  <text class="dg-note" x="540" y="120" dy="0.35em" text-anchor="middle">sun rays are parallel</text>
  <text class="dg-code" x="540" y="150" dy="0.35em" text-anchor="middle">angle at O = 7.2°</text>
  <text class="dg-code" x="540" y="180" dy="0.35em" text-anchor="middle">7.2° is 1/50 of 360°</text>
  <text class="dg-code" x="540" y="210" dy="0.35em" text-anchor="middle">Earth ≈ 50 × 5000 stadia</text>
  <text class="dg-note" x="540" y="250" dy="0.35em" text-anchor="middle">angles drawn larger than 7.2°</text>
</svg>
