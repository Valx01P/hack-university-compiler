<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Every sample of 2 from 5 people, two of whom say yes, with each sample's proportion</title>
  <desc>Five people, two who say yes and three who say no. Below them are all ten samples of two. One sample holds both yes people and has a proportion of 1, six hold one yes and have 0.5, and three hold none and have 0. The ten proportions average to 0.4, the population's proportion.</desc>
  <circle class="dg-hot" cx="180" cy="44" r="20"/>
  <text class="dg-on-hot" x="180" y="44" dy="0.35em" text-anchor="middle">Y1</text>
  <circle class="dg-hot" cx="260" cy="44" r="20"/>
  <text class="dg-on-hot" x="260" y="44" dy="0.35em" text-anchor="middle">Y2</text>
  <circle class="dg-box" cx="340" cy="44" r="20"/>
  <text x="340" y="44" dy="0.35em" text-anchor="middle">N1</text>
  <circle class="dg-box" cx="420" cy="44" r="20"/>
  <text x="420" y="44" dy="0.35em" text-anchor="middle">N2</text>
  <circle class="dg-box" cx="500" cy="44" r="20"/>
  <text x="500" y="44" dy="0.35em" text-anchor="middle">N3</text>
  <rect class="dg-hot" x="30" y="100" width="116" height="48" rx="8"/>
  <text class="dg-code" x="88" y="116" dy="0.35em" text-anchor="middle">Y1 Y2</text>
  <text class="dg-on-hot" x="88" y="134" dy="0.35em" text-anchor="middle">p̂ = 1</text>
  <rect class="dg-box" x="158" y="100" width="116" height="48" rx="8"/>
  <text class="dg-code" x="216" y="116" dy="0.35em" text-anchor="middle">Y1 N1</text>
  <text class="dg-note" x="216" y="134" dy="0.35em" text-anchor="middle">p̂ = 0.5</text>
  <rect class="dg-box" x="286" y="100" width="116" height="48" rx="8"/>
  <text class="dg-code" x="344" y="116" dy="0.35em" text-anchor="middle">Y1 N2</text>
  <text class="dg-note" x="344" y="134" dy="0.35em" text-anchor="middle">p̂ = 0.5</text>
  <rect class="dg-box" x="414" y="100" width="116" height="48" rx="8"/>
  <text class="dg-code" x="472" y="116" dy="0.35em" text-anchor="middle">Y1 N3</text>
  <text class="dg-note" x="472" y="134" dy="0.35em" text-anchor="middle">p̂ = 0.5</text>
  <rect class="dg-box" x="542" y="100" width="116" height="48" rx="8"/>
  <text class="dg-code" x="600" y="116" dy="0.35em" text-anchor="middle">Y2 N1</text>
  <text class="dg-note" x="600" y="134" dy="0.35em" text-anchor="middle">p̂ = 0.5</text>
  <rect class="dg-box" x="30" y="164" width="116" height="48" rx="8"/>
  <text class="dg-code" x="88" y="180" dy="0.35em" text-anchor="middle">Y2 N2</text>
  <text class="dg-note" x="88" y="198" dy="0.35em" text-anchor="middle">p̂ = 0.5</text>
  <rect class="dg-box" x="158" y="164" width="116" height="48" rx="8"/>
  <text class="dg-code" x="216" y="180" dy="0.35em" text-anchor="middle">Y2 N3</text>
  <text class="dg-note" x="216" y="198" dy="0.35em" text-anchor="middle">p̂ = 0.5</text>
  <rect class="dg-box" x="286" y="164" width="116" height="48" rx="8"/>
  <text class="dg-code" x="344" y="180" dy="0.35em" text-anchor="middle">N1 N2</text>
  <text class="dg-note" x="344" y="198" dy="0.35em" text-anchor="middle">p̂ = 0</text>
  <rect class="dg-box" x="414" y="164" width="116" height="48" rx="8"/>
  <text class="dg-code" x="472" y="180" dy="0.35em" text-anchor="middle">N1 N3</text>
  <text class="dg-note" x="472" y="198" dy="0.35em" text-anchor="middle">p̂ = 0</text>
  <rect class="dg-box" x="542" y="164" width="116" height="48" rx="8"/>
  <text class="dg-code" x="600" y="180" dy="0.35em" text-anchor="middle">N2 N3</text>
  <text class="dg-note" x="600" y="198" dy="0.35em" text-anchor="middle">p̂ = 0</text>
  <text x="340" y="256" dy="0.35em" text-anchor="middle">average: (1 + 6 × 0.5 + 3 × 0) ÷ 10 = 0.4, the population's p</text>
</svg>
