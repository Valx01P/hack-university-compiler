<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>The graphs of sin 2x and 2 sin x meet only at multiples of π</title>
  <desc>The graphs of y = sin 2x and y = 2 sin x for x from 0 to 3π. They cross the x-axis together at 0, π, 2π, and 3π, where both equal 0, and those four points are marked. Everywhere else the curves differ, so a check that only tries multiples of π passes a false identity.</desc>
