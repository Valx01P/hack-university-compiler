<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>A parallelogram's area as base times height</title>
  <desc>The vectors u and v span a shaded parallelogram, with the angle θ between them. A dashed segment drops from the far corner straight down to the line of u, extended, which is the height, of length ‖v‖ sin θ. The base along u has length ‖u‖. So the area is ‖u‖ ‖v‖ sin θ, the length of u × v. A diagonal splits it into two equal triangles.</desc>
  <polygon class="dg-hot" points="110,230 440,230 550,54 220,54"/>
  <line class="dg-line" x1="220" y1="54" x2="440" y2="230"/>
  <line class="dg-flow" x1="110" y1="230" x2="437" y2="230" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="110" y1="230" x2="218.4" y2="56.5" marker-end="url(#arrow-flow)"/>
  <line class="dg-line dg-dashed" x1="440" y1="230" x2="550" y2="230"/>
  <line class="dg-line dg-dashed" x1="550" y1="54" x2="550" y2="230"/>
  <polyline class="dg-line" points="540,230 540,220 550,220"/>
  <path class="dg-line" d="M140 230 A30 30 0 0 0 125.9 204.6"/>
  <text x="151.2" y="206.9" dy="0.35em" text-anchor="middle">θ</text>
  <text x="275" y="248" dy="0.35em" text-anchor="middle">base ‖u‖</text>
  <text x="560" y="142" dy="0.35em" text-anchor="start">height ‖v‖ sin θ</text>
  <text x="450" y="240" dy="0.35em" text-anchor="start">u</text>
  <text x="214" y="42" dy="0.35em" text-anchor="end">v</text>
  <text class="dg-code" x="269.5" y="175" dy="0.35em" text-anchor="middle">area = ‖u × v‖</text>
</svg>
