<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>A spherical balloon of radius r being filled with air</title>
  <desc>A sphere of radius r, with a dashed equator and arrows pointing outward from its surface. Air goes in at 100 cubic centimeters per second, and the radius grows at a rate dr/dt. The volume is (4/3)πr³.</desc>
  <!-- the balloon, a sphere of radius r -->
  <circle class="dg-box" cx="220" cy="140" r="100"/>
  <ellipse class="dg-off" cx="220" cy="140" rx="100" ry="26"/>
  <line class="dg-flow" x1="220" y1="140" x2="320" y2="140"/>
  <circle class="dg-hot" cx="220" cy="140" r="4"/>
  <text x="270" y="124" dy="0.35em" text-anchor="middle">r</text>
  <!-- the surface pushed outward -->
  <line class="dg-line" x1="291" y1="69" x2="319" y2="41" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="149" y1="69" x2="121" y2="41" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="149" y1="211" x2="121" y2="239" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="291" y1="211" x2="319" y2="239" marker-end="url(#arrow)"/>
  <text x="390" y="110" dy="0.35em" text-anchor="start">air in at dV/dt = 100 cm³/s</text>
  <text x="390" y="140" dy="0.35em" text-anchor="start">radius grows at dr/dt</text>
  <text class="dg-note" x="390" y="176" dy="0.35em" text-anchor="start">V = (4/3)πr³</text>
</svg>
