<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A hemisphere and a cylinder with a cone removed have equal slices at every height</title>
  <desc>On the left, a hemisphere of radius r, flat side down. On the right, a cylinder of radius r and height r with a cone removed, the cone's point at the bottom center. A horizontal plane at height y cuts both. The hemisphere's slice is a circle of radius √(r² − y²), area π(r² − y²). The other slice is a ring between radius r and radius y, area πr² − πy². The areas match at every height, so the two solids have the same volume.</desc>
  <path class="dg-line" d="M40 250 A130 130 0 0 1 300 250"/>
  <path class="dg-line" d="M40 250 A130 26 0 0 0 300 250"/>
  <path class="dg-line dg-dashed" d="M40 250 A130 26 0 0 1 300 250"/>
  <ellipse class="dg-hot" cx="170" cy="180" rx="109.5" ry="21.9"/>
  <line class="dg-line dg-dashed" x1="170" y1="250" x2="170" y2="180"/>
  <text class="dg-heading" x="158" y="215" dy="0.35em" text-anchor="middle">y</text>
  <line class="dg-line" x1="170" y1="180" x2="279.5" y2="180"/>
  <text class="dg-note" x="224.8" y="146" dy="0.35em" text-anchor="middle">√(r² − y²)</text>
  <line class="dg-line" x1="224.8" y1="156" x2="224.8" y2="176"/>
  <text class="dg-code" x="170" y="290" dy="0.35em" text-anchor="middle">slice: π(r² − y²)</text>
  <path class="dg-line" d="M370 250 A130 26 0 0 0 630 250"/>
  <path class="dg-line dg-dashed" d="M370 250 A130 26 0 0 1 630 250"/>
  <line class="dg-line" x1="370" y1="250" x2="370" y2="120"/>
  <line class="dg-line" x1="630" y1="250" x2="630" y2="120"/>
  <ellipse class="dg-box" cx="500" cy="120" rx="130" ry="26"/>
  <line class="dg-line dg-dashed" x1="370" y1="120" x2="500" y2="250"/>
  <line class="dg-line dg-dashed" x1="630" y1="120" x2="500" y2="250"/>
  <path class="dg-hot" d="M370 180 A130 26 0 1 0 630 180 A130 26 0 1 0 370 180 M430 180 A70 14.0 0 1 1 570 180 A70 14.0 0 1 1 430 180 Z"/>
  <line class="dg-line" x1="500" y1="180" x2="570" y2="180"/>
  <text class="dg-heading" x="535" y="168" dy="0.35em" text-anchor="middle">y</text>
  <text class="dg-heading" x="644" y="180" dy="0.35em" text-anchor="middle">r</text>
  <text class="dg-code" x="500" y="290" dy="0.35em" text-anchor="middle">slice: πr² − πy²</text>
  <text class="dg-note" x="500" y="26" dy="0.35em" text-anchor="middle">cylinder minus cone</text>
  <text class="dg-note" x="170" y="26" dy="0.35em" text-anchor="middle">hemisphere</text>
</svg>
