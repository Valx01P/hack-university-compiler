<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>A times x as two copies of one column plus one of the other</title>
  <desc>In the plane, the columns a₁ = (2, 1) and a₂ = (1, 3) are drawn from the origin. The highlighted path takes 2a₁ to the point (4, 2), then adds a₂ to reach (5, 5). A dashed arrow from the origin to (5, 5) is the product A x for x = (2, 1).</desc>
  <line class="dg-line" x1="133" y1="320" x2="527.2" y2="320" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="160" y1="347" x2="160" y2="17.6" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="214" y1="317" x2="214" y2="323"/>
  <line class="dg-line" x1="268" y1="317" x2="268" y2="323"/>
  <line class="dg-line" x1="322" y1="317" x2="322" y2="323"/>
  <line class="dg-line" x1="376" y1="317" x2="376" y2="323"/>
  <line class="dg-line" x1="430" y1="317" x2="430" y2="323"/>
  <line class="dg-line" x1="484" y1="317" x2="484" y2="323"/>
  <line class="dg-line" x1="157" y1="266" x2="163" y2="266"/>
  <line class="dg-line" x1="157" y1="212" x2="163" y2="212"/>
  <line class="dg-line" x1="157" y1="158" x2="163" y2="158"/>
  <line class="dg-line" x1="157" y1="104" x2="163" y2="104"/>
  <line class="dg-line" x1="157" y1="50" x2="163" y2="50"/>
  <text class="dg-note" x="525.2" y="334" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="168" y="23.6" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-line" x1="160" y1="320" x2="265.3" y2="267.3" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="160" y1="320" x2="213.1" y2="160.8" marker-end="url(#arrow)"/>
  <line class="dg-flow" x1="160" y1="320" x2="373.3" y2="213.3" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="376" y1="212" x2="429.1" y2="52.8" marker-end="url(#arrow-flow)"/>
  <line class="dg-line dg-dashed" x1="160" y1="320" x2="427.9" y2="52.1" marker-end="url(#arrow)"/>
  <text class="dg-code" x="274" y="282" dy="0.35em" text-anchor="start">a₁ = (2, 1)</text>
  <text class="dg-code" x="206" y="150" dy="0.35em" text-anchor="end">a₂ = (1, 3)</text>
  <text class="dg-code" x="384" y="226" dy="0.35em" text-anchor="start">2a₁ = (4, 2)</text>
  <text class="dg-code" x="440" y="50" dy="0.35em" text-anchor="start">2a₁ + a₂ = (5, 5)</text>
  <text x="413" y="131" dy="0.35em" text-anchor="start">+ a₂</text>
</svg>
