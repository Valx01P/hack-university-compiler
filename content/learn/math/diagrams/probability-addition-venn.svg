<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Two overlapping events A and B inside the sample space S</title>
  <desc>A rectangle labeled S holds two overlapping circles, A on the left and B on the right. Their overlap, A ∩ B, is shaded. It lies inside both circles, so adding P(A) and P(B) counts it twice, and the addition rule subtracts it once.</desc>
  <rect class="dg-frame" x="20" y="20" width="640" height="260" rx="12"/>
  <text class="dg-heading" x="44" y="48" dy="0.35em">S</text>
  <!-- The overlap, shaded as one shape. -->
  <path class="dg-hot" d="M340 75.15 A110 110 0 0 1 340 244.85 A110 110 0 0 1 340 75.15 Z"/>
  <!-- The two events, outlines only. -->
  <path class="dg-line" d="M160 160 A110 110 0 1 1 380 160 A110 110 0 1 1 160 160 Z"/>
  <path class="dg-line" d="M300 160 A110 110 0 1 1 520 160 A110 110 0 1 1 300 160 Z"/>
  <text class="dg-heading" x="160" y="70" dy="0.35em" text-anchor="middle">A</text>
  <text class="dg-heading" x="520" y="70" dy="0.35em" text-anchor="middle">B</text>
  <text x="230" y="160" dy="0.35em" text-anchor="middle">only A</text>
  <text x="450" y="160" dy="0.35em" text-anchor="middle">only B</text>
  <text class="dg-on-hot dg-code" x="340" y="160" dy="0.35em" text-anchor="middle">A ∩ B</text>
</svg>
