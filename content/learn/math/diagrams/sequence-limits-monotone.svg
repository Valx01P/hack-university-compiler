<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>The increasing terms of (1 + 1/n)ⁿ climb toward e, below the bound 3</title>
  <desc>Dots show (1 + 1/n)ⁿ for n from 1 to 24: 2, 2.25, 2.37, 2.44, and on, each higher than the one before. A dashed line at 3 is an upper bound the terms never pass, and they level off toward the line at e, about 2.718, the limit the monotone convergence theorem promises.</desc>
  <line class="dg-line" x1="64" y1="240" x2="644" y2="240" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="70" y1="246" x2="70" y2="16" marker-end="url(#arrow)"/>
  <text class="dg-note" x="652" y="240" dy="0.35em" text-anchor="start">n</text>
  <line class="dg-line" x1="182" y1="236" x2="182" y2="244"/>
  <text class="dg-note" x="182" y="256" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="294" y1="236" x2="294" y2="244"/>
  <text class="dg-note" x="294" y="256" dy="0.35em" text-anchor="middle">10</text>
  <line class="dg-line" x1="406" y1="236" x2="406" y2="244"/>
  <text class="dg-note" x="406" y="256" dy="0.35em" text-anchor="middle">15</text>
  <line class="dg-line" x1="518" y1="236" x2="518" y2="244"/>
  <text class="dg-note" x="518" y="256" dy="0.35em" text-anchor="middle">20</text>
  <line class="dg-line" x1="66" y1="207.7" x2="74" y2="207.7"/>
  <text class="dg-note" x="62" y="207.7" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="66" y1="126.9" x2="74" y2="126.9"/>
  <text class="dg-note" x="62" y="126.9" dy="0.35em" text-anchor="end">2.5</text>
  <line class="dg-line" x1="66" y1="46.2" x2="74" y2="46.2"/>
  <text class="dg-note" x="62" y="46.2" dy="0.35em" text-anchor="end">3</text>
  <line class="dg-line dg-dashed" x1="70" y1="46.2" x2="630" y2="46.2"/>
  <line class="dg-flow dg-dashed" x1="70" y1="91.7" x2="630" y2="91.7"/>
  <circle class="dg-hot" cx="92.4" cy="207.7" r="3.5"/>
  <circle class="dg-hot" cx="114.8" cy="167.3" r="3.5"/>
  <circle class="dg-hot" cx="137.2" cy="147.9" r="3.5"/>
  <circle class="dg-hot" cx="159.6" cy="136.4" r="3.5"/>
  <circle class="dg-hot" cx="182" cy="128.8" r="3.5"/>
  <circle class="dg-hot" cx="204.4" cy="123.4" r="3.5"/>
  <circle class="dg-hot" cx="226.8" cy="119.4" r="3.5"/>
  <circle class="dg-hot" cx="249.2" cy="116.3" r="3.5"/>
  <circle class="dg-hot" cx="271.6" cy="113.8" r="3.5"/>
  <circle class="dg-hot" cx="294" cy="111.8" r="3.5"/>
  <circle class="dg-hot" cx="316.4" cy="110.1" r="3.5"/>
  <circle class="dg-hot" cx="338.8" cy="108.7" r="3.5"/>
  <circle class="dg-hot" cx="361.2" cy="107.4" r="3.5"/>
  <circle class="dg-hot" cx="383.6" cy="106.4" r="3.5"/>
  <circle class="dg-hot" cx="406" cy="105.5" r="3.5"/>
  <circle class="dg-hot" cx="428.4" cy="104.6" r="3.5"/>
  <circle class="dg-hot" cx="450.8" cy="103.9" r="3.5"/>
  <circle class="dg-hot" cx="473.2" cy="103.3" r="3.5"/>
  <circle class="dg-hot" cx="495.6" cy="102.7" r="3.5"/>
  <circle class="dg-hot" cx="518" cy="102.2" r="3.5"/>
  <circle class="dg-hot" cx="540.4" cy="101.7" r="3.5"/>
  <circle class="dg-hot" cx="562.8" cy="101.2" r="3.5"/>
  <circle class="dg-hot" cx="585.2" cy="100.8" r="3.5"/>
  <circle class="dg-hot" cx="607.6" cy="100.5" r="3.5"/>
  <text class="dg-note" x="621" y="36.2" dy="0.35em" text-anchor="end">upper bound 3</text>
  <text class="dg-note" x="92.4" y="81.7" dy="0.35em" text-anchor="start">e ≈ 2.718</text>
</svg>
