<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>The two solutions of sin θ = 1/2 on the unit circle</title>
  <desc>The unit circle with the dashed horizontal line y = 1/2. The line meets the circle at two points, one at angle π/6 in quadrant I and one at angle 5π/6 in quadrant II. They are mirror images across the y-axis, so their angles are α and π − α, the two solutions in one turn.</desc>
  <!-- Axes and the unit circle -->
  <line class="dg-line" x1="200" y1="150" x2="490" y2="150" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="275" x2="340" y2="20" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M440 150 A100 100 0 1 0 240 150 A100 100 0 1 0 440 150"/>
  <!-- The line y = 1/2 -->
  <line class="dg-line dg-dashed" x1="190" y1="100" x2="490" y2="100"/>
  <text class="dg-code" x="496" y="100" dy="0.35em">y = 1/2</text>
  <!-- The two solutions -->
  <line class="dg-flow" x1="340" y1="150" x2="426.6" y2="100"/>
  <line class="dg-flow" x1="340" y1="150" x2="253.4" y2="100"/>
  <circle class="dg-hot" cx="426.6" cy="100" r="6"/>
  <circle class="dg-hot" cx="253.4" cy="100" r="6"/>
  <text x="438.6" y="80" dy="0.35em">π/6</text>
  <text x="241.4" y="80" dy="0.35em" text-anchor="end">5π/6</text>
  <path class="dg-line" d="M372 150 A32 32 0 0 0 367.7 134"/>
  <path class="dg-line" d="M360 150 A20 20 0 0 0 322.7 140"/>
  <text class="dg-note" x="340" y="288" dy="0.35em" text-anchor="middle">mirror images across the y-axis: α and π − α</text>
</svg>
