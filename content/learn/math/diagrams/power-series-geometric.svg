<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>Partial sums of the geometric series against 1/(1 − x)</title>
  <desc>The curve y = 1/(1 − x) and four partial sums of 1 + x + x² + and so on: 1 + x, then the sums up to x², x⁵, and x¹⁰. Between the dashed lines x = −1 and x = 1 the higher partial sums lie closer and closer to the curve. Left of x = −1 they swing away, up for even powers and down for odd ones.</desc>
