  <title>A full sketch of x⁴ − 4x²</title>
  <desc>The graph of x⁴ − 4x² is a W shape, symmetric about the y-axis. It crosses the x-axis at −2 and 2, touches it at the local maximum (0, 0), has local minimums at (−√2, −4) and (√2, −4), and changes concavity at the two inflection points x = ±√6/3, where y = −20/9.</desc>
