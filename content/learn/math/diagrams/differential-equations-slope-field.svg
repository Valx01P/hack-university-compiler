<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>The slope field of y′ = x − y, a solution curve, and Euler's steps</title>
  <desc>Short segments show the slope x − y at each point of a grid. The highlighted curve is the solution through (0, 1), y = x − 1 + 2e^(−x), which follows the segments. A dashed broken line from (0, 1) takes Euler steps of size 0.5 to (0.5, 0.5), (1, 0.5), and (1.5, 0.75), staying below the true curve. Along the line y = x − 1 every segment has slope 1, so that line is itself a solution.</desc>
