<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <title>Scaling the vector v = (2, 1)</title>
  <desc>Four arrows drawn side by side. v = (2, 1) goes right 2 and up 1. 2v = (4, 2) points the same way and is twice as long. Half of v, (1, ½), is half as long. −v = (−2, −1) has the same length as v but points the opposite way, down and to the left.</desc>
  <!-- a baseline grid of starting points -->
  <line class="dg-line" x1="168.6" y1="132.9" x2="254.3" y2="90" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="168.6" cy="132.9" r="3"/>
  <text x="203.4" y="105.5" dy="0.35em" text-anchor="end">v</text>
  <line class="dg-flow" x1="280" y1="132.9" x2="451.4" y2="47.1" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="280" cy="132.9" r="3"/>
  <text x="357.7" y="84" dy="0.35em" text-anchor="end">2v</text>
  <line class="dg-line" x1="477.1" y1="132.9" x2="520" y2="111.5" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="477.1" cy="132.9" r="3"/>
  <text x="490.6" y="116.2" dy="0.35em" text-anchor="end">½v</text>
  <line class="dg-line" x1="622.9" y1="90" x2="537.1" y2="132.9" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="622.9" cy="90" r="3"/>
  <text x="572" y="105.5" dy="0.35em" text-anchor="end">−v</text>
  <text class="dg-note" x="211.4" y="156.9" dy="0.35em" text-anchor="middle">(2, 1)</text>
  <text class="dg-note" x="365.7" y="156.9" dy="0.35em" text-anchor="middle">(4, 2)</text>
  <text class="dg-note" x="498.6" y="156.9" dy="0.35em" text-anchor="middle">(1, ½)</text>
  <text class="dg-note" x="580" y="156.9" dy="0.35em" text-anchor="middle">(−2, −1)</text>
</svg>
