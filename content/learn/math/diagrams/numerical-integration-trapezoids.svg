  <line class="dg-line" x1="323.5" y1="300" x2="323.5" y2="87.3"/>
  <line class="dg-line" x1="433.7" y1="300" x2="433.7" y2="145.1"/>
  <line class="dg-line" x1="60" y1="300" x2="624" y2="300" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="103.1" y1="310" x2="103.1" y2="16" marker-end="url(#arrow)"/>
  <text class="dg-note" x="632" y="300" dy="0.35em">x</text>
  <text class="dg-note" x="103.1" y="8" text-anchor="middle">y</text>
  <line class="dg-line" x1="103.1" y1="295" x2="103.1" y2="305"/>
  <text class="dg-note" x="103.1" y="318" dy="0.35em" text-anchor="middle">x₀</text>
