  <text class="dg-note" x="213.3" y="318" dy="0.35em" text-anchor="middle">x₁</text>
  <line class="dg-line" x1="323.5" y1="295" x2="323.5" y2="305"/>
  <text class="dg-note" x="323.5" y="318" dy="0.35em" text-anchor="middle">x₂</text>
  <line class="dg-line" x1="433.7" y1="295" x2="433.7" y2="305"/>
  <text class="dg-note" x="433.7" y="318" dy="0.35em" text-anchor="middle">x₃</text>
  <line class="dg-line" x1="543.9" y1="295" x2="543.9" y2="305"/>
  <text class="dg-note" x="543.9" y="318" dy="0.35em" text-anchor="middle">x₄</text>
