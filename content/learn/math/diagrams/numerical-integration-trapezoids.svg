<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The trapezoid rule with four strips under a curve</title>
  <desc>The interval from x₀ to x₄ is cut into four strips of width Δx. In each strip a straight chord joins the two points on the curve, making a trapezoid whose area is Δx times the average of its two heights. The four trapezoids together are shaded. Where the curve bends, the chords miss it slightly, which is the rule's error.</desc>
