<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Reflecting across the x-axis and then across y = x turns a point a quarter turn</title>
  <desc>The x-axis and the dashed line y = x cross at the origin, 45 degrees apart. The point P = (3, 1) reflects across the x-axis to P′ = (3, −1), then across y = x to P″ = (−1, 3). A dashed arc through P and P″ shows they are the same distance from the origin, a quarter turn apart, twice the 45 degrees between the two lines.</desc>
  <line class="dg-line" x1="153" y1="200" x2="489" y2="200" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="300" y1="305" x2="300" y2="53" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="174" y1="197" x2="174" y2="203"/>
  <line class="dg-line" x1="216" y1="197" x2="216" y2="203"/>
  <line class="dg-line" x1="258" y1="197" x2="258" y2="203"/>
  <line class="dg-line" x1="342" y1="197" x2="342" y2="203"/>
  <line class="dg-line" x1="384" y1="197" x2="384" y2="203"/>
  <line class="dg-line" x1="426" y1="197" x2="426" y2="203"/>
  <line class="dg-line" x1="468" y1="197" x2="468" y2="203"/>
  <line class="dg-line" x1="297" y1="284" x2="303" y2="284"/>
  <line class="dg-line" x1="297" y1="242" x2="303" y2="242"/>
  <line class="dg-line" x1="297" y1="158" x2="303" y2="158"/>
  <line class="dg-line" x1="297" y1="116" x2="303" y2="116"/>
  <line class="dg-line" x1="297" y1="74" x2="303" y2="74"/>
  <line class="dg-line dg-dashed" x1="195" y1="305" x2="447" y2="53"/>
  <line class="dg-flow" x1="426" y1="158" x2="426" y2="236" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="426" y1="242" x2="262.2" y2="78.2" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M426 158 A132.8 132.8 0 0 0 258 74"/>
  <circle class="dg-strong" cx="426" cy="158" r="4"/>
  <text class="dg-code" x="436" y="152" dy="0.35em" text-anchor="start">P (3, 1)</text>
  <circle class="dg-strong" cx="426" cy="242" r="4"/>
  <text class="dg-code" x="436" y="248" dy="0.35em" text-anchor="start">P′ (3, −1)</text>
  <circle class="dg-strong" cx="258" cy="74" r="4"/>
  <text class="dg-code" x="248" y="68" dy="0.35em" text-anchor="end">P″ (−1, 3)</text>
  <text class="dg-note" x="453" y="53" dy="0.35em" text-anchor="start">y = x</text>
  <text class="dg-note" x="350.4" y="103.4" dy="0.35em" text-anchor="middle">90°</text>
  <text class="dg-note" x="20" y="30" dy="0.35em" text-anchor="start">1. across the x-axis: P to P′</text>
  <text class="dg-note" x="20" y="50" dy="0.35em" text-anchor="start">2. across y = x: P′ to P″</text>
</svg>
