<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <title>The function f(x) = x² − 3x turning inputs into outputs</title>
  <desc>Three inputs go into one box labeled f(x) = x² − 3x. The input −2 comes out as 10, the input 0 as 0, and the input 3 as 0. Each input gets exactly one output, and two different inputs, 0 and 3, may share an output.</desc>
  <rect class="dg-strong" x="250" y="40" width="180" height="160" rx="12"/>
  <text class="dg-heading" x="340" y="110" dy="0.35em" text-anchor="middle">f(x) = x² − 3x</text>
  <text class="dg-note" x="340" y="134" dy="0.35em" text-anchor="middle">square it, subtract 3 times it</text>
  <text class="dg-code" x="120" y="70" dy="0.35em" text-anchor="end">−2</text>
  <line class="dg-line" x1="132" y1="70" x2="246" y2="70" marker-end="url(#arrow)"/>
  <text class="dg-code" x="560" y="70" dy="0.35em" text-anchor="start">10</text>
  <line class="dg-flow" x1="434" y1="70" x2="548" y2="70" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="120" y="120" dy="0.35em" text-anchor="end">0</text>
  <line class="dg-line" x1="132" y1="120" x2="246" y2="120" marker-end="url(#arrow)"/>
  <text class="dg-code" x="560" y="120" dy="0.35em" text-anchor="start">0</text>
  <line class="dg-flow" x1="434" y1="120" x2="548" y2="120" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="120" y="170" dy="0.35em" text-anchor="end">3</text>
  <line class="dg-line" x1="132" y1="170" x2="246" y2="170" marker-end="url(#arrow)"/>
  <text class="dg-code" x="560" y="170" dy="0.35em" text-anchor="start">0</text>
  <line class="dg-flow" x1="434" y1="170" x2="548" y2="170" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="100" y="24" dy="0.35em" text-anchor="middle">input x</text>
  <text class="dg-note" x="580" y="24" dy="0.35em" text-anchor="middle">output f(x)</text>
</svg>
