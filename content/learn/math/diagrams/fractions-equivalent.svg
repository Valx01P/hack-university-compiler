<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220">
  <title>2/3 and 4/6 cover the same part of a whole</title>
  <desc>Two bars of the same length. The top bar is cut into 3 equal parts with 2 highlighted, 2/3. The bottom bar is cut into 6 equal parts with 4 highlighted, 4/6. The highlighted lengths end at the same place, marked by a dashed line, because cutting each third into 2 pieces turns 2 thirds into 4 sixths.</desc>
  <rect class="dg-box" x="120" y="40" width="480" height="48"/>
  <rect class="dg-hot" x="120" y="40" width="320" height="48"/>
  <line class="dg-line" x1="280" y1="40" x2="280" y2="88"/>
  <line class="dg-line" x1="440" y1="40" x2="440" y2="88"/>
  <text class="dg-heading" x="90" y="64" dy="0.35em" text-anchor="middle">2/3</text>
  <rect class="dg-box" x="120" y="130" width="480" height="48"/>
  <rect class="dg-hot" x="120" y="130" width="320" height="48"/>
  <line class="dg-line" x1="200" y1="130" x2="200" y2="178"/>
  <line class="dg-line" x1="280" y1="130" x2="280" y2="178"/>
  <line class="dg-line" x1="360" y1="130" x2="360" y2="178"/>
  <line class="dg-line" x1="440" y1="130" x2="440" y2="178"/>
  <line class="dg-line" x1="520" y1="130" x2="520" y2="178"/>
  <text class="dg-heading" x="90" y="154" dy="0.35em" text-anchor="middle">4/6</text>
  <line class="dg-flow dg-dashed" x1="440" y1="24" x2="440" y2="194"/>
  <text class="dg-note" x="448" y="204" dy="0.35em">same amount</text>
</svg>
