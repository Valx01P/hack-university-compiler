<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <title>Three quarters as parts of a whole and as a point on the number line</title>
  <desc>A bar cut into 4 equal parts with the first 3 highlighted, labeled 3/4 of the whole. Below it, a number line from 0 to 1 marked in quarters, with an arrow from 0 to the point 3/4, three quarter steps from 0.</desc>
  <rect class="dg-box" x="60" y="40" width="560" height="56"/>
  <rect class="dg-hot" x="60" y="40" width="420" height="56"/>
  <line class="dg-line" x1="200" y1="40" x2="200" y2="96"/>
  <line class="dg-line" x1="340" y1="40" x2="340" y2="96"/>
  <line class="dg-line" x1="480" y1="40" x2="480" y2="96"/>
  <text class="dg-on-hot" x="130" y="68" dy="0.35em" text-anchor="middle">1/4</text>
  <text class="dg-on-hot" x="270" y="68" dy="0.35em" text-anchor="middle">1/4</text>
  <text class="dg-on-hot" x="410" y="68" dy="0.35em" text-anchor="middle">1/4</text>
  <text x="550" y="68" dy="0.35em" text-anchor="middle">1/4</text>
  <text class="dg-heading" x="270" y="20" dy="0.35em" text-anchor="middle">3 of 4 parts: 3/4</text>
  <line class="dg-line" x1="60" y1="170" x2="650" y2="170" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="60" y1="162" x2="60" y2="178"/>
  <text x="60" y="200" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line" x1="200" y1="162" x2="200" y2="178"/>
  <text x="200" y="200" dy="0.35em" text-anchor="middle">1/4</text>
  <line class="dg-line" x1="340" y1="162" x2="340" y2="178"/>
  <text x="340" y="200" dy="0.35em" text-anchor="middle">2/4</text>
  <line class="dg-line" x1="480" y1="162" x2="480" y2="178"/>
  <text x="480" y="200" dy="0.35em" text-anchor="middle">3/4</text>
  <line class="dg-line" x1="620" y1="162" x2="620" y2="178"/>
  <text x="620" y="200" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-flow" x1="60" y1="148" x2="476" y2="148" marker-end="url(#arrow-flow)"/>
  <circle class="dg-hot" cx="480" cy="170" r="7"/>
</svg>
