<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The four fundamental subspaces of an m by n matrix of rank r</title>
  <desc>On the left, inside R n, the row space of dimension r and the null space of dimension n minus r meet only at zero. On the right, inside R m, the column space of dimension r and the left null space of dimension m minus r meet only at zero. The matrix A sends every vector of R n into the column space, and the null space to zero.</desc>
  <rect class="dg-frame" x="20" y="40" width="260" height="270" rx="12"/>
  <text class="dg-heading" x="150" y="22" dy="0.35em" text-anchor="middle">Rⁿ, where x lives</text>
  <rect class="dg-hot" x="40" y="70" width="220" height="90" rx="8"/>
  <text class="dg-on-hot" x="150" y="102" dy="0.35em" text-anchor="middle">row space C(Aᵀ)</text>
  <text class="dg-on-hot" x="150" y="128" dy="0.35em" text-anchor="middle">dimension r</text>
  <rect class="dg-box" x="40" y="190" width="220" height="90" rx="8"/>
  <text x="150" y="222" dy="0.35em" text-anchor="middle">null space N(A)</text>
  <text class="dg-note" x="150" y="248" dy="0.35em" text-anchor="middle">dimension n − r</text>
  <rect class="dg-frame" x="400" y="40" width="260" height="270" rx="12"/>
  <text class="dg-heading" x="530" y="22" dy="0.35em" text-anchor="middle">Rᵐ, where Ax lives</text>
  <rect class="dg-hot" x="420" y="70" width="220" height="90" rx="8"/>
  <text class="dg-on-hot" x="530" y="102" dy="0.35em" text-anchor="middle">column space C(A)</text>
  <text class="dg-on-hot" x="530" y="128" dy="0.35em" text-anchor="middle">dimension r</text>
  <rect class="dg-box" x="420" y="190" width="220" height="90" rx="8"/>
  <text x="530" y="222" dy="0.35em" text-anchor="middle">left null space N(Aᵀ)</text>
  <text class="dg-note" x="530" y="248" dy="0.35em" text-anchor="middle">dimension m − r</text>
  <path class="dg-flow" d="M260 115 H416" marker-end="url(#arrow-flow)"/>
  <text class="dg-heading" x="338" y="100" dy="0.35em" text-anchor="middle">A</text>
  <path class="dg-line dg-dashed" d="M260 235 H330 V175 H520" marker-end="url(#arrow)"/>
  <text class="dg-note" x="338" y="252" dy="0.35em" text-anchor="middle">A sends it to 0</text>
  <circle class="dg-strong" cx="530" cy="175" r="5"/>
  <text class="dg-note" x="544" y="175" dy="0.35em" text-anchor="start">0</text>
</svg>
