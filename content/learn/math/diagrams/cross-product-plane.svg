<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A plane, a normal vector, and an arrow lying in the plane</title>
  <desc>A shaded parallelogram stands for a flat plane seen at a slant. The point P is on it, and the normal vector n rises from P at right angles to the plane. Another point X of the plane is joined to P by the arrow X − P, which lies flat in the plane, so it meets n at a right angle and n · (X − P) = 0.</desc>
  <polygon class="dg-hot" points="46.4,271 436.4,271 587.5,176.6 197.5,176.6"/>
  <line class="dg-line" x1="258.8" y1="239.5" x2="473.8" y2="205" marker-end="url(#arrow)"/>
  <line class="dg-flow" x1="258.8" y1="239.5" x2="258.8" y2="74.5" marker-end="url(#arrow-flow)"/>
  <polyline class="dg-line" points="269.7,237.8 269.7,226.8 258.8,228.5"/>
  <circle class="dg-strong" cx="258.8" cy="239.5" r="3.5"/>
  <circle class="dg-strong" cx="476.8" cy="204.5" r="3.5"/>
  <text x="248.8" y="247.5" dy="0.35em" text-anchor="end">P</text>
  <text x="486.8" y="210.5" dy="0.35em" text-anchor="start">X</text>
  <text x="373.8" y="238" dy="0.35em" text-anchor="start">X − P</text>
  <text x="270.8" y="71.5" dy="0.35em" text-anchor="start">n</text>
  <text class="dg-note" x="76.4" y="257" dy="0.35em" text-anchor="start">the plane</text>
</svg>
