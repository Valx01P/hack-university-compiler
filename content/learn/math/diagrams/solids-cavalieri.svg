  <text class="dg-code" x="170" y="290" dy="0.35em" text-anchor="middle">straight: V = Bh</text>
  <text class="dg-code" x="490" y="290" dy="0.35em" text-anchor="middle">leaning: the same slices, V = Bh</text>
