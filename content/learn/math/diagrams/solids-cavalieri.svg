<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Cavalieri's principle: a straight stack and a leaning stack of the same coins</title>
  <desc>Two stacks of 10 identical coins, each the same height h. The left stack is straight. The right stack is pushed sideways so it leans, and its side edge is longer than h. At every height, a slice through either stack is one coin of the same area, so the two stacks have the same volume. That is Cavalieri's principle, and it is why a leaning cylinder or prism still has V = Bh, with h the straight-up height.</desc>
  <path class="dg-line" d="M100 260 A70 16 0 0 0 240 260"/>
  <line class="dg-line" x1="100" y1="260" x2="100" y2="242"/>
  <line class="dg-line" x1="240" y1="260" x2="240" y2="242"/>
  <path class="dg-line" d="M100 242 A70 16 0 0 0 240 242"/>
  <line class="dg-line" x1="100" y1="242" x2="100" y2="224"/>
  <line class="dg-line" x1="240" y1="242" x2="240" y2="224"/>
