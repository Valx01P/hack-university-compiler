<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The right triangle with legs 1 and tan θ and hypotenuse sec θ</title>
  <desc>A unit circle and the vertical tangent line x = 1. The ray at angle θ meets the circle at (cos θ, sin θ) and the tangent line at the height tan θ. The shaded right triangle has legs 1 and tan θ and hypotenuse sec θ, so the Pythagorean theorem gives 1 + tan²θ = sec²θ. Inside it, the smaller triangle with legs cos θ and sin θ and hypotenuse 1 is similar.</desc>
