<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>The altitude that proves the law of sines</title>
  <desc>A triangle with corners A and B along the bottom and C at the top. Side a is across from A, side b across from B, and side c along the bottom. The highlighted altitude h drops from C to side c at a right angle. In the left right triangle h = b sin A, and in the right one h = a sin B, so b sin A = a sin B.</desc>
  <!-- The triangle -->
  <polygon class="dg-box" points="100,240 580,240 250,60"/>
  <!-- The altitude and its right angle -->
  <line class="dg-flow" x1="250" y1="60" x2="250" y2="240"/>
  <path class="dg-line" d="M250 226 H264 V240"/>
  <text x="260" y="150" dy="0.35em">h</text>
  <!-- Corners -->
  <text class="dg-heading" x="86" y="246" dy="0.35em" text-anchor="end">A</text>
  <text class="dg-heading" x="594" y="246" dy="0.35em">B</text>
  <text class="dg-heading" x="250" y="42" dy="0.35em" text-anchor="middle">C</text>
  <!-- Sides, each named for the angle across from it -->
  <text x="159.0" y="150.0" dy="0.35em" text-anchor="end">b</text>
  <text x="429.0" y="142.0" dy="0.35em">a</text>
  <text x="420" y="260" dy="0.35em" text-anchor="middle">c</text>
  <!-- Angle marks at A and B -->
  <path class="dg-line" d="M134 240 A34 34 0 0 0 121.8 213.9"/>
  <path class="dg-line" d="M540 240 A40 40 0 0 1 544.9 220.8"/>
  <text class="dg-code" x="470" y="70" text-anchor="middle">h = b sin A</text>
  <text class="dg-code" x="470" y="92" text-anchor="middle">h = a sin B</text>
</svg>
