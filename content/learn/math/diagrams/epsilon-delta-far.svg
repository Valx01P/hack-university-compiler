<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>The epsilon-N picture: past the cutoff N the graph stays in the band</title>
  <desc>The graph of (2x + 1)/x falls toward its horizontal asymptote y = 2. A band runs from 2 − ε to 2 + ε around the dashed line y = 2. A dashed vertical line marks the cutoff N. To the right of N the band is outlined as a box, and the highlighted curve stays inside it for every x greater than N.</desc>
