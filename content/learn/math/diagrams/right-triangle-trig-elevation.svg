<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>An angle of elevation, and an equal angle of depression</title>
  <desc>Left: an observer on level ground 30 m from a tree looks up at its top. The angle between the horizontal and the line of sight is the angle of elevation, 40°, and the height is 30 tan 40°. Right: from the top of a lighthouse, the line of sight down to a boat makes a 12° angle of depression below the horizontal. The angle of elevation from the boat up to the top is also 12°, since the two horizontals are parallel.</desc>
