<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The cross product stands at right angles to u and v</title>
  <desc>The vectors u and v lie flat and span a shaded parallelogram. The cross product u × v rises straight up from their common starting point, at right angles to both. A curved arrow turns from u toward v, the way the fingers of a right hand curl, and the thumb then points along u × v. The reversed product v × u points straight down, a dashed arrow.</desc>
  <polygon class="dg-hot" points="250,220 448.4,220 572.4,165.8 374,165.8"/>
  <line class="dg-flow" x1="250" y1="220" x2="445.4" y2="220" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="250" y1="220" x2="371.2" y2="167" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="250" y1="220" x2="250" y2="68" marker-end="url(#arrow-flow)"/>
  <line class="dg-line dg-dashed" x1="250" y1="220" x2="250" y2="334.8" marker-end="url(#arrow)"/>
  <polyline class="dg-line" points="261,220 261,209 250,209"/>
  <path class="dg-line" d="M361.2 215.7 L363.8 213 L365.5 210.3 L366.3 207.7 L366 205.2 L364.9 202.8 L362.8 200.6 L359.7 198.5 L355.8 196.6 L350.9 194.9 L345.3 193.4 L338.8 192.1 L331.7 191.1" marker-end="url(#arrow)"/>
  <text x="460.4" y="226" dy="0.35em" text-anchor="start">u</text>
  <text x="364" y="159.8" dy="0.35em" text-anchor="end">v</text>
  <text x="260" y="63" dy="0.35em" text-anchor="start">u × v</text>
  <text x="260" y="337.8" dy="0.35em" text-anchor="start">v × u = −(u × v)</text>
  <text class="dg-note" x="349.2" y="242" dy="0.35em" text-anchor="middle">fingers curl from u to v</text>
  <circle class="dg-strong" cx="250" cy="220" r="3"/>
</svg>
