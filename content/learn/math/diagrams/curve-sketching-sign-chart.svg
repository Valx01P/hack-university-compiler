  <title>The graph of x³ − 3x above the sign chart of its derivative</title>
  <desc>The curve y = x³ − 3x rises to a local maximum at (−1, 2), falls to a local minimum at (1, −2), then rises again. Under it, a sign chart for f′(x) = 3(x − 1)(x + 1) shows plus left of −1, minus between −1 and 1, and plus right of 1, matching rising, falling, rising.</desc>
