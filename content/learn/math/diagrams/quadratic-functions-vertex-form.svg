<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>Three parabolas: y = x², y = 2(x − 3)² + 1, and y = −(x + 2)² + 5</title>
  <desc>Axes from x = −6 to 7. The plain parabola y = x² has its vertex at the origin. y = 2(x − 3)² + 1 is narrower, opens up, and has its vertex at (3, 1), with a dashed axis of symmetry x = 3 and the mirror points (2, 3) and (4, 3) at the same height. y = −(x + 2)² + 5 opens down from its vertex at (−2, 5).</desc>
