<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>The length of the vector (3, 4)</title>
  <desc>The arrow from the origin to (3, 4) is the hypotenuse of a right triangle. Its legs run 3 along the x-axis and 4 straight up, with a right angle at (3, 0). By the Pythagorean theorem its length is the square root of 9 plus 16, which is 5.</desc>
  <!-- Axes -->
  <line class="dg-line" x1="182" y1="302.7" x2="500" y2="302.7" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="223.3" y1="344" x2="223.3" y2="26" marker-end="url(#arrow)"/>
  <text class="dg-note" x="508" y="302.7" dy="0.35em">x</text>
  <text class="dg-note" x="223.3" y="18" text-anchor="middle">y</text>
  <line class="dg-line" x1="278.9" y1="297.7" x2="278.9" y2="307.7"/>
  <text class="dg-note" x="278.9" y="320.7" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="334.4" y1="297.7" x2="334.4" y2="307.7"/>
  <text class="dg-note" x="334.4" y="320.7" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="390" y1="297.7" x2="390" y2="307.7"/>
  <text class="dg-note" x="390" y="320.7" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="445.6" y1="297.7" x2="445.6" y2="307.7"/>
  <text class="dg-note" x="445.6" y="320.7" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="218.3" y1="247.1" x2="228.3" y2="247.1"/>
  <text class="dg-note" x="213.3" y="247.1" dy="0.35em" text-anchor="end">1</text>
  <line class="dg-line" x1="218.3" y1="191.6" x2="228.3" y2="191.6"/>
  <text class="dg-note" x="213.3" y="191.6" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="218.3" y1="136" x2="228.3" y2="136"/>
  <text class="dg-note" x="213.3" y="136" dy="0.35em" text-anchor="end">3</text>
  <line class="dg-line" x1="218.3" y1="80.4" x2="228.3" y2="80.4"/>
  <text class="dg-note" x="213.3" y="80.4" dy="0.35em" text-anchor="end">4</text>
  <!-- the legs -->
  <line class="dg-line" x1="223.3" y1="302.7" x2="390" y2="302.7"/>
  <line class="dg-line" x1="390" y1="302.7" x2="390" y2="80.4"/>
  <path class="dg-line" d="M378 302.7 V290.7 H390"/>
  <text x="306.7" y="290.7" dy="0.35em" text-anchor="middle">3</text>
  <text x="400" y="191.6" dy="0.35em" text-anchor="start">4</text>
  <line class="dg-flow" x1="223.3" y1="302.7" x2="390" y2="80.4" marker-end="url(#arrow-flow)"/>
  <text x="284" y="180.4" dy="0.35em" text-anchor="end">‖v‖ = 5</text>
  <text x="398" y="76.4" dy="0.35em" text-anchor="start">(3, 4)</text>
</svg>
