<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A dilation by 2 about the origin doubles every length</title>
  <desc>The triangle with vertices A(1, 1), B(3, 1), and C(1, 2) and its image under the dilation by 2 about the origin, with vertices (2, 2), (6, 2), and (2, 4). Dashed rays from the origin pass through each vertex and its image, which is twice as far out. The legs 2 and 1 become 4 and 2, so the image is similar, with 4 times the area.</desc>
  <polygon class="dg-box" points="232,168 456,168 232,56"/>
  <polygon class="dg-hot" points="176,224 288,224 176,168"/>
  <line class="dg-line" x1="92" y1="280" x2="540" y2="280" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="120" y1="302.4" x2="120" y2="22.4" marker-end="url(#arrow)"/>
  <text class="dg-note" x="544" y="294" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="128" y="28.4" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-line" x1="176" y1="275" x2="176" y2="285"/>
  <text class="dg-note" x="176" y="296" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="232" y1="275" x2="232" y2="285"/>
  <text class="dg-note" x="232" y="296" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="288" y1="275" x2="288" y2="285"/>
  <text class="dg-note" x="288" y="296" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="344" y1="275" x2="344" y2="285"/>
  <text class="dg-note" x="344" y="296" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="400" y1="275" x2="400" y2="285"/>
  <text class="dg-note" x="400" y="296" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="456" y1="275" x2="456" y2="285"/>
  <text class="dg-note" x="456" y="296" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="512" y1="275" x2="512" y2="285"/>
  <text class="dg-note" x="512" y="296" dy="0.35em" text-anchor="middle">7</text>
  <line class="dg-line" x1="115" y1="224" x2="125" y2="224"/>
  <text class="dg-note" x="110" y="224" dy="0.35em" text-anchor="end">1</text>
  <line class="dg-line" x1="115" y1="168" x2="125" y2="168"/>
  <text class="dg-note" x="110" y="168" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="115" y1="112" x2="125" y2="112"/>
  <text class="dg-note" x="110" y="112" dy="0.35em" text-anchor="end">3</text>
  <line class="dg-line" x1="115" y1="56" x2="125" y2="56"/>
  <text class="dg-note" x="110" y="56" dy="0.35em" text-anchor="end">4</text>
  <line class="dg-line dg-dashed" x1="120" y1="280" x2="241" y2="159"/>
  <line class="dg-line dg-dashed" x1="120" y1="280" x2="482.9" y2="159"/>
  <line class="dg-line dg-dashed" x1="120" y1="280" x2="241" y2="38.1"/>
  <text class="dg-note" x="296.4" y="238" dy="0.35em" text-anchor="start">B(3, 1)</text>
  <text class="dg-note" x="167.6" y="159.6" dy="0.35em" text-anchor="end">C(1, 2)</text>
  <text x="464.4" y="151.2" dy="0.35em" text-anchor="start">B′(6, 2)</text>
  <text x="223.6" y="44.8" dy="0.35em" text-anchor="end">C′(2, 4)</text>
  <text class="dg-note" x="344" y="180.3" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="232" y="234.1" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="530" y="60" dy="0.35em" text-anchor="middle">(x, y) → (2x, 2y)</text>
  <text class="dg-note" x="530" y="82" dy="0.35em" text-anchor="middle">lengths × 2, area × 4</text>
</svg>
