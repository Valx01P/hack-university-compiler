<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A cylinder's net: two circles and a rectangle 2πr wide</title>
  <desc>A cylinder unfolded flat, like a can's label peeled off. In the middle is a rectangle h tall whose width is the circumference 2πr, since it wrapped once around the circle. Above and below it are the two circular ends, each of area πr². So the surface area is 2πr² + 2πrh.</desc>
  <rect class="dg-hot" x="190" y="100" width="300" height="110"/>
  <text class="dg-on-hot" x="340" y="155" dy="0.35em" text-anchor="middle">side: 2πr × h</text>
  <circle class="dg-box" cx="250" cy="60" r="40"/>
  <circle class="dg-box" cx="250" cy="250" r="40"/>
  <text class="dg-code" x="250" y="60" dy="0.35em" text-anchor="middle">πr²</text>
  <text class="dg-code" x="250" y="250" dy="0.35em" text-anchor="middle">πr²</text>
  <line class="dg-line" x1="190" y1="226" x2="490" y2="226"/>
  <text class="dg-note" x="390" y="242" dy="0.35em" text-anchor="middle">2πr, the circumference</text>
  <line class="dg-line" x1="506" y1="100" x2="506" y2="210"/>
  <text class="dg-heading" x="520" y="155" dy="0.35em" text-anchor="middle">h</text>
</svg>
