<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>Congruence mod 3 splits the integers into three classes</title>
  <desc>A number line from −3 to 8. Below it, three rows. The first row holds the integers with remainder 0 on dividing by 3: −3, 0, 3, 6. The second holds remainder 1: −2, 1, 4, 7. The third holds remainder 2: −1, 2, 5, 8. Every integer on the line sits in exactly one row, so the three classes split the integers with no overlap.</desc>
  <line class="dg-line" x1="150" y1="40" x2="650" y2="40"/>
  <line class="dg-line" x1="180" y1="34" x2="180" y2="46"/>
  <text class="dg-note" x="180" y="20" dy="0.35em" text-anchor="middle">−3</text>
  <line class="dg-line" x1="220" y1="34" x2="220" y2="46"/>
  <text class="dg-note" x="220" y="20" dy="0.35em" text-anchor="middle">−2</text>
  <line class="dg-line" x1="260" y1="34" x2="260" y2="46"/>
  <text class="dg-note" x="260" y="20" dy="0.35em" text-anchor="middle">−1</text>
  <line class="dg-line" x1="300" y1="34" x2="300" y2="46"/>
  <text class="dg-note" x="300" y="20" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line" x1="340" y1="34" x2="340" y2="46"/>
  <text class="dg-note" x="340" y="20" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="380" y1="34" x2="380" y2="46"/>
  <text class="dg-note" x="380" y="20" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="420" y1="34" x2="420" y2="46"/>
  <text class="dg-note" x="420" y="20" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="460" y1="34" x2="460" y2="46"/>
  <text class="dg-note" x="460" y="20" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="500" y1="34" x2="500" y2="46"/>
  <text class="dg-note" x="500" y="20" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="540" y1="34" x2="540" y2="46"/>
  <text class="dg-note" x="540" y="20" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="580" y1="34" x2="580" y2="46"/>
  <text class="dg-note" x="580" y="20" dy="0.35em" text-anchor="middle">7</text>
  <line class="dg-line" x1="620" y1="34" x2="620" y2="46"/>
  <text class="dg-note" x="620" y="20" dy="0.35em" text-anchor="middle">8</text>
  <text x="20" y="100" dy="0.35em">remainder 0</text>
  <rect class="dg-hot" x="162" y="84" width="36" height="32" rx="8"/>
  <text class="dg-on-hot" x="180" y="100" dy="0.35em" text-anchor="middle">−3</text>
  <line class="dg-line dg-dashed" x1="180" y1="50" x2="180" y2="80"/>
  <rect class="dg-hot" x="282" y="84" width="36" height="32" rx="8"/>
  <text class="dg-on-hot" x="300" y="100" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line dg-dashed" x1="300" y1="50" x2="300" y2="80"/>
  <rect class="dg-hot" x="402" y="84" width="36" height="32" rx="8"/>
  <text class="dg-on-hot" x="420" y="100" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line dg-dashed" x1="420" y1="50" x2="420" y2="80"/>
  <rect class="dg-hot" x="522" y="84" width="36" height="32" rx="8"/>
  <text class="dg-on-hot" x="540" y="100" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line dg-dashed" x1="540" y1="50" x2="540" y2="80"/>
  <text class="dg-note" x="146" y="100" dy="0.35em" text-anchor="middle">…</text>
  <text class="dg-note" x="654" y="100" dy="0.35em" text-anchor="middle">…</text>
  <text x="20" y="160" dy="0.35em">remainder 1</text>
  <rect class="dg-box" x="202" y="144" width="36" height="32" rx="8"/>
  <text x="220" y="160" dy="0.35em" text-anchor="middle">−2</text>
  <line class="dg-line dg-dashed" x1="220" y1="50" x2="220" y2="140"/>
  <rect class="dg-box" x="322" y="144" width="36" height="32" rx="8"/>
  <text x="340" y="160" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line dg-dashed" x1="340" y1="50" x2="340" y2="140"/>
  <rect class="dg-box" x="442" y="144" width="36" height="32" rx="8"/>
  <text x="460" y="160" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line dg-dashed" x1="460" y1="50" x2="460" y2="140"/>
  <rect class="dg-box" x="562" y="144" width="36" height="32" rx="8"/>
  <text x="580" y="160" dy="0.35em" text-anchor="middle">7</text>
  <line class="dg-line dg-dashed" x1="580" y1="50" x2="580" y2="140"/>
  <text class="dg-note" x="146" y="160" dy="0.35em" text-anchor="middle">…</text>
  <text class="dg-note" x="654" y="160" dy="0.35em" text-anchor="middle">…</text>
  <text x="20" y="220" dy="0.35em">remainder 2</text>
  <rect class="dg-box" x="242" y="204" width="36" height="32" rx="8"/>
  <text x="260" y="220" dy="0.35em" text-anchor="middle">−1</text>
  <line class="dg-line dg-dashed" x1="260" y1="50" x2="260" y2="200"/>
  <rect class="dg-box" x="362" y="204" width="36" height="32" rx="8"/>
  <text x="380" y="220" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line dg-dashed" x1="380" y1="50" x2="380" y2="200"/>
  <rect class="dg-box" x="482" y="204" width="36" height="32" rx="8"/>
  <text x="500" y="220" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line dg-dashed" x1="500" y1="50" x2="500" y2="200"/>
  <rect class="dg-box" x="602" y="204" width="36" height="32" rx="8"/>
  <text x="620" y="220" dy="0.35em" text-anchor="middle">8</text>
  <line class="dg-line dg-dashed" x1="620" y1="50" x2="620" y2="200"/>
  <text class="dg-note" x="146" y="220" dy="0.35em" text-anchor="middle">…</text>
  <text class="dg-note" x="654" y="220" dy="0.35em" text-anchor="middle">…</text>
</svg>
