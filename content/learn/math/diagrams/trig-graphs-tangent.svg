<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The graph of y = tan x with its vertical asymptotes</title>
  <desc>The graph of y = tan x for x from −3π/2 to 3π/2. It has three branches, each rising from far below to far above. Dashed vertical asymptotes stand at x = −π/2 and x = π/2, where cosine is 0 and tangent is undefined, and the pattern repeats every π. Each branch crosses the x-axis at a multiple of π: −π, 0, and π.</desc>
