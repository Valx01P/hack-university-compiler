<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220">
  <title>The decibel scale: every 10 dB step multiplies the sound's intensity by 10</title>
  <desc>A horizontal scale from 0 to 120 decibels with a tick every 20 dB. Above each tick is the intensity compared with the quietest audible sound: 1 at 0 dB, 100 at 20 dB, 10 000 at 40 dB, and so on up to a trillion at 120 dB. Below are examples: a whisper near 30 dB, conversation near 60 dB, a lawn mower near 90 dB, and a jet engine near 120 dB.</desc>
  <line class="dg-line" x1="40" y1="110" x2="650" y2="110" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="50" y1="102" x2="50" y2="118"/>
  <text class="dg-note" x="50" y="136" text-anchor="middle">0 dB</text>
  <text class="dg-code" x="50" y="88" text-anchor="middle">1</text>
  <line class="dg-line" x1="146.7" y1="102" x2="146.7" y2="118"/>
  <text class="dg-note" x="146.7" y="136" text-anchor="middle">20 dB</text>
  <text class="dg-code" x="146.7" y="88" text-anchor="middle">10²</text>
  <line class="dg-line" x1="243.3" y1="102" x2="243.3" y2="118"/>
  <text class="dg-note" x="243.3" y="136" text-anchor="middle">40 dB</text>
  <text class="dg-code" x="243.3" y="88" text-anchor="middle">10⁴</text>
  <line class="dg-line" x1="340" y1="102" x2="340" y2="118"/>
  <text class="dg-note" x="340" y="136" text-anchor="middle">60 dB</text>
  <text class="dg-code" x="340" y="88" text-anchor="middle">10⁶</text>
  <line class="dg-line" x1="436.7" y1="102" x2="436.7" y2="118"/>
  <text class="dg-note" x="436.7" y="136" text-anchor="middle">80 dB</text>
  <text class="dg-code" x="436.7" y="88" text-anchor="middle">10⁸</text>
  <line class="dg-line" x1="533.3" y1="102" x2="533.3" y2="118"/>
  <text class="dg-note" x="533.3" y="136" text-anchor="middle">100 dB</text>
  <text class="dg-code" x="533.3" y="88" text-anchor="middle">10¹⁰</text>
  <line class="dg-line" x1="630" y1="102" x2="630" y2="118"/>
  <text class="dg-note" x="630" y="136" text-anchor="middle">120 dB</text>
  <text class="dg-code" x="630" y="88" text-anchor="middle">10¹²</text>
  <text class="dg-note" x="36" y="60" text-anchor="start">intensity × I₀</text>
  <circle class="dg-hot" cx="195" cy="110" r="6"/>
  <text x="195" y="168" text-anchor="middle">whisper</text>
  <circle class="dg-hot" cx="340" cy="110" r="6"/>
  <text x="340" y="168" text-anchor="middle">talking</text>
  <circle class="dg-hot" cx="485" cy="110" r="6"/>
  <text x="485" y="168" text-anchor="middle">mower</text>
  <circle class="dg-hot" cx="630" cy="110" r="6"/>
  <text x="630" y="168" text-anchor="middle">jet</text>
</svg>
