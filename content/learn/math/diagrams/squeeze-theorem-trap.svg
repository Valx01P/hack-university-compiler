<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>x sin(1/x) trapped between −|x| and |x| near 0</title>
  <desc>The graph of x sin(1/x) wiggles faster and faster as x nears 0, but it always stays between the dashed lines y = |x| and y = −|x|, which form a V meeting at the origin. Both lines head to 0 as x goes to 0, so the trapped curve is squeezed to 0 too.</desc>
