<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>Why SSA is not a test: one angle and two sides can make two triangles</title>
  <desc>Angle A is 40° with side AB = 10. A side of length 7 hangs from B. Swinging it, its far end can land on the ray from A at two points, C1 and C2, so two different triangles, ABC1 and ABC2, share the side AB, the side 7, and the angle A. The parts match but the triangles don't, so side-side-angle doesn't decide a triangle.</desc>
  <line class="dg-line" x1="60" y1="230" x2="640" y2="230"/>
  <line class="dg-flow" x1="60" y1="230" x2="289.8" y2="37.2"/>
  <line class="dg-flow" x1="289.8" y1="37.2" x2="206.7" y2="230"/>
  <line class="dg-flow dg-dashed" x1="289.8" y1="37.2" x2="373" y2="230"/>
  <path class="dg-line dg-dashed" d="M107.9 142.2 A210 210 0 0 0 480.1 125.9"/>
  <path class="dg-hot" d="M60 230 L96 230 A36 36 0 0 0 87.6 206.9 Z"/>
  <text x="113.3" y="212.7" dy="0.35em" text-anchor="middle">40°</text>
  <circle class="dg-strong" cx="60" cy="230" r="4"/>
  <circle class="dg-strong" cx="289.8" cy="37.2" r="4"/>
  <circle class="dg-strong" cx="206.7" cy="230" r="4"/>
  <circle class="dg-strong" cx="373" cy="230" r="4"/>
  <text class="dg-heading" x="46" y="246" dy="0.35em" text-anchor="middle">A</text>
  <text class="dg-heading" x="289.8" y="19.2" dy="0.35em" text-anchor="middle">B</text>
  <text class="dg-heading" x="206.7" y="250" dy="0.35em" text-anchor="middle">C1</text>
  <text class="dg-heading" x="373" y="250" dy="0.35em" text-anchor="middle">C2</text>
  <text class="dg-code" x="156.9" y="123.6" dy="0.35em" text-anchor="middle">10</text>
  <text class="dg-code" x="236.2" y="133.6" dy="0.35em" text-anchor="middle">7</text>
  <text class="dg-code" x="345.4" y="133.6" dy="0.35em" text-anchor="middle">7</text>
  <text class="dg-note" x="560" y="60" dy="0.35em" text-anchor="middle">same 40°, same 10, same 7</text>
  <text class="dg-note" x="560" y="84" dy="0.35em" text-anchor="middle">two different triangles</text>
</svg>
