<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>An inscribed angle is half the central angle on the same arc, and an angle in a semicircle is 90°</title>
  <desc>On the left, a circle with center O. Point C is on the circle and the chord from C passes through O to B. A second chord runs from C to A. The inscribed angle at C is x. Triangle OAC is isosceles, since OA and OC are radii, so its angle at A is x too, and the central angle AOB, an exterior angle of that triangle, is 2x. On the right, a triangle drawn in a semicircle on the diameter AB has a right angle at C.</desc>
  <circle class="dg-box" cx="170" cy="150" r="115"/>
  <line class="dg-line" x1="170" y1="265" x2="170" y2="35"/>
  <line class="dg-flow" x1="170" y1="265" x2="283.3" y2="130"/>
  <line class="dg-line" x1="170" y1="150" x2="283.3" y2="130"/>
  <path class="dg-hot" d="M170 265 L191.9 239 A34 34 0 0 0 170 231 Z"/>
  <path class="dg-line" d="M191.7 146.2 A22 22 0 0 0 170 128"/>
  <path class="dg-line" d="M253.7 135.2 A30 30 0 0 0 264 153"/>
  <text class="dg-heading" x="182" y="219" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-heading" x="243.3" y="138" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-heading" x="192" y="128" dy="0.35em" text-anchor="middle">2x</text>
  <circle class="dg-strong" cx="283.3" cy="130" r="3.5"/>
  <text class="dg-heading" x="297.3" y="130" dy="0.35em" text-anchor="middle">A</text>
  <circle class="dg-strong" cx="170" cy="35" r="3.5"/>
  <text class="dg-heading" x="170" y="19" dy="0.35em" text-anchor="middle">B</text>
  <circle class="dg-strong" cx="170" cy="265" r="3.5"/>
  <text class="dg-heading" x="170" y="283" dy="0.35em" text-anchor="middle">C</text>
  <circle class="dg-strong" cx="170" cy="150" r="3.5"/>
  <text class="dg-heading" x="156" y="154" dy="0.35em" text-anchor="middle">O</text>
  <path class="dg-box" d="M405 170 A105 105 0 0 1 615 170 Z"/>
  <line class="dg-flow" x1="405" y1="170" x2="449.8" y2="84"/>
  <line class="dg-flow" x1="449.8" y1="84" x2="615" y2="170"/>
  <polyline class="dg-line" points="444.7,93.7 454.5,98.8 459.5,89.1"/>
  <circle class="dg-strong" cx="405" cy="170" r="3.5"/>
  <text class="dg-heading" x="391" y="174" dy="0.35em" text-anchor="middle">A</text>
  <circle class="dg-strong" cx="615" cy="170" r="3.5"/>
  <text class="dg-heading" x="629" y="174" dy="0.35em" text-anchor="middle">B</text>
  <circle class="dg-strong" cx="449.8" cy="84" r="3.5"/>
  <text class="dg-heading" x="443.8" y="68" dy="0.35em" text-anchor="middle">C</text>
  <circle class="dg-strong" cx="510" cy="170" r="3.5"/>
  <text class="dg-heading" x="510" y="188" dy="0.35em" text-anchor="middle">O</text>
  <text class="dg-note" x="510" y="290" dy="0.35em" text-anchor="middle">AB is a diameter, so the angle at C is 90°</text>
</svg>
