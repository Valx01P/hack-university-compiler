<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Rectangles under and over a decreasing curve</title>
  <desc>Two copies of a decreasing curve y = f(x) from x = 1 to 6. On the left, rectangles of width 1 on [1, 2] to [4, 5] with heights a2, a3, a4, a5 sit under the curve, so their total is at most the integral from 1 to 5. On the right, rectangles with heights a1, a2, a3, a4 on the same intervals cover the curve, so their total is at least that integral.</desc>
