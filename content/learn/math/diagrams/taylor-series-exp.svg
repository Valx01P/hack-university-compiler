<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>Taylor polynomials of eˣ at 0</title>
  <desc>The curve y = eˣ from x = −3 to about 2, with its Taylor polynomials at 0: the line T1 = 1 + x, the parabola T2 = 1 + x + x²/2, and the cubic T3. All pass through (0, 1) with the curve's slope there. Each higher one stays close to the curve over a wider stretch before it drifts away.</desc>
