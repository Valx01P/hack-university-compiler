<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The graph of (x² − 1)/(x − 1): a line with a hole at x = 1</title>
  <desc>The graph is the line y = x + 1 with one point missing, an open circle at (1, 2), because the formula gives 0/0 at x = 1. Arrows under the x-axis approach 1 from the left and from the right, and dashed guides show the curve's height closing in on 2. The limit is 2 even though f(1) is undefined.</desc>
  <line class="dg-line" x1="60" y1="250" x2="620" y2="250" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="235" y1="290" x2="235" y2="20" marker-end="url(#arrow)"/>
  <text class="dg-note" x="620" y="268" text-anchor="end">x</text>
  <text class="dg-note" x="243" y="30">y</text>
  <line class="dg-line" x1="118.3" y1="246" x2="118.3" y2="254"/>
  <text class="dg-note" x="118.3" y="268" text-anchor="middle">−1</text>
  <line class="dg-line" x1="351.7" y1="246" x2="351.7" y2="254"/>
  <text class="dg-note" x="351.7" y="268" text-anchor="middle">1</text>
  <line class="dg-line" x1="468.3" y1="246" x2="468.3" y2="254"/>
  <text class="dg-note" x="468.3" y="268" text-anchor="middle">2</text>
  <line class="dg-line" x1="585" y1="246" x2="585" y2="254"/>
  <text class="dg-note" x="585" y="268" text-anchor="middle">3</text>
  <line class="dg-line" x1="231" y1="200" x2="239" y2="200"/>
  <text class="dg-note" x="227" y="200" dy="0.35em" text-anchor="end">1</text>
  <line class="dg-line" x1="231" y1="150" x2="239" y2="150"/>
  <text class="dg-note" x="227" y="150" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="231" y1="100" x2="239" y2="100"/>
  <text class="dg-note" x="227" y="100" dy="0.35em" text-anchor="end">3</text>
  <line class="dg-line" x1="231" y1="50" x2="239" y2="50"/>
  <text class="dg-note" x="227" y="50" dy="0.35em" text-anchor="end">4</text>
  <polyline class="dg-flow" points="60,275 78.5,267.1 97,259.1 115.5,251.2 134,243.3 152.5,235.3 171,227.4 189.5,219.5 208,211.6 226.6,203.6 245.1,195.7 263.6,187.8 282.1,179.8 300.6,171.9 319.1,164 337.6,156 356.1,148.1 374.6,140.2 393.1,132.2 411.6,124.3 430.1,116.4 448.6,108.4 467.1,100.5 485.6,92.6 504.1,84.7 522.6,76.7 541.1,68.8 559.7,60.9 578.2,52.9 596.7,45"/>
  <line class="dg-line dg-dashed" x1="351.7" y1="250" x2="351.7" y2="150"/>
  <line class="dg-line dg-dashed" x1="235" y1="150" x2="351.7" y2="150"/>
  <circle class="dg-box" cx="351.7" cy="150" r="5"/>
  <line class="dg-flow" x1="264.2" y1="288" x2="334.2" y2="288" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="439.2" y1="288" x2="369.2" y2="288" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="351.7" y="306" dy="0.35em" text-anchor="middle">x → 1 from both sides</text>
  <text class="dg-note" x="367.7" y="174" dy="0.35em">hole at (1, 2): f(1) is undefined</text>
  <text class="dg-code" x="527" y="86" dy="0.35em">y = (x² − 1)/(x − 1)</text>
</svg>
