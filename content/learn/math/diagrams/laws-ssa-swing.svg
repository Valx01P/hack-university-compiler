<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Side a swings from C and meets the bottom side twice</title>
  <desc>Angle A sits at the left, with side b rising from A to the corner C and a bottom side running right from A. The dashed height from C to the bottom side is b sin A. Side a, longer than the height but shorter than b, swings from C like a compass along a dashed arc and meets the bottom side at two points, B₁ and B₂, so the same data fits two triangles.</desc>
  <!-- The bottom ray from A -->
  <line class="dg-line" x1="70" y1="250" x2="650" y2="250" marker-end="url(#arrow)"/>
  <!-- Side b and the height -->
  <line class="dg-line" x1="70" y1="250" x2="329.8" y2="100"/>
  <line class="dg-line dg-dashed" x1="329.8" y1="100" x2="329.8" y2="250"/>
  <text class="dg-note" x="335.8" y="228" dy="0.35em">h = b sin A</text>
  <!-- The swing of side a -->
  <path class="dg-line dg-dashed" d="M187.8 218.5 A185 185 0 0 0 471.8 218.5"/>
  <line class="dg-flow" x1="329.8" y1="100" x2="221.5" y2="250"/>
  <line class="dg-flow" x1="329.8" y1="100" x2="438.1" y2="250"/>
  <circle class="dg-hot" cx="221.5" cy="250" r="6"/>
  <circle class="dg-hot" cx="438.1" cy="250" r="6"/>
  <path class="dg-line" d="M114 250 A44 44 0 0 0 108.1 228"/>
  <text x="122" y="238" dy="0.35em">A</text>
  <text class="dg-heading" x="58" y="250" dy="0.35em" text-anchor="end">A</text>
  <text class="dg-heading" x="329.8" y="82" dy="0.35em" text-anchor="middle">C</text>
  <text class="dg-heading" x="221.5" y="272" dy="0.35em" text-anchor="middle">B₁</text>
  <text class="dg-heading" x="438.1" y="272" dy="0.35em" text-anchor="middle">B₂</text>
  <text x="189.9" y="163" dy="0.35em" text-anchor="end">b</text>
  <text x="281.9" y="152.5" dy="0.35em" text-anchor="end">a</text>
  <text x="377.7" y="152.5" dy="0.35em">a</text>
</svg>
