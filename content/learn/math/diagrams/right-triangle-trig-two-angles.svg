  <line class="dg-flow" x1="98" y1="250" x2="620" y2="60"/>
  <line class="dg-line" x1="290.9" y1="250" x2="620" y2="60"/>
  <polyline class="dg-line" points="148,250 148,249.1 147.9,248.3 147.9,247.4 147.9,246.5 147.8,245.6 147.7,244.8 147.6,243.9 147.5,243 147.4,242.2 147.2,241.3 147.1,240.5 146.9,239.6 146.7,238.8 146.5,237.9 146.3,237.1 146,236.2 145.8,235.4 145.5,234.5 145.3,233.7 145,232.9"/>
  <text class="dg-note" x="156" y="238" dy="0.35em" text-anchor="start">20°</text>
