<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Finding a height from two angles of elevation</title>
  <desc>A mountain of unknown height h seen from two points on level ground. From the farther point the angle of elevation is 20°, and from a point 1000 m closer it is 30°. The unknown distance from the closer point to the foot of the mountain is x. Two right triangles share the height: h = x tan 30° and h = (x + 1000) tan 20°.</desc>
