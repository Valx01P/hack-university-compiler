  <text class="dg-code" x="194.4" y="270" dy="0.35em" text-anchor="middle">1000 m</text>
  <text class="dg-code" x="455.5" y="270" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-code" x="630" y="155" dy="0.35em" text-anchor="start">h</text>
