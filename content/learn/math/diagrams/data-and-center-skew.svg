<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>Ten household incomes, skewed right, with the mean and the median</title>
  <desc>A dot plot of ten household incomes in thousands of dollars: nine between 22 and 80, crowded on the left, and one at 250 far to the right. A line marks the median, 40, in the middle of the crowd, and another marks the mean, 62.8, pulled right of eight of the ten households by the one large income.</desc>
  <line class="dg-line" x1="50" y1="190" x2="630" y2="190"/>
  <line class="dg-line" x1="60" y1="185" x2="60" y2="195"/>
  <line class="dg-line" x1="167.5" y1="185" x2="167.5" y2="195"/>
  <line class="dg-line" x1="275" y1="185" x2="275" y2="195"/>
  <line class="dg-line" x1="382.5" y1="185" x2="382.5" y2="195"/>
  <line class="dg-line" x1="490" y1="185" x2="490" y2="195"/>
  <line class="dg-line" x1="597.5" y1="185" x2="597.5" y2="195"/>
  <text class="dg-note" x="60" y="208" dy="0.35em" text-anchor="middle">0</text>
  <text class="dg-note" x="167.5" y="208" dy="0.35em" text-anchor="middle">50</text>
  <text class="dg-note" x="275" y="208" dy="0.35em" text-anchor="middle">100</text>
  <text class="dg-note" x="382.5" y="208" dy="0.35em" text-anchor="middle">150</text>
  <text class="dg-note" x="490" y="208" dy="0.35em" text-anchor="middle">200</text>
  <text class="dg-note" x="597.5" y="208" dy="0.35em" text-anchor="middle">250</text>
  <text class="dg-note" x="340" y="234" dy="0.35em" text-anchor="middle">household income, thousands of dollars per year</text>
  <circle class="dg-box" cx="107.3" cy="180" r="5"/>
  <circle class="dg-box" cx="120.2" cy="180" r="5"/>
  <circle class="dg-box" cx="126.6" cy="167" r="5"/>
  <circle class="dg-box" cx="135.2" cy="180" r="5"/>
  <circle class="dg-box" cx="141.7" cy="167" r="5"/>
  <circle class="dg-box" cx="150.3" cy="180" r="5"/>
  <circle class="dg-box" cx="161.1" cy="167" r="5"/>
  <circle class="dg-box" cx="178.2" cy="180" r="5"/>
  <circle class="dg-box" cx="232" cy="180" r="5"/>
  <circle class="dg-box" cx="597.5" cy="180" r="5"/>
  <line class="dg-flow" x1="146" y1="60" x2="146" y2="190"/>
  <text x="140" y="52" dy="0.35em" text-anchor="end">median 40</text>
  <line class="dg-flow dg-dashed" x1="195" y1="60" x2="195" y2="190"/>
  <text x="201" y="52" dy="0.35em" text-anchor="start">mean 62.8</text>
  <text class="dg-code" x="597.5" y="160" dy="0.35em" text-anchor="middle">250</text>
</svg>
