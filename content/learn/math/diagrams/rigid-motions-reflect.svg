<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>A triangle reflected across the y-axis and across the x-axis</title>
  <desc>A right triangle with vertices A(1, 2), B(4, 2), and C(1, 6) in the first quadrant. Its reflection across the y-axis has vertices (−1, 2), (−4, 2), and (−1, 6): each x changes sign. Its reflection across the x-axis has vertices (1, −2), (4, −2), and (1, −6): each y changes sign. A dashed segment from C to its mirror image crosses the y-axis at a right angle, and the mirror is halfway between them.</desc>
