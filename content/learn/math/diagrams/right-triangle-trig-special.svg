<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The 45-45-90 triangle and the 30-60-90 triangle</title>
  <desc>Left: a right isosceles triangle with legs 1 and 1, angles 45° and 45°, and hypotenuse √2 from the Pythagorean theorem. Right: an equilateral triangle with sides 2, cut in half by its height. Each half is a 30-60-90 triangle with hypotenuse 2, short leg 1 across from the 30° angle, and long leg √3 across from the 60° angle.</desc>
  <polygon class="dg-hot" points="60,260 230,260 60,90"/>
  <path class="dg-line" d="M72 260 V248 H60"/>
  <text class="dg-code" x="145" y="278" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="46" y="175" dy="0.35em" text-anchor="end">1</text>
  <text class="dg-code" x="157" y="165" dy="0.35em" text-anchor="start">√2</text>
  <text class="dg-on-hot" x="196" y="250" dy="0.35em" text-anchor="end">45°</text>
  <text class="dg-on-hot" x="68" y="126" dy="0.35em" text-anchor="start">45°</text>
  <polygon class="dg-hot" points="380,270 490,270 490,79.5"/>
  <polygon class="dg-box" points="490,270 600,270 490,79.5"/>
  <path class="dg-line" d="M478 270 V258 H490"/>
  <text class="dg-code" x="435" y="288" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="545" y="288" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="498" y="171" dy="0.35em" text-anchor="start">√3</text>
  <text class="dg-code" x="423" y="165.5" dy="0.35em" text-anchor="end">2</text>
  <text class="dg-code" x="557" y="165.5" dy="0.35em" text-anchor="start">2</text>
  <text class="dg-on-hot" x="410" y="258" dy="0.35em" text-anchor="start">60°</text>
  <text class="dg-on-hot" x="486" y="145.5" dy="0.35em" text-anchor="end">30°</text>
  <text class="dg-heading" x="150" y="322" dy="0.35em" text-anchor="middle">45-45-90</text>
  <text class="dg-heading" x="490" y="322" dy="0.35em" text-anchor="middle">half an equilateral triangle</text>
</svg>
