<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>Concavity of x³ − 3x: down on the left, up on the right</title>
  <desc>The curve y = x³ − 3x bends downward left of 0, where f″(x) = 6x is negative, and a dashed tangent line there lies above the curve. Right of 0 it bends upward, f″ is positive, and the tangent lies below. The bend changes at the inflection point (0, 0).</desc>
