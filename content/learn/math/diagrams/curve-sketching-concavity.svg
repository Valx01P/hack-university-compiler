  <text class="dg-note" x="256.7" y="198" dy="0.35em" text-anchor="middle">−1</text>
  <line class="dg-line" x1="423.3" y1="175" x2="423.3" y2="185"/>
  <text class="dg-note" x="423.3" y="198" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="506.7" y1="175" x2="506.7" y2="185"/>
  <line class="dg-line" x1="335" y1="250" x2="345" y2="250"/>
  <text class="dg-note" x="330" y="250" dy="0.35em" text-anchor="end">−2</text>
