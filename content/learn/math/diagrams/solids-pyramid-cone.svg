<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A square pyramid and a cone, with the height h and the slant height ℓ</title>
  <desc>On the left, a square pyramid with base side s and height h from the apex straight down to the center of the base. The slant height ℓ runs from the apex down a face to the middle of a base edge, and h, half of s, and ℓ make a right triangle. On the right, a cone of radius r and height h. Its slant height ℓ runs from the apex to the rim, and r, h, and ℓ make a right triangle, so ℓ² = r² + h².</desc>
  <line class="dg-line dg-dashed" x1="170" y1="180" x2="60" y2="240"/>
  <line class="dg-line dg-dashed" x1="170" y1="180" x2="370" y2="180"/>
  <line class="dg-line dg-dashed" x1="170" y1="180" x2="215" y2="40"/>
  <line class="dg-line" x1="60" y1="240" x2="260" y2="240"/>
  <line class="dg-line" x1="260" y1="240" x2="370" y2="180"/>
  <line class="dg-line" x1="60" y1="240" x2="215" y2="40"/>
  <line class="dg-line" x1="260" y1="240" x2="215" y2="40"/>
  <line class="dg-line" x1="370" y1="180" x2="215" y2="40"/>
  <line class="dg-line dg-dashed" x1="215" y1="40" x2="215" y2="210"/>
  <line class="dg-line dg-dashed" x1="215" y1="210" x2="160" y2="240"/>
  <line class="dg-flow" x1="215" y1="40" x2="160" y2="240"/>
  <text class="dg-heading" x="227" y="125" dy="0.35em" text-anchor="middle">h</text>
  <text class="dg-heading" x="171.5" y="150" dy="0.35em" text-anchor="middle">ℓ</text>
  <text class="dg-heading" x="160" y="258" dy="0.35em" text-anchor="middle">s</text>
  <path class="dg-line" d="M430 240 A90 24 0 0 0 610 240"/>
  <path class="dg-line dg-dashed" d="M430 240 A90 24 0 0 1 610 240"/>
  <line class="dg-line" x1="430" y1="240" x2="520" y2="70"/>
  <line class="dg-flow" x1="610" y1="240" x2="520" y2="70"/>
  <line class="dg-line dg-dashed" x1="520" y1="70" x2="520" y2="240"/>
  <line class="dg-line dg-dashed" x1="520" y1="240" x2="610" y2="240"/>
  <polyline class="dg-line" points="530,240 530,230 520,230"/>
  <text class="dg-heading" x="508" y="155" dy="0.35em" text-anchor="middle">h</text>
  <text class="dg-heading" x="565" y="228" dy="0.35em" text-anchor="middle">r</text>
  <text class="dg-heading" x="581" y="149" dy="0.35em" text-anchor="middle">ℓ</text>
  <text class="dg-code" x="520" y="290" dy="0.35em" text-anchor="middle">ℓ² = r² + h²</text>
</svg>
