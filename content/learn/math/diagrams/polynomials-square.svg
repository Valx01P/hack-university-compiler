<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A square of side a + b cut into a², two ab rectangles, and b²</title>
  <desc>A large square with sides a + b, cut by one vertical and one horizontal line. The top left piece is an a by a square, highlighted. The bottom right piece is a b by b square. The other two pieces are a by b rectangles. Together they show that (a + b)² = a² + 2ab + b².</desc>
  <!-- The four pieces of the square of side a + b. -->
  <rect class="dg-hot" x="220" y="40" width="160" height="160"/>
  <rect class="dg-box" x="380" y="40" width="80" height="160"/>
  <rect class="dg-box" x="220" y="200" width="160" height="80"/>
  <rect class="dg-strong" x="380" y="200" width="80" height="80"/>
  <text class="dg-on-hot" x="300" y="120" dy="0.35em" text-anchor="middle">a²</text>
  <text x="420" y="120" dy="0.35em" text-anchor="middle">ab</text>
  <text x="300" y="240" dy="0.35em" text-anchor="middle">ab</text>
  <text x="420" y="240" dy="0.35em" text-anchor="middle">b²</text>
  <!-- Side lengths along the top and the left. -->
  <text x="300" y="22" dy="0.35em" text-anchor="middle">a</text>
  <text x="420" y="22" dy="0.35em" text-anchor="middle">b</text>
  <text x="202" y="120" dy="0.35em" text-anchor="middle">a</text>
  <text x="202" y="240" dy="0.35em" text-anchor="middle">b</text>
  <text class="dg-code" x="490" y="150" dy="0.35em">(a + b)²</text>
  <text class="dg-code" x="490" y="174" dy="0.35em">= a² + 2ab + b²</text>
</svg>
