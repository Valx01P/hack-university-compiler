<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The graph of y = 2 sin(2(x − π/4)) + 1 with its midline</title>
  <desc>The graph of y = 2 sin(2(x − π/4)) + 1 for x from 0 to 2π. A dashed midline runs at y = 1, with the maximum 3 and minimum −1 two units above and below it. A cycle starts on the midline at x = π/4, the phase shift, rises to 3 at x = π/2, returns to the midline at 3π/4, falls to −1 at π, and is back on the midline at 5π/4.</desc>
