<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The distance from (1, 2) to (4, 6) as the long side of a right triangle</title>
  <desc>The points (1, 2) and (4, 6) are joined by a straight segment. With the corner (4, 2), they make a right triangle whose horizontal leg is 4 − 1 = 3 and whose vertical leg is 6 − 2 = 4. By the Pythagorean theorem the segment is √(3² + 4²) = 5 long.</desc>
  <!-- Axes -->
  <line class="dg-line" x1="180" y1="300" x2="514" y2="300" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="220" y1="340" x2="220" y2="6" marker-end="url(#arrow)"/>
  <text class="dg-note" x="514" y="286" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="230" y="8" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-line" x1="180" y1="296" x2="180" y2="304"/>
  <text class="dg-note" x="180" y="316" dy="0.35em" text-anchor="middle">−1</text>
  <line class="dg-line" x1="260" y1="296" x2="260" y2="304"/>
  <text class="dg-note" x="260" y="316" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="300" y1="296" x2="300" y2="304"/>
  <text class="dg-note" x="300" y="316" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="340" y1="296" x2="340" y2="304"/>
  <text class="dg-note" x="340" y="316" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="380" y1="296" x2="380" y2="304"/>
  <text class="dg-note" x="380" y="316" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="420" y1="296" x2="420" y2="304"/>
  <text class="dg-note" x="420" y="316" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="460" y1="296" x2="460" y2="304"/>
  <text class="dg-note" x="460" y="316" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="500" y1="296" x2="500" y2="304"/>
  <text class="dg-note" x="500" y="316" dy="0.35em" text-anchor="middle">7</text>
  <line class="dg-line" x1="216" y1="340" x2="224" y2="340"/>
  <text class="dg-note" x="212" y="340" dy="0.35em" text-anchor="end">−1</text>
  <line class="dg-line" x1="216" y1="260" x2="224" y2="260"/>
  <text class="dg-note" x="212" y="260" dy="0.35em" text-anchor="end">1</text>
  <line class="dg-line" x1="216" y1="220" x2="224" y2="220"/>
  <text class="dg-note" x="212" y="220" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="216" y1="180" x2="224" y2="180"/>
  <text class="dg-note" x="212" y="180" dy="0.35em" text-anchor="end">3</text>
  <line class="dg-line" x1="216" y1="140" x2="224" y2="140"/>
  <text class="dg-note" x="212" y="140" dy="0.35em" text-anchor="end">4</text>
  <line class="dg-line" x1="216" y1="100" x2="224" y2="100"/>
  <text class="dg-note" x="212" y="100" dy="0.35em" text-anchor="end">5</text>
  <line class="dg-line" x1="216" y1="60" x2="224" y2="60"/>
  <text class="dg-note" x="212" y="60" dy="0.35em" text-anchor="end">6</text>
  <line class="dg-line" x1="216" y1="20" x2="224" y2="20"/>
  <text class="dg-note" x="212" y="20" dy="0.35em" text-anchor="end">7</text>
  <line class="dg-line dg-dashed" x1="260" y1="220" x2="380" y2="220"/>
  <line class="dg-line dg-dashed" x1="380" y1="220" x2="380" y2="60"/>
  <polyline class="dg-line" points="368,220 368,208 380,208"/>
  <line class="dg-flow" x1="260" y1="220" x2="380" y2="60"/>
  <circle class="dg-hot" cx="260" cy="220" r="5"/>
  <circle class="dg-hot" cx="380" cy="60" r="5"/>
  <circle class="dg-box" cx="380" cy="220" r="4"/>
  <text x="260" y="238" dy="0.35em" text-anchor="middle">(1, 2)</text>
  <text x="390" y="60" dy="0.35em" text-anchor="start">(4, 6)</text>
  <text class="dg-note" x="390" y="232" dy="0.35em" text-anchor="start">(4, 2)</text>
  <text class="dg-note" x="320" y="236" dy="0.35em" text-anchor="middle">run 3</text>
  <text class="dg-note" x="390" y="140" dy="0.35em" text-anchor="start">rise 4</text>
  <text x="308" y="134" dy="0.35em" text-anchor="end">d = 5</text>
</svg>
