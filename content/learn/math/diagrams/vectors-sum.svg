<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>Adding u = (3, 1) and v = (1, 2) tip to tail</title>
  <desc>The arrow u = (3, 1) from the origin, then v = (1, 2) starting at the tip of u, ends at (4, 3). Dashed copies show v first and then u, which reach the same point. Together they outline a parallelogram whose diagonal from the origin is u + v = (4, 3).</desc>
  <!-- Axes -->
  <line class="dg-line" x1="142" y1="285" x2="540" y2="285" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="189.3" y1="332.3" x2="189.3" y2="26" marker-end="url(#arrow)"/>
  <text class="dg-note" x="548" y="285" dy="0.35em">x</text>
  <text class="dg-note" x="189.3" y="18" text-anchor="middle">y</text>
  <line class="dg-line" x1="254.8" y1="280" x2="254.8" y2="290"/>
  <text class="dg-note" x="254.8" y="303" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="320.3" y1="280" x2="320.3" y2="290"/>
  <text class="dg-note" x="320.3" y="303" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="385.9" y1="280" x2="385.9" y2="290"/>
  <text class="dg-note" x="385.9" y="303" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="451.4" y1="280" x2="451.4" y2="290"/>
  <text class="dg-note" x="451.4" y="303" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="516.9" y1="280" x2="516.9" y2="290"/>
  <text class="dg-note" x="516.9" y="303" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="184.3" y1="219.5" x2="194.3" y2="219.5"/>
  <text class="dg-note" x="179.3" y="219.5" dy="0.35em" text-anchor="end">1</text>
  <line class="dg-line" x1="184.3" y1="153.9" x2="194.3" y2="153.9"/>
  <text class="dg-note" x="179.3" y="153.9" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="184.3" y1="88.4" x2="194.3" y2="88.4"/>
  <text class="dg-note" x="179.3" y="88.4" dy="0.35em" text-anchor="end">3</text>
  <!-- the other way round, dashed -->
  <line class="dg-line dg-dashed" x1="189.3" y1="285" x2="254.8" y2="153.9" marker-end="url(#arrow)"/>
  <line class="dg-line dg-dashed" x1="254.8" y1="153.9" x2="451.4" y2="88.4" marker-end="url(#arrow)"/>
  <!-- u then v -->
  <line class="dg-line" x1="189.3" y1="285" x2="385.9" y2="219.5" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="385.9" y1="219.5" x2="451.4" y2="88.4" marker-end="url(#arrow)"/>
  <!-- u + v -->
  <line class="dg-flow" x1="189.3" y1="285" x2="451.4" y2="88.4" marker-end="url(#arrow-flow)"/>
  <text x="294.1" y="264.2" dy="0.35em" text-anchor="middle">u</text>
  <text x="426.6" y="153.9" dy="0.35em" text-anchor="start">v</text>
  <text class="dg-note" x="217.3" y="203.1" dy="0.35em" text-anchor="end">v</text>
  <text class="dg-note" x="353.1" y="109.2" dy="0.35em" text-anchor="middle">u</text>
  <text x="329.4" y="166.9" dy="0.35em" text-anchor="end">u + v</text>
  <text x="459.4" y="84.4" dy="0.35em" text-anchor="start">(4, 3)</text>
</svg>
