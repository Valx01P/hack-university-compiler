<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>The complex plane: 3 + 2i, its conjugate, and i times it</title>
  <desc>The real axis runs across and the imaginary axis up. The point 3 + 2i is 3 right and 2 up, joined to 0 by a segment of length √13, its modulus. Its conjugate 3 − 2i is its mirror image across the real axis. Multiplying by i turns it a quarter turn counterclockwise about 0, to −2 + 3i, the same distance from 0.</desc>
  <!-- Axes -->
  <line class="dg-line" x1="150" y1="200" x2="524" y2="200" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="310" y1="340" x2="310" y2="26" marker-end="url(#arrow)"/>
  <text class="dg-note" x="524" y="186" dy="0.35em" text-anchor="middle">real</text>
  <text class="dg-note" x="320" y="28" dy="0.35em" text-anchor="start">imaginary</text>
  <line class="dg-line" x1="190" y1="196" x2="190" y2="204"/>
  <text class="dg-note" x="190" y="216" dy="0.35em" text-anchor="middle">−3</text>
  <line class="dg-line" x1="230" y1="196" x2="230" y2="204"/>
  <text class="dg-note" x="230" y="216" dy="0.35em" text-anchor="middle">−2</text>
  <line class="dg-line" x1="270" y1="196" x2="270" y2="204"/>
  <text class="dg-note" x="270" y="216" dy="0.35em" text-anchor="middle">−1</text>
  <line class="dg-line" x1="350" y1="196" x2="350" y2="204"/>
  <text class="dg-note" x="350" y="216" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="390" y1="196" x2="390" y2="204"/>
  <text class="dg-note" x="390" y="216" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="430" y1="196" x2="430" y2="204"/>
  <text class="dg-note" x="430" y="216" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="470" y1="196" x2="470" y2="204"/>
  <text class="dg-note" x="470" y="216" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="306" y1="320" x2="314" y2="320"/>
  <text class="dg-note" x="302" y="320" dy="0.35em" text-anchor="end">−3i</text>
  <line class="dg-line" x1="306" y1="280" x2="314" y2="280"/>
  <text class="dg-note" x="302" y="280" dy="0.35em" text-anchor="end">−2i</text>
  <line class="dg-line" x1="306" y1="240" x2="314" y2="240"/>
  <text class="dg-note" x="302" y="240" dy="0.35em" text-anchor="end">−i</text>
  <line class="dg-line" x1="306" y1="160" x2="314" y2="160"/>
  <text class="dg-note" x="302" y="160" dy="0.35em" text-anchor="end">i</text>
  <line class="dg-line" x1="306" y1="120" x2="314" y2="120"/>
  <text class="dg-note" x="302" y="120" dy="0.35em" text-anchor="end">2i</text>
  <line class="dg-line" x1="306" y1="80" x2="314" y2="80"/>
  <text class="dg-note" x="302" y="80" dy="0.35em" text-anchor="end">3i</text>
  <line class="dg-flow" x1="310" y1="200" x2="430" y2="120"/>
  <line class="dg-line dg-dashed" x1="310" y1="200" x2="230" y2="80"/>
  <line class="dg-line dg-dashed" x1="430" y1="120" x2="430" y2="280"/>
  <polyline class="dg-line" points="363.3,164.5 361.3,161.8 359.2,159.1 357,156.6 354.7,154.2 352.2,151.9 349.7,149.8 347,147.8 344.2,145.9 341.3,144.2 338.4,142.6 335.3,141.2 332.2,140 329,138.9 325.8,138 322.6,137.2 319.2,136.7 315.9,136.3 312.6,136.1 309.2,136 305.9,136.1 302.5,136.4 299.2,136.9 295.9,137.6 292.7,138.4 289.5,139.4 286.3,140.5 283.3,141.9 280.3,143.3 277.3,145" marker-end="url(#arrow)"/>
  <circle class="dg-hot" cx="430" cy="120" r="5"/>
  <circle class="dg-hot" cx="430" cy="280" r="5"/>
  <circle class="dg-hot" cx="230" cy="80" r="5"/>
  <text x="440" y="108" dy="0.35em" text-anchor="start">3 + 2i</text>
  <text x="440" y="292" dy="0.35em" text-anchor="start">3 − 2i, the conjugate</text>
  <text x="222" y="64" dy="0.35em" text-anchor="middle">i(3 + 2i) = −2 + 3i</text>
  <text class="dg-note" x="374" y="174" dy="0.35em" text-anchor="start">√13</text>
  <text class="dg-note" x="324" y="124" dy="0.35em" text-anchor="start">a quarter turn</text>
</svg>
