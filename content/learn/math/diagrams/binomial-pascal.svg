<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Rows 0 to 6 of Pascal's triangle and one use of Pascal's rule</title>
  <desc>Pascal's triangle from row 0, a single 1, down to row 6: 1, 6, 15, 20, 15, 6, 1. Every row starts and ends with 1. In row 4, the entries 4 and 6 are highlighted, with arrows down to the highlighted 10 in row 5, since each inside entry is the sum of the two above it.</desc>
  <text class="dg-note" x="40" y="30" dy="0.35em">row 0</text>
  <text class="dg-note" x="40" y="74" dy="0.35em">row 1</text>
  <text class="dg-note" x="40" y="118" dy="0.35em">row 2</text>
  <text class="dg-note" x="40" y="162" dy="0.35em">row 3</text>
  <text class="dg-note" x="40" y="206" dy="0.35em">row 4</text>
  <text class="dg-note" x="40" y="250" dy="0.35em">row 5</text>
  <text class="dg-note" x="40" y="294" dy="0.35em">row 6</text>
  <!-- Pascal's rule: the two entries above add to the one below -->
  <line class="dg-flow" x1="300" y1="222" x2="322" y2="234" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="360" y1="222" x2="338" y2="234" marker-end="url(#arrow-flow)"/>
  <text x="360" y="30" dy="0.35em" text-anchor="middle">1</text>
  <text x="330" y="74" dy="0.35em" text-anchor="middle">1</text>
  <text x="390" y="74" dy="0.35em" text-anchor="middle">1</text>
  <text x="300" y="118" dy="0.35em" text-anchor="middle">1</text>
  <text x="360" y="118" dy="0.35em" text-anchor="middle">2</text>
  <text x="420" y="118" dy="0.35em" text-anchor="middle">1</text>
  <text x="270" y="162" dy="0.35em" text-anchor="middle">1</text>
  <text x="330" y="162" dy="0.35em" text-anchor="middle">3</text>
  <text x="390" y="162" dy="0.35em" text-anchor="middle">3</text>
  <text x="450" y="162" dy="0.35em" text-anchor="middle">1</text>
  <text x="240" y="206" dy="0.35em" text-anchor="middle">1</text>
  <circle class="dg-hot" cx="300" cy="206" r="16"/>
  <text class="dg-on-hot" x="300" y="206" dy="0.35em" text-anchor="middle">4</text>
  <circle class="dg-hot" cx="360" cy="206" r="16"/>
  <text class="dg-on-hot" x="360" y="206" dy="0.35em" text-anchor="middle">6</text>
  <text x="420" y="206" dy="0.35em" text-anchor="middle">4</text>
  <text x="480" y="206" dy="0.35em" text-anchor="middle">1</text>
  <text x="210" y="250" dy="0.35em" text-anchor="middle">1</text>
  <text x="270" y="250" dy="0.35em" text-anchor="middle">5</text>
  <circle class="dg-hot" cx="330" cy="250" r="16"/>
  <text class="dg-on-hot" x="330" y="250" dy="0.35em" text-anchor="middle">10</text>
  <text x="390" y="250" dy="0.35em" text-anchor="middle">10</text>
  <text x="450" y="250" dy="0.35em" text-anchor="middle">5</text>
  <text x="510" y="250" dy="0.35em" text-anchor="middle">1</text>
  <text x="180" y="294" dy="0.35em" text-anchor="middle">1</text>
  <text x="240" y="294" dy="0.35em" text-anchor="middle">6</text>
  <text x="300" y="294" dy="0.35em" text-anchor="middle">15</text>
  <text x="360" y="294" dy="0.35em" text-anchor="middle">20</text>
  <text x="420" y="294" dy="0.35em" text-anchor="middle">15</text>
  <text x="480" y="294" dy="0.35em" text-anchor="middle">6</text>
  <text x="540" y="294" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="560" y="216" dy="0.35em" text-anchor="middle">4 + 6 = 10</text>
</svg>
