<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>Two staircases of 1 + 2 + 3 + 4 + 5 squares make a rectangle</title>
  <desc>A rectangle 6 squares wide and 5 rows tall. The highlighted staircase on the left has 1, 2, 3, 4, and 5 squares in its rows, and the plain staircase on the right has 5, 4, 3, 2, and 1, the same sum backward. Each row holds 6 squares, so the two staircases together hold 5 × 6 = 30, and each one holds 15.</desc>
  <!-- The whole 5 by 6 rectangle -->
  <rect class="dg-box" x="220" y="40" width="240" height="200"/>
  <!-- One staircase, 1 + 2 + 3 + 4 + 5, as one shape -->
  <polygon class="dg-hot" points="220,40 260,40 260,80 300,80 300,120 340,120 340,160 380,160 380,200 420,200 420,240 220,240"/>
  <!-- Grid lines on top -->
  <line class="dg-line" x1="260" y1="40" x2="260" y2="240"/>
  <line class="dg-line" x1="300" y1="40" x2="300" y2="240"/>
  <line class="dg-line" x1="340" y1="40" x2="340" y2="240"/>
  <line class="dg-line" x1="380" y1="40" x2="380" y2="240"/>
  <line class="dg-line" x1="420" y1="40" x2="420" y2="240"/>
  <line class="dg-line" x1="220" y1="80" x2="460" y2="80"/>
  <line class="dg-line" x1="220" y1="120" x2="460" y2="120"/>
  <line class="dg-line" x1="220" y1="160" x2="460" y2="160"/>
  <line class="dg-line" x1="220" y1="200" x2="460" y2="200"/>
  <text class="dg-note" x="208" y="60" dy="0.35em" text-anchor="end">1 + 5</text>
  <text class="dg-note" x="208" y="100" dy="0.35em" text-anchor="end">2 + 4</text>
  <text class="dg-note" x="208" y="140" dy="0.35em" text-anchor="end">3 + 3</text>
  <text class="dg-note" x="208" y="180" dy="0.35em" text-anchor="end">4 + 2</text>
  <text class="dg-note" x="208" y="220" dy="0.35em" text-anchor="end">5 + 1</text>
  <text x="340" y="266" dy="0.35em" text-anchor="middle">6 columns wide, 5 rows tall: 2S = 5 × 6</text>
  <text class="dg-note" x="476" y="80" dy="0.35em">each row: 6 squares</text>
</svg>
