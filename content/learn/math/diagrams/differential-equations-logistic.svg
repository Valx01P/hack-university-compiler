<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Logistic growth toward a carrying capacity of 1000 from three starting sizes</title>
  <desc>Three solutions of the logistic equation with r = 0.5 and K = 1000. Starting at 100, the population rises slowly, fastest at 500, then levels off below the dashed line at 1000. Starting at 400 it rises sooner. Starting at 1500 it falls toward 1000. Every solution approaches the carrying capacity.</desc>
