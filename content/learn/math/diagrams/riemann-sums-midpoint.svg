  <text class="dg-note" x="172" y="165.5" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="177" y1="113.2" x2="187" y2="113.2"/>
  <text class="dg-note" x="172" y="113.2" dy="0.35em" text-anchor="end">3</text>
