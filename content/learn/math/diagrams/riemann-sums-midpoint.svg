<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The midpoint sum for x² on [0, 2] with four rectangles</title>
  <desc>The curve y = x² from 0 to 2, cut into four pieces of width ½. Each rectangle takes its height from the curve at the middle of its piece, marked with a dot, so each rectangle pokes above the curve on one side and dips below it on the other. They total 21/8, very close to the true area 8/3.</desc>
