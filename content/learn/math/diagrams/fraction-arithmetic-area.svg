<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>2/3 × 3/4 as an area in a unit square</title>
  <desc>A unit square cut into 3 rows and 4 columns, 12 equal small rectangles. A block 2 rows tall and 3 columns wide is highlighted: it is 2/3 of the height and 3/4 of the width, and it covers 6 of the 12 small rectangles. So 2/3 × 3/4 = 6/12 = 1/2.</desc>
  <rect class="dg-box" x="80" y="50" width="300" height="300"/>
  <rect class="dg-hot" x="80" y="50" width="225" height="200"/>
  <line class="dg-line" x1="155" y1="50" x2="155" y2="350"/>
  <line class="dg-line" x1="230" y1="50" x2="230" y2="350"/>
  <line class="dg-line" x1="305" y1="50" x2="305" y2="350"/>
  <line class="dg-line" x1="80" y1="150" x2="380" y2="150"/>
  <line class="dg-line" x1="80" y1="250" x2="380" y2="250"/>
  <line class="dg-flow" x1="80" y1="32" x2="305" y2="32"/>
  <text x="192" y="16" dy="0.35em" text-anchor="middle">3/4 wide</text>
  <line class="dg-flow" x1="62" y1="50" x2="62" y2="250"/>
  <text x="50" y="150" dy="0.35em" text-anchor="end">2/3</text>
  <text x="50" y="168" dy="0.35em" text-anchor="end">tall</text>
  <text x="230" y="374" dy="0.35em" text-anchor="middle">1 by 1, in 12 equal pieces</text>
  <text class="dg-heading" x="420" y="150" dy="0.35em">6 of 12 pieces</text>
  <text class="dg-code" x="420" y="186" dy="0.35em">2/3 × 3/4 = 6/12</text>
  <text class="dg-code" x="495" y="214" dy="0.35em">= 1/2</text>
</svg>
