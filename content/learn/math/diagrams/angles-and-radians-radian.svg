<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>One radian is the angle whose arc is as long as the radius</title>
  <desc>A circle of radius r centered at O. Two radii make a central angle, and the arc between them, drawn thick, has length r, the same as each radius. That angle is 1 radian, about 57.3°. A full turn's arc is the whole circumference, 2πr, so a full turn is 2π radians.</desc>
