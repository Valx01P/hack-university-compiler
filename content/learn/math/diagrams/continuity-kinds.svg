<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <title>Four kinds of discontinuity at a point</title>
  <desc>Four small graphs, each with a break at the middle of its x axis. Removable: a smooth curve with an open circle where the point is missing and a filled dot above it at the wrong height. Jump: the left piece ends at a filled dot and the right piece starts higher at an open circle. Infinite: the curve shoots up on the right and down on the left beside a dashed vertical asymptote. Oscillating: the curve swings up and down faster and faster as it nears the middle.</desc>
