<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>The reference triangle for x = a sec θ</title>
  <desc>A right triangle with angle θ. The hypotenuse is x, the side next to θ is a, and the side opposite θ is the square root of x² − a², by the Pythagorean theorem. So sec θ = x/a, which is the substitution, and tan θ is the opposite side over a.</desc>
  <polygon class="dg-box" points="60,220 330,220 330,44.7"/>
  <path class="dg-line" d="M316 220 V206 H330"/>
  <path class="dg-flow" d="M104 220 A44 44 0 0 0 96.9 196"/>
  <text x="118" y="206" dy="0.35em" text-anchor="middle">θ</text>
  <text x="195" y="240" dy="0.35em" text-anchor="middle">a</text>
  <text x="342" y="132.3" dy="0.35em" text-anchor="start">√(x² − a²)</text>
  <text x="173" y="114.3" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-heading" x="470" y="46" dy="0.35em" text-anchor="start">x = a sec θ</text>
  <text class="dg-code" x="470" y="86" dy="0.35em" text-anchor="start">sec θ = x/a</text>
  <text class="dg-code" x="470" y="116" dy="0.35em" text-anchor="start">tan θ = √(x² − a²)/a</text>
  <text class="dg-code" x="470" y="146" dy="0.35em" text-anchor="start">sin θ = √(x² − a²)/x</text>
</svg>
