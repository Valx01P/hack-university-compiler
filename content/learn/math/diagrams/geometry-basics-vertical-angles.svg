<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>Two crossing lines make two pairs of vertical angles</title>
  <desc>Two lines cross at point O and make four angles, numbered 1 to 4 going around. Angles 1 and 3 are across from each other, so they are vertical angles, and both are highlighted at 40°. Angles 2 and 4 are the other vertical pair, 140° each. Angles 1 and 2 sit side by side along a line, a linear pair, so 40° + 140° = 180°.</desc>
  <line class="dg-line" x1="250" y1="140" x2="447.3" y2="68.2"/>
  <line class="dg-line" x1="250" y1="140" x2="52.7" y2="211.8"/>
  <line class="dg-line" x1="250" y1="140" x2="52.7" y2="68.2"/>
  <line class="dg-line" x1="250" y1="140" x2="447.3" y2="211.8"/>
  <path class="dg-hot" d="M250 140 L293.2 155.7 A46 46 0 0 0 293.2 124.3 Z"/>
  <path class="dg-hot" d="M250 140 L206.8 124.3 A46 46 0 0 0 206.8 155.7 Z"/>
  <path class="dg-line" d="M274.4 131.1 A26 26 0 0 0 225.6 131.1"/>
  <path class="dg-line" d="M225.6 148.9 A26 26 0 0 0 274.4 148.9"/>
  <text x="320" y="140" dy="0.35em" text-anchor="middle">1</text>
  <text x="250" y="84" dy="0.35em" text-anchor="middle">2</text>
  <text x="180" y="140" dy="0.35em" text-anchor="middle">3</text>
  <text x="250" y="196" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="280" y="176" dy="0.35em" text-anchor="middle">O</text>
  <text class="dg-code" x="570" y="60" dy="0.35em" text-anchor="middle">∠1 = ∠3 = 40°</text>
  <text class="dg-code" x="570" y="90" dy="0.35em" text-anchor="middle">∠2 = ∠4 = 140°</text>
  <text class="dg-code" x="570" y="120" dy="0.35em" text-anchor="middle">∠1 + ∠2 = 180°</text>
</svg>
