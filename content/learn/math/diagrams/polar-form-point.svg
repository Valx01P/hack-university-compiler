<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A point in polar coordinates, with its distance r and angle θ</title>
  <desc>The point P sits at distance r from the origin O, along a highlighted segment that makes angle θ with the positive x-axis. Dashed lines drop from P to the x-axis, showing the horizontal leg x = r cos θ and the vertical leg y = r sin θ of a right triangle with hypotenuse r.</desc>
  <!-- Axes -->
  <line class="dg-line" x1="200" y1="240" x2="600" y2="240" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="260" y1="270" x2="260" y2="20" marker-end="url(#arrow)"/>
  <!-- The legs x and y -->
  <line class="dg-line dg-dashed" x1="433.4" y1="104.6" x2="433.4" y2="240"/>
  <text x="346.7" y="260" dy="0.35em" text-anchor="middle">x = r cos θ</text>
  <text x="445.4" y="172.3" dy="0.35em">y = r sin θ</text>
  <!-- The distance r -->
  <line class="dg-flow" x1="260" y1="240" x2="433.4" y2="104.6"/>
  <text x="345.3" y="151.5" dy="0.35em" text-anchor="end">r</text>
  <path class="dg-line" d="M310 240 A50 50 0 0 0 299.4 209.2"/>
  <text x="320" y="224" dy="0.35em">θ</text>
  <circle class="dg-hot" cx="433.4" cy="104.6" r="6"/>
  <text class="dg-heading" x="445.4" y="92.6" dy="0.35em">P</text>
  <text class="dg-note" x="250" y="256" dy="0.35em" text-anchor="end">O</text>
</svg>
