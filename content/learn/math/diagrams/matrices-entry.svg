<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>Where the entry a₂₃ sits in a 3 × 4 matrix</title>
  <desc>A grid of 3 rows and 4 columns of entries, each labeled a with its row and column number. The label row 2 on the left and column 3 on top are in bold. The cell where they cross, a₂₃, is highlighted: the first number is the row and the second is the column.</desc>
  <rect class="dg-box" x="200" y="70" width="80" height="50" rx="0"/>
  <text x="240" y="95" dy="0.35em" text-anchor="middle">a₁₁</text>
  <rect class="dg-box" x="280" y="70" width="80" height="50" rx="0"/>
  <text x="320" y="95" dy="0.35em" text-anchor="middle">a₁₂</text>
  <rect class="dg-box" x="360" y="70" width="80" height="50" rx="0"/>
  <text x="400" y="95" dy="0.35em" text-anchor="middle">a₁₃</text>
  <rect class="dg-box" x="440" y="70" width="80" height="50" rx="0"/>
  <text x="480" y="95" dy="0.35em" text-anchor="middle">a₁₄</text>
  <rect class="dg-box" x="200" y="120" width="80" height="50" rx="0"/>
  <text x="240" y="145" dy="0.35em" text-anchor="middle">a₂₁</text>
  <rect class="dg-box" x="280" y="120" width="80" height="50" rx="0"/>
  <text x="320" y="145" dy="0.35em" text-anchor="middle">a₂₂</text>
  <rect class="dg-hot" x="360" y="120" width="80" height="50" rx="0"/>
  <text class="dg-on-hot" x="400" y="145" dy="0.35em" text-anchor="middle">a₂₃</text>
  <rect class="dg-box" x="440" y="120" width="80" height="50" rx="0"/>
  <text x="480" y="145" dy="0.35em" text-anchor="middle">a₂₄</text>
  <rect class="dg-box" x="200" y="170" width="80" height="50" rx="0"/>
  <text x="240" y="195" dy="0.35em" text-anchor="middle">a₃₁</text>
  <rect class="dg-box" x="280" y="170" width="80" height="50" rx="0"/>
  <text x="320" y="195" dy="0.35em" text-anchor="middle">a₃₂</text>
  <rect class="dg-box" x="360" y="170" width="80" height="50" rx="0"/>
  <text x="400" y="195" dy="0.35em" text-anchor="middle">a₃₃</text>
  <rect class="dg-box" x="440" y="170" width="80" height="50" rx="0"/>
  <text x="480" y="195" dy="0.35em" text-anchor="middle">a₃₄</text>
  <text class="dg-note" x="240" y="52" dy="0.35em" text-anchor="middle">column 1</text>
  <text class="dg-note" x="320" y="52" dy="0.35em" text-anchor="middle">column 2</text>
  <text class="dg-heading" x="400" y="52" dy="0.35em" text-anchor="middle">column 3</text>
  <text class="dg-note" x="480" y="52" dy="0.35em" text-anchor="middle">column 4</text>
  <text class="dg-note" x="186" y="95" dy="0.35em" text-anchor="end">row 1</text>
  <text class="dg-heading" x="186" y="145" dy="0.35em" text-anchor="end">row 2</text>
  <text class="dg-note" x="186" y="195" dy="0.35em" text-anchor="end">row 3</text>
  <text x="360" y="248" dy="0.35em" text-anchor="middle">a₂₃: row 2 first, then column 3</text>
</svg>
