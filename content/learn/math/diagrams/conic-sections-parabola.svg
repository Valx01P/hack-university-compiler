<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>The parabola x² = 8y with its focus F = (0, 2) and directrix y = −2</title>
  <desc>Axes with the upward parabola x² = 8y, whose vertex is the origin. The focus F = (0, 2) is 2 units above the vertex, and the dashed directrix y = −2 is 2 units below it, so p = 2. The point P = (4, 2) on the parabola is 4 units from F and 4 units straight down to the directrix at D = (4, −2). Every point of the parabola is equally far from the focus and the directrix.</desc>
