<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Rotating the point (x, y) by an angle β about the origin</title>
  <desc>The point (x, y) = (r cos α, r sin α) at angle α and distance r from the origin. Turning it by β about the origin moves it along a circle of radius r to (r cos(α + β), r sin(α + β)). The sum formulas turn that into (x cos β − y sin β, x sin β + y cos β).</desc>
