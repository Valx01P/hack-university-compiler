<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Unwrapping the unit circle into the graph of sine</title>
  <desc>On the left, the unit circle with two points, at angle π/3 and at angle 7π/6. On the right, the graph of y = sin x for x from 0 to 2π. Dashed horizontal lines carry each point's height across to the graph: the point at π/3 has height √3/2, about 0.87, and the point at 7π/6 has height −1/2. The angle on the circle becomes the x on the graph.</desc>
