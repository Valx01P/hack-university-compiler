<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>The unit square under a rotation, a reflection, a shear, and a projection</title>
  <desc>Four panels, each with the unit square outlined and dashed and its image shaded. A 30 degree rotation turns the square about the origin. A reflection across the y-axis flips it to the left. A shear by 1 slants it into a parallelogram with the same area. A projection onto the line y = x flattens it to a segment along that line, so its area is 0.</desc>
  <line class="dg-line" x1="26.2" y1="165" x2="169.2" y2="165" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="95" y1="198" x2="95" y2="71.5" marker-end="url(#arrow)"/>
  <polygon class="dg-hot" points="95,165 142.6,137.5 115.1,89.9 67.5,117.4"/>
  <polygon class="dg-off" points="95,165 150,165 150,110 95,110"/>
  <text class="dg-note" x="95" y="230" dy="0.35em" text-anchor="middle">rotate 30°</text>
  <line class="dg-line" x1="196.2" y1="165" x2="339.2" y2="165" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="265" y1="198" x2="265" y2="71.5" marker-end="url(#arrow)"/>
  <polygon class="dg-hot" points="265,165 210,165 210,110 265,110"/>
  <polygon class="dg-off" points="265,165 320,165 320,110 265,110"/>
  <text class="dg-note" x="265" y="230" dy="0.35em" text-anchor="middle">reflect across the y-axis</text>
  <line class="dg-line" x1="356.2" y1="165" x2="499.2" y2="165" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="425" y1="198" x2="425" y2="71.5" marker-end="url(#arrow)"/>
  <polygon class="dg-hot" points="425,165 480,165 535,110 480,110"/>
  <polygon class="dg-off" points="425,165 480,165 480,110 425,110"/>
  <text class="dg-note" x="425" y="230" dy="0.35em" text-anchor="middle">shear by 1</text>
  <line class="dg-line" x1="516.2" y1="165" x2="659.2" y2="165" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="585" y1="198" x2="585" y2="71.5" marker-end="url(#arrow)"/>
  <line class="dg-line dg-dashed" x1="552" y1="198" x2="659.2" y2="90.8"/>
  <line class="dg-flow" x1="585" y1="165" x2="640" y2="110"/>
  <polygon class="dg-off" points="585,165 640,165 640,110 585,110"/>
  <text class="dg-note" x="585" y="230" dy="0.35em" text-anchor="middle">project onto y = x</text>
</svg>
