<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>A corner at x = 1: the left secants approach slope 2, the right piece has slope 3</title>
  <desc>The graph is y = x² for x up to 1 and the line y = 3x − 2 after it, meeting at the point (1, 1). Two dashed secants from (1, 1) to points on the left have slopes 1 and 1.5, and they pivot toward the highlighted line of slope 2. The right piece rises more steeply, with slope 3, so there is no single tangent at 1.</desc>
  <line class="dg-line" x1="60.0" y1="334.1" x2="616.0" y2="334.1" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="182.4" y1="390.0" x2="182.4" y2="24.0" marker-end="url(#arrow)"/>
  <text class="dg-note" x="626.0" y="334.1" dy="0.35em" text-anchor="start">x</text>
  <text class="dg-note" x="182.4" y="12.0" dy="0.35em" text-anchor="middle">y</text>
  <polyline class="dg-line" points="70.0,311.5 76.8,314.2 83.7,316.7 90.5,319.0 97.3,321.1 104.1,323.1 111.0,325.0 117.8,326.6 124.6,328.1 131.4,329.4 138.3,330.6 145.1,331.6 151.9,332.4 158.7,333.1 165.6,333.5 172.4,333.9 179.2,334.0 186.0,334.0 192.9,333.9 199.7,333.5 206.5,333.0 213.3,332.4 220.2,331.5 227.0,330.5 233.8,329.3 240.6,328.0 247.5,326.5 254.3,324.9 261.1,323.0 267.9,321.0 274.8,318.9 281.6,316.5 288.4,314.0 295.2,311.4 302.1,308.6 308.9,305.6 315.7,302.4 322.6,299.1 329.4,295.6 336.2,291.9 343.0,288.1"/>
  <line class="dg-line" x1="343.0" y1="288.1" x2="575.9" y2="88.2"/>
  <line class="dg-line dg-dashed" x1="118.2" y1="352.4" x2="487.6" y2="246.8"/>
  <line class="dg-line dg-dashed" x1="182.4" y1="357.0" x2="487.6" y2="226.1"/>
  <line class="dg-flow" x1="182.4" y1="380.0" x2="583.9" y2="150.3"/>
  <circle class="dg-box" cx="182.4" cy="334.1" r="4"/>
  <circle class="dg-box" cx="262.7" cy="322.6" r="4"/>
  <circle class="dg-hot" cx="343.0" cy="288.1" r="5"/>
  <text x="567.9" y="88.2" dy="0.35em" text-anchor="end">right piece 3x − 2, slope 3</text>
  <text x="591.9" y="150.3" dy="0.35em" text-anchor="start">slope 2</text>
  <text class="dg-note" x="493.6" y="262.8" dy="0.35em" text-anchor="start">slope 1</text>
  <text class="dg-note" x="493.6" y="230.1" dy="0.35em" text-anchor="start">slope 1.5</text>
  <text class="dg-code" x="94.1" y="277.6" dy="0.35em" text-anchor="start">y = x²</text>
  <text class="dg-note" x="355.0" y="292.1" dy="0.35em" text-anchor="start">(1, 1)</text>
</svg>
