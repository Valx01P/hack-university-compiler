<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Partial sums of 1/2 + 1/4 + 1/8 + ⋯ climbing toward 1</title>
  <desc>Bars show the partial sums s_n of 1/2 + 1/4 + 1/8 + ⋯ for n from 1 to 8: 1/2, 3/4, 7/8, 15/16, and on. Each bar is taller than the one before by half the gap left to the dashed line at 1. The gap after n terms is 1/2ⁿ, which goes to 0, so the sum of the series is 1.</desc>
  <rect class="dg-box" x="118.4" y="154.3" width="41.4" height="95.7"/>
  <rect class="dg-box" x="177.5" y="106.5" width="41.4" height="143.5"/>
  <rect class="dg-box" x="236.6" y="82.6" width="41.4" height="167.4"/>
  <rect class="dg-box" x="295.7" y="70.7" width="41.4" height="179.3"/>
  <rect class="dg-box" x="354.8" y="64.7" width="41.4" height="185.3"/>
  <rect class="dg-box" x="413.9" y="61.7" width="41.4" height="188.3"/>
  <rect class="dg-box" x="473" y="60.2" width="41.4" height="189.8"/>
  <rect class="dg-box" x="532" y="59.4" width="41.4" height="190.6"/>
  <line class="dg-line" x1="74" y1="250" x2="614" y2="250" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="80" y1="256" x2="80" y2="16" marker-end="url(#arrow)"/>
  <text class="dg-note" x="622" y="250" dy="0.35em" text-anchor="start">n</text>
  <text class="dg-note" x="80" y="6" dy="0.35em" text-anchor="middle">sₙ</text>
  <line class="dg-line" x1="139.1" y1="246" x2="139.1" y2="254"/>
  <text class="dg-note" x="139.1" y="266" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="198.2" y1="246" x2="198.2" y2="254"/>
  <text class="dg-note" x="198.2" y="266" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="257.3" y1="246" x2="257.3" y2="254"/>
  <text class="dg-note" x="257.3" y="266" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="316.4" y1="246" x2="316.4" y2="254"/>
  <text class="dg-note" x="316.4" y="266" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="375.5" y1="246" x2="375.5" y2="254"/>
  <text class="dg-note" x="375.5" y="266" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="434.5" y1="246" x2="434.5" y2="254"/>
  <text class="dg-note" x="434.5" y="266" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="493.6" y1="246" x2="493.6" y2="254"/>
  <text class="dg-note" x="493.6" y="266" dy="0.35em" text-anchor="middle">7</text>
  <line class="dg-line" x1="552.7" y1="246" x2="552.7" y2="254"/>
  <text class="dg-note" x="552.7" y="266" dy="0.35em" text-anchor="middle">8</text>
  <line class="dg-line" x1="76" y1="154.3" x2="84" y2="154.3"/>
  <text class="dg-note" x="72" y="154.3" dy="0.35em" text-anchor="end">1/2</text>
  <line class="dg-line" x1="76" y1="58.7" x2="84" y2="58.7"/>
