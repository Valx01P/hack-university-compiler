  <text class="dg-note" x="198.2" y="120.5" dy="0.35em" text-anchor="middle">3/4</text>
  <text class="dg-note" x="257.3" y="96.6" dy="0.35em" text-anchor="middle">7/8</text>
  <text class="dg-note" x="316.4" y="84.7" dy="0.35em" text-anchor="middle">15/16</text>
  <text class="dg-note" x="600" y="46.7" dy="0.35em" text-anchor="end">the sum, 1</text>
