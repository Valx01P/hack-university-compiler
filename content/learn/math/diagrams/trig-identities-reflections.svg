<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The angles θ, −θ, and π/2 − θ on the unit circle</title>
  <desc>A unit circle with the point P = (cos θ, sin θ) at an angle θ of about 25 degrees. Its reflection across the x-axis is the point at −θ, which is (cos θ, −sin θ), so cosine is unchanged and sine changes sign. Its reflection across the dashed line y = x is the point at π/2 − θ, which is (sin θ, cos θ), so sine and cosine trade places.</desc>
