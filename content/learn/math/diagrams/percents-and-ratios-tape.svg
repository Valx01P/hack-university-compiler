<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200">
  <title>A tape diagram splitting 500 in the ratio 2 : 3</title>
  <desc>A bar for the total of 500 is cut into 5 equal parts of 100. The first 2 parts are highlighted as the first share, 200. The other 3 parts are the second share, 300. The shares compare as 2 to 3, and each one is a fraction of the total, two fifths and three fifths.</desc>
  <text class="dg-heading" x="340" y="30" dy="0.35em" text-anchor="middle">Total 500, cut into 2 + 3 = 5 equal parts</text>
  <!-- First share: one highlighted shape, divided by a line. -->
  <rect class="dg-hot" x="40" y="60" width="236" height="56" rx="8"/>
  <line class="dg-line" x1="158" y1="60" x2="158" y2="116"/>
  <text class="dg-on-hot" x="99" y="88" dy="0.35em" text-anchor="middle">100</text>
  <text class="dg-on-hot" x="217" y="88" dy="0.35em" text-anchor="middle">100</text>
  <!-- Second share. -->
  <rect class="dg-box" x="284" y="60" width="356" height="56" rx="8"/>
  <line class="dg-line" x1="403" y1="60" x2="403" y2="116"/>
  <line class="dg-line" x1="521" y1="60" x2="521" y2="116"/>
  <text x="343" y="88" dy="0.35em" text-anchor="middle">100</text>
  <text x="462" y="88" dy="0.35em" text-anchor="middle">100</text>
  <text x="580" y="88" dy="0.35em" text-anchor="middle">100</text>
  <!-- Brackets under each share. -->
  <path class="dg-line" d="M40 132 V144 H276 V132"/>
  <path class="dg-line" d="M284 132 V144 H640 V132"/>
  <text x="158" y="170" dy="0.35em" text-anchor="middle">first share: 2 parts = 200</text>
  <text x="462" y="170" dy="0.35em" text-anchor="middle">second share: 3 parts = 300</text>
</svg>
