<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>Signed area under y = x − 1 from 0 to 3</title>
  <desc>The line y = x − 1 dips below the x-axis from 0 to 1, making a triangle of area one half under the axis, and rises above it from 1 to 3, making a triangle of area 2. The integral counts the part above as positive and the part below as negative, so it is 2 − ½ = 3/2.</desc>
  <!-- Axes -->
  <line class="dg-line" x1="112" y1="215.7" x2="570" y2="215.7" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="182.9" y1="338" x2="182.9" y2="20" marker-end="url(#arrow)"/>
  <text class="dg-note" x="578" y="215.7" dy="0.35em">x</text>
  <text class="dg-note" x="182.9" y="12" text-anchor="middle">y</text>
  <line class="dg-line" x1="287.6" y1="210.7" x2="287.6" y2="220.7"/>
  <text class="dg-note" x="287.6" y="233.7" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="392.4" y1="210.7" x2="392.4" y2="220.7"/>
  <text class="dg-note" x="392.4" y="233.7" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="497.1" y1="210.7" x2="497.1" y2="220.7"/>
  <text class="dg-note" x="497.1" y="233.7" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="177.9" y1="287.1" x2="187.9" y2="287.1"/>
  <text class="dg-note" x="172.9" y="287.1" dy="0.35em" text-anchor="end">−1</text>
  <line class="dg-line" x1="177.9" y1="144.3" x2="187.9" y2="144.3"/>
  <text class="dg-note" x="172.9" y="144.3" dy="0.35em" text-anchor="end">1</text>
  <line class="dg-line" x1="177.9" y1="72.9" x2="187.9" y2="72.9"/>
  <text class="dg-note" x="172.9" y="72.9" dy="0.35em" text-anchor="end">2</text>
  <!-- The region above the axis, counted as positive -->
  <polygon class="dg-hot" points="287.6,215.7 497.1,72.9 497.1,215.7"/>
  <!-- The region below the axis, counted as negative: a different class so the two never merge -->
  <polygon class="dg-box" points="182.9,215.7 182.9,287.1 287.6,215.7"/>
  <!-- The line y = x − 1 -->
  <line class="dg-flow" x1="151.4" y1="308.6" x2="528.6" y2="51.4"/>
  <text class="dg-on-hot" x="439.5" y="172.9" dy="0.35em" text-anchor="middle">+2</text>
  <text class="dg-code" x="214.3" y="239.3" dy="0.35em" text-anchor="middle">−½</text>
  <text class="dg-code" x="381.9" y="346" dy="0.35em" text-anchor="middle">∫ from 0 to 3 of (x − 1) dx = 2 − ½ = 3/2</text>
</svg>
