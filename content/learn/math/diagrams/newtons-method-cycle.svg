<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>Newton's method stuck in a cycle on x³ − 2x + 2</title>
  <desc>The curve y = x³ − 2x + 2 has one real root, near −1.769. Starting at 0, the tangent at (0, 2) meets the x-axis at 1. The tangent at (1, 1) meets it back at 0, so the method bounces between 0 and 1 forever and never reaches the root.</desc>
  <!-- Axes -->
  <line class="dg-line" x1="92" y1="230" x2="590" y2="230" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="364" y1="318" x2="364" y2="20" marker-end="url(#arrow)"/>
  <text class="dg-note" x="598" y="230" dy="0.35em">x</text>
  <text class="dg-note" x="364" y="12" text-anchor="middle">y</text>
  <line class="dg-line" x1="124" y1="225" x2="124" y2="235"/>
  <text class="dg-note" x="124" y="248" dy="0.35em" text-anchor="middle">−2</text>
  <line class="dg-line" x1="244" y1="225" x2="244" y2="235"/>
  <line class="dg-line" x1="484" y1="225" x2="484" y2="235"/>
  <text class="dg-note" x="484" y="248" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="359" y1="150" x2="369" y2="150"/>
  <line class="dg-line" x1="359" y1="70" x2="369" y2="70"/>
  <text class="dg-note" x="354" y="70" dy="0.35em" text-anchor="end">4</text>
