  <text class="dg-note" x="372" y="136" dy="0.35em" text-anchor="start">(0, 2)</text>
  <text class="dg-note" x="494" y="184" dy="0.35em" text-anchor="start">(1, 1)</text>
  <text class="dg-code" x="424" y="270" dy="0.35em" text-anchor="middle">0 → 1 → 0 → 1 → …</text>
