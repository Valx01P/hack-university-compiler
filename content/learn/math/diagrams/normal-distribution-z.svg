<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>An SAT score and an ACT score compared on one z-score scale</title>
  <desc>Three aligned number lines. The top is SAT scores with mean 1050 and standard deviation 200, the middle is ACT scores with mean 21 and standard deviation 5, and the bottom is the z-score, from −2 to 2. The SAT score 1300 sits at z = 1.25 and the ACT score 28 at z = 1.4, a little further right, so the ACT score is the stronger one.</desc>
  <text class="dg-heading" x="30" y="60" dy="0.35em" text-anchor="start">SAT</text>
  <line class="dg-line" x1="90" y1="60" x2="600" y2="60"/>
  <line class="dg-line" x1="100" y1="55" x2="100" y2="65"/>
  <text class="dg-note" x="100" y="76" dy="0.35em" text-anchor="middle">650</text>
  <line class="dg-line" x1="220" y1="55" x2="220" y2="65"/>
  <text class="dg-note" x="220" y="76" dy="0.35em" text-anchor="middle">850</text>
  <line class="dg-line" x1="340" y1="55" x2="340" y2="65"/>
  <text class="dg-note" x="340" y="76" dy="0.35em" text-anchor="middle">1050</text>
  <line class="dg-line" x1="460" y1="55" x2="460" y2="65"/>
  <text class="dg-note" x="460" y="76" dy="0.35em" text-anchor="middle">1250</text>
  <line class="dg-line" x1="580" y1="55" x2="580" y2="65"/>
  <text class="dg-note" x="580" y="76" dy="0.35em" text-anchor="middle">1450</text>
  <text class="dg-heading" x="30" y="130" dy="0.35em" text-anchor="start">ACT</text>
  <line class="dg-line" x1="90" y1="130" x2="600" y2="130"/>
  <line class="dg-line" x1="100" y1="125" x2="100" y2="135"/>
  <text class="dg-note" x="100" y="146" dy="0.35em" text-anchor="middle">11</text>
  <line class="dg-line" x1="220" y1="125" x2="220" y2="135"/>
  <text class="dg-note" x="220" y="146" dy="0.35em" text-anchor="middle">16</text>
  <line class="dg-line" x1="340" y1="125" x2="340" y2="135"/>
  <text class="dg-note" x="340" y="146" dy="0.35em" text-anchor="middle">21</text>
  <line class="dg-line" x1="460" y1="125" x2="460" y2="135"/>
  <text class="dg-note" x="460" y="146" dy="0.35em" text-anchor="middle">26</text>
  <line class="dg-line" x1="580" y1="125" x2="580" y2="135"/>
  <text class="dg-note" x="580" y="146" dy="0.35em" text-anchor="middle">31</text>
  <text class="dg-heading" x="30" y="200" dy="0.35em" text-anchor="start">z</text>
  <line class="dg-line" x1="90" y1="200" x2="600" y2="200"/>
  <line class="dg-line" x1="100" y1="195" x2="100" y2="205"/>
  <text class="dg-note" x="100" y="216" dy="0.35em" text-anchor="middle">−2</text>
  <line class="dg-line" x1="220" y1="195" x2="220" y2="205"/>
  <text class="dg-note" x="220" y="216" dy="0.35em" text-anchor="middle">−1</text>
  <line class="dg-line" x1="340" y1="195" x2="340" y2="205"/>
  <text class="dg-note" x="340" y="216" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line" x1="460" y1="195" x2="460" y2="205"/>
  <text class="dg-note" x="460" y="216" dy="0.35em" text-anchor="middle">+1</text>
  <line class="dg-line" x1="580" y1="195" x2="580" y2="205"/>
  <text class="dg-note" x="580" y="216" dy="0.35em" text-anchor="middle">+2</text>
  <line class="dg-line dg-dashed" x1="490" y1="44" x2="490" y2="216"/>
  <line class="dg-flow dg-dashed" x1="508" y1="114" x2="508" y2="216"/>
  <circle class="dg-hot" cx="490" cy="60" r="6"/>
  <circle class="dg-hot" cx="508" cy="130" r="6"/>
  <text class="dg-code" x="480" y="40" dy="0.35em" text-anchor="end">1300</text>
  <text class="dg-code" x="518" y="110" dy="0.35em" text-anchor="start">28</text>
  <text class="dg-code" x="482" y="236" dy="0.35em" text-anchor="end">1.25</text>
  <text class="dg-code" x="516" y="236" dy="0.35em" text-anchor="start">1.4</text>
</svg>
