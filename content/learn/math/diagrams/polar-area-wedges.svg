<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
  <title>The cardioid r = 1 + cos θ cut into thin wedges from the origin</title>
  <desc>The region inside the cardioid r = 1 + cos θ is divided by rays from the origin into thin wedges, each spanning the same small angle Δθ. One wedge, between θ = π/6 and θ = π/6 + Δθ, is highlighted. It is nearly a sector of a circle with radius r = f(θ), so its area is about ½ r² Δθ, and adding all the wedges gives the area.</desc>
