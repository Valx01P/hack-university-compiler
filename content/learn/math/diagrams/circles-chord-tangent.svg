<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>The perpendicular from the center bisects a chord, and a tangent meets the radius at a right angle</title>
  <desc>On the left, a circle with center O and a chord AB. The perpendicular from O meets the chord at its midpoint M, making a right triangle with legs d and half the chord and hypotenuse r. On the right, a second circle with center O and a point P outside it. The tangent from P touches the circle at T, where it is perpendicular to the radius OT, so OT, TP, and OP make a right triangle with hypotenuse OP.</desc>
  <circle class="dg-box" cx="150" cy="150" r="110"/>
  <line class="dg-flow" x1="57.8" y1="210" x2="242.2" y2="210"/>
  <line class="dg-line" x1="150" y1="150" x2="150" y2="210"/>
  <line class="dg-line" x1="150" y1="150" x2="242.2" y2="210"/>
  <polyline class="dg-line" points="160,210 160,200 150,200"/>
  <line class="dg-line" x1="103.9" y1="203" x2="103.9" y2="217"/>
  <line class="dg-line" x1="196.1" y1="203" x2="196.1" y2="217"/>
  <circle class="dg-strong" cx="150" cy="150" r="3.5"/>
  <text class="dg-heading" x="136" y="144" dy="0.35em" text-anchor="middle">O</text>
  <text class="dg-heading" x="140" y="180" dy="0.35em" text-anchor="middle">d</text>
  <text class="dg-heading" x="202" y="164" dy="0.35em" text-anchor="middle">r</text>
  <text class="dg-heading" x="45.8" y="228" dy="0.35em" text-anchor="middle">A</text>
  <text class="dg-heading" x="254.2" y="228" dy="0.35em" text-anchor="middle">B</text>
  <text class="dg-heading" x="150" y="228" dy="0.35em" text-anchor="middle">M</text>
  <circle class="dg-box" cx="440" cy="170" r="80"/>
  <line class="dg-flow" x1="630" y1="170" x2="428.3" y2="76.4"/>
  <line class="dg-line" x1="440" y1="170" x2="473.7" y2="97.4"/>
  <line class="dg-dashed dg-line" x1="440" y1="170" x2="630" y2="170"/>
  <polyline class="dg-line" points="469.5,106.5 478.5,110.7 482.8,101.6"/>
  <circle class="dg-strong" cx="440" cy="170" r="3.5"/>
  <circle class="dg-strong" cx="630" cy="170" r="3.5"/>
  <circle class="dg-strong" cx="473.7" cy="97.4" r="3.5"/>
  <text class="dg-heading" x="426" y="176" dy="0.35em" text-anchor="middle">O</text>
  <text class="dg-heading" x="644" y="174" dy="0.35em" text-anchor="middle">P</text>
  <text class="dg-heading" x="471.7" y="81.4" dy="0.35em" text-anchor="middle">T</text>
  <text class="dg-heading" x="444.8" y="133.7" dy="0.35em" text-anchor="middle">r</text>
  <text class="dg-note" x="565" y="186" dy="0.35em" text-anchor="middle">OP</text>
  <text class="dg-note" x="573.8" y="127.7" dy="0.35em" text-anchor="middle">tangent</text>
</svg>
