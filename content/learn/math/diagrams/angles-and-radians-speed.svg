<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Two points on a turning wheel sweep the same angle but different arcs</title>
  <desc>A wheel turning about its center. In the same time, a point near the rim and a point halfway out both turn through the same angle θ, so they have the same angular speed. The outer point's arc is twice as long, because it is twice as far from the center, so its linear speed v = rω is twice as large.</desc>
