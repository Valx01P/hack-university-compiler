<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220">
  <title>Multiplying by −1 mirrors the number line, so 2 &lt; 5 turns into −2 &gt; −5</title>
  <desc>A number line from −6 to 6. Arrows carry 2 to −2 and 5 to −5, labeled multiply by −1. On the right, 2 is left of 5, so 2 is less than 5. After the mirror, −2 is right of −5, so −2 is greater than −5. The order turns around.</desc>
  <line class="dg-line" x1="16" y1="160" x2="668" y2="160" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="644" y1="160" x2="12" y2="160" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="40" y1="153" x2="40" y2="167"/>
  <text x="40" y="184" dy="0.35em" text-anchor="middle">−6</text>
  <line class="dg-line" x1="90" y1="153" x2="90" y2="167"/>
  <text x="90" y="184" dy="0.35em" text-anchor="middle">−5</text>
  <line class="dg-line" x1="140" y1="153" x2="140" y2="167"/>
  <text x="140" y="184" dy="0.35em" text-anchor="middle">−4</text>
  <line class="dg-line" x1="190" y1="153" x2="190" y2="167"/>
  <text x="190" y="184" dy="0.35em" text-anchor="middle">−3</text>
  <line class="dg-line" x1="240" y1="153" x2="240" y2="167"/>
  <text x="240" y="184" dy="0.35em" text-anchor="middle">−2</text>
  <line class="dg-line" x1="290" y1="153" x2="290" y2="167"/>
  <text x="290" y="184" dy="0.35em" text-anchor="middle">−1</text>
  <line class="dg-line" x1="340" y1="153" x2="340" y2="167"/>
  <text x="340" y="184" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line" x1="390" y1="153" x2="390" y2="167"/>
  <text x="390" y="184" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="440" y1="153" x2="440" y2="167"/>
  <text x="440" y="184" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="490" y1="153" x2="490" y2="167"/>
  <text x="490" y="184" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="540" y1="153" x2="540" y2="167"/>
  <text x="540" y="184" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="590" y1="153" x2="590" y2="167"/>
  <text x="590" y="184" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="640" y1="153" x2="640" y2="167"/>
  <text x="640" y="184" dy="0.35em" text-anchor="middle">6</text>
  <!-- Mirror arrows: 2 to -2 and 5 to -5. -->
  <path class="dg-flow" d="M440 150 V116 H240 V146" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M590 150 V72 H90 V146" marker-end="url(#arrow-flow)"/>
  <text class="dg-heading" x="340" y="52" dy="0.35em" text-anchor="middle">multiply by −1</text>
  <text x="515" y="96" dy="0.35em" text-anchor="middle">2 &lt; 5</text>
  <text x="165" y="96" dy="0.35em" text-anchor="middle">−2 &gt; −5</text>
  <circle class="dg-hot" cx="440" cy="160" r="6"/>
  <circle class="dg-hot" cx="590" cy="160" r="6"/>
  <circle class="dg-strong" cx="240" cy="160" r="6"/>
  <circle class="dg-strong" cx="90" cy="160" r="6"/>
</svg>
