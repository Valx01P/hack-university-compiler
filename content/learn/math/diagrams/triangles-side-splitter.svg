<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>A line parallel to one side splits the other two sides in the same ratio</title>
  <desc>Triangle ABC with A at the top. A segment DE runs parallel to the base BC, with D on side AB and E on side AC. AD = 4 and DB = 6 on the left, AE = 5 and EC = 7.5 on the right. The small triangle ADE, highlighted, is similar to ABC, and 4 / 6 = 5 / 7.5.</desc>
  <polygon class="dg-box" points="300,30 120,250 520,250"/>
  <polygon class="dg-hot" points="300,30 228,118 388,118"/>
  <line class="dg-flow" x1="228" y1="118" x2="388" y2="118"/>
  <text class="dg-heading" x="300" y="16" dy="0.35em" text-anchor="middle">A</text>
  <text class="dg-heading" x="106" y="258" dy="0.35em" text-anchor="middle">B</text>
  <text class="dg-heading" x="534" y="258" dy="0.35em" text-anchor="middle">C</text>
  <text class="dg-heading" x="212" y="118" dy="0.35em" text-anchor="middle">D</text>
  <text class="dg-heading" x="404" y="118" dy="0.35em" text-anchor="middle">E</text>
  <text class="dg-code" x="246" y="74" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="156" y="184" dy="0.35em" text-anchor="middle">6</text>
  <text class="dg-code" x="362" y="74" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-code" x="478" y="184" dy="0.35em" text-anchor="middle">7.5</text>
  <text class="dg-note" x="610" y="110" dy="0.35em" text-anchor="middle">DE parallel to BC</text>
  <text class="dg-code" x="610" y="140" dy="0.35em" text-anchor="middle">4 / 6 = 5 / 7.5</text>
</svg>
