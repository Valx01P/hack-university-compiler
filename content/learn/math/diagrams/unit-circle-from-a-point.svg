<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The six functions from a point at distance r</title>
  <desc>The point (−3, 4) in the second quadrant, 5 from the origin since 3² + 4² = 5². The ray through it makes angle θ with the positive x-axis. A dashed line drops from the point to the x-axis at −3, giving a triangle with legs 3 and 4 and hypotenuse 5. So sin θ = 4/5, cos θ = −3/5, and tan θ = −4/3.</desc>
  <polygon class="dg-hot" points="400,260 268,260 268,84"/>
  <circle class="dg-off" cx="400" cy="260" r="220"/>
  <line class="dg-line" x1="136" y1="260" x2="664" y2="260" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="400" y1="286.4" x2="400" y2="22.4" marker-end="url(#arrow)"/>
  <text class="dg-note" x="668" y="274" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="408" y="28.4" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-line" x1="180" y1="255" x2="180" y2="265"/>
  <text class="dg-note" x="180" y="276" dy="0.35em" text-anchor="middle">−5</text>
  <line class="dg-line" x1="268" y1="255" x2="268" y2="265"/>
  <text class="dg-note" x="268" y="276" dy="0.35em" text-anchor="middle">−3</text>
  <line class="dg-line" x1="620" y1="255" x2="620" y2="265"/>
  <text class="dg-note" x="620" y="276" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="395" y1="84" x2="405" y2="84"/>
  <text class="dg-note" x="390" y="84" dy="0.35em" text-anchor="end">4</text>
  <line class="dg-line" x1="400" y1="260" x2="268" y2="84"/>
  <circle class="dg-strong" cx="268" cy="84" r="5"/>
  <polyline class="dg-line" points="426,258.7 425.9,257.4 425.7,256.1 425.5,254.8 425.2,253.5 424.8,252.3 424.4,251 423.9,249.8 423.4,248.6 422.8,247.5 422.1,246.3 421.4,245.2 420.6,244.2 419.8,243.2 418.9,242.2 418,241.3 417.1,240.4 416,239.5 415,238.8 413.9,238 412.8,237.4 411.6,236.7 410.4,236.2 409.2,235.7 408,235.3 406.7,234.9 405.5,234.6 404.2,234.3 402.9,234.2 401.6,234 400.3,234 399,234 397.7,234.1 396.4,234.3 395.1,234.5 393.8,234.8 392.5,235.1 391.3,235.5 390.1,236 388.9,236.5 387.7,237.1 386.6,237.7 385.5,238.4"/>
  <text class="dg-note" x="433" y="233.6" dy="0.35em" text-anchor="middle">θ</text>
  <text x="259.2" y="73" dy="0.35em" text-anchor="end">(−3, 4)</text>
  <text class="dg-note" x="349.4" y="156.6" dy="0.35em" text-anchor="start">r = 5</text>
  <text class="dg-code" x="110" y="40" dy="0.35em" text-anchor="middle">r = √(x² + y²)</text>
  <text class="dg-code" x="110" y="62" dy="0.35em" text-anchor="middle">sin θ = y/r, cos θ = x/r</text>
</svg>
