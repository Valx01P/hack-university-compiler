  <rect class="dg-box" x="217.6" y="210" width="25.9" height="40"/>
  <rect class="dg-box" x="251.7" y="216.7" width="25.9" height="33.3"/>
  <rect class="dg-box" x="285.9" y="221.4" width="25.9" height="28.6"/>
  <rect class="dg-box" x="320" y="225" width="25.9" height="25"/>
  <rect class="dg-box" x="354.1" y="227.8" width="25.9" height="22.2"/>
  <rect class="dg-box" x="388.2" y="230" width="25.9" height="20"/>
