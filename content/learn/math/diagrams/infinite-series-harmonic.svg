  <rect class="dg-box" x="456.4" y="233.3" width="25.9" height="16.7"/>
  <rect class="dg-box" x="490.6" y="234.6" width="25.9" height="15.4"/>
  <rect class="dg-box" x="524.7" y="235.7" width="25.9" height="14.3"/>
  <rect class="dg-box" x="558.8" y="236.7" width="25.9" height="13.3"/>
  <rect class="dg-box" x="592.9" y="237.5" width="25.9" height="12.5"/>
  <line class="dg-line" x1="54" y1="250" x2="654" y2="250" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="60" y1="256" x2="60" y2="16" marker-end="url(#arrow)"/>
  <text class="dg-note" x="662" y="250" dy="0.35em" text-anchor="start">k</text>
  <text class="dg-note" x="60" y="6" dy="0.35em" text-anchor="middle">1/k</text>
  <line class="dg-line" x1="94.1" y1="246" x2="94.1" y2="254"/>
  <text class="dg-note" x="94.1" y="266" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="128.2" y1="246" x2="128.2" y2="254"/>
  <text class="dg-note" x="128.2" y="266" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="196.5" y1="246" x2="196.5" y2="254"/>
  <text class="dg-note" x="196.5" y="266" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="332.9" y1="246" x2="332.9" y2="254"/>
  <text class="dg-note" x="332.9" y="266" dy="0.35em" text-anchor="middle">8</text>
  <line class="dg-line" x1="605.9" y1="246" x2="605.9" y2="254"/>
  <text class="dg-note" x="605.9" y="266" dy="0.35em" text-anchor="middle">16</text>
