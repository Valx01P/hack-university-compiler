<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The harmonic series grouped so that each group adds to at least 1/2</title>
  <desc>Bars show the terms 1/k of the harmonic series for k from 1 to 16. After the first term, the bars are grouped: 1/2 alone, then 1/3 and 1/4, then 1/5 to 1/8, then 1/9 to 1/16. In each group a dashed line marks the smallest term, and the group holds as many terms as it takes for copies of that smallest term to add to 1/2, so each group adds to at least 1/2.</desc>
