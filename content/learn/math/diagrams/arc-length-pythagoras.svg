<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A small piece of a curve as the hypotenuse of a right triangle</title>
  <desc>A rising curve y = f(x). One short piece of it is highlighted, with a right triangle under it: a horizontal leg Δx and a vertical leg Δy. The piece is nearly the triangle's hypotenuse, so its length Δs is about the square root of Δx squared plus Δy squared.</desc>
