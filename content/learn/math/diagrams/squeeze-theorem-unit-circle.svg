<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>Three nested areas on the unit circle: triangle, sector, triangle</title>
  <desc>A quarter of the unit circle with center O, the point A at (1, 0), and the point P at angle θ. The shaded sector OAP has area θ/2. Inside it is the triangle OAP, with height sin θ and area (1/2) sin θ. Around it is the triangle OAT, where T is on the tangent line at A at height tan θ, with area (1/2) tan θ. So sin θ ≤ θ ≤ tan θ for θ between 0 and π/2.</desc>
  <line class="dg-line" x1="40" y1="332" x2="440" y2="332" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="77.5" y1="362" x2="77.5" y2="20" marker-end="url(#arrow)"/>
  <text class="dg-note" x="440" y="350" text-anchor="end"></text>
  <text class="dg-note" x="85.5" y="30"></text>
  <path class="dg-hot" d="M77.5 332 L327.5 332 A250 250 0 0 0 242.5 144.5 Z"/>
