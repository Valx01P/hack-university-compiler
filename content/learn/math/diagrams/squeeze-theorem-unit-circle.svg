  <line class="dg-line" x1="77.5" y1="332" x2="327.5" y2="47.9"/>
  <line class="dg-flow" x1="327.5" y1="332" x2="327.5" y2="47.9"/>
  <line class="dg-line" x1="242.5" y1="332" x2="242.5" y2="144.5"/>
  <line class="dg-line dg-dashed" x1="242.5" y1="144.5" x2="327.5" y2="332"/>
  <circle class="dg-hot" cx="242.5" cy="144.5" r="5"/>
  <text x="63.5" y="346" dy="0.35em">O</text>
  <text x="339.5" y="346" dy="0.35em">A</text>
  <text x="228.5" y="132.5" dy="0.35em">P</text>
  <text x="339.5" y="47.9" dy="0.35em">T</text>
  <text class="dg-on-hot" x="120" y="314.6" dy="0.35em">θ</text>
  <text class="dg-on-hot dg-code" x="236.5" y="238.3" dy="0.35em" text-anchor="end">sin θ</text>
  <text class="dg-code" x="337.5" y="190" dy="0.35em">tan θ</text>
  <text class="dg-code" x="202.5" y="348" dy="0.35em" text-anchor="middle">1</text>
  <text x="480" y="120">triangle OAP:</text>
  <text class="dg-code" x="480" y="140">area (1/2) sin θ</text>
  <text x="480" y="180">sector OAP:</text>
  <text class="dg-code" x="480" y="200">area θ/2 (shaded)</text>
  <text x="480" y="240">triangle OAT:</text>
  <text class="dg-code" x="480" y="260">area (1/2) tan θ</text>
  <text class="dg-note" x="480" y="320">inside each other, so</text>
  <text class="dg-code" x="480" y="340">sin θ ≤ θ ≤ tan θ</text>
</svg>
