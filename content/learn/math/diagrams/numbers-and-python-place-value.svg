<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220">
  <title>Place value: each digit of 4705 times the value of its place</title>
  <desc>Four boxes side by side for the thousands, hundreds, tens, and ones places, worth 1000, 100, 10, and 1. They hold the digits 4, 7, 0, and 5. Under each box is the digit times its place value: 4000, 700, 0, and 5. The tens box is highlighted because its 0 holds the place open. The values add up to 4705.</desc>
  <!-- The thousands place. -->
  <text class="dg-heading" x="92.5" y="28" dy="0.35em" text-anchor="middle">thousands</text>
  <text class="dg-note" x="92.5" y="50" dy="0.35em" text-anchor="middle">worth 1000</text>
  <rect class="dg-box" x="20" y="66" width="145" height="56" rx="8"/>
  <text class="dg-heading" x="92.5" y="94" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="92.5" y="148" dy="0.35em" text-anchor="middle">4 × 1000 = 4000</text>
  <!-- The hundreds place. -->
  <text class="dg-heading" x="257.5" y="28" dy="0.35em" text-anchor="middle">hundreds</text>
  <text class="dg-note" x="257.5" y="50" dy="0.35em" text-anchor="middle">worth 100</text>
  <rect class="dg-box" x="185" y="66" width="145" height="56" rx="8"/>
  <text class="dg-heading" x="257.5" y="94" dy="0.35em" text-anchor="middle">7</text>
  <text class="dg-code" x="257.5" y="148" dy="0.35em" text-anchor="middle">7 × 100 = 700</text>
  <!-- The tens place. -->
  <text class="dg-heading" x="422.5" y="28" dy="0.35em" text-anchor="middle">tens</text>
  <text class="dg-note" x="422.5" y="50" dy="0.35em" text-anchor="middle">worth 10</text>
  <rect class="dg-hot" x="350" y="66" width="145" height="56" rx="8"/>
  <text class="dg-heading dg-on-hot" x="422.5" y="94" dy="0.35em" text-anchor="middle">0</text>
  <text class="dg-code" x="422.5" y="148" dy="0.35em" text-anchor="middle">0 × 10 = 0</text>
  <!-- The ones place. -->
  <text class="dg-heading" x="587.5" y="28" dy="0.35em" text-anchor="middle">ones</text>
  <text class="dg-note" x="587.5" y="50" dy="0.35em" text-anchor="middle">worth 1</text>
  <rect class="dg-box" x="515" y="66" width="145" height="56" rx="8"/>
  <text class="dg-heading" x="587.5" y="94" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-code" x="587.5" y="148" dy="0.35em" text-anchor="middle">5 × 1 = 5</text>
  <text class="dg-code" x="340" y="192" dy="0.35em" text-anchor="middle">4000 + 700 + 0 + 5 = 4705</text>
</svg>
