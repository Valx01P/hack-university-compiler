<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>A box and a cylinder: each is its base area B times its height h</title>
  <desc>On the left, a box 5 long, 3 tall, and 4 deep, with its base highlighted. Its base holds 5 × 4 = 20 unit squares, and the box is 3 layers of 20 unit cubes, so V = Bh = 20 × 3 = 60. On the right, a cylinder of radius r and height h with its circular base highlighted. Its base area is B = πr², so V = Bh = πr²h.</desc>
  <polygon class="dg-hot" points="60,220 230,220 298,172.4 128,172.4"/>
  <line class="dg-line dg-dashed" x1="128" y1="172.4" x2="298" y2="172.4"/>
  <line class="dg-line dg-dashed" x1="128" y1="172.4" x2="128" y2="70.4"/>
  <line class="dg-line dg-dashed" x1="128" y1="172.4" x2="60" y2="220"/>
  <line class="dg-line" x1="60" y1="220" x2="230" y2="220"/>
  <line class="dg-line" x1="230" y1="220" x2="230" y2="118"/>
  <line class="dg-line" x1="230" y1="118" x2="60" y2="118"/>
  <line class="dg-line" x1="60" y1="118" x2="60" y2="220"/>
  <line class="dg-line" x1="230" y1="220" x2="298" y2="172.4"/>
  <line class="dg-line" x1="298" y1="172.4" x2="298" y2="70.4"/>
  <line class="dg-line" x1="298" y1="70.4" x2="230" y2="118"/>
  <line class="dg-line" x1="60" y1="118" x2="128" y2="70.4"/>
  <line class="dg-line" x1="128" y1="70.4" x2="298" y2="70.4"/>
  <line class="dg-line" x1="60" y1="186" x2="230" y2="186"/>
  <line class="dg-line" x1="60" y1="152" x2="230" y2="152"/>
  <text class="dg-note" x="145" y="244" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-note" x="44" y="169" dy="0.35em" text-anchor="end">h = 3</text>
  <text class="dg-note" x="290" y="202.2" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="150" y="30" dy="0.35em" text-anchor="middle">box: B = 5 × 4, V = 20 × 3 = 60</text>
  <ellipse class="dg-hot" cx="520" cy="220" rx="80" ry="24"/>
  <path class="dg-line" d="M440 220 A80 24 0 0 0 600 220"/>
  <path class="dg-line dg-dashed" d="M440 220 A80 24 0 0 1 600 220"/>
  <ellipse class="dg-box" cx="520" cy="70" rx="80" ry="24"/>
  <line class="dg-line" x1="440" y1="220" x2="440" y2="70"/>
  <line class="dg-line" x1="600" y1="220" x2="600" y2="70"/>
  <line class="dg-flow" x1="520" y1="220" x2="600" y2="220"/>
  <text class="dg-heading" x="560" y="206" dy="0.35em" text-anchor="middle">r</text>
  <line class="dg-line" x1="624" y1="220" x2="624" y2="70"/>
  <text class="dg-heading" x="638" y="145" dy="0.35em" text-anchor="middle">h</text>
  <text class="dg-code" x="520" y="30" dy="0.35em" text-anchor="middle">cylinder: B = πr², V = πr²h</text>
</svg>
