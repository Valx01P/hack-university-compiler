<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The 45-45-90 triangle is half a square and the 30-60-90 triangle is half an equilateral triangle</title>
  <desc>On the left, a square of side s is cut along its diagonal. One half is highlighted: a right triangle with two legs s, two 45 degree angles, and hypotenuse s√2. On the right, an equilateral triangle of side 2s is cut by its height. One half is highlighted: a right triangle with a short leg s opposite the 30 degree angle, a long leg s√3 opposite the 60 degree angle, and hypotenuse 2s.</desc>
  <rect class="dg-box" x="60" y="100" width="160" height="160"/>
  <polygon class="dg-hot" points="60,260 220,260 220,100"/>
  <line class="dg-flow" x1="60" y1="260" x2="220" y2="100"/>
  <polyline class="dg-line" points="220,248 208,248 208,260"/>
  <path class="dg-line" d="M86 260 A26 26 0 0 0 78.4 241.6"/>
  <text class="dg-on-hot" x="104" y="248" dy="0.35em" text-anchor="middle">45°</text>
  <path class="dg-line" d="M201.6 118.4 A26 26 0 0 0 220 126"/>
  <text class="dg-on-hot" x="206" y="146" dy="0.35em" text-anchor="middle">45°</text>
  <text x="140" y="278" dy="0.35em" text-anchor="middle">s</text>
  <text x="234" y="180" dy="0.35em" text-anchor="middle">s</text>
  <text x="114" y="168" dy="0.35em" text-anchor="middle">s√2</text>
  <text class="dg-heading" x="140" y="40" dy="0.35em" text-anchor="middle">45-45-90</text>
  <text class="dg-code" x="140" y="300" dy="0.35em" text-anchor="middle">1 : 1 : √2</text>
  <polygon class="dg-box" points="380,260 580,260 480,86.8"/>
