  <line class="dg-flow" x1="480" y1="86.8" x2="480" y2="260"/>
  <polyline class="dg-line" points="492,260 492,248 480,248"/>
  <path class="dg-line" d="M566 235.8 A28 28 0 0 0 552 260"/>
  <text class="dg-on-hot" x="540" y="246" dy="0.35em" text-anchor="middle">60°</text>
  <path class="dg-line" d="M480 116.8 A30 30 0 0 0 495 112.8"/>
  <text class="dg-on-hot" x="492" y="132.8" dy="0.35em" text-anchor="middle">30°</text>
