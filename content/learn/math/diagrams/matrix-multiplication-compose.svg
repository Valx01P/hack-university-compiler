<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>The unit square turned by B, then flipped by A</title>
  <desc>Three panels. First, the unit square with the arrows (1, 0), labeled first, and (0, 1), labeled second. Second, after the quarter turn B, the square sits left of the y-axis and (1, 0) has moved to (0, 1). Third, after the flip A across the x-axis, the square sits below and left of the origin, and the first arrow points to (0, −1), the first column of AB.</desc>
  <line class="dg-line" x1="7" y1="150" x2="193" y2="150" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="100" y1="243" x2="100" y2="57" marker-end="url(#arrow)"/>
  <polygon class="dg-box" points="100,150 162,150 162,88 100,88"/>
  <line class="dg-flow" x1="100" y1="150" x2="159" y2="150" marker-end="url(#arrow-flow)"/>
  <line class="dg-line" x1="100" y1="150" x2="100" y2="91" marker-end="url(#arrow)"/>
  <text class="dg-note" x="170" y="140" dy="0.35em" text-anchor="start">first</text>
  <text class="dg-note" x="94" y="76" dy="0.35em" text-anchor="end">second</text>
  <text class="dg-note" x="100" y="280" dy="0.35em" text-anchor="middle">the unit square</text>
  <line class="dg-line" x1="247" y1="150" x2="433" y2="150" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="243" x2="340" y2="57" marker-end="url(#arrow)"/>
  <polygon class="dg-box" points="340,150 340,88 278,88 278,150"/>
  <line class="dg-flow" x1="340" y1="150" x2="340" y2="91" marker-end="url(#arrow-flow)"/>
  <line class="dg-line" x1="340" y1="150" x2="281" y2="150" marker-end="url(#arrow)"/>
  <text class="dg-note" x="348" y="78" dy="0.35em" text-anchor="start">first</text>
  <text class="dg-note" x="272" y="138" dy="0.35em" text-anchor="end">second</text>
  <text class="dg-note" x="340" y="280" dy="0.35em" text-anchor="middle">after B, a quarter turn</text>
  <line class="dg-line" x1="477" y1="150" x2="663" y2="150" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="570" y1="243" x2="570" y2="57" marker-end="url(#arrow)"/>
  <polygon class="dg-box" points="570,150 570,212 508,212 508,150"/>
  <line class="dg-flow" x1="570" y1="150" x2="570" y2="209" marker-end="url(#arrow-flow)"/>
  <line class="dg-line" x1="570" y1="150" x2="511" y2="150" marker-end="url(#arrow)"/>
  <text class="dg-note" x="578" y="226" dy="0.35em" text-anchor="start">first</text>
  <text class="dg-note" x="502" y="138" dy="0.35em" text-anchor="end">second</text>
  <text class="dg-note" x="570" y="280" dy="0.35em" text-anchor="middle">after A, a flip: AB</text>
  <line class="dg-line" x1="195" y1="60" x2="245" y2="60" marker-end="url(#arrow)"/>
  <text x="220" y="46" dy="0.35em" text-anchor="middle">B</text>
  <line class="dg-line" x1="430" y1="60" x2="480" y2="60" marker-end="url(#arrow)"/>
  <text x="455" y="46" dy="0.35em" text-anchor="middle">then A</text>
</svg>
