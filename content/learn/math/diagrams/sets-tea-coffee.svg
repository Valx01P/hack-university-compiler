<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Inclusion-exclusion: tea drinkers, coffee drinkers, and both</title>
  <desc>A Venn diagram of a survey. The tea circle holds 30 people and the coffee circle 25, and the shaded lens where they overlap holds the 10 who drink both. So 20 drink only tea and 15 only coffee. Adding 30 and 25 counts the lens twice, and 30 + 25 − 10 = 20 + 10 + 15 = 45 drink at least one.</desc>
  <rect class="dg-box" x="120" y="20" width="440" height="220"/>
  <path class="dg-hot" d="M340 67.55 A80 80 0 0 0 340 192.45 A80 80 0 0 0 340 67.55 Z"/>
  <path class="dg-line" d="M210 130 A80 80 0 1 0 370 130 A80 80 0 1 0 210 130"/>
  <path class="dg-line" d="M310 130 A80 80 0 1 0 470 130 A80 80 0 1 0 310 130"/>
  <text class="dg-heading" x="220" y="38" dy="0.35em" text-anchor="middle">Tea: 30</text>
  <text class="dg-heading" x="462" y="38" dy="0.35em" text-anchor="middle">Coffee: 25</text>
  <text x="250" y="122" dy="0.35em" text-anchor="middle">20</text>
  <text class="dg-note" x="250" y="144" dy="0.35em" text-anchor="middle">only tea</text>
  <text class="dg-on-hot" x="340" y="122" dy="0.35em" text-anchor="middle">10</text>
  <text class="dg-on-hot" x="340" y="144" dy="0.35em" text-anchor="middle">both</text>
  <text x="430" y="122" dy="0.35em" text-anchor="middle">15</text>
  <text class="dg-note" x="430" y="144" dy="0.35em" text-anchor="middle">only coffee</text>
  <text class="dg-code" x="340" y="270" dy="0.35em" text-anchor="middle">30 + 25 − 10 = 20 + 10 + 15 = 45</text>
</svg>
