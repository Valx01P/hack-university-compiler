<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Rates multiply along a chain of functions</title>
  <desc>Three horizontal number lines, for x, for u = g(x), and for y = f(u). A short highlighted piece Δx on the x line maps to a piece three times as long on the u line, since g′ = 3. That piece maps to one twice as long again on the y line, since f′ = 2. So Δy is about 6 times Δx, the product of the two rates.</desc>
  <line class="dg-line" x1="130.0" y1="60.0" x2="600.0" y2="60.0" marker-end="url(#arrow)"/>
  <text class="dg-code" x="116.0" y="60.0" dy="0.35em" text-anchor="end">x</text>
  <line class="dg-flow" x1="250.0" y1="60.0" x2="270.0" y2="60.0"/>
  <line class="dg-line" x1="250.0" y1="54.0" x2="250.0" y2="66.0"/>
  <line class="dg-line" x1="270.0" y1="54.0" x2="270.0" y2="66.0"/>
  <text x="284.0" y="46.0" dy="0.35em" text-anchor="start">Δx</text>
  <line class="dg-line" x1="130.0" y1="160.0" x2="600.0" y2="160.0" marker-end="url(#arrow)"/>
  <text class="dg-code" x="116.0" y="160.0" dy="0.35em" text-anchor="end">u = g(x)</text>
  <line class="dg-flow" x1="230.0" y1="160.0" x2="290.0" y2="160.0"/>
  <line class="dg-line" x1="230.0" y1="154.0" x2="230.0" y2="166.0"/>
  <line class="dg-line" x1="290.0" y1="154.0" x2="290.0" y2="166.0"/>
  <text x="304.0" y="146.0" dy="0.35em" text-anchor="start">Δu ≈ 3 · Δx</text>
  <line class="dg-line" x1="130.0" y1="260.0" x2="600.0" y2="260.0" marker-end="url(#arrow)"/>
  <text class="dg-code" x="116.0" y="260.0" dy="0.35em" text-anchor="end">y = f(u)</text>
  <line class="dg-flow" x1="200.0" y1="260.0" x2="320.0" y2="260.0"/>
  <line class="dg-line" x1="200.0" y1="254.0" x2="200.0" y2="266.0"/>
  <line class="dg-line" x1="320.0" y1="254.0" x2="320.0" y2="266.0"/>
  <text x="334.0" y="246.0" dy="0.35em" text-anchor="start">Δy ≈ 2 · Δu = 6 · Δx</text>
  <line class="dg-line dg-dashed" x1="250.0" y1="68.0" x2="230.0" y2="152.0"/>
  <line class="dg-line dg-dashed" x1="270.0" y1="68.0" x2="290.0" y2="152.0"/>
  <line class="dg-line dg-dashed" x1="230.0" y1="168.0" x2="200.0" y2="252.0"/>
  <line class="dg-line dg-dashed" x1="290.0" y1="168.0" x2="320.0" y2="252.0"/>
  <text class="dg-note" x="190.0" y="110.0" dy="0.35em" text-anchor="end">stretched by g′ = 3</text>
  <text class="dg-note" x="180.0" y="210.0" dy="0.35em" text-anchor="end">stretched by f′ = 2</text>
</svg>
