<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Rotating the chord PQ by −b gives a chord of the same length ending at (1, 0)</title>
  <desc>Left: a unit circle with P = (cos a, sin a) at angle a and Q = (cos b, sin b) at angle b, and the chord PQ between them. Right: the same picture turned by −b, so Q lands on Q′ = (1, 0) and P lands on P′ = (cos(a − b), sin(a − b)). A rotation keeps distances, so the two chords have the same length, and setting their squared lengths equal gives the formula for cos(a − b).</desc>
