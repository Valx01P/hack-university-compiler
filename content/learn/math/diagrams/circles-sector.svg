<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>A sector and its arc, cut off by a central angle θ</title>
  <desc>A circle of radius r with center O. Two radii make a central angle θ of 60 degrees, and the region between them, the sector, is highlighted. The piece of the circle between the radii is the arc. Since 60 degrees is 60/360 of a full turn, the arc is 60/360 of the circumference 2πr and the sector is 60/360 of the area πr².</desc>
  <circle class="dg-box" cx="190" cy="140" r="105"/>
  <path class="dg-hot" d="M190 140 L291.4 112.8 A105 105 0 0 0 217.2 38.6 Z"/>
  <path class="dg-flow" d="M291.4 112.8 A105 105 0 0 0 217.2 38.6"/>
  <path class="dg-line" d="M215.1 133.3 A26 26 0 0 0 196.7 114.9"/>
  <text class="dg-heading" x="210" y="104" dy="0.35em" text-anchor="middle">θ</text>
  <circle class="dg-strong" cx="190" cy="140" r="3.5"/>
  <text class="dg-heading" x="174" y="146" dy="0.35em" text-anchor="middle">O</text>
  <text class="dg-heading" x="244.7" y="140.4" dy="0.35em" text-anchor="middle">r</text>
  <text class="dg-note" x="285" y="53" dy="0.35em" text-anchor="middle">arc</text>
  <text class="dg-code" x="360" y="90" dy="0.35em" text-anchor="start">arc = (θ / 360°) × 2πr</text>
  <text class="dg-code" x="360" y="130" dy="0.35em" text-anchor="start">sector = (θ / 360°) × πr²</text>
  <text class="dg-note" x="360" y="180" dy="0.35em" text-anchor="start">θ = 60°: one sixth of the circle</text>
</svg>
