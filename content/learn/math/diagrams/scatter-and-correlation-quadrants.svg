  <text class="dg-note" x="350" y="354" dy="0.35em" text-anchor="middle">hours studied, x</text>
  <text class="dg-note" x="90" y="6" dy="0.35em" text-anchor="start">score, y</text>
  <line class="dg-line dg-dashed" x1="338" y1="20" x2="338" y2="320"/>
