<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>Deviations from the mean point split a scatter plot into four quadrants</title>
  <desc>The ten study points with a dashed vertical line at the mean of x, 4.3, and a dashed horizontal line at the mean of y, 6.2. Upper right and lower left are marked with a plus sign, since both deviations there have the same sign and their product is positive. Upper left and lower right are marked minus. Nine points lie in the plus quadrants and one in a minus quadrant.</desc>
  <line class="dg-line" x1="80" y1="320" x2="620" y2="320"/>
  <line class="dg-line" x1="80" y1="315" x2="80" y2="325"/>
  <text class="dg-note" x="80" y="336" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line" x1="140" y1="315" x2="140" y2="325"/>
  <text class="dg-note" x="140" y="336" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="200" y1="315" x2="200" y2="325"/>
  <text class="dg-note" x="200" y="336" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="260" y1="315" x2="260" y2="325"/>
  <text class="dg-note" x="260" y="336" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="320" y1="315" x2="320" y2="325"/>
  <text class="dg-note" x="320" y="336" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="380" y1="315" x2="380" y2="325"/>
  <text class="dg-note" x="380" y="336" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="440" y1="315" x2="440" y2="325"/>
  <text class="dg-note" x="440" y="336" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="500" y1="315" x2="500" y2="325"/>
  <text class="dg-note" x="500" y="336" dy="0.35em" text-anchor="middle">7</text>
  <line class="dg-line" x1="560" y1="315" x2="560" y2="325"/>
  <text class="dg-note" x="560" y="336" dy="0.35em" text-anchor="middle">8</text>
  <line class="dg-line" x1="620" y1="315" x2="620" y2="325"/>
  <text class="dg-note" x="620" y="336" dy="0.35em" text-anchor="middle">9</text>
  <line class="dg-line" x1="80" y1="320" x2="80" y2="20"/>
  <line class="dg-line" x1="75" y1="320" x2="85" y2="320"/>
