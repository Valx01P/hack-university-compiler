  <text class="dg-note" x="624" y="134" dy="0.35em" text-anchor="start">ȳ = 6.2</text>
  <text class="dg-heading" x="452" y="29" dy="0.35em" text-anchor="middle">+ (both up)</text>
  <text class="dg-heading" x="188" y="284" dy="0.35em" text-anchor="middle">+ (both down)</text>
