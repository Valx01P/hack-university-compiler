  <line class="dg-line" x1="75" y1="260" x2="85" y2="260"/>
  <text class="dg-note" x="70" y="260" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="75" y1="200" x2="85" y2="200"/>
  <text class="dg-note" x="70" y="200" dy="0.35em" text-anchor="end">4</text>
  <line class="dg-line" x1="75" y1="140" x2="85" y2="140"/>
  <text class="dg-note" x="70" y="140" dy="0.35em" text-anchor="end">6</text>
  <line class="dg-line" x1="75" y1="80" x2="85" y2="80"/>
  <text class="dg-note" x="70" y="80" dy="0.35em" text-anchor="end">8</text>
  <line class="dg-line" x1="75" y1="20" x2="85" y2="20"/>
