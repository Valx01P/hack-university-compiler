  <circle class="dg-strong" cx="420" cy="50" r="5"/>
  <circle class="dg-hot" cx="328" cy="96" r="4"/>
  <text class="dg-note" x="334.9" y="116.7" dy="0.35em" text-anchor="start">mean point (3, 4)</text>
  <text class="dg-note" x="203.8" y="40.8" dy="0.35em" text-anchor="start">y = 2.2 + 0.6x</text>
  <text class="dg-note" x="242.9" y="199.5" dy="0.35em" text-anchor="start">residual −0.8</text>
  <text class="dg-note" x="334.9" y="47.7" dy="0.35em" text-anchor="start">residual 1</text>
