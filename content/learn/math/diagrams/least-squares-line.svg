<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The least-squares line y = 2.2 + 0.6x and its residuals</title>
  <desc>Five data points, (1, 2), (2, 4), (3, 5), (4, 4), and (5, 5), with the line y = 2.2 + 0.6x drawn through them. A dashed vertical segment joins each point to the line: these are the residuals, observed minus predicted. The line makes the sum of their squares as small as possible and passes through the mean point (3, 4).</desc>
  <line class="dg-line" x1="171.6" y1="280" x2="493.6" y2="280" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="190" y1="298.4" x2="190" y2="17.8" marker-end="url(#arrow)"/>
  <text class="dg-note" x="491.6" y="294" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="202" y="21.8" dy="0.35em" text-anchor="middle">y</text>
  <line class="dg-line" x1="236" y1="276" x2="236" y2="284"/>
  <line class="dg-line" x1="282" y1="276" x2="282" y2="284"/>
  <line class="dg-line" x1="328" y1="276" x2="328" y2="284"/>
  <line class="dg-line" x1="374" y1="276" x2="374" y2="284"/>
  <line class="dg-line" x1="420" y1="276" x2="420" y2="284"/>
  <line class="dg-line" x1="466" y1="276" x2="466" y2="284"/>
  <line class="dg-line" x1="186" y1="234" x2="194" y2="234"/>
  <line class="dg-line" x1="186" y1="188" x2="194" y2="188"/>
  <line class="dg-line" x1="186" y1="142" x2="194" y2="142"/>
  <line class="dg-line" x1="186" y1="96" x2="194" y2="96"/>
  <line class="dg-line" x1="186" y1="50" x2="194" y2="50"/>
  <line class="dg-flow" x1="190" y1="178.8" x2="456.8" y2="18.7"/>
  <line class="dg-line dg-dashed" x1="236" y1="188" x2="236" y2="151.2"/>
  <line class="dg-line dg-dashed" x1="282" y1="96" x2="282" y2="123.6"/>
  <line class="dg-line dg-dashed" x1="328" y1="50" x2="328" y2="96"/>
  <line class="dg-line dg-dashed" x1="374" y1="96" x2="374" y2="68.4"/>
  <line class="dg-line dg-dashed" x1="420" y1="50" x2="420" y2="40.8"/>
  <circle class="dg-strong" cx="236" cy="188" r="5"/>
