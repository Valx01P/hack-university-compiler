<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A cylindrical shell cut and unrolled into a flat slab</title>
  <desc>The shell, cut down its side and flattened, becomes a thin rectangular slab. Its length is the shell's circumference 2πx, its height is f(x), and its thickness is Δx, so its volume is about 2πx times f(x) times Δx.</desc>
  <polygon class="dg-box" points="90,90 550,90 566,74 106,74"/>
  <polygon class="dg-box" points="550,230 566,214 566,74 550,90"/>
  <polygon class="dg-hot" points="90,230 550,230 550,90 90,90"/>
  <line class="dg-line" x1="90" y1="254" x2="550" y2="254"/>
  <line class="dg-line" x1="90" y1="246" x2="90" y2="262"/>
  <line class="dg-line" x1="550" y1="246" x2="550" y2="262"/>
  <text x="320" y="278" text-anchor="middle">length 2πx, the circumference</text>
  <line class="dg-line" x1="66" y1="230" x2="66" y2="90"/>
  <text x="58" y="160" text-anchor="end">f(x)</text>
  <text x="576" y="76">thickness Δx</text>
  <text class="dg-on-hot" x="320" y="165" text-anchor="middle">volume ≈ 2πx · f(x) · Δx</text>
</svg>
