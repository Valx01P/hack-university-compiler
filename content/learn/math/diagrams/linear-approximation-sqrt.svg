  <text class="dg-note" x="562.1" y="291.7" dy="0.35em" text-anchor="middle">10</text>
  <line class="dg-line" x1="92.9" y1="142" x2="102.9" y2="142"/>
  <text class="dg-note" x="87.9" y="142" dy="0.35em" text-anchor="end">2</text>
