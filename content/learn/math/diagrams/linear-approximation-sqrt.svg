  <text class="dg-note" x="330" y="291.7" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="376.4" y1="268.7" x2="376.4" y2="278.7"/>
  <text class="dg-note" x="376.4" y="291.7" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="422.9" y1="268.7" x2="422.9" y2="278.7"/>
  <text class="dg-note" x="422.9" y="291.7" dy="0.35em" text-anchor="middle">7</text>
  <line class="dg-line" x1="469.3" y1="268.7" x2="469.3" y2="278.7"/>
