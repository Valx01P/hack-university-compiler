<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The tangent line to the square root of x at x = 4</title>
  <desc>The curve y = √x from 0 to about 10.5, and its dashed tangent line at the point (4, 2), y = 2 + (x − 4)/4. Near x = 4 the line and the curve almost touch. Farther out they separate: at x = 9 the line is at 3.25 while the curve is at 3.</desc>
