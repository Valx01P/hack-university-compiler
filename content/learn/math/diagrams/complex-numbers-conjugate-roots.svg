<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The roots 2 + 3i and 2 − 3i of x² − 4x + 13 = 0</title>
  <desc>In the complex plane the two roots of x² − 4x + 13 = 0 are 2 + 3i and 2 − 3i. They are mirror images across the real axis, conjugates, directly above and below 2, the real part they share. Their sum is 4 and their product is 13.</desc>
  <!-- Axes -->
  <line class="dg-line" x1="200" y1="174" x2="466" y2="174" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="272" y1="318" x2="272" y2="16" marker-end="url(#arrow)"/>
  <text class="dg-note" x="466" y="160" dy="0.35em" text-anchor="middle">real</text>
  <text class="dg-note" x="282" y="18" dy="0.35em" text-anchor="start">imaginary</text>
  <line class="dg-line" x1="236" y1="170" x2="236" y2="178"/>
  <text class="dg-note" x="236" y="190" dy="0.35em" text-anchor="middle">−1</text>
  <line class="dg-line" x1="308" y1="170" x2="308" y2="178"/>
  <text class="dg-note" x="308" y="190" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="344" y1="170" x2="344" y2="178"/>
  <text class="dg-note" x="344" y="190" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="380" y1="170" x2="380" y2="178"/>
  <text class="dg-note" x="380" y="190" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="416" y1="170" x2="416" y2="178"/>
  <text class="dg-note" x="416" y="190" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="268" y1="282" x2="276" y2="282"/>
  <text class="dg-note" x="264" y="282" dy="0.35em" text-anchor="end">−3i</text>
  <line class="dg-line" x1="268" y1="246" x2="276" y2="246"/>
  <text class="dg-note" x="264" y="246" dy="0.35em" text-anchor="end">−2i</text>
  <line class="dg-line" x1="268" y1="210" x2="276" y2="210"/>
  <text class="dg-note" x="264" y="210" dy="0.35em" text-anchor="end">−i</text>
  <line class="dg-line" x1="268" y1="138" x2="276" y2="138"/>
  <text class="dg-note" x="264" y="138" dy="0.35em" text-anchor="end">i</text>
  <line class="dg-line" x1="268" y1="102" x2="276" y2="102"/>
  <text class="dg-note" x="264" y="102" dy="0.35em" text-anchor="end">2i</text>
  <line class="dg-line" x1="268" y1="66" x2="276" y2="66"/>
  <text class="dg-note" x="264" y="66" dy="0.35em" text-anchor="end">3i</text>
  <line class="dg-line dg-dashed" x1="344" y1="66" x2="344" y2="282"/>
  <circle class="dg-hot" cx="344" cy="66" r="5"/>
  <circle class="dg-hot" cx="344" cy="282" r="5"/>
  <text x="356" y="66" dy="0.35em" text-anchor="start">2 + 3i</text>
  <text x="356" y="282" dy="0.35em" text-anchor="start">2 − 3i</text>
  <text class="dg-note" x="352" y="162" dy="0.35em" text-anchor="start">real part 2</text>
</svg>
