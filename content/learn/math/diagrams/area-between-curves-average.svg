<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The average of x² on [0, 3] is the height of the rectangle with the same area</title>
  <desc>The region under y = x² from 0 to 3 has area 9. A dashed rectangle on the same base with height 3 also has area 9, so 3 is the average value. The curve crosses the top of the rectangle at x = √3, where f(c) equals the average, as the mean value theorem for integrals promises.</desc>
