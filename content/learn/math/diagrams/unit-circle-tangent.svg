<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>Tangent and secant as lengths on the line x = 1</title>
  <desc>The unit circle with the vertical line x = 1, which touches the circle at (1, 0). The ray of an angle θ meets the circle at (cos θ, sin θ) and the line x = 1 at height tan θ. The small triangle with legs cos θ and sin θ is similar to the big one with legs 1 and tan θ, whose hypotenuse from the origin has length sec θ.</desc>
  <polygon class="dg-box" points="220,240 340,240 340,97"/>
  <polygon class="dg-hot" points="220,240 297.1,240 297.1,148.1"/>
  <circle class="dg-off" cx="220" cy="240" r="120"/>
  <line class="dg-line" x1="70" y1="240" x2="532" y2="240" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="220" y1="396" x2="220" y2="30" marker-end="url(#arrow)"/>
  <text class="dg-note" x="536" y="254" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="228" y="36" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-line" x1="340" y1="384" x2="340" y2="36"/>
  <line class="dg-flow" x1="220" y1="240" x2="340" y2="97"/>
  <circle class="dg-strong" cx="297.1" cy="148.1" r="4"/>
  <circle class="dg-strong" cx="340" cy="97" r="4"/>
  <polyline class="dg-line" points="250,238.5 249.8,237 249.6,235.4 249.4,233.9 249,232.4 248.6,230.9 248.1,229.5 247.5,228 246.9,226.6 246.1,225.3 245.3,223.9 244.5,222.7 243.5,221.4 242.6,220.2 241.5,219.1 240.4,218"/>
  <text class="dg-note" x="250" y="228" dy="0.35em" text-anchor="middle">θ</text>
  <text x="346" y="150.5" dy="0.35em" text-anchor="start">tan θ</text>
  <text x="268" y="144" dy="0.35em" text-anchor="end">sec θ</text>
  <text class="dg-note" x="258.6" y="250.8" dy="0.35em" text-anchor="middle">cos θ</text>
  <text class="dg-note" x="344.8" y="252" dy="0.35em" text-anchor="start">1</text>
  <text class="dg-note" x="301.9" y="200" dy="0.35em" text-anchor="start">sin θ</text>
  <text class="dg-note" x="344.8" y="240" dy="0.35em" text-anchor="middle"></text>
  <text class="dg-code" x="347.2" y="89.8" dy="0.35em" text-anchor="start">(1, tan θ)</text>
  <text class="dg-code" x="344.8" y="36" dy="0.35em" text-anchor="start">x = 1</text>
  <text class="dg-code" x="540" y="120" dy="0.35em" text-anchor="middle">1 + tan²θ = sec²θ</text>
  <text class="dg-note" x="540" y="142" dy="0.35em" text-anchor="middle">Pythagoras on the big triangle</text>
</svg>
