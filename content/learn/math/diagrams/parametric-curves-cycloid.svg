<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A cycloid: the path of a point on the rim of a rolling wheel</title>
  <desc>A wheel of radius r rolls to the right along the x-axis. A point on its rim starts at the origin, rises to height 2r halfway along at x = πr, and comes back down to the axis at x = 2πr, tracing one arch. The wheel is drawn after turning t = 2π/3, with its center at (rt, r) and a highlighted radius to the point (r(t − sin t), r(1 − cos t)).</desc>
