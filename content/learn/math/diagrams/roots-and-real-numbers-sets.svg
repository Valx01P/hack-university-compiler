<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The number sets nested: naturals, integers, rationals, reals</title>
  <desc>Four nested frames. The innermost, the natural numbers ℕ, holds 0, 1, 2, and 7. Around it the integers ℤ add negatives like −3 and −1. Around that the rationals ℚ add fractions like 3/4 and 0.333… The outer frame, the real numbers ℝ, also holds the irrationals, such as √2, π, and 1 + √2, which lie outside ℚ.</desc>
  <rect class="dg-frame" x="20" y="20" width="640" height="300" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">ℝ real numbers</text>
  <rect class="dg-frame" x="40" y="70" width="420" height="230" rx="12"/>
  <text class="dg-heading" x="60" y="94" dy="0.35em">ℚ rationals</text>
  <rect class="dg-frame" x="60" y="120" width="300" height="160" rx="12"/>
  <text class="dg-heading" x="80" y="144" dy="0.35em">ℤ integers</text>
  <rect class="dg-hot" x="80" y="170" width="180" height="90" rx="8"/>
  <text class="dg-on-hot dg-heading" x="100" y="192" dy="0.35em">ℕ naturals</text>
  <text class="dg-on-hot dg-code" x="170" y="230" dy="0.35em" text-anchor="middle">0, 1, 2, 7</text>
  <text class="dg-code" x="310" y="200" dy="0.35em" text-anchor="middle">−3</text>
  <text class="dg-code" x="310" y="240" dy="0.35em" text-anchor="middle">−1</text>
  <text class="dg-code" x="410" y="180" dy="0.35em" text-anchor="middle">3/4</text>
  <text class="dg-code" x="410" y="220" dy="0.35em" text-anchor="middle">0.333…</text>
  <text class="dg-note" x="560" y="100" dy="0.35em" text-anchor="middle">irrationals</text>
  <text class="dg-code" x="560" y="150" dy="0.35em" text-anchor="middle">√2</text>
  <text class="dg-code" x="560" y="190" dy="0.35em" text-anchor="middle">π</text>
  <text class="dg-code" x="560" y="230" dy="0.35em" text-anchor="middle">1 + √2</text>
</svg>
