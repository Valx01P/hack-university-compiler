<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>The unit square and its image, a parallelogram of area 5</title>
  <desc>The unit square at the origin is outlined. The matrix with columns (3, 1) and (1, 2) sends it to a shaded parallelogram with corners at the origin, (3, 1), (4, 3), and (1, 2). The arrows along its sides are the columns, the images of (1, 0) and (0, 1). The parallelogram's area is det A = 3 · 2 − 1 · 1 = 5.</desc>
  <line class="dg-line" x1="112" y1="260" x2="431.2" y2="260" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="140" y1="282.4" x2="140" y2="52.8" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="196" y1="257" x2="196" y2="263"/>
  <line class="dg-line" x1="252" y1="257" x2="252" y2="263"/>
  <line class="dg-line" x1="308" y1="257" x2="308" y2="263"/>
  <line class="dg-line" x1="364" y1="257" x2="364" y2="263"/>
  <line class="dg-line" x1="420" y1="257" x2="420" y2="263"/>
  <line class="dg-line" x1="137" y1="204" x2="143" y2="204"/>
  <line class="dg-line" x1="137" y1="148" x2="143" y2="148"/>
  <line class="dg-line" x1="137" y1="92" x2="143" y2="92"/>
  <text class="dg-note" x="429.2" y="274" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="148" y="58.8" dy="0.35em" text-anchor="start">y</text>
  <polygon class="dg-hot" points="140,260 308,204 364,92 196,148"/>
  <polygon class="dg-off" points="140,260 196,260 196,204 140,204"/>
  <line class="dg-flow" x1="140" y1="260" x2="305.2" y2="204.9" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="140" y1="260" x2="194.7" y2="150.7" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="318" y="210" dy="0.35em" text-anchor="start">(3, 1)</text>
  <text class="dg-code" x="188" y="142" dy="0.35em" text-anchor="end">(1, 2)</text>
  <text class="dg-note" x="480" y="120" dy="0.35em" text-anchor="start">the columns of A:</text>
  <text class="dg-code" x="480" y="144" dy="0.35em" text-anchor="start">A(1, 0) = (3, 1)</text>
  <text class="dg-code" x="480" y="166" dy="0.35em" text-anchor="start">A(0, 1) = (1, 2)</text>
  <text class="dg-code" x="480" y="196" dy="0.35em" text-anchor="start">det A = 3·2 − 1·1 = 5</text>
  <text class="dg-on-hot" x="252" y="176" dy="0.35em" text-anchor="middle">area 5</text>
  <text class="dg-note" x="168" y="232" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="372" y="88" dy="0.35em" text-anchor="start">(4, 3)</text>
</svg>
