<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Four planes slicing a double cone make a circle, an ellipse, a parabola, and a hyperbola</title>
  <desc>Four side views of the same double cone, two cones meeting tip to tip. In each, one plane is seen edge on as a highlighted line. A level plane cuts a circle. A plane tilted less steeply than the cone's side cuts a closed ellipse. A plane exactly as steep as the side, parallel to it, cuts a parabola that never closes. A plane steeper than the side cuts both cones and makes the two branches of a hyperbola.</desc>
  <line class="dg-line" x1="39" y1="30" x2="131" y2="230"/>
  <line class="dg-line" x1="131" y1="30" x2="39" y2="230"/>
  <ellipse class="dg-frame" cx="85" cy="30" rx="46" ry="9"/>
  <ellipse class="dg-frame" cx="85" cy="230" rx="46" ry="9"/>
  <line class="dg-line dg-dashed" x1="85" y1="16" x2="85" y2="244"/>
  <line class="dg-flow" x1="33" y1="70" x2="137" y2="70"/>
  <text class="dg-heading" x="85" y="266" dy="0.35em" text-anchor="middle">circle</text>
  <text class="dg-note" x="85" y="286" dy="0.35em" text-anchor="middle">level</text>
  <line class="dg-line" x1="209" y1="30" x2="301" y2="230"/>
  <line class="dg-line" x1="301" y1="30" x2="209" y2="230"/>
  <ellipse class="dg-frame" cx="255" cy="30" rx="46" ry="9"/>
  <ellipse class="dg-frame" cx="255" cy="230" rx="46" ry="9"/>
  <line class="dg-line dg-dashed" x1="255" y1="16" x2="255" y2="244"/>
  <line class="dg-flow" x1="203" y1="96" x2="307" y2="46"/>
  <text class="dg-heading" x="255" y="266" dy="0.35em" text-anchor="middle">ellipse</text>
  <text class="dg-note" x="255" y="286" dy="0.35em" text-anchor="middle">tilted less than the side</text>
  <line class="dg-line" x1="379" y1="30" x2="471" y2="230"/>
  <line class="dg-line" x1="471" y1="30" x2="379" y2="230"/>
  <ellipse class="dg-frame" cx="425" cy="30" rx="46" ry="9"/>
  <ellipse class="dg-frame" cx="425" cy="230" rx="46" ry="9"/>
  <line class="dg-line dg-dashed" x1="425" y1="16" x2="425" y2="244"/>
  <line class="dg-flow" x1="385" y1="110" x2="429.2" y2="13.9"/>
  <text class="dg-heading" x="425" y="266" dy="0.35em" text-anchor="middle">parabola</text>
  <text class="dg-note" x="425" y="286" dy="0.35em" text-anchor="middle">parallel to a side</text>
  <line class="dg-line" x1="549" y1="30" x2="641" y2="230"/>
  <line class="dg-line" x1="641" y1="30" x2="549" y2="230"/>
  <ellipse class="dg-frame" cx="595" cy="30" rx="46" ry="9"/>
  <ellipse class="dg-frame" cx="595" cy="230" rx="46" ry="9"/>
  <line class="dg-line dg-dashed" x1="595" y1="16" x2="595" y2="244"/>
  <line class="dg-flow" x1="613" y1="22" x2="613" y2="238"/>
  <text class="dg-heading" x="595" y="266" dy="0.35em" text-anchor="middle">hyperbola</text>
  <text class="dg-note" x="595" y="286" dy="0.35em" text-anchor="middle">steeper than the side</text>
</svg>
