<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>One area before and after the substitution u = x²</title>
  <desc>On the left, the region under y = 2x sin(x²) from x = 0 to x = √π. On the right, the region under y = sin u from u = 0 to u = π. The substitution u = x² reshapes the first region into the second, and the new limits are 0² = 0 and (√π)² = π. Both regions have area 2.</desc>
