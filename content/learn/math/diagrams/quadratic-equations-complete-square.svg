<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>Completing the square: x² + bx needs the corner (b/2)²</title>
  <desc>An x by x square, highlighted, with a strip b/2 wide along its right side and another along its bottom. Each strip has area bx/2, so together they are bx. The bottom right corner is dashed and missing, a b/2 by b/2 square. Adding it completes a square of side x + b/2.</desc>
  <!-- The x by x square and the two half strips. -->
  <rect class="dg-hot" x="200" y="40" width="160" height="160"/>
  <rect class="dg-box" x="360" y="40" width="60" height="160"/>
  <rect class="dg-box" x="200" y="200" width="160" height="60"/>
  <!-- The missing corner, (b/2)^2. -->
  <rect class="dg-off" x="360" y="200" width="60" height="60"/>
  <text class="dg-on-hot" x="280" y="120" dy="0.35em" text-anchor="middle">x²</text>
  <text x="390" y="120" dy="0.35em" text-anchor="middle">bx/2</text>
  <text x="280" y="230" dy="0.35em" text-anchor="middle">bx/2</text>
  <text class="dg-faint" x="390" y="230" dy="0.35em" text-anchor="middle">(b/2)²</text>
  <text x="280" y="22" dy="0.35em" text-anchor="middle">x</text>
  <text x="390" y="22" dy="0.35em" text-anchor="middle">b/2</text>
  <text x="182" y="120" dy="0.35em" text-anchor="middle">x</text>
  <text x="176" y="230" dy="0.35em" text-anchor="middle">b/2</text>
  <text class="dg-code" x="450" y="140" dy="0.35em">x² + bx + (b/2)²</text>
  <text class="dg-code" x="450" y="164" dy="0.35em">= (x + b/2)²</text>
</svg>
