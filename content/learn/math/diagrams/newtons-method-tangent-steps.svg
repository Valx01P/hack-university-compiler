  <line class="dg-line" x1="538.8" y1="253.6" x2="538.8" y2="263.6"/>
  <line class="dg-line" x1="75" y1="315.7" x2="85" y2="315.7"/>
  <text class="dg-note" x="70" y="315.7" dy="0.35em" text-anchor="end">−2</text>
  <line class="dg-line" x1="75" y1="201.4" x2="85" y2="201.4"/>
