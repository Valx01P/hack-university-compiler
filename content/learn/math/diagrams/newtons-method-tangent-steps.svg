<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>Newton's method on x² − 2, starting at 3</title>
  <desc>The parabola y = x² − 2 crosses the x-axis at √2. From x₀ = 3, the tangent line at the point (3, 7) meets the x-axis at x₁ ≈ 1.833. A dashed line rises from there to the curve, and the next tangent meets the axis at x₂ ≈ 1.462, then x₃ ≈ 1.415, each closer to √2 ≈ 1.414.</desc>
