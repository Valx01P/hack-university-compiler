<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>Near a zero of multiplicity 1, 2, or 3: cross, touch, or cross flattened</title>
  <desc>Three small graphs of a polynomial near its zero at x = 1. With (x − 1) to the first power the graph crosses the axis at a slant. With (x − 1)² it touches the axis and turns back, staying on one side. With (x − 1)³ it crosses, but flattens out against the axis as it passes through.</desc>
  <line class="dg-line" x1="20" y1="115" x2="220" y2="115" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="120" y1="111" x2="120" y2="119"/>
  <text class="dg-note" x="120" y="131" text-anchor="middle">1</text>
  <line class="dg-line" x1="48.6" y1="210" x2="48.6" y2="20" marker-end="url(#arrow)"/>
  <polyline class="dg-flow" points="24.8,210 215.2,20"/>
  <circle class="dg-hot" cx="120" cy="115" r="5"/>
  <text class="dg-code" x="120" y="236" text-anchor="middle">(x − 1)</text>
  <text class="dg-note" x="120" y="258" text-anchor="middle">m = 1: crosses</text>
  <line class="dg-line" x1="240" y1="115" x2="440" y2="115" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="111" x2="340" y2="119"/>
  <text class="dg-note" x="340" y="131" text-anchor="middle">1</text>
  <line class="dg-line" x1="268.6" y1="210" x2="268.6" y2="20" marker-end="url(#arrow)"/>
  <polyline class="dg-flow" points="257.5,20 268,42.6 278.5,62.2 288.5,78 299,91.5 309.5,102 319.5,109.1 324.5,111.6 330,113.6 335,114.7 340,115 345,114.7 350,113.6 355.5,111.6 360.5,109.1 365.5,105.9 371,101.6 381,91.5 391,78.7 401.5,62.2 412,42.6 422.5,20"/>
  <circle class="dg-hot" cx="340" cy="115" r="5"/>
  <text class="dg-code" x="340" y="236" text-anchor="middle">(x − 1)²</text>
  <text class="dg-note" x="340" y="258" text-anchor="middle">m = 2: touches</text>
  <line class="dg-line" x1="460" y1="115" x2="660" y2="115" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="560" y1="111" x2="560" y2="119"/>
  <text class="dg-note" x="560" y="131" text-anchor="middle">1</text>
  <line class="dg-line" x1="488.6" y1="210" x2="488.6" y2="20" marker-end="url(#arrow)"/>
  <polyline class="dg-flow" points="481.4,210 489,185 497,163.9 505.5,146.6 510,139.4 514.5,133.4 519.5,128 524.5,123.7 530,120.3 535.5,117.9 541,116.3 547,115.4 570,114.8 580,113.4 585.5,111.8 590.5,109.5 595,106.6 599.5,103 605,97.2 610,90.6 615,82.5 620,72.8 625,61.3 629.5,49.4 638.6,20"/>
  <circle class="dg-hot" cx="560" cy="115" r="5"/>
  <text class="dg-code" x="560" y="236" text-anchor="middle">(x − 1)³</text>
  <text class="dg-note" x="560" y="258" text-anchor="middle">m = 3: crosses, flat</text>
</svg>
