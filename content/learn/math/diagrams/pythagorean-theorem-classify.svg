<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>The angle between sides a and b decides how c² compares with a² + b²</title>
  <desc>Three triangles, each with sides a = 3 and b = 4 meeting at a corner C. In the first the angle at C is 60 degrees and the third side c has c² = 13, less than a² + b² = 25, so the triangle is acute. In the second the angle is 90 degrees and c² = 25 exactly, a right triangle. In the third the angle is 120 degrees and c² = 37, more than 25, so the triangle is obtuse.</desc>
  <polygon class="dg-box" points="70,190 190,190 115,112.1"/>
  <line class="dg-flow" x1="115" y1="112.1" x2="190" y2="190"/>
  <path class="dg-line" d="M86 190 A16 16 0 0 0 78 176.1"/>
  <text class="dg-note" x="60" y="206" dy="0.35em" text-anchor="middle">C</text>
  <text class="dg-note" x="130" y="206" dy="0.35em" text-anchor="middle">b = 4</text>
  <text class="dg-note" x="62.5" y="151" dy="0.35em" text-anchor="middle">a = 3</text>
  <text x="166.5" y="139" dy="0.35em" text-anchor="middle">c</text>
  <text class="dg-heading" x="130" y="50" dy="0.35em" text-anchor="middle">acute</text>
  <text class="dg-code" x="130" y="232" dy="0.35em" text-anchor="middle">c² = 13 &lt; 25</text>
  <text class="dg-note" x="130" y="254" dy="0.35em" text-anchor="middle">angle C = 60°</text>
  <polygon class="dg-box" points="300,190 420,190 300,100"/>
  <line class="dg-flow" x1="300" y1="100" x2="420" y2="190"/>
  <polyline class="dg-line" points="312,190 312,178 300,178"/>
  <text class="dg-note" x="290" y="206" dy="0.35em" text-anchor="middle">C</text>
  <text class="dg-note" x="360" y="206" dy="0.35em" text-anchor="middle">b = 4</text>
  <text class="dg-note" x="270" y="145" dy="0.35em" text-anchor="middle">a = 3</text>
  <text x="374" y="133" dy="0.35em" text-anchor="middle">c</text>
  <text class="dg-heading" x="360" y="50" dy="0.35em" text-anchor="middle">right</text>
  <text class="dg-code" x="360" y="232" dy="0.35em" text-anchor="middle">c² = 25 = 25</text>
  <text class="dg-note" x="360" y="254" dy="0.35em" text-anchor="middle">angle C = 90°</text>
  <polygon class="dg-box" points="520,190 640,190 475,112.1"/>
  <line class="dg-flow" x1="475" y1="112.1" x2="640" y2="190"/>
  <path class="dg-line" d="M536 190 A16 16 0 0 0 512 176.1"/>
  <text class="dg-note" x="510" y="206" dy="0.35em" text-anchor="middle">C</text>
  <text class="dg-note" x="580" y="206" dy="0.35em" text-anchor="middle">b = 4</text>
  <text class="dg-note" x="467.5" y="151" dy="0.35em" text-anchor="middle">a = 3</text>
  <text x="571.5" y="139" dy="0.35em" text-anchor="middle">c</text>
  <text class="dg-heading" x="580" y="50" dy="0.35em" text-anchor="middle">obtuse</text>
  <text class="dg-code" x="580" y="232" dy="0.35em" text-anchor="middle">c² = 37 &gt; 25</text>
  <text class="dg-note" x="580" y="254" dy="0.35em" text-anchor="middle">angle C = 120°</text>
</svg>
