<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The area of an (x + 3) by (x + 5) rectangle, split into four parts</title>
  <desc>A rectangle x + 5 wide and x + 3 tall. A vertical cut after the first x units and a horizontal cut after the first x units split it into four rectangles: x by x, which is x², x by 5, which is 5x, 3 by x, which is 3x, and 3 by 5, which is 15. The whole area (x + 3)(x + 5) is the sum of the four parts, x² + 5x + 3x + 15, which is x² + 8x + 15.</desc>
  <!-- Columns: x is 200 wide, 5 is 100 wide. Rows: x is 200 tall, 3 is 60 tall. -->
  <rect class="dg-box" x="160" y="50" width="200" height="200"/>
  <rect class="dg-box" x="360" y="50" width="100" height="200"/>
  <rect class="dg-box" x="160" y="250" width="200" height="60"/>
  <rect class="dg-hot" x="360" y="250" width="100" height="60"/>
  <text x="260" y="150" dy="0.35em" text-anchor="middle">x²</text>
  <text x="410" y="150" dy="0.35em" text-anchor="middle">5x</text>
  <text x="260" y="280" dy="0.35em" text-anchor="middle">3x</text>
  <text class="dg-on-hot" x="410" y="280" dy="0.35em" text-anchor="middle">15</text>
  <!-- Side lengths. -->
  <text class="dg-heading" x="260" y="30" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-heading" x="410" y="30" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-heading" x="140" y="150" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-heading" x="140" y="280" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="340" y="338" dy="0.35em" text-anchor="middle">(x + 3)(x + 5) = x² + 5x + 3x + 15 = x² + 8x + 15</text>
</svg>
