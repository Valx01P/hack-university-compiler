<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>Local and absolute extremes of a cubic on a closed interval</title>
  <desc>The graph of f(x) = x³ − 6x² + 9x + 1 from x = 0.5 to x = 4.25. It rises to a local maximum at (1, 5), falls to a minimum at (3, 1) that is both local and absolute, then rises to the right end at (4.25, 7.64), the absolute maximum. The left end, (0.5, 4.125), is neither a maximum nor a minimum.</desc>
