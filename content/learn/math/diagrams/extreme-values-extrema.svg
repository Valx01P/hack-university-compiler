  <line class="dg-line" x1="476.4" y1="305" x2="476.4" y2="315"/>
  <text class="dg-note" x="476.4" y="328" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="103.4" y1="243.3" x2="113.4" y2="243.3"/>
  <text class="dg-note" x="98.4" y="243.3" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="103.4" y1="176.7" x2="113.4" y2="176.7"/>
  <text class="dg-note" x="98.4" y="176.7" dy="0.35em" text-anchor="end">4</text>
  <line class="dg-line" x1="103.4" y1="110" x2="113.4" y2="110"/>
  <text class="dg-note" x="98.4" y="110" dy="0.35em" text-anchor="end">6</text>
  <line class="dg-line" x1="103.4" y1="43.3" x2="113.4" y2="43.3"/>
