<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>Errors of forward and central differences for sin at 1 as h shrinks</title>
  <desc>A plot of the error against h, from h = 10⁻¹ on the left to 10⁻¹⁶ on the right, both on powers-of-ten scales. The forward error falls steadily to about 10⁻⁹ at h = 10⁻⁸, then rises as rounding takes over. The dashed central error falls faster, to about 10⁻¹¹ near h = 10⁻⁵, then rises too.</desc>
  <line class="dg-line" x1="100.0" y1="340.0" x2="626.0" y2="340.0" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="100.0" y1="340.0" x2="100.0" y2="24.0" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="110.0" y1="334.0" x2="110.0" y2="346.0"/>
  <text x="110.0" y="360.0" dy="0.35em" text-anchor="middle">10⁻¹</text>
  <line class="dg-line" x1="210.0" y1="334.0" x2="210.0" y2="346.0"/>
  <text x="210.0" y="360.0" dy="0.35em" text-anchor="middle">10⁻⁴</text>
  <line class="dg-line" x1="343.3" y1="334.0" x2="343.3" y2="346.0"/>
  <text x="343.3" y="360.0" dy="0.35em" text-anchor="middle">10⁻⁸</text>
  <line class="dg-line" x1="476.7" y1="334.0" x2="476.7" y2="346.0"/>
  <text x="476.7" y="360.0" dy="0.35em" text-anchor="middle">10⁻¹²</text>
  <line class="dg-line" x1="610.0" y1="334.0" x2="610.0" y2="346.0"/>
  <text x="610.0" y="360.0" dy="0.35em" text-anchor="middle">10⁻¹⁶</text>
  <text class="dg-note" x="636.0" y="340.0" dy="0.35em" text-anchor="start">h</text>
  <line class="dg-line" x1="94.0" y1="40.0" x2="106.0" y2="40.0"/>
  <text x="88.0" y="40.0" dy="0.35em" text-anchor="end">1</text>
  <line class="dg-line" x1="94.0" y1="136.7" x2="106.0" y2="136.7"/>
  <text x="88.0" y="136.7" dy="0.35em" text-anchor="end">10⁻⁴</text>
  <line class="dg-line" x1="94.0" y1="233.3" x2="106.0" y2="233.3"/>
  <text x="88.0" y="233.3" dy="0.35em" text-anchor="end">10⁻⁸</text>
  <line class="dg-line" x1="94.0" y1="330.0" x2="106.0" y2="330.0"/>
  <text x="88.0" y="330.0" dy="0.35em" text-anchor="end">10⁻¹²</text>
  <text class="dg-note" x="100.0" y="12.0" dy="0.35em" text-anchor="middle">error</text>
  <polyline class="dg-line dg-dashed" points="110.0,113.6 143.3,161.9 176.7,210.3 210.0,258.6 243.3,304.7 276.7,295.1 310.0,274.7 343.3,247.6 376.7,246.1 410.0,214.8 443.3,183.4 476.7,158.7 510.0,130.6 543.3,98.7 576.7,84.2 610.0,84.2"/>
  <polyline class="dg-flow" points="110.0,73.0 143.3,97.4 176.7,121.6 210.0,145.7 243.3,169.9 276.7,194.1 310.0,218.3 343.3,246.1 376.7,215.9 410.0,214.8 443.3,183.4 476.7,145.5 510.0,115.7 543.3,98.7 576.7,84.2 610.0,46.5"/>
