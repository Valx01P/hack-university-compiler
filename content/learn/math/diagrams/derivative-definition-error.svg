  <text class="dg-note" x="356.7" y="288.9" dy="0.35em" text-anchor="start">best h ≈ 10⁻⁸</text>
  <text class="dg-note" x="496.7" y="117.3" dy="0.35em" text-anchor="end">rounding takes over</text>
