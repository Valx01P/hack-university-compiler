<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>The coordinate plane, its four quadrants, and five points</title>
  <desc>The x-axis runs across and the y-axis up, crossing at the origin. Quadrant I is upper right, where both coordinates are positive, and II, III, and IV follow counterclockwise. The points (3, 2), (−4, 1), (−2, −3), and (4, −1) sit one in each quadrant. (0, −3) is on the y-axis, in no quadrant. Dashed guides show (3, 2) as 3 across, then 2 up.</desc>
  <!-- Axes -->
  <line class="dg-line" x1="160" y1="190" x2="534" y2="190" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="340" x2="340" y2="26" marker-end="url(#arrow)"/>
  <text class="dg-note" x="534" y="176" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="350" y="28" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-line" x1="160" y1="186" x2="160" y2="194"/>
  <text class="dg-note" x="160" y="206" dy="0.35em" text-anchor="middle">−6</text>
  <line class="dg-line" x1="190" y1="186" x2="190" y2="194"/>
  <text class="dg-note" x="190" y="206" dy="0.35em" text-anchor="middle">−5</text>
  <line class="dg-line" x1="220" y1="186" x2="220" y2="194"/>
  <text class="dg-note" x="220" y="206" dy="0.35em" text-anchor="middle">−4</text>
  <line class="dg-line" x1="250" y1="186" x2="250" y2="194"/>
  <text class="dg-note" x="250" y="206" dy="0.35em" text-anchor="middle">−3</text>
  <line class="dg-line" x1="280" y1="186" x2="280" y2="194"/>
  <text class="dg-note" x="280" y="206" dy="0.35em" text-anchor="middle">−2</text>
  <line class="dg-line" x1="310" y1="186" x2="310" y2="194"/>
  <text class="dg-note" x="310" y="206" dy="0.35em" text-anchor="middle">−1</text>
  <line class="dg-line" x1="370" y1="186" x2="370" y2="194"/>
  <text class="dg-note" x="370" y="206" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="400" y1="186" x2="400" y2="194"/>
  <text class="dg-note" x="400" y="206" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="430" y1="186" x2="430" y2="194"/>
  <text class="dg-note" x="430" y="206" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="460" y1="186" x2="460" y2="194"/>
  <text class="dg-note" x="460" y="206" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="490" y1="186" x2="490" y2="194"/>
  <text class="dg-note" x="490" y="206" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="520" y1="186" x2="520" y2="194"/>
  <text class="dg-note" x="520" y="206" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="336" y1="340" x2="344" y2="340"/>
  <text class="dg-note" x="332" y="340" dy="0.35em" text-anchor="end">−5</text>
  <line class="dg-line" x1="336" y1="310" x2="344" y2="310"/>
  <text class="dg-note" x="332" y="310" dy="0.35em" text-anchor="end">−4</text>
  <line class="dg-line" x1="336" y1="280" x2="344" y2="280"/>
  <text class="dg-note" x="332" y="280" dy="0.35em" text-anchor="end">−3</text>
  <line class="dg-line" x1="336" y1="250" x2="344" y2="250"/>
  <text class="dg-note" x="332" y="250" dy="0.35em" text-anchor="end">−2</text>
  <line class="dg-line" x1="336" y1="220" x2="344" y2="220"/>
  <text class="dg-note" x="332" y="220" dy="0.35em" text-anchor="end">−1</text>
  <line class="dg-line" x1="336" y1="160" x2="344" y2="160"/>
  <text class="dg-note" x="332" y="160" dy="0.35em" text-anchor="end">1</text>
  <line class="dg-line" x1="336" y1="130" x2="344" y2="130"/>
  <text class="dg-note" x="332" y="130" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="336" y1="100" x2="344" y2="100"/>
  <text class="dg-note" x="332" y="100" dy="0.35em" text-anchor="end">3</text>
  <line class="dg-line" x1="336" y1="70" x2="344" y2="70"/>
  <text class="dg-note" x="332" y="70" dy="0.35em" text-anchor="end">4</text>
  <line class="dg-line" x1="336" y1="40" x2="344" y2="40"/>
  <text class="dg-note" x="332" y="40" dy="0.35em" text-anchor="end">5</text>
  <line class="dg-line dg-dashed" x1="430" y1="190" x2="430" y2="130"/>
  <line class="dg-line dg-dashed" x1="340" y1="130" x2="430" y2="130"/>
  <circle class="dg-hot" cx="430" cy="130" r="5"/>
  <text x="440" y="118" dy="0.35em" text-anchor="start">(3, 2)</text>
  <circle class="dg-hot" cx="220" cy="160" r="5"/>
  <text x="210" y="148" dy="0.35em" text-anchor="end">(−4, 1)</text>
  <circle class="dg-hot" cx="280" cy="280" r="5"/>
  <text x="270" y="294" dy="0.35em" text-anchor="end">(−2, −3)</text>
  <circle class="dg-hot" cx="460" cy="220" r="5"/>
  <text x="470" y="234" dy="0.35em" text-anchor="start">(4, −1)</text>
  <circle class="dg-hot" cx="340" cy="280" r="5"/>
  <text x="350" y="284" dy="0.35em" text-anchor="start">(0, −3)</text>
  <text class="dg-heading" x="475" y="70" dy="0.35em" text-anchor="middle">I (+, +)</text>
  <text class="dg-heading" x="205" y="70" dy="0.35em" text-anchor="middle">II (−, +)</text>
  <text class="dg-heading" x="205" y="310" dy="0.35em" text-anchor="middle">III (−, −)</text>
  <text class="dg-heading" x="475" y="310" dy="0.35em" text-anchor="middle">IV (+, −)</text>
  <text class="dg-note" x="332" y="178" dy="0.35em" text-anchor="end">origin</text>
</svg>
