<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The ellipse 5x² + 4xy + 2y² = 1 and its principal axes</title>
  <desc>The curve where 5x squared plus 4xy plus 2y squared equals 1 is a tilted ellipse. Its axes point along the eigenvectors of the matrix [[5, 2], [2, 2]]: the short semi-axis, of length 1 over the square root of 6, lies along (2, 1), whose eigenvalue is 6, and the long semi-axis, of length 1, lies along (−1, 2), whose eigenvalue is 1.</desc>
