<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>The epsilon-delta picture: a strip around a and a band around L</title>
  <desc>The graph of a rising curve near x = a. A vertical strip runs from a − δ to a + δ, and a horizontal band runs from L − ε to L + ε. Where they cross is an outlined box. Over the whole strip, the highlighted piece of the curve stays inside the box, so every x within δ of a puts f(x) within ε of L.</desc>
  <!-- The box where the strip and the band cross. -->
  <rect class="dg-strong" x="326.7" y="181.7" width="131.9" height="113.3"/>
  <line class="dg-line" x1="100.0" y1="380.0" x2="616.0" y2="380.0" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="110.0" y1="390.0" x2="110.0" y2="24.0" marker-end="url(#arrow)"/>
  <text class="dg-note" x="626.0" y="380.0" dy="0.35em" text-anchor="start">x</text>
  <text class="dg-note" x="110.0" y="12.0" dy="0.35em" text-anchor="middle">y</text>
  <!-- Band edges L - eps and L + eps, strip edges a - delta and a + delta. -->
  <line class="dg-line dg-dashed" x1="110.0" y1="295.0" x2="600.0" y2="295.0"/>
  <line class="dg-line dg-dashed" x1="110.0" y1="181.7" x2="600.0" y2="181.7"/>
  <line class="dg-line dg-dashed" x1="326.7" y1="380.0" x2="326.7" y2="40.0"/>
  <line class="dg-line dg-dashed" x1="458.7" y1="380.0" x2="458.7" y2="40.0"/>
  <line class="dg-line dg-dashed" x1="110.0" y1="238.3" x2="392.7" y2="238.3"/>
  <line class="dg-line dg-dashed" x1="392.7" y1="380.0" x2="392.7" y2="238.3"/>
  <!-- The curve, with the piece over the strip highlighted. -->
  <polyline class="dg-line" points="128.8,367.2 136.5,365.5 144.2,363.5 151.9,361.5 159.6,359.4 167.3,357.1 175.0,354.7 182.7,352.2 190.4,349.6 198.1,346.8 205.8,344.0 213.5,341.0 221.2,337.9 228.9,334.7 236.6,331.4 244.3,327.9 252.0,324.4 259.7,320.7 267.4,316.9 275.1,313.0 282.8,308.9 290.5,304.8 298.1,300.5 305.8,296.1 313.5,291.6 321.2,287.0 328.9,282.2 336.6,277.3 344.3,272.4 352.0,267.3 359.7,262.0 367.4,256.7 375.1,251.2 382.8,245.7 390.5,240.0 398.2,234.2 405.9,228.2 413.6,222.2 421.3,216.0 429.0,209.8 436.7,203.3 444.4,196.8 452.1,190.2 459.8,183.4 467.4,176.6 475.1,169.6 482.8,162.5 490.5,155.2 498.2,147.9 505.9,140.4 513.6,132.8 521.3,125.1 529.0,117.3 536.7,109.4 544.4,101.3 552.1,93.2 559.8,84.9 567.5,76.5 575.2,67.9 582.9,59.3 590.6,50.5"/>
  <polyline class="dg-flow" points="326.7,283.6 331.1,280.8 335.5,278.0 339.9,275.2 344.3,272.4 348.7,269.5 353.1,266.5 357.5,263.5 361.9,260.5 366.3,257.5 370.7,254.4 375.1,251.2 379.5,248.1 383.9,244.9 388.3,241.6 392.7,238.3 397.1,235.0 401.5,231.6 405.9,228.2 410.3,224.8 414.7,221.3 419.1,217.8 423.5,214.2 427.9,210.7 432.3,207.0 436.7,203.3 441.1,199.6 445.5,195.9 449.9,192.1 454.3,188.3 458.7,184.4"/>
  <circle class="dg-hot" cx="392.7" cy="238.3" r="5"/>
  <text class="dg-code" x="584.6" y="50.6" dy="0.35em" text-anchor="end">y = f(x)</text>
  <text x="98.0" y="181.7" dy="0.35em" text-anchor="end">L + ε</text>
  <text x="98.0" y="238.3" dy="0.35em" text-anchor="end">L</text>
  <text x="98.0" y="295.0" dy="0.35em" text-anchor="end">L − ε</text>
  <text x="326.7" y="400.0" dy="0.35em" text-anchor="middle">a − δ</text>
  <text x="392.7" y="400.0" dy="0.35em" text-anchor="middle">a</text>
  <text x="458.7" y="400.0" dy="0.35em" text-anchor="middle">a + δ</text>
</svg>
