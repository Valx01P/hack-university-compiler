<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <title>Multiplication as area: a 3 by 4 rectangle holds 12 unit squares</title>
  <desc>A rectangle made of unit squares, 3 rows tall and 4 squares wide. Each row holds 4 squares, so counting row by row adds 4 three times. The rectangle holds 4 + 4 + 4 = 3 × 4 = 12 squares, which is why a product is also an area.</desc>
  <!-- 3 rows of 4 unit squares. -->
  <rect class="dg-box" x="260" y="60" width="40" height="40"/>
  <rect class="dg-box" x="300" y="60" width="40" height="40"/>
  <rect class="dg-box" x="340" y="60" width="40" height="40"/>
  <rect class="dg-box" x="380" y="60" width="40" height="40"/>
  <rect class="dg-box" x="260" y="100" width="40" height="40"/>
  <rect class="dg-box" x="300" y="100" width="40" height="40"/>
  <rect class="dg-box" x="340" y="100" width="40" height="40"/>
  <rect class="dg-box" x="380" y="100" width="40" height="40"/>
  <rect class="dg-box" x="260" y="140" width="40" height="40"/>
  <rect class="dg-box" x="300" y="140" width="40" height="40"/>
  <rect class="dg-box" x="340" y="140" width="40" height="40"/>
  <rect class="dg-box" x="380" y="140" width="40" height="40"/>
  <text x="340" y="36" dy="0.35em" text-anchor="middle">4 in each row</text>
  <text x="244" y="120.0" dy="0.35em" text-anchor="end">3 rows</text>
  <text class="dg-note" x="440" y="80.0" dy="0.35em" text-anchor="start">4</text>
  <text class="dg-note" x="440" y="120.0" dy="0.35em" text-anchor="start">4</text>
  <text class="dg-note" x="440" y="160.0" dy="0.35em" text-anchor="start">4</text>
  <text class="dg-code" x="340" y="212" dy="0.35em" text-anchor="middle">4 + 4 + 4 = 3 × 4 = 12</text>
</svg>
