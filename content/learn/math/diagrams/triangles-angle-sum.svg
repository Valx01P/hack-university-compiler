<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Why a triangle's angles add to 180°: the parallel through C</title>
  <desc>Triangle ABC with A at the lower left, B at the lower right, and C at the top. Through C runs the line parallel to AB. At C the straight line is split into three angles: a copy of angle A on the left, angle C in the middle, and a copy of angle B on the right. The copies are alternate interior angles, so A + C + B = 180°, a straight angle.</desc>
  <line class="dg-flow" x1="40" y1="70" x2="640" y2="70"/>
  <text class="dg-note" x="650" y="54" dy="0.35em" text-anchor="end">parallel to AB</text>
  <polygon class="dg-box" points="120,250 520,250 330,70"/>
  <path class="dg-hot" d="M120 250 L160 250 A40 40 0 0 0 150.4 224 Z"/>
  <text x="174.4" y="229.9" dy="0.35em" text-anchor="middle">A</text>
  <path class="dg-line" d="M491 222.5 A40 40 0 0 0 480 250"/>
  <text x="466.1" y="228.5" dy="0.35em" text-anchor="middle">B</text>
  <path class="dg-line" d="M304.2 92.1 A34 34 0 0 0 354.7 93.4"/>
  <path class="dg-hot" d="M330 70 L290 70 A40 40 0 0 0 299.6 96 Z"/>
  <text x="275.6" y="90.1" dy="0.35em" text-anchor="middle">A</text>
  <path class="dg-line" d="M359 97.5 A40 40 0 0 0 370 70"/>
  <text x="383.9" y="91.5" dy="0.35em" text-anchor="middle">B</text>
  <text x="330" y="120" dy="0.35em" text-anchor="middle">C</text>
  <text class="dg-heading" x="104" y="264" dy="0.35em" text-anchor="middle">A</text>
  <text class="dg-heading" x="536" y="264" dy="0.35em" text-anchor="middle">B</text>
  <text class="dg-heading" x="330" y="50" dy="0.35em" text-anchor="middle">C</text>
  <text class="dg-code" x="340" y="284" dy="0.35em" text-anchor="middle">A + C + B = 180°, the straight angle at C</text>
</svg>
