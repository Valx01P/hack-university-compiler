<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560">
  <title>The unit circle with the exact coordinates of the standard angles</title>
  <desc>The unit circle with sixteen marked points: the axis angles 0°, 90°, 180°, and 270°, and the angles with reference angles 30°, 45°, and 60° in every quadrant. Each point is labeled with its angle in degrees and radians and with its exact coordinates, using 1/2, √2/2, and √3/2 with the signs of its quadrant.</desc>
  <circle class="dg-off" cx="340" cy="280" r="165"/>
  <line class="dg-line" x1="133.8" y1="280" x2="546.2" y2="280" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="486.2" x2="340" y2="73.8" marker-end="url(#arrow)"/>
  <circle class="dg-strong" cx="505" cy="280" r="4"/>
  <text class="dg-code" x="518.8" y="256" dy="0.35em" text-anchor="start">(1, 0)</text>
  <text class="dg-note" x="518.8" y="272" dy="0.35em" text-anchor="start">0° = 0</text>
  <line class="dg-line dg-dashed" x1="340" y1="280" x2="482.9" y2="197.5"/>
  <circle class="dg-strong" cx="482.9" cy="197.5" r="4"/>
  <text class="dg-note" x="454.3" y="214" dy="0.35em" text-anchor="middle">30°</text>
  <text class="dg-code" x="505.8" y="176.3" dy="0.35em" text-anchor="start">(√3/2, 1/2)</text>
  <text class="dg-note" x="505.8" y="192.3" dy="0.35em" text-anchor="start">π/6</text>
  <line class="dg-line dg-dashed" x1="340" y1="280" x2="456.7" y2="163.3"/>
  <circle class="dg-strong" cx="456.7" cy="163.3" r="4"/>
  <text class="dg-note" x="433.3" y="186.7" dy="0.35em" text-anchor="middle">45°</text>
  <text class="dg-code" x="475.3" y="136.7" dy="0.35em" text-anchor="start">(√2/2, √2/2)</text>
  <text class="dg-note" x="475.3" y="152.7" dy="0.35em" text-anchor="start">π/4</text>
  <line class="dg-line dg-dashed" x1="340" y1="280" x2="422.5" y2="137.1"/>
  <circle class="dg-strong" cx="422.5" cy="137.1" r="4"/>
  <text class="dg-note" x="406" y="165.7" dy="0.35em" text-anchor="middle">60°</text>
  <text class="dg-code" x="435.7" y="106.2" dy="0.35em" text-anchor="start">(1/2, √3/2)</text>
  <text class="dg-note" x="435.7" y="122.2" dy="0.35em" text-anchor="start">π/3</text>
  <circle class="dg-strong" cx="340" cy="115" r="4"/>
  <text class="dg-code" x="350" y="91.2" dy="0.35em" text-anchor="start">(0, 1)</text>
  <text class="dg-note" x="350" y="107.2" dy="0.35em" text-anchor="start">90° = π/2</text>
  <line class="dg-line dg-dashed" x1="340" y1="280" x2="257.5" y2="137.1"/>
  <circle class="dg-strong" cx="257.5" cy="137.1" r="4"/>
  <text class="dg-note" x="274" y="165.7" dy="0.35em" text-anchor="middle">120°</text>
  <text class="dg-code" x="244.3" y="106.2" dy="0.35em" text-anchor="end">(−1/2, √3/2)</text>
  <text class="dg-note" x="244.3" y="122.2" dy="0.35em" text-anchor="end">2π/3</text>
  <line class="dg-line dg-dashed" x1="340" y1="280" x2="223.3" y2="163.3"/>
  <circle class="dg-strong" cx="223.3" cy="163.3" r="4"/>
  <text class="dg-note" x="246.7" y="186.7" dy="0.35em" text-anchor="middle">135°</text>
  <text class="dg-code" x="204.7" y="136.7" dy="0.35em" text-anchor="end">(−√2/2, √2/2)</text>
  <text class="dg-note" x="204.7" y="152.7" dy="0.35em" text-anchor="end">3π/4</text>
  <line class="dg-line dg-dashed" x1="340" y1="280" x2="197.1" y2="197.5"/>
  <circle class="dg-strong" cx="197.1" cy="197.5" r="4"/>
  <text class="dg-note" x="225.7" y="214" dy="0.35em" text-anchor="middle">150°</text>
  <text class="dg-code" x="174.2" y="176.3" dy="0.35em" text-anchor="end">(−√3/2, 1/2)</text>
  <text class="dg-note" x="174.2" y="192.3" dy="0.35em" text-anchor="end">5π/6</text>
  <circle class="dg-strong" cx="175" cy="280" r="4"/>
  <text class="dg-code" x="161.2" y="256" dy="0.35em" text-anchor="end">(−1, 0)</text>
  <text class="dg-note" x="161.2" y="272" dy="0.35em" text-anchor="end">180° = π</text>
  <line class="dg-line dg-dashed" x1="340" y1="280" x2="197.1" y2="362.5"/>
  <circle class="dg-strong" cx="197.1" cy="362.5" r="4"/>
  <text class="dg-note" x="225.7" y="346" dy="0.35em" text-anchor="middle">210°</text>
  <text class="dg-code" x="174.2" y="367.7" dy="0.35em" text-anchor="end">(−√3/2, −1/2)</text>
  <text class="dg-note" x="174.2" y="383.7" dy="0.35em" text-anchor="end">7π/6</text>
  <line class="dg-line dg-dashed" x1="340" y1="280" x2="223.3" y2="396.7"/>
  <circle class="dg-strong" cx="223.3" cy="396.7" r="4"/>
  <text class="dg-note" x="246.7" y="373.3" dy="0.35em" text-anchor="middle">225°</text>
  <text class="dg-code" x="204.7" y="407.3" dy="0.35em" text-anchor="end">(−√2/2, −√2/2)</text>
  <text class="dg-note" x="204.7" y="423.3" dy="0.35em" text-anchor="end">5π/4</text>
  <line class="dg-line dg-dashed" x1="340" y1="280" x2="257.5" y2="422.9"/>
  <circle class="dg-strong" cx="257.5" cy="422.9" r="4"/>
  <text class="dg-note" x="274" y="394.3" dy="0.35em" text-anchor="middle">240°</text>
  <text class="dg-code" x="244.3" y="437.8" dy="0.35em" text-anchor="end">(−1/2, −√3/2)</text>
  <text class="dg-note" x="244.3" y="453.8" dy="0.35em" text-anchor="end">4π/3</text>
  <circle class="dg-strong" cx="340" cy="445" r="4"/>
  <text class="dg-code" x="350" y="452.8" dy="0.35em" text-anchor="start">(0, −1)</text>
  <text class="dg-note" x="350" y="468.8" dy="0.35em" text-anchor="start">270° = 3π/2</text>
  <line class="dg-line dg-dashed" x1="340" y1="280" x2="422.5" y2="422.9"/>
  <circle class="dg-strong" cx="422.5" cy="422.9" r="4"/>
  <text class="dg-note" x="406" y="394.3" dy="0.35em" text-anchor="middle">300°</text>
  <text class="dg-code" x="435.7" y="437.8" dy="0.35em" text-anchor="start">(1/2, −√3/2)</text>
  <text class="dg-note" x="435.7" y="453.8" dy="0.35em" text-anchor="start">5π/3</text>
  <line class="dg-line dg-dashed" x1="340" y1="280" x2="456.7" y2="396.7"/>
  <circle class="dg-strong" cx="456.7" cy="396.7" r="4"/>
  <text class="dg-note" x="433.3" y="373.3" dy="0.35em" text-anchor="middle">315°</text>
  <text class="dg-code" x="475.3" y="407.3" dy="0.35em" text-anchor="start">(√2/2, −√2/2)</text>
  <text class="dg-note" x="475.3" y="423.3" dy="0.35em" text-anchor="start">7π/4</text>
  <line class="dg-line dg-dashed" x1="340" y1="280" x2="482.9" y2="362.5"/>
  <circle class="dg-strong" cx="482.9" cy="362.5" r="4"/>
  <text class="dg-note" x="454.3" y="346" dy="0.35em" text-anchor="middle">330°</text>
  <text class="dg-code" x="505.8" y="367.7" dy="0.35em" text-anchor="start">(√3/2, −1/2)</text>
  <text class="dg-note" x="505.8" y="383.7" dy="0.35em" text-anchor="start">11π/6</text>
</svg>
