<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Scaling a cube by 2: each face holds 4 unit squares and the cube holds 8 unit cubes</title>
  <desc>On the left, a unit cube with edge 1. On the right, the cube scaled by k = 2, with edge 2. Each of its faces is split into 2 × 2 = 4 unit squares, so every area is 4 times as big, and the cube is split into 2 × 2 × 2 = 8 unit cubes, so the volume is 8 times as big. In general lengths scale by k, areas by k², and volumes by k³.</desc>
  <polygon class="dg-box" points="90,250 160,250 160,180 90,180"/>
  <polygon class="dg-box" points="160,250 198.5,225.5 198.5,155.5 160,180"/>
  <polygon class="dg-box" points="90,180 160,180 198.5,155.5 128.5,155.5"/>
  <text class="dg-note" x="125" y="276" dy="0.35em" text-anchor="middle">edge 1</text>
  <text class="dg-code" x="150" y="30" dy="0.35em" text-anchor="middle">area 1, volume 1</text>
  <polygon class="dg-hot" points="360,260 500,260 500,120 360,120"/>
  <polygon class="dg-box" points="500,260 577,211 577,71 500,120"/>
  <polygon class="dg-box" points="360,120 500,120 577,71 437,71"/>
  <line class="dg-line" x1="430" y1="260" x2="430" y2="120"/>
  <line class="dg-line" x1="360" y1="190" x2="500" y2="190"/>
  <line class="dg-line" x1="500" y1="190" x2="577" y2="141"/>
  <line class="dg-line" x1="538.5" y1="235.5" x2="538.5" y2="95.5"/>
  <line class="dg-line" x1="430" y1="120" x2="507" y2="71"/>
  <line class="dg-line" x1="398.5" y1="95.5" x2="538.5" y2="95.5"/>
  <text class="dg-note" x="430" y="286" dy="0.35em" text-anchor="middle">edge 2</text>
  <text class="dg-code" x="480" y="30" dy="0.35em" text-anchor="middle">face area 4, volume 8</text>
</svg>
