<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>A circle's center, radius, diameter, and chord, and its circumference unrolled</title>
  <desc>On the left, a circle with center O. A radius r runs from O to the circle, a diameter d = 2r crosses through O, and a chord joins two other points of the circle. On the right, the circumference of a smaller circle is unrolled into a straight segment. Below it, three of that circle's diameters laid end to end fall a little short, so C is a bit more than 3 diameters: C = πd with π about 3.14.</desc>
  <circle class="dg-box" cx="150" cy="140" r="100"/>
  <line class="dg-flow" x1="50" y1="140" x2="250" y2="140"/>
  <text class="dg-note" x="100" y="156" dy="0.35em" text-anchor="middle">diameter d</text>
  <line class="dg-line" x1="150" y1="140" x2="200" y2="53.4"/>
  <text class="dg-heading" x="164" y="90" dy="0.35em" text-anchor="middle">r</text>
  <line class="dg-line" x1="59.4" y1="182.3" x2="226.6" y2="204.3"/>
  <text class="dg-note" x="149" y="209.3" dy="0.35em" text-anchor="middle">chord</text>
  <circle class="dg-strong" cx="150" cy="140" r="4"/>
  <text class="dg-heading" x="148" y="126" dy="0.35em" text-anchor="middle">O</text>
  <circle class="dg-strong" cx="59.4" cy="182.3" r="3.5"/>
  <circle class="dg-strong" cx="226.6" cy="204.3" r="3.5"/>
  <circle class="dg-strong" cx="200" cy="53.4" r="3.5"/>
  <circle class="dg-box" cx="363" cy="60" r="33"/>
  <line class="dg-line" x1="330" y1="60" x2="396" y2="60"/>
  <text class="dg-note" x="423" y="60" dy="0.35em" text-anchor="start">diameter d</text>
  <line class="dg-flow" x1="330" y1="150" x2="537.3" y2="150"/>
  <line class="dg-line" x1="330" y1="143" x2="330" y2="157"/>
  <line class="dg-line" x1="537.3" y1="143" x2="537.3" y2="157"/>
  <text class="dg-note" x="433.7" y="130" dy="0.35em" text-anchor="middle">the circumference C, unrolled</text>
  <line class="dg-line" x1="330" y1="200" x2="396" y2="200"/>
  <line class="dg-line" x1="330" y1="193" x2="330" y2="207"/>
  <text class="dg-note" x="363" y="218" dy="0.35em" text-anchor="middle">d</text>
  <line class="dg-line" x1="396" y1="200" x2="462" y2="200"/>
  <line class="dg-line" x1="396" y1="193" x2="396" y2="207"/>
  <text class="dg-note" x="429" y="218" dy="0.35em" text-anchor="middle">d</text>
  <line class="dg-line" x1="462" y1="200" x2="528" y2="200"/>
  <line class="dg-line" x1="462" y1="193" x2="462" y2="207"/>
  <text class="dg-note" x="495" y="218" dy="0.35em" text-anchor="middle">d</text>
  <line class="dg-line" x1="528" y1="193" x2="528" y2="207"/>
  <line class="dg-dashed dg-line" x1="528" y1="200" x2="537.3" y2="200"/>
  <text class="dg-note" x="545.3" y="200" dy="0.35em" text-anchor="start">a bit more</text>
  <text class="dg-code" x="433.7" y="250" dy="0.35em" text-anchor="middle">C = πd ≈ 3.14 × d</text>
</svg>
