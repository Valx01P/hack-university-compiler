<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A spring at its natural length and stretched by x</title>
  <desc>Top: a spring attached to a wall holds a block at its natural length, with no force. Bottom: the block is pulled out a distance x past the natural length, marked by a dashed line, and the spring pulls back toward the wall with force F = kx, by Hooke's law.</desc>
  <rect class="dg-box" x="40" y="30" width="20" height="220"/>
  <polyline class="dg-line" points="60,80 72,80 80.6,92 97.9,68 115.1,92 132.4,68 149.6,92 166.9,68 184.1,92 201.4,68 218.6,92 235.9,68 253.1,92 270.4,68 287.6,92 304.9,68 322.1,92 339.4,68 348,80 360,80"/>
  <rect class="dg-box" x="360" y="56" width="56" height="48" rx="8"/>
  <text x="388" y="85" text-anchor="middle">block</text>
  <text class="dg-note" x="210" y="46" text-anchor="middle">natural length, no force</text>
  <polyline class="dg-line" points="60,200 72,200 85.6,209 112.9,191 140.1,209 167.4,191 194.6,209 221.9,191 249.1,209 276.4,191 303.6,209 330.9,191 358.1,209 385.4,191 412.6,209 439.9,191 467.1,209 494.4,191 508,200 520,200"/>
  <rect class="dg-hot" x="520" y="176" width="56" height="48" rx="8"/>
  <line class="dg-flow" x1="516" y1="244" x2="426" y2="244" marker-end="url(#arrow-flow)"/>
  <text x="470" y="266" text-anchor="middle">pulls back: F = kx</text>
  <line class="dg-line dg-dashed" x1="360" y1="120" x2="360" y2="250"/>
  <line class="dg-line" x1="360" y1="160" x2="520" y2="160"/>
  <line class="dg-line" x1="360" y1="154" x2="360" y2="166"/>
  <line class="dg-line" x1="520" y1="154" x2="520" y2="166"/>
  <text x="440" y="152" text-anchor="middle">stretch x</text>
</svg>
