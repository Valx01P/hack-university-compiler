<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>An exterior angle equals the sum of the two remote interior angles</title>
  <desc>Triangle ABC with angles A = 40° and B = 65°. Side BC is extended past C, and the exterior angle between the extension and side CA is highlighted. It measures 105°, which is 40° + 65°, the two interior angles away from it. The interior angle at C is 75°, and with the exterior angle it makes a straight line, 75° + 105° = 180°.</desc>
  <path class="dg-hot" d="M337.2 71 L320.3 34.7 A40 40 0 0 0 306.6 96.7 Z"/>
  <polygon class="dg-box" points="100,270 430,270 337.2,71"/>
  <line class="dg-line" x1="337.2" y1="71" x2="299.2" y2="-10.6"/>
  <path class="dg-line" d="M134 270 A34 34 0 0 0 126 248.1"/>
  <text x="148.9" y="252.2" dy="0.35em" text-anchor="middle">40°</text>
  <path class="dg-line" d="M415.6 239.2 A34 34 0 0 0 396 270"/>
  <text x="386.1" y="242.1" dy="0.35em" text-anchor="middle">65°</text>
  <path class="dg-line" d="M317.3 87.7 A26 26 0 0 0 348.2 94.5"/>
  <text x="327.7" y="113.9" dy="0.35em" text-anchor="middle">75°</text>
  <text x="276.7" y="57.6" dy="0.35em" text-anchor="middle">105°</text>
  <text class="dg-heading" x="84" y="282" dy="0.35em" text-anchor="middle">A</text>
  <text class="dg-heading" x="446" y="282" dy="0.35em" text-anchor="middle">B</text>
  <text class="dg-heading" x="353.2" y="65" dy="0.35em" text-anchor="middle">C</text>
  <text class="dg-code" x="560" y="140" dy="0.35em" text-anchor="middle">exterior = 40° + 65° = 105°</text>
  <text class="dg-code" x="560" y="170" dy="0.35em" text-anchor="middle">75° + 105° = 180°</text>
</svg>
