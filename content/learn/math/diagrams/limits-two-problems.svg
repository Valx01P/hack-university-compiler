<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The two problems of calculus: speed at an instant and area under a curve</title>
  <desc>Left: the curve s = t² with a point P at t = 1. Dashed secant lines join P to points at t = 2, 1.5, and 1.2, and they tip toward the highlighted tangent line at P, whose slope is the speed at that instant. Right: the curve y = x² from 0 to 1 with five rectangles under it. Thinner rectangles fit the curve better, and their total area closes in on the area under the curve.</desc>
