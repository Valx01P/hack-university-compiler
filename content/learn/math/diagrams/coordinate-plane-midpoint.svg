  <text class="dg-note" x="340" y="226" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="370" y1="206" x2="370" y2="214"/>
  <text class="dg-note" x="370" y="226" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="400" y1="206" x2="400" y2="214"/>
  <text class="dg-note" x="400" y="226" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="430" y1="206" x2="430" y2="214"/>
