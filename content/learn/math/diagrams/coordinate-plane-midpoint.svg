  <line class="dg-line" x1="490" y1="206" x2="490" y2="214"/>
  <text class="dg-note" x="490" y="226" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="520" y1="206" x2="520" y2="214"/>
  <text class="dg-note" x="520" y="226" dy="0.35em" text-anchor="middle">7</text>
  <line class="dg-line" x1="306" y1="330" x2="314" y2="330"/>
  <text class="dg-note" x="302" y="330" dy="0.35em" text-anchor="end">−4</text>
  <line class="dg-line" x1="306" y1="300" x2="314" y2="300"/>
