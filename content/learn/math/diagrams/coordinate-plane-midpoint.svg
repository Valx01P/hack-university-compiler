<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The midpoint (1, 1) of the segment from (−3, 4) to (5, −2)</title>
  <desc>The segment from (−3, 4) to (5, −2) has its midpoint at (1, 1), halfway across, since 1 is the average of −3 and 5, and halfway up, since 1 is the average of 4 and −2. Each half of the segment is 5 long, and the whole segment is 10.</desc>
