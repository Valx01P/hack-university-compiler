  <text class="dg-note" x="534" y="196" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="320" y="18" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-line" x1="160" y1="206" x2="160" y2="214"/>
  <text class="dg-note" x="160" y="226" dy="0.35em" text-anchor="middle">−5</text>
  <line class="dg-line" x1="190" y1="206" x2="190" y2="214"/>
  <text class="dg-note" x="190" y="226" dy="0.35em" text-anchor="middle">−4</text>
  <line class="dg-line" x1="220" y1="206" x2="220" y2="214"/>
  <text class="dg-note" x="220" y="226" dy="0.35em" text-anchor="middle">−3</text>
  <line class="dg-line" x1="250" y1="206" x2="250" y2="214"/>
  <text class="dg-note" x="250" y="226" dy="0.35em" text-anchor="middle">−2</text>
  <line class="dg-line" x1="280" y1="206" x2="280" y2="214"/>
  <text class="dg-note" x="280" y="226" dy="0.35em" text-anchor="middle">−1</text>
