<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The product rule as a growing rectangle</title>
  <desc>A rectangle with width f and height g has area f·g. When x grows by h, the width grows by Δf and the height by Δg. The new area adds a strip g·Δf on the right, a strip f·Δg on top, and a small corner Δf·Δg. Divided by h, the strips become g·f′ and f·g′, and the corner shrinks to 0.</desc>
  <!-- The growth: one L-shaped highlighted region, divided by lines. -->
  <polygon class="dg-hot" points="120,20 590,20 590,280 480,280 480,80 120,80"/>
  <line class="dg-line" x1="480.0" y1="20.0" x2="480.0" y2="80.0"/>
  <line class="dg-line" x1="480.0" y1="80.0" x2="590.0" y2="80.0"/>
  <rect class="dg-box" x="120.0" y="80.0" width="360.0" height="200.0"/>
  <text class="dg-heading" x="300.0" y="180.0" dy="0.35em" text-anchor="middle">f · g</text>
  <text class="dg-on-hot" x="535.0" y="180.0" dy="0.35em" text-anchor="middle">g · Δf</text>
  <text class="dg-on-hot" x="300.0" y="50.0" dy="0.35em" text-anchor="middle">f · Δg</text>
  <text class="dg-on-hot" x="535.0" y="50.0" dy="0.35em" text-anchor="middle">Δf · Δg</text>
  <!-- Side labels. -->
  <text x="300.0" y="302.0" dy="0.35em" text-anchor="middle">f</text>
  <text x="535.0" y="302.0" dy="0.35em" text-anchor="middle">Δf</text>
  <text x="106.0" y="180.0" dy="0.35em" text-anchor="end">g</text>
  <text x="106.0" y="50.0" dy="0.35em" text-anchor="end">Δg</text>
</svg>
