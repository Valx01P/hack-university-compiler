<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A piecewise function that jumps at x = 1</title>
  <desc>For x below 1 the graph is the parabola y = x², which climbs to an open circle at (1, 1). For x from 1 on it is the line y = x + 2, starting at a filled dot at (1, 3). Approaching 1 from the left the heights close in on 1, and from the right on 3. The one-sided limits differ, so there is no limit at 1.</desc>
  <line class="dg-line" x1="60" y1="271" x2="620" y2="271" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="242" y1="300" x2="242" y2="20" marker-end="url(#arrow)"/>
  <text class="dg-note" x="620" y="289" text-anchor="end">x</text>
  <text class="dg-note" x="250" y="30">y</text>
  <line class="dg-line" x1="102" y1="267" x2="102" y2="275"/>
  <text class="dg-note" x="102" y="289" text-anchor="middle">−1</text>
  <line class="dg-line" x1="382" y1="267" x2="382" y2="275"/>
  <text class="dg-note" x="382" y="289" text-anchor="middle">1</text>
  <line class="dg-line" x1="522" y1="267" x2="522" y2="275"/>
  <text class="dg-note" x="522" y="289" text-anchor="middle">2</text>
  <line class="dg-line" x1="238" y1="222.8" x2="246" y2="222.8"/>
  <text class="dg-note" x="234" y="222.8" dy="0.35em" text-anchor="end">1</text>
  <line class="dg-line" x1="238" y1="174.5" x2="246" y2="174.5"/>
  <text class="dg-note" x="234" y="174.5" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="238" y1="126.2" x2="246" y2="126.2"/>
  <text class="dg-note" x="234" y="126.2" dy="0.35em" text-anchor="end">3</text>
  <line class="dg-line" x1="238" y1="77.9" x2="246" y2="77.9"/>
  <text class="dg-note" x="234" y="77.9" dy="0.35em" text-anchor="end">4</text>
  <polyline class="dg-flow" points="60,189.4 68.3,196.7 76.5,203.6 84.8,210.1 93,216.4 101.3,222.3 109.5,227.8 117.8,233 126.1,237.9 134.3,242.5 142.6,246.7 150.8,250.6 159.1,254.1 167.3,257.3 175.6,260.2 183.8,262.7 192.1,264.9 200.4,266.8 208.6,268.3 216.9,269.5 225.1,270.3 233.4,270.9 241.6,271 249.9,270.9 258.2,270.4 266.4,269.6 274.7,268.4 282.9,266.9 291.2,265.1 299.4,262.9 307.7,260.4 315.9,257.6 324.2,254.4 332.5,250.9 340.7,247 349,242.8 357.2,238.3 365.5,233.5 373.7,228.3 382,222.8"/>
  <polyline class="dg-flow" points="382,126.2 606,49"/>
  <line class="dg-line dg-dashed" x1="242" y1="222.8" x2="382" y2="222.8"/>
  <line class="dg-line dg-dashed" x1="242" y1="126.2" x2="382" y2="126.2"/>
  <circle class="dg-box" cx="382" cy="222.8" r="5"/>
  <circle class="dg-hot" cx="382" cy="126.2" r="5"/>
  <text class="dg-note" x="396" y="226.8" dy="0.35em">left limit 1 (open: not a value)</text>
  <text class="dg-note" x="396" y="142.2" dy="0.35em">right limit 3 = f(1)</text>
  <text class="dg-code" x="74" y="164.8" dy="0.35em">x²</text>
  <text class="dg-code" x="492" y="53.4" dy="0.35em">x + 2</text>
</svg>
