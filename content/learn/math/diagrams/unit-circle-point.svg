<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>The point where an angle meets the unit circle is (cos θ, sin θ)</title>
  <desc>A circle of radius 1 centered at the origin. An angle θ in standard position starts on the positive x-axis and turns counterclockwise to a ray that meets the circle at P. Dropping a perpendicular from P to the x-axis makes a right triangle with hypotenuse 1, a horizontal leg of length cos θ, and a vertical leg of length sin θ. So P is the point (cos θ, sin θ).</desc>
  <polygon class="dg-hot" points="300,200 414.7,200 414.7,119.7"/>
  <circle class="dg-off" cx="300" cy="200" r="140"/>
  <line class="dg-line" x1="118" y1="200" x2="489" y2="200" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="300" y1="382" x2="300" y2="18" marker-end="url(#arrow)"/>
  <text class="dg-note" x="493" y="214" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="308" y="24" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-line" x1="160" y1="195" x2="160" y2="205"/>
  <line class="dg-line" x1="440" y1="195" x2="440" y2="205"/>
  <line class="dg-line" x1="295" y1="340" x2="305" y2="340"/>
  <line class="dg-line" x1="295" y1="60" x2="305" y2="60"/>
  <text class="dg-note" x="448.4" y="214" dy="0.35em" text-anchor="start">1</text>
  <text class="dg-note" x="151.6" y="214" dy="0.35em" text-anchor="end">−1</text>
  <text class="dg-note" x="291.6" y="50.2" dy="0.35em" text-anchor="end">1</text>
  <text class="dg-note" x="291.6" y="349.8" dy="0.35em" text-anchor="end">−1</text>
  <line class="dg-line" x1="300" y1="200" x2="414.7" y2="119.7"/>
  <circle class="dg-strong" cx="414.7" cy="119.7" r="5"/>
  <polyline class="dg-line" points="334,199 333.9,197.3 333.7,195.6 333.4,193.9 333.1,192.2 332.7,190.6 332.2,189 331.6,187.4 330.9,185.8 330.1,184.3 329.3,182.8 328.4,181.3"/>
  <text class="dg-note" x="344.8" y="187.4" dy="0.35em" text-anchor="middle">θ</text>
  <text class="dg-note" x="357.3" y="212.6" dy="0.35em" text-anchor="middle">cos θ</text>
  <text class="dg-note" x="420.3" y="159.8" dy="0.35em" text-anchor="start">sin θ</text>
  <text class="dg-note" x="347.5" y="148.6" dy="0.35em" text-anchor="middle">1</text>
  <text x="421.7" y="108.5" dy="0.35em" text-anchor="start">P = (cos θ, sin θ)</text>
  <text class="dg-code" x="560" y="300" dy="0.35em" text-anchor="middle">x² + y² = 1</text>
  <text class="dg-note" x="560" y="322" dy="0.35em" text-anchor="middle">the unit circle</text>
</svg>
