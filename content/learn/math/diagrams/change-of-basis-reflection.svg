<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>The reflection across y = x in the basis (1, 1), (1, −1)</title>
  <desc>The line y = x is drawn through the origin. The basis vector b1 = (1, 1) lies on the line, so the reflection leaves it alone. The basis vector b2 = (1, −1) is perpendicular to the line, so the reflection flips it to (−1, 1). In this basis the reflection's matrix is diagonal, with entries 1 and −1.</desc>
  <line class="dg-line" x1="204.8" y1="150" x2="475.2" y2="150" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="285.2" x2="340" y2="14.8" marker-end="url(#arrow)"/>
  <text class="dg-note" x="473.2" y="164" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="352" y="18.8" dy="0.35em" text-anchor="middle">y</text>
  <line class="dg-line dg-dashed" x1="215.2" y1="274.8" x2="464.8" y2="25.2"/>
  <text class="dg-note" x="462.2" y="43.4" dy="0.35em" text-anchor="start">y = x</text>
  <line class="dg-flow" x1="340" y1="150" x2="389.4" y2="100.6" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="399.8" y="105.8" dy="0.35em" text-anchor="start">b₁ stays: 1b₁</text>
  <line class="dg-line" x1="340" y1="150" x2="389.4" y2="199.4" marker-end="url(#arrow)"/>
  <text class="dg-note" x="399.8" y="204.6" dy="0.35em" text-anchor="start">b₂</text>
  <line class="dg-flow dg-dashed" x1="340" y1="150" x2="290.6" y2="100.6" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="280.2" y="95.4" dy="0.35em" text-anchor="end">flips to −1b₂</text>
</svg>
