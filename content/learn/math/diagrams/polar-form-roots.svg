<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The sixth roots of unity on the unit circle</title>
  <desc>The unit circle, dashed, with six highlighted points 60° apart: 1 at angle 0°, then 60°, 120°, −1 at 180°, 240°, and 300°. Joined in order they make a regular hexagon centered at the origin. Each is a solution of z⁶ = 1.</desc>
  <!-- Axes and the unit circle -->
  <line class="dg-line" x1="180" y1="160" x2="510" y2="160" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="300" x2="340" y2="20" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M460 160 A120 120 0 1 0 220 160 A120 120 0 1 0 460 160"/>
  <polygon class="dg-box" points="460,160 400,56.1 280,56.1 220,160 280,263.9 400,263.9"/>
  <circle class="dg-hot" cx="460" cy="160" r="6"/>
  <text class="dg-note" x="474" y="146" dy="0.35em" text-anchor="start">1</text>
  <circle class="dg-hot" cx="400" cy="56.1" r="6"/>
  <text class="dg-note" x="414" y="42.2" dy="0.35em" text-anchor="start">k = 1, 60°</text>
  <circle class="dg-hot" cx="280" cy="56.1" r="6"/>
  <text class="dg-note" x="266" y="42.2" dy="0.35em" text-anchor="end">k = 2, 120°</text>
  <circle class="dg-hot" cx="220" cy="160" r="6"/>
  <text class="dg-note" x="206" y="146" dy="0.35em" text-anchor="end">−1</text>
  <circle class="dg-hot" cx="280" cy="263.9" r="6"/>
  <text class="dg-note" x="266" y="277.8" dy="0.35em" text-anchor="end">k = 4, 240°</text>
  <circle class="dg-hot" cx="400" cy="263.9" r="6"/>
  <text class="dg-note" x="414" y="277.8" dy="0.35em" text-anchor="start">k = 5, 300°</text>
</svg>
