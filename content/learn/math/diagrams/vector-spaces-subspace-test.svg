  <line class="dg-line" x1="120" y1="220" x2="120" y2="40" marker-end="url(#arrow)"/>
  <text class="dg-note" x="208" y="144" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="132" y="44" dy="0.35em" text-anchor="middle">y</text>
  <line class="dg-line" x1="45" y1="126" x2="45" y2="134"/>
