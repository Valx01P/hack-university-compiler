  <circle class="dg-strong" cx="585" cy="105" r="4"/>
  <circle class="dg-off" cx="535" cy="155" r="4"/>
  <text class="dg-note" x="591.2" y="102.5" dy="0.35em" text-anchor="start">(1, 1)</text>
  <text class="dg-note" x="530" y="166.2" dy="0.35em" text-anchor="end">(−1, −1)</text>
  <text x="560" y="250" dy="0.35em" text-anchor="middle">scaling by −1 leaves it</text>
</svg>
