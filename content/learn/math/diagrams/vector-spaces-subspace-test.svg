<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>Three sets in the plane: one subspace and two that fail a check</title>
  <desc>Left, the line y = 3x passes through the origin and is a subspace. Middle, the line y = 3x + 1 misses the origin, so it fails the first check. Right, the shaded first quadrant holds the point (1, 1), but scaling by −1 gives (−1, −1), outside the quadrant, so it fails the third check.</desc>
