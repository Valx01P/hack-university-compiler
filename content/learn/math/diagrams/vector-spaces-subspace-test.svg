  <text x="340" y="250" dy="0.35em" text-anchor="middle">misses (0, 0): check 1 fails</text>
  <line class="dg-line" x1="470" y1="130" x2="650" y2="130" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="560" y1="220" x2="560" y2="40" marker-end="url(#arrow)"/>
