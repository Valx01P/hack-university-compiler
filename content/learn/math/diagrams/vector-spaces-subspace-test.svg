  <line class="dg-line" x1="170" y1="126" x2="170" y2="134"/>
  <line class="dg-line" x1="195" y1="126" x2="195" y2="134"/>
  <line class="dg-line" x1="116" y1="205" x2="124" y2="205"/>
  <line class="dg-line" x1="116" y1="180" x2="124" y2="180"/>
