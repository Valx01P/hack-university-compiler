  <line class="dg-line" x1="290" y1="126" x2="290" y2="134"/>
  <line class="dg-line" x1="315" y1="126" x2="315" y2="134"/>
  <line class="dg-line" x1="365" y1="126" x2="365" y2="134"/>
  <line class="dg-line" x1="390" y1="126" x2="390" y2="134"/>
  <line class="dg-line" x1="415" y1="126" x2="415" y2="134"/>
