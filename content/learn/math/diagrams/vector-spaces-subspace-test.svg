  <line class="dg-line" x1="116" y1="80" x2="124" y2="80"/>
  <line class="dg-line" x1="116" y1="55" x2="124" y2="55"/>
  <polyline class="dg-flow" points="91.2,216.2 148.8,43.8"/>
  <circle class="dg-hot" cx="120" cy="130" r="4"/>
  <text class="dg-note" x="152.5" y="47.5" dy="0.35em" text-anchor="start">y = 3x</text>
  <text x="120" y="250" dy="0.35em" text-anchor="middle">a subspace</text>
  <line class="dg-line" x1="250" y1="130" x2="430" y2="130" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="220" x2="340" y2="40" marker-end="url(#arrow)"/>
