<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A unit square cut in half again and again: 1/2 + 1/4 + 1/8 + ⋯ = 1</title>
  <desc>A unit square is split into a left half labeled 1/2. The right half is split into a top quarter labeled 1/4 and a bottom piece, which is split again into 1/8 and 1/16, and so on, each piece half the one before. The pieces fill the whole square with nothing left over, so their sum is 1.</desc>
  <rect class="dg-box" x="200" y="20" width="140" height="280"/>
  <text x="270" y="160" dy="0.35em" text-anchor="middle">1/2</text>
  <rect class="dg-box" x="340" y="20" width="140" height="140"/>
  <text x="410" y="90" dy="0.35em" text-anchor="middle">1/4</text>
  <rect class="dg-box" x="340" y="160" width="70" height="140"/>
  <text x="375" y="230" dy="0.35em" text-anchor="middle">1/8</text>
  <rect class="dg-box" x="410" y="160" width="70" height="70"/>
  <text class="dg-note" x="445" y="195" dy="0.35em" text-anchor="middle">1/16</text>
  <rect class="dg-box" x="410" y="230" width="35" height="70"/>
  <text class="dg-note" x="427.5" y="265" dy="0.35em" text-anchor="middle">1/32</text>
  <rect class="dg-box" x="445" y="230" width="35" height="35"/>
  <rect class="dg-box" x="445" y="265" width="17.5" height="35"/>
  <rect class="dg-box" x="462.5" y="265" width="17.5" height="17.5"/>
  <rect class="dg-frame" x="200" y="20" width="280" height="280"/>
  <text class="dg-note" x="496" y="160" dy="0.35em" text-anchor="start">total area 1</text>
</svg>
