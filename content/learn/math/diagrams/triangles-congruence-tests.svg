<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>The four congruence tests: SSS, SAS, ASA, and AAS</title>
  <desc>Four triangles, each marked with the parts a test matches. SSS marks all three sides. SAS marks two sides and the highlighted angle between them. ASA marks two angles and the highlighted side between them. AAS marks two angles and a highlighted side that is not between them. Tick marks show sides and arcs show angles.</desc>
  <polygon class="dg-box" points="40,190 160,190 80,90"/>
  <text class="dg-heading" x="100" y="232" dy="0.35em" text-anchor="middle">SSS</text>
  <line class="dg-flow" x1="40" y1="190" x2="160" y2="190"/>
  <line class="dg-line" x1="100" y1="183" x2="100" y2="197"/>
  <line class="dg-flow" x1="160" y1="190" x2="80" y2="90"/>
  <line class="dg-line" x1="116.1" y1="146.3" x2="127" y2="137.6"/>
  <line class="dg-line" x1="113" y1="142.4" x2="123.9" y2="133.7"/>
  <line class="dg-flow" x1="80" y1="90" x2="40" y2="190"/>
  <line class="dg-line" x1="68.4" y1="138" x2="55.4" y2="132.8"/>
  <line class="dg-line" x1="66.5" y1="142.6" x2="53.5" y2="137.4"/>
  <line class="dg-line" x1="64.6" y1="147.2" x2="51.6" y2="142"/>
  <polygon class="dg-box" points="205,190 325,190 245,90"/>
  <text class="dg-heading" x="265" y="232" dy="0.35em" text-anchor="middle">SAS</text>
  <line class="dg-flow" x1="205" y1="190" x2="325" y2="190"/>
  <line class="dg-line" x1="265" y1="183" x2="265" y2="197"/>
  <line class="dg-flow" x1="205" y1="190" x2="245" y2="90"/>
  <line class="dg-line" x1="217.6" y1="139.7" x2="230.6" y2="144.9"/>
  <line class="dg-line" x1="219.4" y1="135.1" x2="232.4" y2="140.3"/>
  <path class="dg-hot" d="M205 190 L227 190 A22 22 0 0 0 213.2 169.6 Z"/>
  <polygon class="dg-box" points="370,190 490,190 410,90"/>
  <text class="dg-heading" x="430" y="232" dy="0.35em" text-anchor="middle">ASA</text>
  <path class="dg-hot" d="M370 190 L392 190 A22 22 0 0 0 378.2 169.6 Z"/>
  <path class="dg-hot" d="M490 190 L476.3 172.8 A22 22 0 0 0 468 190 Z"/>
  <line class="dg-flow" x1="370" y1="190" x2="490" y2="190"/>
  <line class="dg-line" x1="430" y1="183" x2="430" y2="197"/>
  <polygon class="dg-box" points="535,190 655,190 575,90"/>
  <text class="dg-heading" x="595" y="232" dy="0.35em" text-anchor="middle">AAS</text>
  <path class="dg-hot" d="M535 190 L557 190 A22 22 0 0 0 543.2 169.6 Z"/>
  <path class="dg-hot" d="M655 190 L641.3 172.8 A22 22 0 0 0 633 190 Z"/>
  <line class="dg-flow" x1="655" y1="190" x2="575" y2="90"/>
  <line class="dg-line" x1="609.5" y1="144.4" x2="620.5" y2="135.6"/>
  <text class="dg-note" x="340" y="40" dy="0.35em" text-anchor="middle">each test fixes the whole triangle</text>
</svg>
