<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>The line y = x − 5 against both halves of y² = x + 7</title>
  <desc>The upper half of a sideways parabola is y = √(x + 7), solid, and the lower half y = −√(x + 7) is dashed. The line y = x − 5 crosses the solid half at (9, 4), the true solution x = 9. It crosses the dashed half at (2, −3), which squaring added: x = 2 solves √(x + 7) = −(x − 5), not the original equation.</desc>
