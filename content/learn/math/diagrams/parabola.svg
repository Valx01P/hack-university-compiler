<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The graph of f(x) = x² with its axes</title>
  <desc>The graph of f(x) = x² for x from −3 to 3. The horizontal x axis and the vertical y axis cross at the origin. The curve is a parabola: it comes down to its lowest point at the origin, where f(0) is 0, and climbs again on the other side as a mirror image. Dots mark the points for x from −2 to 2: f(−2) and f(2) are both 4, and f(−1) and f(1) are both 1.</desc>

  <!-- One unit is 60 across and 30 up, with the origin at (340, 320). -->
  <line class="dg-line" x1="120" y1="320" x2="572" y2="320" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="344" x2="340" y2="24" marker-end="url(#arrow)"/>
  <text x="588" y="320" dy="0.35em">x</text>
  <text x="340" y="10" dy="0.35em" text-anchor="middle">y</text>

  <!-- Ticks on the x axis, and their numbers below it. -->
  <path class="dg-line" d="M160 315 V325 M220 315 V325 M280 315 V325 M400 315 V325 M460 315 V325 M520 315 V325"/>
  <text class="dg-note" x="160" y="340" dy="0.35em" text-anchor="middle">−3</text>
  <text class="dg-note" x="220" y="340" dy="0.35em" text-anchor="middle">−2</text>
  <text class="dg-note" x="280" y="340" dy="0.35em" text-anchor="middle">−1</text>
  <text class="dg-note" x="400" y="340" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="460" y="340" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="520" y="340" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-note" x="328" y="340" dy="0.35em" text-anchor="end">0</text>

  <!-- Ticks on the y axis at 1, 4, and 9, the squares the dots reach. -->
  <path class="dg-line" d="M335 290 H345 M335 200 H345 M335 50 H345"/>
  <text class="dg-note" x="326" y="290" dy="0.35em" text-anchor="end">1</text>
  <text class="dg-note" x="326" y="200" dy="0.35em" text-anchor="end">4</text>
  <text class="dg-note" x="326" y="50" dy="0.35em" text-anchor="end">9</text>

  <!-- y = x² from −3 to 3: a quadratic curve is a parabola, so this is
       exact, its control point where the end tangents meet, (0, −9). -->
  <path class="dg-flow" d="M160 50 Q340 590 520 50"/>
  <text class="dg-code" x="534" y="56" dy="0.35em">f(x) = x²</text>

  <!-- The points the lesson's table prints. -->
  <circle class="dg-hot" cx="220" cy="200" r="5"/>
  <circle class="dg-hot" cx="280" cy="290" r="5"/>
  <circle class="dg-hot" cx="340" cy="320" r="5"/>
  <circle class="dg-hot" cx="400" cy="290" r="5"/>
  <circle class="dg-hot" cx="460" cy="200" r="5"/>
</svg>
