<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>The height of a triangle splits its base into x and c − x</title>
  <desc>A triangle with base c along the bottom and sides b on the left and a on the right. The height h drops from the top vertex straight down to the base, meeting it at a right angle and splitting it into a piece x on the left and c − x on the right. The two right triangles give x² + h² = b² and (c − x)² + h² = a², the start of the proof of Heron's formula.</desc>
  <polygon class="dg-box" points="60,230 420,230 180,50"/>
  <line class="dg-flow" x1="180" y1="50" x2="180" y2="230"/>
  <polyline class="dg-line" points="192,230 192,218 180,218"/>
  <text x="240" y="266" dy="0.35em" text-anchor="middle">c</text>
  <text x="104" y="140" dy="0.35em" text-anchor="middle">b</text>
  <text x="316" y="132" dy="0.35em" text-anchor="middle">a</text>
  <text x="194" y="140" dy="0.35em" text-anchor="middle">h</text>
  <text class="dg-note" x="120" y="246" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="300" y="246" dy="0.35em" text-anchor="middle">c − x</text>
  <polyline class="dg-line" points="60,254 60,260 420,260 420,254"/>
  <text class="dg-code" x="570" y="110" dy="0.35em" text-anchor="middle">x² + h² = b²</text>
  <text class="dg-code" x="570" y="140" dy="0.35em" text-anchor="middle">(c − x)² + h² = a²</text>
  <text class="dg-code" x="570" y="180" dy="0.35em" text-anchor="middle">A = ½ch</text>
</svg>
