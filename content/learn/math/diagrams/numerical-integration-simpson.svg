<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Simpson's rule fits a parabola through each three points</title>
  <desc>Five points on the curve, x₀ to x₄, are grouped as x₀, x₁, x₂ and x₂, x₃, x₄. A parabola through each group replaces the curve, and the region under the two parabolas is shaded. Each parabola's area is Δx/3 times 1, 4, 1 of its heights. The shared point x₂ counts in both, so the weights are 1, 4, 2, 4, 1.</desc>
