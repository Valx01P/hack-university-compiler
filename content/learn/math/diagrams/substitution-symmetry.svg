<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>An odd function's areas cancel on [−a, a], and an even function's double</title>
  <desc>On the left, an odd function like x³: the area right of 0 is above the axis and the matching area left of 0 is below it, so they cancel and the integral from −a to a is 0. On the right, an even function like 4 − x²: the two halves are mirror images with the same area A, so the integral is 2A, twice the integral from 0 to a.</desc>
