<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>The four angles with reference angle 30° are mirror images</title>
  <desc>The unit circle with the points for 30°, 150°, 210°, and 330°. Each makes an angle of 30° with the x-axis. The point for 150° is the reflection of the 30° point across the y-axis, the 210° point is its half turn, and the 330° point is its reflection across the x-axis. All four coordinates are ±√3/2 and ±1/2, with the signs set by the quadrant.</desc>
  <circle class="dg-off" cx="340" cy="200" r="150"/>
  <line class="dg-line" x1="122.5" y1="200" x2="557.5" y2="200" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="395" x2="340" y2="5" marker-end="url(#arrow)"/>
  <text class="dg-note" x="561.5" y="214" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="348" y="11" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-line dg-dashed" x1="469.9" y1="125" x2="210.1" y2="125"/>
  <line class="dg-line dg-dashed" x1="469.9" y1="125" x2="469.9" y2="275"/>
  <line class="dg-line dg-dashed" x1="210.1" y1="275" x2="469.9" y2="125"/>
  <line class="dg-flow" x1="340" y1="200" x2="469.9" y2="125"/>
  <circle class="dg-hot" cx="469.9" cy="125" r="5"/>
  <text x="478.9" y="110" dy="0.35em" text-anchor="start">30°: (√3/2, 1/2)</text>
  <line class="dg-line" x1="340" y1="200" x2="210.1" y2="125"/>
  <circle class="dg-strong" cx="210.1" cy="125" r="5"/>
  <text x="201.1" y="110" dy="0.35em" text-anchor="end">150°: (−√3/2, 1/2)</text>
  <line class="dg-line" x1="340" y1="200" x2="210.1" y2="275"/>
  <circle class="dg-strong" cx="210.1" cy="275" r="5"/>
  <text x="201.1" y="290" dy="0.35em" text-anchor="end">210°: (−√3/2, −1/2)</text>
  <line class="dg-line" x1="340" y1="200" x2="469.9" y2="275"/>
  <circle class="dg-strong" cx="469.9" cy="275" r="5"/>
  <text x="478.9" y="290" dy="0.35em" text-anchor="start">330°: (√3/2, −1/2)</text>
