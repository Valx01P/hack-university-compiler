<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The floor function: steps one unit wide, closed on the left end and open on the right</title>
  <desc>The graph of y = ⌊x⌋ from −3 to 3. Each step is a flat segment at height n from x = n to x = n + 1. Its left end is a closed dot, since ⌊n⌋ = n, and its right end is an open dot, since at n + 1 the value jumps up to n + 1.</desc>
  <line class="dg-line" x1="20" y1="170" x2="660" y2="170" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="62.7" y1="166" x2="62.7" y2="174"/>
  <text class="dg-note" x="62.7" y="186" text-anchor="middle">−3</text>
  <line class="dg-line" x1="148" y1="166" x2="148" y2="174"/>
  <text class="dg-note" x="148" y="186" text-anchor="middle">−2</text>
  <line class="dg-line" x1="233.3" y1="166" x2="233.3" y2="174"/>
  <text class="dg-note" x="233.3" y="186" text-anchor="middle">−1</text>
  <line class="dg-line" x1="318.7" y1="166" x2="318.7" y2="174"/>
  <line class="dg-line" x1="404" y1="166" x2="404" y2="174"/>
  <text class="dg-note" x="404" y="186" text-anchor="middle">1</text>
  <line class="dg-line" x1="489.3" y1="166" x2="489.3" y2="174"/>
  <text class="dg-note" x="489.3" y="186" text-anchor="middle">2</text>
  <line class="dg-line" x1="574.7" y1="166" x2="574.7" y2="174"/>
  <text class="dg-note" x="574.7" y="186" text-anchor="middle">3</text>
  <text class="dg-note" x="658" y="158" text-anchor="end">x</text>
  <line class="dg-line" x1="318.7" y1="320" x2="318.7" y2="20" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="314.7" y1="295" x2="322.7" y2="295"/>
  <text class="dg-note" x="310.7" y="295" dy="0.35em" text-anchor="end">−3</text>
  <line class="dg-line" x1="314.7" y1="253.3" x2="322.7" y2="253.3"/>
  <text class="dg-note" x="310.7" y="253.3" dy="0.35em" text-anchor="end">−2</text>
  <line class="dg-line" x1="314.7" y1="211.7" x2="322.7" y2="211.7"/>
  <text class="dg-note" x="310.7" y="211.7" dy="0.35em" text-anchor="end">−1</text>
  <line class="dg-line" x1="314.7" y1="128.3" x2="322.7" y2="128.3"/>
  <text class="dg-note" x="310.7" y="128.3" dy="0.35em" text-anchor="end">1</text>
  <line class="dg-line" x1="314.7" y1="86.7" x2="322.7" y2="86.7"/>
  <text class="dg-note" x="310.7" y="86.7" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="314.7" y1="45" x2="322.7" y2="45"/>
  <text class="dg-note" x="310.7" y="45" dy="0.35em" text-anchor="end">3</text>
  <text class="dg-note" x="328.7" y="26" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-flow" x1="62.7" y1="295" x2="148" y2="295"/>
  <line class="dg-flow" x1="148" y1="253.3" x2="233.3" y2="253.3"/>
  <line class="dg-flow" x1="233.3" y1="211.7" x2="318.7" y2="211.7"/>
  <line class="dg-flow" x1="318.7" y1="170" x2="404" y2="170"/>
  <line class="dg-flow" x1="404" y1="128.3" x2="489.3" y2="128.3"/>
  <line class="dg-flow" x1="489.3" y1="86.7" x2="574.7" y2="86.7"/>
  <circle class="dg-box" cx="148" cy="295" r="4"/>
  <circle class="dg-badge" cx="62.7" cy="295" r="4"/>
  <circle class="dg-box" cx="233.3" cy="253.3" r="4"/>
  <circle class="dg-badge" cx="148" cy="253.3" r="4"/>
  <circle class="dg-box" cx="318.7" cy="211.7" r="4"/>
  <circle class="dg-badge" cx="233.3" cy="211.7" r="4"/>
  <circle class="dg-box" cx="404" cy="170" r="4"/>
  <circle class="dg-badge" cx="318.7" cy="170" r="4"/>
  <circle class="dg-box" cx="489.3" cy="128.3" r="4"/>
  <circle class="dg-badge" cx="404" cy="128.3" r="4"/>
  <circle class="dg-box" cx="574.7" cy="86.7" r="4"/>
  <circle class="dg-badge" cx="489.3" cy="86.7" r="4"/>
</svg>
