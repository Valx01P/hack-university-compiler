<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Diagonals from one vertex cut a hexagon into four triangles</title>
  <desc>A six-sided polygon. From one vertex, three diagonals run to the vertices that aren't its neighbors, cutting the hexagon into four triangles. Each triangle's angles add to 180 degrees, and together they make up the hexagon's angles, so the angle sum is 4 × 180 = 720 degrees, which is (6 − 2) × 180.</desc>
  <polygon class="dg-box" points="150,250 330,260 420,170 360,60 200,40 100,130"/>
  <line class="dg-flow" x1="150" y1="250" x2="420" y2="170"/>
  <line class="dg-flow" x1="150" y1="250" x2="360" y2="60"/>
  <line class="dg-flow" x1="150" y1="250" x2="200" y2="40"/>
  <circle class="dg-hot" cx="150" cy="250" r="5"/>
  <text class="dg-note" x="300" y="226.7" dy="0.35em" text-anchor="middle">180°</text>
  <text class="dg-note" x="310" y="160" dy="0.35em" text-anchor="middle">180°</text>
  <text class="dg-note" x="236.7" y="116.7" dy="0.35em" text-anchor="middle">180°</text>
  <text class="dg-note" x="150" y="140" dy="0.35em" text-anchor="middle">180°</text>
  <text x="560" y="120" dy="0.35em" text-anchor="middle">6 sides</text>
  <text x="560" y="146" dy="0.35em" text-anchor="middle">4 triangles</text>
  <text class="dg-code" x="560" y="186" dy="0.35em" text-anchor="middle">4 × 180° = 720°</text>
  <text class="dg-code" x="560" y="210" dy="0.35em" text-anchor="middle">(n − 2) × 180°</text>
</svg>
