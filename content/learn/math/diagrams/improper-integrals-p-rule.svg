<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The curves 1/√x, 1/x, and 1/x², split at x = 1</title>
  <desc>Three curves through the point (1, 1): y = 1/√x, y = 1/x, and y = 1/x². Left of x = 1, 1/x² shoots up fastest and 1/√x slowest, so near 0 the area is finite only for p less than 1. Right of x = 1, 1/x² falls fastest, so far out the area is finite only for p greater than 1. At p = 1 both areas are infinite.</desc>
