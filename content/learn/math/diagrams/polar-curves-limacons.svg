<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A cardioid r = 1 + cos θ and a limaçon with an inner loop, r = 1 + 2 cos θ</title>
  <desc>Left: the cardioid r = 1 + cos θ is heart shaped, reaching 2 at θ = 0 and coming to a point at the origin at θ = π. Right: the limaçon r = 1 + 2 cos θ reaches 3 at θ = 0. Between θ = 2π/3 and 4π/3 its r is negative, which draws a small inner loop that reaches out to (1, 0).</desc>
