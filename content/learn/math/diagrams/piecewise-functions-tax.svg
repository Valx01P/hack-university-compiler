<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The tax T(x) on income x: three straight pieces that meet at 10,000 and 40,000</title>
  <desc>The graph of the tax T(x) for incomes from 0 to 60,000 under made-up brackets. It rises with slope 0.1 to (10,000, 1,000), then with slope 0.2 to (40,000, 7,000), then with slope 0.3 to 13,000 at 60,000. The pieces meet at the kinks, so the tax never jumps.</desc>
  <line class="dg-line" x1="70" y1="281.9" x2="650" y2="281.9" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="182.5" y1="277.9" x2="182.5" y2="285.9"/>
  <text class="dg-note" x="182.5" y="297.9" text-anchor="middle">10k</text>
  <line class="dg-line" x1="269.1" y1="277.9" x2="269.1" y2="285.9"/>
  <text class="dg-note" x="269.1" y="297.9" text-anchor="middle">20k</text>
  <line class="dg-line" x1="355.7" y1="277.9" x2="355.7" y2="285.9"/>
  <text class="dg-note" x="355.7" y="297.9" text-anchor="middle">30k</text>
  <line class="dg-line" x1="442.2" y1="277.9" x2="442.2" y2="285.9"/>
  <text class="dg-note" x="442.2" y="297.9" text-anchor="middle">40k</text>
  <line class="dg-line" x1="528.8" y1="277.9" x2="528.8" y2="285.9"/>
  <text class="dg-note" x="528.8" y="297.9" text-anchor="middle">50k</text>
  <line class="dg-line" x1="615.4" y1="277.9" x2="615.4" y2="285.9"/>
  <text class="dg-note" x="615.4" y="297.9" text-anchor="middle">60k</text>
  <text class="dg-note" x="648" y="269.9" text-anchor="end">income</text>
  <line class="dg-line" x1="96" y1="300" x2="96" y2="20" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="92" y1="191.6" x2="100" y2="191.6"/>
  <text class="dg-note" x="88" y="191.6" dy="0.35em" text-anchor="end">5k</text>
  <line class="dg-line" x1="92" y1="101.3" x2="100" y2="101.3"/>
  <text class="dg-note" x="88" y="101.3" dy="0.35em" text-anchor="end">10k</text>
  <text class="dg-note" x="106" y="26" dy="0.35em" text-anchor="start">tax</text>
  <polyline class="dg-flow" points="96,281.9 183,263.7 441.4,155.8 615.4,47.1"/>
  <circle class="dg-hot" cx="182.5" cy="263.9" r="5"/>
  <circle class="dg-hot" cx="442.2" cy="155.5" r="5"/>
  <text class="dg-code" x="178.5" y="241.9" dy="0.35em" text-anchor="end">(10k, 1k)</text>
  <text class="dg-code" x="432.2" y="143.5" dy="0.35em" text-anchor="end">(40k, 7k)</text>
  <text class="dg-note" x="139.3" y="256.9" dy="0.35em" text-anchor="middle">10%</text>
  <text class="dg-note" x="312.4" y="193.7" dy="0.35em" text-anchor="middle">20%</text>
  <text class="dg-note" x="523.5" y="95.9" dy="0.35em" text-anchor="end">30%</text>
</svg>
