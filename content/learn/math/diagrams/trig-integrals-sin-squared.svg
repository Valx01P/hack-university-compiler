<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The area under sin² x on [0, π] is π/2</title>
  <desc>The curve y = sin² x rises from 0 to 1 at π/2 and falls back to 0 at π, and the region under it is shaded. A dashed line at height 1/2 runs across. Power reduction writes sin² x as 1/2 minus half of cos 2x, and the cosine part is above and below 0 equally, so the area is the rectangle's, 1/2 times π.</desc>
