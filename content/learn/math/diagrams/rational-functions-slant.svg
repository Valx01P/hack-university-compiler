<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>The slant asymptote y = x + 1 of (x² + 1)/(x − 1), with its vertical asymptote x = 1</title>
  <desc>The graph of f(x) = (x² + 1)/(x − 1) in two branches on either side of a dashed vertical line x = 1. A dashed slant line y = x + 1 runs through the picture. Far to the right the upper branch hugs the line from above, and far to the left the lower branch hugs it from below, since f(x) = x + 1 + 2/(x − 1).</desc>
