  <title>The region between y = x² + 1 and y = x on [0, 2], with one vertical strip</title>
  <desc>The parabola y = x² + 1 lies above the line y = x for every x from 0 to 2, and the region between them is shaded. One thin vertical strip is drawn inside it: its height is the top curve minus the bottom curve and its width is dx. Adding up the strips gives the integral of top minus bottom, which is 8/3.</desc>
