<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A square of side a + b split into a², b², and two ab rectangles</title>
  <desc>A large square has side a + b on each edge. Cuts split it into four pieces: an a by a square in the top left, a b by b square in the bottom right, and two highlighted a by b rectangles in the other corners. The whole area is (a + b)², so (a + b)² = a² + 2ab + b². Squaring each part alone, a² + b², leaves out the two rectangles.</desc>
  <!-- The four pieces of the big square. -->
  <rect class="dg-box" x="160" y="60" width="160" height="160"/>
  <rect class="dg-hot" x="320" y="60" width="100" height="160"/>
  <rect class="dg-hot" x="160" y="220" width="160" height="100"/>
  <rect class="dg-box" x="320" y="220" width="100" height="100"/>
  <text x="240" y="140" dy="0.35em" text-anchor="middle">a²</text>
  <text class="dg-on-hot" x="370" y="140" dy="0.35em" text-anchor="middle">ab</text>
  <text class="dg-on-hot" x="240" y="270" dy="0.35em" text-anchor="middle">ab</text>
  <text x="370" y="270" dy="0.35em" text-anchor="middle">b²</text>
  <!-- Side lengths. -->
  <text x="240" y="40" dy="0.35em" text-anchor="middle">a</text>
  <text x="370" y="40" dy="0.35em" text-anchor="middle">b</text>
  <text x="140" y="140" dy="0.35em" text-anchor="middle">a</text>
  <text x="140" y="270" dy="0.35em" text-anchor="middle">b</text>
  <!-- The sum. -->
  <text class="dg-code" x="460" y="170" dy="0.35em" text-anchor="start">(a + b)²</text>
  <text class="dg-code" x="460" y="200" dy="0.35em" text-anchor="start">= a² + 2ab + b²</text>
</svg>
