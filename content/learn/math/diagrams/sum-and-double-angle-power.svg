<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>The graph of sin²x is a cosine wave of half height around y = 1/2</title>
  <desc>The graphs of y = sin x, dashed, and y = sin²x, bold, for x from 0 to 2π. Squaring makes every value between 0 and 1. The bold curve rises and falls twice as fast, around the dashed midline y = 1/2, with amplitude 1/2: it is 1/2 − (1/2) cos 2x.</desc>
