<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>The distributive law: 3 × (4 + 2) = 3 × 4 + 3 × 2</title>
  <desc>A rectangle of unit squares 3 rows tall and 4 + 2 = 6 columns wide. A dashed cut after the first 4 columns splits it into a 3 by 4 part holding 12 squares and a highlighted 3 by 2 part holding 6. The whole rectangle holds 3 × (4 + 2) = 18 squares, the same as 12 + 6, because the cut moves no squares.</desc>
  <!-- A 3 by 6 rectangle: 4 columns, then 2 highlighted columns. -->
  <rect class="dg-box" x="200" y="60" width="40" height="40"/>
  <rect class="dg-box" x="240" y="60" width="40" height="40"/>
  <rect class="dg-box" x="280" y="60" width="40" height="40"/>
  <rect class="dg-box" x="320" y="60" width="40" height="40"/>
  <rect class="dg-box" x="360" y="60" width="40" height="40"/>
  <rect class="dg-box" x="400" y="60" width="40" height="40"/>
  <rect class="dg-box" x="200" y="100" width="40" height="40"/>
  <rect class="dg-box" x="240" y="100" width="40" height="40"/>
  <rect class="dg-box" x="280" y="100" width="40" height="40"/>
  <rect class="dg-box" x="320" y="100" width="40" height="40"/>
  <rect class="dg-box" x="360" y="100" width="40" height="40"/>
  <rect class="dg-box" x="400" y="100" width="40" height="40"/>
  <rect class="dg-box" x="200" y="140" width="40" height="40"/>
  <rect class="dg-box" x="240" y="140" width="40" height="40"/>
  <rect class="dg-box" x="280" y="140" width="40" height="40"/>
  <rect class="dg-box" x="320" y="140" width="40" height="40"/>
  <rect class="dg-box" x="360" y="140" width="40" height="40"/>
  <rect class="dg-box" x="400" y="140" width="40" height="40"/>
  <rect class="dg-hot" x="360" y="60" width="80" height="120"/>
  <line class="dg-line" x1="400" y1="60" x2="400" y2="180"/>
  <line class="dg-line" x1="360" y1="100" x2="440" y2="100"/>
  <line class="dg-line" x1="360" y1="140" x2="440" y2="140"/>
  <!-- The cut after the first 4 columns. -->
  <line class="dg-flow dg-dashed" x1="360" y1="44" x2="360" y2="196"/>
  <text x="280" y="30" dy="0.35em" text-anchor="middle">4</text>
  <text x="400" y="30" dy="0.35em" text-anchor="middle">2</text>
  <text x="184" y="120.0" dy="0.35em" text-anchor="end">3</text>
  <text class="dg-code" x="280" y="212" dy="0.35em" text-anchor="middle">3 × 4 = 12</text>
  <text class="dg-code" x="400" y="212" dy="0.35em" text-anchor="middle">3 × 2 = 6</text>
  <text class="dg-code" x="320" y="244" dy="0.35em" text-anchor="middle">3 × (4 + 2) = 12 + 6 = 18</text>
</svg>
