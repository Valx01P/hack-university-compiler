<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>A probability tree for drawing two cards without replacement</title>
  <desc>The first draw is an ace with probability 4/52 or not an ace with 48/52. After an ace, the second draw is an ace with 3/51 or not with 48/51. After a non-ace, it is an ace with 4/51 or not with 47/51. Each path's probability is the product along it: 1/221, 16/221, 16/221, and 188/221, which add up to 1. The ace-then-ace path is highlighted.</desc>
  <!-- Branches. The highlighted path: ace, then ace. -->
  <path class="dg-flow" d="M110 180 H130 V100 H190"/>
  <path class="dg-line" d="M110 180 H130 V260 H190"/>
  <path class="dg-flow" d="M290 100 H310 V50 H370"/>
  <path class="dg-line" d="M290 100 H310 V150 H370"/>
  <path class="dg-line" d="M290 260 H310 V210 H370"/>
  <path class="dg-line" d="M290 260 H310 V310 H370"/>
  <!-- Branch probabilities. -->
  <text class="dg-code" x="160" y="88" text-anchor="middle">4/52</text>
  <text class="dg-code" x="160" y="248" text-anchor="middle">48/52</text>
  <text class="dg-code" x="340" y="38" text-anchor="middle">3/51</text>
  <text class="dg-code" x="340" y="138" text-anchor="middle">48/51</text>
  <text class="dg-code" x="340" y="198" text-anchor="middle">4/51</text>
  <text class="dg-code" x="340" y="298" text-anchor="middle">47/51</text>
  <!-- Nodes. -->
  <rect class="dg-box" x="20" y="160" width="90" height="40" rx="8"/>
  <text x="65" y="180" dy="0.35em" text-anchor="middle">start</text>
  <rect class="dg-hot" x="190" y="80" width="100" height="40" rx="8"/>
  <text class="dg-on-hot" x="240" y="100" dy="0.35em" text-anchor="middle">ace</text>
  <rect class="dg-box" x="190" y="240" width="100" height="40" rx="8"/>
  <text x="240" y="260" dy="0.35em" text-anchor="middle">not ace</text>
  <rect class="dg-hot" x="370" y="30" width="90" height="40" rx="8"/>
  <text class="dg-on-hot" x="415" y="50" dy="0.35em" text-anchor="middle">ace</text>
  <rect class="dg-box" x="370" y="130" width="90" height="40" rx="8"/>
  <text x="415" y="150" dy="0.35em" text-anchor="middle">not ace</text>
  <rect class="dg-box" x="370" y="190" width="90" height="40" rx="8"/>
  <text x="415" y="210" dy="0.35em" text-anchor="middle">ace</text>
  <rect class="dg-box" x="370" y="290" width="90" height="40" rx="8"/>
  <text x="415" y="310" dy="0.35em" text-anchor="middle">not ace</text>
  <!-- Path products. -->
  <text class="dg-code" x="480" y="50" dy="0.35em">4/52 × 3/51 = 1/221</text>
  <text class="dg-code" x="480" y="150" dy="0.35em">4/52 × 48/51 = 16/221</text>
  <text class="dg-code" x="480" y="210" dy="0.35em">48/52 × 4/51 = 16/221</text>
  <text class="dg-code" x="480" y="310" dy="0.35em">48/52 × 47/51 = 188/221</text>
  <text class="dg-note" x="240" y="20" dy="0.35em" text-anchor="middle">first card</text>
  <text class="dg-note" x="415" y="350" dy="-0.35em" text-anchor="middle">second card</text>
</svg>
