<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>The circle (x − 3)² + (y + 2)² = 25 and the right triangle under its radius</title>
  <desc>Axes with a circle of radius 5 centered at C = (3, −2). A radius runs from C to the point P = (6, 2) on the circle. Dashed legs from C go 3 units right and 4 units up to P, so the radius is the hypotenuse of a right triangle with legs x − h = 3 and y − k = 4. The Pythagorean theorem gives 3² + 4² = 5², which is why every point on the circle satisfies (x − h)² + (y − k)² = r².</desc>
