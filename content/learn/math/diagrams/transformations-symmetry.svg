  <title>An even function, symmetric in the y-axis, and an odd one, symmetric about the origin</title>
  <desc>On the left, y = x² − 2 is even: the points (1.5, 0.25) and (−1.5, 0.25) are mirror images across the y-axis. On the right, y = x³ − 3x is odd: the points (2, 2) and (−2, −2) match by a half turn about the origin.</desc>
