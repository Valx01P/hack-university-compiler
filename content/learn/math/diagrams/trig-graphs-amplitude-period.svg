<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The graph of y = 3 sin 2x against y = sin x</title>
  <desc>The graphs of y = sin x, dashed, and y = 3 sin 2x, solid, for x from 0 to 2π. The solid wave rises to 3 and falls to −3, so its amplitude is 3. It finishes a whole cycle by x = π, so its period is π, half of sine's 2π. It fits two cycles where sine fits one.</desc>
