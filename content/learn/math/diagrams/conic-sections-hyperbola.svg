<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>The hyperbola x²/9 − y²/16 = 1 with foci (−5, 0) and (5, 0) and its asymptotes</title>
  <desc>Axes with a hyperbola whose two branches open left and right from the vertices (−3, 0) and (3, 0). The foci F1 = (−5, 0) and F2 = (5, 0) sit outside the vertices. Dashed asymptotes y = 4x/3 and y = −4x/3 cross at the center and the branches bend toward them. The point P = (5, 16/3) on the right branch is 34/3 from F1 and 16/3 from F2, and the difference is 6 = 2a.</desc>
