<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>Why 3 × 4 = 4 × 3: one rectangle, turned a quarter turn</title>
  <desc>On the left, a rectangle of unit squares 3 rows tall and 4 wide, with its top row highlighted. An arrow labeled a quarter turn leads to the same rectangle turned clockwise, now 4 rows of 3, where the highlighted row has become the right column. Turning moves no squares in or out, so both hold 12 and 3 × 4 = 4 × 3.</desc>
  <!-- Left: 3 rows of 4, the top row highlighted. -->
  <rect class="dg-box" x="76" y="70" width="36" height="36"/>
  <rect class="dg-box" x="112" y="70" width="36" height="36"/>
  <rect class="dg-box" x="148" y="70" width="36" height="36"/>
  <rect class="dg-box" x="184" y="70" width="36" height="36"/>
  <rect class="dg-box" x="76" y="106" width="36" height="36"/>
  <rect class="dg-box" x="112" y="106" width="36" height="36"/>
  <rect class="dg-box" x="148" y="106" width="36" height="36"/>
  <rect class="dg-box" x="184" y="106" width="36" height="36"/>
  <rect class="dg-box" x="76" y="142" width="36" height="36"/>
  <rect class="dg-box" x="112" y="142" width="36" height="36"/>
  <rect class="dg-box" x="148" y="142" width="36" height="36"/>
  <rect class="dg-box" x="184" y="142" width="36" height="36"/>
  <rect class="dg-hot" x="76" y="70" width="144" height="36"/>
  <line class="dg-line" x1="112" y1="70" x2="112" y2="106"/>
  <line class="dg-line" x1="148" y1="70" x2="148" y2="106"/>
  <line class="dg-line" x1="184" y1="70" x2="184" y2="106"/>
  <!-- Right: after a quarter turn clockwise, that row is the right column. -->
  <rect class="dg-box" x="466" y="52" width="36" height="36"/>
  <rect class="dg-box" x="502" y="52" width="36" height="36"/>
  <rect class="dg-box" x="538" y="52" width="36" height="36"/>
  <rect class="dg-box" x="466" y="88" width="36" height="36"/>
  <rect class="dg-box" x="502" y="88" width="36" height="36"/>
  <rect class="dg-box" x="538" y="88" width="36" height="36"/>
  <rect class="dg-box" x="466" y="124" width="36" height="36"/>
  <rect class="dg-box" x="502" y="124" width="36" height="36"/>
  <rect class="dg-box" x="538" y="124" width="36" height="36"/>
  <rect class="dg-box" x="466" y="160" width="36" height="36"/>
  <rect class="dg-box" x="502" y="160" width="36" height="36"/>
  <rect class="dg-box" x="538" y="160" width="36" height="36"/>
  <rect class="dg-hot" x="538" y="52" width="36" height="144"/>
  <line class="dg-line" x1="538" y1="88" x2="574" y2="88"/>
  <line class="dg-line" x1="538" y1="124" x2="574" y2="124"/>
  <line class="dg-line" x1="538" y1="160" x2="574" y2="160"/>
  <path class="dg-flow" d="M256 116 Q340 66 422 116" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="64" dy="0.35em" text-anchor="middle">a quarter turn</text>
  <text x="148" y="216" dy="0.35em" text-anchor="middle">3 rows of 4</text>
  <text x="520.0" y="216" dy="0.35em" text-anchor="middle">4 rows of 3</text>
  <text class="dg-code" x="340" y="244" dy="0.35em" text-anchor="middle">3 × 4 = 4 × 3 = 12</text>
</svg>
