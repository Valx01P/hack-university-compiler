<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220">
  <title>Opposites on the number line, and which way is less</title>
  <desc>A number line from −6 to 6 with 0 in the middle. The points −3 and 3 are highlighted, and brackets show each is 3 steps from 0, so they are mirror images across 0, a number and its opposite. Below the line, an arrow pointing left is labeled less and one pointing right is labeled greater: further left is less, so −5 is less than −2.</desc>
  <!-- The number line, with arrows both ways. -->
  <line class="dg-line" x1="340" y1="110" x2="670" y2="110" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="110" x2="10" y2="110" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="40" y1="103" x2="40" y2="117"/>
  <text x="40" y="134" dy="0.35em" text-anchor="middle">−6</text>
  <line class="dg-line" x1="90" y1="103" x2="90" y2="117"/>
  <text x="90" y="134" dy="0.35em" text-anchor="middle">−5</text>
  <line class="dg-line" x1="140" y1="103" x2="140" y2="117"/>
  <text x="140" y="134" dy="0.35em" text-anchor="middle">−4</text>
  <line class="dg-line" x1="190" y1="103" x2="190" y2="117"/>
  <text x="190" y="134" dy="0.35em" text-anchor="middle">−3</text>
  <line class="dg-line" x1="240" y1="103" x2="240" y2="117"/>
  <text x="240" y="134" dy="0.35em" text-anchor="middle">−2</text>
  <line class="dg-line" x1="290" y1="103" x2="290" y2="117"/>
  <text x="290" y="134" dy="0.35em" text-anchor="middle">−1</text>
  <line class="dg-line" x1="340" y1="103" x2="340" y2="117"/>
  <text x="340" y="134" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line" x1="390" y1="103" x2="390" y2="117"/>
  <text x="390" y="134" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="440" y1="103" x2="440" y2="117"/>
  <text x="440" y="134" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="490" y1="103" x2="490" y2="117"/>
  <text x="490" y="134" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="540" y1="103" x2="540" y2="117"/>
  <text x="540" y="134" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="590" y1="103" x2="590" y2="117"/>
  <text x="590" y="134" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="640" y1="103" x2="640" y2="117"/>
  <text x="640" y="134" dy="0.35em" text-anchor="middle">6</text>
  <!-- 3 and its opposite, each 3 steps from 0. -->
  <path class="dg-line" d="M190 84 V76 H336 V84"/>
  <path class="dg-line" d="M344 84 V76 H490 V84"/>
  <text class="dg-note" x="265" y="58" dy="0.35em" text-anchor="middle">3 steps</text>
  <text class="dg-note" x="415" y="58" dy="0.35em" text-anchor="middle">3 steps</text>
  <circle class="dg-hot" cx="190" cy="110" r="6"/>
  <circle class="dg-hot" cx="490" cy="110" r="6"/>
  <text class="dg-heading" x="340" y="30" dy="0.35em" text-anchor="middle">−3 and 3 are opposites</text>
  <!-- Which way is less. -->
  <line class="dg-line" x1="290" y1="172" x2="90" y2="172" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="390" y1="172" x2="590" y2="172" marker-end="url(#arrow)"/>
  <text class="dg-note" x="190" y="192" dy="0.35em" text-anchor="middle">less</text>
  <text class="dg-note" x="490" y="192" dy="0.35em" text-anchor="middle">greater</text>
</svg>
