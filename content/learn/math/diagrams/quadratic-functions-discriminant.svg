<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Two, one, or no x-intercepts: y = x² − 6x + c for c = 5, 9, and 10</title>
  <desc>Three small graphs side by side, each a parabola with axis x = 3. y = x² − 6x + 5 has its vertex at (3, −4), below the x-axis, and crosses it at 1 and 5, where D = 16. y = x² − 6x + 9 touches the axis at its vertex (3, 0), where D = 0. y = x² − 6x + 10 has its vertex at (3, 1), above the axis, and never meets it, where D = −4.</desc>
