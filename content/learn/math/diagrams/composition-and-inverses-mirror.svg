<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>y = x² for x ≥ 0 and its inverse y = √x, mirror images in the line y = x</title>
  <desc>The curve y = x² for x ≥ 0 and the curve y = √x are reflections of each other in the dashed line y = x. The point (2, 4) on the first and (4, 2) on the second are mirror images: the segment joining them is perpendicular to y = x, with its midpoint (3, 3) on that line. The curves meet on the line at (0, 0) and (1, 1).</desc>
