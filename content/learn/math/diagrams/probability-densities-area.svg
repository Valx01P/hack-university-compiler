<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The density f(x) = x/2 on [0, 2], with the area from 1 to 2 shaded</title>
  <desc>The density f(x) = x/2 rises in a straight line from 0 at x = 0 to 1 at x = 2 and is 0 everywhere else, so the whole region under it is a triangle of area 1. The part from x = 1 to x = 2 is shaded. Its area, 3/4, is the probability that X lands between 1 and 2.</desc>
  <!-- shaded area from 1 to 2, one shape -->
  <polygon class="dg-hot" points="340,260 340,168.3 486.7,76.7 486.7,260"/>
  <line class="dg-line" x1="114" y1="260" x2="574" y2="260" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="193.3" y1="266" x2="193.3" y2="26" marker-end="url(#arrow)"/>
  <text class="dg-note" x="582" y="260" dy="0.35em" text-anchor="start">x</text>
  <text class="dg-note" x="193.3" y="16" dy="0.35em" text-anchor="middle">f(x)</text>
  <line class="dg-line" x1="340" y1="256" x2="340" y2="264"/>
  <text class="dg-note" x="340" y="276" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="486.7" y1="256" x2="486.7" y2="264"/>
  <text class="dg-note" x="486.7" y="276" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="189.3" y1="168.3" x2="197.3" y2="168.3"/>
  <text class="dg-note" x="185.3" y="168.3" dy="0.35em" text-anchor="end">1/2</text>
  <line class="dg-line" x1="189.3" y1="76.7" x2="197.3" y2="76.7"/>
  <text class="dg-note" x="185.3" y="76.7" dy="0.35em" text-anchor="end">1</text>
  <!-- the density: 0, then x/2, then 0 -->
  <polyline class="dg-flow" points="120,260 193.3,260 486.7,76.7"/>
  <line class="dg-flow dg-dashed" x1="486.7" y1="76.7" x2="486.7" y2="260"/>
  <polyline class="dg-flow" points="486.7,260 560,260"/>
  <text class="dg-on-hot" x="430.9" y="205" dy="0.35em" text-anchor="middle">3/4</text>
  <text x="303.3" y="122.5" dy="0.35em" text-anchor="end">f(x) = x/2</text>
  <text class="dg-note" x="494" y="80.3" dy="0.35em" text-anchor="start">area = P(1 ≤ X ≤ 2)</text>
</svg>
