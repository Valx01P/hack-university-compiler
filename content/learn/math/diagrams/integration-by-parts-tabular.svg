<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The tabular method for the integral of x² eˣ</title>
  <desc>Two columns. The left column differentiates u = x² down to 0: x², 2x, 2, 0. The right column integrates dv = eˣ again and again: eˣ each time. Diagonal arrows join each left entry to the right entry one row lower, with signs plus, minus, plus. Multiplying along the arrows and adding gives x²eˣ − 2x eˣ + 2eˣ + C.</desc>
  <text class="dg-heading" x="200" y="30" dy="0.35em" text-anchor="middle">D: differentiate u</text>
  <text class="dg-heading" x="460" y="30" dy="0.35em" text-anchor="middle">I: integrate dv</text>
  <rect class="dg-box" x="150" y="70" width="100" height="40" rx="8"/>
  <text x="200" y="90" dy="0.35em" text-anchor="middle">x²</text>
  <rect class="dg-box" x="410" y="70" width="100" height="40" rx="8"/>
  <text x="460" y="90" dy="0.35em" text-anchor="middle">eˣ</text>
  <rect class="dg-box" x="150" y="130" width="100" height="40" rx="8"/>
  <text x="200" y="150" dy="0.35em" text-anchor="middle">2x</text>
  <rect class="dg-box" x="410" y="130" width="100" height="40" rx="8"/>
  <text x="460" y="150" dy="0.35em" text-anchor="middle">eˣ</text>
  <rect class="dg-box" x="150" y="190" width="100" height="40" rx="8"/>
  <text x="200" y="210" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="410" y="190" width="100" height="40" rx="8"/>
  <text x="460" y="210" dy="0.35em" text-anchor="middle">eˣ</text>
  <rect class="dg-off" x="150" y="250" width="100" height="40" rx="8"/>
  <text class="dg-faint" x="200" y="270" dy="0.35em" text-anchor="middle">0</text>
  <rect class="dg-box" x="410" y="250" width="100" height="40" rx="8"/>
  <text x="460" y="270" dy="0.35em" text-anchor="middle">eˣ</text>
  <line class="dg-flow" x1="250" y1="94" x2="406" y2="146" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="318" cy="104" r="10"/>
  <text class="dg-on-badge" x="318" y="104" dy="0.35em" text-anchor="middle">+</text>
  <line class="dg-flow" x1="250" y1="154" x2="406" y2="206" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="318" cy="164" r="10"/>
  <text class="dg-on-badge" x="318" y="164" dy="0.35em" text-anchor="middle">−</text>
  <line class="dg-flow" x1="250" y1="214" x2="406" y2="266" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="318" cy="224" r="10"/>
  <text class="dg-on-badge" x="318" y="224" dy="0.35em" text-anchor="middle">+</text>
  <text class="dg-code" x="340" y="330" dy="0.35em" text-anchor="middle">x²eˣ − 2x eˣ + 2eˣ + C</text>
</svg>
