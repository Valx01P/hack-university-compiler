<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>Three scatter plots: positive, negative, and no association</title>
  <desc>Three small scatter plots side by side. In the first, hours studied against quiz score, the points rise from lower left to upper right, a positive association. In the second, a car's age against its price, they fall from upper left to lower right, a negative association. In the third the points scatter with no trend.</desc>
  <line class="dg-line" x1="40" y1="200" x2="220" y2="200"/>
  <line class="dg-line" x1="40" y1="200" x2="40" y2="30"/>
  <circle class="dg-hot" cx="60" cy="152" r="5"/>
  <circle class="dg-hot" cx="80" cy="136" r="5"/>
  <circle class="dg-hot" cx="80" cy="120" r="5"/>
  <circle class="dg-hot" cx="100" cy="120" r="5"/>
  <circle class="dg-hot" cx="120" cy="104" r="5"/>
  <circle class="dg-hot" cx="140" cy="104" r="5"/>
  <circle class="dg-hot" cx="140" cy="72" r="5"/>
  <circle class="dg-hot" cx="160" cy="88" r="5"/>
  <circle class="dg-hot" cx="180" cy="56" r="5"/>
  <circle class="dg-hot" cx="200" cy="56" r="5"/>
  <text class="dg-heading" x="130" y="230" dy="0.35em" text-anchor="middle">positive</text>
  <line class="dg-line" x1="260" y1="200" x2="440" y2="200"/>
  <line class="dg-line" x1="260" y1="200" x2="260" y2="30"/>
  <circle class="dg-hot" cx="280" cy="56" r="5"/>
  <circle class="dg-hot" cx="300" cy="72" r="5"/>
  <circle class="dg-hot" cx="320" cy="72" r="5"/>
  <circle class="dg-hot" cx="340" cy="104" r="5"/>
  <circle class="dg-hot" cx="360" cy="120" r="5"/>
  <circle class="dg-hot" cx="380" cy="120" r="5"/>
  <circle class="dg-hot" cx="400" cy="152" r="5"/>
  <circle class="dg-hot" cx="420" cy="168" r="5"/>
  <text class="dg-heading" x="350" y="230" dy="0.35em" text-anchor="middle">negative</text>
  <line class="dg-line" x1="480" y1="200" x2="660" y2="200"/>
  <line class="dg-line" x1="480" y1="200" x2="480" y2="30"/>
  <circle class="dg-hot" cx="500" cy="120" r="5"/>
  <circle class="dg-hot" cx="520" cy="168" r="5"/>
  <circle class="dg-hot" cx="540" cy="72" r="5"/>
  <circle class="dg-hot" cx="560" cy="136" r="5"/>
  <circle class="dg-hot" cx="580" cy="88" r="5"/>
  <circle class="dg-hot" cx="600" cy="152" r="5"/>
  <circle class="dg-hot" cx="620" cy="104" r="5"/>
  <circle class="dg-hot" cx="640" cy="120" r="5"/>
  <text class="dg-heading" x="570" y="230" dy="0.35em" text-anchor="middle">no association</text>
</svg>
