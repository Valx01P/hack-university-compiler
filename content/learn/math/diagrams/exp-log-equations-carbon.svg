<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Reading an age off the carbon-14 decay curve: 30% left means about 9953 years</title>
  <desc>The fraction of carbon-14 left, (1/2)^(t/5730), falls from 1 at t = 0 through 0.5 at 5730 years and 0.25 at 11,460 years. A dashed horizontal line at 0.30 meets the curve, and a dashed line drops from there to the time axis at about 9953 years, the age the equation gives.</desc>
  <line class="dg-line" x1="70" y1="277" x2="650" y2="277" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="231.3" y1="273" x2="231.3" y2="281"/>
  <text class="dg-note" x="231.3" y="293" text-anchor="middle">5730</text>
  <line class="dg-line" x1="359.1" y1="273" x2="359.1" y2="281"/>
  <text class="dg-note" x="359.1" y="293" text-anchor="middle">11,460</text>
  <line class="dg-line" x1="486.9" y1="273" x2="486.9" y2="281"/>
  <text class="dg-note" x="486.9" y="293" text-anchor="middle">17,190</text>
  <line class="dg-line" x1="614.8" y1="273" x2="614.8" y2="281"/>
  <text class="dg-note" x="614.8" y="293" text-anchor="middle">22,920</text>
  <text class="dg-note" x="648" y="265" text-anchor="end">years</text>
  <line class="dg-line" x1="103.5" y1="300" x2="103.5" y2="20" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="99.5" y1="219.7" x2="107.5" y2="219.7"/>
  <line class="dg-line" x1="99.5" y1="162.3" x2="107.5" y2="162.3"/>
  <text class="dg-note" x="95.5" y="162.3" dy="0.35em" text-anchor="end">0.5</text>
  <line class="dg-line" x1="99.5" y1="104.9" x2="107.5" y2="104.9"/>
  <text class="dg-note" x="95.5" y="104.9" dy="0.35em" text-anchor="end">0.75</text>
  <line class="dg-line" x1="99.5" y1="47.5" x2="107.5" y2="47.5"/>
  <text class="dg-note" x="95.5" y="47.5" dy="0.35em" text-anchor="end">1</text>
  <text class="dg-note" x="113.5" y="26" dy="0.35em" text-anchor="start">fraction left</text>
  <polyline class="dg-flow" points="103.5,47.5 124.8,72.6 147.4,96.2 170,117 193.8,136.4 218.9,154.3 244,169.9 271.6,184.8 300.5,198.2 330.6,210.1 362,220.6 395.8,230 432.2,238.5 471.1,245.8 512.5,252.1 556.4,257.4 605.4,262"/>
  <line class="dg-line dg-dashed" x1="103.5" y1="208.2" x2="325.5" y2="208.2"/>
  <line class="dg-line dg-dashed" x1="325.5" y1="277" x2="325.5" y2="208.2"/>
  <circle class="dg-hot" cx="325.5" cy="208.2" r="5"/>
  <text class="dg-code" x="337.5" y="194.2" dy="0.35em" text-anchor="start">30% left at about 9953 years</text>
  <text class="dg-note" x="95.5" y="208.2" dy="0.35em" text-anchor="end">0.3</text>
</svg>
