<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>A sketch of f(x) = 2(x² − 1)/(x² − 4) with its asymptotes and intercepts</title>
  <desc>Dashed vertical asymptotes at x = −2 and x = 2 and a dashed horizontal asymptote at y = 2. Left of −2 and right of 2 the graph comes in just above y = 2 and rises along the vertical asymptotes. Between them it dips below, crossing the x-axis at −1 and 1, with the y-intercept (0, 1/2) on the way, and falls along both asymptotes.</desc>
