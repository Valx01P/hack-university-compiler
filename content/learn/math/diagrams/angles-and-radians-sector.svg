<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A sector with radius r, central angle θ, and arc length s</title>
  <desc>A sector of a circle, shaded, with its two radii of length r and its central angle θ at the center. The curved edge is the arc, of length s = rθ when θ is in radians. The sector's area is ½r²θ, the fraction θ/2π of the whole disk's area πr².</desc>
