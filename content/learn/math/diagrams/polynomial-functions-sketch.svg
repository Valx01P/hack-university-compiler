<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>A sketch of p(x) = −(x + 2)(x − 1)² with its zeros, y-intercept, and signs</title>
  <desc>The graph of p(x) = −(x + 2)(x − 1)². It comes down from the upper left, crosses the x-axis at −2, passes through the y-intercept (0, −2), turns, touches the axis at 1 without crossing, and heads down to the lower right. So p is positive left of −2 and negative everywhere else except at the zeros.</desc>
