<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>A box plot of nine commute times, with one outlier</title>
  <desc>A number line from 0 to 100 minutes. A box runs from Q1 = 16.5 to Q3 = 29 with a line inside at the median, 22. Whiskers reach left to 12, the minimum, and right to 30, the largest value that is not an outlier. The commute of 95 minutes is drawn as a separate point past the whisker.</desc>
  <line class="dg-line" x1="40" y1="200" x2="640" y2="200"/>
  <line class="dg-line" x1="60" y1="195" x2="60" y2="205"/>
  <text class="dg-note" x="60" y="216" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line" x1="170" y1="195" x2="170" y2="205"/>
  <text class="dg-note" x="170" y="216" dy="0.35em" text-anchor="middle">20</text>
  <line class="dg-line" x1="280" y1="195" x2="280" y2="205"/>
  <text class="dg-note" x="280" y="216" dy="0.35em" text-anchor="middle">40</text>
  <line class="dg-line" x1="390" y1="195" x2="390" y2="205"/>
  <text class="dg-note" x="390" y="216" dy="0.35em" text-anchor="middle">60</text>
  <line class="dg-line" x1="500" y1="195" x2="500" y2="205"/>
  <text class="dg-note" x="500" y="216" dy="0.35em" text-anchor="middle">80</text>
  <line class="dg-line" x1="610" y1="195" x2="610" y2="205"/>
  <text class="dg-note" x="610" y="216" dy="0.35em" text-anchor="middle">100</text>
  <text class="dg-note" x="340" y="240" dy="0.35em" text-anchor="middle">commute, minutes</text>
  <line class="dg-line" x1="126" y1="120" x2="150.8" y2="120"/>
  <line class="dg-line" x1="219.5" y1="120" x2="225" y2="120"/>
  <line class="dg-line" x1="126" y1="108" x2="126" y2="132"/>
  <line class="dg-line" x1="225" y1="108" x2="225" y2="132"/>
  <rect class="dg-hot" x="150.8" y="96" width="68.8" height="48"/>
  <line class="dg-flow" x1="181" y1="96" x2="181" y2="144"/>
  <circle class="dg-box" cx="582.5" cy="120" r="6"/>
  <text class="dg-note" x="126" y="164" dy="0.35em" text-anchor="end">min 12</text>
  <text class="dg-note" x="148.8" y="80" dy="0.35em" text-anchor="end">Q1 16.5</text>
  <text class="dg-note" x="181" y="62" dy="0.35em" text-anchor="middle">median 22</text>
  <text class="dg-note" x="221.5" y="80" dy="0.35em" text-anchor="start">Q3 29</text>
  <text class="dg-note" x="233" y="164" dy="0.35em" text-anchor="start">whisker ends at 30</text>
  <text x="582.5" y="96" dy="0.35em" text-anchor="middle">outlier 95</text>
</svg>
