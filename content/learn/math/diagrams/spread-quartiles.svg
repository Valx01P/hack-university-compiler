<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220">
  <title>Quartiles cut eight sorted values into four groups of two</title>
  <desc>The sorted values 1, 3, 4, 6, 8, 9, 11, 14 sit in eight boxes. Three cuts divide them into four groups of two. The cut between 3 and 4 is Q1 = 3.5, the cut between 6 and 8 is the median, 7, and the cut between 9 and 11 is Q3 = 10. The IQR, 10 − 3.5 = 6.5, spans the middle four values.</desc>
  <rect class="dg-box" x="60" y="80" width="56" height="44" rx="8"/>
  <text x="88" y="102" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-box" x="132" y="80" width="56" height="44" rx="8"/>
  <text x="160" y="102" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-hot" x="204" y="80" width="56" height="44" rx="8"/>
  <text class="dg-on-hot" x="232" y="102" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-hot" x="276" y="80" width="56" height="44" rx="8"/>
  <text class="dg-on-hot" x="304" y="102" dy="0.35em" text-anchor="middle">6</text>
  <rect class="dg-hot" x="348" y="80" width="56" height="44" rx="8"/>
  <text class="dg-on-hot" x="376" y="102" dy="0.35em" text-anchor="middle">8</text>
  <rect class="dg-hot" x="420" y="80" width="56" height="44" rx="8"/>
  <text class="dg-on-hot" x="448" y="102" dy="0.35em" text-anchor="middle">9</text>
  <rect class="dg-box" x="492" y="80" width="56" height="44" rx="8"/>
  <text x="520" y="102" dy="0.35em" text-anchor="middle">11</text>
  <rect class="dg-box" x="564" y="80" width="56" height="44" rx="8"/>
  <text x="592" y="102" dy="0.35em" text-anchor="middle">14</text>
  <line class="dg-flow" x1="196" y1="60" x2="196" y2="144"/>
  <text x="196" y="44" dy="0.35em" text-anchor="middle">Q1 = 3.5</text>
  <line class="dg-flow" x1="340" y1="60" x2="340" y2="144"/>
  <text x="340" y="44" dy="0.35em" text-anchor="middle">median 7</text>
  <line class="dg-flow" x1="484" y1="60" x2="484" y2="144"/>
  <text x="484" y="44" dy="0.35em" text-anchor="middle">Q3 = 10</text>
  <path class="dg-line" d="M204 160 V168 H476 V160"/>
  <text class="dg-note" x="340" y="186" dy="0.35em" text-anchor="middle">the middle half: IQR = 10 − 3.5 = 6.5</text>
</svg>
