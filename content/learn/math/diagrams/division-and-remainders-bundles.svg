<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200">
  <title>23 divided by 5 as four jumps of 5 and a remainder of 3</title>
  <desc>A number line from 0 to 25. Four jumps of 5 go from 0 to 5, 10, 15, and 20. The 3 steps from 20 to 23 are highlighted as the remainder. A dashed fifth jump from 20 to 25 passes 23, so only four groups of 5 fit, and 23 = 5 × 4 + 3.</desc>
  <!-- The number line, with a tick at every whole number. -->
  <line class="dg-line" x1="40" y1="120" x2="660" y2="120" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="40" y1="112" x2="40" y2="128"/>
  <line class="dg-line" x1="64" y1="116" x2="64" y2="124"/>
  <line class="dg-line" x1="88" y1="116" x2="88" y2="124"/>
  <line class="dg-line" x1="112" y1="116" x2="112" y2="124"/>
  <line class="dg-line" x1="136" y1="116" x2="136" y2="124"/>
  <line class="dg-line" x1="160" y1="112" x2="160" y2="128"/>
  <line class="dg-line" x1="184" y1="116" x2="184" y2="124"/>
  <line class="dg-line" x1="208" y1="116" x2="208" y2="124"/>
  <line class="dg-line" x1="232" y1="116" x2="232" y2="124"/>
  <line class="dg-line" x1="256" y1="116" x2="256" y2="124"/>
  <line class="dg-line" x1="280" y1="112" x2="280" y2="128"/>
  <line class="dg-line" x1="304" y1="116" x2="304" y2="124"/>
  <line class="dg-line" x1="328" y1="116" x2="328" y2="124"/>
  <line class="dg-line" x1="352" y1="116" x2="352" y2="124"/>
  <line class="dg-line" x1="376" y1="116" x2="376" y2="124"/>
  <line class="dg-line" x1="400" y1="112" x2="400" y2="128"/>
  <line class="dg-line" x1="424" y1="116" x2="424" y2="124"/>
  <line class="dg-line" x1="448" y1="116" x2="448" y2="124"/>
  <line class="dg-line" x1="472" y1="116" x2="472" y2="124"/>
  <line class="dg-line" x1="496" y1="116" x2="496" y2="124"/>
  <line class="dg-line" x1="520" y1="112" x2="520" y2="128"/>
  <line class="dg-line" x1="544" y1="116" x2="544" y2="124"/>
  <line class="dg-line" x1="568" y1="116" x2="568" y2="124"/>
  <line class="dg-line" x1="592" y1="116" x2="592" y2="124"/>
  <line class="dg-line" x1="616" y1="116" x2="616" y2="124"/>
  <line class="dg-line" x1="640" y1="112" x2="640" y2="128"/>
  <text x="40" y="146" dy="0.35em" text-anchor="middle">0</text>
  <text x="160" y="146" dy="0.35em" text-anchor="middle">5</text>
  <text x="280" y="146" dy="0.35em" text-anchor="middle">10</text>
  <text x="400" y="146" dy="0.35em" text-anchor="middle">15</text>
  <text x="520" y="146" dy="0.35em" text-anchor="middle">20</text>
  <text x="592" y="146" dy="0.35em" text-anchor="middle">23</text>
  <text x="640" y="146" dy="0.35em" text-anchor="middle">25</text>
  <!-- Four jumps of 5. -->
  <line class="dg-flow" x1="42" y1="84" x2="156" y2="84" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="100" y="66" dy="0.35em" text-anchor="middle">+5</text>
  <line class="dg-flow" x1="162" y1="84" x2="276" y2="84" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="220" y="66" dy="0.35em" text-anchor="middle">+5</text>
  <line class="dg-flow" x1="282" y1="84" x2="396" y2="84" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="340" y="66" dy="0.35em" text-anchor="middle">+5</text>
  <line class="dg-flow" x1="402" y1="84" x2="516" y2="84" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="460" y="66" dy="0.35em" text-anchor="middle">+5</text>
  <text class="dg-heading" x="280" y="32" dy="0.35em" text-anchor="middle">5 × 4 = 20</text>
  <!-- The remainder: the 3 steps from 20 to 23. -->
  <rect class="dg-hot" x="520" y="114" width="72" height="12" rx="3"/>
  <text x="556" y="94" dy="0.35em" text-anchor="middle">r = 3</text>
  <!-- A fifth jump would pass 23. -->
  <line class="dg-line dg-dashed" x1="520" y1="180" x2="636" y2="180" marker-end="url(#arrow)"/>
  <text class="dg-note" x="508" y="180" dy="0.35em" text-anchor="end">a fifth 5 reaches 25, past 23</text>
</svg>
