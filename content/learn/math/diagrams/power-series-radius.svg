<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <title>Where a power series converges</title>
  <desc>A number line with the center a marked. The stretch from a − R to a + R is shaded and labeled converges absolutely. Beyond it on both sides the series diverges. The two endpoints a − R and a + R are open circles, each labeled test it alone. An arrow from a to a + R shows the radius R.</desc>
  <!-- the number line -->
  <line class="dg-line" x1="30" y1="110" x2="650" y2="110" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="160" y="102" width="360" height="16" rx="4"/>
  <text x="340" y="80" dy="0.35em" text-anchor="middle">converges absolutely</text>
  <text class="dg-note" x="105.0" y="80" dy="0.35em" text-anchor="middle">diverges</text>
  <text class="dg-note" x="575.0" y="80" dy="0.35em" text-anchor="middle">diverges</text>
  <circle class="dg-box" cx="160" cy="110" r="7"/>
  <circle class="dg-box" cx="520" cy="110" r="7"/>
  <circle class="dg-badge" cx="340" cy="110" r="4"/>
  <text x="160" y="136" dy="0.35em" text-anchor="middle">a − R</text>
  <text x="340" y="136" dy="0.35em" text-anchor="middle">a</text>
  <text x="520" y="136" dy="0.35em" text-anchor="middle">a + R</text>
  <text class="dg-note" x="160" y="158" dy="0.35em" text-anchor="middle">test it alone</text>
  <text class="dg-note" x="520" y="158" dy="0.35em" text-anchor="middle">test it alone</text>
  <!-- the radius -->
  <path class="dg-flow" d="M340 188 H516" marker-end="url(#arrow-flow)"/>
  <line class="dg-line" x1="340" y1="180" x2="340" y2="196"/>
  <text x="430.0" y="206" dy="0.35em" text-anchor="middle">R</text>
</svg>
