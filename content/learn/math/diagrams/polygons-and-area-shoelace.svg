<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The shoelace formula for the triangle (1, 1), (5, 2), (3, 6)</title>
  <desc>On the left, a coordinate grid with the triangle whose vertices are (1, 1), (5, 2), and (3, 6). On the right, the vertices are listed in two columns, x and y, with the first vertex repeated at the bottom. Solid lines cross from each x down to the next row's y, and dashed lines cross from each y down to the next row's x, like laces. The crossings give 2 − 5 = −3, 30 − 6 = 24, and 3 − 6 = −3, which add to 18, so the area is half of 18, which is 9.</desc>
  <line class="dg-line" x1="50" y1="290" x2="289.4" y2="290" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="50" y1="290" x2="50" y2="24" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="88" y1="286" x2="88" y2="294"/>
  <text class="dg-note" x="88" y="306" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="126" y1="286" x2="126" y2="294"/>
  <text class="dg-note" x="126" y="306" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="164" y1="286" x2="164" y2="294"/>
  <text class="dg-note" x="164" y="306" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="202" y1="286" x2="202" y2="294"/>
  <text class="dg-note" x="202" y="306" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="240" y1="286" x2="240" y2="294"/>
  <text class="dg-note" x="240" y="306" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="278" y1="286" x2="278" y2="294"/>
  <text class="dg-note" x="278" y="306" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="46" y1="252" x2="54" y2="252"/>
  <text class="dg-note" x="36" y="252" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="46" y1="214" x2="54" y2="214"/>
  <text class="dg-note" x="36" y="214" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="46" y1="176" x2="54" y2="176"/>
  <text class="dg-note" x="36" y="176" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="46" y1="138" x2="54" y2="138"/>
  <text class="dg-note" x="36" y="138" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="46" y1="100" x2="54" y2="100"/>
  <text class="dg-note" x="36" y="100" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="46" y1="62" x2="54" y2="62"/>
  <text class="dg-note" x="36" y="62" dy="0.35em" text-anchor="middle">6</text>
  <polygon class="dg-hot" points="88,252 240,214 164,62"/>
  <circle class="dg-strong" cx="88" cy="252" r="4"/>
  <text x="84" y="274" dy="0.35em" text-anchor="middle">(1, 1)</text>
  <circle class="dg-strong" cx="240" cy="214" r="4"/>
  <text x="284" y="214" dy="0.35em" text-anchor="middle">(5, 2)</text>
  <circle class="dg-strong" cx="164" cy="62" r="4"/>
  <text x="164" y="44" dy="0.35em" text-anchor="middle">(3, 6)</text>
  <text class="dg-on-hot" x="164" y="176" dy="0.35em" text-anchor="middle">9</text>
  <text class="dg-heading" x="400" y="40" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-heading" x="470" y="40" dy="0.35em" text-anchor="middle">y</text>
  <text class="dg-code" x="400" y="70" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="470" y="70" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="400" y="120" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-code" x="470" y="120" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="400" y="170" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="470" y="170" dy="0.35em" text-anchor="middle">6</text>
  <text class="dg-code" x="400" y="220" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="470" y="220" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-flow" x1="410" y1="76" x2="460" y2="114"/>
  <line class="dg-line dg-dashed" x1="460" y1="76" x2="410" y2="114"/>
  <line class="dg-flow" x1="410" y1="126" x2="460" y2="164"/>
  <line class="dg-line dg-dashed" x1="460" y1="126" x2="410" y2="164"/>
  <line class="dg-flow" x1="410" y1="176" x2="460" y2="214"/>
  <line class="dg-line dg-dashed" x1="460" y1="176" x2="410" y2="214"/>
  <text class="dg-code" x="510" y="95" dy="0.35em" text-anchor="start">1·2 − 5·1 = −3</text>
  <text class="dg-code" x="510" y="145" dy="0.35em" text-anchor="start">5·6 − 3·2 = 24</text>
  <text class="dg-code" x="510" y="195" dy="0.35em" text-anchor="start">3·1 − 1·6 = −3</text>
  <text class="dg-code" x="530" y="260" dy="0.35em" text-anchor="middle">sum 18</text>
  <text class="dg-code" x="530" y="284" dy="0.35em" text-anchor="middle">area 18 / 2 = 9</text>
</svg>
