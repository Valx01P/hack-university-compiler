<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <title>The triangle inequality: the two shorter sides must reach past the longest</title>
  <desc>Three pairs of rods on a base. On the left, rods of 4 and 7 on a base of 10 meet above it, since 4 + 7 = 11 is more than 10. In the middle, rods of 3 and 5 on a base of 8 can only meet flat on the base, since 3 + 5 = 8. On the right, rods of 3 and 5 on a base of 9 can't meet at all, since 3 + 5 = 8 is less than 9.</desc>
  <line class="dg-line" x1="20" y1="180" x2="220" y2="180"/>
  <polygon class="dg-box" points="20,180 220,180 87,136.3"/>
  <line class="dg-flow" x1="20" y1="180" x2="87" y2="136.3"/>
  <line class="dg-flow" x1="220" y1="180" x2="87" y2="136.3"/>
  <text class="dg-code" x="120" y="202" dy="0.35em" text-anchor="middle">4 + 7 vs 10</text>
  <text class="dg-note" x="120" y="224" dy="0.35em" text-anchor="middle">11 &gt; 10: a triangle</text>
  <line class="dg-line" x1="260" y1="180" x2="420" y2="180"/>
  <line class="dg-flow" x1="260" y1="176" x2="320" y2="176"/>
  <line class="dg-flow" x1="320" y1="176" x2="420" y2="176"/>
  <circle class="dg-strong" cx="320" cy="176" r="4"/>
  <text class="dg-code" x="340" y="202" dy="0.35em" text-anchor="middle">3 + 5 vs 8</text>
  <text class="dg-note" x="340" y="224" dy="0.35em" text-anchor="middle">8 = 8: flat, no triangle</text>
  <line class="dg-line" x1="470" y1="180" x2="650" y2="180"/>
  <line class="dg-flow" x1="470" y1="180" x2="506" y2="132"/>
  <line class="dg-flow" x1="650" y1="180" x2="590" y2="100"/>
  <text class="dg-code" x="560" y="202" dy="0.35em" text-anchor="middle">3 + 5 vs 9</text>
  <text class="dg-note" x="560" y="224" dy="0.35em" text-anchor="middle">8 &lt; 9: the rods can't meet</text>
</svg>
