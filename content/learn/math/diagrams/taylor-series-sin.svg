<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Taylor polynomials of sin x at 0</title>
  <desc>The wave y = sin x from −2π to 2π, with its Taylor polynomials at 0 of degrees 1, 3, 5, and 7. The line T1 = x matches the wave only near 0. T3 follows it out to about x = 1.5, T5 to about 2.5, and T7 past 3, each peeling away up or down after that.</desc>
