<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>The vector from P(1, 1) to Q(4, 5)</title>
  <desc>An arrow from the point P(1, 1) to the point Q(4, 5), with a dashed run of 3 to the right and a dashed rise of 4 up. Beside it, an arrow from the origin to (3, 4) has the same length and direction, so both arrows are the vector (3, 4).</desc>
  <!-- Axes -->
  <line class="dg-line" x1="192" y1="307" x2="510" y2="307" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="229" y1="344" x2="229" y2="26" marker-end="url(#arrow)"/>
  <text class="dg-note" x="518" y="307" dy="0.35em">x</text>
  <text class="dg-note" x="229" y="18" text-anchor="middle">y</text>
  <line class="dg-line" x1="277.4" y1="302" x2="277.4" y2="312"/>
  <text class="dg-note" x="277.4" y="325" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="325.8" y1="302" x2="325.8" y2="312"/>
  <text class="dg-note" x="325.8" y="325" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="374.2" y1="302" x2="374.2" y2="312"/>
  <text class="dg-note" x="374.2" y="325" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="422.6" y1="302" x2="422.6" y2="312"/>
  <text class="dg-note" x="422.6" y="325" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="471" y1="302" x2="471" y2="312"/>
  <text class="dg-note" x="471" y="325" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="224" y1="258.6" x2="234" y2="258.6"/>
  <text class="dg-note" x="219" y="258.6" dy="0.35em" text-anchor="end">1</text>
  <line class="dg-line" x1="224" y1="210.2" x2="234" y2="210.2"/>
  <text class="dg-note" x="219" y="210.2" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="224" y1="161.8" x2="234" y2="161.8"/>
  <text class="dg-note" x="219" y="161.8" dy="0.35em" text-anchor="end">3</text>
  <line class="dg-line" x1="224" y1="113.4" x2="234" y2="113.4"/>
  <text class="dg-note" x="219" y="113.4" dy="0.35em" text-anchor="end">4</text>
  <line class="dg-line" x1="224" y1="65" x2="234" y2="65"/>
  <text class="dg-note" x="219" y="65" dy="0.35em" text-anchor="end">5</text>
  <!-- run and rise -->
  <line class="dg-line dg-dashed" x1="277.4" y1="258.6" x2="422.6" y2="258.6"/>
  <line class="dg-line dg-dashed" x1="422.6" y1="258.6" x2="422.6" y2="65"/>
  <text class="dg-note" x="383.9" y="272.6" dy="0.35em" text-anchor="middle">run 3</text>
  <text class="dg-note" x="430.6" y="161.8" dy="0.35em" text-anchor="start">rise 4</text>
  <!-- the same vector from the origin -->
  <line class="dg-line" x1="229" y1="307" x2="374.2" y2="113.4" marker-end="url(#arrow)"/>
  <text class="dg-note" x="291.6" y="210.2" dy="0.35em" text-anchor="end">(3, 4)</text>
  <!-- PQ -->
  <line class="dg-flow" x1="277.4" y1="258.6" x2="422.6" y2="65" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="277.4" cy="258.6" r="4"/>
  <text x="283.4" y="274.6" dy="0.35em" text-anchor="start">P(1, 1)</text>
  <text x="430.6" y="61" dy="0.35em" text-anchor="start">Q(4, 5)</text>
  <text x="364.8" y="175.5" dy="0.35em" text-anchor="start">PQ</text>
</svg>
