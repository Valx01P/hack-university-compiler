  <line class="dg-line" x1="40" y1="455" x2="40" y2="465"/>
  <text class="dg-note" x="40" y="476" dy="0.35em" text-anchor="middle">0.15</text>
  <line class="dg-line" x1="160" y1="455" x2="160" y2="465"/>
  <text class="dg-note" x="160" y="476" dy="0.35em" text-anchor="middle">0.25</text>
  <line class="dg-line" x1="280" y1="455" x2="280" y2="465"/>
  <text class="dg-note" x="280" y="476" dy="0.35em" text-anchor="middle">0.35</text>
  <line class="dg-line" x1="400" y1="455" x2="400" y2="465"/>
  <text class="dg-note" x="400" y="476" dy="0.35em" text-anchor="middle">0.45</text>
  <line class="dg-line" x1="520" y1="455" x2="520" y2="465"/>
  <text class="dg-note" x="520" y="476" dy="0.35em" text-anchor="middle">0.55</text>
  <line class="dg-line" x1="640" y1="455" x2="640" y2="465"/>
  <text class="dg-note" x="640" y="476" dy="0.35em" text-anchor="middle">0.65</text>
  <line class="dg-line dg-dashed" x1="340" y1="24" x2="340" y2="460"/>
  <text x="340" y="14" dy="0.35em" text-anchor="middle">true p = 0.4</text>
