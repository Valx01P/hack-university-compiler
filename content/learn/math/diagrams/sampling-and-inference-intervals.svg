<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500">
  <title>Twenty 95% confidence intervals from twenty samples, and the true proportion</title>
  <desc>Twenty horizontal segments, each a sample proportion plus or minus its margin of error from a sample of 100 people, drawn against a vertical line at the true proportion 0.4. Nineteen of the segments cross the line. One, highlighted, misses it: about one interval in twenty does, which is what 95% confidence means.</desc>
