<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A person walking away from a street lamp, casting a shadow</title>
  <desc>A lamp 15 feet up on a post, and a person 6 feet tall standing x feet from the post, walking away at 5 feet per second. A dashed ray from the lamp grazes the person's head and meets the ground at the tip of the shadow, s feet beyond the person. The small shaded triangle under the ray is similar to the big one, so 15/(x + s) = 6/s and s = (2/3)x.</desc>
  <!-- the ground, the lamp post (15 ft), and the person (6 ft), 15 units a foot -->
  <line class="dg-line" x1="40" y1="260" x2="520" y2="260"/>
  <polygon class="dg-hot" points="260,170 260,260 380,260"/>
  <line class="dg-line dg-dashed" x1="80" y1="35" x2="380" y2="260"/>
  <rect class="dg-strong" x="76" y="35" width="8" height="225"/>
  <circle class="dg-hot" cx="80" cy="35" r="8"/>
  <rect class="dg-strong" x="255" y="170" width="10" height="90" rx="4"/>
  <text x="64" y="150" dy="0.35em" text-anchor="end">15 ft</text>
  <text x="244" y="215" dy="0.35em" text-anchor="end">6 ft</text>
  <!-- x from the post to the person, s the shadow -->
  <line class="dg-line" x1="80" y1="280" x2="260" y2="280"/>
  <text x="170" y="294" dy="0.35em" text-anchor="middle">x</text>
  <line class="dg-line" x1="260" y1="280" x2="380" y2="280"/>
  <text x="320" y="294" dy="0.35em" text-anchor="middle">s</text>
  <line class="dg-line" x1="260" y1="273" x2="260" y2="287"/>
  <line class="dg-line" x1="80" y1="273" x2="80" y2="287"/>
  <line class="dg-line" x1="380" y1="273" x2="380" y2="287"/>
  <line class="dg-flow" x1="276" y1="150" x2="336" y2="150" marker-end="url(#arrow-flow)"/>
  <text x="348" y="150" dy="0.35em" text-anchor="start">dx/dt = 5 ft/s</text>
  <text class="dg-note" x="392" y="236" dy="0.35em" text-anchor="start">tip</text>
  <text x="590" y="110" dy="0.35em" text-anchor="middle">15/(x + s) = 6/s</text>
  <text class="dg-note" x="590" y="136" dy="0.35em" text-anchor="middle">so s = (2/3)x</text>
</svg>
