  <title>The graph of (x + 2)/(x − 3) with its two asymptotes</title>
  <desc>The curve has two branches. Near x = 3 the right branch shoots up toward infinity and the left branch plunges toward minus infinity, along the dashed vertical asymptote x = 3. Far to the left and right, both branches flatten toward the dashed horizontal asymptote y = 1.</desc>
