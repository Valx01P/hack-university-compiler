<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>Two factor trees for 60 that end in the same primes</title>
  <desc>On the left, 60 splits into 6 and 10, then 6 into 2 and 3, and 10 into 2 and 5. On the right, 60 splits into 4 and 15, then 4 into 2 and 2, and 15 into 3 and 5. Both trees end in the primes 2, 2, 3, and 5, so 60 = 2² × 3 × 5 either way.</desc>
  <!-- 60 = 6 × 10 -->
  <rect class="dg-box" x="142" y="24" width="56" height="40" rx="8"/>
  <text x="170" y="44" dy="0.35em" text-anchor="middle">60</text>
  <line class="dg-line" x1="170" y1="64" x2="90" y2="104"/>
  <line class="dg-line" x1="170" y1="64" x2="250" y2="104"/>
  <rect class="dg-box" x="62" y="104" width="56" height="40" rx="8"/>
  <text x="90" y="124" dy="0.35em" text-anchor="middle">6</text>
  <rect class="dg-box" x="222" y="104" width="56" height="40" rx="8"/>
  <text x="250" y="124" dy="0.35em" text-anchor="middle">10</text>
  <line class="dg-line" x1="90" y1="144" x2="50" y2="184"/>
  <line class="dg-line" x1="90" y1="144" x2="130" y2="184"/>
  <rect class="dg-hot" x="22" y="184" width="56" height="40" rx="8"/>
  <text class="dg-on-hot" x="50" y="204" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-hot" x="102" y="184" width="56" height="40" rx="8"/>
  <text class="dg-on-hot" x="130" y="204" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="250" y1="144" x2="210" y2="184"/>
  <line class="dg-line" x1="250" y1="144" x2="290" y2="184"/>
  <rect class="dg-hot" x="182" y="184" width="56" height="40" rx="8"/>
  <text class="dg-on-hot" x="210" y="204" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-hot" x="262" y="184" width="56" height="40" rx="8"/>
  <text class="dg-on-hot" x="290" y="204" dy="0.35em" text-anchor="middle">5</text>
  <!-- 60 = 4 × 15 -->
  <rect class="dg-box" x="482" y="24" width="56" height="40" rx="8"/>
  <text x="510" y="44" dy="0.35em" text-anchor="middle">60</text>
  <line class="dg-line" x1="510" y1="64" x2="430" y2="104"/>
  <line class="dg-line" x1="510" y1="64" x2="590" y2="104"/>
  <rect class="dg-box" x="402" y="104" width="56" height="40" rx="8"/>
  <text x="430" y="124" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-box" x="562" y="104" width="56" height="40" rx="8"/>
  <text x="590" y="124" dy="0.35em" text-anchor="middle">15</text>
  <line class="dg-line" x1="430" y1="144" x2="390" y2="184"/>
  <line class="dg-line" x1="430" y1="144" x2="470" y2="184"/>
  <rect class="dg-hot" x="362" y="184" width="56" height="40" rx="8"/>
  <text class="dg-on-hot" x="390" y="204" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-hot" x="442" y="184" width="56" height="40" rx="8"/>
  <text class="dg-on-hot" x="470" y="204" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="590" y1="144" x2="550" y2="184"/>
  <line class="dg-line" x1="590" y1="144" x2="630" y2="184"/>
  <rect class="dg-hot" x="522" y="184" width="56" height="40" rx="8"/>
  <text class="dg-on-hot" x="550" y="204" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-hot" x="602" y="184" width="56" height="40" rx="8"/>
  <text class="dg-on-hot" x="630" y="204" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line dg-dashed" x1="340" y1="24" x2="340" y2="236"/>
</svg>
