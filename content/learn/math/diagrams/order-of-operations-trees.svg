<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>Expression trees for 2 + 3 × 4 and (2 + 3) × 4</title>
  <desc>Two trees. In the left one, for 2 + 3 × 4, a plus sits at the top with 2 and a highlighted times below it, and the times has 3 and 4 below it. The lower operation is done first, so 3 × 4 = 12, then 2 + 12 = 14. In the right one, for (2 + 3) × 4, the times is at the top and the highlighted plus is lower, so 2 + 3 = 5 comes first, then 5 × 4 = 20.</desc>
  <!-- Left tree: 2 + 3 × 4, the product lower, so first. -->
  <line class="dg-line" x1="156.1" y1="90.3" x2="113.9" y2="133.7"/>
  <line class="dg-line" x1="183.9" y1="90.3" x2="226.1" y2="133.7"/>
  <line class="dg-line" x1="228.6" y1="164.4" x2="201.4" y2="203.6"/>
  <line class="dg-line" x1="251.4" y1="164.4" x2="278.6" y2="203.6"/>
  <circle class="dg-box" cx="170" cy="76" r="20"/>
  <text x="170" y="76" dy="0.35em" text-anchor="middle">+</text>
  <circle class="dg-box" cx="100" cy="148" r="20"/>
  <text x="100" y="148" dy="0.35em" text-anchor="middle">2</text>
  <circle class="dg-hot" cx="240" cy="148" r="20"/>
  <text class="dg-on-hot" x="240" y="148" dy="0.35em" text-anchor="middle">×</text>
  <circle class="dg-box" cx="190" cy="220" r="20"/>
  <text x="190" y="220" dy="0.35em" text-anchor="middle">3</text>
  <circle class="dg-box" cx="290" cy="220" r="20"/>
  <text x="290" y="220" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="270" y="148" dy="0.35em" text-anchor="start">12</text>
  <text class="dg-code" x="170" y="28" dy="0.35em" text-anchor="middle">2 + 3 × 4 = 14</text>
  <!-- Right tree: (2 + 3) × 4, the sum lower, so first. -->
  <line class="dg-line" x1="496.1" y1="90.3" x2="453.9" y2="133.7"/>
  <line class="dg-line" x1="523.9" y1="90.3" x2="566.1" y2="133.7"/>
  <line class="dg-line" x1="428.6" y1="164.4" x2="401.4" y2="203.6"/>
  <line class="dg-line" x1="451.4" y1="164.4" x2="478.6" y2="203.6"/>
  <circle class="dg-box" cx="510" cy="76" r="20"/>
  <text x="510" y="76" dy="0.35em" text-anchor="middle">×</text>
  <circle class="dg-hot" cx="440" cy="148" r="20"/>
  <text class="dg-on-hot" x="440" y="148" dy="0.35em" text-anchor="middle">+</text>
  <circle class="dg-box" cx="580" cy="148" r="20"/>
  <text x="580" y="148" dy="0.35em" text-anchor="middle">4</text>
  <circle class="dg-box" cx="390" cy="220" r="20"/>
  <text x="390" y="220" dy="0.35em" text-anchor="middle">2</text>
  <circle class="dg-box" cx="490" cy="220" r="20"/>
  <text x="490" y="220" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-note" x="410" y="148" dy="0.35em" text-anchor="end">5</text>
  <text class="dg-code" x="510" y="28" dy="0.35em" text-anchor="middle">(2 + 3) × 4 = 20</text>
</svg>
