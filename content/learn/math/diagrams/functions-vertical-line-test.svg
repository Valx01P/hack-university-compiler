<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The vertical line test: a parabola passes and a circle fails</title>
  <desc>On the left, the parabola y = x² − 2 meets the vertical line x = 1 at one point, as every vertical line does, so it is the graph of a function. On the right, the circle x² + y² = 4 meets the line x = 1 at two points, (1, √3) and (1, −√3), so it is not.</desc>
