<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200">
  <title>−7 divided by 3: step down to −9, then 2 steps up</title>
  <desc>A number line from −10 to 3 with the multiples of 3 marked. Three jumps of 3 go left from 0 to −3, −6, and −9. −6 is already past −7 going left, so the quotient is −3 and the multiple is −9. The 2 steps from −9 up to −7 are highlighted as the remainder, so −7 = 3 × (−3) + 2.</desc>
  <!-- The number line, with a tick at every integer. -->
  <line class="dg-line" x1="20" y1="120" x2="642" y2="120" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="40" y1="116" x2="40" y2="124"/>
  <line class="dg-line" x1="84" y1="112" x2="84" y2="128"/>
  <line class="dg-line" x1="128" y1="116" x2="128" y2="124"/>
  <line class="dg-line" x1="172" y1="116" x2="172" y2="124"/>
  <line class="dg-line" x1="216" y1="112" x2="216" y2="128"/>
  <line class="dg-line" x1="260" y1="116" x2="260" y2="124"/>
  <line class="dg-line" x1="304" y1="116" x2="304" y2="124"/>
  <line class="dg-line" x1="348" y1="112" x2="348" y2="128"/>
  <line class="dg-line" x1="392" y1="116" x2="392" y2="124"/>
  <line class="dg-line" x1="436" y1="116" x2="436" y2="124"/>
  <line class="dg-line" x1="480" y1="112" x2="480" y2="128"/>
  <line class="dg-line" x1="524" y1="116" x2="524" y2="124"/>
  <line class="dg-line" x1="568" y1="116" x2="568" y2="124"/>
  <line class="dg-line" x1="612" y1="112" x2="612" y2="128"/>
  <text x="84" y="146" dy="0.35em" text-anchor="middle">−9</text>
  <text x="172" y="146" dy="0.35em" text-anchor="middle">−7</text>
  <text x="216" y="146" dy="0.35em" text-anchor="middle">−6</text>
  <text x="348" y="146" dy="0.35em" text-anchor="middle">−3</text>
  <text x="480" y="146" dy="0.35em" text-anchor="middle">0</text>
  <text x="612" y="146" dy="0.35em" text-anchor="middle">3</text>
  <!-- Three jumps of 3 to the left, from 0 down to -9. -->
  <line class="dg-flow" x1="478" y1="84" x2="352" y2="84" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="414" y="66" dy="0.35em" text-anchor="middle">−3</text>
  <line class="dg-flow" x1="346" y1="84" x2="220" y2="84" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="282" y="66" dy="0.35em" text-anchor="middle">−3</text>
  <line class="dg-flow" x1="214" y1="84" x2="88" y2="84" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="150" y="66" dy="0.35em" text-anchor="middle">−3</text>
  <text class="dg-heading" x="282.0" y="32" dy="0.35em" text-anchor="middle">3 × (−3) = −9</text>
  <!-- The remainder: the 2 steps from -9 up to -7. -->
  <rect class="dg-hot" x="84" y="114" width="88" height="12" rx="3"/>
  <text x="128" y="178" dy="0.35em" text-anchor="middle">r = 2</text>
  <text class="dg-note" x="216" y="178" dy="0.35em" text-anchor="start">−6 is past −7, so stop at −9</text>
</svg>
