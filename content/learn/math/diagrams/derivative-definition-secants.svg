<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>Secant lines of y = x² from the point (1, 1) pivoting toward the tangent</title>
  <desc>The parabola y = x² with the point (1, 1) marked. Three dashed secant lines run from (1, 1) to the points where h = 2, 1, and 0.5, with slopes 4, 3, and 2.5. As h shrinks they swing toward the highlighted tangent line, which touches the parabola at (1, 1) and has slope 2.</desc>
  <line class="dg-line" x1="60.0" y1="344.3" x2="616.0" y2="344.3" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="125.8" y1="400.0" x2="125.8" y2="24.0" marker-end="url(#arrow)"/>
  <text class="dg-note" x="626.0" y="344.3" dy="0.35em" text-anchor="start">x</text>
  <text class="dg-note" x="125.8" y="12.0" dy="0.35em" text-anchor="middle">y</text>
  <!-- The parabola. -->
  <polyline class="dg-line" points="70.0,339.5 77.1,340.6 84.1,341.6 91.2,342.5 98.3,343.2 105.4,343.7 112.4,344.1 119.5,344.3 126.6,344.3 133.7,344.3 140.7,344.0 147.8,343.6 154.9,343.0 162.0,342.3 169.0,341.4 176.1,340.4 183.2,339.2 190.2,337.8 197.3,336.3 204.4,334.7 211.5,332.9 218.5,330.9 225.6,328.8 232.7,326.5 239.8,324.0 246.8,321.4 253.9,318.7 261.0,315.8 268.1,312.7 275.1,309.5 282.2,306.1 289.3,302.5 296.3,298.8 303.4,295.0 310.5,291.0 317.6,286.8 324.6,282.5 331.7,278.0 338.8,273.4 345.9,268.6 352.9,263.6 360.0,258.5 367.1,253.3 374.2,247.8 381.2,242.3 388.3,236.5 395.4,230.6 402.4,224.6 409.5,218.4 416.6,212.0 423.7,205.5 430.7,198.9 437.8,192.0 444.9,185.0 452.0,177.9 459.0,170.6 466.1,163.2 473.2,155.5 480.3,147.8 487.3,139.9 494.4,131.8 501.5,123.5 508.5,115.1 515.6,106.6 522.7,97.9 529.8,89.0 536.8,80.0 543.9,70.8 551.0,61.5 558.1,52.0 565.1,42.4"/>
  <!-- Secants from (1, 1), dashed. -->
  <line class="dg-line dg-dashed" x1="181.6" y1="387.0" x2="565.1" y2="52.2"/>
  <line class="dg-line dg-dashed" x1="146.7" y1="391.5" x2="439.6" y2="199.8"/>
  <line class="dg-line dg-dashed" x1="111.8" y1="397.6" x2="376.8" y2="253.0"/>
  <!-- The tangent y = 2x - 1. -->
  <line class="dg-flow" x1="125.8" y1="374.8" x2="586.1" y2="173.9"/>
  <circle class="dg-box" cx="544.2" cy="70.4" r="4"/>
  <circle class="dg-box" cx="404.7" cy="222.6" r="4"/>
  <circle class="dg-box" cx="335.0" cy="275.9" r="4"/>
  <circle class="dg-hot" cx="265.3" cy="313.9" r="5"/>
  <text x="554.2" y="70.4" dy="0.35em" text-anchor="start">h = 2, slope 4</text>
  <text x="388.7" y="208.6" dy="0.35em" text-anchor="end">h = 1, slope 3</text>
  <text x="349.0" y="285.9" dy="0.35em" text-anchor="start">h = 0.5, slope 2.5</text>
  <text x="582.1" y="195.9" dy="0.35em" text-anchor="end">tangent, slope 2</text>
  <text class="dg-note" x="275.3" y="329.9" dy="0.35em" text-anchor="start">(1, 1)</text>
</svg>
