<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Bisection's nested intervals closing in on the square root of 2</title>
  <desc>Five stacked bars on a scale from 1 to 2. The top bar is the whole interval from 1 to 2. Each bar below is the half of the one above where x² − 2 changes sign: 1 to 1.5, then 1.25 to 1.5, then 1.375 to 1.5, then 1.375 to 1.4375. A dashed vertical line at √2, about 1.414, runs through every bar, and the last bar is highlighted.</desc>
  <rect class="dg-box" x="140.0" y="24.0" width="480.0" height="22.0" rx="4"/>
  <text class="dg-note" x="40.0" y="35.0" dy="0.35em" text-anchor="start">start</text>
  <text class="dg-note" x="134.0" y="35.0" dy="0.35em" text-anchor="end">1</text>
  <text class="dg-note" x="626.0" y="35.0" dy="0.35em" text-anchor="start">2</text>
  <rect class="dg-box" x="140.0" y="70.0" width="240.0" height="22.0" rx="4"/>
  <text class="dg-note" x="40.0" y="81.0" dy="0.35em" text-anchor="start">step 1</text>
  <text class="dg-note" x="134.0" y="81.0" dy="0.35em" text-anchor="end">1</text>
  <text class="dg-note" x="386.0" y="81.0" dy="0.35em" text-anchor="start">1.5</text>
  <rect class="dg-box" x="260.0" y="116.0" width="120.0" height="22.0" rx="4"/>
  <text class="dg-note" x="40.0" y="127.0" dy="0.35em" text-anchor="start">step 2</text>
  <text class="dg-note" x="254.0" y="127.0" dy="0.35em" text-anchor="end">1.25</text>
  <text class="dg-note" x="386.0" y="127.0" dy="0.35em" text-anchor="start">1.5</text>
  <rect class="dg-box" x="320.0" y="162.0" width="60.0" height="22.0" rx="4"/>
  <text class="dg-note" x="40.0" y="173.0" dy="0.35em" text-anchor="start">step 3</text>
  <text class="dg-note" x="314.0" y="173.0" dy="0.35em" text-anchor="end">1.375</text>
  <text class="dg-note" x="386.0" y="173.0" dy="0.35em" text-anchor="start">1.5</text>
  <rect class="dg-hot" x="320.0" y="208.0" width="30.0" height="22.0" rx="4"/>
  <text class="dg-note" x="40.0" y="219.0" dy="0.35em" text-anchor="start">step 4</text>
  <text class="dg-note" x="314.0" y="219.0" dy="0.35em" text-anchor="end">1.375</text>
  <text class="dg-note" x="356.0" y="219.0" dy="0.35em" text-anchor="start">1.4375</text>
  <line class="dg-line dg-dashed" x1="338.8" y1="20.0" x2="338.8" y2="280.0"/>
  <text x="338.8" y="300.0" dy="0.35em" text-anchor="middle">√2 ≈ 1.414</text>
</svg>
