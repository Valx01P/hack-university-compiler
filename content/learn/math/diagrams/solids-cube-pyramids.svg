<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>A cube splits into three equal pyramids that share one corner</title>
  <desc>A cube with edge s. One top corner, P, is joined to every other corner. The cube splits into three pyramids, each with apex P and one of the three faces away from P as its base: the bottom, the back, and the left face. The three are copies of each other, so each holds a third of the cube, s³/3, which is one third of base s² times height s. The bottom one is highlighted.</desc>
  <polygon class="dg-hot" points="220,240 390,240 483.5,180.5 313.5,180.5"/>
  <line class="dg-line dg-dashed" x1="313.5" y1="180.5" x2="483.5" y2="180.5"/>
  <line class="dg-line dg-dashed" x1="313.5" y1="180.5" x2="313.5" y2="10.5"/>
  <line class="dg-line dg-dashed" x1="313.5" y1="180.5" x2="220" y2="240"/>
  <line class="dg-line" x1="220" y1="240" x2="390" y2="240"/>
  <line class="dg-line" x1="390" y1="240" x2="390" y2="70"/>
  <line class="dg-line" x1="390" y1="70" x2="220" y2="70"/>
  <line class="dg-line" x1="220" y1="70" x2="220" y2="240"/>
  <line class="dg-line" x1="390" y1="240" x2="483.5" y2="180.5"/>
  <line class="dg-line" x1="483.5" y1="180.5" x2="483.5" y2="10.5"/>
  <line class="dg-line" x1="483.5" y1="10.5" x2="390" y2="70"/>
  <line class="dg-line" x1="220" y1="70" x2="313.5" y2="10.5"/>
  <line class="dg-line" x1="313.5" y1="10.5" x2="483.5" y2="10.5"/>
  <line class="dg-flow" x1="390" y1="70" x2="220" y2="240"/>
  <line class="dg-flow dg-dashed" x1="390" y1="70" x2="313.5" y2="180.5"/>
  <line class="dg-flow" x1="390" y1="70" x2="483.5" y2="180.5"/>
  <line class="dg-flow" x1="390" y1="70" x2="313.5" y2="10.5"/>
  <circle class="dg-strong" cx="390" cy="70" r="4"/>
  <text class="dg-heading" x="404" y="60" dy="0.35em" text-anchor="middle">P</text>
  <text class="dg-heading" x="305" y="258" dy="0.35em" text-anchor="middle">s</text>
  <text class="dg-heading" x="204" y="155" dy="0.35em" text-anchor="middle">s</text>
  <text class="dg-code" x="560" y="100" dy="0.35em" text-anchor="middle">3 equal pyramids</text>
  <text class="dg-code" x="560" y="130" dy="0.35em" text-anchor="middle">each: s³ / 3</text>
  <text class="dg-code" x="560" y="160" dy="0.35em" text-anchor="middle">= (1/3) × s² × s</text>
</svg>
