<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>A = [[3, 0], [4, 5]] turns the unit circle into an ellipse</title>
  <desc>Left, the unit circle with the orthonormal vectors v1 and v2. Right, drawn at a third of the scale, its image under A: an ellipse. A sends v1 to sigma1 times u1, the long semi-axis of length about 6.71, and v2 to sigma2 times u2, the short semi-axis of length about 2.24. The singular values are the semi-axis lengths.</desc>
