<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>1000 dollars at 6%: compound interest curves up while simple interest is a straight line</title>
  <desc>Balances over 30 years for 1000 dollars at 6% a year. Simple interest adds 60 dollars a year, a straight line ending at 2800. Compound interest multiplies by 1.06 a year, a curve that starts along the line, pulls ahead, and ends near 5743. The gap between them grows every year, because interest earns interest.</desc>
  <line class="dg-line" x1="70" y1="306.4" x2="640" y2="306.4" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="180.6" y1="302.4" x2="180.6" y2="310.4"/>
  <text class="dg-note" x="180.6" y="322.4" text-anchor="middle">5</text>
  <line class="dg-line" x1="265.7" y1="302.4" x2="265.7" y2="310.4"/>
  <text class="dg-note" x="265.7" y="322.4" text-anchor="middle">10</text>
  <line class="dg-line" x1="350.7" y1="302.4" x2="350.7" y2="310.4"/>
  <text class="dg-note" x="350.7" y="322.4" text-anchor="middle">15</text>
  <line class="dg-line" x1="435.8" y1="302.4" x2="435.8" y2="310.4"/>
  <text class="dg-note" x="435.8" y="322.4" text-anchor="middle">20</text>
  <line class="dg-line" x1="520.9" y1="302.4" x2="520.9" y2="310.4"/>
  <text class="dg-note" x="520.9" y="322.4" text-anchor="middle">25</text>
  <line class="dg-line" x1="606" y1="302.4" x2="606" y2="310.4"/>
  <text class="dg-note" x="606" y="322.4" text-anchor="middle">30</text>
  <text class="dg-note" x="638" y="294.4" text-anchor="end">years</text>
  <line class="dg-line" x1="95.5" y1="320" x2="95.5" y2="20" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="91.5" y1="260.9" x2="99.5" y2="260.9"/>
  <text class="dg-note" x="87.5" y="260.9" dy="0.35em" text-anchor="end">1k</text>
  <line class="dg-line" x1="91.5" y1="215.5" x2="99.5" y2="215.5"/>
  <text class="dg-note" x="87.5" y="215.5" dy="0.35em" text-anchor="end">2k</text>
  <line class="dg-line" x1="91.5" y1="170" x2="99.5" y2="170"/>
  <text class="dg-note" x="87.5" y="170" dy="0.35em" text-anchor="end">3k</text>
  <line class="dg-line" x1="91.5" y1="124.5" x2="99.5" y2="124.5"/>
  <text class="dg-note" x="87.5" y="124.5" dy="0.35em" text-anchor="end">4k</text>
  <line class="dg-line" x1="91.5" y1="79.1" x2="99.5" y2="79.1"/>
  <text class="dg-note" x="87.5" y="79.1" dy="0.35em" text-anchor="end">5k</text>
  <line class="dg-line" x1="91.5" y1="33.6" x2="99.5" y2="33.6"/>
  <text class="dg-note" x="87.5" y="33.6" dy="0.35em" text-anchor="end">6k</text>
  <text class="dg-note" x="105.5" y="26" dy="0.35em" text-anchor="start">balance</text>
  <polyline class="dg-line dg-dashed" points="95.5,260.9 606,179.1"/>
  <polyline class="dg-flow" points="95.5,260.9 137.6,253.9 177.2,246.2 215.5,237.8 252.5,228.6 288.2,218.4 322.7,207.4 354.6,196 386.5,183.2 417.1,169.6 446.5,155.2 474.5,139.9 502.6,123.1 529.4,105.5 556.2,86.2 581.7,66.1 606,45.3"/>
  <circle class="dg-hot" cx="606" cy="45.3" r="5"/>
  <circle class="dg-badge" cx="606" cy="179.1" r="4"/>
  <text class="dg-code" x="596" y="41.3" dy="0.35em" text-anchor="end">compound 5743</text>
  <text class="dg-code" x="596" y="165.1" dy="0.35em" text-anchor="end">simple 2800</text>
</svg>
