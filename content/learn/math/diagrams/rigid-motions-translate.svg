<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A translation slides every point by the same amount</title>
  <desc>The triangle with vertices A(1, 2), B(4, 2), and C(1, 6) slides 8 units left and 4 units down to the triangle with vertices (−7, −2), (−4, −2), and (−7, 2). Three parallel arrows of the same length join each vertex to its image, because a translation adds the same (−8, −4) to every point.</desc>
  <polygon class="dg-hot" points="466,148 544,148 466,44"/>
  <polygon class="dg-box" points="258,252 336,252 258,148"/>
  <line class="dg-line" x1="206" y1="200" x2="622" y2="200" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="440" y1="278" x2="440" y2="18" marker-end="url(#arrow)"/>
  <text class="dg-note" x="626" y="214" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="448" y="24" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-line" x1="232" y1="195" x2="232" y2="205"/>
  <line class="dg-line" x1="258" y1="195" x2="258" y2="205"/>
  <line class="dg-line" x1="284" y1="195" x2="284" y2="205"/>
  <line class="dg-line" x1="310" y1="195" x2="310" y2="205"/>
  <line class="dg-line" x1="336" y1="195" x2="336" y2="205"/>
  <line class="dg-line" x1="362" y1="195" x2="362" y2="205"/>
  <line class="dg-line" x1="388" y1="195" x2="388" y2="205"/>
  <line class="dg-line" x1="414" y1="195" x2="414" y2="205"/>
  <line class="dg-line" x1="466" y1="195" x2="466" y2="205"/>
  <line class="dg-line" x1="492" y1="195" x2="492" y2="205"/>
  <line class="dg-line" x1="518" y1="195" x2="518" y2="205"/>
  <line class="dg-line" x1="544" y1="195" x2="544" y2="205"/>
  <line class="dg-line" x1="570" y1="195" x2="570" y2="205"/>
  <line class="dg-line" x1="596" y1="195" x2="596" y2="205"/>
  <line class="dg-line" x1="435" y1="252" x2="445" y2="252"/>
  <line class="dg-line" x1="435" y1="226" x2="445" y2="226"/>
  <line class="dg-line" x1="435" y1="174" x2="445" y2="174"/>
  <line class="dg-line" x1="435" y1="148" x2="445" y2="148"/>
  <line class="dg-line" x1="435" y1="122" x2="445" y2="122"/>
  <line class="dg-line" x1="435" y1="96" x2="445" y2="96"/>
  <line class="dg-line" x1="435" y1="70" x2="445" y2="70"/>
  <line class="dg-line" x1="435" y1="44" x2="445" y2="44"/>
  <line class="dg-flow" x1="466" y1="148" x2="263.4" y2="249.3" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="544" y1="148" x2="341.4" y2="249.3" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="466" y1="44" x2="263.4" y2="145.3" marker-end="url(#arrow-flow)"/>
  <text x="473.8" y="36.2" dy="0.35em" text-anchor="start">C(1, 6)</text>
  <text x="549.2" y="137.6" dy="0.35em" text-anchor="start">B(4, 2)</text>
  <text x="471.2" y="162.3" dy="0.35em" text-anchor="start">A(1, 2)</text>
  <text x="250.2" y="140.2" dy="0.35em" text-anchor="end">C′(−7, 2)</text>
  <text x="341.2" y="265" dy="0.35em" text-anchor="start">B′(−4, −2)</text>
  <text x="250.2" y="262.4" dy="0.35em" text-anchor="end">A′(−7, −2)</text>
  <text class="dg-code" x="160" y="40" dy="0.35em" text-anchor="middle">(x, y) → (x − 8, y − 4)</text>
</svg>
