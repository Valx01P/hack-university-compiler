  <polyline class="dg-flow" points="521.9,20 525,89.3 526.9,113.5 529.1,133.7 531.8,149.8 535.1,163.5 539.3,174.3 544.1,182.3 549.8,188.2 556.5,192.6 565.1,196.1 575.6,198.6 589.1,200.5 606.4,201.8 660,203.5"/>
