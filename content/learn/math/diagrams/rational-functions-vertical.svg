<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Vertical asymptotes: opposite sides for (x + 1)/(x − 2), the same side for 1/(x − 2)²</title>
  <desc>Two graphs, each with a dashed vertical asymptote at x = 2. On the left, y = (x + 1)/(x − 2) plunges down just left of 2 and shoots up just right of 2. On the right, y = 1/(x − 2)² shoots up on both sides of 2, since a square is never negative.</desc>
  <line class="dg-line" x1="20" y1="153.3" x2="320" y2="153.3" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="183.6" y1="149.3" x2="183.6" y2="157.3"/>
  <text class="dg-note" x="183.6" y="169.3" text-anchor="middle">2</text>
  <text class="dg-note" x="318" y="141.3" text-anchor="end">x</text>
  <line class="dg-line" x1="129.1" y1="260" x2="129.1" y2="20" marker-end="url(#arrow)"/>
  <text class="dg-note" x="139.1" y="26" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-line dg-dashed" x1="183.6" y1="20" x2="183.6" y2="260"/>
  <polyline class="dg-flow" points="20,146.7 69.5,149.6 88.3,151.4 104.3,153.7 117.4,156.5 128.4,159.8 137.4,163.6 145.2,168.4 151.3,173.8 156.6,180.4 161.1,188.5 164.8,198 168.1,210.2 170.5,223.3 172.6,238.7 174.5,260"/>
  <polyline class="dg-flow" points="192.7,20 196.3,53.5 198.6,67.3 201.4,78.5 204.8,88.4 208.5,96.2 213.3,103.2 218.8,108.9 225.2,113.8 233.1,117.9 242.3,121.4 252.8,124.2 265.8,126.7 280.8,128.8 320,132"/>
  <text class="dg-code" x="170" y="290" text-anchor="middle">(x + 1)/(x − 2)</text>
  <line class="dg-line" x1="360" y1="204.6" x2="660" y2="204.6" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="510" y1="200.6" x2="510" y2="208.6"/>
  <text class="dg-note" x="510" y="220.6" text-anchor="middle">2</text>
  <text class="dg-note" x="658" y="192.6" text-anchor="end">x</text>
  <line class="dg-line" x1="435" y1="260" x2="435" y2="20" marker-end="url(#arrow)"/>
  <text class="dg-note" x="445" y="26" dy="0.35em" text-anchor="start">y</text>
