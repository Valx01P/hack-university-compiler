<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>The terms of 1 + (−1)ⁿ/n settle inside a band around 1</title>
  <desc>Dots show the terms a_n = 1 + (−1)ⁿ/n for n from 1 to 24, alternating above and below the dashed line at 1 and closing in on it. A shaded band runs from 0.9 to 1.1, which is ε = 0.1 on each side. Past the cutoff N = 10, marked by a vertical line, every term lies inside the band.</desc>
