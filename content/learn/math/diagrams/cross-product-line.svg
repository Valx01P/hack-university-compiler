<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200">
  <title>Points on the line P + t d for t = −1, 0, 1, and 2</title>
  <desc>A straight line runs up and to the right. Four points are marked on it, evenly spaced: t = −1 one step back from P, t = 0 at P, t = 1 at P + d, and t = 2 two steps ahead. The direction d is the arrow from P to P + d.</desc>
  <line class="dg-line" x1="16.8" y1="180.8" x2="621.6" y2="29.6"/>
  <circle class="dg-strong" cx="60" cy="170" r="4"/>
  <text x="60" y="192" dy="0.35em" text-anchor="middle">t = −1</text>
  <circle class="dg-strong" cx="204" cy="134" r="4"/>
  <text x="204" y="156" dy="0.35em" text-anchor="middle">t = 0: P</text>
  <circle class="dg-strong" cx="348" cy="98" r="4"/>
  <text x="348" y="120" dy="0.35em" text-anchor="middle">t = 1: P + d</text>
  <circle class="dg-strong" cx="492" cy="62" r="4"/>
  <text x="492" y="84" dy="0.35em" text-anchor="middle">t = 2</text>
  <line class="dg-flow" x1="204" y1="134" x2="343.1" y2="99.2" marker-end="url(#arrow-flow)"/>
  <text x="276" y="100" dy="0.35em" text-anchor="middle">d</text>
</svg>
