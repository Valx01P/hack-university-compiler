<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Two lines can cross once, run parallel, or be the same line</title>
  <desc>Three small graphs. In the first, the lines x + y = 5 and x − y = 1 cross at the highlighted point (3, 2): one solution. In the second, x + 2y = 4 and x + 2y = 8 are parallel and never meet: no solution. In the third, x + 2y = 4 and 2x + 4y = 8 lie on top of each other: every point of the line is a solution.</desc>
  <!-- Panel 1: x + y = 5 and x − y = 1 cross at (3, 2). -->
  <line class="dg-line" x1="34" y1="220" x2="226" y2="220" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="60" y1="234" x2="60" y2="42" marker-end="url(#arrow)"/>
  <text class="dg-note" x="226" y="236" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="48" y="48" dy="0.35em" text-anchor="middle">y</text>
  <line class="dg-flow" x1="47.0" y1="77.0" x2="203.0" y2="233.0"/>
  <line class="dg-line" x1="73.0" y1="233.0" x2="216" y2="90"/>
  <circle class="dg-hot" cx="138" cy="168" r="6"/>
  <text class="dg-heading" x="130" y="260" dy="0.35em" text-anchor="middle">one solution</text>
  <text class="dg-code" x="130" y="290" dy="0.35em" text-anchor="middle">x + y = 5</text>
  <text class="dg-code" x="130" y="310" dy="0.35em" text-anchor="middle">x − y = 1</text>
  <!-- Panel 2: x + 2y = 4 and x + 2y = 8 are parallel. -->
  <line class="dg-line" x1="254" y1="220" x2="446" y2="220" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="280" y1="234" x2="280" y2="42" marker-end="url(#arrow)"/>
  <text class="dg-note" x="446" y="236" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="268" y="48" dy="0.35em" text-anchor="middle">y</text>
  <line class="dg-flow" x1="267.0" y1="161.5" x2="410" y2="233.0"/>
  <line class="dg-line" x1="267.0" y1="109.5" x2="436" y2="194"/>
  <text class="dg-heading" x="350" y="260" dy="0.35em" text-anchor="middle">no solution</text>
  <text class="dg-code" x="350" y="290" dy="0.35em" text-anchor="middle">x + 2y = 4</text>
  <text class="dg-code" x="350" y="310" dy="0.35em" text-anchor="middle">x + 2y = 8</text>
  <!-- Panel 3: x + 2y = 4 and 2x + 4y = 8 are one line. -->
  <line class="dg-line" x1="474" y1="220" x2="666" y2="220" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="500" y1="234" x2="500" y2="42" marker-end="url(#arrow)"/>
  <text class="dg-note" x="666" y="236" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="488" y="48" dy="0.35em" text-anchor="middle">y</text>
  <line class="dg-flow" x1="487.0" y1="161.5" x2="630" y2="233.0"/>
  <line class="dg-line dg-dashed" x1="487.0" y1="161.5" x2="630" y2="233.0"/>
  <text class="dg-heading" x="570" y="260" dy="0.35em" text-anchor="middle">infinitely many</text>
  <text class="dg-code" x="570" y="290" dy="0.35em" text-anchor="middle">x + 2y = 4</text>
  <text class="dg-code" x="570" y="310" dy="0.35em" text-anchor="middle">2x + 4y = 8</text>
</svg>
