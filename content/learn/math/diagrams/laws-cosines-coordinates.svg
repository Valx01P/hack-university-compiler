<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>The triangle placed on coordinates for the law of cosines</title>
  <desc>Corner C sits at the origin and side a runs along the x-axis to B = (a, 0). Corner A is b units from C at angle C, so A = (b cos C, b sin C). The highlighted side c joins A to B, and the distance formula gives c² = a² + b² − 2ab cos C.</desc>
  <!-- The x-axis -->
  <line class="dg-line" x1="60" y1="230" x2="640" y2="230" marker-end="url(#arrow)"/>
  <!-- The triangle -->
  <polygon class="dg-box" points="120,230 540,230 294,36.8"/>
  <line class="dg-flow" x1="294" y1="36.8" x2="540" y2="230"/>
  <path class="dg-line" d="M164 230 A44 44 0 0 0 149.4 197.3"/>
  <text x="172" y="212" dy="0.35em">C</text>
  <circle class="dg-hot" cx="120" cy="230" r="5"/>
  <circle class="dg-hot" cx="540" cy="230" r="5"/>
  <circle class="dg-hot" cx="294" cy="36.8" r="5"/>
  <text class="dg-code" x="120" y="254" dy="0.35em" text-anchor="middle">C = (0, 0)</text>
  <text class="dg-code" x="540" y="254" dy="0.35em" text-anchor="middle">B = (a, 0)</text>
  <text class="dg-code" x="294" y="16.8" dy="0.35em" text-anchor="middle">A = (b cos C, b sin C)</text>
  <text x="193" y="127.4" dy="0.35em" text-anchor="end">b</text>
  <text x="330.0" y="216" dy="0.35em" text-anchor="middle">a</text>
  <text x="431" y="127.4" dy="0.35em">c</text>
</svg>
