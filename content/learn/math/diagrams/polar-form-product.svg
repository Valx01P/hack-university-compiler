<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Multiplying complex numbers multiplies lengths and adds angles</title>
  <desc>Three arrows from the origin of the complex plane. z has length 1.5 at an angle of 20°, w has length 2 at 50°, and the highlighted product zw has length 3 at 70°. The lengths multiply, 1.5 × 2 = 3, and the angles add, 20° + 50° = 70°.</desc>
  <!-- Axes -->
  <line class="dg-line" x1="140" y1="260" x2="520" y2="260" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="200" y1="290" x2="200" y2="20" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="200" y1="260" x2="290.2" y2="227.2" marker-end="url(#arrow)"/>
  <text class="dg-heading" x="308.7" y="218.1" dy="0.35em">z</text>
  <text class="dg-note" x="308.7" y="236.1" dy="0.35em">1.5 at 20°</text>
  <line class="dg-line" x1="200" y1="260" x2="284.2" y2="159.6" marker-end="url(#arrow)"/>
  <text class="dg-heading" x="300" y="146.8" dy="0.35em">w</text>
  <text class="dg-note" x="300" y="164.8" dy="0.35em">2 at 50°</text>
  <line class="dg-flow" x1="200" y1="260" x2="268.7" y2="71.1" marker-end="url(#arrow-flow)"/>
  <text class="dg-heading" x="281.8" y="56.7" dy="0.35em">zw</text>
  <text class="dg-note" x="281.8" y="74.7" dy="0.35em">3 at 70°</text>
  <path class="dg-flow" d="M240 260 A40 40 0 0 0 213.7 222.4"/>
  <text class="dg-note" x="600" y="120" dy="0.35em" text-anchor="middle">lengths multiply: 1.5 × 2 = 3</text>
  <text class="dg-note" x="600" y="140" dy="0.35em" text-anchor="middle">angles add: 20° + 50° = 70°</text>
</svg>
