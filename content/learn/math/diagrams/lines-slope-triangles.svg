<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>Two slope triangles on one line give the same slope, 2/3</title>
  <desc>The line y = (2/3)x + 1 passes through (−3, −1), (0, 1), (3, 3), and (6, 5). A small slope triangle from (0, 1) to (3, 3) has run 3 and rise 2. A large one from (−3, −1) to (6, 5) has run 9 and rise 6. The triangles are similar, so rise over run is 2/3 for both.</desc>
