<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>A square pyramid and a cone sliced at the same height</title>
  <desc>A square pyramid and a cone side by side, both of height h and both with base area B. Each is cut by a slice a distance x below its apex, and the slices are highlighted. Each slice is the base shrunk by the factor x over h, so both have area (x/h) squared times B. Equal slices at every height give equal volumes.</desc>
  <polygon class="dg-box" points="80,312.5 230,312.5 280,287.5 130,287.5"/>
  <line class="dg-line" x1="180" y1="60" x2="80" y2="312.5"/>
  <line class="dg-line" x1="180" y1="60" x2="230" y2="312.5"/>
  <line class="dg-line" x1="180" y1="60" x2="280" y2="287.5"/>
  <line class="dg-line" x1="180" y1="60" x2="130" y2="287.5"/>
  <polygon class="dg-hot" points="125,198.9 207.5,198.9 235,185.1 152.5,185.1"/>
  <text x="180" y="348" text-anchor="middle">square pyramid, base area B</text>
  <ellipse class="dg-box" cx="480" cy="300" rx="95" ry="28"/>
  <line class="dg-line" x1="480" y1="60" x2="385" y2="300"/>
  <line class="dg-line" x1="480" y1="60" x2="575" y2="300"/>
  <ellipse class="dg-hot" cx="480" cy="192" rx="52.3" ry="15.4"/>
  <text x="480" y="348" text-anchor="middle">cone, base area B</text>
  <line class="dg-line" x1="330" y1="60" x2="330" y2="300"/>
  <line class="dg-line" x1="322" y1="60" x2="338" y2="60"/>
  <line class="dg-line" x1="322" y1="300" x2="338" y2="300"/>
  <text x="342" y="220">h</text>
  <line class="dg-flow" x1="305" y1="60" x2="305" y2="192"/>
  <text x="296" y="126" text-anchor="end">x</text>
  <line class="dg-line" x1="298" y1="192" x2="312" y2="192"/>
  <text x="330" y="30" text-anchor="middle">both slices: area (x/h)² B</text>
</svg>
