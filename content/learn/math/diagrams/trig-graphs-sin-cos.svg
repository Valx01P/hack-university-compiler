<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>The graphs of sine and cosine from −2π to 2π</title>
  <desc>The graphs of y = sin x and y = cos x for x from −2π to 2π. Both are waves between −1 and 1 that repeat every 2π. Sine passes through the origin, and cosine starts at its peak of 1 at x = 0. Cosine is the sine wave shifted π/2 to the left.</desc>
