<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>An isosceles triangle: equal legs, equal base angles</title>
  <desc>Triangle ABC with AB = AC, the two legs, marked with matching ticks. The base BC is at the bottom. The base angles at B and C are highlighted and equal, 70° each, and the vertex angle at A is 40°. The dashed line from A to the midpoint M of the base meets it at a right angle.</desc>
  <path class="dg-hot" d="M267.2 230 L301.2 230 A34 34 0 0 0 278.8 198.1 Z"/>
  <path class="dg-hot" d="M412.8 230 L401.2 198.1 A34 34 0 0 0 378.8 230 Z"/>
  <polygon class="dg-box" points="340,30 267.2,230 412.8,230"/>
  <path class="dg-line" d="M301.2 230 A34 34 0 0 0 278.8 198.1"/>
  <path class="dg-line" d="M401.2 198.1 A34 34 0 0 0 378.8 230"/>
  <line class="dg-line" x1="310.2" y1="132.4" x2="297" y2="127.6"/>
  <line class="dg-line" x1="383" y1="127.6" x2="369.8" y2="132.4"/>
  <line class="dg-line dg-dashed" x1="340" y1="30" x2="340" y2="230"/>
  <polyline class="dg-line" points="352,230 352,218 340,218"/>
  <path class="dg-line" d="M326.3 67.6 A40 40 0 0 0 353.7 67.6"/>
  <text x="340" y="88" dy="0.35em" text-anchor="middle">40°</text>
  <text x="315.7" y="202" dy="0.35em" text-anchor="middle">70°</text>
  <text x="364.3" y="202" dy="0.35em" text-anchor="middle">70°</text>
  <text class="dg-heading" x="340" y="16" dy="0.35em" text-anchor="middle">A</text>
  <text class="dg-heading" x="251.2" y="236" dy="0.35em" text-anchor="middle">B</text>
  <text class="dg-heading" x="428.8" y="236" dy="0.35em" text-anchor="middle">C</text>
  <text class="dg-heading" x="340" y="248" dy="0.35em" text-anchor="middle">M</text>
  <text class="dg-code" x="560" y="100" dy="0.35em" text-anchor="middle">AB = AC</text>
  <text class="dg-code" x="560" y="130" dy="0.35em" text-anchor="middle">∠B = ∠C = (180° − 40°) / 2</text>
</svg>
