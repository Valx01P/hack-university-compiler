<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Two limits that don't exist at 0: 1/x² and sin(1/x)</title>
  <desc>Left: the graph of 1/x² rises on both sides of 0 without bound, so its heights never close in on one number. Right: the graph of sin(1/x) swings between −1 and 1 ever faster as x nears 0 from either side, so its heights never settle on one number either. Neither function has a limit at 0.</desc>
