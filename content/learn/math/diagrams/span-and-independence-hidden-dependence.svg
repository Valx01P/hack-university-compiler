<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>Three vectors, no two parallel, that are still dependent</title>
  <desc>The vectors (1, 0) and (0, 1) lie along the axes, and (1, 1) points between them. No two of the three are parallel, but (1, 1) is the sum of the other two, the diagonal of the square they make, so the three are dependent.</desc>
  <circle class="dg-strong" cx="260" cy="210" r="4"/>
  <line class="dg-line dg-dashed" x1="410" y1="210" x2="410" y2="60"/>
  <line class="dg-line dg-dashed" x1="260" y1="60" x2="410" y2="60"/>
  <line class="dg-line" x1="260" y1="210" x2="405.5" y2="210" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="260" y1="210" x2="260" y2="64.5" marker-end="url(#arrow)"/>
  <line class="dg-flow" x1="260" y1="210" x2="407" y2="63" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="410" y="225" dy="0.35em" text-anchor="middle">(1, 0)</text>
  <text class="dg-note" x="254" y="60" dy="0.35em" text-anchor="end">(0, 1)</text>
  <text class="dg-note" x="416" y="54" dy="0.35em" text-anchor="start">(1, 1) = (1, 0) + (0, 1)</text>
</svg>
