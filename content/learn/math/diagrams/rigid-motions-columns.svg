<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>The images of (1, 0) and (0, 1) under a quarter turn</title>
  <desc>Left: the unit square with the arrows to (1, 0) and (0, 1). Right: after the quarter turn (x, y) → (−y, x), the square has turned onto the second quadrant, (1, 0) has gone to (0, 1), and (0, 1) has gone to (−1, 0). Those two images are the columns of the table for the turn.</desc>
  <polygon class="dg-box" points="150,170 240,170 240,80 150,80"/>
  <line class="dg-line" x1="15" y1="170" x2="294" y2="170" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="150" y1="251" x2="150" y2="35" marker-end="url(#arrow)"/>
  <text class="dg-note" x="298" y="184" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="158" y="41" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-flow" x1="150" y1="170" x2="235" y2="170" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="150" y1="170" x2="150" y2="85" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="240" y="192.5" dy="0.35em" text-anchor="middle">(1, 0)</text>
  <text class="dg-code" x="141" y="80" dy="0.35em" text-anchor="end">(0, 1)</text>
  <text class="dg-heading" x="150" y="280" dy="0.35em" text-anchor="middle">before</text>
  <polygon class="dg-box" points="500,170 500,80 410,80 410,170"/>
  <line class="dg-line" x1="365" y1="170" x2="644" y2="170" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="500" y1="251" x2="500" y2="35" marker-end="url(#arrow)"/>
  <text class="dg-note" x="648" y="184" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="508" y="41" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-flow" x1="500" y1="170" x2="500" y2="85" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="500" y1="170" x2="415" y2="170" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="509" y="69.2" dy="0.35em" text-anchor="start">(1, 0) goes to (0, 1)</text>
  <text class="dg-code" x="410" y="192.5" dy="0.35em" text-anchor="middle">(0, 1) goes to (−1, 0)</text>
  <text class="dg-heading" x="500" y="280" dy="0.35em" text-anchor="middle">after a quarter turn</text>
</svg>
