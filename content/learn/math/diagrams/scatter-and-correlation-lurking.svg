<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>Shoe size and reading score for children of three ages</title>
  <desc>Twelve children's shoe sizes against their reading scores. Overall the points climb steeply, with r about 0.91. But they form three groups, ages 6, 8, and 10, and inside each group the points show no trend at all. Age, the lurking variable, raises both shoe size and reading score.</desc>
  <line class="dg-line" x1="80" y1="310" x2="640" y2="310"/>
  <line class="dg-line" x1="80" y1="305" x2="80" y2="315"/>
  <text class="dg-note" x="80" y="326" dy="0.35em" text-anchor="middle">9</text>
  <line class="dg-line" x1="150" y1="305" x2="150" y2="315"/>
  <text class="dg-note" x="150" y="326" dy="0.35em" text-anchor="middle">10</text>
  <line class="dg-line" x1="220" y1="305" x2="220" y2="315"/>
  <text class="dg-note" x="220" y="326" dy="0.35em" text-anchor="middle">11</text>
  <line class="dg-line" x1="290" y1="305" x2="290" y2="315"/>
  <text class="dg-note" x="290" y="326" dy="0.35em" text-anchor="middle">12</text>
  <line class="dg-line" x1="360" y1="305" x2="360" y2="315"/>
  <text class="dg-note" x="360" y="326" dy="0.35em" text-anchor="middle">13</text>
  <line class="dg-line" x1="430" y1="305" x2="430" y2="315"/>
  <text class="dg-note" x="430" y="326" dy="0.35em" text-anchor="middle">14</text>
  <line class="dg-line" x1="500" y1="305" x2="500" y2="315"/>
  <text class="dg-note" x="500" y="326" dy="0.35em" text-anchor="middle">15</text>
  <line class="dg-line" x1="570" y1="305" x2="570" y2="315"/>
  <text class="dg-note" x="570" y="326" dy="0.35em" text-anchor="middle">16</text>
  <line class="dg-line" x1="640" y1="305" x2="640" y2="315"/>
  <text class="dg-note" x="640" y="326" dy="0.35em" text-anchor="middle">17</text>
  <line class="dg-line" x1="80" y1="310" x2="80" y2="60"/>
  <line class="dg-line" x1="75" y1="310" x2="85" y2="310"/>
  <text class="dg-note" x="70" y="310" dy="0.35em" text-anchor="end">10</text>
  <line class="dg-line" x1="75" y1="260" x2="85" y2="260"/>
  <text class="dg-note" x="70" y="260" dy="0.35em" text-anchor="end">20</text>
  <line class="dg-line" x1="75" y1="210" x2="85" y2="210"/>
  <text class="dg-note" x="70" y="210" dy="0.35em" text-anchor="end">30</text>
  <line class="dg-line" x1="75" y1="160" x2="85" y2="160"/>
  <text class="dg-note" x="70" y="160" dy="0.35em" text-anchor="end">40</text>
  <line class="dg-line" x1="75" y1="110" x2="85" y2="110"/>
  <text class="dg-note" x="70" y="110" dy="0.35em" text-anchor="end">50</text>
  <line class="dg-line" x1="75" y1="60" x2="85" y2="60"/>
  <text class="dg-note" x="70" y="60" dy="0.35em" text-anchor="end">60</text>
  <text class="dg-note" x="360" y="344" dy="0.35em" text-anchor="middle">shoe size</text>
  <text class="dg-note" x="90" y="46" dy="0.35em" text-anchor="start">reading score</text>
  <line class="dg-line dg-dashed" x1="122" y1="292.3" x2="612" y2="71.3"/>
  <rect class="dg-frame" x="130" y="234" width="180" height="52" rx="12"/>
  <text class="dg-note" x="220" y="222" dy="0.35em" text-anchor="middle">age 6</text>
  <circle class="dg-hot" cx="150" cy="260" r="6"/>
  <circle class="dg-hot" cx="220" cy="270" r="6"/>
  <circle class="dg-hot" cx="220" cy="250" r="6"/>
  <circle class="dg-hot" cx="290" cy="260" r="6"/>
  <rect class="dg-frame" x="270" y="159" width="180" height="52" rx="12"/>
  <text class="dg-note" x="360" y="147" dy="0.35em" text-anchor="middle">age 8</text>
  <circle class="dg-hot" cx="290" cy="185" r="6"/>
  <circle class="dg-hot" cx="360" cy="195" r="6"/>
  <circle class="dg-hot" cx="360" cy="175" r="6"/>
  <circle class="dg-hot" cx="430" cy="185" r="6"/>
  <rect class="dg-frame" x="410" y="84" width="180" height="52" rx="12"/>
  <text class="dg-note" x="500" y="72" dy="0.35em" text-anchor="middle">age 10</text>
  <circle class="dg-hot" cx="430" cy="110" r="6"/>
  <circle class="dg-hot" cx="500" cy="120" r="6"/>
  <circle class="dg-hot" cx="500" cy="100" r="6"/>
  <circle class="dg-hot" cx="570" cy="110" r="6"/>
</svg>
