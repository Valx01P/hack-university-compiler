<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>2 to the x, e to the x, and 3 to the x near x = 0</title>
  <desc>Graphs of 2 to the x, e to the x, and 3 to the x for x from about −2 to 2. All three pass through the point (0, 1). A dashed line, y = x + 1, is tangent to e to the x at that point, with slope 1. The curve 2 to the x crosses it less steeply, with slope about 0.69, and 3 to the x more steeply, with slope about 1.10.</desc>
