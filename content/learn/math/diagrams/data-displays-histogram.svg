<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A histogram of 20 test scores in bins of 10 points</title>
  <desc>Five touching bars over the bins 50 to 59, 60 to 69, 70 to 79, 80 to 89, and 90 to 99. Their heights, the counts, are 2, 4, 8, 4, and 2, so the bar for 70 to 79 is tallest and the two sides mirror each other. A count axis on the left runs from 0 to 8.</desc>
  <polygon class="dg-box" points="120,240 120,192 216,192 216,144 312,144 312,48 408,48 408,144 504,144 504,192 600,192 600,240"/>
  <line class="dg-line" x1="216" y1="240" x2="216" y2="192"/>
  <line class="dg-line" x1="312" y1="240" x2="312" y2="144"/>
  <line class="dg-line" x1="408" y1="240" x2="408" y2="144"/>
  <line class="dg-line" x1="504" y1="240" x2="504" y2="192"/>
  <line class="dg-line" x1="100" y1="240" x2="100" y2="30"/>
  <line class="dg-line" x1="95" y1="240" x2="105" y2="240"/>
  <text class="dg-note" x="90" y="240" dy="0.35em" text-anchor="end">0</text>
  <line class="dg-line" x1="95" y1="192" x2="105" y2="192"/>
  <text class="dg-note" x="90" y="192" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="95" y1="144" x2="105" y2="144"/>
  <text class="dg-note" x="90" y="144" dy="0.35em" text-anchor="end">4</text>
  <line class="dg-line" x1="95" y1="96" x2="105" y2="96"/>
  <text class="dg-note" x="90" y="96" dy="0.35em" text-anchor="end">6</text>
  <line class="dg-line" x1="95" y1="48" x2="105" y2="48"/>
  <text class="dg-note" x="90" y="48" dy="0.35em" text-anchor="end">8</text>
  <text class="dg-note" x="40" y="130" dy="0.35em" text-anchor="middle">count</text>
  <line class="dg-line" x1="120" y1="240" x2="120" y2="246"/>
  <text class="dg-note" x="120" y="258" dy="0.35em" text-anchor="middle">50</text>
  <line class="dg-line" x1="216" y1="240" x2="216" y2="246"/>
  <text class="dg-note" x="216" y="258" dy="0.35em" text-anchor="middle">60</text>
  <line class="dg-line" x1="312" y1="240" x2="312" y2="246"/>
  <text class="dg-note" x="312" y="258" dy="0.35em" text-anchor="middle">70</text>
  <line class="dg-line" x1="408" y1="240" x2="408" y2="246"/>
  <text class="dg-note" x="408" y="258" dy="0.35em" text-anchor="middle">80</text>
  <line class="dg-line" x1="504" y1="240" x2="504" y2="246"/>
  <text class="dg-note" x="504" y="258" dy="0.35em" text-anchor="middle">90</text>
  <line class="dg-line" x1="600" y1="240" x2="600" y2="246"/>
  <text class="dg-note" x="600" y="258" dy="0.35em" text-anchor="middle">100</text>
  <text class="dg-note" x="360" y="282" dy="0.35em" text-anchor="middle">test score</text>
  <text class="dg-code" x="168" y="178" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="264" y="130" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="360" y="34" dy="0.35em" text-anchor="middle">8</text>
  <text class="dg-code" x="456" y="130" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="552" y="178" dy="0.35em" text-anchor="middle">2</text>
</svg>
