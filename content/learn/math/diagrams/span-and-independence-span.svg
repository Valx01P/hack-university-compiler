<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The span of two vectors: a whole plane, or only a line</title>
  <desc>Left, the vectors (2, 1) and (1, 2) point different ways. Their combinations fill the plane, drawn as a slanted grid, and the target (4, 5) is reached by 1 of the first and 2 of the second. Right, (1, 2) and (2, 4) lie on one line, so every combination stays on that line, and the point (1, 0) beside it is out of reach.</desc>
  <line class="dg-line" x1="40" y1="270" x2="260" y2="270" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="60" y1="290" x2="60" y2="30" marker-end="url(#arrow)"/>
  <text class="dg-note" x="258" y="284" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="72" y="34" dy="0.35em" text-anchor="middle">y</text>
  <line class="dg-line dg-dashed" x1="60" y1="270" x2="135" y2="120"/>
  <line class="dg-line dg-dashed" x1="110" y1="245" x2="185" y2="95"/>
  <line class="dg-line dg-dashed" x1="160" y1="220" x2="235" y2="70"/>
  <line class="dg-line dg-dashed" x1="60" y1="270" x2="160" y2="220"/>
  <line class="dg-line dg-dashed" x1="85" y1="220" x2="185" y2="170"/>
  <line class="dg-line dg-dashed" x1="110" y1="170" x2="210" y2="120"/>
  <line class="dg-line dg-dashed" x1="135" y1="120" x2="235" y2="70"/>
  <line class="dg-flow" x1="60" y1="270" x2="106.2" y2="246.8" marker-end="url(#arrow-flow)"/>
  <line class="dg-line" x1="60" y1="270" x2="83.2" y2="223.8" marker-end="url(#arrow)"/>
  <text class="dg-note" x="112.5" y="256.2" dy="0.35em" text-anchor="start">v₁ = (2, 1)</text>
  <text class="dg-note" x="55" y="210" dy="0.35em" text-anchor="end">v₂ = (1, 2)</text>
  <line class="dg-flow" x1="110" y1="245" x2="135" y2="195"/>
  <line class="dg-flow" x1="135" y1="195" x2="157.5" y2="150" marker-end="url(#arrow-flow)"/>
  <circle class="dg-hot" cx="160" cy="145" r="5"/>
  <text class="dg-note" x="207.5" y="155" dy="0.35em" text-anchor="start">w = v₁ + 2v₂</text>
  <text class="dg-note" x="207.5" y="171" dy="0.35em" text-anchor="start">= (4, 5)</text>
  <text x="150" y="300" dy="0.35em" text-anchor="middle">two directions: the span is the plane</text>
  <line class="dg-line" x1="392" y1="220" x2="639" y2="220" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="470" y1="285" x2="470" y2="22.4" marker-end="url(#arrow)"/>
  <text class="dg-note" x="637" y="234" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="482" y="26.4" dy="0.35em" text-anchor="middle">y</text>
  <line class="dg-flow" x1="438.8" y1="282.4" x2="542.8" y2="74.4"/>
  <circle class="dg-strong" cx="496" cy="168" r="4"/>
  <circle class="dg-strong" cx="522" cy="116" r="4"/>
  <text class="dg-note" x="503.8" y="175.8" dy="0.35em" text-anchor="start">(1, 2)</text>
  <text class="dg-note" x="529.8" y="123.8" dy="0.35em" text-anchor="start">(2, 4)</text>
  <circle class="dg-off" cx="496" cy="220" r="5"/>
  <text class="dg-note" x="506.4" y="235.6" dy="0.35em" text-anchor="start">(1, 0) is not in it</text>
  <text x="530" y="300" dy="0.35em" text-anchor="middle">one direction: the span is a line</text>
</svg>
