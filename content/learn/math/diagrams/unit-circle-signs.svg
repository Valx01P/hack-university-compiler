<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>The signs of cosine and sine in each quadrant</title>
  <desc>The unit circle split into four quadrants, with sample angles of 40°, 120°, 240°, and 300°. In quadrant I both coordinates are positive, so cosine and sine are positive. In quadrant II x is negative and y positive, so only sine is positive. In quadrant III both are negative, so only tangent, their ratio, is positive. In quadrant IV x is positive and y negative, so only cosine is positive.</desc>
  <circle class="dg-off" cx="340" cy="190" r="130"/>
  <line class="dg-line" x1="145" y1="190" x2="535" y2="190" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="365.5" x2="340" y2="14.5" marker-end="url(#arrow)"/>
  <text class="dg-note" x="539" y="204" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="348" y="20.5" dy="0.35em" text-anchor="start">y</text>
  <text class="dg-heading" x="398.5" y="121.5" dy="0.35em" text-anchor="middle">I</text>
  <text class="dg-code" x="398.5" y="141.5" dy="0.35em" text-anchor="middle">cos +, sin +</text>
  <text class="dg-note" x="585" y="70" dy="0.35em" text-anchor="middle">all positive</text>
  <text class="dg-heading" x="281.5" y="121.5" dy="0.35em" text-anchor="middle">II</text>
  <text class="dg-code" x="281.5" y="141.5" dy="0.35em" text-anchor="middle">cos −, sin +</text>
  <text class="dg-note" x="95" y="70" dy="0.35em" text-anchor="middle">sin positive</text>
  <text class="dg-heading" x="281.5" y="238.5" dy="0.35em" text-anchor="middle">III</text>
  <text class="dg-code" x="281.5" y="258.5" dy="0.35em" text-anchor="middle">cos −, sin −</text>
  <text class="dg-note" x="95" y="310" dy="0.35em" text-anchor="middle">tan positive</text>
  <text class="dg-heading" x="398.5" y="238.5" dy="0.35em" text-anchor="middle">IV</text>
  <text class="dg-code" x="398.5" y="258.5" dy="0.35em" text-anchor="middle">cos +, sin −</text>
  <text class="dg-note" x="585" y="310" dy="0.35em" text-anchor="middle">cos positive</text>
  <circle class="dg-strong" cx="275" cy="77.4" r="4"/>
  <text class="dg-note" x="265.9" y="61.7" dy="0.35em" text-anchor="middle">120°</text>
  <circle class="dg-strong" cx="275" cy="302.6" r="4"/>
  <text class="dg-note" x="265.9" y="318.3" dy="0.35em" text-anchor="middle">240°</text>
  <circle class="dg-strong" cx="405" cy="302.6" r="4"/>
  <text class="dg-note" x="414.1" y="318.3" dy="0.35em" text-anchor="middle">300°</text>
  <circle class="dg-strong" cx="439.6" cy="106.4" r="4"/>
  <text class="dg-note" x="453.5" y="94.7" dy="0.35em" text-anchor="middle">40°</text>
</svg>
