<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220">
  <title>Four histogram shapes: symmetric, skewed right, skewed left, and bimodal</title>
  <desc>Four small histograms side by side. The symmetric one rises to a peak in the middle and falls the same way. Skewed right has its peak at the left and a long tail stretching right. Skewed left is its mirror image, with the tail to the left. Bimodal has two separate peaks.</desc>
