  <line class="dg-line" x1="268" y1="160" x2="268" y2="146"/>
  <line class="dg-line" x1="294" y1="160" x2="294" y2="146"/>
  <line class="dg-line" x1="185" y1="160" x2="325" y2="160"/>
  <text class="dg-heading" x="255" y="186" dy="0.35em" text-anchor="middle">skewed right</text>
  <polygon class="dg-box" points="355,160 355,146 381,146 381,146 407,146 407,118 433,118 433,76 459,76 459,34 485,34 485,160"/>
  <line class="dg-line" x1="381" y1="160" x2="381" y2="146"/>
  <line class="dg-line" x1="407" y1="160" x2="407" y2="146"/>
  <line class="dg-line" x1="433" y1="160" x2="433" y2="118"/>
  <line class="dg-line" x1="459" y1="160" x2="459" y2="76"/>
  <line class="dg-line" x1="350" y1="160" x2="490" y2="160"/>
  <text class="dg-heading" x="420" y="186" dy="0.35em" text-anchor="middle">skewed left</text>
  <polygon class="dg-box" points="520,160 520,118 541.7,118 541.7,48 563.3,48 563.3,104 585,104 585,132 606.7,132 606.7,62 628.3,62 628.3,118 650,118 650,160"/>
  <line class="dg-line" x1="541.7" y1="160" x2="541.7" y2="118"/>
  <line class="dg-line" x1="563.3" y1="160" x2="563.3" y2="104"/>
  <line class="dg-line" x1="585" y1="160" x2="585" y2="132"/>
  <line class="dg-line" x1="606.7" y1="160" x2="606.7" y2="132"/>
  <line class="dg-line" x1="628.3" y1="160" x2="628.3" y2="118"/>
  <line class="dg-line" x1="515" y1="160" x2="655" y2="160"/>
  <text class="dg-heading" x="585" y="186" dy="0.35em" text-anchor="middle">bimodal</text>
