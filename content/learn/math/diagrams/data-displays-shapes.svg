  <line class="dg-line" x1="103" y1="160" x2="103" y2="104"/>
  <line class="dg-line" x1="129" y1="160" x2="129" y2="132"/>
  <line class="dg-line" x1="20" y1="160" x2="160" y2="160"/>
  <text class="dg-heading" x="90" y="186" dy="0.35em" text-anchor="middle">symmetric</text>
  <polygon class="dg-box" points="190,160 190,34 216,34 216,76 242,76 242,118 268,118 268,146 294,146 294,146 320,146 320,160"/>
  <line class="dg-line" x1="216" y1="160" x2="216" y2="76"/>
