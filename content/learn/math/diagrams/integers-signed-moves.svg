<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200">
  <title>Adding and subtracting signed numbers as moves on the number line</title>
  <desc>A number line from −6 to 6. Above it, an arrow starts at 4 and moves 9 steps left to −5, labeled 4 + (−9) = −5. Below it, an arrow starts at −2 and moves 6 steps right to 4, labeled −2 − (−6) = −2 + 6 = 4. Adding a negative moves left, and subtracting a negative adds its opposite, which moves right.</desc>
  <!-- The number line, with arrows both ways. -->
  <line class="dg-line" x1="340" y1="100" x2="670" y2="100" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="100" x2="10" y2="100" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="40" y1="93" x2="40" y2="107"/>
  <text x="40" y="124" dy="0.35em" text-anchor="middle">−6</text>
  <line class="dg-line" x1="90" y1="93" x2="90" y2="107"/>
  <text x="90" y="124" dy="0.35em" text-anchor="middle">−5</text>
  <line class="dg-line" x1="140" y1="93" x2="140" y2="107"/>
  <text x="140" y="124" dy="0.35em" text-anchor="middle">−4</text>
  <line class="dg-line" x1="190" y1="93" x2="190" y2="107"/>
  <text x="190" y="124" dy="0.35em" text-anchor="middle">−3</text>
  <line class="dg-line" x1="240" y1="93" x2="240" y2="107"/>
  <text x="240" y="124" dy="0.35em" text-anchor="middle">−2</text>
  <line class="dg-line" x1="290" y1="93" x2="290" y2="107"/>
  <text x="290" y="124" dy="0.35em" text-anchor="middle">−1</text>
  <line class="dg-line" x1="340" y1="93" x2="340" y2="107"/>
  <text x="340" y="124" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line" x1="390" y1="93" x2="390" y2="107"/>
  <text x="390" y="124" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="440" y1="93" x2="440" y2="107"/>
  <text x="440" y="124" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="490" y1="93" x2="490" y2="107"/>
  <text x="490" y="124" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="540" y1="93" x2="540" y2="107"/>
  <text x="540" y="124" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="590" y1="93" x2="590" y2="107"/>
  <text x="590" y="124" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="640" y1="93" x2="640" y2="107"/>
  <text x="640" y="124" dy="0.35em" text-anchor="middle">6</text>
  <!-- 4 + (-9): from 4, nine steps left. -->
  <line class="dg-flow" x1="540" y1="66" x2="94" y2="66" marker-start="url(#dot)" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="315" y="42" dy="0.35em" text-anchor="middle">4 + (−9) = −5: 9 steps left</text>
  <line class="dg-line" x1="540" y1="72" x2="540" y2="88"/>
  <line class="dg-line" x1="90" y1="72" x2="90" y2="88"/>
  <!-- -2 - (-6) = -2 + 6: from -2, six steps right. -->
  <line class="dg-flow" x1="240" y1="152" x2="536" y2="152" marker-start="url(#dot)" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="390" y="178" dy="0.35em" text-anchor="middle">−2 − (−6) = −2 + 6 = 4: 6 steps right</text>
  <circle class="dg-hot" cx="90" cy="100" r="6"/>
  <circle class="dg-hot" cx="540" cy="100" r="6"/>
</svg>
