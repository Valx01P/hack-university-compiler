<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180">
  <title>The interval [−2, 3) on the number line</title>
  <desc>A number line from −4 to 5 with the stretch from −2 to 3 shaded. A filled dot at −2 shows that −2 is included, and a hollow dot at 3 shows that 3 is left out. Above it, [−2, 3) means −2 ≤ x &lt; 3.</desc>
  <line class="dg-line" x1="46" y1="120" x2="638" y2="120" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="614" y1="120" x2="42" y2="120" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="70" y1="113" x2="70" y2="127"/>
  <text x="70" y="144" dy="0.35em" text-anchor="middle">−4</text>
  <line class="dg-line" x1="130" y1="113" x2="130" y2="127"/>
  <text x="130" y="144" dy="0.35em" text-anchor="middle">−3</text>
  <line class="dg-line" x1="190" y1="113" x2="190" y2="127"/>
  <text x="190" y="144" dy="0.35em" text-anchor="middle">−2</text>
  <line class="dg-line" x1="250" y1="113" x2="250" y2="127"/>
  <text x="250" y="144" dy="0.35em" text-anchor="middle">−1</text>
  <line class="dg-line" x1="310" y1="113" x2="310" y2="127"/>
  <text x="310" y="144" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line" x1="370" y1="113" x2="370" y2="127"/>
  <text x="370" y="144" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="430" y1="113" x2="430" y2="127"/>
  <text x="430" y="144" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="490" y1="113" x2="490" y2="127"/>
  <text x="490" y="144" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="550" y1="113" x2="550" y2="127"/>
  <text x="550" y="144" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="610" y1="113" x2="610" y2="127"/>
  <text x="610" y="144" dy="0.35em" text-anchor="middle">5</text>
  <rect class="dg-hot" x="190" y="115" width="300" height="10" rx="5"/>
  <circle class="dg-hot" cx="190" cy="120" r="8"/>
  <circle class="dg-box" cx="490" cy="120" r="8"/>
  <text class="dg-code" x="340" y="40" dy="0.35em" text-anchor="middle">[−2, 3)  means  −2 ≤ x &lt; 3</text>
  <text x="190" y="84" dy="0.35em" text-anchor="middle">−2 is in</text>
  <text x="490" y="84" dy="0.35em" text-anchor="middle">3 is out</text>
</svg>
