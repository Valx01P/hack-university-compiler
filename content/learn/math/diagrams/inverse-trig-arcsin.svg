  <text class="dg-note" x="57.3" y="150" dy="0.35em" text-anchor="middle">−2π</text>
  <line class="dg-line" x1="198.6" y1="125" x2="198.6" y2="135"/>
  <text class="dg-note" x="198.6" y="150" dy="0.35em" text-anchor="middle">−π</text>
  <line class="dg-line" x1="481.4" y1="125" x2="481.4" y2="135"/>
  <text class="dg-note" x="481.4" y="150" dy="0.35em" text-anchor="middle">π</text>
  <line class="dg-line" x1="622.7" y1="125" x2="622.7" y2="135"/>
  <text class="dg-note" x="622.7" y="150" dy="0.35em" text-anchor="middle">2π</text>
  <line class="dg-line" x1="269.3" y1="125" x2="269.3" y2="135"/>
  <text class="dg-note" x="269.3" y="112" dy="0.35em" text-anchor="middle">−π/2</text>
  <line class="dg-line" x1="410.7" y1="125" x2="410.7" y2="135"/>
  <text class="dg-note" x="410.7" y="150" dy="0.35em" text-anchor="middle">π/2</text>
  <text class="dg-note" x="332" y="50" dy="0.35em" text-anchor="end">1</text>
  <text class="dg-note" x="332" y="210" dy="0.35em" text-anchor="end">−1</text>
