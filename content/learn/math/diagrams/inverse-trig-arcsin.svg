<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>The sine wave and the one-to-one piece that arcsin undoes</title>
  <desc>The graph of y = sin x from −2π to 2π, with the dashed line y = 1/2. The line crosses the wave four times in this window, and infinitely often in all. Only one crossing, at π/6, lies on the highlighted piece from −π/2 to π/2, where sine climbs from −1 to 1 and takes each value once. That piece is the one arcsin undoes.</desc>
