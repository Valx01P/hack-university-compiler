<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Water in an upside-down cone tank</title>
  <desc>An upside-down cone 4 meters tall with a top radius of 2 meters. Water fills it to a depth h, shaded, with surface radius r. The water forms a smaller cone similar to the tank, so r/h = 2/4 and r = h/2 at every depth.</desc>
  <!-- the tank: an upside-down cone, top radius 2 m, height 4 m, 60 units a meter -->
  <polygon class="dg-hot" points="230,100 410,100 320,280"/>
  <polyline class="dg-line" points="200,40 440,40 320,280 200,40"/>
  <line class="dg-line dg-dashed" x1="320" y1="40" x2="320" y2="280"/>
  <!-- top radius R and water radius r -->
  <text x="380" y="26" dy="0.35em" text-anchor="middle">R = 2 m</text>
  <line class="dg-line" x1="320" y1="100" x2="410" y2="100"/>
  <text x="365" y="86" dy="0.35em" text-anchor="middle">r</text>
  <!-- the height H on the left, the depth h on the right -->
  <line class="dg-line" x1="170" y1="40" x2="170" y2="280"/>
  <line class="dg-line" x1="162" y1="40" x2="178" y2="40"/>
  <line class="dg-line" x1="162" y1="280" x2="178" y2="280"/>
  <text x="156" y="160" dy="0.35em" text-anchor="end">H = 4 m</text>
  <line class="dg-line" x1="460" y1="100" x2="460" y2="280"/>
  <line class="dg-line" x1="452" y1="100" x2="468" y2="100"/>
  <line class="dg-line" x1="452" y1="280" x2="468" y2="280"/>
  <text x="474" y="190" dy="0.35em" text-anchor="start">h</text>
  <text x="560" y="230" dy="0.35em" text-anchor="middle">r/h = 2/4</text>
  <text class="dg-note" x="560" y="256" dy="0.35em" text-anchor="middle">so r = h/2</text>
</svg>
