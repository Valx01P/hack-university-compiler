<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A hole: (x² − 4)/(x − 2) is the line y = x + 2 with the point (2, 4) missing</title>
  <desc>The graph of f(x) = (x² − 4)/(x − 2) is the straight line y = x + 2, except at x = 2, where f is undefined. An open circle marks the missing point (2, 4). Dashed lines run from it to 2 on the x-axis and 4 on the y-axis.</desc>
  <line class="dg-line" x1="20" y1="253.3" x2="660" y2="253.3" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="55.6" y1="249.3" x2="55.6" y2="257.3"/>
  <text class="dg-note" x="55.6" y="269.3" text-anchor="middle">−3</text>
  <line class="dg-line" x1="126.7" y1="249.3" x2="126.7" y2="257.3"/>
  <text class="dg-note" x="126.7" y="269.3" text-anchor="middle">−2</text>
  <line class="dg-line" x1="197.8" y1="249.3" x2="197.8" y2="257.3"/>
  <text class="dg-note" x="197.8" y="269.3" text-anchor="middle">−1</text>
  <line class="dg-line" x1="268.9" y1="249.3" x2="268.9" y2="257.3"/>
  <line class="dg-line" x1="340" y1="249.3" x2="340" y2="257.3"/>
  <text class="dg-note" x="340" y="269.3" text-anchor="middle">1</text>
  <line class="dg-line" x1="411.1" y1="249.3" x2="411.1" y2="257.3"/>
  <text class="dg-note" x="411.1" y="269.3" text-anchor="middle">2</text>
  <line class="dg-line" x1="482.2" y1="249.3" x2="482.2" y2="257.3"/>
  <text class="dg-note" x="482.2" y="269.3" text-anchor="middle">3</text>
  <line class="dg-line" x1="553.3" y1="249.3" x2="553.3" y2="257.3"/>
  <text class="dg-note" x="553.3" y="269.3" text-anchor="middle">4</text>
  <line class="dg-line" x1="624.4" y1="249.3" x2="624.4" y2="257.3"/>
  <text class="dg-note" x="624.4" y="269.3" text-anchor="middle">5</text>
  <text class="dg-note" x="658" y="241.3" text-anchor="end">x</text>
  <line class="dg-line" x1="268.9" y1="300" x2="268.9" y2="20" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="264.9" y1="191.1" x2="272.9" y2="191.1"/>
  <text class="dg-note" x="260.9" y="191.1" dy="0.35em" text-anchor="end">2</text>
  <line class="dg-line" x1="264.9" y1="128.9" x2="272.9" y2="128.9"/>
  <text class="dg-note" x="260.9" y="128.9" dy="0.35em" text-anchor="end">4</text>
  <line class="dg-line" x1="264.9" y1="66.7" x2="272.9" y2="66.7"/>
  <text class="dg-note" x="260.9" y="66.7" dy="0.35em" text-anchor="end">6</text>
  <text class="dg-note" x="278.9" y="26" dy="0.35em" text-anchor="start">y</text>
  <polyline class="dg-flow" points="20,300 406.1,131.1"/>
  <polyline class="dg-flow" points="416.1,126.7 660,20"/>
