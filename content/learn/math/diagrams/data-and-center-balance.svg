<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <title>The mean as the balance point of 1, 2, 2, and 5</title>
  <desc>A dot plot of the numbers of pets in four households: one dot at 1, two stacked dots at 2, and one dot at 5. A wedge under the number line at 2.5, the mean, balances it. Arrows from 2.5 to each dot show the deviations: −1.5, −0.5, −0.5, and +2.5. The pulls to the left add to −2.5 and the pull to the right is +2.5, so they cancel.</desc>
  <line class="dg-line" x1="70" y1="160" x2="610" y2="160"/>
  <line class="dg-line" x1="100" y1="155" x2="100" y2="165"/>
  <line class="dg-line" x1="180" y1="155" x2="180" y2="165"/>
  <line class="dg-line" x1="260" y1="155" x2="260" y2="165"/>
  <line class="dg-line" x1="340" y1="155" x2="340" y2="165"/>
  <line class="dg-line" x1="420" y1="155" x2="420" y2="165"/>
  <line class="dg-line" x1="500" y1="155" x2="500" y2="165"/>
  <line class="dg-line" x1="580" y1="155" x2="580" y2="165"/>
  <text class="dg-note" x="100" y="204" dy="0.35em" text-anchor="middle">0</text>
  <text class="dg-note" x="180" y="204" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="260" y="204" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="340" y="204" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-note" x="420" y="204" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="500" y="204" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-note" x="580" y="204" dy="0.35em" text-anchor="middle">6</text>
  <polygon class="dg-hot" points="300,162 284,190 316,190"/>
  <circle class="dg-box" cx="180" cy="146" r="9"/>
  <circle class="dg-box" cx="260" cy="146" r="9"/>
  <circle class="dg-box" cx="260" cy="124" r="9"/>
  <circle class="dg-box" cx="500" cy="146" r="9"/>
  <line class="dg-line dg-dashed" x1="300" y1="40" x2="300" y2="160"/>
  <text x="300" y="28" dy="0.35em" text-anchor="middle">mean 2.5</text>
  <line class="dg-flow" x1="300" y1="74" x2="184" y2="74" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="240" y="60" dy="0.35em" text-anchor="middle">−1.5</text>
  <line class="dg-flow" x1="300" y1="108" x2="264" y2="108" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="252" y="108" dy="0.35em" text-anchor="end">−0.5 twice</text>
  <line class="dg-flow" x1="300" y1="74" x2="496" y2="74" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="400" y="60" dy="0.35em" text-anchor="middle">+2.5</text>
</svg>
