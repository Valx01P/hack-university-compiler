<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The remainder of T₂ for eˣ at x = 1.2</title>
  <desc>The curve y = eˣ and its Taylor polynomial T2 = 1 + x + x²/2 at 0, from x = −1.5 to 1.6. They touch at (0, 1) and stay close nearby. At x = 1.2 a short vertical segment marks the gap between the curve, about 3.32, and the parabola, 2.92. That gap is the remainder R2(1.2).</desc>
