<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The symmetries of a square and of an equilateral triangle</title>
  <desc>Left: a square centered at the origin with its four mirror lines, the two axes and the two diagonals, and an arrow for its quarter-turn rotation. It has 4 reflections and 4 rotations, 8 symmetries in all. Right: an equilateral triangle with its three mirror lines through each corner and the center, and an arrow for its one-third-turn rotation. It has 3 reflections and 3 rotations, 6 in all.</desc>
  <polygon class="dg-hot" points="110,220 230,220 230,100 110,100"/>
  <line class="dg-line dg-dashed" x1="78" y1="160" x2="262" y2="160"/>
  <line class="dg-line dg-dashed" x1="170" y1="252" x2="170" y2="68"/>
  <line class="dg-line dg-dashed" x1="86" y1="244" x2="254" y2="76"/>
  <line class="dg-line dg-dashed" x1="86" y1="76" x2="254" y2="244"/>
  <polyline class="dg-flow" points="230.3,82.8 226.3,79.8 222.2,77 217.9,74.5 213.4,72.2 208.9,70 204.3,68.2 199.5,66.6 194.7,65.2 189.9,64 184.9,63.1 180,62.5 175,62.1 170,62 165,62.1 160,62.5 155.1,63.1 150.1,64 145.3,65.2 140.5,66.6 135.7,68.2 131.1,70 126.6,72.2 122.1,74.5 117.8,77 113.7,79.8 109.7,82.8" marker-end="url(#arrow-flow)"/>
  <text class="dg-heading" x="170" y="280" dy="0.35em" text-anchor="middle">square: 4 mirrors, 4 turns</text>
  <text class="dg-note" x="170" y="300" dy="0.35em" text-anchor="middle">turns of 0°, 90°, 180°, 270°</text>
  <polygon class="dg-hot" points="510,102 451.1,204 568.9,204"/>
  <line class="dg-line dg-dashed" x1="510" y1="81.6" x2="510" y2="221"/>
  <line class="dg-line dg-dashed" x1="433.4" y1="214.2" x2="554.2" y2="144.5"/>
  <line class="dg-line dg-dashed" x1="586.6" y1="214.2" x2="465.8" y2="144.5"/>
  <polyline class="dg-flow" points="489.3,92.7 485.4,93.9 481.6,95.2 477.8,96.8 474.2,98.5 470.6,100.4 467.1,102.5 463.7,104.7 460.5,107.2 457.4,109.7 454.4,112.5 451.6,115.4 448.9,118.4 446.3,121.6 444,124.9 441.8,128.3 439.7,131.8 437.9,135.4 436.2,139.1 434.7,142.9 433.5,146.7 432.4,150.6 431.5,154.6 430.8,158.6 430.3,162.6 430.1,166.6 430,170.7 430.1,174.7 430.5,178.8 431,182.8 431.8,186.8 432.7,190.7" marker-end="url(#arrow-flow)"/>
  <text class="dg-heading" x="510" y="280" dy="0.35em" text-anchor="middle">triangle: 3 mirrors, 3 turns</text>
  <text class="dg-note" x="510" y="300" dy="0.35em" text-anchor="middle">turns of 0°, 120°, 240°</text>
</svg>
