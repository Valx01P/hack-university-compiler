<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>Rotating the point (4, 2) by quarter turns about the origin</title>
  <desc>The point P(4, 2) with its right triangle: legs 4 along the x-axis and 2 straight up. A quarter turn counterclockwise about the origin carries the triangle to one with leg 4 up the y-axis and leg 2 pointing left, so P lands on (−2, 4). Two quarter turns give (−4, −2), and three give (2, −4). All four points are the same distance from the origin.</desc>
