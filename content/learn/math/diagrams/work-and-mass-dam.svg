<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A vertical plate under water, with one thin strip at depth x</title>
  <desc>A trapezoid-shaped plate stands upright under water, its top at the surface. A thin horizontal strip at depth x is highlighted, with width w(x). Arrows on the side grow longer with depth, since the pressure 9800x grows the deeper you go. The strip feels about 9800x times w(x) times its height.</desc>
  <line class="dg-line dg-dashed" x1="60" y1="60" x2="620" y2="60"/>
  <text class="dg-note" x="620" y="50" text-anchor="end">water surface</text>
  <polygon class="dg-box" points="180,60 480,60 420,300 240,300"/>
  <polygon class="dg-hot" points="216,204 444,204 442.5,216 217.5,216"/>
  <line class="dg-flow" x1="130" y1="60" x2="130" y2="204"/>
  <line class="dg-line" x1="124" y1="204" x2="136" y2="204"/>
  <text x="122" y="137" text-anchor="end">depth x</text>
  <line class="dg-line" x1="216" y1="234" x2="444" y2="234"/>
  <line class="dg-line" x1="216" y1="228" x2="216" y2="240"/>
  <line class="dg-line" x1="444" y1="228" x2="444" y2="240"/>
  <text x="330" y="254" text-anchor="middle">width w(x)</text>
  <line class="dg-line" x1="499.5" y1="90" x2="480.5" y2="90" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="498.5" y1="150" x2="465.5" y2="150" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="497.5" y1="210" x2="450.5" y2="210" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="496.5" y1="270" x2="435.5" y2="270" marker-end="url(#arrow)"/>
  <text class="dg-note" x="560" y="290" text-anchor="middle">pressure 9800x grows</text>
  <text class="dg-note" x="560" y="308" text-anchor="middle">with depth</text>
</svg>
