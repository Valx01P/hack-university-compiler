<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Two roses: r = cos 3θ has three petals and r = cos 2θ has four</title>
  <desc>Left: the rose r = cos 3θ has three petals of length 1, pointing at angles 0, 2π/3, and 4π/3, and θ from 0 to π draws all of it. Right: the rose r = cos 2θ has four petals of length 1, pointing along both axes, and needs θ from 0 to 2π.</desc>
