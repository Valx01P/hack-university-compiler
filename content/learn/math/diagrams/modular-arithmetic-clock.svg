<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>A 12-hour clock: 5 hours after 9 is 2</title>
  <desc>A clock face with the hours 1 to 12 around a circle. An arrow runs clockwise outside the circle from 9 past 10, 11, 12, and 1 to 2, five steps. Beside it: 9 + 5 = 14, and 14 = 12 × 1 + 2, so 14 ≡ 2 (mod 12). The clock keeps only the remainder.</desc>
  <circle class="dg-frame" cx="300" cy="180" r="120"/>
  <circle class="dg-box" cx="360.0" cy="76.1" r="17"/>
  <text x="360.0" y="76.1" dy="0.35em" text-anchor="middle">1</text>
  <circle class="dg-hot" cx="403.9" cy="120.0" r="17"/>
  <text class="dg-on-hot" x="403.9" y="120.0" dy="0.35em" text-anchor="middle">2</text>
  <circle class="dg-box" cx="420.0" cy="180.0" r="17"/>
  <text x="420.0" y="180.0" dy="0.35em" text-anchor="middle">3</text>
  <circle class="dg-box" cx="403.9" cy="240.0" r="17"/>
  <text x="403.9" y="240.0" dy="0.35em" text-anchor="middle">4</text>
  <circle class="dg-box" cx="360.0" cy="283.9" r="17"/>
  <text x="360.0" y="283.9" dy="0.35em" text-anchor="middle">5</text>
  <circle class="dg-box" cx="300.0" cy="300.0" r="17"/>
  <text x="300.0" y="300.0" dy="0.35em" text-anchor="middle">6</text>
  <circle class="dg-box" cx="240.0" cy="283.9" r="17"/>
  <text x="240.0" y="283.9" dy="0.35em" text-anchor="middle">7</text>
  <circle class="dg-box" cx="196.1" cy="240.0" r="17"/>
  <text x="196.1" y="240.0" dy="0.35em" text-anchor="middle">8</text>
  <circle class="dg-hot" cx="180.0" cy="180.0" r="17"/>
  <text class="dg-on-hot" x="180.0" y="180.0" dy="0.35em" text-anchor="middle">9</text>
  <circle class="dg-box" cx="196.1" cy="120.0" r="17"/>
  <text x="196.1" y="120.0" dy="0.35em" text-anchor="middle">10</text>
  <circle class="dg-box" cx="240.0" cy="76.1" r="17"/>
  <text x="240.0" y="76.1" dy="0.35em" text-anchor="middle">11</text>
  <circle class="dg-box" cx="300.0" cy="60.0" r="17"/>
  <text x="300.0" y="60.0" dy="0.35em" text-anchor="middle">12</text>
  <path class="dg-flow" d="M148.0 180.0 A152 152 0 0 1 431.6 104.0" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="300.0" y="12.0" dy="0.35em" text-anchor="middle">+5 hours</text>
  <text class="dg-heading" x="490" y="140" dy="0.35em">9 + 5 = 14</text>
  <text class="dg-code" x="490" y="176" dy="0.35em">14 = 12 × 1 + 2</text>
  <text class="dg-code" x="490" y="204" dy="0.35em">14 ≡ 2 (mod 12)</text>
</svg>
