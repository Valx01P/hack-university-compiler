<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Half-life: the amount halves every T, from 100 to 50 to 25 to 12.5</title>
  <desc>A decay curve starting at 100 at time 0 and falling ever more slowly toward 0. Dashed lines mark one half-life T, where 50 is left, two half-lives 2T, where 25 is left, and three half-lives 3T, where 12.5 is left. The curve approaches the time axis but never reaches it.</desc>
  <line class="dg-line" x1="60" y1="277" x2="640" y2="277" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="217.1" y1="273" x2="217.1" y2="281"/>
  <text class="dg-note" x="217.1" y="293" text-anchor="middle">T</text>
  <line class="dg-line" x1="337.9" y1="273" x2="337.9" y2="281"/>
  <text class="dg-note" x="337.9" y="293" text-anchor="middle">2T</text>
  <line class="dg-line" x1="458.8" y1="273" x2="458.8" y2="281"/>
  <text class="dg-note" x="458.8" y="293" text-anchor="middle">3T</text>
  <line class="dg-line" x1="579.6" y1="273" x2="579.6" y2="281"/>
  <text class="dg-note" x="579.6" y="293" text-anchor="middle">4T</text>
  <text class="dg-note" x="638" y="265" text-anchor="end">time</text>
  <line class="dg-line" x1="96.2" y1="300" x2="96.2" y2="20" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="92.2" y1="219.7" x2="100.2" y2="219.7"/>
  <text class="dg-note" x="88.2" y="219.7" dy="0.35em" text-anchor="end">25</text>
  <line class="dg-line" x1="92.2" y1="162.3" x2="100.2" y2="162.3"/>
  <text class="dg-note" x="88.2" y="162.3" dy="0.35em" text-anchor="end">50</text>
  <line class="dg-line" x1="92.2" y1="104.9" x2="100.2" y2="104.9"/>
  <text class="dg-note" x="88.2" y="104.9" dy="0.35em" text-anchor="end">75</text>
  <line class="dg-line" x1="92.2" y1="47.5" x2="100.2" y2="47.5"/>
  <text class="dg-note" x="88.2" y="47.5" dy="0.35em" text-anchor="end">100</text>
  <text class="dg-note" x="106.2" y="26" dy="0.35em" text-anchor="start">amount</text>
  <polyline class="dg-flow" points="96.2,47.5 117.8,74.3 139.4,97.9 162.2,119.9 185.1,139.2 210.4,157.8 235.8,174 263.7,189.2 292.9,202.8 323.4,214.7 355.1,225.1 389.3,234.3 426.1,242.5 465.5,249.4 507.3,255.3 553,260.3 603.8,264.6"/>
  <line class="dg-line dg-dashed" x1="217.1" y1="277" x2="217.1" y2="162.3"/>
  <line class="dg-line dg-dashed" x1="96.2" y1="162.3" x2="217.1" y2="162.3"/>
  <circle class="dg-hot" cx="217.1" cy="162.3" r="5"/>
  <text class="dg-code" x="227.1" y="150.3" dy="0.35em" text-anchor="start">50</text>
  <line class="dg-line dg-dashed" x1="337.9" y1="277" x2="337.9" y2="219.7"/>
  <line class="dg-line dg-dashed" x1="96.2" y1="219.7" x2="337.9" y2="219.7"/>
  <circle class="dg-hot" cx="337.9" cy="219.7" r="5"/>
  <text class="dg-code" x="347.9" y="207.7" dy="0.35em" text-anchor="start">25</text>
  <line class="dg-line dg-dashed" x1="458.8" y1="277" x2="458.8" y2="248.4"/>
  <line class="dg-line dg-dashed" x1="96.2" y1="248.4" x2="458.8" y2="248.4"/>
  <circle class="dg-hot" cx="458.8" cy="248.4" r="5"/>
  <text class="dg-code" x="468.8" y="236.4" dy="0.35em" text-anchor="start">12.5</text>
  <circle class="dg-badge" cx="96.2" cy="47.5" r="4"/>
</svg>
