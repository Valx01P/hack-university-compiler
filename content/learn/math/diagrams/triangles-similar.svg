<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>Similar triangles: equal angles, sides in the ratio k = 2</title>
  <desc>Two right triangles with the same angles. The small one, ABC, has legs 3 and 4 and hypotenuse 5. The large one, DEF, has legs 6 and 8 and hypotenuse 10. Matching angles are marked the same way, and each side of DEF is 2 times the matching side of ABC, so the scale factor is k = 2.</desc>
  <polygon class="dg-box" points="40,240 120,240 40,180"/>
  <path class="dg-hot" d="M120 240 L99.2 224.4 A26 26 0 0 0 94 240 Z"/>
  <polyline class="dg-line" points="52,240 52,228 40,228"/>
  <path class="dg-line" d="M40 202 A22 22 0 0 0 57.6 193.2"/>
  <text class="dg-heading" x="26" y="252" dy="0.35em" text-anchor="middle">A</text>
  <text class="dg-heading" x="134" y="252" dy="0.35em" text-anchor="middle">B</text>
  <text class="dg-heading" x="26" y="172" dy="0.35em" text-anchor="middle">C</text>
  <polygon class="dg-box" points="260,240 420,240 260,120"/>
  <path class="dg-hot" d="M420 240 L399.2 224.4 A26 26 0 0 0 394 240 Z"/>
  <polyline class="dg-line" points="272,240 272,228 260,228"/>
  <path class="dg-line" d="M260 142 A22 22 0 0 0 277.6 133.2"/>
  <text class="dg-heading" x="246" y="252" dy="0.35em" text-anchor="middle">D</text>
  <text class="dg-heading" x="434" y="252" dy="0.35em" text-anchor="middle">E</text>
  <text class="dg-heading" x="246" y="112" dy="0.35em" text-anchor="middle">F</text>
  <text class="dg-code" x="80" y="258" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="26" y="210" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="92" y="200" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-code" x="340" y="258" dy="0.35em" text-anchor="middle">8</text>
  <text class="dg-code" x="246" y="180" dy="0.35em" text-anchor="middle">6</text>
  <text class="dg-code" x="354" y="168" dy="0.35em" text-anchor="middle">10</text>
  <text class="dg-code" x="560" y="110" dy="0.35em" text-anchor="middle">6/3 = 8/4 = 10/5 = 2</text>
  <text class="dg-code" x="560" y="140" dy="0.35em" text-anchor="middle">k = 2</text>
</svg>
