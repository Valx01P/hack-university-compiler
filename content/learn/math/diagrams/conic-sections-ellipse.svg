  <title>The ellipse x²/25 + y²/9 = 1 with foci (−4, 0) and (4, 0)</title>
  <desc>Axes with a wide ellipse through the vertices (−5, 0) and (5, 0) and the co-vertices (0, 3) and (0, −3). The foci F1 = (−4, 0) and F2 = (4, 0) sit inside on the long axis. Segments join the point P = (3, 2.4) on the ellipse to both foci, with lengths 37/5 and 13/5, which add to 10 = 2a. A dashed segment from the co-vertex (0, 3) to F2 has length a = 5, the hypotenuse of a right triangle with legs b = 3 and c = 4.</desc>
