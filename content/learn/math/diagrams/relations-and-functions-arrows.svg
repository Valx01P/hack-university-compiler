<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>One-to-one, onto, and a bijection, drawn as arrows</title>
  <desc>Three arrow diagrams, each with inputs on the left and outputs on the right. The first sends 1, 2, 3 to 5, 7, 4: no two arrows land together, so it is one-to-one, but 6 gets no arrow, so it is not onto. The second sends 1, 2, 3, 4 to their remainders on dividing by 2: both outputs get arrows, so it is onto, but each gets two, so it is not one-to-one. The third pairs the letters M, A, T, H with 1, 2, 3, 4, one arrow at every point: a bijection, the way counting works.</desc>
  <!-- One-to-one -->
  <text class="dg-heading" x="120" y="24" dy="0.35em" text-anchor="middle">One-to-one</text>
  <text class="dg-note" x="120" y="46" dy="0.35em" text-anchor="middle">6 gets no arrow</text>
  <line class="dg-line" x1="80" y1="90" x2="156" y2="110" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="80" y1="130" x2="156" y2="190" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="80" y1="170" x2="156" y2="70" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="42" y="76" width="36" height="28" rx="8"/>
  <text x="60" y="90" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-box" x="42" y="116" width="36" height="28" rx="8"/>
  <text x="60" y="130" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="42" y="156" width="36" height="28" rx="8"/>
  <text x="60" y="170" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="162" y="56" width="36" height="28" rx="8"/>
  <text x="180" y="70" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-box" x="162" y="96" width="36" height="28" rx="8"/>
  <text x="180" y="110" dy="0.35em" text-anchor="middle">5</text>
  <rect class="dg-off" x="162" y="136" width="36" height="28" rx="8"/>
  <text class="dg-faint" x="180" y="150" dy="0.35em" text-anchor="middle">6</text>
  <rect class="dg-box" x="162" y="176" width="36" height="28" rx="8"/>
  <text x="180" y="190" dy="0.35em" text-anchor="middle">7</text>
  <text class="dg-note" x="60" y="224" dy="0.35em" text-anchor="middle">inputs</text>
  <text class="dg-note" x="180" y="224" dy="0.35em" text-anchor="middle">outputs</text>
  <!-- Onto -->
  <text class="dg-heading" x="340" y="24" dy="0.35em" text-anchor="middle">Onto</text>
  <text class="dg-note" x="340" y="46" dy="0.35em" text-anchor="middle">0 and 1 get two arrows each</text>
  <line class="dg-line" x1="300" y1="70" x2="376" y2="150" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="300" y1="110" x2="376" y2="110" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="300" y1="150" x2="376" y2="150" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="300" y1="190" x2="376" y2="110" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="262" y="56" width="36" height="28" rx="8"/>
  <text x="280" y="70" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-box" x="262" y="96" width="36" height="28" rx="8"/>
  <text x="280" y="110" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="262" y="136" width="36" height="28" rx="8"/>
  <text x="280" y="150" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="262" y="176" width="36" height="28" rx="8"/>
  <text x="280" y="190" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-box" x="382" y="96" width="36" height="28" rx="8"/>
  <text x="400" y="110" dy="0.35em" text-anchor="middle">0</text>
  <rect class="dg-box" x="382" y="136" width="36" height="28" rx="8"/>
  <text x="400" y="150" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="280" y="224" dy="0.35em" text-anchor="middle">inputs</text>
  <text class="dg-note" x="400" y="224" dy="0.35em" text-anchor="middle">outputs</text>
  <!-- Bijection -->
  <text class="dg-heading" x="560" y="24" dy="0.35em" text-anchor="middle">Bijection</text>
  <text class="dg-note" x="560" y="46" dy="0.35em" text-anchor="middle">one arrow at every point</text>
  <line class="dg-flow" x1="520" y1="70" x2="596" y2="70" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="520" y1="110" x2="596" y2="110" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="520" y1="150" x2="596" y2="150" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="520" y1="190" x2="596" y2="190" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="482" y="56" width="36" height="28" rx="8"/>
  <text x="500" y="70" dy="0.35em" text-anchor="middle">M</text>
  <rect class="dg-box" x="482" y="96" width="36" height="28" rx="8"/>
  <text x="500" y="110" dy="0.35em" text-anchor="middle">A</text>
  <rect class="dg-box" x="482" y="136" width="36" height="28" rx="8"/>
  <text x="500" y="150" dy="0.35em" text-anchor="middle">T</text>
  <rect class="dg-box" x="482" y="176" width="36" height="28" rx="8"/>
  <text x="500" y="190" dy="0.35em" text-anchor="middle">H</text>
  <rect class="dg-box" x="602" y="56" width="36" height="28" rx="8"/>
  <text x="620" y="70" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-box" x="602" y="96" width="36" height="28" rx="8"/>
  <text x="620" y="110" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="602" y="136" width="36" height="28" rx="8"/>
  <text x="620" y="150" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="602" y="176" width="36" height="28" rx="8"/>
  <text x="620" y="190" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="500" y="224" dy="0.35em" text-anchor="middle">inputs</text>
  <text class="dg-note" x="620" y="224" dy="0.35em" text-anchor="middle">outputs</text>
</svg>
