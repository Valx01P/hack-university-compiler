<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Archimedes' bounds: a circle between an inscribed and a circumscribed hexagon</title>
  <desc>A circle of radius r with a regular hexagon inside it, its corners on the circle, and a larger regular hexagon outside it, its sides touching the circle. The inside hexagon is six equilateral triangles, so its perimeter is 6r. The outside hexagon's perimeter is 4√3 r. The circle's circumference 2πr lies between them, so 3 &lt; π &lt; 2√3, about 3.46. Doubling the sides squeezes π tighter.</desc>
  <circle class="dg-box" cx="170" cy="150" r="110"/>
  <polygon class="dg-off" points="280,86.5 170,23 60,86.5 60,213.5 170,277 280,213.5"/>
  <polyline class="dg-flow" points="280,150 225,54.7 115,54.7 60,150 115,245.3 225,245.3 280,150"/>
  <line class="dg-line" x1="170" y1="150" x2="280" y2="150"/>
  <line class="dg-line" x1="170" y1="150" x2="225" y2="54.7"/>
  <text class="dg-note" x="232" y="164" dy="0.35em" text-anchor="middle">r</text>
  <text class="dg-note" x="192" y="100" dy="0.35em" text-anchor="middle">r</text>
  <text class="dg-note" x="274" y="106" dy="0.35em" text-anchor="middle">r</text>
  <circle class="dg-strong" cx="170" cy="150" r="3.5"/>
  <text class="dg-heading" x="156" y="154" dy="0.35em" text-anchor="middle">O</text>
  <text class="dg-code" x="360" y="70" dy="0.35em" text-anchor="start">inside hexagon: perimeter 6r</text>
  <text class="dg-code" x="360" y="110" dy="0.35em" text-anchor="start">the circle: C = 2πr</text>
  <text class="dg-code" x="360" y="150" dy="0.35em" text-anchor="start">outside hexagon: perimeter 4√3 r</text>
  <text class="dg-code" x="360" y="200" dy="0.35em" text-anchor="start">6r &lt; 2πr &lt; 4√3 r</text>
  <text class="dg-code" x="360" y="236" dy="0.35em" text-anchor="start">so 3 &lt; π &lt; 2√3 ≈ 3.46</text>
</svg>
