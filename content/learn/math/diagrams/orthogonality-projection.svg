<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Projecting x onto a plane W: x = p + e with e perpendicular to W</title>
  <desc>A slanted parallelogram stands for the plane W through the origin O. The vector x rises out of the plane. Its projection p lies in the plane, directly below the tip of x, and the error e = x − p runs straight from p up to x, at a right angle to the plane. p is the point of W closest to x.</desc>
  <polygon class="dg-hot" points="60,250 440,250 620,170 240,170"/>
  <text class="dg-note" x="580" y="236" dy="0.35em" text-anchor="middle">plane W</text>
  <circle class="dg-strong" cx="200" cy="225" r="4"/>
  <text class="dg-note" x="188" y="229" dy="0.35em" text-anchor="end">O</text>
  <line class="dg-flow" x1="200" y1="225" x2="417" y2="73.5" marker-end="url(#arrow-flow)"/>
  <text class="dg-heading" x="300" y="120" dy="0.35em" text-anchor="end">x</text>
  <line class="dg-line" x1="200" y1="225" x2="416" y2="200.5" marker-end="url(#arrow)"/>
  <text class="dg-note" x="312" y="228" dy="0.35em" text-anchor="middle">p, the projection</text>
  <line class="dg-line dg-dashed" x1="420" y1="200" x2="420" y2="76" marker-end="url(#arrow)"/>
  <text class="dg-note" x="432" y="135" dy="0.35em" text-anchor="start">e = x − p</text>
  <polyline class="dg-line" points="420,186 432,183 432,197"/>
  <text class="dg-note" x="432" y="290" dy="0.35em" text-anchor="middle">e is perpendicular to every vector in W</text>
</svg>
