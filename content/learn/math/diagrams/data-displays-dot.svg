<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <title>A dot plot of the books 15 students read over the summer</title>
  <desc>A number line from 0 to 11 with one dot per student, stacked over the number of books. The stacks have 1 dot at 0, 2 at 1, 3 at 2, 4 at 3, 2 at 4, and 1 each at 5 and 6. Nothing sits from 7 to 10, and one dot sits alone at 11. The tallest stack, at 3, is the mode.</desc>
  <line class="dg-line" x1="50" y1="190" x2="630" y2="190"/>
  <line class="dg-line" x1="70" y1="185" x2="70" y2="195"/>
  <text class="dg-note" x="70" y="206" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line" x1="118" y1="185" x2="118" y2="195"/>
  <text class="dg-note" x="118" y="206" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="166" y1="185" x2="166" y2="195"/>
  <text class="dg-note" x="166" y="206" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="214" y1="185" x2="214" y2="195"/>
  <text class="dg-note" x="214" y="206" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="262" y1="185" x2="262" y2="195"/>
  <text class="dg-note" x="262" y="206" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="310" y1="185" x2="310" y2="195"/>
  <text class="dg-note" x="310" y="206" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="358" y1="185" x2="358" y2="195"/>
  <text class="dg-note" x="358" y="206" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="406" y1="185" x2="406" y2="195"/>
  <text class="dg-note" x="406" y="206" dy="0.35em" text-anchor="middle">7</text>
  <line class="dg-line" x1="454" y1="185" x2="454" y2="195"/>
  <text class="dg-note" x="454" y="206" dy="0.35em" text-anchor="middle">8</text>
  <line class="dg-line" x1="502" y1="185" x2="502" y2="195"/>
  <text class="dg-note" x="502" y="206" dy="0.35em" text-anchor="middle">9</text>
  <line class="dg-line" x1="550" y1="185" x2="550" y2="195"/>
  <text class="dg-note" x="550" y="206" dy="0.35em" text-anchor="middle">10</text>
  <line class="dg-line" x1="598" y1="185" x2="598" y2="195"/>
  <text class="dg-note" x="598" y="206" dy="0.35em" text-anchor="middle">11</text>
  <text class="dg-note" x="340" y="230" dy="0.35em" text-anchor="middle">books read</text>
  <circle class="dg-box" cx="70" cy="176" r="8"/>
  <circle class="dg-box" cx="118" cy="176" r="8"/>
  <circle class="dg-box" cx="118" cy="156" r="8"/>
  <circle class="dg-box" cx="166" cy="176" r="8"/>
  <circle class="dg-box" cx="166" cy="156" r="8"/>
  <circle class="dg-box" cx="166" cy="136" r="8"/>
  <circle class="dg-hot" cx="214" cy="176" r="8"/>
  <circle class="dg-hot" cx="214" cy="156" r="8"/>
  <circle class="dg-hot" cx="214" cy="136" r="8"/>
  <circle class="dg-hot" cx="214" cy="116" r="8"/>
  <circle class="dg-box" cx="262" cy="176" r="8"/>
  <circle class="dg-box" cx="262" cy="156" r="8"/>
  <circle class="dg-box" cx="310" cy="176" r="8"/>
  <circle class="dg-box" cx="358" cy="176" r="8"/>
  <circle class="dg-box" cx="598" cy="176" r="8"/>
  <text x="214" y="82" dy="0.35em" text-anchor="middle">mode 3</text>
  <path class="dg-line" d="M396 160 V154 H560 V160"/>
  <text class="dg-note" x="478" y="140" dy="0.35em" text-anchor="middle">a gap</text>
  <text class="dg-code" x="598" y="150" dy="0.35em" text-anchor="middle">11</text>
</svg>
