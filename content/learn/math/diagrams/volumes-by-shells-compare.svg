  <title>A vertical strip and a horizontal strip in the region under y = 2x² − x³</title>
  <desc>The region under y = 2x² − x³ from 0 to 2. A vertical strip, the shell's strip, has height f(x), read straight off the curve. A dashed horizontal strip, a washer's strip, has ends at the two solutions of the cubic 2x² − x³ = y, which are hard to write down.</desc>
