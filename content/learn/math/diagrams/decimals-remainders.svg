<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The remainders of 1 divided by 7 go around a cycle</title>
  <desc>Six remainders in a ring: 1, 3, 2, 6, 4, 5. Each arrow is one step of long division, ten times the remainder divided by 7, and it is labeled with the digit that step writes: 1, 4, 2, 8, 5, and 7. After 5 the arrow returns to 1, so the digits 142857 repeat forever and 1/7 = 0.142857142857...</desc>
  <line class="dg-flow" x1="262.5" y1="73.0" x2="319.7" y2="106.0" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="305.0" y="67.5" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-flow" x1="343.9" y1="146.0" x2="343.9" y2="212.0" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="369.9" y="180.0" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-flow" x1="321.4" y1="253.0" x2="264.2" y2="286.0" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="305.0" y="292.5" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-flow" x1="217.5" y1="287.0" x2="160.3" y2="254.0" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="175.0" y="292.5" dy="0.35em" text-anchor="middle">8</text>
  <line class="dg-flow" x1="136.1" y1="214.0" x2="136.1" y2="148.0" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="110.1" y="180.0" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-flow" x1="158.6" y1="107.0" x2="215.8" y2="74.0" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="175.0" y="67.5" dy="0.35em" text-anchor="middle">7</text>
  <circle class="dg-hot" cx="240.0" cy="60.0" r="22"/>
  <text class="dg-on-hot" x="240.0" y="60.0" dy="0.35em" text-anchor="middle">1</text>
  <circle class="dg-box" cx="343.9" cy="120.0" r="22"/>
  <text x="343.9" y="120.0" dy="0.35em" text-anchor="middle">3</text>
  <circle class="dg-box" cx="343.9" cy="240.0" r="22"/>
  <text x="343.9" y="240.0" dy="0.35em" text-anchor="middle">2</text>
  <circle class="dg-box" cx="240.0" cy="300.0" r="22"/>
  <text x="240.0" y="300.0" dy="0.35em" text-anchor="middle">6</text>
  <circle class="dg-box" cx="136.1" cy="240.0" r="22"/>
  <text x="136.1" y="240.0" dy="0.35em" text-anchor="middle">4</text>
  <circle class="dg-box" cx="136.1" cy="120.0" r="22"/>
  <text x="136.1" y="120.0" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-note" x="240" y="172" dy="0.35em" text-anchor="middle">remainders</text>
  <text class="dg-note" x="240" y="192" dy="0.35em" text-anchor="middle">digits on the arrows</text>
  <text class="dg-heading" x="430" y="160" dy="0.35em">1/7 = 0.142857 142857 ...</text>
  <text class="dg-code" x="430" y="196" dy="0.35em">10 = 7 × 1 + 3</text>
  <text class="dg-code" x="430" y="220" dy="0.35em">30 = 7 × 4 + 2</text>
  <text class="dg-code" x="430" y="244" dy="0.35em">...</text>
</svg>
