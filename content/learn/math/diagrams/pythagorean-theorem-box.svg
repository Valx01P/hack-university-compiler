<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A box's space diagonal from the theorem used twice</title>
  <desc>A box 3 wide, 4 deep, and 12 tall, drawn in perspective. On the floor, the diagonal across the 3 by 4 rectangle has length √(3² + 4²) = 5. That floor diagonal and the vertical edge of length 12 meet at a right angle, so the space diagonal from a bottom corner to the opposite top corner is √(5² + 12²) = 13.</desc>
  <polygon class="dg-hot" points="200,290 320,290 392,242 272,242"/>
  <line class="dg-line" x1="200" y1="290" x2="200" y2="74"/>
  <line class="dg-line dg-dashed" x1="200" y1="290" x2="272" y2="242"/>
  <line class="dg-line" x1="200" y1="290" x2="320" y2="290"/>
  <line class="dg-line" x1="200" y1="74" x2="272" y2="26"/>
  <line class="dg-line" x1="200" y1="74" x2="320" y2="74"/>
  <line class="dg-line dg-dashed" x1="272" y1="242" x2="272" y2="26"/>
  <line class="dg-line dg-dashed" x1="272" y1="242" x2="392" y2="242"/>
  <line class="dg-line" x1="272" y1="26" x2="392" y2="26"/>
  <line class="dg-line" x1="320" y1="290" x2="320" y2="74"/>
  <line class="dg-line" x1="320" y1="290" x2="392" y2="242"/>
  <line class="dg-line" x1="320" y1="74" x2="392" y2="26"/>
  <line class="dg-line" x1="392" y1="242" x2="392" y2="26"/>
  <line class="dg-line" x1="200" y1="290" x2="392" y2="242"/>
  <line class="dg-flow" x1="200" y1="290" x2="392" y2="26"/>
  <text class="dg-note" x="260" y="306" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-note" x="372" y="272" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="186" y="182" dy="0.35em" text-anchor="middle">12</text>
  <text class="dg-code" x="545" y="130" dy="0.35em" text-anchor="middle">floor diagonal √(3² + 4²) = 5</text>
  <text class="dg-code" x="545" y="160" dy="0.35em" text-anchor="middle">space diagonal √(5² + 12²) = 13</text>
</svg>
