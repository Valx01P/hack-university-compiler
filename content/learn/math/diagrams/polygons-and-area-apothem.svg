<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A regular hexagon cut into six triangles from its center, with the apothem</title>
  <desc>A regular hexagon with side s. Lines from its center to the six vertices cut it into six equal triangles. One is highlighted. Its base is a side s, and its height is the apothem a, the distance from the center to the middle of a side, drawn at a right angle to the side. Each triangle has area ½ · s · a, so the hexagon has area ½ · 6s · a, half the perimeter times the apothem.</desc>
  <polygon class="dg-box" points="340,150 280,46.1 160,46.1 100,150 160,253.9 280,253.9"/>
  <polygon class="dg-hot" points="220,150 160,253.9 280,253.9"/>
  <line class="dg-line" x1="220" y1="150" x2="340" y2="150"/>
  <line class="dg-line" x1="220" y1="150" x2="280" y2="46.1"/>
  <line class="dg-line" x1="220" y1="150" x2="160" y2="46.1"/>
  <line class="dg-line" x1="220" y1="150" x2="100" y2="150"/>
  <line class="dg-line" x1="220" y1="150" x2="160" y2="253.9"/>
  <line class="dg-line" x1="220" y1="150" x2="280" y2="253.9"/>
  <line class="dg-line" x1="220" y1="150" x2="220" y2="253.9"/>
  <polyline class="dg-line" points="220,244.9 211,244.9 211,253.9"/>
  <circle class="dg-strong" cx="220" cy="150" r="4"/>
  <text class="dg-on-hot" x="234" y="202" dy="0.35em" text-anchor="middle">a</text>
  <text x="220" y="271.9" dy="0.35em" text-anchor="middle">s</text>
  <text x="500" y="110" dy="0.35em" text-anchor="middle">6 triangles, each ½ · s · a</text>
  <text class="dg-code" x="500" y="150" dy="0.35em" text-anchor="middle">A = ½ · 6s · a</text>
  <text class="dg-code" x="500" y="176" dy="0.35em" text-anchor="middle">= ½ · perimeter · apothem</text>
</svg>
