  <title>The intermediate value theorem: the curve must cross y = N</title>
  <desc>A continuous curve runs from the point (a, f(a)), below the dashed horizontal line y = N, to the point (b, f(b)), above it. Because it can't jump, it crosses the line, here at three places marked c. The theorem promises at least one such c between a and b.</desc>
