<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The least-squares solution: A x̂ is the projection of b onto C(A)</title>
  <desc>A slanted parallelogram stands for the column space C(A). The vector b sticks out of it, so A x = b has no solution. The closest point of C(A) to b is the projection p = A x̂, directly below the tip of b, and the error e = b − A x̂ meets C(A) at a right angle, which is the statement A transpose e = 0.</desc>
  <polygon class="dg-hot" points="60,250 440,250 620,170 240,170"/>
  <text class="dg-note" x="575" y="236" dy="0.35em" text-anchor="middle">column space C(A)</text>
  <circle class="dg-strong" cx="200" cy="225" r="4"/>
  <text class="dg-note" x="188" y="229" dy="0.35em" text-anchor="end">0</text>
  <line class="dg-flow" x1="200" y1="225" x2="417" y2="73.5" marker-end="url(#arrow-flow)"/>
  <text class="dg-heading" x="296" y="128" dy="0.35em" text-anchor="end">b</text>
  <line class="dg-line" x1="200" y1="225" x2="416" y2="200.5" marker-end="url(#arrow)"/>
  <text class="dg-note" x="312" y="228" dy="0.35em" text-anchor="middle">p = A x̂</text>
  <line class="dg-line dg-dashed" x1="420" y1="200" x2="420" y2="76" marker-end="url(#arrow)"/>
  <text class="dg-note" x="432" y="135" dy="0.35em" text-anchor="start">e = b − A x̂</text>
  <polyline class="dg-line" points="420,186 432,183 432,197"/>
  <text class="dg-note" x="432" y="290" dy="0.35em" text-anchor="middle">e is perpendicular to every column: Aᵀe = 0</text>
</svg>
