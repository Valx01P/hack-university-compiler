<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A vertical stretch 2f(x) and a horizontal squeeze f(2x) of f(x) = x(4 − x)</title>
  <desc>Both panels show f(x) = x(4 − x) dashed, a hump from (0, 0) to (4, 0) with its top at (2, 4). On the left, 2f(x) doubles every height, so its top is (2, 8) and its zeros stay at 0 and 4. On the right, f(2x) halves every x-coordinate, so its zeros are 0 and 2 and its top is (1, 4).</desc>
