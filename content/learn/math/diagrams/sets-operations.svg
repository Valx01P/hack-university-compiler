<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>Venn diagrams of the union, intersection, difference, and complement</title>
  <desc>Four boxes, each the universal set U with two overlapping circles A and B. In the first, both circles are shaded: A ∪ B. In the second, only the lens where they overlap is shaded: A ∩ B. In the third, only the part of A outside B is shaded: A \ B. In the fourth, everything in the box outside both circles is shaded: the complement of A ∪ B, which is also the complement of A intersected with the complement of B.</desc>
  <!-- A ∪ B -->
  <rect class="dg-box" x="20" y="20" width="300" height="150"/>
  <path class="dg-hot" d="M170 52.57 A55 55 0 1 0 170 137.43 A55 55 0 1 0 170 52.57 Z"/>
  <path class="dg-line" d="M20 20 H320 V170 H20 Z"/>
  <path class="dg-line" d="M80 95 A55 55 0 1 0 190 95 A55 55 0 1 0 80 95"/>
  <path class="dg-line" d="M150 95 A55 55 0 1 0 260 95 A55 55 0 1 0 150 95"/>
  <text x="82" y="44" dy="0.35em" text-anchor="middle">A</text>
  <text x="258" y="44" dy="0.35em" text-anchor="middle">B</text>
  <text x="304" y="154" dy="0.35em" text-anchor="middle">U</text>
  <text class="dg-code" x="170" y="192" dy="0.35em" text-anchor="middle">A ∪ B</text>
  <!-- A ∩ B -->
  <rect class="dg-box" x="360" y="20" width="300" height="150"/>
  <path class="dg-hot" d="M510 52.57 A55 55 0 0 0 510 137.43 A55 55 0 0 0 510 52.57 Z"/>
  <path class="dg-line" d="M360 20 H660 V170 H360 Z"/>
  <path class="dg-line" d="M420 95 A55 55 0 1 0 530 95 A55 55 0 1 0 420 95"/>
  <path class="dg-line" d="M490 95 A55 55 0 1 0 600 95 A55 55 0 1 0 490 95"/>
  <text x="422" y="44" dy="0.35em" text-anchor="middle">A</text>
  <text x="598" y="44" dy="0.35em" text-anchor="middle">B</text>
  <text x="644" y="154" dy="0.35em" text-anchor="middle">U</text>
  <text class="dg-code" x="510" y="192" dy="0.35em" text-anchor="middle">A ∩ B</text>
  <!-- A \ B -->
  <rect class="dg-box" x="20" y="220" width="300" height="150"/>
  <path class="dg-hot" d="M170 252.57 A55 55 0 1 0 170 337.43 A55 55 0 0 1 170 252.57 Z"/>
  <path class="dg-line" d="M20 220 H320 V370 H20 Z"/>
  <path class="dg-line" d="M80 295 A55 55 0 1 0 190 295 A55 55 0 1 0 80 295"/>
  <path class="dg-line" d="M150 295 A55 55 0 1 0 260 295 A55 55 0 1 0 150 295"/>
  <text x="82" y="244" dy="0.35em" text-anchor="middle">A</text>
  <text x="258" y="244" dy="0.35em" text-anchor="middle">B</text>
  <text x="304" y="354" dy="0.35em" text-anchor="middle">U</text>
  <text class="dg-code" x="170" y="392" dy="0.35em" text-anchor="middle">A \ B</text>
  <!-- (A ∪ B)ᶜ = Aᶜ ∩ Bᶜ -->
  <rect class="dg-box" x="360" y="220" width="300" height="150"/>
  <path class="dg-hot" d="M360 220 H660 V370 H360 Z M510 252.57 A55 55 0 1 0 510 337.43 A55 55 0 1 0 510 252.57 Z"/>
  <path class="dg-line" d="M360 220 H660 V370 H360 Z"/>
  <path class="dg-line" d="M420 295 A55 55 0 1 0 530 295 A55 55 0 1 0 420 295"/>
  <path class="dg-line" d="M490 295 A55 55 0 1 0 600 295 A55 55 0 1 0 490 295"/>
  <text class="dg-on-hot" x="422" y="244" dy="0.35em" text-anchor="middle">A</text>
  <text class="dg-on-hot" x="598" y="244" dy="0.35em" text-anchor="middle">B</text>
  <text class="dg-on-hot" x="644" y="354" dy="0.35em" text-anchor="middle">U</text>
  <text class="dg-code" x="510" y="392" dy="0.35em" text-anchor="middle">(A ∪ B)ᶜ = Aᶜ ∩ Bᶜ</text>
</svg>
