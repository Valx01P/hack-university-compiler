<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>An arithmetic and a geometric sequence plotted together</title>
  <desc>Points (n, aₙ) for n from 0 to 6. The arithmetic sequence 2 + 3n, plain dots, rises in equal steps along a dashed straight line from 2 to 20. The geometric sequence 2 · 1.5ⁿ, highlighted dots on a curve, starts at 2 and rises slowly at first, then faster, passing the line between n = 5 and n = 6 and reaching about 22.8.</desc>
  <!-- Axes -->
  <line class="dg-line" x1="60" y1="280" x2="620" y2="280" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="80" y1="300" x2="80" y2="20" marker-end="url(#arrow)"/>
  <text class="dg-note" x="616" y="300" dy="0.35em" text-anchor="end">n</text>
  <text class="dg-note" x="160" y="296" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="240" y="296" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="320" y="296" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-note" x="400" y="296" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="480" y="296" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-note" x="560" y="296" dy="0.35em" text-anchor="middle">6</text>
  <text class="dg-note" x="70" y="296" dy="0.35em" text-anchor="end">0</text>
  <line class="dg-line" x1="75" y1="227.5" x2="85" y2="227.5"/>
  <text class="dg-note" x="68" y="227.5" dy="0.35em" text-anchor="end">5</text>
  <line class="dg-line" x1="75" y1="175" x2="85" y2="175"/>
  <text class="dg-note" x="68" y="175" dy="0.35em" text-anchor="end">10</text>
  <line class="dg-line" x1="75" y1="122.5" x2="85" y2="122.5"/>
  <text class="dg-note" x="68" y="122.5" dy="0.35em" text-anchor="end">15</text>
  <line class="dg-line" x1="75" y1="70" x2="85" y2="70"/>
  <text class="dg-note" x="68" y="70" dy="0.35em" text-anchor="end">20</text>
  <!-- Arithmetic: the line 2 + 3n -->
  <line class="dg-line dg-dashed" x1="80" y1="259" x2="560" y2="70"/>
  <!-- Geometric: the curve 2 times 1.5 to the n -->
  <polyline class="dg-flow" points="80,259 88,258.1 96,257.2 104,256.3 112,255.3 120,254.3 128,253.2 136,252.1 144,251 152,249.8 160,248.5 168,247.2 176,245.8 184,244.4 192,243 200,241.4 208,239.8 216,238.2 224,236.4 232,234.6 240,232.8 248,230.8 256,228.8 264,226.6 272,224.4 280,222.1 288,219.7 296,217.2 304,214.6 312,211.9 320,209.1 328,206.2 336,203.1 344,200 352,196.6 360,193.2 368,189.6 376,185.9 384,182 392,177.9 400,173.7 408,169.3 416,164.7 424,159.9 432,155 440,149.8 448,144.4 456,138.8 464,133 472,126.9 480,120.5 488,113.9 496,107.1 504,99.9 512,92.5 520,84.7 528,76.6 536,68.2 544,59.4 552,50.3 560,40.8"/>
  <circle class="dg-box" cx="80" cy="259" r="5"/>
  <circle class="dg-box" cx="160" cy="227.5" r="5"/>
  <circle class="dg-box" cx="240" cy="196" r="5"/>
  <circle class="dg-box" cx="320" cy="164.5" r="5"/>
  <circle class="dg-box" cx="400" cy="133" r="5"/>
  <circle class="dg-box" cx="480" cy="101.5" r="5"/>
  <circle class="dg-box" cx="560" cy="70" r="5"/>
  <circle class="dg-hot" cx="80" cy="259" r="5"/>
  <circle class="dg-hot" cx="160" cy="248.5" r="5"/>
  <circle class="dg-hot" cx="240" cy="232.8" r="5"/>
  <circle class="dg-hot" cx="320" cy="209.1" r="5"/>
  <circle class="dg-hot" cx="400" cy="173.7" r="5"/>
  <circle class="dg-hot" cx="480" cy="120.5" r="5"/>
  <circle class="dg-hot" cx="560" cy="40.8" r="5"/>
  <text x="574" y="78" dy="0.35em">2 + 3n</text>
  <text x="550" y="40.8" dy="0.35em" text-anchor="end">2 · 1.5ⁿ</text>
  <text class="dg-note" x="200" y="60" dy="0.35em">arithmetic: add 3 each step, a straight line</text>
  <text class="dg-note" x="200" y="80" dy="0.35em">geometric: multiply by 1.5 each step, a curve</text>
</svg>
