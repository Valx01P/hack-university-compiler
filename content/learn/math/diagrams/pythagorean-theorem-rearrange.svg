<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Two squares of side a + b, filled two ways with four copies of a right triangle</title>
  <desc>Two equal squares, each with side a + b. In the left one, four copies of a right triangle with legs a and b sit in the corners, and their hypotenuses enclose a tilted square of area c². In the right one, the same four triangles pair up into two a by b rectangles, leaving a square of area a² and a square of area b². The big squares are equal and the triangles are the same, so the leftover areas are equal: c² = a² + b².</desc>
  <polygon class="dg-box" points="40,60 130,60 40,180"/>
  <polygon class="dg-box" points="250,60 250,150 130,60"/>
  <polygon class="dg-box" points="250,270 160,270 250,150"/>
  <polygon class="dg-box" points="40,270 40,180 160,270"/>
  <polygon class="dg-hot" points="130,60 250,150 160,270 40,180"/>
  <text class="dg-on-hot" x="145" y="165" dy="0.35em" text-anchor="middle">c²</text>
  <text class="dg-note" x="85" y="46" dy="0.35em" text-anchor="middle">a</text>
  <text class="dg-note" x="190" y="46" dy="0.35em" text-anchor="middle">b</text>
  <text class="dg-note" x="28" y="120" dy="0.35em" text-anchor="middle">b</text>
  <text class="dg-note" x="28" y="225" dy="0.35em" text-anchor="middle">a</text>
  <text class="dg-note" x="200" y="93" dy="0.35em" text-anchor="middle">c</text>
  <rect class="dg-box" x="520" y="60" width="120" height="90"/>
  <line class="dg-line" x1="520" y1="150" x2="640" y2="60"/>
  <rect class="dg-box" x="430" y="150" width="90" height="120"/>
  <line class="dg-line" x1="430" y1="270" x2="520" y2="150"/>
  <rect class="dg-hot" x="430" y="60" width="90" height="90"/>
  <text class="dg-on-hot" x="475" y="105" dy="0.35em" text-anchor="middle">a²</text>
  <rect class="dg-hot" x="520" y="150" width="120" height="120"/>
  <text class="dg-on-hot" x="580" y="210" dy="0.35em" text-anchor="middle">b²</text>
  <text class="dg-note" x="475" y="46" dy="0.35em" text-anchor="middle">a</text>
  <text class="dg-note" x="580" y="46" dy="0.35em" text-anchor="middle">b</text>
  <text class="dg-note" x="652" y="105" dy="0.35em" text-anchor="middle">a</text>
  <text class="dg-note" x="652" y="210" dy="0.35em" text-anchor="middle">b</text>
  <text class="dg-code" x="145" y="296" dy="0.35em" text-anchor="middle">(a + b)² = c² + 4 · ½ab</text>
  <text class="dg-code" x="535" y="296" dy="0.35em" text-anchor="middle">(a + b)² = a² + b² + 4 · ½ab</text>
  <text class="dg-note" x="340" y="326" dy="0.35em" text-anchor="middle">same square, same four triangles, so c² = a² + b²</text>
</svg>
