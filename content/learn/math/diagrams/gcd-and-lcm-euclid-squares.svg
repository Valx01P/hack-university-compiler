<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Euclid's algorithm as cutting squares from a 21 by 15 rectangle</title>
  <desc>A 21 by 15 rectangle. One 15 by 15 square is cut off, leaving a 6 by 15 strip. Two 6 by 6 squares are cut from the strip, leaving a 6 by 3 piece, which two 3 by 3 squares fill exactly. So 3 by 3 squares tile the whole rectangle, and gcd(21, 15) = 3. Beside it, the three divisions: 21 = 15 × 1 + 6, 15 = 6 × 2 + 3, and 6 = 3 × 2 + 0.</desc>
  <rect class="dg-box" x="40" y="20" width="300" height="300"/>
  <text x="190.0" y="170.0" dy="0.35em" text-anchor="middle">15 × 15</text>
  <rect class="dg-box" x="340" y="20" width="120" height="120"/>
  <text x="400" y="80" dy="0.35em" text-anchor="middle">6 × 6</text>
  <rect class="dg-box" x="340" y="140" width="120" height="120"/>
  <text x="400" y="200" dy="0.35em" text-anchor="middle">6 × 6</text>
  <rect class="dg-hot" x="340" y="260" width="120" height="60"/>
  <line class="dg-line" x1="400" y1="260" x2="400" y2="320"/>
  <text class="dg-on-hot" x="370.0" y="290.0" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-on-hot" x="430.0" y="290.0" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="500" y="70" dy="0.35em">21 = 15 × 1 + 6</text>
  <text class="dg-code" x="500" y="170" dy="0.35em">15 = 6 × 2 + 3</text>
  <text class="dg-code" x="500" y="270" dy="0.35em">6 = 3 × 2 + 0</text>
  <text class="dg-heading" x="500" y="300" dy="0.35em">gcd = 3</text>
</svg>
