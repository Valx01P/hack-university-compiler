<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <title>Ten donuts from four flavors as stars and bars</title>
  <desc>A row of 13 numbered spots holding 10 highlighted stars and 3 bars. The bars split the stars into four groups: 3 stars for flavor 1, 2 for flavor 2, none for flavor 3 between two bars side by side, and 5 for flavor 4. Every choice of donuts is one such row, so the count is the number of ways to place the 3 bars among 13 spots, C(13, 3) = 286.</desc>
  <!-- 13 spots: 10 stars and 3 bars -->
  <text class="dg-note" x="70" y="124" dy="0.35em" text-anchor="middle">1</text>
  <circle class="dg-hot" cx="70" cy="80" r="13"/>
  <text class="dg-note" x="112" y="124" dy="0.35em" text-anchor="middle">2</text>
  <circle class="dg-hot" cx="112" cy="80" r="13"/>
  <text class="dg-note" x="154" y="124" dy="0.35em" text-anchor="middle">3</text>
  <circle class="dg-hot" cx="154" cy="80" r="13"/>
  <text class="dg-note" x="196" y="124" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="196" y1="54" x2="196" y2="106"/>
  <text class="dg-note" x="238" y="124" dy="0.35em" text-anchor="middle">5</text>
  <circle class="dg-hot" cx="238" cy="80" r="13"/>
  <text class="dg-note" x="280" y="124" dy="0.35em" text-anchor="middle">6</text>
  <circle class="dg-hot" cx="280" cy="80" r="13"/>
  <text class="dg-note" x="322" y="124" dy="0.35em" text-anchor="middle">7</text>
  <line class="dg-line" x1="322" y1="54" x2="322" y2="106"/>
  <text class="dg-note" x="364" y="124" dy="0.35em" text-anchor="middle">8</text>
  <line class="dg-line" x1="364" y1="54" x2="364" y2="106"/>
  <text class="dg-note" x="406" y="124" dy="0.35em" text-anchor="middle">9</text>
  <circle class="dg-hot" cx="406" cy="80" r="13"/>
  <text class="dg-note" x="448" y="124" dy="0.35em" text-anchor="middle">10</text>
  <circle class="dg-hot" cx="448" cy="80" r="13"/>
  <text class="dg-note" x="490" y="124" dy="0.35em" text-anchor="middle">11</text>
  <circle class="dg-hot" cx="490" cy="80" r="13"/>
  <text class="dg-note" x="532" y="124" dy="0.35em" text-anchor="middle">12</text>
  <circle class="dg-hot" cx="532" cy="80" r="13"/>
  <text class="dg-note" x="574" y="124" dy="0.35em" text-anchor="middle">13</text>
  <circle class="dg-hot" cx="574" cy="80" r="13"/>
  <text x="112" y="158" dy="0.35em" text-anchor="middle">flavor 1: 3</text>
  <text x="259" y="158" dy="0.35em" text-anchor="middle">flavor 2: 2</text>
  <text class="dg-note" x="343" y="158" dy="0.35em" text-anchor="middle">flavor 3: 0</text>
  <text x="490" y="158" dy="0.35em" text-anchor="middle">flavor 4: 5</text>
  <text class="dg-note" x="340" y="210" dy="0.35em" text-anchor="middle">choose which 3 of the 13 spots hold bars: C(13, 3) = 286</text>
</svg>
