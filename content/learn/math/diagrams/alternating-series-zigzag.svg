<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Partial sums of the alternating harmonic series zigzag toward ln 2</title>
  <desc>The partial sums s1 to s12 of 1 − 1/2 + 1/3 − 1/4 and so on, plotted against n. The odd sums sit above a dashed line at ln 2, about 0.693, and fall. The even sums sit below it and rise. Each jump is smaller than the one before, so the zigzag closes in on ln 2.</desc>
  <line class="dg-line" x1="80" y1="290" x2="650" y2="290" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="80" y1="296" x2="80" y2="20" marker-end="url(#arrow)"/>
  <text class="dg-note" x="658" y="290" dy="0.35em">n</text>
  <text class="dg-note" x="80" y="12" text-anchor="middle">sₙ</text>
  <line class="dg-line" x1="123.1" y1="285" x2="123.1" y2="295"/>
  <text class="dg-note" x="123.1" y="308" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="166.2" y1="285" x2="166.2" y2="295"/>
  <text class="dg-note" x="166.2" y="308" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="209.2" y1="285" x2="209.2" y2="295"/>
  <text class="dg-note" x="209.2" y="308" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="252.3" y1="285" x2="252.3" y2="295"/>
  <text class="dg-note" x="252.3" y="308" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="295.4" y1="285" x2="295.4" y2="295"/>
  <text class="dg-note" x="295.4" y="308" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="338.5" y1="285" x2="338.5" y2="295"/>
  <text class="dg-note" x="338.5" y="308" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="381.5" y1="285" x2="381.5" y2="295"/>
  <text class="dg-note" x="381.5" y="308" dy="0.35em" text-anchor="middle">7</text>
  <line class="dg-line" x1="424.6" y1="285" x2="424.6" y2="295"/>
  <text class="dg-note" x="424.6" y="308" dy="0.35em" text-anchor="middle">8</text>
  <line class="dg-line" x1="467.7" y1="285" x2="467.7" y2="295"/>
  <text class="dg-note" x="467.7" y="308" dy="0.35em" text-anchor="middle">9</text>
  <line class="dg-line" x1="510.8" y1="285" x2="510.8" y2="295"/>
  <text class="dg-note" x="510.8" y="308" dy="0.35em" text-anchor="middle">10</text>
  <line class="dg-line" x1="553.8" y1="285" x2="553.8" y2="295"/>
  <text class="dg-note" x="553.8" y="308" dy="0.35em" text-anchor="middle">11</text>
  <line class="dg-line" x1="596.9" y1="285" x2="596.9" y2="295"/>
  <text class="dg-note" x="596.9" y="308" dy="0.35em" text-anchor="middle">12</text>
  <line class="dg-line" x1="75" y1="250.6" x2="85" y2="250.6"/>
  <text class="dg-note" x="70" y="250.6" dy="0.35em" text-anchor="end">0.5</text>
  <line class="dg-line" x1="75" y1="53.6" x2="85" y2="53.6"/>
  <text class="dg-note" x="70" y="53.6" dy="0.35em" text-anchor="end">1</text>
  <!-- the sum ln 2 -->
  <line class="dg-line dg-dashed" x1="80" y1="174.5" x2="631.4" y2="174.5"/>
  <text class="dg-note" x="70" y="174.5" dy="0.35em" text-anchor="end">ln 2</text>
  <!-- the zigzag of partial sums -->
  <polyline class="dg-flow" points="123.1,53.6 166.2,250.6 209.2,119.3 252.3,217.8 295.4,139 338.5,204.6 381.5,148.4 424.6,197.6 467.7,153.8 510.8,193.2 553.8,157.4 596.9,190.3"/>
  <circle class="dg-hot" cx="123.1" cy="53.6" r="4.5"/>
  <circle class="dg-hot" cx="166.2" cy="250.6" r="4.5"/>
  <circle class="dg-hot" cx="209.2" cy="119.3" r="4.5"/>
  <circle class="dg-hot" cx="252.3" cy="217.8" r="4.5"/>
  <circle class="dg-hot" cx="295.4" cy="139" r="4.5"/>
  <circle class="dg-hot" cx="338.5" cy="204.6" r="4.5"/>
  <circle class="dg-hot" cx="381.5" cy="148.4" r="4.5"/>
  <circle class="dg-hot" cx="424.6" cy="197.6" r="4.5"/>
  <circle class="dg-hot" cx="467.7" cy="153.8" r="4.5"/>
  <circle class="dg-hot" cx="510.8" cy="193.2" r="4.5"/>
  <circle class="dg-hot" cx="553.8" cy="157.4" r="4.5"/>
  <circle class="dg-hot" cx="596.9" cy="190.3" r="4.5"/>
  <text x="133.1" y="53.6" dy="0.35em" text-anchor="start">s₁ = 1</text>
  <text x="176.2" y="258.6" dy="0.35em" text-anchor="start">s₂ = 0.5</text>
  <text x="219.2" y="113.3" dy="0.35em" text-anchor="start">s₃ ≈ 0.833</text>
</svg>
