<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>The region inside the circle r = 3 sin θ and outside the cardioid r = 1 + sin θ</title>
  <desc>The circle r = 3 sin θ and the cardioid r = 1 + sin θ cross where sin θ = 1/2, at θ = π/6 and 5π/6. The shaded region between them lies inside the circle and outside the cardioid, above those two crossing points, and its area is π. For each angle between π/6 and 5π/6 its slice runs from the cardioid out to the circle.</desc>
