<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>y = 2ˣ grows and y = (1/2)ˣ decays, both through (0, 1) and above the x-axis</title>
  <desc>Two curves crossing the y-axis at (0, 1). y = 2ˣ rises to the right through (1, 2) and (2, 4) and flattens toward the x-axis on the left. y = (1/2)ˣ is its mirror image across the y-axis: it rises to the left through (−1, 2) and (−2, 4) and flattens toward the x-axis on the right. Neither curve ever touches the x-axis, the horizontal asymptote y = 0.</desc>
