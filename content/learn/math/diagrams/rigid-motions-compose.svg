<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>Two reflections in a row make a rotation, and the order matters</title>
  <desc>Left: P(3, 1) reflected across the x-axis goes to (3, −1), and that point reflected across the line y = x goes to (−1, 3), which is P turned a quarter turn counterclockwise. Right: the other order, across y = x first to (1, 3) and then across the x-axis to (1, −3), turns P a quarter turn clockwise instead.</desc>
  <line class="dg-line" x1="35" y1="190" x2="305" y2="190" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="170" y1="325" x2="170" y2="55" marker-end="url(#arrow)"/>
  <text class="dg-note" x="309" y="204" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="178" y="61" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-line dg-dashed" x1="44" y1="316" x2="296" y2="64"/>
  <text class="dg-note" x="299" y="79" dy="0.35em" text-anchor="start">y = x</text>
  <line class="dg-line dg-dashed" x1="260" y1="160" x2="260" y2="220"/>
  <line class="dg-line dg-dashed" x1="260" y1="220" x2="140" y2="100"/>
  <polyline class="dg-flow" points="256.6,151.2 254.5,146.9 252.2,142.7 249.8,138.7 247.1,134.7 244.2,130.9 241.2,127.3 238,123.8 234.6,120.5 231,117.4 227.3,114.4 223.5,111.6 219.5,109.1 215.4,106.7 211.1,104.5 206.8,102.6 202.4,100.8 197.9,99.3 193.3,98 188.7,97 184,96.2 179.3,95.6 174.6,95.2 169.8,95.1 165.1,95.3 160.4,95.6 155.7,96.2 151,97.1" marker-end="url(#arrow-flow)"/>
  <circle class="dg-hot" cx="260" cy="160" r="5"/>
  <circle class="dg-box" cx="260" cy="220" r="4"/>
  <circle class="dg-hot" cx="140" cy="100" r="5"/>
  <text x="269" y="152.5" dy="0.35em" text-anchor="start">P(3, 1)</text>
  <text class="dg-note" x="269" y="230.5" dy="0.35em" text-anchor="start">(3, −1)</text>
  <text x="131" y="91" dy="0.35em" text-anchor="end">(−1, 3)</text>
  <text class="dg-heading" x="170" y="335" dy="0.35em" text-anchor="middle">x-axis, then y = x: a 90° turn</text>
  <line class="dg-line" x1="375" y1="190" x2="645" y2="190" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="510" y1="325" x2="510" y2="55" marker-end="url(#arrow)"/>
  <text class="dg-note" x="649" y="204" dy="0.35em" text-anchor="end">x</text>
  <text class="dg-note" x="518" y="61" dy="0.35em" text-anchor="start">y</text>
  <line class="dg-line dg-dashed" x1="384" y1="316" x2="636" y2="64"/>
  <text class="dg-note" x="639" y="79" dy="0.35em" text-anchor="start">y = x</text>
  <line class="dg-line dg-dashed" x1="600" y1="160" x2="540" y2="100"/>
  <line class="dg-line dg-dashed" x1="540" y1="100" x2="540" y2="280"/>
  <polyline class="dg-flow" points="602.5,169.1 603.5,173.8 604.2,178.5 604.6,183.2 604.8,187.9 604.8,192.7 604.6,197.4 604.1,202.2 603.4,206.8 602.4,211.5 601.2,216.1 599.8,220.6 598.1,225.1 596.3,229.4 594.2,233.7 591.9,237.9 589.4,241.9 586.7,245.8 583.8,249.6 580.8,253.2 577.5,256.6 574.1,259.9 570.5,263.1 566.8,266 562.9,268.7 558.9,271.3 554.8,273.6 550.6,275.8" marker-end="url(#arrow-flow)"/>
  <circle class="dg-hot" cx="600" cy="160" r="5"/>
  <circle class="dg-box" cx="540" cy="100" r="4"/>
  <circle class="dg-hot" cx="540" cy="280" r="5"/>
  <text x="609" y="152.5" dy="0.35em" text-anchor="start">P(3, 1)</text>
  <text class="dg-note" x="549" y="89.5" dy="0.35em" text-anchor="start">(1, 3)</text>
  <text x="531" y="290.5" dy="0.35em" text-anchor="end">(1, −3)</text>
  <text class="dg-heading" x="510" y="335" dy="0.35em" text-anchor="middle">y = x, then x-axis: a −90° turn</text>
</svg>
