<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The parabola y = x² − 6x + 5 with its vertex, y-intercept, and mirror point</title>
  <desc>The parabola y = x² − 6x + 5 opens up with its vertex at (3, −4), on the dashed axis of symmetry x = 3. It crosses the y-axis at (0, 5), and the mirror image of that point across the axis is (6, 5), at the same height and twice as far along as the axis.</desc>
