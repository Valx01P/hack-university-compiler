<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The mean value theorem for x³ − x on [0, 2]</title>
  <desc>The curve y = x³ − x from x = 0 to x = 2, with the secant line through its ends (0, 0) and (2, 6), of slope 3. At c, about 1.155, a dashed tangent line touches the curve with the same slope 3, parallel to the secant. That point is where the curve is farthest below the secant.</desc>
