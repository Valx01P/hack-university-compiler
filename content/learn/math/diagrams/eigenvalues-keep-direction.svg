<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A = [[2, 1], [1, 2]] keeps two directions and turns the rest</title>
  <desc>Left, four vectors before A acts: (1, 1), (−1, 1), (1, 0), and (0, 1). Right, after: (1, 1) becomes (3, 3), three times as long on the same line, and (−1, 1) stays (−1, 1). Those two are eigenvectors, with eigenvalues 3 and 1. But (1, 0) turns to (2, 1) and (0, 1) turns to (1, 2), off their lines, so they are not eigenvectors.</desc>
  <line class="dg-line" x1="46.8" y1="240" x2="306.8" y2="240" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="130" y1="260.8" x2="130" y2="52.8" marker-end="url(#arrow)"/>
  <text class="dg-note" x="304.8" y="254" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="142" y="56.8" dy="0.35em" text-anchor="middle">y</text>
  <text class="dg-heading" x="170" y="300" dy="0.35em" text-anchor="middle">before</text>
  <line class="dg-line dg-dashed" x1="57.2" y1="167.2" x2="150.8" y2="260.8"/>
  <line class="dg-line dg-dashed" x1="114.4" y1="255.6" x2="301.6" y2="68.4"/>
  <line class="dg-flow" x1="130" y1="240" x2="178.4" y2="191.6" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="130" y1="240" x2="81.6" y2="191.6" marker-end="url(#arrow-flow)"/>
  <line class="dg-line" x1="130" y1="240" x2="178.4" y2="240" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="130" y1="240" x2="130" y2="191.6" marker-end="url(#arrow)"/>
  <text class="dg-note" x="189.8" y="195.8" dy="0.35em" text-anchor="start">(1, 1)</text>
  <text class="dg-note" x="70.2" y="203.6" dy="0.35em" text-anchor="end">(−1, 1)</text>
  <text class="dg-note" x="184.6" y="253" dy="0.35em" text-anchor="start">(1, 0)</text>
  <text class="dg-note" x="136.2" y="180.2" dy="0.35em" text-anchor="start">(0, 1)</text>
  <line class="dg-line" x1="386.8" y1="240" x2="646.8" y2="240" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="470" y1="260.8" x2="470" y2="52.8" marker-end="url(#arrow)"/>
  <text class="dg-note" x="644.8" y="254" dy="0.35em" text-anchor="middle">x</text>
  <text class="dg-note" x="482" y="56.8" dy="0.35em" text-anchor="middle">y</text>
  <text class="dg-heading" x="510" y="300" dy="0.35em" text-anchor="middle">after A acts</text>
  <line class="dg-line dg-dashed" x1="397.2" y1="167.2" x2="490.8" y2="260.8"/>
  <line class="dg-line dg-dashed" x1="454.4" y1="255.6" x2="641.6" y2="68.4"/>
  <line class="dg-flow" x1="470" y1="240" x2="623.4" y2="86.6" marker-end="url(#arrow-flow)"/>
  <line class="dg-flow" x1="470" y1="240" x2="421.6" y2="191.6" marker-end="url(#arrow-flow)"/>
  <line class="dg-line" x1="470" y1="240" x2="571.4" y2="189.6" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="470" y1="240" x2="520.4" y2="138.6" marker-end="url(#arrow)"/>
  <text class="dg-note" x="613" y="71" dy="0.35em" text-anchor="end">3(1, 1)</text>
  <text class="dg-note" x="410.2" y="203.6" dy="0.35em" text-anchor="end">1(−1, 1)</text>
  <text class="dg-note" x="579.2" y="195.8" dy="0.35em" text-anchor="start">(2, 1)</text>
  <text class="dg-note" x="509" y="125.6" dy="0.35em" text-anchor="end">(1, 2)</text>
</svg>
