<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Solving a right triangle from its hypotenuse and one angle</title>
  <desc>A right triangle with hypotenuse 10 and an acute angle of 35° at the left corner. The opposite leg a is 10 sin 35°, about 5.74, and the adjacent leg b is 10 cos 35°, about 8.19. The third angle is 90° − 35° = 55°.</desc>
  <polygon class="dg-box" points="150,255 428.5,255 428.5,60"/>
  <path class="dg-line" d="M416.5116950582572 255 V243 H428.5116950582572"/>
  <polyline class="dg-line" points="196,255 196,253.6 195.9,252.2 195.8,250.8 195.7,249.4 195.5,248 195.2,246.6 195,245.2 194.6,243.9 194.3,242.5 193.9,241.2 193.4,239.8 192.9,238.5 192.4,237.2 191.9,235.9 191.3,234.7 190.6,233.4 189.9,232.2 189.2,231 188.5,229.8 187.7,228.6"/>
  <text x="204" y="241" dy="0.35em" text-anchor="start">35°</text>
  <text x="418.5" y="96" dy="0.35em" text-anchor="end">55°</text>
  <text class="dg-code" x="277.3" y="145.5" dy="0.35em" text-anchor="end">c = 10</text>
  <text class="dg-code" x="440.5" y="157.5" dy="0.35em" text-anchor="start">a = 10 sin 35° ≈ 5.74</text>
  <text class="dg-code" x="289.3" y="275" dy="0.35em" text-anchor="middle">b = 10 cos 35° ≈ 8.19</text>
</svg>
