<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200">
  <title>The numbers within 5 of 3 form the interval (−2, 8)</title>
  <desc>A number line from −4 to 10 with a highlighted dot at 3. Arrows of length 5 reach left to −2 and right to 8, and the stretch between them is shaded with hollow dots at both ends. So |x − 3| &lt; 5 means −2 &lt; x &lt; 8, the numbers less than 5 away from 3.</desc>
  <line class="dg-line" x1="36" y1="150" x2="648" y2="150" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="624" y1="150" x2="32" y2="150" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="60" y1="143" x2="60" y2="157"/>
  <text x="60" y="174" dy="0.35em" text-anchor="middle">−4</text>
  <line class="dg-line" x1="100" y1="143" x2="100" y2="157"/>
  <text x="100" y="174" dy="0.35em" text-anchor="middle">−3</text>
  <line class="dg-line" x1="140" y1="143" x2="140" y2="157"/>
  <text x="140" y="174" dy="0.35em" text-anchor="middle">−2</text>
  <line class="dg-line" x1="180" y1="143" x2="180" y2="157"/>
  <text x="180" y="174" dy="0.35em" text-anchor="middle">−1</text>
  <line class="dg-line" x1="220" y1="143" x2="220" y2="157"/>
  <text x="220" y="174" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line" x1="260" y1="143" x2="260" y2="157"/>
  <text x="260" y="174" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="300" y1="143" x2="300" y2="157"/>
  <text x="300" y="174" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="340" y1="143" x2="340" y2="157"/>
  <text x="340" y="174" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="380" y1="143" x2="380" y2="157"/>
  <text x="380" y="174" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="420" y1="143" x2="420" y2="157"/>
  <text x="420" y="174" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="460" y1="143" x2="460" y2="157"/>
  <text x="460" y="174" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="500" y1="143" x2="500" y2="157"/>
  <text x="500" y="174" dy="0.35em" text-anchor="middle">7</text>
  <line class="dg-line" x1="540" y1="143" x2="540" y2="157"/>
  <text x="540" y="174" dy="0.35em" text-anchor="middle">8</text>
  <line class="dg-line" x1="580" y1="143" x2="580" y2="157"/>
  <text x="580" y="174" dy="0.35em" text-anchor="middle">9</text>
  <line class="dg-line" x1="620" y1="143" x2="620" y2="157"/>
  <text x="620" y="174" dy="0.35em" text-anchor="middle">10</text>
  <rect class="dg-hot" x="140" y="145" width="400" height="10" rx="5"/>
  <circle class="dg-box" cx="140" cy="150" r="7"/>
  <circle class="dg-box" cx="540" cy="150" r="7"/>
  <circle class="dg-hot" cx="340" cy="150" r="7"/>
  <!-- The two distances of 5 from the center. -->
  <line class="dg-line" x1="340" y1="104" x2="144" y2="104" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="104" x2="536" y2="104" marker-end="url(#arrow)"/>
  <line class="dg-line" x1="340" y1="96" x2="340" y2="136"/>
  <text x="240" y="84" dy="0.35em" text-anchor="middle">5</text>
  <text x="440" y="84" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-code" x="340" y="40" dy="0.35em" text-anchor="middle">|x − 3| &lt; 5  means  −2 &lt; x &lt; 8</text>
</svg>
