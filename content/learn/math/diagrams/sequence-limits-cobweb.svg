<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <title>A staircase showing a(n+1) = √(2 + aₙ) climbing to its fixed point 2</title>
  <desc>The curve y = √(2 + x) and the line y = x cross at (2, 2), the fixed point. Starting at a₀ = 0, a staircase goes up to the curve, giving a₁ = √2, across to the line, up to the curve again for a₂, and so on. The steps shrink as they approach the crossing point, so the terms increase toward 2.</desc>
