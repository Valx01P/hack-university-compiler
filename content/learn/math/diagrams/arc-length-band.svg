<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A piece of a curve spun around the x-axis into a thin band</title>
  <desc>A curve y = f(x) above the x-axis and its mirror image below outline a surface of revolution. A short piece of the curve, of length Δs, at height f(x), spins into a thin highlighted band around the axis. Unrolled, the band is about 2π f(x) long and Δs wide, so its area is about 2π f(x) Δs.</desc>
