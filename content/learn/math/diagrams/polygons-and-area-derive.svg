<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Each area formula from the one before: parallelogram, triangle, trapezoid</title>
  <desc>Three panels. First, a parallelogram with base b and height h: a right triangle cut off its left end slides to the right end and makes a b by h rectangle, so its area is bh. Second, a triangle and a copy turned half a turn fit together into a parallelogram with base b and height h, so the triangle is half of bh. Third, a trapezoid with bases b₁ and b₂ and a turned copy make a parallelogram with base b₁ + b₂, so the trapezoid is half of (b₁ + b₂)h.</desc>
  <polygon class="dg-hot" points="70,120 30,210 70,210"/>
  <polygon class="dg-box" points="70,210 160,210 200,120 70,120"/>
  <polygon class="dg-off" points="160,210 200,210 200,120"/>
  <line class="dg-line dg-dashed" x1="70" y1="120" x2="70" y2="210"/>
  <polyline class="dg-line" points="80,210 80,200 70,200"/>
  <path class="dg-flow" d="M48 232 H182" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="110" y="250" dy="0.35em" text-anchor="middle">slide the cut-off piece</text>
  <text class="dg-note" x="82" y="165" dy="0.35em" text-anchor="middle">h</text>
  <text class="dg-note" x="135" y="108" dy="0.35em" text-anchor="middle">b</text>
  <text class="dg-heading" x="115" y="40" dy="0.35em" text-anchor="middle">parallelogram</text>
  <text class="dg-code" x="115" y="270" dy="0.35em" text-anchor="middle">A = bh</text>
  <polygon class="dg-hot" points="250,210 380,210 290,120"/>
  <polygon class="dg-off" points="380,210 420,120 290,120"/>
  <line class="dg-line dg-dashed" x1="290" y1="120" x2="290" y2="210"/>
  <polyline class="dg-line" points="300,210 300,200 290,200"/>
  <text class="dg-note" x="302" y="185" dy="0.35em" text-anchor="middle">h</text>
  <text class="dg-note" x="315" y="228" dy="0.35em" text-anchor="middle">b</text>
  <text class="dg-heading" x="335" y="40" dy="0.35em" text-anchor="middle">triangle</text>
  <text class="dg-code" x="335" y="270" dy="0.35em" text-anchor="middle">A = ½bh</text>
  <polygon class="dg-hot" points="470,210 570,210 540,120 490,120"/>
  <polygon class="dg-off" points="570,210 620,210 640,120 540,120"/>
  <text class="dg-note" x="520" y="228" dy="0.35em" text-anchor="middle">b₂</text>
  <text class="dg-note" x="515" y="108" dy="0.35em" text-anchor="middle">b₁</text>
  <text class="dg-faint" x="595" y="228" dy="0.35em" text-anchor="middle">b₁</text>
  <text class="dg-faint" x="590" y="108" dy="0.35em" text-anchor="middle">b₂</text>
  <line class="dg-line dg-dashed" x1="490" y1="120" x2="490" y2="210"/>
  <text class="dg-note" x="502" y="185" dy="0.35em" text-anchor="middle">h</text>
  <text class="dg-heading" x="555" y="40" dy="0.35em" text-anchor="middle">trapezoid</text>
  <text class="dg-code" x="555" y="270" dy="0.35em" text-anchor="middle">A = ½(b₁ + b₂)h</text>
</svg>
