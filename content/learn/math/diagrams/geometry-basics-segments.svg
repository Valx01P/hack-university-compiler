<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220">
  <title>Segment addition and the midpoint on a numbered line</title>
  <desc>A line numbered like a ruler from −4 to 12. Point A is at −3, B at 2, and C at 11. Brackets above the line show AB = 5 and BC = 9, and a bracket below shows AC = 14, so AB + BC = AC because B is between A and C. The midpoint M of segment AC is marked at 4, halfway, with AM = MC = 7.</desc>
  <line class="dg-line" x1="40" y1="110" x2="640" y2="110"/>
  <line class="dg-line" x1="60" y1="104" x2="60" y2="116"/>
  <text class="dg-note" x="60" y="132" dy="0.35em" text-anchor="middle">−4</text>
  <line class="dg-line" x1="95" y1="104" x2="95" y2="116"/>
  <text class="dg-note" x="95" y="132" dy="0.35em" text-anchor="middle">−3</text>
  <line class="dg-line" x1="130" y1="104" x2="130" y2="116"/>
  <text class="dg-note" x="130" y="132" dy="0.35em" text-anchor="middle">−2</text>
  <line class="dg-line" x1="165" y1="104" x2="165" y2="116"/>
  <text class="dg-note" x="165" y="132" dy="0.35em" text-anchor="middle">−1</text>
  <line class="dg-line" x1="200" y1="104" x2="200" y2="116"/>
  <text class="dg-note" x="200" y="132" dy="0.35em" text-anchor="middle">0</text>
  <line class="dg-line" x1="235" y1="104" x2="235" y2="116"/>
  <text class="dg-note" x="235" y="132" dy="0.35em" text-anchor="middle">1</text>
  <line class="dg-line" x1="270" y1="104" x2="270" y2="116"/>
  <text class="dg-note" x="270" y="132" dy="0.35em" text-anchor="middle">2</text>
  <line class="dg-line" x1="305" y1="104" x2="305" y2="116"/>
  <text class="dg-note" x="305" y="132" dy="0.35em" text-anchor="middle">3</text>
  <line class="dg-line" x1="340" y1="104" x2="340" y2="116"/>
  <text class="dg-note" x="340" y="132" dy="0.35em" text-anchor="middle">4</text>
  <line class="dg-line" x1="375" y1="104" x2="375" y2="116"/>
  <text class="dg-note" x="375" y="132" dy="0.35em" text-anchor="middle">5</text>
  <line class="dg-line" x1="410" y1="104" x2="410" y2="116"/>
  <text class="dg-note" x="410" y="132" dy="0.35em" text-anchor="middle">6</text>
  <line class="dg-line" x1="445" y1="104" x2="445" y2="116"/>
  <text class="dg-note" x="445" y="132" dy="0.35em" text-anchor="middle">7</text>
  <line class="dg-line" x1="480" y1="104" x2="480" y2="116"/>
  <text class="dg-note" x="480" y="132" dy="0.35em" text-anchor="middle">8</text>
  <line class="dg-line" x1="515" y1="104" x2="515" y2="116"/>
  <text class="dg-note" x="515" y="132" dy="0.35em" text-anchor="middle">9</text>
  <line class="dg-line" x1="550" y1="104" x2="550" y2="116"/>
  <text class="dg-note" x="550" y="132" dy="0.35em" text-anchor="middle">10</text>
  <line class="dg-line" x1="585" y1="104" x2="585" y2="116"/>
  <text class="dg-note" x="585" y="132" dy="0.35em" text-anchor="middle">11</text>
  <line class="dg-line" x1="620" y1="104" x2="620" y2="116"/>
  <text class="dg-note" x="620" y="132" dy="0.35em" text-anchor="middle">12</text>
  <line class="dg-flow" x1="95" y1="110" x2="585" y2="110"/>
  <circle class="dg-strong" cx="95" cy="110" r="5"/>
  <text class="dg-heading" x="95" y="88" dy="0.35em" text-anchor="middle">A</text>
  <circle class="dg-strong" cx="270" cy="110" r="5"/>
  <text class="dg-heading" x="270" y="88" dy="0.35em" text-anchor="middle">B</text>
  <circle class="dg-strong" cx="585" cy="110" r="5"/>
  <text class="dg-heading" x="585" y="88" dy="0.35em" text-anchor="middle">C</text>
  <circle class="dg-hot" cx="340" cy="110" r="5"/>
  <text class="dg-heading" x="340" y="88" dy="0.35em" text-anchor="middle">M</text>
  <polyline class="dg-line" points="95,66 95,58 270,58 270,66"/>
  <text class="dg-code" x="182.5" y="44" dy="0.35em" text-anchor="middle">AB = 5</text>
  <polyline class="dg-line" points="270,66 270,58 585,58 585,66"/>
  <text class="dg-code" x="427.5" y="44" dy="0.35em" text-anchor="middle">BC = 9</text>
  <polyline class="dg-line" points="95,152 95,160 585,160 585,152"/>
  <text class="dg-code" x="340" y="176" dy="0.35em" text-anchor="middle">AC = 14 = 5 + 9</text>
  <text class="dg-note" x="340" y="202" dy="0.35em" text-anchor="middle">M at (−3 + 11) / 2 = 4, so AM = MC = 7</text>
</svg>
