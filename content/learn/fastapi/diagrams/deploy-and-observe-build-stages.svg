<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>A two-stage build: the build stage makes the artifact, the runtime stage keeps only it</title>
  <desc>The build stage starts from Python's slim image with uv copied in, adds pyproject.toml and uv.lock, and runs uv sync without the development group. Only the virtual environment and the code cross to the runtime stage, which starts from the same slim image and runs as an unprivileged user. uv and its cache stay behind.</desc>
  <rect class="dg-frame" x="20" y="20" width="260" height="220" rx="12"/>
  <text class="dg-heading" x="150" y="44" dy="0.35em" text-anchor="middle">Build stage</text>
  <rect class="dg-frame" x="400" y="20" width="260" height="220" rx="12"/>
  <text class="dg-heading" x="530" y="44" dy="0.35em" text-anchor="middle">Runtime stage</text>
  <rect class="dg-box" x="40" y="70" width="220" height="40" rx="8"/>
  <text class="dg-code" x="150" y="90" dy="0.35em" text-anchor="middle">python:3.14-slim + uv</text>
  <rect class="dg-box" x="420" y="70" width="220" height="40" rx="8"/>
  <text class="dg-code" x="530" y="90" dy="0.35em" text-anchor="middle">python:3.14-slim</text>
  <path class="dg-line" d="M150 110 V120" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="124" width="220" height="40" rx="8"/>
  <text class="dg-code" x="150" y="144" dy="0.35em" text-anchor="middle">pyproject, uv.lock</text>
  <rect class="dg-hot" x="420" y="124" width="220" height="40" rx="8"/>
  <text class="dg-on-hot dg-code" x="530" y="144" dy="0.35em" text-anchor="middle">.venv + app</text>
  <path class="dg-line" d="M150 164 V174" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="178" width="220" height="40" rx="8"/>
  <text class="dg-code" x="150" y="198" dy="0.35em" text-anchor="middle">uv sync --no-dev</text>
  <rect class="dg-box" x="420" y="178" width="220" height="40" rx="8"/>
  <text class="dg-code" x="530" y="198" dy="0.35em" text-anchor="middle">USER roombook</text>
  <path class="dg-flow" d="M260 198 H300 V144 H416" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="340" y="128" dy="0.35em" text-anchor="middle">.venv</text>
  <text class="dg-faint" x="150" y="262" dy="0.35em" text-anchor="middle">left behind: uv and its cache</text>
</svg>
