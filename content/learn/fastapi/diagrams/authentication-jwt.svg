<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>A JWT is a header, a payload, and a signature, joined by dots</title>
  <desc>The token at the top is three base64url pieces separated by dots. Decoding the first gives the header, which names the HS256 algorithm. Decoding the second gives the payload, with claims like sub, role, iss, aud, iat, and exp. The third is the signature, an HMAC-SHA256 of the first two pieces made with the secret key, so it can't be decoded into anything readable.</desc>

  <!-- The token, piece by piece. -->
  <rect class="dg-box" x="20" y="20" width="180" height="40" rx="8"/>
  <text class="dg-code" x="110" y="40" dy="0.35em" text-anchor="middle">eyJhbGciOi…</text>
  <text class="dg-heading" x="210" y="40" dy="0.35em" text-anchor="middle">.</text>
  <rect class="dg-hot" x="220" y="20" width="240" height="40" rx="8"/>
  <text class="dg-code dg-on-hot" x="340" y="40" dy="0.35em" text-anchor="middle">eyJyb2xlIjoi…</text>
  <text class="dg-heading" x="470" y="40" dy="0.35em" text-anchor="middle">.</text>
  <rect class="dg-box" x="480" y="20" width="180" height="40" rx="8"/>
  <text class="dg-code" x="570" y="40" dy="0.35em" text-anchor="middle">99yG3XLBwU…</text>

  <path class="dg-line" d="M110 60 V96" marker-end="url(#arrow)"/>
  <path class="dg-flow" d="M340 60 V96" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M570 60 V96" marker-end="url(#arrow)"/>
  <text class="dg-note" x="128" y="78" dy="0.35em">decode</text>
  <text class="dg-note" x="358" y="78" dy="0.35em">decode</text>

  <!-- Header -->
  <text class="dg-heading" x="110" y="116" dy="0.35em" text-anchor="middle">Header</text>
  <rect class="dg-box" x="20" y="136" width="180" height="104" rx="8"/>
  <text class="dg-code" x="36" y="160" dy="0.35em">{</text>
  <text class="dg-code" x="52" y="180" dy="0.35em">"alg": "HS256",</text>
  <text class="dg-code" x="52" y="200" dy="0.35em">"typ": "JWT"</text>
  <text class="dg-code" x="36" y="220" dy="0.35em">}</text>

  <!-- Payload -->
  <text class="dg-heading" x="340" y="116" dy="0.35em" text-anchor="middle">Payload: the claims</text>
  <rect class="dg-strong" x="220" y="136" width="240" height="244" rx="8"/>
  <text class="dg-code" x="236" y="160" dy="0.35em">{</text>
  <text class="dg-code" x="252" y="180" dy="0.35em">"sub": "1",</text>
  <text class="dg-code" x="252" y="200" dy="0.35em">"role": "member",</text>
  <text class="dg-code" x="252" y="220" dy="0.35em">"scope": "bookings:read …",</text>
  <text class="dg-code" x="252" y="240" dy="0.35em">"iss": "https://api…",</text>
  <text class="dg-code" x="252" y="260" dy="0.35em">"aud": "roombook-api",</text>
  <text class="dg-code" x="252" y="280" dy="0.35em">"iat": 1795302944,</text>
  <text class="dg-code" x="252" y="300" dy="0.35em">"exp": 1795303844,</text>
  <text class="dg-code" x="252" y="320" dy="0.35em">"jti": "945becce-…"</text>
  <text class="dg-code" x="236" y="340" dy="0.35em">}</text>
  <text class="dg-note" x="340" y="362" dy="0.35em" text-anchor="middle">readable by anyone</text>

  <!-- Signature -->
  <text class="dg-heading" x="570" y="116" dy="0.35em" text-anchor="middle">Signature</text>
  <rect class="dg-box" x="480" y="136" width="180" height="104" rx="8"/>
  <text x="570" y="160" dy="0.35em" text-anchor="middle">HMAC-SHA256 of</text>
  <text class="dg-code" x="570" y="186" dy="0.35em" text-anchor="middle">header.payload</text>
  <text x="570" y="212" dy="0.35em" text-anchor="middle">with the secret</text>
</svg>
