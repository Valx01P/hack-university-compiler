<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Three instances with pools of 20 share 20 real PostgreSQL connections through PgBouncer</title>
  <desc>Three API instances each keep a pool of 20 connections, 60 in all, but those connect to PgBouncer, not to PostgreSQL. PgBouncer in transaction mode keeps 20 real connections to PostgreSQL and lends one to whichever client starts a transaction.</desc>

  <rect class="dg-box" x="20" y="40" width="160" height="56" rx="8"/>
  <text x="100" y="59" dy="0.35em" text-anchor="middle">Instance 1
    <tspan class="dg-note" x="100" dy="1.4em">pool of 20</tspan>
  </text>
  <rect class="dg-box" x="20" y="120" width="160" height="56" rx="8"/>
  <text x="100" y="139" dy="0.35em" text-anchor="middle">Instance 2
    <tspan class="dg-note" x="100" dy="1.4em">pool of 20</tspan>
  </text>
  <rect class="dg-box" x="20" y="200" width="160" height="56" rx="8"/>
  <text x="100" y="219" dy="0.35em" text-anchor="middle">Instance 3
    <tspan class="dg-note" x="100" dy="1.4em">pool of 20</tspan>
  </text>

  <path class="dg-line" d="M180 68 H220 V128 H276" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M180 148 H276" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M180 228 H220 V168 H276" marker-end="url(#arrow)"/>
  <text class="dg-note" x="230" y="280" dy="0.35em" text-anchor="middle">60 client connections</text>

  <rect class="dg-hot" x="280" y="108" width="150" height="80" rx="8"/>
  <text class="dg-on-hot" x="355" y="137" dy="0.35em" text-anchor="middle">PgBouncer
    <tspan x="355" dy="1.4em">transaction mode</tspan>
  </text>

  <path class="dg-flow" d="M430 148 H516" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="473" y="130" dy="0.35em" text-anchor="middle">20 real</text>

  <rect class="dg-strong" x="520" y="108" width="140" height="80" rx="8"/>
  <text x="590" y="137" dy="0.35em" text-anchor="middle">PostgreSQL
    <tspan class="dg-note" x="590" dy="1.4em">20 processes</tspan>
  </text>
</svg>
