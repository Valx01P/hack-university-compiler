<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>A latency histogram for 1,000 requests, with the p50, p95, and p99 marked</title>
  <desc>A thousand requests sorted into buckets by duration. Most took 5 to 25 milliseconds, and the counts fall away to a long tail of a few requests over 500 milliseconds. The p50 falls in the 25 millisecond bucket, the p95 in the 250 millisecond bucket, and the p99 in the 1 second bucket, far from the average.</desc>
  <rect class="dg-box" x="60" y="223" width="56" height="77" rx="4"/>
  <text class="dg-code" x="88" y="318" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-note" x="88" y="211" dy="0.35em" text-anchor="middle">120</text>
  <rect class="dg-box" x="124" y="100" width="56" height="200" rx="4"/>
  <text class="dg-code" x="152" y="318" dy="0.35em" text-anchor="middle">10</text>
  <text class="dg-note" x="152" y="88" dy="0.35em" text-anchor="middle">310</text>
  <rect class="dg-box" x="188" y="119" width="56" height="181" rx="4"/>
  <text class="dg-code" x="216" y="318" dy="0.35em" text-anchor="middle">25</text>
  <text class="dg-note" x="216" y="107" dy="0.35em" text-anchor="middle">280</text>
  <rect class="dg-box" x="252" y="210" width="56" height="90" rx="4"/>
  <text class="dg-code" x="280" y="318" dy="0.35em" text-anchor="middle">50</text>
  <text class="dg-note" x="280" y="198" dy="0.35em" text-anchor="middle">140</text>
  <rect class="dg-box" x="316" y="255" width="56" height="45" rx="4"/>
  <text class="dg-code" x="344" y="318" dy="0.35em" text-anchor="middle">100</text>
  <text class="dg-note" x="344" y="243" dy="0.35em" text-anchor="middle">70</text>
  <rect class="dg-box" x="380" y="271" width="56" height="29" rx="4"/>
  <text class="dg-code" x="408" y="318" dy="0.35em" text-anchor="middle">250</text>
  <text class="dg-note" x="408" y="259" dy="0.35em" text-anchor="middle">45</text>
  <rect class="dg-hot" x="444" y="287" width="56" height="13" rx="4"/>
  <text class="dg-code" x="472" y="318" dy="0.35em" text-anchor="middle">500</text>
  <text class="dg-note" x="472" y="275" dy="0.35em" text-anchor="middle">20</text>
  <rect class="dg-hot" x="508" y="294" width="56" height="6" rx="4"/>
  <text class="dg-code" x="536" y="318" dy="0.35em" text-anchor="middle">1s</text>
  <text class="dg-note" x="536" y="282" dy="0.35em" text-anchor="middle">10</text>
  <rect class="dg-hot" x="572" y="297" width="56" height="3" rx="4"/>
  <text class="dg-code" x="600" y="318" dy="0.35em" text-anchor="middle">more</text>
  <text class="dg-note" x="600" y="285" dy="0.35em" text-anchor="middle">5</text>
  <path class="dg-line" d="M50 300 H640"/>
  <text class="dg-faint" x="340" y="342" dy="0.35em" text-anchor="middle">duration, at most this many ms</text>
  <path class="dg-flow dg-dashed" d="M248 40 V300"/>
  <text class="dg-code" x="248" y="28" dy="0.35em" text-anchor="middle">p50</text>
  <path class="dg-flow dg-dashed" d="M440 40 V300"/>
  <text class="dg-code" x="440" y="28" dy="0.35em" text-anchor="middle">p95</text>
  <path class="dg-flow dg-dashed" d="M568 40 V300"/>
  <text class="dg-code" x="568" y="28" dy="0.35em" text-anchor="middle">p99</text>
</svg>
