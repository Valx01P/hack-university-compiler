<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <title>A CORS preflight, then the real request, between Roombook's web app and the API</title>
  <desc>The browser, running Roombook's web app, first sends an OPTIONS preflight with its Origin and the method it wants. The API answers 200 with Access-Control-Allow-Origin naming that exact origin. Only then does the browser send the real POST with the session cookie, and the 201 response carries Allow-Origin again so the page may read it. An origin not on the allowlist gets no Allow-Origin, and the browser stops after step 2.</desc>

  <rect class="dg-frame" x="20" y="20" width="120" height="420" rx="12"/>
  <text class="dg-heading" x="80" y="46" dy="0.35em" text-anchor="middle">Browser</text>
  <text class="dg-note" x="80" y="66" dy="0.35em" text-anchor="middle">the web app</text>
  <rect class="dg-frame" x="540" y="20" width="120" height="420" rx="12"/>
  <text class="dg-heading" x="600" y="46" dy="0.35em" text-anchor="middle">Roombook</text>
  <text class="dg-note" x="600" y="66" dy="0.35em" text-anchor="middle">the API</text>

  <circle class="dg-badge" cx="170" cy="96" r="10"/>
  <text class="dg-on-badge" x="170" y="96" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-heading" x="188" y="96" dy="0.35em">Preflight</text>
  <text class="dg-code" x="340" y="121" dy="0.35em" text-anchor="middle">OPTIONS /v1/bookings</text>
  <text class="dg-code" x="340" y="139" dy="0.35em" text-anchor="middle">Origin: https://app.roombook.example</text>
  <path class="dg-line" d="M140 152 H536" marker-end="url(#arrow)"/>

  <circle class="dg-badge" cx="170" cy="188" r="10"/>
  <text class="dg-on-badge" x="170" y="188" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-heading" x="188" y="188" dy="0.35em">Allowed</text>
  <text class="dg-code" x="340" y="213" dy="0.35em" text-anchor="middle">200 OK</text>
  <text class="dg-code" x="340" y="231" dy="0.35em" text-anchor="middle">Allow-Origin: https://app.roombook.example</text>
  <path class="dg-line dg-dashed" d="M540 244 H144" marker-end="url(#arrow)"/>

  <circle class="dg-badge" cx="170" cy="280" r="10"/>
  <text class="dg-on-badge" x="170" y="280" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-heading" x="188" y="280" dy="0.35em">Real request</text>
  <text class="dg-code" x="340" y="305" dy="0.35em" text-anchor="middle">POST /v1/bookings + cookie</text>
  <path class="dg-flow" d="M140 318 H536" marker-end="url(#arrow-flow)"/>

  <circle class="dg-badge" cx="170" cy="354" r="10"/>
  <text class="dg-on-badge" x="170" y="354" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-heading" x="188" y="354" dy="0.35em">Readable response</text>
  <text class="dg-code" x="340" y="379" dy="0.35em" text-anchor="middle">201 Created + Allow-Origin</text>
  <path class="dg-line dg-dashed" d="M540 392 H144" marker-end="url(#arrow)"/>

  <text class="dg-note" x="340" y="420" dy="0.35em" text-anchor="middle">Any other origin: no Allow-Origin, so the browser stops at step 2</text>
</svg>
