<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Pub/sub: one instance publishes, and Redis passes the message to every subscribed instance</title>
  <desc>Instance C commits a booking and publishes to the channel for room 1 in Redis. Redis delivers the message to instances A and B, which subscribed because their visitors are watching room 1. Each writes the event down its visitor's open SSE stream.</desc>

  <!-- Visitors -->
  <rect class="dg-box" x="20" y="40" width="120" height="56" rx="8"/>
  <text x="80" y="59" dy="0.35em" text-anchor="middle">Visitor 1
    <tspan class="dg-note" x="80" dy="1.4em">watching room 1</tspan>
  </text>
  <rect class="dg-box" x="20" y="140" width="120" height="56" rx="8"/>
  <text x="80" y="159" dy="0.35em" text-anchor="middle">Visitor 2
    <tspan class="dg-note" x="80" dy="1.4em">watching room 1</tspan>
  </text>
  <text class="dg-code" x="80" y="250" dy="0.35em" text-anchor="middle">POST /v1/bookings</text>

  <!-- Instances -->
  <rect class="dg-box" x="220" y="40" width="150" height="56" rx="8"/>
  <text x="295" y="59" dy="0.35em" text-anchor="middle">Instance A
    <tspan class="dg-note" x="295" dy="1.4em">subscribed</tspan>
  </text>
  <rect class="dg-box" x="220" y="140" width="150" height="56" rx="8"/>
  <text x="295" y="159" dy="0.35em" text-anchor="middle">Instance B
    <tspan class="dg-note" x="295" dy="1.4em">subscribed</tspan>
  </text>
  <rect class="dg-strong" x="220" y="240" width="150" height="56" rx="8"/>
  <text x="295" y="259" dy="0.35em" text-anchor="middle">Instance C
    <tspan class="dg-note" x="295" dy="1.4em">commits a booking</tspan>
  </text>
  <path class="dg-line" d="M80 262 V268 H216" marker-end="url(#arrow)"/>

  <!-- Redis -->
  <rect class="dg-hot" x="480" y="110" width="180" height="116" rx="8"/>
  <text class="dg-on-hot" x="570" y="150" dy="0.35em" text-anchor="middle">Redis</text>
  <text class="dg-on-hot" x="570" y="178" dy="0.35em" text-anchor="middle">channel</text>
  <text class="dg-on-hot" x="570" y="198" dy="0.35em" text-anchor="middle">rooms:1:events</text>

  <!-- Step 1: publish -->
  <path class="dg-flow" d="M370 268 H440 V206 H476" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="410" cy="268" r="10"/>
  <text class="dg-on-badge" x="410" y="268" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="410" y="306" dy="0.35em" text-anchor="middle">PUBLISH</text>

  <!-- Step 2: delivered to A and B -->
  <path class="dg-flow" d="M480 130 H440 V68 H374" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M480 168 H374" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="410" cy="68" r="10"/>
  <text class="dg-on-badge" x="410" y="68" dy="0.35em" text-anchor="middle">2</text>
  <circle class="dg-badge" cx="410" cy="168" r="10"/>
  <text class="dg-on-badge" x="410" y="168" dy="0.35em" text-anchor="middle">2</text>

  <!-- Step 3: SSE events to visitors -->
  <path class="dg-flow" d="M220 68 H144" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M220 168 H144" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="182" cy="68" r="10"/>
  <text class="dg-on-badge" x="182" y="68" dy="0.35em" text-anchor="middle">3</text>
  <circle class="dg-badge" cx="182" cy="168" r="10"/>
  <text class="dg-on-badge" x="182" y="168" dy="0.35em" text-anchor="middle">3</text>
</svg>
