<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>A trace waterfall for one booking, from the handler to the email worker</title>
  <desc>One POST to /v1/bookings takes 48 milliseconds. Inside it, checking the token takes 2, the transaction takes 33, and within the transaction the booking insert takes 22 and the outbox insert 4. Deleting the cached availability in Redis takes 3. Later, the email worker picks up the outbox row, and its span joins the same trace.</desc>
  <text class="dg-heading" x="20" y="30" dy="0.35em">Span</text>
  <text class="dg-heading" x="220" y="30" dy="0.35em">Time</text>
  <text x="20" y="70" dy="0.35em">POST /v1/bookings</text>
  <rect class="dg-hot" x="220" y="56" width="288" height="28" rx="4"/>
  <text class="dg-note" x="516" y="70" dy="0.35em">48 ms</text>
  <text x="36" y="114" dy="0.35em">check token</text>
  <rect class="dg-box" x="226" y="100" width="12" height="28" rx="4"/>
  <text class="dg-note" x="246" y="114" dy="0.35em">2 ms</text>
  <text x="36" y="158" dy="0.35em">transaction</text>
  <rect class="dg-box" x="250" y="144" width="198" height="28" rx="4"/>
  <text class="dg-note" x="456" y="158" dy="0.35em">33 ms</text>
  <text x="52" y="202" dy="0.35em">INSERT booking</text>
  <rect class="dg-box" x="268" y="188" width="132" height="28" rx="4"/>
  <text class="dg-note" x="408" y="202" dy="0.35em">22 ms</text>
  <text x="52" y="246" dy="0.35em">INSERT outbox</text>
  <rect class="dg-box" x="406" y="232" width="24" height="28" rx="4"/>
  <text class="dg-note" x="438" y="246" dy="0.35em">4 ms</text>
  <text x="36" y="290" dy="0.35em">Redis DEL</text>
  <rect class="dg-box" x="460" y="276" width="18" height="28" rx="4"/>
  <text class="dg-note" x="486" y="290" dy="0.35em">3 ms</text>
  <text x="20" y="334" dy="0.35em">email worker</text>
  <rect class="dg-off" x="560" y="320" width="100" height="28" rx="4"/>
  <text class="dg-faint" x="610" y="334" dy="0.35em" text-anchor="middle">later</text>
  <path class="dg-line dg-dashed" d="M418 260 V334 H556" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M220 372 H580"/>
  <text class="dg-code" x="220" y="388" dy="0.35em" text-anchor="middle">0 ms</text>
  <text class="dg-code" x="340" y="388" dy="0.35em" text-anchor="middle">20 ms</text>
  <text class="dg-code" x="460" y="388" dy="0.35em" text-anchor="middle">40 ms</text>
  <text class="dg-code" x="580" y="388" dy="0.35em" text-anchor="middle">60 ms</text>
</svg>
