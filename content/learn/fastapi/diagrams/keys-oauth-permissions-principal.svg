<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>Three credentials become one principal, which every check reads</title>
  <desc>A session cookie, a bearer token, or an API key is checked and turned into one principal, holding how the caller got in, the user id, the role, the building, and the scopes. The route check reads the principal and asks about the role or scope, failing with 401 or 403. The object check then asks whether this caller may touch this particular booking, failing with 404.</desc>

  <rect class="dg-box" x="20" y="40" width="170" height="40" rx="8"/>
  <text x="105" y="60" dy="0.35em" text-anchor="middle">Session cookie</text>
  <rect class="dg-box" x="20" y="120" width="170" height="40" rx="8"/>
  <text x="105" y="140" dy="0.35em" text-anchor="middle">Bearer token</text>
  <rect class="dg-box" x="20" y="200" width="170" height="40" rx="8"/>
  <text x="105" y="220" dy="0.35em" text-anchor="middle">API key</text>

  <path class="dg-line" d="M190 60 H210 V140 H226" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M190 140 H226" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M190 220 H210 V140"/>

  <rect class="dg-hot" x="230" y="50" width="220" height="180" rx="8"/>
  <text class="dg-on-hot dg-heading" x="340" y="74" dy="0.35em" text-anchor="middle">Principal</text>
  <text class="dg-code dg-on-hot" x="250" y="106" dy="0.35em">via: "session"</text>
  <text class="dg-code dg-on-hot" x="250" y="130" dy="0.35em">user_id: 1</text>
  <text class="dg-code dg-on-hot" x="250" y="154" dy="0.35em">role: "member"</text>
  <text class="dg-code dg-on-hot" x="250" y="178" dy="0.35em">building_id: None</text>
  <text class="dg-code dg-on-hot" x="250" y="202" dy="0.35em">scopes: {bookings:…}</text>

  <rect class="dg-strong" x="490" y="40" width="170" height="56" rx="8"/>
  <text x="575" y="59" dy="0.35em" text-anchor="middle">Route check
    <tspan class="dg-note" x="575" dy="1.4em">role? scope?</tspan>
  </text>
  <path class="dg-flow" d="M450 68 H486" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="587" y="122" dy="0.35em">no: 401 or 403</text>

  <rect class="dg-strong" x="490" y="152" width="170" height="56" rx="8"/>
  <text x="575" y="171" dy="0.35em" text-anchor="middle">Object check
    <tspan class="dg-note" x="575" dy="1.4em">this booking?</tspan>
  </text>
  <path class="dg-flow" d="M575 96 V148" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="575" y="224" dy="0.35em" text-anchor="middle">no: 404</text>
</svg>
