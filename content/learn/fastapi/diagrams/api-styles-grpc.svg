<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>A .proto file generates both sides, which talk over one HTTP/2 connection</title>
  <desc>One file, rooms.proto, is the contract. A tool, protoc or Buf, generates code from it: a client stub in the caller's language, and a server interface that the service fills in. The two sides then share one HTTP/2 connection with many streams. On one stream, GetRoom sends a request and gets one Room back. On another, WatchAvailability sends one request and gets a stream of Availability messages back.</desc>

  <!-- The contract. -->
  <rect class="dg-strong" x="250" y="20" width="180" height="56" rx="8"/>
  <text x="340" y="39" dy="0.35em" text-anchor="middle"><tspan class="dg-code">rooms.proto</tspan>
    <tspan class="dg-note" x="340" dy="1.4em">the contract</tspan>
  </text>
  <path class="dg-line" d="M300 76 V100 H140 V132" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M380 76 V100 H540 V132" marker-end="url(#arrow)"/>
  <text class="dg-note" x="340" y="118" dy="0.35em" text-anchor="middle">protoc or Buf generates code</text>

  <!-- The generated code. -->
  <rect class="dg-box" x="20" y="136" width="240" height="56" rx="8"/>
  <text x="140" y="155" dy="0.35em" text-anchor="middle">Client stub
    <tspan class="dg-note" x="140" dy="1.4em">in the caller's language</tspan>
  </text>
  <rect class="dg-box" x="420" y="136" width="240" height="56" rx="8"/>
  <text x="540" y="155" dy="0.35em" text-anchor="middle">Server interface
    <tspan class="dg-note" x="540" dy="1.4em">the service fills it in</tspan>
  </text>
  <path class="dg-line" d="M140 192 V228"/>
  <path class="dg-line" d="M540 192 V228"/>

  <!-- One connection, many streams. -->
  <rect class="dg-frame" x="20" y="228" width="640" height="152" rx="12"/>
  <text class="dg-note" x="40" y="248" dy="0.35em">one HTTP/2 connection</text>
  <text class="dg-code" x="340" y="258" dy="0.35em" text-anchor="middle">GetRoom</text>
  <path class="dg-flow" d="M60 272 H616" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M620 290 H64" marker-end="url(#arrow)"/>
  <text class="dg-note" x="340" y="304" dy="0.35em" text-anchor="middle">one Room</text>
  <text class="dg-code" x="340" y="322" dy="0.35em" text-anchor="middle">WatchAvailability</text>
  <path class="dg-flow" d="M60 336 H616" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M620 354 H456" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M436 354 H272" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M252 354 H64" marker-end="url(#arrow)"/>
  <text class="dg-note" x="340" y="368" dy="0.35em" text-anchor="middle">an Availability each time it changes</text>
</svg>
