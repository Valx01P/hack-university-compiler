<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <title>Roombook's four tables and the foreign keys between them</title>
  <desc>Four tables. A building has many rooms, through rooms.building_id. A building has many staff users, through users.building_id, which is empty for everyone else. A room has many bookings, through bookings.room_id, and a user has many bookings, through bookings.user_id. So bookings sits between users and rooms, the many-to-many link, with facts of its own like the times and attendees.</desc>

  <!-- buildings -->
  <rect class="dg-box" x="40" y="20" width="220" height="168" rx="8"/>
  <text class="dg-heading" x="150" y="40" dy="0.35em" text-anchor="middle">buildings</text>
  <path class="dg-line" d="M40 58 H260"/>
  <text class="dg-code" x="60" y="76" dy="0.35em">id<tspan class="dg-note" dx="8">PK</tspan></text>
  <text class="dg-code" x="60" y="96" dy="0.35em">slug</text>
  <text class="dg-code" x="60" y="116" dy="0.35em">name</text>
  <text class="dg-code" x="60" y="136" dy="0.35em">timezone</text>
  <text class="dg-code" x="60" y="156" dy="0.35em">opens_at</text>
  <text class="dg-code" x="60" y="176" dy="0.35em">closes_at</text>

  <!-- users -->
  <rect class="dg-box" x="420" y="20" width="220" height="148" rx="8"/>
  <text class="dg-heading" x="530" y="40" dy="0.35em" text-anchor="middle">users</text>
  <path class="dg-line" d="M420 58 H640"/>
  <text class="dg-code" x="440" y="76" dy="0.35em">id<tspan class="dg-note" dx="8">PK</tspan></text>
  <text class="dg-code" x="440" y="96" dy="0.35em">email</text>
  <text class="dg-code" x="440" y="116" dy="0.35em">name</text>
  <text class="dg-code" x="440" y="136" dy="0.35em">role</text>
  <text class="dg-code" x="440" y="156" dy="0.35em">building_id<tspan class="dg-note" dx="8">FK</tspan></text>

  <!-- rooms -->
  <rect class="dg-box" x="40" y="260" width="220" height="148" rx="8"/>
  <text class="dg-heading" x="150" y="280" dy="0.35em" text-anchor="middle">rooms</text>
  <path class="dg-line" d="M40 298 H260"/>
  <text class="dg-code" x="60" y="316" dy="0.35em">id<tspan class="dg-note" dx="8">PK</tspan></text>
  <text class="dg-code" x="60" y="336" dy="0.35em">building_id<tspan class="dg-note" dx="8">FK</tspan></text>
  <text class="dg-code" x="60" y="356" dy="0.35em">name</text>
  <text class="dg-code" x="60" y="376" dy="0.35em">capacity</text>
  <text class="dg-code" x="60" y="396" dy="0.35em">amenities</text>

  <!-- bookings, the table in the middle -->
  <rect class="dg-hot" x="420" y="240" width="220" height="196" rx="8"/>
  <text class="dg-heading dg-on-hot" x="530" y="260" dy="0.35em" text-anchor="middle">bookings</text>
  <path class="dg-line" d="M420 278 H640"/>
  <text class="dg-code dg-on-hot" x="440" y="296" dy="0.35em">id  PK</text>
  <text class="dg-code dg-on-hot" x="440" y="316" dy="0.35em">room_id  FK</text>
  <text class="dg-code dg-on-hot" x="440" y="336" dy="0.35em">user_id  FK</text>
  <text class="dg-code dg-on-hot" x="440" y="356" dy="0.35em">starts_at</text>
  <text class="dg-code dg-on-hot" x="440" y="376" dy="0.35em">ends_at</text>
  <text class="dg-code dg-on-hot" x="440" y="396" dy="0.35em">attendees</text>
  <text class="dg-code dg-on-hot" x="440" y="416" dy="0.35em">status</text>

  <!-- buildings 1 to many rooms -->
  <path class="dg-line" d="M150 188 V256" marker-end="url(#arrow)"/>
  <text class="dg-note" x="162" y="204" dy="0.35em">1</text>
  <text class="dg-note" x="162" y="242" dy="0.35em">many</text>

  <!-- buildings 1 to many users (staff only) -->
  <path class="dg-line dg-dashed" d="M260 156 H416" marker-end="url(#arrow)"/>
  <text class="dg-note" x="272" y="144" dy="0.35em">1</text>
  <text class="dg-note" x="404" y="144" dy="0.35em" text-anchor="end">many</text>
  <text class="dg-note" x="338" y="172" dy="0.35em" text-anchor="middle">staff only</text>

  <!-- rooms 1 to many bookings -->
  <path class="dg-flow" d="M260 316 H416" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="272" y="304" dy="0.35em">1</text>
  <text class="dg-note" x="404" y="304" dy="0.35em" text-anchor="end">many</text>

  <!-- users 1 to many bookings -->
  <path class="dg-flow" d="M530 168 V236" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="542" y="184" dy="0.35em">1</text>
  <text class="dg-note" x="542" y="222" dy="0.35em">many</text>
</svg>
