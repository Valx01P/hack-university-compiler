<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <title>Three checkpoints for a booking: the edge, the service, and the database</title>
  <desc>A POST to /v1/bookings meets three checkpoints in order. Step 1, the edge, checks the request's shape and refuses it with 400, 415, or 422. Step 2, the service, checks the business rules and refuses with 422 or 409. Step 3, the database, catches races like overlapping bookings and refuses with 409. A request that passes all three gets 201 Created.</desc>

  <!-- The request comes in at the top. -->
  <rect class="dg-box" x="40" y="20" width="300" height="40" rx="8"/>
  <text class="dg-code" x="190" y="40" dy="0.35em" text-anchor="middle">POST /v1/bookings</text>
  <text class="dg-heading" x="520" y="40" dy="0.35em" text-anchor="middle">Refused with</text>

  <!-- 1: the edge. -->
  <path class="dg-flow" d="M190 60 V86" marker-end="url(#arrow-flow)"/>
  <rect class="dg-strong" x="40" y="90" width="300" height="80" rx="8"/>
  <circle class="dg-badge" cx="66" cy="114" r="10"/>
  <text class="dg-on-badge" x="66" y="114" dy="0.35em" text-anchor="middle">1</text>
  <text x="86" y="114" dy="0.35em">The edge: shape</text>
  <text class="dg-note" x="86" y="142" dy="0.35em">types, formats, ranges, fields</text>
  <path class="dg-line dg-dashed" d="M340 130 H396" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="400" y="110" width="240" height="40" rx="8"/>
  <text class="dg-code" x="520" y="130" dy="0.35em" text-anchor="middle">400, 415, 422</text>

  <!-- 2: the service. -->
  <path class="dg-flow" d="M190 170 V196" marker-end="url(#arrow-flow)"/>
  <rect class="dg-strong" x="40" y="200" width="300" height="80" rx="8"/>
  <circle class="dg-badge" cx="66" cy="224" r="10"/>
  <text class="dg-on-badge" x="66" y="224" dy="0.35em" text-anchor="middle">2</text>
  <text x="86" y="224" dy="0.35em">The service: rules</text>
  <text class="dg-note" x="86" y="252" dy="0.35em">capacity, times, booking limit</text>
  <path class="dg-line dg-dashed" d="M340 240 H396" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="400" y="220" width="240" height="40" rx="8"/>
  <text class="dg-code" x="520" y="240" dy="0.35em" text-anchor="middle">422, 409</text>

  <!-- 3: the database. -->
  <path class="dg-flow" d="M190 280 V306" marker-end="url(#arrow-flow)"/>
  <rect class="dg-strong" x="40" y="310" width="300" height="80" rx="8"/>
  <circle class="dg-badge" cx="66" cy="334" r="10"/>
  <text class="dg-on-badge" x="66" y="334" dy="0.35em" text-anchor="middle">3</text>
  <text x="86" y="334" dy="0.35em">The database: races</text>
  <text class="dg-note" x="86" y="362" dy="0.35em">overlaps, duplicate emails</text>
  <path class="dg-line dg-dashed" d="M340 350 H396" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="400" y="330" width="240" height="40" rx="8"/>
  <text class="dg-code" x="520" y="350" dy="0.35em" text-anchor="middle">409</text>

  <!-- Past all three. -->
  <path class="dg-flow" d="M190 390 V416" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="40" y="420" width="300" height="40" rx="8"/>
  <text class="dg-on-hot dg-code" x="190" y="440" dy="0.35em" text-anchor="middle">201 Created</text>
</svg>
