<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <title>One INSERT's path: triggers, constraints, and the commit</title>
  <desc>An INSERT into bookings passes six steps in order. BEFORE triggers can change the row. NOT NULL and CHECK rules test the row alone. UNIQUE and exclusion rules compare it with other rows. Foreign keys check the rows it points at. AFTER triggers write elsewhere, like the audit log. Then COMMIT makes it all visible at once. If any step refuses, the whole statement is undone.</desc>

  <rect class="dg-strong" x="60" y="20" width="280" height="40" rx="8"/>
  <text class="dg-code" x="200" y="40" dy="0.35em" text-anchor="middle">INSERT INTO bookings ...</text>
  <path class="dg-flow" d="M200 60 V76" marker-end="url(#arrow-flow)"/>

  <!-- Step 1 -->
  <circle class="dg-badge" cx="36" cy="104" r="10"/>
  <text class="dg-on-badge" x="36" y="104" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-hot" x="60" y="80" width="280" height="48" rx="8"/>
  <text class="dg-on-hot" x="200" y="104" dy="0.35em" text-anchor="middle">BEFORE triggers</text>
  <text class="dg-note" x="370" y="104" dy="0.35em">can change the row on its way in</text>
  <path class="dg-flow" d="M200 128 V140" marker-end="url(#arrow-flow)"/>

  <!-- Step 2 -->
  <circle class="dg-badge" cx="36" cy="168" r="10"/>
  <text class="dg-on-badge" x="36" y="168" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="60" y="144" width="280" height="48" rx="8"/>
  <text x="200" y="168" dy="0.35em" text-anchor="middle">NOT NULL and CHECK</text>
  <text class="dg-note" x="370" y="168" dy="0.35em">test the row alone</text>
  <path class="dg-flow" d="M200 192 V204" marker-end="url(#arrow-flow)"/>

  <!-- Step 3 -->
  <circle class="dg-badge" cx="36" cy="232" r="10"/>
  <text class="dg-on-badge" x="36" y="232" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="60" y="208" width="280" height="48" rx="8"/>
  <text x="200" y="232" dy="0.35em" text-anchor="middle">UNIQUE and EXCLUDE</text>
  <text class="dg-note" x="370" y="232" dy="0.35em">compare it with the other rows</text>
  <path class="dg-flow" d="M200 256 V268" marker-end="url(#arrow-flow)"/>

  <!-- Step 4 -->
  <circle class="dg-badge" cx="36" cy="296" r="10"/>
  <text class="dg-on-badge" x="36" y="296" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-box" x="60" y="272" width="280" height="48" rx="8"/>
  <text x="200" y="296" dy="0.35em" text-anchor="middle">FOREIGN KEY</text>
  <text class="dg-note" x="370" y="296" dy="0.35em">the room and the user exist</text>
  <path class="dg-flow" d="M200 320 V332" marker-end="url(#arrow-flow)"/>

  <!-- Step 5 -->
  <circle class="dg-badge" cx="36" cy="360" r="10"/>
  <text class="dg-on-badge" x="36" y="360" dy="0.35em" text-anchor="middle">5</text>
  <rect class="dg-hot" x="60" y="336" width="280" height="48" rx="8"/>
  <text class="dg-on-hot" x="200" y="360" dy="0.35em" text-anchor="middle">AFTER triggers</text>
  <text class="dg-note" x="370" y="360" dy="0.35em">write elsewhere, like audit_log</text>
  <path class="dg-flow" d="M200 384 V396" marker-end="url(#arrow-flow)"/>

  <!-- Step 6 -->
  <circle class="dg-badge" cx="36" cy="424" r="10"/>
  <text class="dg-on-badge" x="36" y="424" dy="0.35em" text-anchor="middle">6</text>
  <rect class="dg-strong" x="60" y="400" width="280" height="48" rx="8"/>
  <text x="200" y="424" dy="0.35em" text-anchor="middle">COMMIT</text>
  <text class="dg-note" x="370" y="424" dy="0.35em">everyone sees it, all at once</text>

  <text class="dg-note" x="370" y="40" dy="0.35em">Any step can refuse with an ERROR,</text>
  <text class="dg-note" x="370" y="58" dy="0.35em">and the whole statement is undone.</text>
</svg>
