<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>The middleware onion: a request passes in through each layer and the response passes back out</title>
  <desc>A client sends a request into three nested layers: request id on the outside, then logging and timing, then body parsing. At the center, the handler makes the response. The response travels back out through the same three layers in reverse order, so each layer acts once on the way in and once on the way out.</desc>

  <!-- The client, outside the server. -->
  <rect class="dg-box" x="20" y="180" width="90" height="120" rx="8"/>
  <text x="65" y="240" dy="0.35em" text-anchor="middle">Client</text>

  <!-- Three layers, outermost first. -->
  <rect class="dg-frame" x="130" y="20" width="530" height="340" rx="12"/>
  <text class="dg-heading" x="150" y="44" dy="0.35em">Request id</text>
  <text class="dg-note" x="150" y="66" dy="0.35em">first in, last out</text>
  <rect class="dg-frame" x="180" y="84" width="460" height="256" rx="12"/>
  <text class="dg-heading" x="200" y="108" dy="0.35em">Logging and timing</text>
  <rect class="dg-frame" x="230" y="132" width="390" height="188" rx="12"/>
  <text class="dg-heading" x="250" y="156" dy="0.35em">Body parsing</text>

  <!-- The handler at the center. -->
  <rect class="dg-hot" x="430" y="188" width="170" height="104" rx="8"/>
  <text class="dg-on-hot" x="515" y="240" dy="0.35em" text-anchor="middle">Handler</text>

  <!-- In, and back out. -->
  <path class="dg-flow" d="M110 212 H426" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="330" y="198" dy="0.35em" text-anchor="middle">request: before work</text>
  <path class="dg-line dg-dashed" d="M430 268 H114" marker-end="url(#arrow)"/>
  <text class="dg-note" x="330" y="284" dy="0.35em" text-anchor="middle">response: after work</text>
</svg>
