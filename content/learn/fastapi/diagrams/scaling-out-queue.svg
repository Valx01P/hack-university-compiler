<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>The API puts a message on a queue, and workers take messages off to do the work</title>
  <desc>On the left, the Roombook API puts a booking.confirmed message on a queue held by a message broker, and answers the client at once. On the right, two email workers each take messages off the queue and send the confirmation emails at their own pace.</desc>

  <!-- The API. -->
  <rect class="dg-strong" x="20" y="110" width="170" height="56" rx="8"/>
  <text x="105" y="129" dy="0.35em" text-anchor="middle">Roombook API
    <tspan class="dg-note" x="105" dy="1.4em">answers 201 at once</tspan>
  </text>
  <path class="dg-flow" d="M190 138 H236" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="213" y="120" dy="0.35em" text-anchor="middle">put</text>

  <!-- The broker and its queue. -->
  <rect class="dg-frame" x="240" y="60" width="220" height="156" rx="12"/>
  <text class="dg-heading" x="350" y="84" dy="0.35em" text-anchor="middle">Message broker</text>
  <rect class="dg-hot" x="268" y="122" width="34" height="34" rx="4"/>
  <rect class="dg-hot" x="312" y="122" width="34" height="34" rx="4"/>
  <rect class="dg-hot" x="356" y="122" width="34" height="34" rx="4"/>
  <rect class="dg-off" x="400" y="122" width="34" height="34" rx="4"/>
  <text class="dg-code" x="350" y="186" dy="0.35em" text-anchor="middle">booking.confirmed</text>

  <!-- The workers. -->
  <path class="dg-line" d="M460 138 H480 V88 H496" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M480 138 V192 H496" marker-end="url(#arrow)"/>
  <text class="dg-note" x="470" y="214" dy="0.35em" text-anchor="middle">take</text>
  <rect class="dg-box" x="500" y="60" width="160" height="56" rx="8"/>
  <text x="580" y="79" dy="0.35em" text-anchor="middle">Email worker
    <tspan class="dg-note" x="580" dy="1.4em">sends, then acks</tspan>
  </text>
  <rect class="dg-box" x="500" y="164" width="160" height="56" rx="8"/>
  <text x="580" y="183" dy="0.35em" text-anchor="middle">Email worker
    <tspan class="dg-note" x="580" dy="1.4em">at its own pace</tspan>
  </text>
</svg>
