<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 660">
  <title>Roombook's layers in FastAPI, outermost first, with Starlette's own layers around yours</title>
  <desc>Starlette's ServerErrorMiddleware is the outermost layer and runs the handler for unhandled exceptions. Inside it come your middleware in reverse order of adding: the request id and timing, CORS, compression, and the read-only check. Starlette's ExceptionMiddleware sits inside those and handles HTTPException. Then the router picks the endpoint, its dependencies run, its body is checked, and the endpoint runs.</desc>
  <rect class="dg-frame" x="20" y="20" width="640" height="344" rx="12"/>
  <text class="dg-heading" x="100" y="38" dy="0.35em">Starlette's layers and yours</text>
  <rect class="dg-frame" x="20" y="384" width="640" height="240" rx="12"/>
  <text class="dg-heading" x="100" y="402" dy="0.35em">Inside the router</text>
  <rect class="dg-strong" x="40" y="56" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="74" dy="0.35em">ServerErrorMiddleware</text>
  <text class="dg-note" x="330" y="74" dy="0.35em">Starlette: 500 for unhandled errors</text>
  <path class="dg-line" d="M80 92 V104" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="108" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="126" dy="0.35em">request_id_and_timing</text>
  <text class="dg-note" x="330" y="126" dy="0.35em">added last, so it runs first</text>
  <path class="dg-line" d="M80 144 V156" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="160" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="178" dy="0.35em">CORSMiddleware</text>
  <text class="dg-note" x="330" y="178" dy="0.35em">answers preflights</text>
  <path class="dg-line" d="M80 196 V208" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="212" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="230" dy="0.35em">GZipMiddleware</text>
  <text class="dg-note" x="330" y="230" dy="0.35em">compresses large responses</text>
  <path class="dg-line" d="M80 248 V260" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="264" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="282" dy="0.35em">read_only</text>
  <text class="dg-note" x="330" y="282" dy="0.35em">refuses writes during maintenance</text>
  <path class="dg-line" d="M80 300 V312" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="40" y="316" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="334" dy="0.35em">ExceptionMiddleware</text>
  <text class="dg-note" x="330" y="334" dy="0.35em">Starlette: HTTPException handlers</text>
  <path class="dg-line" d="M80 352 V416" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="420" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="438" dy="0.35em">router</text>
  <text class="dg-note" x="330" y="438" dy="0.35em">picks the endpoint, or 404 and 405</text>
  <path class="dg-line" d="M80 456 V468" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="472" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="490" dy="0.35em">dependencies</text>
  <text class="dg-note" x="330" y="490" dy="0.35em">require_json, and later a login check</text>
  <path class="dg-line" d="M80 508 V520" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="524" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="542" dy="0.35em">body parsing</text>
  <text class="dg-note" x="330" y="542" dy="0.35em">Pydantic checks the parameters</text>
  <path class="dg-line" d="M80 560 V572" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="40" y="576" width="270" height="36" rx="8"/>
  <text class="dg-on-hot dg-code" x="56" y="594" dy="0.35em">endpoint</text>
  <text class="dg-note" x="330" y="594" dy="0.35em">your path operation function</text>
</svg>
