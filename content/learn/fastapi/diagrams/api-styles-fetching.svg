<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>One screen's data: three REST round trips, or one GraphQL query</title>
  <desc>With REST, the phone app asks Roombook three times, one after another: for booking 1001 and gets the whole booking, for room 1 and gets the whole room, and for the buildings and gets every building. With GraphQL, it sends one POST to /graphql with a query, and gets back only the four fields the screen shows.</desc>

  <!-- REST. -->
  <text class="dg-heading" x="20" y="20" dy="0.35em">REST <tspan class="dg-note">three round trips</tspan></text>
  <rect class="dg-box" x="20" y="36" width="120" height="40" rx="8"/>
  <text x="80" y="56" dy="0.35em" text-anchor="middle">Phone app</text>
  <rect class="dg-box" x="540" y="36" width="120" height="40" rx="8"/>
  <text x="600" y="56" dy="0.35em" text-anchor="middle">Roombook</text>
  <path class="dg-line" d="M80 76 V250"/>
  <path class="dg-line" d="M600 76 V250"/>

  <text class="dg-code" x="340" y="90" dy="0.35em" text-anchor="middle">GET /v1/bookings/1001</text>
  <path class="dg-flow" d="M80 104 H596" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="118" dy="0.35em" text-anchor="middle">the whole booking</text>
  <path class="dg-line dg-dashed" d="M600 132 H84" marker-end="url(#arrow)"/>

  <text class="dg-code" x="340" y="152" dy="0.35em" text-anchor="middle">GET /v1/rooms/1</text>
  <path class="dg-flow" d="M80 166 H596" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="180" dy="0.35em" text-anchor="middle">the whole room</text>
  <path class="dg-line dg-dashed" d="M600 194 H84" marker-end="url(#arrow)"/>

  <text class="dg-code" x="340" y="214" dy="0.35em" text-anchor="middle">GET /v1/buildings</text>
  <path class="dg-flow" d="M80 228 H596" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="242" dy="0.35em" text-anchor="middle">every building</text>
  <path class="dg-line dg-dashed" d="M600 256 H84" marker-end="url(#arrow)"/>

  <!-- GraphQL. -->
  <text class="dg-heading" x="20" y="296" dy="0.35em">GraphQL <tspan class="dg-note">one round trip</tspan></text>
  <rect class="dg-box" x="20" y="312" width="120" height="40" rx="8"/>
  <text x="80" y="332" dy="0.35em" text-anchor="middle">Phone app</text>
  <rect class="dg-hot" x="540" y="312" width="120" height="40" rx="8"/>
  <text class="dg-on-hot" x="600" y="332" dy="0.35em" text-anchor="middle">Roombook</text>
  <path class="dg-line" d="M80 352 V400"/>
  <path class="dg-line" d="M600 352 V400"/>
  <text class="dg-code" x="340" y="358" dy="0.35em" text-anchor="middle">POST /graphql, with the query</text>
  <path class="dg-flow" d="M80 372 H596" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="386" dy="0.35em" text-anchor="middle">only the four fields the screen shows</text>
  <path class="dg-line dg-dashed" d="M600 400 H84" marker-end="url(#arrow)"/>
</svg>
