<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>A session kept in instance A's memory is unknown to instance B</title>
  <desc>Ada's browser sends requests through a load balancer. In step 1 she signs in, the request reaches instance A, and A stores her session in its own memory. In step 2 her next request, with the same cookie, reaches instance B, which has no sessions at all, so it answers 401.</desc>

  <!-- Browser and load balancer. -->
  <rect class="dg-box" x="230" y="20" width="220" height="56" rx="8"/>
  <text x="340" y="39" dy="0.35em" text-anchor="middle">Ada's browser
    <tspan class="dg-code" x="340" dy="1.4em">session=7f3a</tspan>
  </text>
  <path class="dg-line" d="M340 76 V126" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="230" y="130" width="220" height="48" rx="8"/>
  <text x="340" y="154" dy="0.35em" text-anchor="middle">Load balancer</text>

  <!-- Step 1: sign in on A. -->
  <path class="dg-flow" d="M290 178 V214 H170 V256" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="170" cy="230" r="10"/>
  <text class="dg-on-badge" x="170" y="230" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="154" y="230" dy="0.35em" text-anchor="end">signs in</text>

  <!-- Step 2: the next request on B. -->
  <path class="dg-line" d="M390 178 V214 H510 V256" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="510" cy="230" r="10"/>
  <text class="dg-on-badge" x="510" y="230" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="526" y="230" dy="0.35em">next request</text>

  <!-- The instances and their memory. -->
  <rect class="dg-hot" x="40" y="260" width="260" height="130" rx="8"/>
  <text class="dg-on-hot" x="170" y="284" dy="0.35em" text-anchor="middle">Instance A</text>
  <rect class="dg-box" x="64" y="306" width="212" height="40" rx="6"/>
  <text class="dg-code" x="170" y="326" dy="0.35em" text-anchor="middle">7f3a → Ada</text>
  <text class="dg-on-hot" x="170" y="368" dy="0.35em" text-anchor="middle">sessions in its memory</text>

  <rect class="dg-box" x="380" y="260" width="260" height="130" rx="8"/>
  <text x="510" y="284" dy="0.35em" text-anchor="middle">Instance B</text>
  <rect class="dg-off" x="404" y="306" width="212" height="40" rx="6"/>
  <text class="dg-faint" x="510" y="326" dy="0.35em" text-anchor="middle">no sessions</text>
  <text class="dg-code" x="510" y="368" dy="0.35em" text-anchor="middle">401 Unauthorized</text>
</svg>
