<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <title>Logging in creates a session row, and the cookie carries its id back on later requests</title>
  <desc>Step 1: the browser posts an email and password to the login route. Step 2: the API checks them, makes a random id, and saves its hash in the sessions table. Step 3: the response sets a cookie holding the id. Step 4: a later request sends the cookie back. Step 5: the API hashes the id, finds the row, and answers as Ada.</desc>

  <rect class="dg-box" x="40" y="20" width="140" height="40" rx="8"/>
  <text x="110" y="40" dy="0.35em" text-anchor="middle">Browser</text>
  <rect class="dg-hot" x="270" y="20" width="140" height="40" rx="8"/>
  <text class="dg-on-hot" x="340" y="40" dy="0.35em" text-anchor="middle">Roombook API</text>
  <rect class="dg-box" x="500" y="20" width="140" height="40" rx="8"/>
  <text x="570" y="40" dy="0.35em" text-anchor="middle">sessions table</text>

  <path class="dg-line dg-dashed" d="M110 60 V440"/>
  <path class="dg-line dg-dashed" d="M340 60 V440"/>
  <path class="dg-line dg-dashed" d="M570 60 V440"/>

  <!-- Step 1 -->
  <circle class="dg-badge" cx="84" cy="110" r="10"/>
  <text class="dg-on-badge" x="84" y="110" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="225" y="96" dy="0.35em" text-anchor="middle">POST /v1/auth/login</text>
  <path class="dg-flow" d="M110 110 H336" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="225" y="126" dy="0.35em" text-anchor="middle">email and password</text>

  <!-- Step 2 -->
  <circle class="dg-badge" cx="314" cy="170" r="10"/>
  <text class="dg-on-badge" x="314" y="170" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="455" y="156" dy="0.35em" text-anchor="middle">save the hash of a new id</text>
  <path class="dg-line" d="M340 170 H566" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <circle class="dg-badge" cx="366" cy="230" r="10"/>
  <text class="dg-on-badge" x="366" y="230" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="225" y="216" dy="0.35em" text-anchor="middle">Set-Cookie: __Host-session=…</text>
  <path class="dg-line dg-dashed" d="M340 230 H114" marker-end="url(#arrow)"/>
  <text class="dg-note" x="225" y="246" dy="0.35em" text-anchor="middle">200, Ada's user</text>

  <!-- Step 4 -->
  <circle class="dg-badge" cx="84" cy="320" r="10"/>
  <text class="dg-on-badge" x="84" y="320" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="225" y="292" dy="0.35em" text-anchor="middle">GET /v1/me</text>
  <text class="dg-code" x="225" y="306" dy="0.35em" text-anchor="middle">Cookie: __Host-session=…</text>
  <path class="dg-flow" d="M110 320 H336" marker-end="url(#arrow-flow)"/>

  <!-- Step 5 -->
  <circle class="dg-badge" cx="314" cy="370" r="10"/>
  <text class="dg-on-badge" x="314" y="370" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-note" x="455" y="356" dy="0.35em" text-anchor="middle">find the hash</text>
  <path class="dg-line" d="M340 370 H566" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M570 394 H344" marker-end="url(#arrow)"/>
  <text class="dg-note" x="455" y="408" dy="0.35em" text-anchor="middle">user 1, Ada</text>
  <path class="dg-line dg-dashed" d="M340 420 H114" marker-end="url(#arrow)"/>
  <text class="dg-note" x="225" y="406" dy="0.35em" text-anchor="middle">200, Ada's user</text>
</svg>
