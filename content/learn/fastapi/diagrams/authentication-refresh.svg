<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
  <title>Refresh tokens rotate on every use, and a reused one revokes its family</title>
  <desc>Step 1: the phone app logs in and gets access token 1 and refresh token 1. Step 2: when the access token expires, the app swaps refresh token 1 for access token 2 and refresh token 2, and refresh token 1 is marked used. Step 3: a thief who copied refresh token 1 presents it. It's already used, so the API revokes the whole family and answers 401. Refresh token 2 stops working too.</desc>

  <rect class="dg-box" x="40" y="20" width="140" height="40" rx="8"/>
  <text x="110" y="40" dy="0.35em" text-anchor="middle">Phone app</text>
  <rect class="dg-hot" x="270" y="20" width="140" height="40" rx="8"/>
  <text class="dg-on-hot" x="340" y="40" dy="0.35em" text-anchor="middle">Roombook API</text>
  <rect class="dg-box" x="500" y="20" width="140" height="40" rx="8"/>
  <text x="570" y="40" dy="0.35em" text-anchor="middle">Thief</text>

  <path class="dg-line dg-dashed" d="M110 60 V420"/>
  <path class="dg-line dg-dashed" d="M340 60 V420"/>
  <path class="dg-line dg-dashed" d="M570 60 V420"/>

  <!-- Step 1: login -->
  <circle class="dg-badge" cx="84" cy="104" r="10"/>
  <text class="dg-on-badge" x="84" y="104" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="225" y="90" dy="0.35em" text-anchor="middle">POST /v1/auth/token</text>
  <path class="dg-flow" d="M110 104 H336" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M340 140 H114" marker-end="url(#arrow)"/>
  <text class="dg-note" x="225" y="156" dy="0.35em" text-anchor="middle">access 1, refresh 1</text>

  <!-- Step 2: rotate -->
  <circle class="dg-badge" cx="84" cy="214" r="10"/>
  <text class="dg-on-badge" x="84" y="214" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="225" y="200" dy="0.35em" text-anchor="middle">refresh with 1</text>
  <path class="dg-flow" d="M110 214 H336" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M340 250 H114" marker-end="url(#arrow)"/>
  <text class="dg-note" x="225" y="266" dy="0.35em" text-anchor="middle">access 2, refresh 2</text>
  <text class="dg-note" x="352" y="232" dy="0.35em">refresh 1 marked used</text>

  <!-- Step 3: reuse -->
  <circle class="dg-badge" cx="596" cy="324" r="10"/>
  <text class="dg-on-badge" x="596" y="324" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="455" y="310" dy="0.35em" text-anchor="middle">refresh with 1</text>
  <path class="dg-line" d="M570 324 H344" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M340 360 H566" marker-end="url(#arrow)"/>
  <text class="dg-note" x="455" y="376" dy="0.35em" text-anchor="middle">401</text>
  <rect class="dg-strong" x="200" y="388" width="280" height="40" rx="8"/>
  <text x="340" y="408" dy="0.35em" text-anchor="middle">Family revoked: refresh 2 dies</text>
</svg>
