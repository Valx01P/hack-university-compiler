<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>OAuth's four roles: the owner, the client, the authorization server, and the API</title>
  <desc>Step 1: the client, a calendar app, sends Ada to the authorization server. Step 2: Ada, the resource owner, signs in there and agrees. Step 3: the authorization server gives the client an access token. Step 4: the client calls the resource server, Roombook's API, with that token. The client never sees Ada's password.</desc>

  <rect class="dg-box" x="20" y="20" width="180" height="56" rx="8"/>
  <text x="110" y="39" dy="0.35em" text-anchor="middle">Resource owner
    <tspan class="dg-note" x="110" dy="1.4em">Ada</tspan>
  </text>
  <rect class="dg-box" x="440" y="20" width="220" height="56" rx="8"/>
  <text x="550" y="39" dy="0.35em" text-anchor="middle">Authorization server
    <tspan class="dg-note" x="550" dy="1.4em">signs in, asks, issues tokens</tspan>
  </text>
  <rect class="dg-box" x="20" y="300" width="180" height="56" rx="8"/>
  <text x="110" y="319" dy="0.35em" text-anchor="middle">Client
    <tspan class="dg-note" x="110" dy="1.4em">the calendar app</tspan>
  </text>
  <rect class="dg-hot" x="440" y="300" width="220" height="56" rx="8"/>
  <text class="dg-on-hot" x="550" y="319" dy="0.35em" text-anchor="middle">Resource server
    <tspan x="550" dy="1.4em">Roombook's API</tspan>
  </text>

  <!-- Step 1 -->
  <path class="dg-line" d="M200 320 H280 V68 H436" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="280" cy="200" r="10"/>
  <text class="dg-on-badge" x="280" y="200" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="358" y="86" dy="0.35em" text-anchor="middle">sends Ada to sign in</text>

  <!-- Step 2 -->
  <path class="dg-line" d="M200 52 H436" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="226" cy="52" r="10"/>
  <text class="dg-on-badge" x="226" y="52" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="330" y="36" dy="0.35em" text-anchor="middle">signs in and agrees</text>

  <!-- Step 3 -->
  <path class="dg-line dg-dashed" d="M480 76 V220 H300 V336 H204" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="480" cy="150" r="10"/>
  <text class="dg-on-badge" x="480" y="150" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-note" x="390" y="236" dy="0.35em" text-anchor="middle">access token</text>

  <!-- Step 4 -->
  <path class="dg-flow" d="M200 348 H436" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="226" cy="348" r="10"/>
  <text class="dg-on-badge" x="226" y="348" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="340" y="374" dy="0.35em" text-anchor="middle">API call with the token</text>
</svg>
