<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>From a name to a handler: DNS, then the IP and port, then the router</title>
  <desc>In step 1, the client asks a DNS resolver for the IP address of the API's name. In step 2, it connects to that address and port 443, and the computer hands the connection to the Roombook process listening on that port. Another program on the same computer, PostgreSQL, listens on port 5432, so this connection never reaches it. In step 3, the router inside Roombook matches the method and path. In step 4, it runs the handler for GET /v1/rooms/{roomId}.</desc>

  <!-- The client and DNS. -->
  <rect class="dg-box" x="20" y="40" width="160" height="56" rx="8"/>
  <text x="100" y="59" dy="0.35em" text-anchor="middle">DNS resolver
    <tspan class="dg-note" x="100" dy="1.4em">name to IP address</tspan>
  </text>
  <path class="dg-flow" d="M70 150 V100" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M130 96 V146" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="100" cy="123" r="10"/>
  <text class="dg-on-badge" x="100" y="123" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-strong" x="20" y="150" width="160" height="56" rx="8"/>
  <text x="100" y="169" dy="0.35em" text-anchor="middle">Client
    <tspan class="dg-note" x="100" dy="1.4em">curl, an app, a page</tspan>
  </text>

  <!-- The connection, to an IP address and a port. -->
  <path class="dg-flow" d="M180 178 H272" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="212" cy="156" r="10"/>
  <text class="dg-on-badge" x="212" y="156" dy="0.35em" text-anchor="middle">2</text>

  <!-- The computer. -->
  <rect class="dg-frame" x="240" y="20" width="420" height="356" rx="12"/>
  <text class="dg-note" x="260" y="42" dy="0.35em">A computer at <tspan class="dg-code">203.0.113.10</tspan></text>

  <!-- The Roombook process. -->
  <rect class="dg-frame" x="256" y="64" width="388" height="212" rx="12"/>
  <text class="dg-note" x="276" y="86" dy="0.35em">Roombook, listening on port <tspan class="dg-code">443</tspan></text>
  <circle class="dg-badge" cx="336" cy="130" r="10"/>
  <text class="dg-on-badge" x="336" y="130" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="276" y="150" width="120" height="56" rx="8"/>
  <text x="336" y="169" dy="0.35em" text-anchor="middle">Router
    <tspan class="dg-note" x="336" dy="1.4em">method and path</tspan>
  </text>

  <!-- The handlers. -->
  <rect class="dg-box" x="432" y="104" width="196" height="40" rx="8"/>
  <text class="dg-code" x="530" y="124" dy="0.35em" text-anchor="middle">POST /v1/bookings</text>
  <rect class="dg-hot" x="432" y="158" width="196" height="40" rx="8"/>
  <text class="dg-on-hot dg-code" x="530" y="178" dy="0.35em" text-anchor="middle">GET /v1/rooms/{roomId}</text>
  <rect class="dg-box" x="432" y="212" width="196" height="40" rx="8"/>
  <text class="dg-code" x="530" y="232" dy="0.35em" text-anchor="middle">GET /v1/buildings</text>
  <path class="dg-flow" d="M396 178 H428" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="412" cy="156" r="10"/>
  <text class="dg-on-badge" x="412" y="156" dy="0.35em" text-anchor="middle">4</text>

  <!-- Another program on the same computer. -->
  <rect class="dg-off" x="256" y="300" width="388" height="56" rx="8"/>
  <text class="dg-faint" x="450" y="319" dy="0.35em" text-anchor="middle">PostgreSQL, listening on port 5432
    <tspan x="450" dy="1.4em">another process, on another port</tspan>
  </text>
</svg>
