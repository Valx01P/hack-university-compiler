<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>One feedback document beside the same data split across three tables</title>
  <desc>On the left, one room_feedback document holds the booking and room ids, the rating, the comment, a list of tags, and a staff reply, all inside it. On the right, the same data needs three tables: feedback, feedback_tags with one row per tag, and feedback_replies. Each of the two smaller tables points back to feedback with a foreign key.</desc>

  <!-- The document: everything in one record. -->
  <text class="dg-heading" x="170" y="28" text-anchor="middle">One document</text>
  <rect class="dg-strong" x="20" y="44" width="300" height="256" rx="8"/>
  <text class="dg-code" x="40" y="72">{</text>
  <text class="dg-code" x="56" y="92">bookingId: 1001,</text>
  <text class="dg-code" x="56" y="112">roomId: 1,</text>
  <text class="dg-code" x="56" y="132">rating: 4,</text>
  <text class="dg-code" x="56" y="152">comment: "Great whiteboard",</text>
  <text class="dg-code" x="56" y="172">tags: ["whiteboard", "quiet"],</text>
  <text class="dg-code" x="56" y="192">reply: {</text>
  <text class="dg-code" x="72" y="212">staffId: 2,</text>
  <text class="dg-code" x="72" y="232">text: "Fan on order"</text>
  <text class="dg-code" x="56" y="252">}</text>
  <text class="dg-code" x="40" y="272">}</text>

  <!-- The same data as tables. -->
  <text class="dg-heading" x="520" y="28" text-anchor="middle">Three tables</text>
  <rect class="dg-box" x="380" y="44" width="280" height="84" rx="8"/>
  <text x="520" y="66" dy="0.35em" text-anchor="middle">feedback</text>
  <text class="dg-code" x="520" y="92" dy="0.35em" text-anchor="middle">id, booking_id, room_id,</text>
  <text class="dg-code" x="520" y="110" dy="0.35em" text-anchor="middle">rating, comment</text>

  <rect class="dg-box" x="380" y="148" width="280" height="64" rx="8"/>
  <text x="520" y="170" dy="0.35em" text-anchor="middle">feedback_tags</text>
  <text class="dg-code" x="520" y="194" dy="0.35em" text-anchor="middle">feedback_id, tag</text>

  <rect class="dg-box" x="380" y="236" width="280" height="64" rx="8"/>
  <text x="520" y="258" dy="0.35em" text-anchor="middle">feedback_replies</text>
  <text class="dg-code" x="520" y="282" dy="0.35em" text-anchor="middle">feedback_id, staff_id, text</text>

  <!-- Foreign keys point back to feedback. -->
  <path class="dg-line" d="M380 180 H350 V86 H376" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M380 268 H350 V180"/>
</svg>
