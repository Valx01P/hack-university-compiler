<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700">
  <title>The Roombook project's folders: what's there now, and what later lessons add</title>
  <desc>The roombook folder holds pyproject.toml, uv.lock, .python-version, the .venv folder, .gitignore, and the app package. Inside app, __init__.py makes it a package and main.py holds create_app and the app, and both exist now. Later lessons add config.py, errors.py, deps.py, one folder per feature (rooms, bookings, auth, and feedback), db.py for connections, and worker.py for background jobs, plus .env, and migrations, scripts, and tests folders next to app.</desc>

  <rect class="dg-frame" x="20" y="20" width="640" height="660" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">The Roombook project</text>
  <rect class="dg-hot" x="316" y="34" width="20" height="20" rx="4"/>
  <text class="dg-note" x="344" y="44" dy="0.35em">your code, now</text>
  <rect class="dg-off" x="480" y="34" width="20" height="20" rx="4"/>
  <text class="dg-note" x="508" y="44" dy="0.35em">added in later lessons</text>
