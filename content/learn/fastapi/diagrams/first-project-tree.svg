  <text class="dg-code" x="40" y="72" dy="0.35em">roombook/</text>
  <text class="dg-note" x="330" y="72" dy="0.35em">the project folder</text>
  <text class="dg-code" x="68" y="100" dy="0.35em">pyproject.toml</text>
  <text class="dg-note" x="330" y="100" dy="0.35em">the name, Python version, and dependencies</text>
  <text class="dg-code" x="68" y="128" dy="0.35em">uv.lock</text>
  <text class="dg-note" x="330" y="128" dy="0.35em">the exact versions installed</text>
  <text class="dg-code" x="68" y="156" dy="0.35em">.python-version</text>
  <text class="dg-note" x="330" y="156" dy="0.35em">the Python this project runs on</text>
  <text class="dg-code" x="68" y="184" dy="0.35em">.venv/</text>
  <text class="dg-note" x="330" y="184" dy="0.35em">its own Python and packages: never edit</text>
  <text class="dg-code" x="68" y="212" dy="0.35em">.gitignore</text>
  <text class="dg-note" x="330" y="212" dy="0.35em">what Git leaves out</text>
  <rect class="dg-off" x="62" y="229" width="46" height="22" rx="6"/>
  <text class="dg-faint dg-code" x="70" y="240" dy="0.35em">.env</text>
  <text class="dg-faint" x="330" y="240" dy="0.35em">settings for your computer alone</text>
  <text class="dg-code" x="68" y="268" dy="0.35em">app/</text>
  <text class="dg-note" x="330" y="268" dy="0.35em">your code, as a Python package</text>
  <text class="dg-code" x="96" y="296" dy="0.35em">__init__.py</text>
  <text class="dg-note" x="330" y="296" dy="0.35em">makes app a package</text>
