<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The outbox: a booking and its event commit together, and a relay moves the event on</title>
  <desc>Creating a booking inserts the booking row and an outbox row in one transaction. The relay reads outbox rows that aren't published yet, adds each event to the Redis stream roombook:events, and marks the row published. The email worker and the webhook sender each read the stream through their own consumer group.</desc>

  <!-- 1: one transaction -->
  <rect class="dg-frame" x="20" y="40" width="220" height="200" rx="12"/>
  <text class="dg-note" x="40" y="64" dy="0.35em">one transaction</text>
  <rect class="dg-box" x="40" y="88" width="180" height="48" rx="8"/>
  <text x="130" y="112" dy="0.35em" text-anchor="middle">bookings row</text>
  <rect class="dg-hot" x="40" y="164" width="180" height="48" rx="8"/>
  <text class="dg-on-hot" x="130" y="188" dy="0.35em" text-anchor="middle">outbox row</text>
  <circle class="dg-badge" cx="40" cy="40" r="10"/>
  <text class="dg-on-badge" x="40" y="40" dy="0.35em" text-anchor="middle">1</text>

  <!-- 2: the relay -->
  <rect class="dg-strong" x="290" y="164" width="120" height="48" rx="8"/>
  <text x="350" y="188" dy="0.35em" text-anchor="middle">Relay</text>
  <path class="dg-flow" d="M220 188 H286" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="254" cy="188" r="10"/>
  <text class="dg-on-badge" x="254" y="188" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="350" y="236" dy="0.35em" text-anchor="middle">SKIP LOCKED</text>

  <!-- 3: the stream -->
  <rect class="dg-box" x="460" y="40" width="200" height="56" rx="8"/>
  <text x="560" y="59" dy="0.35em" text-anchor="middle">Redis stream
    <tspan class="dg-code" x="560" dy="1.4em">roombook:events</tspan>
  </text>
  <path class="dg-flow" d="M410 176 H430 V68 H456" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="430" cy="122" r="10"/>
  <text class="dg-on-badge" x="430" y="122" dy="0.35em" text-anchor="middle">3</text>

  <!-- 4: the consumer groups -->
  <rect class="dg-box" x="460" y="164" width="200" height="48" rx="8"/>
  <text x="560" y="188" dy="0.35em" text-anchor="middle">email worker</text>
  <rect class="dg-box" x="460" y="252" width="200" height="48" rx="8"/>
  <text x="560" y="276" dy="0.35em" text-anchor="middle">webhook sender</text>
  <path class="dg-flow" d="M520 96 V160" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M640 96 V248" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="520" cy="128" r="10"/>
  <text class="dg-on-badge" x="520" y="128" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="350" y="96" dy="0.35em" text-anchor="middle">XADD</text>
</svg>
