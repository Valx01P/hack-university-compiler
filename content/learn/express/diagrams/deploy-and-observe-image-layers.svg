<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>An image as read-only layers, and two containers that share them</title>
  <desc>An image is a stack of read-only layers: a base system, the language runtime, the dependencies, and your code on top. Two containers started from the same image share those layers, and each adds its own thin writable layer, which disappears when that container is removed.</desc>
  <text class="dg-heading" x="140" y="34" dy="0.35em" text-anchor="middle">Image, read-only</text>
  <rect class="dg-hot" x="40" y="60" width="200" height="44" rx="8"/>
  <text class="dg-on-hot" x="140" y="82" dy="0.35em" text-anchor="middle">Your code</text>
  <rect class="dg-box" x="40" y="112" width="200" height="44" rx="8"/>
  <text x="140" y="134" dy="0.35em" text-anchor="middle">Dependencies</text>
  <rect class="dg-box" x="40" y="164" width="200" height="44" rx="8"/>
  <text x="140" y="186" dy="0.35em" text-anchor="middle">Language runtime</text>
  <rect class="dg-box" x="40" y="216" width="200" height="44" rx="8"/>
  <text x="140" y="238" dy="0.35em" text-anchor="middle">Base system</text>
  <text class="dg-note" x="140" y="286" dy="0.35em" text-anchor="middle">each build step adds a layer</text>
  <rect class="dg-frame" x="330" y="60" width="140" height="200" rx="12"/>
  <text class="dg-heading" x="400" y="84" dy="0.35em" text-anchor="middle">Container 1</text>
  <rect class="dg-off" x="345" y="106" width="110" height="40" rx="8"/>
  <text class="dg-faint" x="400" y="126" dy="0.35em" text-anchor="middle">writable layer</text>
  <rect class="dg-box" x="345" y="162" width="110" height="80" rx="8"/>
  <text x="400" y="192" dy="0.35em" text-anchor="middle">the image&#39;s</text>
  <text x="400" y="212" dy="0.35em" text-anchor="middle">layers</text>
  <rect class="dg-frame" x="510" y="60" width="140" height="200" rx="12"/>
  <text class="dg-heading" x="580" y="84" dy="0.35em" text-anchor="middle">Container 2</text>
  <rect class="dg-off" x="525" y="106" width="110" height="40" rx="8"/>
  <text class="dg-faint" x="580" y="126" dy="0.35em" text-anchor="middle">writable layer</text>
  <rect class="dg-box" x="525" y="162" width="110" height="80" rx="8"/>
  <text x="580" y="192" dy="0.35em" text-anchor="middle">the image&#39;s</text>
  <text x="580" y="212" dy="0.35em" text-anchor="middle">layers</text>
  <path class="dg-line dg-dashed" d="M240 186 H270 V280 H400 V246" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M400 280 H580 V246" marker-end="url(#arrow)"/>
  <text class="dg-note" x="490" y="298" dy="0.35em" text-anchor="middle">shared, never copied</text>
</svg>
