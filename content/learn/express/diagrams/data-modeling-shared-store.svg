<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Bookings kept in each process's memory, or in one shared database</title>
  <desc>On the left, two copies of the API each keep their own bookings in memory: copy 1 has bookings 1 and 2, and copy 2 has only booking 3. A restart wipes each list. On the right, both copies send their reads and writes to one database server, which holds bookings 1, 2, and 3 on disk.</desc>

  <!-- Left: memory in each process. -->
  <rect class="dg-frame" x="20" y="20" width="310" height="260" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">Memory in each process</text>

  <rect class="dg-box" x="40" y="72" width="270" height="56" rx="8"/>
  <text x="175" y="91" dy="0.35em" text-anchor="middle">API copy 1
    <tspan class="dg-note" x="175" dy="1.4em">bookings 1 and 2</tspan>
  </text>

  <rect class="dg-box" x="40" y="152" width="270" height="56" rx="8"/>
  <text x="175" y="171" dy="0.35em" text-anchor="middle">API copy 2
    <tspan class="dg-note" x="175" dy="1.4em">booking 3</tspan>
  </text>

  <text class="dg-note" x="175" y="246" dy="0.35em" text-anchor="middle">Each copy sees only its own list.</text>
  <text class="dg-note" x="175" y="264" dy="0.35em" text-anchor="middle">A restart wipes it.</text>

  <!-- Right: one shared database. -->
  <rect class="dg-frame" x="350" y="20" width="310" height="260" rx="12"/>
  <text class="dg-heading" x="370" y="44" dy="0.35em">One shared database</text>

  <rect class="dg-box" x="370" y="72" width="125" height="48" rx="8"/>
  <text x="432" y="96" dy="0.35em" text-anchor="middle">API copy 1</text>
  <rect class="dg-box" x="515" y="72" width="125" height="48" rx="8"/>
  <text x="577" y="96" dy="0.35em" text-anchor="middle">API copy 2</text>

  <path class="dg-flow" d="M432 120 V182" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M577 120 V182" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="505" y="152" dy="0.35em" text-anchor="middle">reads and writes</text>

  <rect class="dg-hot" x="370" y="186" width="270" height="56" rx="8"/>
  <text class="dg-on-hot" x="505" y="205" dy="0.35em" text-anchor="middle">Database server
    <tspan x="505" dy="1.4em">bookings 1, 2, and 3, on disk</tspan>
  </text>
</svg>
