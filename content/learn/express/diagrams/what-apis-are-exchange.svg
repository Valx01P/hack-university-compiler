<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>An API request and its response, with every part labeled</title>
  <desc>The request is POST /v1/bookings HTTP/1.1, then three headers: Host, Content-Type application/json, and Accept application/json, then a blank line that ends the headers, then a JSON body with the booking. The response is HTTP/1.1 201 Created, then three headers: Content-Type, Location /v1/bookings/1001, and Content-Length, then a blank line, then the new booking as JSON.</desc>

  <!-- The request. -->
  <text class="dg-heading" x="20" y="20" dy="0.35em">Request <tspan class="dg-note">from the client</tspan></text>
  <rect class="dg-box" x="20" y="36" width="420" height="148" rx="8"/>
  <text class="dg-code" x="36" y="58" dy="0.35em">POST /v1/bookings HTTP/1.1</text>
  <text class="dg-code" x="36" y="80" dy="0.35em">Host: api.roombook.example</text>
  <text class="dg-code" x="36" y="102" dy="0.35em">Content-Type: application/json</text>
  <text class="dg-code" x="36" y="124" dy="0.35em">Accept: application/json</text>
  <text class="dg-code" x="36" y="168" dy="0.35em">{"roomId": 1, "attendees": 3, ...}</text>

  <path class="dg-line" d="M448 58 H464"/>
  <text x="472" y="50" dy="0.35em">request line
    <tspan class="dg-note" x="472" dy="1.4em">method, path, version</tspan>
  </text>
  <path class="dg-line" d="M448 72 H456 V132 H448"/>
  <text x="472" y="94" dy="0.35em">headers
    <tspan class="dg-note" x="472" dy="1.4em">facts about the message</tspan>
  </text>
  <path class="dg-line" d="M448 146 H464"/>
  <text class="dg-note" x="472" y="146" dy="0.35em">a blank line ends the headers</text>
  <path class="dg-line" d="M448 168 H464"/>
  <text x="472" y="168" dy="0.35em">body <tspan class="dg-note">the booking, as JSON</tspan></text>

  <!-- The response. -->
  <text class="dg-heading" x="20" y="220" dy="0.35em">Response <tspan class="dg-note">from Roombook</tspan></text>
  <rect class="dg-strong" x="20" y="236" width="420" height="148" rx="8"/>
  <text class="dg-code" x="36" y="258" dy="0.35em">HTTP/1.1 201 Created</text>
  <text class="dg-code" x="36" y="280" dy="0.35em">Content-Type: application/json</text>
  <text class="dg-code" x="36" y="302" dy="0.35em">Location: /v1/bookings/1001</text>
  <text class="dg-code" x="36" y="324" dy="0.35em">Content-Length: 213</text>
  <text class="dg-code" x="36" y="368" dy="0.35em">{"id": 1001, "status": "confirmed", ...}</text>

  <path class="dg-line" d="M448 258 H464"/>
  <text x="472" y="250" dy="0.35em">status line
    <tspan class="dg-note" x="472" dy="1.4em">version, code, a few words</tspan>
  </text>
  <path class="dg-line" d="M448 272 H456 V332 H448"/>
  <text x="472" y="294" dy="0.35em">headers
    <tspan class="dg-note" x="472" dy="1.4em">where the booking now lives</tspan>
  </text>
  <path class="dg-line" d="M448 346 H464"/>
  <text class="dg-note" x="472" y="346" dy="0.35em">a blank line ends the headers</text>
  <path class="dg-line" d="M448 368 H464"/>
  <text x="472" y="368" dy="0.35em">body <tspan class="dg-note">the new booking</tspan></text>
</svg>
