<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220">
  <title>Database libraries, from writing every query yourself to never seeing one</title>
  <desc>Four kinds of library in a row. A driver, which this course uses, sends the SQL you write. A query builder builds SQL from function calls. SQL-first tools make typed functions from SQL you write. An ORM maps your types to tables and writes the SQL itself. Moving right, the library writes more of the SQL and you see less of it.</desc>

  <text class="dg-note" x="40" y="28" dy="0.35em">You write the SQL</text>
  <text class="dg-note" x="640" y="28" dy="0.35em" text-anchor="end">The library writes it</text>
  <path class="dg-line" d="M40 48 H636" marker-end="url(#arrow)"/>

  <rect class="dg-hot" x="40" y="68" width="144" height="56" rx="8"/>
  <text class="dg-on-hot" x="112" y="87" dy="0.35em" text-anchor="middle">Driver
    <tspan x="112" dy="1.4em">this course</tspan>
  </text>
  <rect class="dg-box" x="192" y="68" width="144" height="56" rx="8"/>
  <text x="264" y="96" dy="0.35em" text-anchor="middle">Query builder</text>
  <rect class="dg-box" x="344" y="68" width="144" height="56" rx="8"/>
  <text x="416" y="96" dy="0.35em" text-anchor="middle">SQL-first</text>
  <rect class="dg-box" x="496" y="68" width="144" height="56" rx="8"/>
  <text x="568" y="96" dy="0.35em" text-anchor="middle">ORM</text>

  <text class="dg-note" x="112" y="150" dy="0.35em" text-anchor="middle">you write
    <tspan x="112" dy="1.4em">every query</tspan>
  </text>
  <text class="dg-note" x="264" y="150" dy="0.35em" text-anchor="middle">SQL built from
    <tspan x="264" dy="1.4em">function calls</tspan>
  </text>
  <text class="dg-note" x="416" y="150" dy="0.35em" text-anchor="middle">functions made
    <tspan x="416" dy="1.4em">from your SQL</tspan>
  </text>
  <text class="dg-note" x="568" y="150" dy="0.35em" text-anchor="middle">your types mapped
    <tspan x="568" dy="1.4em">to tables</tspan>
  </text>
</svg>
