<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <title>Roombook's layers: controller, service, and repository, calling downward only</title>
  <desc>A client's JSON request reaches the controller, which passes a NewBooking to the service, which passes domain values to the repository, which reads and writes storage: memory now, PostgreSQL from the raw SQL lesson on. Every arrow points down. Beside the three layers, the model's types, like Booking, Room, and the domain errors, are used by all of them.</desc>

  <rect class="dg-box" x="40" y="20" width="300" height="40" rx="8"/>
  <text x="190" y="40" dy="0.35em" text-anchor="middle">Client</text>
  <path class="dg-flow" d="M190 60 V106" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="200" y="84" dy="0.35em">JSON request</text>

  <rect class="dg-hot" x="40" y="110" width="300" height="64" rx="8"/>
  <text class="dg-on-hot" x="190" y="132" dy="0.35em" text-anchor="middle">Controller
    <tspan x="190" dy="1.4em">HTTP in, view out</tspan>
  </text>
  <path class="dg-flow" d="M190 174 V220" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="200" y="198" dy="0.35em">a NewBooking</text>

  <rect class="dg-strong" x="40" y="224" width="300" height="64" rx="8"/>
  <text x="190" y="246" dy="0.35em" text-anchor="middle">Service
    <tspan class="dg-note" x="190" dy="1.4em">business rules</tspan>
  </text>
  <path class="dg-flow" d="M190 288 V334" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="200" y="312" dy="0.35em">domain values</text>

  <rect class="dg-strong" x="40" y="338" width="300" height="64" rx="8"/>
  <text x="190" y="360" dy="0.35em" text-anchor="middle">Repository
    <tspan class="dg-note" x="190" dy="1.4em">the only storage code</tspan>
  </text>
  <path class="dg-line" d="M190 402 V420" marker-end="url(#arrow)"/>

  <rect class="dg-off" x="40" y="424" width="300" height="40" rx="8"/>
  <text class="dg-faint" x="190" y="444" dy="0.35em" text-anchor="middle">memory now, PostgreSQL later</text>

  <!-- The model, shared by every layer. -->
  <rect class="dg-frame" x="400" y="110" width="260" height="262" rx="12"/>
  <text class="dg-heading" x="530" y="140" dy="0.35em" text-anchor="middle">Model</text>
  <text class="dg-note" x="530" y="166" dy="0.35em" text-anchor="middle">used by every layer</text>
  <rect class="dg-box" x="430" y="196" width="200" height="40" rx="8"/>
  <text class="dg-code" x="530" y="216" dy="0.35em" text-anchor="middle">Booking</text>
  <rect class="dg-box" x="430" y="252" width="200" height="40" rx="8"/>
  <text class="dg-code" x="530" y="272" dy="0.35em" text-anchor="middle">Room</text>
  <rect class="dg-box" x="430" y="308" width="200" height="40" rx="8"/>
  <text x="530" y="328" dy="0.35em" text-anchor="middle">domain errors</text>
</svg>
