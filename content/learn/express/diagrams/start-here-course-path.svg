<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 660">
  <title>The course's path, from what APIs are to running one in production</title>
  <desc>The course in seven sections, in three stretches. To understand: APIs and servers. To build: handling requests, structure and data, authentication and authorization, then using and testing the API. To scale and ship: distributed systems, then production. Beside each section is what Roombook, the course's API, gains in it. After the course, the React and Next.js courses build apps that call APIs like it.</desc>

  <!-- Column heading for what Roombook gains. -->
  <text class="dg-heading" x="452" y="32" dy="0.35em">Roombook gains</text>

  <!-- Understand. -->
  <text class="dg-heading" x="72" y="32" dy="0.35em">Understand <tspan class="dg-note">what APIs and servers are</tspan></text>
  <circle class="dg-badge" cx="40" cy="78" r="10"/>
  <text class="dg-on-badge" x="40" y="78" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-hot" x="72" y="52" width="360" height="52" rx="8"/>
  <text class="dg-on-hot" x="92" y="68" dy="0.35em">APIs and Servers
    <tspan x="92" dy="1.4em">what they are, the styles, a first project</tspan>
  </text>
  <text class="dg-note" x="452" y="78" dy="0.35em">a first endpoint</text>
  <path class="dg-flow" d="M40 88 V168" marker-end="url(#arrow-flow)"/>

  <!-- Build. -->
  <text class="dg-heading" x="72" y="136" dy="0.35em">Build <tspan class="dg-note">the API, one layer at a time</tspan></text>
  <circle class="dg-badge" cx="40" cy="182" r="10"/>
  <text class="dg-on-badge" x="40" y="182" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="72" y="156" width="360" height="52" rx="8"/>
  <text x="92" y="173" dy="0.35em">Handling Requests
    <tspan class="dg-note" x="92" dy="1.4em">routes, request data, middleware, errors</tspan>
  </text>
  <text class="dg-note" x="452" y="182" dy="0.35em">rooms and bookings</text>
  <path class="dg-flow" d="M40 192 V232" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="40" cy="246" r="10"/>
  <text class="dg-on-badge" x="40" y="246" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="72" y="220" width="360" height="52" rx="8"/>
  <text x="92" y="237" dy="0.35em">Structure and Data
    <tspan class="dg-note" x="92" dy="1.4em">layers, SQL, PostgreSQL, MongoDB</tspan>
  </text>
  <text class="dg-note" x="452" y="246" dy="0.35em">no double bookings</text>
  <path class="dg-flow" d="M40 256 V296" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="40" cy="310" r="10"/>
  <text class="dg-on-badge" x="40" y="310" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-box" x="72" y="284" width="360" height="52" rx="8"/>
  <text x="92" y="301" dy="0.35em">Authentication and Authorization
    <tspan class="dg-note" x="92" dy="1.4em">passwords, sessions, tokens, permissions</tspan>
  </text>
  <text class="dg-note" x="452" y="310" dy="0.35em">logins, tokens, API keys</text>
  <path class="dg-flow" d="M40 320 V360" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="40" cy="374" r="10"/>
  <text class="dg-on-badge" x="40" y="374" dy="0.35em" text-anchor="middle">5</text>
  <rect class="dg-box" x="72" y="348" width="360" height="52" rx="8"/>
  <text x="92" y="365" dy="0.35em">Using and Testing the API
    <tspan class="dg-note" x="92" dy="1.4em">curl, Postman, OpenAPI, tests</tspan>
  </text>
  <text class="dg-note" x="452" y="374" dy="0.35em">docs and tests</text>
  <path class="dg-flow" d="M40 384 V464" marker-end="url(#arrow-flow)"/>

  <!-- Scale and ship. -->
  <text class="dg-heading" x="72" y="432" dy="0.35em">Scale and ship <tspan class="dg-note">many servers, then real users</tspan></text>
  <circle class="dg-badge" cx="40" cy="478" r="10"/>
  <text class="dg-on-badge" x="40" y="478" dy="0.35em" text-anchor="middle">6</text>
  <rect class="dg-box" x="72" y="452" width="360" height="52" rx="8"/>
  <text x="92" y="469" dy="0.35em">Distributed Systems
    <tspan class="dg-note" x="92" dy="1.4em">many servers, Redis, retries, replicas</tspan>
  </text>
  <text class="dg-note" x="452" y="478" dy="0.35em">a cache, live updates</text>
  <path class="dg-flow" d="M40 488 V528" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="40" cy="542" r="10"/>
  <text class="dg-on-badge" x="40" y="542" dy="0.35em" text-anchor="middle">7</text>
  <rect class="dg-box" x="72" y="516" width="360" height="52" rx="8"/>
  <text x="92" y="533" dy="0.35em">Production
    <tspan class="dg-note" x="92" dy="1.4em">security, Docker, logs, metrics, traces</tspan>
  </text>
  <text class="dg-note" x="452" y="542" dy="0.35em">a Docker image to watch</text>

  <!-- After the course. -->
  <path class="dg-line dg-dashed" d="M40 552 V620 H68" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="72" y="600" width="360" height="40" rx="8"/>
  <text class="dg-faint" x="92" y="620" dy="0.35em">Next: a React or Next.js app in front of it</text>
</svg>
