<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
  <title>One OpenAPI document feeds docs, clients, mocks, tests, linters, and Postman</title>
  <desc>On the left is one OpenAPI document, the spec. Lines run from it to six tools on the right: a docs page such as Swagger UI, Redoc, or Scalar, typed clients and SDKs, a mock server that answers from the examples, contract tests that check the API against it, a linter for style rules, and Postman, which imports it as a collection.</desc>

  <!-- The spec. -->
  <rect class="dg-hot" x="20" y="180" width="200" height="72" rx="8"/>
  <text class="dg-on-hot" x="120" y="206" dy="0.35em" text-anchor="middle">OpenAPI spec
    <tspan x="120" dy="1.4em">openapi.yaml</tspan>
  </text>

  <!-- Lines out to each tool. -->
  <path class="dg-line" d="M220 216 H300"/>
  <path class="dg-line" d="M300 48 V392"/>
  <path class="dg-line" d="M300 48 H416" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M300 116 H416" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M300 184 H416" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M300 252 H416" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M300 320 H416" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M300 392 H416" marker-end="url(#arrow)"/>

  <!-- The tools. -->
  <rect class="dg-box" x="420" y="20" width="240" height="56" rx="8"/>
  <text x="540" y="39" dy="0.35em" text-anchor="middle">Docs page
    <tspan class="dg-note" x="540" dy="1.4em">Swagger UI, Redoc, Scalar</tspan>
  </text>
  <rect class="dg-box" x="420" y="88" width="240" height="56" rx="8"/>
  <text x="540" y="107" dy="0.35em" text-anchor="middle">Typed clients
    <tspan class="dg-note" x="540" dy="1.4em">an SDK in each language</tspan>
  </text>
  <rect class="dg-box" x="420" y="156" width="240" height="56" rx="8"/>
  <text x="540" y="175" dy="0.35em" text-anchor="middle">Mock server
    <tspan class="dg-note" x="540" dy="1.4em">answers from the examples</tspan>
  </text>
  <rect class="dg-box" x="420" y="224" width="240" height="56" rx="8"/>
  <text x="540" y="243" dy="0.35em" text-anchor="middle">Contract tests
    <tspan class="dg-note" x="540" dy="1.4em">is the API true to it?</tspan>
  </text>
  <rect class="dg-box" x="420" y="292" width="240" height="56" rx="8"/>
  <text x="540" y="311" dy="0.35em" text-anchor="middle">Linter
    <tspan class="dg-note" x="540" dy="1.4em">style rules for the spec</tspan>
  </text>
  <rect class="dg-box" x="420" y="364" width="240" height="56" rx="8"/>
  <text x="540" y="383" dy="0.35em" text-anchor="middle">Postman
    <tspan class="dg-note" x="540" dy="1.4em">imported as a collection</tspan>
  </text>
</svg>
