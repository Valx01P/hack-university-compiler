<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>A graceful shutdown, from SIGTERM to exit, inside the platform's 30 seconds</title>
  <desc>At 0 seconds SIGTERM arrives and readiness turns to 503. For about 5 seconds the server waits while the load balancer stops sending requests. Then it stops accepting connections and finishes the requests in flight, while workers finish their current job. Then it closes the pools and exits. At 30 seconds the platform would send SIGKILL.</desc>

  <!-- the steps -->
  <rect class="dg-box" x="40" y="60" width="120" height="56" rx="8"/>
  <text x="100" y="79" dy="0.35em" text-anchor="middle">readiness 503
    <tspan class="dg-note" x="100" dy="1.4em">then wait</tspan>
  </text>
  <rect class="dg-hot" x="160" y="60" width="260" height="56" rx="8"/>
  <text class="dg-on-hot" x="290" y="79" dy="0.35em" text-anchor="middle">stop accepting,
    <tspan x="290" dy="1.4em">finish requests in flight</tspan>
  </text>
  <rect class="dg-box" x="160" y="124" width="260" height="40" rx="8"/>
  <text x="290" y="144" dy="0.35em" text-anchor="middle">workers finish the job in hand</text>
  <rect class="dg-box" x="420" y="60" width="110" height="56" rx="8"/>
  <text x="475" y="79" dy="0.35em" text-anchor="middle">close pools
    <tspan class="dg-note" x="475" dy="1.4em">exit 0</tspan>
  </text>
  <rect class="dg-off" x="560" y="60" width="100" height="56" rx="8"/>
  <text class="dg-faint" x="610" y="79" dy="0.35em" text-anchor="middle">SIGKILL
    <tspan x="610" dy="1.4em">if still running</tspan>
  </text>

  <!-- badges -->
  <circle class="dg-badge" cx="40" cy="36" r="10"/>
  <text class="dg-on-badge" x="40" y="36" dy="0.35em" text-anchor="middle">1</text>
  <circle class="dg-badge" cx="100" cy="36" r="10"/>
  <text class="dg-on-badge" x="100" y="36" dy="0.35em" text-anchor="middle">2</text>
  <circle class="dg-badge" cx="290" cy="36" r="10"/>
  <text class="dg-on-badge" x="290" y="36" dy="0.35em" text-anchor="middle">3</text>
  <circle class="dg-badge" cx="290" cy="184" r="10"/>
  <text class="dg-on-badge" x="290" y="184" dy="0.35em" text-anchor="middle">4</text>
  <circle class="dg-badge" cx="475" cy="36" r="10"/>
  <text class="dg-on-badge" x="475" y="36" dy="0.35em" text-anchor="middle">5</text>

  <!-- the time axis -->
  <path class="dg-line" d="M40 220 H660"/>
  <path class="dg-line" d="M40 212 V228"/>
  <path class="dg-line" d="M160 212 V228"/>
  <path class="dg-line" d="M420 212 V228"/>
  <path class="dg-line" d="M560 212 V228"/>
  <text class="dg-code" x="40" y="246" dy="0.35em" text-anchor="middle">0 s</text>
  <text class="dg-code" x="160" y="246" dy="0.35em" text-anchor="middle">5 s</text>
  <text class="dg-code" x="420" y="246" dy="0.35em" text-anchor="middle">at most 25 s</text>
  <text class="dg-code" x="560" y="246" dy="0.35em" text-anchor="middle">30 s</text>
  <text class="dg-note" x="40" y="268" dy="0.35em">SIGTERM</text>
</svg>
