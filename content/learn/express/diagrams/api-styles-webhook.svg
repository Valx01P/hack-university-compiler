<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>Roombook sends a signed webhook, and retries when the first try fails</title>
  <desc>In step 1, a booking is confirmed in Roombook. In step 2, Roombook sends a signed POST to the URL the calendar app registered, and the calendar app answers 503 because it's busy. In step 3, Roombook waits a minute. In step 4, it sends the same event again, with the same event id, and the calendar app checks the signature and answers 200 OK.</desc>

  <!-- The two servers. -->
  <rect class="dg-hot" x="20" y="20" width="180" height="56" rx="8"/>
  <text class="dg-on-hot" x="110" y="39" dy="0.35em" text-anchor="middle">Roombook
    <tspan x="110" dy="1.4em">the sender</tspan>
  </text>
  <rect class="dg-box" x="480" y="20" width="180" height="56" rx="8"/>
  <text x="570" y="39" dy="0.35em" text-anchor="middle">Calendar app
    <tspan class="dg-note" x="570" dy="1.4em">the receiver</tspan>
  </text>
  <path class="dg-line" d="M110 76 V380"/>
  <path class="dg-line" d="M570 76 V380"/>

  <!-- 1: the event. -->
  <circle class="dg-badge" cx="60" cy="112" r="10"/>
  <text class="dg-on-badge" x="60" y="112" dy="0.35em" text-anchor="middle">1</text>
  <text x="126" y="112" dy="0.35em">a booking is confirmed</text>

  <!-- 2: the first try fails. -->
  <circle class="dg-badge" cx="60" cy="160" r="10"/>
  <text class="dg-on-badge" x="60" y="160" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="340" y="146" dy="0.35em" text-anchor="middle">POST /hooks/roombook</text>
  <path class="dg-flow" d="M110 160 H566" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="178" dy="0.35em" text-anchor="middle">503, too busy</text>
  <path class="dg-line dg-dashed" d="M570 192 H114" marker-end="url(#arrow)"/>

  <!-- 3: wait. -->
  <circle class="dg-badge" cx="60" cy="236" r="10"/>
  <text class="dg-on-badge" x="60" y="236" dy="0.35em" text-anchor="middle">3</text>
  <text x="126" y="236" dy="0.35em">waits a minute</text>

  <!-- 4: the retry works. -->
  <circle class="dg-badge" cx="60" cy="284" r="10"/>
  <text class="dg-on-badge" x="60" y="284" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="340" y="270" dy="0.35em" text-anchor="middle">POST /hooks/roombook</text>
  <path class="dg-flow" d="M110 284 H566" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="302" dy="0.35em" text-anchor="middle">200 OK</text>
  <path class="dg-line dg-dashed" d="M570 316 H114" marker-end="url(#arrow)"/>
  <text class="dg-note" x="554" y="344" dy="0.35em" text-anchor="end">same event id, signature checked</text>
</svg>
