<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>The pieces of one API request's address, and the endpoint they make</title>
  <desc>The request GET https://api.roombook.example/v1/rooms/3/availability?date=2026-10-05, split into pieces. GET is the method, what to do. https is the scheme. api.roombook.example is the host. /v1 is the API's version. /rooms is the collection of all rooms, /3 picks one room, and /availability is a sub-resource that belongs to it. The query string date=2026-10-05 is an option, the day. Together, the method and the path pattern make the endpoint GET /v1/rooms/{roomId}/availability, and the values pick the resource: room 3's free times that day.</desc>

  <!-- Labels above. -->
  <text x="43" y="40" dy="0.35em" text-anchor="middle">method</text>
  <text class="dg-note" x="43" y="58" dy="0.35em" text-anchor="middle">what to do</text>
  <path class="dg-line" d="M32 86 V78 H55 V86"/>
  <text x="214" y="40" dy="0.35em" text-anchor="middle">host</text>
  <text class="dg-note" x="214" y="58" dy="0.35em" text-anchor="middle">which computer</text>
  <path class="dg-line" d="M139 86 V78 H289 V86"/>
  <text x="358" y="40" dy="0.35em" text-anchor="middle">collection</text>
  <text class="dg-note" x="358" y="58" dy="0.35em" text-anchor="middle">all the rooms</text>
  <path class="dg-line" d="M335 86 V78 H380 V86"/>
  <text x="468" y="40" dy="0.35em" text-anchor="middle">sub-resource</text>
  <text class="dg-note" x="468" y="58" dy="0.35em" text-anchor="middle">part of room 3</text>
  <path class="dg-line" d="M419 86 V78 H517 V86"/>

  <!-- The request, piece by piece. -->
  <text class="dg-code" x="43" y="102" dy="0.35em" text-anchor="middle">GET</text>
  <text class="dg-code" x="97" y="102" dy="0.35em" text-anchor="middle">https://</text>
  <text class="dg-code" x="214" y="102" dy="0.35em" text-anchor="middle">api.roombook.example</text>
  <text class="dg-code" x="312" y="102" dy="0.35em" text-anchor="middle">/v1</text>
  <text class="dg-code" x="358" y="102" dy="0.35em" text-anchor="middle">/rooms</text>
  <text class="dg-code" x="400" y="102" dy="0.35em" text-anchor="middle">/3</text>
  <text class="dg-code" x="468" y="102" dy="0.35em" text-anchor="middle">/availability</text>
  <text class="dg-code" x="589" y="102" dy="0.35em" text-anchor="middle">?date=2026-10-05</text>

  <!-- Labels below. -->
  <path class="dg-line" d="M67 118 V126 H127 V118"/>
  <text x="97" y="146" dy="0.35em" text-anchor="middle">scheme</text>
  <text class="dg-note" x="97" y="164" dy="0.35em" text-anchor="middle">how to talk</text>
  <path class="dg-line" d="M301 118 V126 H323 V118"/>
  <text x="312" y="146" dy="0.35em" text-anchor="middle">version</text>
  <text class="dg-note" x="312" y="164" dy="0.35em" text-anchor="middle">which contract</text>
  <path class="dg-line" d="M392 118 V126 H408 V118"/>
  <text x="400" y="146" dy="0.35em" text-anchor="middle">id</text>
  <text class="dg-note" x="400" y="164" dy="0.35em" text-anchor="middle">one room</text>
  <path class="dg-line" d="M529 118 V126 H649 V118"/>
  <text x="589" y="146" dy="0.35em" text-anchor="middle">query</text>
  <text class="dg-note" x="589" y="164" dy="0.35em" text-anchor="middle">options: the day</text>

  <!-- What they add up to. -->
  <rect class="dg-box" x="20" y="192" width="640" height="68" rx="8"/>
  <text class="dg-note" x="40" y="212" dy="0.35em">endpoint</text>
  <text class="dg-code" x="140" y="212" dy="0.35em">GET /v1/rooms/{roomId}/availability</text>
  <text class="dg-note" x="40" y="240" dy="0.35em">resource</text>
  <text x="140" y="240" dy="0.35em">room 3's free times on 5 October 2026</text>
</svg>
