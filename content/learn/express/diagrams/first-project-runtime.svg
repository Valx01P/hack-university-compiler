<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>How Node.js runs many requests on one JavaScript thread</title>
  <desc>On the left, the one JavaScript thread: a call stack that runs one callback at a time, and the event loop under it. On the right, libuv: the operating system watching network sockets, and a pool of four threads for files, DNS, crypto, and compression. In step 1, a handler starts slow work and hands it to libuv. In step 2, libuv puts the finished work's callback with the ready callbacks in the middle. In step 3, the event loop takes the next one, and in step 4 it runs on the stack.</desc>

  <!-- The JavaScript thread. -->
  <rect class="dg-frame" x="20" y="20" width="220" height="360" rx="12"/>
  <text class="dg-heading" x="36" y="44" dy="0.35em">JavaScript thread</text>
  <rect class="dg-hot" x="36" y="72" width="188" height="56" rx="8"/>
  <text class="dg-on-hot" x="130" y="90" dy="0.35em" text-anchor="middle">Call stack
    <tspan x="130" dy="1.4em">one callback at a time</tspan>
  </text>
  <rect class="dg-strong" x="36" y="272" width="188" height="56" rx="8"/>
  <text x="130" y="290" dy="0.35em" text-anchor="middle">Event loop
    <tspan class="dg-note" x="130" dy="1.4em">takes the next callback</tspan>
  </text>

  <!-- Callbacks waiting their turn. -->
  <rect class="dg-box" x="264" y="244" width="152" height="112" rx="8"/>
  <text x="280" y="266" dy="0.35em">Ready callbacks</text>
  <text class="dg-code" x="280" y="294" dy="0.35em">request arrived</text>
  <text class="dg-code" x="280" y="314" dy="0.35em">query answered</text>
  <text class="dg-code" x="280" y="334" dy="0.35em">timer fired</text>

  <!-- libuv. -->
  <rect class="dg-frame" x="460" y="20" width="200" height="360" rx="12"/>
  <text class="dg-heading" x="476" y="44" dy="0.35em">libuv</text>
  <rect class="dg-box" x="476" y="72" width="168" height="56" rx="8"/>
  <text x="560" y="90" dy="0.35em" text-anchor="middle">Operating system
    <tspan class="dg-note" x="560" dy="1.4em">watches the sockets</tspan>
  </text>
  <rect class="dg-box" x="476" y="148" width="168" height="112" rx="8"/>
  <text x="560" y="168" dy="0.35em" text-anchor="middle">Thread pool</text>
  <rect class="dg-off" x="492" y="188" width="64" height="28" rx="6"/>
  <text class="dg-faint" x="524" y="202" dy="0.35em" text-anchor="middle">files</text>
  <rect class="dg-off" x="564" y="188" width="64" height="28" rx="6"/>
  <text class="dg-faint" x="596" y="202" dy="0.35em" text-anchor="middle">DNS</text>
  <rect class="dg-off" x="492" y="222" width="64" height="28" rx="6"/>
  <text class="dg-faint" x="524" y="236" dy="0.35em" text-anchor="middle">crypto</text>
  <rect class="dg-off" x="564" y="222" width="64" height="28" rx="6"/>
  <text class="dg-faint" x="596" y="236" dy="0.35em" text-anchor="middle">gzip</text>

  <!-- 1: start slow work. -->
  <path class="dg-line" d="M224 100 H456" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="300" cy="100" r="10"/>
  <text class="dg-on-badge" x="300" y="100" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="318" y="84" dy="0.35em">start the work</text>

  <!-- 2: done, its callback is ready. -->
  <path class="dg-line dg-dashed" d="M460 300 H420" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="440" cy="276" r="10"/>
  <text class="dg-on-badge" x="440" y="276" dy="0.35em" text-anchor="middle">2</text>

  <!-- 3 and 4: the loop runs the next one. -->
  <path class="dg-flow" d="M264 300 H228" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="246" cy="276" r="10"/>
  <text class="dg-on-badge" x="246" y="276" dy="0.35em" text-anchor="middle">3</text>
  <path class="dg-flow" d="M130 272 V132" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="152" cy="200" r="10"/>
  <text class="dg-on-badge" x="152" y="200" dy="0.35em" text-anchor="middle">4</text>
</svg>
