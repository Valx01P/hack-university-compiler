<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>A deployment pipeline: merge, test, build one image, then staging and production</title>
  <desc>A merged change goes to CI, which runs the tests and the dependency audit. CI builds one container image and pushes it to a registry with a version tag. Staging runs that image with its own settings and fake data, and production then runs the very same image with production settings and real data.</desc>
  <circle class="dg-badge" cx="68" cy="36" r="10"/>
  <text class="dg-on-badge" x="68" y="36" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-box" x="20" y="60" width="96" height="56" rx="8"/>
  <text x="68" y="79" dy="0.35em" text-anchor="middle">Merge</text>
  <text class="dg-note" x="68" y="98" dy="0.35em" text-anchor="middle">a change</text>
  <path class="dg-flow" d="M116 88 H142" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="200" cy="36" r="10"/>
  <text class="dg-on-badge" x="200" y="36" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="146" y="60" width="108" height="56" rx="8"/>
  <text x="200" y="79" dy="0.35em" text-anchor="middle">CI</text>
  <text class="dg-note" x="200" y="98" dy="0.35em" text-anchor="middle">tests, audit</text>
  <path class="dg-flow" d="M254 88 H280" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="332" cy="36" r="10"/>
  <text class="dg-on-badge" x="332" y="36" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-hot" x="284" y="60" width="96" height="56" rx="8"/>
  <text class="dg-on-hot" x="332" y="79" dy="0.35em" text-anchor="middle">Build</text>
  <text class="dg-on-hot" x="332" y="98" dy="0.35em" text-anchor="middle">the image</text>
  <path class="dg-flow" d="M380 88 H406" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="462" cy="36" r="10"/>
  <text class="dg-on-badge" x="462" y="36" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-box" x="410" y="60" width="104" height="56" rx="8"/>
  <text x="462" y="79" dy="0.35em" text-anchor="middle">Staging</text>
  <text class="dg-note" x="462" y="98" dy="0.35em" text-anchor="middle">fake data</text>
  <path class="dg-flow" d="M514 88 H540" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="604" cy="36" r="10"/>
  <text class="dg-on-badge" x="604" y="36" dy="0.35em" text-anchor="middle">5</text>
  <rect class="dg-strong" x="544" y="60" width="120" height="56" rx="8"/>
  <text x="604" y="79" dy="0.35em" text-anchor="middle">Production</text>
  <text class="dg-note" x="604" y="98" dy="0.35em" text-anchor="middle">real data</text>
  <rect class="dg-box" x="284" y="190" width="230" height="56" rx="8"/>
  <text x="399" y="209" dy="0.35em" text-anchor="middle">Registry</text>
  <text class="dg-code" x="399" y="228" dy="0.35em" text-anchor="middle">roombook-api:1.4.0</text>
  <path class="dg-line" d="M332 116 V186" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M462 190 V120" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M514 218 H604 V120" marker-end="url(#arrow)"/>
  <text class="dg-note" x="342" y="152" dy="0.35em">built once</text>
  <text class="dg-note" x="559" y="204" dy="0.35em" text-anchor="middle">same image</text>
</svg>
