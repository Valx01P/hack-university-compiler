<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <title>A route table: each method and path pattern points to one handler</title>
  <desc>The request GET /v1/rooms/3 is checked against Roombook's route table. Each row is a method and a path pattern that points to a handler: list rooms, create a room, read a room, replace a room, update a room, delete a room, and cancel a booking. The request matches GET /v1/rooms/{roomId}, so the handler that reads a room runs, with roomId set to 3. When no pattern matches the path, the answer is 404 Not Found. When the path matches but the method doesn't, it's 405 Method Not Allowed, with an Allow header.</desc>

  <!-- The request. -->
  <rect class="dg-strong" x="20" y="20" width="220" height="56" rx="8"/>
  <text class="dg-note" x="40" y="38" dy="0.35em">the request</text>
  <text class="dg-code" x="40" y="58" dy="0.35em">GET /v1/rooms/3</text>
  <text class="dg-note" x="260" y="38" dy="0.35em">matches the third row,</text>
  <text class="dg-code" x="260" y="58" dy="0.35em">roomId = 3</text>
  <path class="dg-flow" d="M40 76 V232 H76" marker-end="url(#arrow-flow)"/>

  <!-- The table. -->
  <rect class="dg-frame" x="60" y="100" width="600" height="320" rx="12"/>
  <text class="dg-heading" x="80" y="124" dy="0.35em">Route table</text>
  <text class="dg-note" x="484" y="124" dy="0.35em">handler</text>

  <rect class="dg-box" x="80" y="144" width="560" height="32" rx="8"/>
  <text class="dg-code" x="96" y="160" dy="0.35em">GET</text>
  <text class="dg-code" x="162" y="160" dy="0.35em">/v1/rooms</text>
  <path class="dg-line" d="M404 160 H476" marker-end="url(#arrow)"/>
  <text x="484" y="160" dy="0.35em">list rooms</text>

  <rect class="dg-box" x="80" y="180" width="560" height="32" rx="8"/>
  <text class="dg-code" x="96" y="196" dy="0.35em">POST</text>
  <text class="dg-code" x="162" y="196" dy="0.35em">/v1/rooms</text>
  <path class="dg-line" d="M404 196 H476" marker-end="url(#arrow)"/>
  <text x="484" y="196" dy="0.35em">create a room</text>

  <rect class="dg-strong" x="80" y="216" width="560" height="32" rx="8"/>
  <text class="dg-code" x="96" y="232" dy="0.35em">GET</text>
  <text class="dg-code" x="162" y="232" dy="0.35em">/v1/rooms/{roomId}</text>
  <path class="dg-flow" d="M404 232 H472" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="476" y="220" width="156" height="24" rx="6"/>
  <text class="dg-on-hot" x="484" y="232" dy="0.35em">read a room</text>

  <rect class="dg-box" x="80" y="252" width="560" height="32" rx="8"/>
  <text class="dg-code" x="96" y="268" dy="0.35em">PUT</text>
  <text class="dg-code" x="162" y="268" dy="0.35em">/v1/rooms/{roomId}</text>
  <path class="dg-line" d="M404 268 H476" marker-end="url(#arrow)"/>
  <text x="484" y="268" dy="0.35em">replace a room</text>

  <rect class="dg-box" x="80" y="288" width="560" height="32" rx="8"/>
  <text class="dg-code" x="96" y="304" dy="0.35em">PATCH</text>
  <text class="dg-code" x="162" y="304" dy="0.35em">/v1/rooms/{roomId}</text>
  <path class="dg-line" d="M404 304 H476" marker-end="url(#arrow)"/>
  <text x="484" y="304" dy="0.35em">update a room</text>

  <rect class="dg-box" x="80" y="324" width="560" height="32" rx="8"/>
  <text class="dg-code" x="96" y="340" dy="0.35em">DELETE</text>
  <text class="dg-code" x="162" y="340" dy="0.35em">/v1/rooms/{roomId}</text>
  <path class="dg-line" d="M404 340 H476" marker-end="url(#arrow)"/>
  <text x="484" y="340" dy="0.35em">delete a room</text>

  <rect class="dg-box" x="80" y="360" width="560" height="32" rx="8"/>
  <text class="dg-code" x="96" y="376" dy="0.35em">POST</text>
  <text class="dg-code" x="162" y="376" dy="0.35em">/v1/bookings/{bookingId}/cancel</text>
  <path class="dg-line" d="M404 376 H476" marker-end="url(#arrow)"/>
  <text x="484" y="376" dy="0.35em">cancel a booking</text>

  <!-- When nothing matches. -->
  <rect class="dg-box" x="20" y="444" width="310" height="56" rx="8"/>
  <text x="175" y="462" dy="0.35em" text-anchor="middle">No pattern matches the path
    <tspan class="dg-note" x="175" dy="1.4em">404 Not Found</tspan>
  </text>
  <rect class="dg-box" x="350" y="444" width="310" height="56" rx="8"/>
  <text x="505" y="462" dy="0.35em" text-anchor="middle">Path matches, method doesn't
    <tspan class="dg-note" x="505" dy="1.4em">405 Method Not Allowed, with Allow</tspan>
  </text>
</svg>
