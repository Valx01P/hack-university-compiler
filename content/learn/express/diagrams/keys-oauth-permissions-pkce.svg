<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <title>Signing in with the university: the authorization code flow with PKCE</title>
  <desc>Step 1: the browser starts at Roombook, which saves state, a code verifier, and a nonce, and redirects to the IdP with the code challenge. Step 2: Grace signs in at the IdP. Step 3: the IdP redirects back to Roombook's callback with a code and the state. Step 4: Roombook sends the code and the verifier to the IdP's token endpoint. Step 5: the IdP answers with an ID token and an access token. Step 6: Roombook starts its own session with a cookie.</desc>

  <rect class="dg-box" x="40" y="20" width="140" height="40" rx="8"/>
  <text x="110" y="40" dy="0.35em" text-anchor="middle">Browser</text>
  <rect class="dg-hot" x="270" y="20" width="140" height="40" rx="8"/>
  <text class="dg-on-hot" x="340" y="40" dy="0.35em" text-anchor="middle">Roombook</text>
  <rect class="dg-box" x="490" y="20" width="160" height="40" rx="8"/>
  <text x="570" y="40" dy="0.35em" text-anchor="middle">University IdP</text>

  <path class="dg-line dg-dashed" d="M110 60 V500"/>
  <path class="dg-line dg-dashed" d="M340 60 V500"/>
  <path class="dg-line dg-dashed" d="M570 60 V500"/>

  <!-- Step 1 -->
  <circle class="dg-badge" cx="84" cy="100" r="10"/>
  <text class="dg-on-badge" x="84" y="100" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="225" y="86" dy="0.35em" text-anchor="middle">GET …/sso/start</text>
  <path class="dg-flow" d="M110 100 H336" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M340 136 H114" marker-end="url(#arrow)"/>
  <text class="dg-note" x="225" y="152" dy="0.35em" text-anchor="middle">302 to the IdP, with the challenge</text>

  <!-- Step 2 -->
  <circle class="dg-badge" cx="84" cy="200" r="10"/>
  <text class="dg-on-badge" x="84" y="200" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="455" y="186" dy="0.35em" text-anchor="middle">Grace signs in</text>
  <path class="dg-flow" d="M110 200 H566" marker-end="url(#arrow-flow)"/>

  <!-- Step 3 -->
  <path class="dg-line dg-dashed" d="M570 240 H114" marker-end="url(#arrow)"/>
  <text class="dg-note" x="455" y="256" dy="0.35em" text-anchor="middle">302 back, with a code</text>
  <circle class="dg-badge" cx="84" cy="292" r="10"/>
  <text class="dg-on-badge" x="84" y="292" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="225" y="278" dy="0.35em" text-anchor="middle">GET …/callback?code=</text>
  <path class="dg-flow" d="M110 292 H336" marker-end="url(#arrow-flow)"/>

  <!-- Step 4 -->
  <circle class="dg-badge" cx="314" cy="350" r="10"/>
  <text class="dg-on-badge" x="314" y="350" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="455" y="336" dy="0.35em" text-anchor="middle">POST /token</text>
  <path class="dg-flow" d="M340 350 H566" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="455" y="366" dy="0.35em" text-anchor="middle">code and verifier</text>

  <!-- Step 5 -->
  <circle class="dg-badge" cx="596" cy="410" r="10"/>
  <text class="dg-on-badge" x="596" y="410" dy="0.35em" text-anchor="middle">5</text>
  <path class="dg-line dg-dashed" d="M570 410 H344" marker-end="url(#arrow)"/>
  <text class="dg-note" x="455" y="426" dy="0.35em" text-anchor="middle">ID token, access token</text>

  <!-- Step 6 -->
  <circle class="dg-badge" cx="366" cy="470" r="10"/>
  <text class="dg-on-badge" x="366" y="470" dy="0.35em" text-anchor="middle">6</text>
  <text class="dg-code" x="225" y="456" dy="0.35em" text-anchor="middle">Set-Cookie: __Host-session=…</text>
  <path class="dg-line dg-dashed" d="M340 470 H114" marker-end="url(#arrow)"/>
</svg>
