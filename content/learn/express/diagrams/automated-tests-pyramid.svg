<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The test pyramid: many unit tests, some API and integration tests, a few end-to-end</title>
  <desc>A pyramid of three layers. The wide base is unit tests, many of them, each taking milliseconds. The middle layer is API and integration tests, some of them, using a real HTTP layer or a real database. The narrow top is end-to-end tests, a few, each taking seconds. An arrow on the left points up from faster and more focused to slower and closer to real use.</desc>

  <!-- The three layers. -->
  <polygon class="dg-box" points="290,30 390,30 440,110 240,110"/>
  <text x="340" y="70" dy="0.35em" text-anchor="middle">End-to-end</text>
  <polygon class="dg-box" points="234,120 446,120 506,210 174,210"/>
  <text x="340" y="165" dy="0.35em" text-anchor="middle">API and integration</text>
  <polygon class="dg-hot" points="168,220 512,220 572,310 108,310"/>
  <text class="dg-on-hot" x="340" y="265" dy="0.35em" text-anchor="middle">Unit tests</text>

  <!-- How many, and how fast. -->
  <text class="dg-note" x="470" y="62" dy="0.35em">a few</text>
  <text class="dg-note" x="470" y="80" dy="0.35em">seconds each</text>
  <text class="dg-note" x="528" y="157" dy="0.35em">some</text>
  <text class="dg-note" x="528" y="175" dy="0.35em">a real database</text>
  <text class="dg-note" x="580" y="257" dy="0.35em">many</text>
  <text class="dg-note" x="580" y="275" dy="0.35em">milliseconds</text>

  <!-- The axis. -->
  <path class="dg-line" d="M40 300 V44" marker-end="url(#arrow)"/>
  <text class="dg-note" x="56" y="40" dy="0.35em">slower</text>
  <text class="dg-note" x="56" y="58" dy="0.35em">more real</text>
  <text class="dg-note" x="56" y="280" dy="0.35em">faster</text>
  <text class="dg-note" x="56" y="298" dy="0.35em">more focused</text>
</svg>
