<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A rolling deployment: new containers become ready before old ones drain</title>
  <desc>Two old containers serve traffic. A new container starts, and once its readiness probe passes, the load balancer sends it traffic. Then the first old container drains its in-flight requests and stops. A second new container starts and becomes ready, and the second old container drains. At every moment at least two containers are serving.</desc>
  <text x="20" y="76" dy="0.35em">Old 1</text>
  <rect class="dg-box" x="120" y="60" width="180" height="32" rx="8"/>
  <text x="210" y="76" dy="0.35em" text-anchor="middle">serving</text>
  <rect class="dg-off" x="300" y="60" width="80" height="32" rx="8"/>
  <text class="dg-faint" x="344" y="76" dy="0.35em" text-anchor="middle">draining</text>
  <text x="20" y="124" dy="0.35em">Old 2</text>
  <rect class="dg-box" x="120" y="108" width="340" height="32" rx="8"/>
  <text x="290" y="124" dy="0.35em" text-anchor="middle">serving</text>
  <rect class="dg-off" x="460" y="108" width="80" height="32" rx="8"/>
  <text class="dg-faint" x="500" y="124" dy="0.35em" text-anchor="middle">draining</text>
  <text x="20" y="172" dy="0.35em">New 1</text>
  <rect class="dg-off" x="180" y="156" width="80" height="32" rx="8"/>
  <text class="dg-faint" x="220" y="172" dy="0.35em" text-anchor="middle">starting</text>
  <rect class="dg-hot" x="260" y="156" width="400" height="32" rx="8"/>
  <text class="dg-on-hot" x="460" y="172" dy="0.35em" text-anchor="middle">serving</text>
  <text x="20" y="220" dy="0.35em">New 2</text>
  <rect class="dg-off" x="340" y="204" width="80" height="32" rx="8"/>
  <text class="dg-faint" x="380" y="220" dy="0.35em" text-anchor="middle">starting</text>
  <rect class="dg-hot" x="420" y="204" width="240" height="32" rx="8"/>
  <text class="dg-on-hot" x="540" y="220" dy="0.35em" text-anchor="middle">serving</text>
  <circle class="dg-badge" cx="180" cy="172" r="10"/>
  <text class="dg-on-badge" x="180" y="172" dy="0.35em" text-anchor="middle">1</text>
  <circle class="dg-badge" cx="260" cy="172" r="10"/>
  <text class="dg-on-badge" x="260" y="172" dy="0.35em" text-anchor="middle">2</text>
  <circle class="dg-badge" cx="300" cy="76" r="10"/>
  <text class="dg-on-badge" x="300" y="76" dy="0.35em" text-anchor="middle">3</text>
  <path class="dg-line" d="M120 264 H656" marker-end="url(#arrow)"/>
  <text class="dg-faint" x="600" y="282" dy="0.35em" text-anchor="middle">time</text>
</svg>
