<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <title>Two requests check, then both insert the same booking</title>
  <desc>Two requests, A and B, want Turing from 14:00 to 15:30. In steps 1 to 4, both begin a transaction and both check for an overlapping booking, and both find none. In step 5, A inserts, and in step 6 it commits. In step 7, B inserts too. With only the check in code, the room is now booked twice. With the exclusion constraint, B's insert fails with 23P01, and B gets a 409.</desc>

  <text class="dg-heading" x="230" y="28" dy="0.35em" text-anchor="middle">Request A</text>
  <text class="dg-heading" x="490" y="28" dy="0.35em" text-anchor="middle">Request B</text>
  <path class="dg-line dg-dashed" d="M230 44 V380"/>
  <path class="dg-line dg-dashed" d="M490 44 V380"/>
  <text class="dg-note" x="40" y="28" dy="0.35em">time</text>
  <path class="dg-line" d="M48 44 V380" marker-end="url(#arrow)"/>

  <!-- 1: A begins -->
  <circle class="dg-badge" cx="80" cy="72" r="10"/>
  <text class="dg-on-badge" x="80" y="72" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-box" x="130" y="54" width="200" height="36" rx="8"/>
  <text class="dg-code" x="230" y="72" dy="0.35em" text-anchor="middle">BEGIN</text>

  <!-- 2: A checks -->
  <circle class="dg-badge" cx="80" cy="116" r="10"/>
  <text class="dg-on-badge" x="80" y="116" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="130" y="98" width="200" height="36" rx="8"/>
  <text x="230" y="116" dy="0.35em" text-anchor="middle">check: room free</text>

  <!-- 3: B begins -->
  <circle class="dg-badge" cx="80" cy="160" r="10"/>
  <text class="dg-on-badge" x="80" y="160" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="390" y="142" width="200" height="36" rx="8"/>
  <text class="dg-code" x="490" y="160" dy="0.35em" text-anchor="middle">BEGIN</text>

  <!-- 4: B checks -->
  <circle class="dg-badge" cx="80" cy="204" r="10"/>
  <text class="dg-on-badge" x="80" y="204" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-box" x="390" y="186" width="200" height="36" rx="8"/>
  <text x="490" y="204" dy="0.35em" text-anchor="middle">check: room free</text>

  <!-- 5: A inserts -->
  <circle class="dg-badge" cx="80" cy="248" r="10"/>
  <text class="dg-on-badge" x="80" y="248" dy="0.35em" text-anchor="middle">5</text>
  <rect class="dg-strong" x="130" y="230" width="200" height="36" rx="8"/>
  <text class="dg-code" x="230" y="248" dy="0.35em" text-anchor="middle">INSERT 14:00-15:30</text>

  <!-- 6: A commits -->
  <circle class="dg-badge" cx="80" cy="292" r="10"/>
  <text class="dg-on-badge" x="80" y="292" dy="0.35em" text-anchor="middle">6</text>
  <rect class="dg-strong" x="130" y="274" width="200" height="36" rx="8"/>
  <text class="dg-code" x="230" y="292" dy="0.35em" text-anchor="middle">COMMIT</text>

  <!-- 7: B inserts -->
  <circle class="dg-badge" cx="80" cy="336" r="10"/>
  <text class="dg-on-badge" x="80" y="336" dy="0.35em" text-anchor="middle">7</text>
  <rect class="dg-hot" x="390" y="318" width="200" height="36" rx="8"/>
  <text class="dg-code dg-on-hot" x="490" y="336" dy="0.35em" text-anchor="middle">INSERT 14:00-15:30</text>

  <text class="dg-note" x="340" y="410" dy="0.35em" text-anchor="middle">With only the check in code: Turing is booked twice.</text>
  <text class="dg-note" x="340" y="432" dy="0.35em" text-anchor="middle">With the exclusion constraint: B's INSERT fails with 23P01, a 409.</text>
</svg>
