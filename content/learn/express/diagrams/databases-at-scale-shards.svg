<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Sharding by building: a router sends each query to the shard that holds that building</title>
  <desc>The API asks the shard router for a building's data. Queries about main-library go to shard 1, and queries about science-library go to shard 2. Each shard is a whole PostgreSQL with its own replica. A query across all buildings has to ask both shards and merge the answers.</desc>

  <rect class="dg-box" x="20" y="112" width="120" height="56" rx="8"/>
  <text x="80" y="140" dy="0.35em" text-anchor="middle">API</text>
  <path class="dg-line" d="M140 140 H206" marker-end="url(#arrow)"/>

  <rect class="dg-hot" x="210" y="104" width="160" height="72" rx="8"/>
  <text class="dg-on-hot" x="290" y="131" dy="0.35em" text-anchor="middle">Shard router
    <tspan x="290" dy="1.4em">by building</tspan>
  </text>

  <rect class="dg-strong" x="480" y="24" width="180" height="64" rx="8"/>
  <text x="570" y="47" dy="0.35em" text-anchor="middle">Shard 1
    <tspan class="dg-code" x="570" dy="1.4em">main-library</tspan>
  </text>
  <rect class="dg-box" x="500" y="96" width="140" height="36" rx="8"/>
  <text class="dg-note" x="570" y="114" dy="0.35em" text-anchor="middle">its replica</text>

  <rect class="dg-strong" x="480" y="168" width="180" height="64" rx="8"/>
  <text x="570" y="191" dy="0.35em" text-anchor="middle">Shard 2
    <tspan class="dg-code" x="570" dy="1.4em">science-library</tspan>
  </text>
  <rect class="dg-box" x="500" y="240" width="140" height="36" rx="8"/>
  <text class="dg-note" x="570" y="258" dy="0.35em" text-anchor="middle">its replica</text>

  <path class="dg-flow" d="M370 124 H420 V56 H476" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M370 156 H420 V200 H476" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="290" y="216" dy="0.35em" text-anchor="middle">every building: ask both,</text>
  <text class="dg-note" x="290" y="234" dy="0.35em" text-anchor="middle">then merge</text>
</svg>
