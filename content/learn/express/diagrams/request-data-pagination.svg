<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
  <title>Offset pages repeat an item when a new one arrives, and cursor pages don't</title>
  <desc>Two ways to read a list three items at a time, newest first. With an offset, page 1 skips 0 and gets A, B, and C. Then N arrives at the front, and page 2 skips 3 and gets C, D, and E, so C shows up twice. With a cursor, page 1 gets A, B, and C, plus a cursor that means after C. Page 2 starts after C and gets D, E, and F, with no repeat, even though N arrived in between.</desc>
  <rect class="dg-frame" x="20" y="20" width="640" height="190" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">Offset: skip a count</text>

  <text class="dg-note" x="40" y="84" dy="0.35em">page 1</text>
  <text class="dg-code" x="40" y="102" dy="0.35em">offset=0</text>
  <rect class="dg-strong" x="192" y="72" width="48" height="40" rx="8"/>
  <text x="216" y="92" dy="0.35em" text-anchor="middle">A</text>
  <rect class="dg-strong" x="248" y="72" width="48" height="40" rx="8"/>
  <text x="272" y="92" dy="0.35em" text-anchor="middle">B</text>
  <rect class="dg-strong" x="304" y="72" width="48" height="40" rx="8"/>
  <text x="328" y="92" dy="0.35em" text-anchor="middle">C</text>
  <rect class="dg-off" x="360" y="72" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="384" y="92" dy="0.35em" text-anchor="middle">D</text>
  <rect class="dg-off" x="416" y="72" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="440" y="92" dy="0.35em" text-anchor="middle">E</text>
  <rect class="dg-off" x="472" y="72" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="496" y="92" dy="0.35em" text-anchor="middle">F</text>
  <rect class="dg-off" x="528" y="72" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="552" y="92" dy="0.35em" text-anchor="middle">G</text>
  <rect class="dg-off" x="584" y="72" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="608" y="92" dy="0.35em" text-anchor="middle">H</text>

  <text class="dg-note" x="40" y="152" dy="0.35em">page 2</text>
  <text class="dg-code" x="40" y="170" dy="0.35em">offset=3</text>
  <rect class="dg-off" x="136" y="140" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="160" y="160" dy="0.35em" text-anchor="middle">N</text>
  <rect class="dg-off" x="192" y="140" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="216" y="160" dy="0.35em" text-anchor="middle">A</text>
  <rect class="dg-off" x="248" y="140" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="272" y="160" dy="0.35em" text-anchor="middle">B</text>
  <rect class="dg-hot" x="304" y="140" width="48" height="40" rx="8"/>
  <text class="dg-on-hot" x="328" y="160" dy="0.35em" text-anchor="middle">C</text>
  <rect class="dg-strong" x="360" y="140" width="48" height="40" rx="8"/>
  <text x="384" y="160" dy="0.35em" text-anchor="middle">D</text>
  <rect class="dg-strong" x="416" y="140" width="48" height="40" rx="8"/>
  <text x="440" y="160" dy="0.35em" text-anchor="middle">E</text>
  <rect class="dg-off" x="472" y="140" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="496" y="160" dy="0.35em" text-anchor="middle">F</text>
  <rect class="dg-off" x="528" y="140" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="552" y="160" dy="0.35em" text-anchor="middle">G</text>
  <rect class="dg-off" x="584" y="140" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="608" y="160" dy="0.35em" text-anchor="middle">H</text>
  <text class="dg-note" x="164" y="196" dy="0.35em" text-anchor="middle">N arrived</text>
  <text class="dg-note" x="328" y="196" dy="0.35em" text-anchor="middle">C again</text>

  <rect class="dg-frame" x="20" y="230" width="640" height="190" rx="12"/>
  <text class="dg-heading" x="40" y="254" dy="0.35em">Cursor: start after the last one</text>

  <text class="dg-note" x="40" y="294" dy="0.35em">page 1</text>
  <text class="dg-code" x="40" y="312" dy="0.35em">limit=3</text>
  <rect class="dg-strong" x="192" y="282" width="48" height="40" rx="8"/>
  <text x="216" y="302" dy="0.35em" text-anchor="middle">A</text>
  <rect class="dg-strong" x="248" y="282" width="48" height="40" rx="8"/>
  <text x="272" y="302" dy="0.35em" text-anchor="middle">B</text>
  <rect class="dg-strong" x="304" y="282" width="48" height="40" rx="8"/>
  <text x="328" y="302" dy="0.35em" text-anchor="middle">C</text>
  <rect class="dg-off" x="360" y="282" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="384" y="302" dy="0.35em" text-anchor="middle">D</text>
  <rect class="dg-off" x="416" y="282" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="440" y="302" dy="0.35em" text-anchor="middle">E</text>
  <rect class="dg-off" x="472" y="282" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="496" y="302" dy="0.35em" text-anchor="middle">F</text>
  <rect class="dg-off" x="528" y="282" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="552" y="302" dy="0.35em" text-anchor="middle">G</text>
  <rect class="dg-off" x="584" y="282" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="608" y="302" dy="0.35em" text-anchor="middle">H</text>

  <text class="dg-note" x="40" y="362" dy="0.35em">page 2</text>
  <text class="dg-code" x="40" y="380" dy="0.35em">after C</text>
  <rect class="dg-off" x="136" y="350" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="160" y="370" dy="0.35em" text-anchor="middle">N</text>
  <rect class="dg-off" x="192" y="350" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="216" y="370" dy="0.35em" text-anchor="middle">A</text>
  <rect class="dg-off" x="248" y="350" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="272" y="370" dy="0.35em" text-anchor="middle">B</text>
  <rect class="dg-off" x="304" y="350" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="328" y="370" dy="0.35em" text-anchor="middle">C</text>
  <rect class="dg-strong" x="360" y="350" width="48" height="40" rx="8"/>
  <text x="384" y="370" dy="0.35em" text-anchor="middle">D</text>
  <rect class="dg-strong" x="416" y="350" width="48" height="40" rx="8"/>
  <text x="440" y="370" dy="0.35em" text-anchor="middle">E</text>
  <rect class="dg-strong" x="472" y="350" width="48" height="40" rx="8"/>
  <text x="496" y="370" dy="0.35em" text-anchor="middle">F</text>
  <rect class="dg-off" x="528" y="350" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="552" y="370" dy="0.35em" text-anchor="middle">G</text>
  <rect class="dg-off" x="584" y="350" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="608" y="370" dy="0.35em" text-anchor="middle">H</text>
  <text class="dg-note" x="164" y="406" dy="0.35em" text-anchor="middle">N arrived</text>
</svg>
