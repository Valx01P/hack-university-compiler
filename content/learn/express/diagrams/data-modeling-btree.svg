<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>A full scan reads every row, and a B-tree lookup reads one page per level</title>
  <desc>On the left, a full scan for user 42 reads every row of the bookings table, from the first to the last. On the right, a B-tree index on user_id finds user 42 in three page reads: the top page sends the search to the page for users 1 to 1700, that page sends it to the bottom page for users 42 to 80, and that page points at user 42's rows.</desc>

  <!-- Full scan -->
  <text class="dg-heading" x="40" y="36" dy="0.35em">Full scan</text>
  <rect class="dg-strong" x="40" y="60" width="160" height="24" rx="4"/>
  <text class="dg-code" x="120" y="72" dy="0.35em" text-anchor="middle">user 3817</text>
  <rect class="dg-strong" x="40" y="90" width="160" height="24" rx="4"/>
  <text class="dg-code" x="120" y="102" dy="0.35em" text-anchor="middle">user 42</text>
  <rect class="dg-strong" x="40" y="120" width="160" height="24" rx="4"/>
  <text class="dg-code" x="120" y="132" dy="0.35em" text-anchor="middle">user 961</text>
  <rect class="dg-strong" x="40" y="150" width="160" height="24" rx="4"/>
  <text class="dg-code" x="120" y="162" dy="0.35em" text-anchor="middle">user 2240</text>
  <rect class="dg-strong" x="40" y="180" width="160" height="24" rx="4"/>
  <text class="dg-code" x="120" y="192" dy="0.35em" text-anchor="middle">user 42</text>
  <rect class="dg-strong" x="40" y="210" width="160" height="24" rx="4"/>
  <text class="dg-code" x="120" y="222" dy="0.35em" text-anchor="middle">user 15</text>
  <rect class="dg-strong" x="40" y="240" width="160" height="24" rx="4"/>
  <text class="dg-code" x="120" y="252" dy="0.35em" text-anchor="middle">user 4999</text>
  <path class="dg-flow" d="M216 60 V286" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="120" y="306" dy="0.35em" text-anchor="middle">reads all 200,000 rows</text>

  <!-- B-tree -->
  <text class="dg-heading" x="260" y="36" dy="0.35em">B-tree index on user_id</text>

  <circle class="dg-badge" cx="370" cy="84" r="10"/>
  <text class="dg-on-badge" x="370" y="84" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-strong" x="390" y="64" width="150" height="40" rx="8"/>
  <text class="dg-code" x="465" y="84" dy="0.35em" text-anchor="middle">1 to 5000</text>

  <path class="dg-flow" d="M465 104 V124 H320 V142" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M465 104 V142" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M465 124 H600 V142" marker-end="url(#arrow)"/>

  <rect class="dg-strong" x="260" y="146" width="120" height="40" rx="8"/>
  <text class="dg-code" x="320" y="166" dy="0.35em" text-anchor="middle">1 to 1700</text>
  <circle class="dg-badge" cx="260" cy="146" r="10"/>
  <text class="dg-on-badge" x="260" y="146" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="405" y="146" width="120" height="40" rx="8"/>
  <text class="dg-code" x="465" y="166" dy="0.35em" text-anchor="middle">1701 to 3400</text>
  <rect class="dg-box" x="540" y="146" width="120" height="40" rx="8"/>
  <text class="dg-code" x="600" y="166" dy="0.35em" text-anchor="middle">3401 to 5000</text>

  <path class="dg-line" d="M320 186 V206 H320 V224" marker-end="url(#arrow)"/>
  <path class="dg-flow" d="M320 206 H465 V224" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M465 206 H600 V224" marker-end="url(#arrow)"/>

  <rect class="dg-box" x="260" y="228" width="120" height="40" rx="8"/>
  <text class="dg-code" x="320" y="248" dy="0.35em" text-anchor="middle">1 to 41</text>
  <rect class="dg-hot" x="405" y="228" width="120" height="40" rx="8"/>
  <text class="dg-code dg-on-hot" x="465" y="248" dy="0.35em" text-anchor="middle">42 to 80</text>
  <circle class="dg-badge" cx="405" cy="228" r="10"/>
  <text class="dg-on-badge" x="405" y="228" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="540" y="228" width="120" height="40" rx="8"/>
  <text class="dg-code" x="600" y="248" dy="0.35em" text-anchor="middle">81 to 120</text>

  <path class="dg-flow" d="M465 268 V290" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="465" y="306" dy="0.35em" text-anchor="middle">points at user 42's rows</text>
  <text class="dg-note" x="465" y="334" dy="0.35em" text-anchor="middle">one page read per level</text>
</svg>
