<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600">
  <title>Roombook's middleware chain in Express, in the order of the app.use calls</title>
  <desc>A request passes through requestId, accessLog, helmet, cors, express.json with a 100 KB limit, and readOnlyMode. Rate limiting and authentication come in later lessons. Then the routers answer, notFound answers anything no route matched, and errorHandler, last of all, answers any error thrown above it.</desc>
  <rect class="dg-box" x="40" y="20" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="38" dy="0.35em">requestId</text>
  <text class="dg-note" x="330" y="38" dy="0.35em">makes or keeps X-Request-Id</text>
  <path class="dg-line" d="M80 56 V68" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="72" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="90" dy="0.35em">accessLog</text>
  <text class="dg-note" x="330" y="90" dy="0.35em">logs status and time on finish</text>
  <path class="dg-line" d="M80 108 V120" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="124" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="142" dy="0.35em">helmet()</text>
  <text class="dg-note" x="330" y="142" dy="0.35em">adds security headers</text>
  <path class="dg-line" d="M80 160 V172" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="176" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="194" dy="0.35em">cors({ origin })</text>
  <text class="dg-note" x="330" y="194" dy="0.35em">answers preflights</text>
  <path class="dg-line" d="M80 212 V224" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="228" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="246" dy="0.35em">express.json({ limit })</text>
  <text class="dg-note" x="330" y="246" dy="0.35em">parses JSON bodies up to 100 KB</text>
  <path class="dg-line" d="M80 264 V276" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="280" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="298" dy="0.35em">readOnlyMode(enabled)</text>
  <text class="dg-note" x="330" y="298" dy="0.35em">refuses writes during maintenance</text>
  <path class="dg-line" d="M80 316 V328" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="40" y="332" width="270" height="36" rx="8"/>
  <text class="dg-faint dg-code" x="56" y="350" dy="0.35em">rate limit</text>
  <text class="dg-faint" x="330" y="350" dy="0.35em">in the Redis lesson</text>
  <path class="dg-line" d="M80 368 V380" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="40" y="384" width="270" height="36" rx="8"/>
  <text class="dg-faint dg-code" x="56" y="402" dy="0.35em">authenticate</text>
  <text class="dg-faint" x="330" y="402" dy="0.35em">in the authentication lesson</text>
  <path class="dg-line" d="M80 420 V432" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="40" y="436" width="270" height="36" rx="8"/>
  <text class="dg-on-hot dg-code" x="56" y="454" dy="0.35em">/v1/rooms, /v1/bookings</text>
  <text class="dg-note" x="330" y="454" dy="0.35em">the routers and their handlers</text>
  <path class="dg-line" d="M80 472 V484" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="488" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="506" dy="0.35em">notFound</text>
  <text class="dg-note" x="330" y="506" dy="0.35em">404 when no route answered</text>
  <path class="dg-line" d="M80 524 V536" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="40" y="540" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="558" dy="0.35em">errorHandler</text>
  <text class="dg-note" x="330" y="558" dy="0.35em">500 for any error thrown above</text>
</svg>
