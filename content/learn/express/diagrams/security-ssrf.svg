<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>A webhook sender that refuses private addresses and sends only to public ones</title>
  <desc>Inside Roombook's private network, the webhook sender can reach the cloud metadata service, an internal admin tool, and PostgreSQL, none of which outsiders can reach. It checks each address right before connecting. Requests to those private addresses are refused. A request to the calendar app's public address on the internet is sent.</desc>

  <rect class="dg-frame" x="20" y="20" width="450" height="320" rx="12"/>
  <text class="dg-heading" x="40" y="46" dy="0.35em">Roombook's private network</text>
  <text class="dg-heading" x="585" y="46" dy="0.35em" text-anchor="middle">The internet</text>

  <rect class="dg-hot" x="150" y="80" width="200" height="56" rx="8"/>
  <text class="dg-on-hot" x="250" y="99" dy="0.35em" text-anchor="middle">Webhook sender</text>
  <text class="dg-on-hot" x="250" y="118" dy="0.35em" text-anchor="middle">checks each address</text>

  <rect class="dg-box" x="510" y="80" width="150" height="56" rx="8"/>
  <text x="585" y="99" dy="0.35em" text-anchor="middle">Calendar app</text>
  <text class="dg-code" x="585" y="118" dy="0.35em" text-anchor="middle">203.0.113.10</text>
  <path class="dg-flow" d="M350 108 H506" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="430" y="94" dy="0.35em" text-anchor="middle">public: sent</text>

  <rect class="dg-off" x="40" y="256" width="130" height="56" rx="8"/>
  <text class="dg-faint" x="105" y="275" dy="0.35em" text-anchor="middle">Metadata</text>
  <text class="dg-faint" x="105" y="294" dy="0.35em" text-anchor="middle">169.254.169.254</text>
  <rect class="dg-off" x="185" y="256" width="130" height="56" rx="8"/>
  <text class="dg-faint" x="250" y="275" dy="0.35em" text-anchor="middle">Admin tool</text>
  <text class="dg-faint" x="250" y="294" dy="0.35em" text-anchor="middle">10.0.0.7</text>
  <rect class="dg-off" x="330" y="256" width="130" height="56" rx="8"/>
  <text class="dg-faint" x="395" y="275" dy="0.35em" text-anchor="middle">PostgreSQL</text>
  <text class="dg-faint" x="395" y="294" dy="0.35em" text-anchor="middle">10.0.0.5</text>

  <path class="dg-line dg-dashed" d="M250 136 V252" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M250 196 H105 V252" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M250 196 H395 V252" marker-end="url(#arrow)"/>
  <text class="dg-note" x="262" y="176" dy="0.35em">private: refused</text>
</svg>
