<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <title>An aggregation pipeline: match, then group, then sort</title>
  <desc>1,240 feedback documents enter the pipeline. The match stage keeps the 310 that belong to the building's three rooms. The group stage turns those into one document per room, with the average rating and a count. The sort stage puts the three in order, best rated first, and they come out as the result.</desc>

  <rect class="dg-box" x="160" y="20" width="360" height="56" rx="8"/>
  <text class="dg-code" x="340" y="39" dy="0.35em" text-anchor="middle">room_feedback</text>
  <text class="dg-note" x="340" y="58" dy="0.35em" text-anchor="middle">the whole collection</text>
  <path class="dg-flow" d="M340 76 V116" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="356" y="96" dy="0.35em">1,240 documents</text>

  <rect class="dg-strong" x="160" y="120" width="360" height="56" rx="8"/>
  <text class="dg-code" x="340" y="139" dy="0.35em" text-anchor="middle">$match</text>
  <text class="dg-note" x="340" y="158" dy="0.35em" text-anchor="middle">roomId is 1, 2, or 3</text>
  <path class="dg-flow" d="M340 176 V216" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="356" y="196" dy="0.35em">310 documents</text>

  <rect class="dg-strong" x="160" y="220" width="360" height="56" rx="8"/>
  <text class="dg-code" x="340" y="239" dy="0.35em" text-anchor="middle">$group</text>
  <text class="dg-note" x="340" y="258" dy="0.35em" text-anchor="middle">one per room: average rating, count</text>
  <path class="dg-flow" d="M340 276 V316" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="356" y="296" dy="0.35em">3 documents</text>

  <rect class="dg-strong" x="160" y="320" width="360" height="56" rx="8"/>
  <text class="dg-code" x="340" y="339" dy="0.35em" text-anchor="middle">$sort</text>
  <text class="dg-note" x="340" y="358" dy="0.35em" text-anchor="middle">by average, highest first</text>
  <path class="dg-flow" d="M340 376 V416" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="356" y="396" dy="0.35em">3 documents, in order</text>

  <rect class="dg-hot" x="140" y="420" width="400" height="84" rx="8"/>
  <text class="dg-code dg-on-hot" x="340" y="442" dy="0.35em" text-anchor="middle">{ roomId: 2, average: 4.6, count: 128 }</text>
  <text class="dg-code dg-on-hot" x="340" y="462" dy="0.35em" text-anchor="middle">{ roomId: 1, average: 4.2, count: 97 }</text>
  <text class="dg-code dg-on-hot" x="340" y="482" dy="0.35em" text-anchor="middle">{ roomId: 3, average: 3.9, count: 85 }</text>
</svg>
