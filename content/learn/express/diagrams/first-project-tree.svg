  <text class="dg-code" x="40" y="72" dy="0.35em">roombook/</text>
  <text class="dg-note" x="330" y="72" dy="0.35em">the project folder</text>
  <text class="dg-code" x="68" y="100" dy="0.35em">package.json</text>
  <text class="dg-note" x="330" y="100" dy="0.35em">the name, dependencies, and scripts</text>
  <text class="dg-code" x="68" y="128" dy="0.35em">package-lock.json</text>
  <text class="dg-note" x="330" y="128" dy="0.35em">the exact versions installed</text>
  <text class="dg-code" x="68" y="156" dy="0.35em">tsconfig.json</text>
  <text class="dg-note" x="330" y="156" dy="0.35em">how tsc checks your types</text>
  <text class="dg-code" x="68" y="184" dy="0.35em">.env</text>
  <text class="dg-note" x="330" y="184" dy="0.35em">settings for your computer alone</text>
  <text class="dg-code" x="68" y="212" dy="0.35em">.gitignore</text>
  <text class="dg-note" x="330" y="212" dy="0.35em">what Git leaves out</text>
