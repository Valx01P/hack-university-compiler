<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700">
  <title>The Roombook project's folders: what's there now, and what later lessons add</title>
  <desc>The roombook folder holds package.json, package-lock.json, tsconfig.json, .env, .gitignore, node_modules, and src. Inside src, server.ts is the entry point and app.ts builds the app, and both exist now. Later lessons add config.ts, an http folder of shared pieces, a modules folder with one folder per feature (rooms, bookings, auth, and feedback), a db folder for connections, and worker.ts for background jobs, plus migrations, scripts, and test folders next to src.</desc>

