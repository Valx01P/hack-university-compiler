<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>A load balancer ends TLS, adds forwarded headers, and skips an unhealthy instance</title>
  <desc>A client connects over HTTPS to the load balancer, which ends the TLS connection and forwards plain HTTP with X-Forwarded-For and X-Forwarded-Proto headers. It sends requests to instances 1 and 2, which pass their health checks. Instance 3 fails its health checks, so it is out of the rotation and gets no requests.</desc>

  <!-- The client. -->
  <rect class="dg-box" x="20" y="150" width="140" height="56" rx="8"/>
  <text x="90" y="169" dy="0.35em" text-anchor="middle">Client
    <tspan class="dg-note" x="90" dy="1.4em">203.0.113.7</tspan>
  </text>
  <path class="dg-flow" d="M160 178 H216" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="188" y="160" dy="0.35em" text-anchor="middle">https</text>

  <!-- The load balancer. -->
  <rect class="dg-hot" x="220" y="120" width="180" height="116" rx="8"/>
  <text class="dg-on-hot" x="310" y="164" dy="0.35em" text-anchor="middle">Load balancer
    <tspan x="310" dy="1.4em">ends TLS</tspan>
  </text>
  <text class="dg-code" x="310" y="262" dy="0.35em" text-anchor="middle">X-Forwarded-For: 203.0.113.7</text>
  <text class="dg-code" x="310" y="284" dy="0.35em" text-anchor="middle">X-Forwarded-Proto: https</text>

  <!-- Healthy instances get traffic. -->
  <path class="dg-flow" d="M400 150 H440 V68 H476" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M400 178 H476" marker-end="url(#arrow-flow)"/>
  <rect class="dg-strong" x="480" y="40" width="180" height="56" rx="8"/>
  <text x="570" y="59" dy="0.35em" text-anchor="middle">Instance 1
    <tspan class="dg-note" x="570" dy="1.4em">health check passes</tspan>
  </text>
  <rect class="dg-strong" x="480" y="150" width="180" height="56" rx="8"/>
  <text x="570" y="169" dy="0.35em" text-anchor="middle">Instance 2
    <tspan class="dg-note" x="570" dy="1.4em">health check passes</tspan>
  </text>

  <!-- The failing one is skipped. -->
  <path class="dg-line dg-dashed" d="M400 206 H440 V288 H476" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="480" y="260" width="180" height="56" rx="8"/>
  <text class="dg-faint" x="570" y="279" dy="0.35em" text-anchor="middle">Instance 3
    <tspan x="570" dy="1.4em">fails GET /healthz</tspan>
  </text>
  <text class="dg-note" x="570" y="336" dy="0.35em" text-anchor="middle">out of the rotation</text>
</svg>
