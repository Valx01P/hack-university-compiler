<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>A forged request: another site's page makes Ada's browser cancel her booking</title>
  <desc>Step 1: Ada, signed in to Roombook, opens a page on evil.example. Step 2: the page has a hidden form aimed at Roombook's cancel route, and a script submits it. Step 3: Ada's browser sends that POST to Roombook and attaches her session cookie, because the request goes to Roombook. Without a defense, Roombook sees a valid session and cancels booking 1001. The attacker can't read the answer, and doesn't need to.</desc>

  <rect class="dg-box" x="20" y="20" width="160" height="40" rx="8"/>
  <text x="100" y="40" dy="0.35em" text-anchor="middle">evil.example</text>
  <rect class="dg-strong" x="260" y="20" width="160" height="40" rx="8"/>
  <text x="340" y="40" dy="0.35em" text-anchor="middle">Ada's browser</text>
  <rect class="dg-box" x="500" y="20" width="160" height="40" rx="8"/>
  <text x="580" y="40" dy="0.35em" text-anchor="middle">Roombook API</text>

  <path class="dg-line dg-dashed" d="M100 60 V360"/>
  <path class="dg-line dg-dashed" d="M340 60 V360"/>
  <path class="dg-line dg-dashed" d="M580 60 V360"/>

  <!-- Step 1: Ada opens the page. -->
  <circle class="dg-badge" cx="366" cy="104" r="10"/>
  <text class="dg-on-badge" x="366" y="104" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="220" y="90" dy="0.35em" text-anchor="middle">Ada opens a link</text>
  <path class="dg-line" d="M340 104 H104" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M100 140 H336" marker-end="url(#arrow)"/>
  <text class="dg-note" x="220" y="156" dy="0.35em" text-anchor="middle">a page with a hidden form</text>

  <!-- Step 2: the page submits the form by itself. -->
  <rect class="dg-box" x="250" y="184" width="180" height="56" rx="8"/>
  <text x="340" y="203" dy="0.35em" text-anchor="middle">Hidden form
    <tspan class="dg-note" x="340" dy="1.4em">a script submits it</tspan>
  </text>
  <circle class="dg-badge" cx="234" cy="212" r="10"/>
  <text class="dg-on-badge" x="234" y="212" dy="0.35em" text-anchor="middle">2</text>

  <!-- Step 3: the browser attaches the cookie. -->
  <circle class="dg-badge" cx="314" cy="290" r="10"/>
  <text class="dg-on-badge" x="314" y="290" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="460" y="262" dy="0.35em" text-anchor="middle">POST …/1001/cancel</text>
  <text class="dg-code" x="460" y="276" dy="0.35em" text-anchor="middle">Cookie: __Host-session=…</text>
  <path class="dg-flow" d="M340 290 H576" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M580 330 H344" marker-end="url(#arrow)"/>
  <text class="dg-note" x="460" y="346" dy="0.35em" text-anchor="middle">204, booking cancelled</text>
</svg>
