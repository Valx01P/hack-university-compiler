<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>Cache-aside: the service asks Redis first, and on a miss asks PostgreSQL and saves the answer</title>
  <desc>The availability service sends GET for the key to Redis. On a hit, Redis returns the saved JSON and the request is done. On a miss, Redis returns nothing, so the service queries PostgreSQL, gets the rows back, and saves the answer in Redis with SET and a 60 second TTL.</desc>

  <!-- The three parties, with a line down from each -->
  <rect class="dg-strong" x="20" y="20" width="180" height="48" rx="8"/>
  <text x="110" y="44" dy="0.35em" text-anchor="middle">Availability service</text>
  <rect class="dg-hot" x="270" y="20" width="160" height="48" rx="8"/>
  <text class="dg-on-hot" x="350" y="44" dy="0.35em" text-anchor="middle">Redis</text>
  <rect class="dg-box" x="500" y="20" width="160" height="48" rx="8"/>
  <text x="580" y="44" dy="0.35em" text-anchor="middle">PostgreSQL</text>
  <path class="dg-line dg-dashed" d="M110 68 V360"/>
  <path class="dg-line dg-dashed" d="M350 68 V360"/>
  <path class="dg-line dg-dashed" d="M580 68 V360"/>

  <!-- Step 1: GET -->
  <circle class="dg-badge" cx="132" cy="108" r="10"/>
  <text class="dg-on-badge" x="132" y="108" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="240" y="94" text-anchor="middle">GET key</text>
  <path class="dg-flow" d="M146 108 H346" marker-end="url(#arrow-flow)"/>

  <!-- Step 2: a hit -->
  <circle class="dg-badge" cx="132" cy="152" r="10"/>
  <text class="dg-on-badge" x="132" y="152" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="240" y="138" text-anchor="middle">hit: the saved JSON</text>
  <path class="dg-flow dg-dashed" d="M350 152 H146" marker-end="url(#arrow-flow)"/>

  <text class="dg-faint" x="240" y="180" text-anchor="middle">or, on a miss</text>
  <path class="dg-line dg-dashed" d="M350 222 H114" marker-end="url(#arrow)"/>
  <text class="dg-note" x="240" y="208" text-anchor="middle">miss: nothing</text>

  <!-- Step 3: query PostgreSQL -->
  <circle class="dg-badge" cx="132" cy="266" r="10"/>
  <text class="dg-on-badge" x="132" y="266" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="465" y="252" text-anchor="middle">SELECT ...</text>
  <path class="dg-line" d="M146 266 H576" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M580 292 H114" marker-end="url(#arrow)"/>
  <text class="dg-note" x="465" y="282" text-anchor="middle">the rows</text>

  <!-- Step 4: save it -->
  <circle class="dg-badge" cx="132" cy="336" r="10"/>
  <text class="dg-on-badge" x="132" y="336" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="240" y="322" text-anchor="middle">SET key ... EX 60</text>
  <path class="dg-line" d="M146 336 H346" marker-end="url(#arrow)"/>
</svg>
