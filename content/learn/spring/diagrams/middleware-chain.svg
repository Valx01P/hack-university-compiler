<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600">
  <title>A request's path through Spring: Tomcat's filters, then the DispatcherServlet</title>
  <desc>Filters run first, in order: RequestIdFilter with the highest precedence, Spring Boot's own filters, Spring Security's chain in a later lesson, and the read-only filter. Then the DispatcherServlet finds the controller method and checks CORS, runs the interceptors, converts the JSON body, and calls the controller. Exceptions from inside the DispatcherServlet go to the controller advice.</desc>
  <rect class="dg-frame" x="20" y="20" width="640" height="240" rx="12"/>
  <text class="dg-heading" x="100" y="38" dy="0.35em">Filters (Tomcat and the Servlet standard)</text>
  <rect class="dg-frame" x="20" y="280" width="640" height="292" rx="12"/>
  <text class="dg-heading" x="100" y="298" dy="0.35em">DispatcherServlet (Spring MVC)</text>
  <rect class="dg-box" x="40" y="56" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="74" dy="0.35em">RequestIdFilter</text>
  <text class="dg-note" x="330" y="74" dy="0.35em">HIGHEST_PRECEDENCE: id, timing, log</text>
  <path class="dg-line" d="M80 92 V104" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="108" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="126" dy="0.35em">Spring Boot's filters</text>
  <text class="dg-note" x="330" y="126" dy="0.35em">character encoding and others</text>
  <path class="dg-line" d="M80 144 V156" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="40" y="160" width="270" height="36" rx="8"/>
  <text class="dg-faint dg-code" x="56" y="178" dy="0.35em">Spring Security chain</text>
  <text class="dg-faint" x="330" y="178" dy="0.35em">order -100, added later</text>
  <path class="dg-line" d="M80 196 V208" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="212" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="230" dy="0.35em">ReadOnlyFilter</text>
  <text class="dg-note" x="330" y="230" dy="0.35em">@Order(10): refuses writes</text>
  <path class="dg-line" d="M80 248 V312" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="316" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="334" dy="0.35em">handler mapping</text>
  <text class="dg-note" x="330" y="334" dy="0.35em">finds the method, checks CORS</text>
  <path class="dg-line" d="M80 352 V364" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="368" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="386" dy="0.35em">interceptors</text>
  <text class="dg-note" x="330" y="386" dy="0.35em">preHandle, with the method known</text>
  <path class="dg-line" d="M80 404 V416" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="420" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="438" dy="0.35em">message converters</text>
  <text class="dg-note" x="330" y="438" dy="0.35em">JSON body to @RequestBody</text>
  <path class="dg-line" d="M80 456 V468" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="40" y="472" width="270" height="36" rx="8"/>
  <text class="dg-on-hot dg-code" x="56" y="490" dy="0.35em">controller method</text>
  <text class="dg-note" x="330" y="490" dy="0.35em">your @GetMapping or @PostMapping</text>
  <path class="dg-line" d="M80 508 V520" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="40" y="524" width="270" height="36" rx="8"/>
  <text class="dg-code" x="56" y="542" dy="0.35em">@RestControllerAdvice</text>
  <text class="dg-note" x="330" y="542" dy="0.35em">exceptions become responses</text>
</svg>
