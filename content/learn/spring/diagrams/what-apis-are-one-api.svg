<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>Four kinds of clients call one API, and only the API talks to the database</title>
  <desc>Four clients sit in a row: the website in a browser, the phone app, a partner company's script, and the screen by each room's door. Each sends its requests to the one Roombook API. The API runs on Roombook's servers, and it alone talks to the database that holds the rooms and bookings, so the rules live in one place.</desc>

  <!-- The clients. -->
  <rect class="dg-box" x="20" y="20" width="150" height="56" rx="8"/>
  <text x="95" y="39" dy="0.35em" text-anchor="middle">Website
    <tspan class="dg-note" x="95" dy="1.4em">in a browser</tspan>
  </text>
  <rect class="dg-box" x="183" y="20" width="150" height="56" rx="8"/>
  <text x="258" y="39" dy="0.35em" text-anchor="middle">Phone app
    <tspan class="dg-note" x="258" dy="1.4em">iOS and Android</tspan>
  </text>
  <rect class="dg-box" x="346" y="20" width="150" height="56" rx="8"/>
  <text x="421" y="39" dy="0.35em" text-anchor="middle">Partner script
    <tspan class="dg-note" x="421" dy="1.4em">another company</tspan>
  </text>
  <rect class="dg-box" x="509" y="20" width="151" height="56" rx="8"/>
  <text x="584" y="39" dy="0.35em" text-anchor="middle">Door screen
    <tspan class="dg-note" x="584" dy="1.4em">by each room</tspan>
  </text>

  <!-- Every client calls the API. -->
  <path class="dg-line" d="M95 76 V144" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M258 76 V144" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M421 76 V144" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M584 76 V144" marker-end="url(#arrow)"/>

  <!-- Roombook's side. -->
  <rect class="dg-frame" x="20" y="108" width="640" height="232" rx="12"/>
  <text class="dg-note" x="340" y="126" dy="0.35em" text-anchor="middle">Roombook's servers</text>
  <rect class="dg-hot" x="40" y="148" width="600" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="167" dy="0.35em" text-anchor="middle">Roombook API
    <tspan x="340" dy="1.4em">one contract for every client</tspan>
  </text>
  <path class="dg-flow" d="M340 204 V260" marker-end="url(#arrow-flow)"/>
  <rect class="dg-strong" x="250" y="264" width="180" height="56" rx="8"/>
  <text x="340" y="283" dy="0.35em" text-anchor="middle">Database
    <tspan class="dg-note" x="340" dy="1.4em">rooms and bookings</tspan>
  </text>
</svg>
