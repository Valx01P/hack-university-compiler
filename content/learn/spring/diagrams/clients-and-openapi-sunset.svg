<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>Retiring v1: v2 ships, v1 is deprecated, then sunset, then gone</title>
  <desc>A timeline from left to right with two bars. The v1 bar is live until v2 ships in step 1. In step 2 v1 is marked deprecated and its responses carry Deprecation and Sunset headers. At the sunset date in step 3 it stops working, and after that, step 4, it answers 410 Gone. The v2 bar starts at step 1 and keeps going.</desc>

  <!-- Milestones. -->
  <path class="dg-line dg-dashed" d="M220 60 V220"/>
  <path class="dg-line dg-dashed" d="M300 60 V220"/>
  <path class="dg-line dg-dashed" d="M520 60 V220"/>
  <circle class="dg-badge" cx="220" cy="40" r="10"/>
  <text class="dg-on-badge" x="220" y="40" dy="0.35em" text-anchor="middle">1</text>
  <circle class="dg-badge" cx="300" cy="40" r="10"/>
  <text class="dg-on-badge" x="300" y="40" dy="0.35em" text-anchor="middle">2</text>
  <circle class="dg-badge" cx="520" cy="40" r="10"/>
  <text class="dg-on-badge" x="520" y="40" dy="0.35em" text-anchor="middle">3</text>
  <circle class="dg-badge" cx="600" cy="40" r="10"/>
  <text class="dg-on-badge" x="600" y="40" dy="0.35em" text-anchor="middle">4</text>

  <!-- v1. -->
  <text class="dg-code" x="20" y="96" dy="0.35em">/v1</text>
  <rect class="dg-strong" x="60" y="80" width="240" height="32" rx="6"/>
  <text x="180" y="96" dy="0.35em" text-anchor="middle">live</text>
  <rect class="dg-off" x="300" y="80" width="220" height="32" rx="6"/>
  <text class="dg-faint" x="410" y="96" dy="0.35em" text-anchor="middle">deprecated</text>
  <text class="dg-code" x="600" y="96" dy="0.35em" text-anchor="middle">410 Gone</text>

  <!-- v2. -->
  <text class="dg-code" x="20" y="156" dy="0.35em">/v2</text>
  <rect class="dg-hot" x="220" y="140" width="440" height="32" rx="6"/>
  <text class="dg-on-hot" x="440" y="156" dy="0.35em" text-anchor="middle">live</text>

  <!-- What each milestone is. -->
  <text class="dg-note" x="220" y="236" dy="0.35em" text-anchor="middle">v2 ships</text>
  <text class="dg-note" x="300" y="200" dy="0.35em" text-anchor="start" dx="8">Deprecation and Sunset headers</text>
  <text class="dg-note" x="520" y="236" dy="0.35em" text-anchor="middle">sunset date</text>
  <text class="dg-note" x="600" y="200" dy="0.35em" text-anchor="middle">v1 is gone</text>
</svg>
