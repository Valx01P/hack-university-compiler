<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Argon2id turns a password and a random salt into one stored string</title>
  <desc>The password and a random 16-byte salt go into Argon2id, set to 64 MiB of memory, 3 passes, and 4 lanes. Out comes one string for the password_hash column. It names the algorithm and its version, lists the three settings, and ends with the salt and the hash, each written in Base64, all separated by dollar signs.</desc>

  <rect class="dg-box" x="20" y="20" width="280" height="56" rx="8"/>
  <text x="160" y="39" dy="0.35em" text-anchor="middle">Password</text>
  <text class="dg-code" x="160" y="58" dy="0.35em" text-anchor="middle">correct horse battery staple</text>

  <rect class="dg-box" x="380" y="20" width="280" height="56" rx="8"/>
  <text x="520" y="39" dy="0.35em" text-anchor="middle">Salt
    <tspan class="dg-note" x="520" dy="1.4em">16 random bytes, new every time</tspan>
  </text>

  <path class="dg-flow" d="M160 76 V148 H236" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M520 76 V148 H444" marker-end="url(#arrow-flow)"/>

  <rect class="dg-hot" x="240" y="120" width="200" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="139" dy="0.35em" text-anchor="middle">Argon2id
    <tspan x="340" dy="1.4em">64 MiB, 3 passes, 4 lanes</tspan>
  </text>
  <path class="dg-flow" d="M340 176 V236" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="356" y="206" dy="0.35em">into users.password_hash</text>

  <!-- The stored string, piece by piece. -->
  <rect class="dg-box" x="40" y="240" width="92" height="40" rx="8"/>
  <text class="dg-code" x="86" y="260" dy="0.35em" text-anchor="middle">$argon2id</text>
  <text class="dg-note" x="86" y="300" dy="0.35em" text-anchor="middle">algorithm</text>

  <rect class="dg-box" x="140" y="240" width="64" height="40" rx="8"/>
  <text class="dg-code" x="172" y="260" dy="0.35em" text-anchor="middle">$v=19</text>
  <text class="dg-note" x="172" y="300" dy="0.35em" text-anchor="middle">version</text>

  <rect class="dg-box" x="212" y="240" width="148" height="40" rx="8"/>
  <text class="dg-code" x="286" y="260" dy="0.35em" text-anchor="middle">$m=65536,t=3,p=4</text>
  <text class="dg-note" x="286" y="300" dy="0.35em" text-anchor="middle">settings</text>

  <rect class="dg-box" x="368" y="240" width="132" height="40" rx="8"/>
  <text class="dg-code" x="434" y="260" dy="0.35em" text-anchor="middle">$n03ZVI6rbo…</text>
  <text class="dg-note" x="434" y="300" dy="0.35em" text-anchor="middle">salt</text>

  <rect class="dg-strong" x="508" y="240" width="132" height="40" rx="8"/>
  <text class="dg-code" x="574" y="260" dy="0.35em" text-anchor="middle">$ikhhpLP2gv…</text>
  <text class="dg-note" x="574" y="300" dy="0.35em" text-anchor="middle">hash</text>
</svg>
