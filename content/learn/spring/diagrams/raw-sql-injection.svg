<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Input pasted into SQL text, or sent apart as a parameter</title>
  <desc>Pasted into the text, the input ' OR '1'='1 becomes part of the query, WHERE email = '' OR '1'='1', and PostgreSQL matches every row. Sent as a parameter, the SQL text says WHERE email = $1 and the input travels separately. PostgreSQL reads the text first, then fills $1 with the input as plain text, and no email matches it.</desc>

  <!-- Pasted into the text -->
  <text class="dg-heading" x="20" y="30" dy="0.35em">Pasted into the text</text>
  <rect class="dg-box" x="20" y="52" width="320" height="56" rx="8"/>
  <text class="dg-code" x="180" y="71" dy="0.35em" text-anchor="middle">WHERE email = '' OR '1'='1'</text>
  <text class="dg-note" x="180" y="91" dy="0.35em" text-anchor="middle">one string: the input is now SQL</text>
  <path class="dg-line" d="M340 80 H396" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="400" y="52" width="260" height="56" rx="8"/>
  <text x="530" y="71" dy="0.35em" text-anchor="middle">PostgreSQL
    <tspan class="dg-note" x="530" dy="1.4em">matches every row</tspan>
  </text>

  <!-- Sent as a parameter -->
  <text class="dg-heading" x="20" y="150" dy="0.35em">Sent as a parameter</text>
  <text class="dg-note" x="20" y="180" dy="0.35em">SQL text</text>
  <rect class="dg-box" x="20" y="192" width="320" height="40" rx="8"/>
  <text class="dg-code" x="180" y="212" dy="0.35em" text-anchor="middle">WHERE email = $1</text>
  <text class="dg-note" x="20" y="250" dy="0.35em">value, sent apart</text>
  <rect class="dg-hot" x="20" y="262" width="320" height="40" rx="8"/>
  <text class="dg-code dg-on-hot" x="180" y="282" dy="0.35em" text-anchor="middle">' OR '1'='1</text>

  <path class="dg-flow" d="M340 212 H370 V246 H396" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M340 282 H370 V246"/>
  <rect class="dg-strong" x="400" y="210" width="260" height="72" rx="8"/>
  <text x="530" y="226" dy="0.35em" text-anchor="middle">PostgreSQL
    <tspan class="dg-note" x="530" dy="1.4em">reads the text, then fills $1</tspan>
    <tspan class="dg-note" x="530" dy="1.4em">no email matches</tspan>
  </text>
</svg>
