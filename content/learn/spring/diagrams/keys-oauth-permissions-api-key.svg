<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>An API key's three pieces, and the row that checks it</title>
  <desc>The key rb_live_d3beba06_N8hK... has three pieces: rb_live_ says what it is, d3beba06 is the prefix, and the rest is a 32-byte random secret. The prefix finds the key's row in the api_keys table. The whole key goes through SHA-256, and the result is compared with the row's key_hash. The row also holds the key's scopes and whether it's revoked, but never the key itself.</desc>

  <rect class="dg-box" x="20" y="20" width="116" height="40" rx="8"/>
  <text class="dg-code" x="78" y="40" dy="0.35em" text-anchor="middle">rb_live_</text>
  <rect class="dg-strong" x="148" y="20" width="144" height="40" rx="8"/>
  <text class="dg-code" x="220" y="40" dy="0.35em" text-anchor="middle">d3beba06</text>
  <rect class="dg-box" x="304" y="20" width="356" height="40" rx="8"/>
  <text class="dg-code" x="482" y="40" dy="0.35em" text-anchor="middle">_N8hKvnV6OzmOvXbJ166o1Px…</text>

  <text class="dg-note" x="78" y="78" dy="0.35em" text-anchor="middle">what it is</text>
  <text class="dg-note" x="220" y="78" dy="0.35em" text-anchor="middle">prefix</text>
  <text class="dg-note" x="482" y="78" dy="0.35em" text-anchor="middle">secret: 32 random bytes</text>

  <!-- The prefix finds the row. -->
  <path class="dg-flow" d="M220 96 V232" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="232" y="160" dy="0.35em">find the row</text>

  <!-- The whole key is hashed and compared. -->
  <rect class="dg-hot" x="420" y="120" width="160" height="40" rx="8"/>
  <text class="dg-on-hot" x="500" y="140" dy="0.35em" text-anchor="middle">SHA-256</text>
  <path class="dg-line" d="M500 96 V116" marker-end="url(#arrow)"/>
  <text class="dg-note" x="512" y="104" dy="0.35em">the whole key</text>
  <path class="dg-flow" d="M500 160 V232" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="512" y="196" dy="0.35em">compare</text>

  <!-- The stored row. -->
  <rect class="dg-frame" x="20" y="212" width="640" height="96" rx="12"/>
  <text class="dg-heading" x="40" y="226" dy="0.35em">api_keys</text>
  <text class="dg-code" x="220" y="252" dy="0.35em" text-anchor="middle">prefix = d3beba06</text>
  <text class="dg-code" x="500" y="252" dy="0.35em" text-anchor="middle">key_hash = 5f1c3a…</text>
  <text class="dg-code" x="220" y="284" dy="0.35em" text-anchor="middle">scopes = {schedule:read}</text>
  <text class="dg-code" x="500" y="284" dy="0.35em" text-anchor="middle">revoked_at = null</text>
</svg>
