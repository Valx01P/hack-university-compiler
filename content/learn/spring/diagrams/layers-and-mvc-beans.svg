<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>The beans Spring creates for bookings and rooms, and which ones each constructor receives</title>
  <desc>Inside the application context, BookingController receives BookingService. BookingService receives a Clock, made by ClockConfig's @Bean method, InMemoryBookingRepository as its BookingRepository, and InMemoryRoomRepository as its RoomRepository. InMemoryBookingRepository receives the same Clock, and RoomController the same InMemoryRoomRepository, since each bean exists once and is shared.</desc>

  <rect class="dg-frame" x="20" y="20" width="640" height="380" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">Application context</text>
  <text class="dg-note" x="640" y="44" dy="0.35em" text-anchor="end">one of each, made at startup</text>

  <!-- Controllers. -->
  <rect class="dg-hot" x="40" y="80" width="260" height="56" rx="8"/>
  <text class="dg-on-hot dg-code" x="170" y="100" dy="0.35em" text-anchor="middle">BookingController</text>
  <text class="dg-on-hot" x="170" y="120" dy="0.35em" text-anchor="middle">@RestController</text>
  <rect class="dg-box" x="380" y="80" width="260" height="56" rx="8"/>
  <text class="dg-code" x="510" y="100" dy="0.35em" text-anchor="middle">RoomController</text>
  <text class="dg-note" x="510" y="120" dy="0.35em" text-anchor="middle">@RestController</text>

  <!-- The service. -->
  <path class="dg-flow" d="M170 136 V176" marker-end="url(#arrow-flow)"/>
  <rect class="dg-strong" x="40" y="180" width="260" height="56" rx="8"/>
  <text class="dg-code" x="170" y="200" dy="0.35em" text-anchor="middle">BookingService</text>
  <text class="dg-note" x="170" y="220" dy="0.35em" text-anchor="middle">@Service</text>

  <!-- What the service receives. -->
  <rect class="dg-box" x="40" y="300" width="120" height="56" rx="8"/>
  <text class="dg-code" x="100" y="320" dy="0.35em" text-anchor="middle">Clock</text>
  <text class="dg-note" x="100" y="340" dy="0.35em" text-anchor="middle">@Bean</text>
  <rect class="dg-box" x="190" y="300" width="220" height="56" rx="8"/>
  <text class="dg-code" x="300" y="320" dy="0.35em" text-anchor="middle">InMemoryBookingRepository</text>
  <text class="dg-note" x="300" y="340" dy="0.35em" text-anchor="middle">@Repository</text>
  <rect class="dg-box" x="440" y="300" width="200" height="56" rx="8"/>
  <text class="dg-code" x="540" y="320" dy="0.35em" text-anchor="middle">InMemoryRoomRepository</text>
  <text class="dg-note" x="540" y="340" dy="0.35em" text-anchor="middle">@Repository</text>

  <path class="dg-line" d="M100 236 V296" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M250 236 V296" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M290 236 V264 H500 V296" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M600 136 V296" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M190 328 H164" marker-end="url(#arrow)"/>
</svg>
