<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680">
  <title>The Roombook project's folders: what's there now, and what later lessons add</title>
  <desc>The roombook folder holds pom.xml, the Maven wrapper (mvnw and .mvn/wrapper), .gitignore, src, and target. Under src/main/java, the dev/hackuniversity/roombook package holds RoombookApplication.java, the entry point, and health/HealthController.java, the first endpoint, both written now. Later lessons add the config and common packages and one package per feature: rooms, bookings, auth, and feedback. src/main/resources holds application.yaml, and later db/migration. src/test/java holds the tests, and target holds the build's output.</desc>

