<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <title>Four ways to get news from a server: short polling, long polling, SSE, and WebSockets</title>
  <desc>Four timelines, each with the client above and the server below, and time running left to right. The same two pieces of news happen on the server in every row. Short polling asks every few seconds, and each piece of news waits for the next ask. Long polling holds each request open until news comes, then asks again. SSE sends one request and gets each piece of news pushed down the open response. A WebSocket upgrades once, then both sides send messages whenever they like.</desc>

  <!-- Short polling. -->
  <text class="dg-heading" x="20" y="65" dy="0.35em">Short polling</text>
  <text class="dg-note" x="206" y="40" dy="0.35em" text-anchor="end">client</text>
  <text class="dg-note" x="206" y="90" dy="0.35em" text-anchor="end">server</text>
  <path class="dg-line" d="M216 40 H660"/>
  <path class="dg-line" d="M216 90 H660"/>
  <circle class="dg-hot" cx="420" cy="90" r="5"/>
  <circle class="dg-hot" cx="560" cy="90" r="5"/>
  <path class="dg-line" d="M240 40 V86" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M252 90 V44" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M340 40 V86" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M352 90 V44" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M440 40 V86" marker-end="url(#arrow)"/>
  <path class="dg-flow dg-dashed" d="M452 90 V44" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M540 40 V86" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M552 90 V44" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M640 40 V86" marker-end="url(#arrow)"/>
  <path class="dg-flow dg-dashed" d="M652 90 V44" marker-end="url(#arrow-flow)"/>

  <!-- Long polling. -->
  <text class="dg-heading" x="20" y="175" dy="0.35em">Long polling</text>
  <text class="dg-note" x="206" y="150" dy="0.35em" text-anchor="end">client</text>
  <text class="dg-note" x="206" y="200" dy="0.35em" text-anchor="end">server</text>
  <path class="dg-line" d="M216 150 H660"/>
  <path class="dg-line" d="M216 200 H660"/>
  <circle class="dg-hot" cx="420" cy="200" r="5"/>
  <circle class="dg-hot" cx="560" cy="200" r="5"/>
  <path class="dg-line" d="M240 150 V196" marker-end="url(#arrow)"/>
  <path class="dg-flow dg-dashed" d="M428 200 V154" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M444 150 V196" marker-end="url(#arrow)"/>
  <path class="dg-flow dg-dashed" d="M568 200 V154" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M584 150 V196" marker-end="url(#arrow)"/>

  <!-- SSE. -->
  <text class="dg-heading" x="20" y="285" dy="0.35em">SSE</text>
  <text class="dg-note" x="206" y="260" dy="0.35em" text-anchor="end">client</text>
  <text class="dg-note" x="206" y="310" dy="0.35em" text-anchor="end">server</text>
  <path class="dg-line" d="M216 260 H660"/>
  <path class="dg-line" d="M216 310 H660"/>
  <circle class="dg-hot" cx="420" cy="310" r="5"/>
  <circle class="dg-hot" cx="560" cy="310" r="5"/>
  <path class="dg-line" d="M240 260 V306" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M252 310 V264" marker-end="url(#arrow)"/>
  <path class="dg-flow dg-dashed" d="M428 310 V264" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow dg-dashed" d="M568 310 V264" marker-end="url(#arrow-flow)"/>

  <!-- WebSocket. -->
  <text class="dg-heading" x="20" y="395" dy="0.35em">WebSocket</text>
  <text class="dg-note" x="206" y="370" dy="0.35em" text-anchor="end">client</text>
  <text class="dg-note" x="206" y="420" dy="0.35em" text-anchor="end">server</text>
  <path class="dg-line" d="M216 370 H660"/>
  <path class="dg-line" d="M216 420 H660"/>
  <circle class="dg-hot" cx="420" cy="420" r="5"/>
  <circle class="dg-hot" cx="560" cy="420" r="5"/>
  <path class="dg-line" d="M240 370 V416" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M252 420 V374" marker-end="url(#arrow)"/>
  <path class="dg-flow dg-dashed" d="M428 420 V374" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M500 370 V416" marker-end="url(#arrow)"/>
  <path class="dg-flow dg-dashed" d="M568 420 V374" marker-end="url(#arrow-flow)"/>

  <!-- Time. -->
  <path class="dg-line" d="M216 446 H656" marker-end="url(#arrow)"/>
  <text class="dg-note" x="206" y="446" dy="0.35em" text-anchor="end">time</text>
</svg>
