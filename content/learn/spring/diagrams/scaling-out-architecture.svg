<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>Clients, one load balancer, three instances, and the shared PostgreSQL and Redis</title>
  <desc>Three clients, the web app, the phone app, and a door display, all send requests to one address, the load balancer at api.roombook.example. It passes each request to one of three identical Roombook instances. All three instances share one PostgreSQL database for data and one Redis for caches and counters.</desc>

  <!-- Clients. -->
  <rect class="dg-box" x="40" y="20" width="160" height="40" rx="8"/>
  <text x="120" y="40" dy="0.35em" text-anchor="middle">Web app</text>
  <rect class="dg-box" x="260" y="20" width="160" height="40" rx="8"/>
  <text x="340" y="40" dy="0.35em" text-anchor="middle">Phone app</text>
  <rect class="dg-box" x="480" y="20" width="160" height="40" rx="8"/>
  <text x="560" y="40" dy="0.35em" text-anchor="middle">Door display</text>
  <path class="dg-line" d="M120 60 V80 H340"/>
  <path class="dg-line" d="M560 60 V80 H340"/>
  <path class="dg-flow" d="M340 60 V106" marker-end="url(#arrow-flow)"/>

  <!-- The load balancer. -->
  <rect class="dg-hot" x="200" y="110" width="280" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="129" dy="0.35em" text-anchor="middle">Load balancer
    <tspan x="340" dy="1.4em">api.roombook.example</tspan>
  </text>
  <path class="dg-line" d="M340 166 V186 H120 V216" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M340 186 H560 V216" marker-end="url(#arrow)"/>
  <path class="dg-flow" d="M340 166 V216" marker-end="url(#arrow-flow)"/>

  <!-- The instances. -->
  <rect class="dg-strong" x="40" y="220" width="160" height="56" rx="8"/>
  <text x="120" y="239" dy="0.35em" text-anchor="middle">Instance 1
    <tspan class="dg-note" x="120" dy="1.4em">Roombook</tspan>
  </text>
  <rect class="dg-strong" x="260" y="220" width="160" height="56" rx="8"/>
  <text x="340" y="239" dy="0.35em" text-anchor="middle">Instance 2
    <tspan class="dg-note" x="340" dy="1.4em">Roombook</tspan>
  </text>
  <rect class="dg-strong" x="480" y="220" width="160" height="56" rx="8"/>
  <text x="560" y="239" dy="0.35em" text-anchor="middle">Instance 3
    <tspan class="dg-note" x="560" dy="1.4em">Roombook</tspan>
  </text>

  <!-- The shared stores. -->
  <path class="dg-line" d="M120 276 V310 H560 V276"/>
  <path class="dg-line" d="M340 276 V310"/>
  <path class="dg-line" d="M210 310 V346" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M470 310 V346" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="110" y="350" width="200" height="56" rx="8"/>
  <text x="210" y="369" dy="0.35em" text-anchor="middle">PostgreSQL
    <tspan class="dg-note" x="210" dy="1.4em">bookings, sessions</tspan>
  </text>
  <rect class="dg-box" x="370" y="350" width="200" height="56" rx="8"/>
  <text x="470" y="369" dy="0.35em" text-anchor="middle">Redis
    <tspan class="dg-note" x="470" dy="1.4em">caches, counters</tspan>
  </text>
</svg>
