<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 780">
  <title>Picking a status code: the questions to ask, in order</title>
  <desc>Seven questions run down the left, and a yes moves on to the next. A no leads right to its code: over the rate limit gives 429, unreadable gives 400 (413 too big, 415 wrong type), an unknown caller 401, a caller without permission 403, a missing thing 404 (405 for a wrong method), invalid values 422, and a clash with current data 409 (412 for a stale If-Match). Past every question, the handler does the work. Success is a 2xx: 201, 202, 204, or 200. A failure on the server side is a 5xx: 500, 502, 503, or 504.</desc>

  <rect class="dg-box" x="20" y="28" width="300" height="40" rx="8"/>
  <text x="170" y="48" dy="0.35em" text-anchor="middle">Under the rate limit?</text>
  <path class="dg-line" d="M320 48 H396" marker-end="url(#arrow)"/>
  <text class="dg-note" x="358" y="36" dy="0.35em" text-anchor="middle">no</text>
  <rect class="dg-box" x="400" y="20" width="260" height="56" rx="8"/>
  <text x="530" y="38" dy="0.35em" text-anchor="middle">429 Too Many Requests
    <tspan class="dg-note" x="530" dy="1.4em">with Retry-After</tspan>
  </text>
  <path class="dg-flow" d="M170 68 V96" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="182" y="82" dy="0.35em">yes</text>

  <rect class="dg-box" x="20" y="100" width="300" height="40" rx="8"/>
  <text x="170" y="120" dy="0.35em" text-anchor="middle">Can the server read it?</text>
  <path class="dg-line" d="M320 120 H396" marker-end="url(#arrow)"/>
  <text class="dg-note" x="358" y="108" dy="0.35em" text-anchor="middle">no</text>
  <rect class="dg-box" x="400" y="92" width="260" height="56" rx="8"/>
  <text x="530" y="110" dy="0.35em" text-anchor="middle">400 Bad Request
    <tspan class="dg-note" x="530" dy="1.4em">413 too big, 415 wrong type</tspan>
  </text>
  <path class="dg-flow" d="M170 140 V168" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="182" y="154" dy="0.35em">yes</text>

  <rect class="dg-box" x="20" y="172" width="300" height="40" rx="8"/>
  <text x="170" y="192" dy="0.35em" text-anchor="middle">Is the caller known?</text>
  <path class="dg-line" d="M320 192 H396" marker-end="url(#arrow)"/>
  <text class="dg-note" x="358" y="180" dy="0.35em" text-anchor="middle">no</text>
  <rect class="dg-box" x="400" y="164" width="260" height="56" rx="8"/>
  <text x="530" y="182" dy="0.35em" text-anchor="middle">401 Unauthorized
    <tspan class="dg-note" x="530" dy="1.4em">no valid login or key</tspan>
  </text>
  <path class="dg-flow" d="M170 212 V240" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="182" y="226" dy="0.35em">yes</text>

  <rect class="dg-box" x="20" y="244" width="300" height="40" rx="8"/>
  <text x="170" y="264" dy="0.35em" text-anchor="middle">Are they allowed?</text>
  <path class="dg-line" d="M320 264 H396" marker-end="url(#arrow)"/>
  <text class="dg-note" x="358" y="252" dy="0.35em" text-anchor="middle">no</text>
  <rect class="dg-box" x="400" y="236" width="260" height="56" rx="8"/>
  <text x="530" y="254" dy="0.35em" text-anchor="middle">403 Forbidden
    <tspan class="dg-note" x="530" dy="1.4em">known, but not permitted</tspan>
  </text>
  <path class="dg-flow" d="M170 284 V312" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="182" y="298" dy="0.35em">yes</text>

  <rect class="dg-box" x="20" y="316" width="300" height="40" rx="8"/>
  <text x="170" y="336" dy="0.35em" text-anchor="middle">Is the thing there?</text>
  <path class="dg-line" d="M320 336 H396" marker-end="url(#arrow)"/>
  <text class="dg-note" x="358" y="324" dy="0.35em" text-anchor="middle">no</text>
  <rect class="dg-box" x="400" y="308" width="260" height="56" rx="8"/>
  <text x="530" y="326" dy="0.35em" text-anchor="middle">404 Not Found
    <tspan class="dg-note" x="530" dy="1.4em">405 if only the method is wrong</tspan>
  </text>
  <path class="dg-flow" d="M170 356 V384" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="182" y="370" dy="0.35em">yes</text>

  <rect class="dg-box" x="20" y="388" width="300" height="40" rx="8"/>
  <text x="170" y="408" dy="0.35em" text-anchor="middle">Are the values valid?</text>
  <path class="dg-line" d="M320 408 H396" marker-end="url(#arrow)"/>
  <text class="dg-note" x="358" y="396" dy="0.35em" text-anchor="middle">no</text>
  <rect class="dg-box" x="400" y="380" width="260" height="56" rx="8"/>
  <text x="530" y="398" dy="0.35em" text-anchor="middle">422 Unprocessable Content
    <tspan class="dg-note" x="530" dy="1.4em">breaks a rule, like capacity</tspan>
  </text>
  <path class="dg-flow" d="M170 428 V456" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="182" y="442" dy="0.35em">yes</text>

  <rect class="dg-box" x="20" y="460" width="300" height="40" rx="8"/>
  <text x="170" y="480" dy="0.35em" text-anchor="middle">Does it fit the data now?</text>
  <path class="dg-line" d="M320 480 H396" marker-end="url(#arrow)"/>
  <text class="dg-note" x="358" y="468" dy="0.35em" text-anchor="middle">no</text>
  <rect class="dg-box" x="400" y="452" width="260" height="56" rx="8"/>
  <text x="530" y="470" dy="0.35em" text-anchor="middle">409 Conflict
    <tspan class="dg-note" x="530" dy="1.4em">412 if If-Match is stale</tspan>
  </text>
  <path class="dg-flow" d="M170 500 V528" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="182" y="514" dy="0.35em">yes</text>

  <!-- Every answer was yes. -->
  <rect class="dg-hot" x="20" y="532" width="300" height="40" rx="8"/>
  <text class="dg-on-hot" x="170" y="552" dy="0.35em" text-anchor="middle">Do the work</text>
  <path class="dg-flow" d="M170 572 V616" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="182" y="596" dy="0.35em">it worked</text>
  <path class="dg-line" d="M320 552 H500 V616" marker-end="url(#arrow)"/>
  <text class="dg-note" x="512" y="596" dy="0.35em">the server failed</text>
  <rect class="dg-strong" x="20" y="620" width="300" height="140" rx="8"/>
  <text class="dg-heading" x="40" y="642" dy="0.35em">2xx: it worked</text>
  <rect class="dg-box" x="340" y="620" width="320" height="140" rx="8"/>
  <text class="dg-heading" x="360" y="642" dy="0.35em">5xx: the server failed</text>
  <text class="dg-code" x="40" y="674" dy="0.35em">201</text>
  <text class="dg-note" x="76" y="674" dy="0.35em">made something new</text>
  <text class="dg-code" x="360" y="674" dy="0.35em">500</text>
  <text class="dg-note" x="396" y="674" dy="0.35em">a bug or a crash</text>
  <text class="dg-code" x="40" y="698" dy="0.35em">202</text>
  <text class="dg-note" x="76" y="698" dy="0.35em">will finish later</text>
  <text class="dg-code" x="360" y="698" dy="0.35em">502</text>
  <text class="dg-note" x="396" y="698" dy="0.35em">a bad answer from upstream</text>
  <text class="dg-code" x="40" y="722" dy="0.35em">204</text>
  <text class="dg-note" x="76" y="722" dy="0.35em">nothing to send back</text>
  <text class="dg-code" x="360" y="722" dy="0.35em">503</text>
  <text class="dg-note" x="396" y="722" dy="0.35em">down or overloaded</text>
  <text class="dg-code" x="40" y="746" dy="0.35em">200</text>
  <text class="dg-note" x="76" y="746" dy="0.35em">anything else that worked</text>
  <text class="dg-code" x="360" y="746" dy="0.35em">504</text>
  <text class="dg-note" x="396" y="746" dy="0.35em">upstream took too long</text>
</svg>
