<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500">
  <title>One booking through the layers, from the client's POST to the 201 response</title>
  <desc>Step 1: the client sends POST /v1/bookings to the controller. Step 2: the controller parses the body. Step 3: it calls create on the service with a new booking. Step 4: the service asks the repository for the room and gets a Room back. Step 5: the service checks the rules. Step 6: it asks the repository to insert the booking and gets the stored Booking back. Step 7: the service returns the Booking to the controller. Step 8: the controller answers 201 with the view.</desc>

  <!-- The four participants, and their lifelines. -->
  <rect class="dg-box" x="20" y="20" width="140" height="40" rx="8"/>
  <text x="90" y="40" dy="0.35em" text-anchor="middle">Client</text>
  <rect class="dg-hot" x="183" y="20" width="140" height="40" rx="8"/>
  <text class="dg-on-hot" x="253" y="40" dy="0.35em" text-anchor="middle">Controller</text>
  <rect class="dg-strong" x="347" y="20" width="140" height="40" rx="8"/>
  <text x="417" y="40" dy="0.35em" text-anchor="middle">Service</text>
  <rect class="dg-strong" x="510" y="20" width="150" height="40" rx="8"/>
  <text x="585" y="40" dy="0.35em" text-anchor="middle">Repository</text>
  <path class="dg-line" d="M90 60 V490"/>
  <path class="dg-line" d="M253 60 V490"/>
  <path class="dg-line" d="M417 60 V490"/>
  <path class="dg-line" d="M585 60 V490"/>

  <!-- 1: the request. -->
  <circle class="dg-badge" cx="104" cy="86" r="10"/>
  <text class="dg-on-badge" x="104" y="86" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="118" y="86" dy="0.35em">POST /v1/bookings</text>
  <path class="dg-flow" d="M90 106 H249" marker-end="url(#arrow-flow)"/>

  <!-- 2: parse. -->
  <circle class="dg-badge" cx="275" cy="142" r="10"/>
  <text class="dg-on-badge" x="275" y="142" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="293" y="142" dy="0.35em">parse the body</text>

  <!-- 3: call the service. -->
  <circle class="dg-badge" cx="275" cy="180" r="10"/>
  <text class="dg-on-badge" x="275" y="180" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="293" y="180" dy="0.35em">create(newBooking)</text>
  <path class="dg-flow" d="M253 200 H413" marker-end="url(#arrow-flow)"/>

  <!-- 4: find the room. -->
  <circle class="dg-badge" cx="439" cy="230" r="10"/>
  <text class="dg-on-badge" x="439" y="230" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="457" y="230" dy="0.35em">find room 1</text>
  <path class="dg-flow" d="M417 250 H581" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M585 278 H421" marker-end="url(#arrow)"/>
  <text class="dg-code" x="501" y="294" dy="0.35em" text-anchor="middle">Room</text>

  <!-- 5: check the rules. -->
  <circle class="dg-badge" cx="439" cy="326" r="10"/>
  <text class="dg-on-badge" x="439" y="326" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-note" x="457" y="326" dy="0.35em">check the rules</text>

  <!-- 6: insert. -->
  <circle class="dg-badge" cx="439" cy="360" r="10"/>
  <text class="dg-on-badge" x="439" y="360" dy="0.35em" text-anchor="middle">6</text>
  <text class="dg-code" x="457" y="360" dy="0.35em">insert(...)</text>
  <path class="dg-flow" d="M417 380 H581" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M585 406 H421" marker-end="url(#arrow)"/>
  <text class="dg-code" x="501" y="422" dy="0.35em" text-anchor="middle">Booking</text>

  <!-- 7 and 8: the answers come back. -->
  <circle class="dg-badge" cx="275" cy="430" r="10"/>
  <text class="dg-on-badge" x="275" y="430" dy="0.35em" text-anchor="middle">7</text>
  <text class="dg-code" x="293" y="430" dy="0.35em">Booking</text>
  <path class="dg-line dg-dashed" d="M417 448 H257" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="104" cy="466" r="10"/>
  <text class="dg-on-badge" x="104" y="466" dy="0.35em" text-anchor="middle">8</text>
  <text class="dg-code" x="118" y="466" dy="0.35em">201 + view</text>
  <path class="dg-line dg-dashed" d="M253 484 H94" marker-end="url(#arrow)"/>
</svg>
