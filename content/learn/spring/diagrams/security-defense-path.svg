<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540">
  <title>Where Roombook stops each OWASP API risk, in the order a request meets the checks</title>
  <desc>A request passes eight checks from top to bottom. The edge refuses plain HTTP and oversized or too frequent requests. Then Roombook works out who is calling, checks the route's role, accepts only fields the caller may set, loads the object only if it is theirs, applies business limits, sends values to the database as parameters, and returns only fields the caller may see. Each check is labeled with the OWASP risk it stops.</desc>
  <text class="dg-heading" x="20" y="24" dy="0.35em">Request path</text>
  <text class="dg-heading" x="400" y="24" dy="0.35em">Risk it stops</text>
  <rect class="dg-box" x="20" y="50" width="340" height="40" rx="8"/>
  <text x="190" y="70" dy="0.35em" text-anchor="middle">Edge: HTTPS, size and rate limits</text>
  <text class="dg-code" x="400" y="62" dy="0.35em">API4  API8</text>
  <text class="dg-note" x="400" y="80" dy="0.35em">too much, or left open</text>
  <path class="dg-flow" d="M190 90 V104" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="20" y="108" width="340" height="40" rx="8"/>
  <text x="190" y="128" dy="0.35em" text-anchor="middle">Who is calling?</text>
  <text class="dg-code" x="400" y="120" dy="0.35em">API2</text>
  <text class="dg-note" x="400" y="138" dy="0.35em">broken authentication</text>
  <path class="dg-flow" d="M190 148 V162" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="20" y="166" width="340" height="40" rx="8"/>
  <text x="190" y="186" dy="0.35em" text-anchor="middle">May this role use the route?</text>
  <text class="dg-code" x="400" y="178" dy="0.35em">API5</text>
  <text class="dg-note" x="400" y="196" dy="0.35em">function level</text>
  <path class="dg-flow" d="M190 206 V220" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="20" y="224" width="340" height="40" rx="8"/>
  <text x="190" y="244" dy="0.35em" text-anchor="middle">Accept only fields they may set</text>
  <text class="dg-code" x="400" y="236" dy="0.35em">API3</text>
  <text class="dg-note" x="400" y="254" dy="0.35em">mass assignment</text>
  <path class="dg-flow" d="M190 264 V278" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="20" y="282" width="340" height="40" rx="8"/>
  <text class="dg-on-hot" x="190" y="302" dy="0.35em" text-anchor="middle">Load it only if it&#39;s theirs</text>
  <text class="dg-code" x="400" y="294" dy="0.35em">API1</text>
  <text class="dg-note" x="400" y="312" dy="0.35em">object level</text>
  <path class="dg-flow" d="M190 322 V336" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="20" y="340" width="340" height="40" rx="8"/>
  <text x="190" y="360" dy="0.35em" text-anchor="middle">Apply the business limits</text>
  <text class="dg-code" x="400" y="352" dy="0.35em">API6</text>
  <text class="dg-note" x="400" y="370" dy="0.35em">business flows</text>
  <path class="dg-flow" d="M190 380 V394" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="20" y="398" width="340" height="40" rx="8"/>
  <text x="190" y="418" dy="0.35em" text-anchor="middle">Send values as parameters</text>
  <text class="dg-code" x="400" y="410" dy="0.35em">Injection</text>
  <text class="dg-note" x="400" y="428" dy="0.35em">A05 on the web list</text>
  <path class="dg-flow" d="M190 438 V452" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="20" y="456" width="340" height="40" rx="8"/>
  <text x="190" y="476" dy="0.35em" text-anchor="middle">Return only fields they may see</text>
  <text class="dg-code" x="400" y="468" dy="0.35em">API3</text>
  <text class="dg-note" x="400" y="486" dy="0.35em">data exposure</text>
</svg>
