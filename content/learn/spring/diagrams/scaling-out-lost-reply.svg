<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>A lost reply: the booking is saved, and the app never hears back</title>
  <desc>A timeline between the phone app on the left and Roombook on the right. In step 1 the app sends a booking. In step 2 Roombook saves booking 1001. In step 3 the reply is lost on the way back. In step 4 the app times out and cannot tell whether the booking was made.</desc>

  <!-- The two sides. -->
  <rect class="dg-box" x="40" y="20" width="160" height="40" rx="8"/>
  <text x="120" y="40" dy="0.35em" text-anchor="middle">Phone app</text>
  <rect class="dg-box" x="440" y="20" width="200" height="40" rx="8"/>
  <text x="540" y="40" dy="0.35em" text-anchor="middle">Roombook</text>
  <path class="dg-line dg-dashed" d="M120 60 V340"/>
  <path class="dg-line dg-dashed" d="M540 60 V340"/>

  <!-- Step 1: the request. -->
  <circle class="dg-badge" cx="90" cy="110" r="10"/>
  <text class="dg-on-badge" x="90" y="110" dy="0.35em" text-anchor="middle">1</text>
  <path class="dg-flow" d="M120 110 H536" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="330" y="92" dy="0.35em" text-anchor="middle">POST /v1/bookings</text>

  <!-- Step 2: saved. -->
  <circle class="dg-badge" cx="420" cy="166" r="10"/>
  <text class="dg-on-badge" x="420" y="166" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-hot" x="440" y="146" width="200" height="40" rx="8"/>
  <text class="dg-on-hot" x="540" y="166" dy="0.35em" text-anchor="middle">saves booking 1001</text>

  <!-- Step 3: the reply is lost. -->
  <circle class="dg-badge" cx="560" cy="230" r="10"/>
  <text class="dg-on-badge" x="560" y="230" dy="0.35em" text-anchor="middle">3</text>
  <path class="dg-line dg-dashed" d="M540 230 H340"/>
  <text class="dg-code" x="440" y="212" dy="0.35em" text-anchor="middle">201 Created</text>
  <text class="dg-note" x="324" y="230" dy="0.35em" text-anchor="end">lost on the way</text>

  <!-- Step 4: the app can't tell. -->
  <circle class="dg-badge" cx="90" cy="294" r="10"/>
  <text class="dg-on-badge" x="90" y="294" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-strong" x="120" y="274" width="220" height="40" rx="8"/>
  <text x="230" y="294" dy="0.35em" text-anchor="middle">timeout: booked or not?</text>
</svg>
