<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>An in-memory API test calls the app directly, an end-to-end test goes through a port</title>
  <desc>Two rows. In the in-memory row, the test hands a request straight to the real app, its routes, middleware, and handlers, which uses fake repositories, all inside one process with no network. In the end-to-end row, the test sends a request over a real port to a running server, which uses a real PostgreSQL database.</desc>

  <!-- In memory. -->
  <text class="dg-heading" x="20" y="30" dy="0.35em">API test, in memory</text>
  <rect class="dg-frame" x="20" y="52" width="640" height="96" rx="12"/>
  <text class="dg-note" x="640" y="70" dy="0.35em" text-anchor="end">one process</text>
  <rect class="dg-box" x="40" y="72" width="120" height="56" rx="8"/>
  <text x="100" y="100" dy="0.35em" text-anchor="middle">Test</text>
  <path class="dg-flow" d="M160 100 H236" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="198" y="84" dy="0.35em" text-anchor="middle">a call</text>
  <rect class="dg-hot" x="240" y="72" width="200" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="91" dy="0.35em" text-anchor="middle">The real app
    <tspan x="340" dy="1.4em">routes, middleware</tspan>
  </text>
  <path class="dg-line" d="M440 100 H496" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="500" y="72" width="140" height="56" rx="8"/>
  <text x="570" y="91" dy="0.35em" text-anchor="middle">Fakes
    <tspan class="dg-note" x="570" dy="1.4em">in memory</tspan>
  </text>

  <!-- End to end. -->
  <text class="dg-heading" x="20" y="188" dy="0.35em">End-to-end test</text>
  <rect class="dg-box" x="40" y="226" width="120" height="56" rx="8"/>
  <text x="100" y="254" dy="0.35em" text-anchor="middle">Test</text>
  <path class="dg-line" d="M160 254 H236" marker-end="url(#arrow)"/>
  <text class="dg-note" x="198" y="238" dy="0.35em" text-anchor="middle">HTTP</text>
  <rect class="dg-frame" x="240" y="210" width="220" height="88" rx="12"/>
  <text class="dg-code" x="350" y="226" dy="0.35em" text-anchor="middle">127.0.0.1:port</text>
  <rect class="dg-strong" x="256" y="242" width="188" height="44" rx="8"/>
  <text x="350" y="264" dy="0.35em" text-anchor="middle">Running server</text>
  <path class="dg-line" d="M460 254 H496" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="500" y="226" width="140" height="56" rx="8"/>
  <text x="570" y="245" dy="0.35em" text-anchor="middle">PostgreSQL
    <tspan class="dg-note" x="570" dy="1.4em">a test database</tspan>
  </text>
</svg>
