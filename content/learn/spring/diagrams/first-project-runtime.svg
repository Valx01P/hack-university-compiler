<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
  <title>Tomcat's thread per request, and virtual threads that step aside while they wait</title>
  <desc>On the left, Tomcat's pool of platform threads, 200 by default. In step 1, a request gets a thread of its own. In step 2, the handler waits on the database, and its thread waits with it. In step 3, once every thread is busy, new requests wait in line. On the right, virtual threads: in step 4, a virtual thread that's waiting steps off its carrier, one of a few real threads, and waits in memory, so the carrier can run another request. Thousands can wait this way.</desc>

  <!-- Platform threads. -->
  <rect class="dg-frame" x="20" y="20" width="310" height="400" rx="12"/>
  <text class="dg-heading" x="36" y="44" dy="0.35em">Platform threads</text>
  <text class="dg-note" x="36" y="66" dy="0.35em">Tomcat's pool, 200 by default</text>

  <rect class="dg-off" x="36" y="88" width="278" height="56" rx="8"/>
  <text class="dg-faint" x="175" y="106" dy="0.35em" text-anchor="middle">requests waiting in line
    <tspan x="175" dy="1.4em">when every thread is busy</tspan>
  </text>
  <circle class="dg-badge" cx="300" cy="88" r="10"/>
  <text class="dg-on-badge" x="300" y="88" dy="0.35em" text-anchor="middle">3</text>

  <path class="dg-flow" d="M175 144 V172" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="200" cy="158" r="10"/>
  <text class="dg-on-badge" x="200" y="158" dy="0.35em" text-anchor="middle">1</text>

  <rect class="dg-hot" x="36" y="176" width="278" height="48" rx="8"/>
  <text class="dg-on-hot" x="52" y="191" dy="0.35em">thread 1
    <tspan x="52" dy="1.4em">blocked, waiting on the database</tspan>
  </text>
  <circle class="dg-badge" cx="300" cy="176" r="10"/>
  <text class="dg-on-badge" x="300" y="176" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="36" y="232" width="278" height="48" rx="8"/>
  <text x="52" y="247" dy="0.35em">thread 2
    <tspan class="dg-note" x="52" dy="1.4em">blocked, waiting on the database</tspan>
  </text>
  <rect class="dg-box" x="36" y="288" width="278" height="48" rx="8"/>
  <text x="52" y="303" dy="0.35em">thread 3
    <tspan class="dg-note" x="52" dy="1.4em">running a handler</tspan>
  </text>
  <rect class="dg-off" x="36" y="344" width="278" height="48" rx="8"/>
  <text class="dg-faint" x="52" y="368" dy="0.35em">threads 4 to 200</text>

  <!-- Virtual threads. -->
  <rect class="dg-frame" x="350" y="20" width="310" height="400" rx="12"/>
  <text class="dg-heading" x="366" y="44" dy="0.35em">Virtual threads</text>
  <text class="dg-note" x="366" y="66" dy="0.35em">a few carriers, one per core</text>

  <rect class="dg-strong" x="366" y="88" width="134" height="56" rx="8"/>
  <text x="433" y="106" dy="0.35em" text-anchor="middle">carrier 1
    <tspan class="dg-note" x="433" dy="1.4em">runs request 7</tspan>
  </text>
  <rect class="dg-strong" x="510" y="88" width="134" height="56" rx="8"/>
  <text x="577" y="106" dy="0.35em" text-anchor="middle">carrier 2
    <tspan class="dg-note" x="577" dy="1.4em">runs request 9</tspan>
  </text>

  <path class="dg-flow dg-dashed" d="M433 144 V196" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="458" cy="170" r="10"/>
  <text class="dg-on-badge" x="458" y="170" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="476" y="170" dy="0.35em">steps off to wait</text>

  <rect class="dg-box" x="366" y="200" width="278" height="192" rx="8"/>
  <text x="382" y="220" dy="0.35em">Waiting in memory</text>
  <rect class="dg-off" x="382" y="240" width="118" height="28" rx="6"/>
  <text class="dg-faint" x="441" y="254" dy="0.35em" text-anchor="middle">request 1</text>
  <rect class="dg-off" x="510" y="240" width="118" height="28" rx="6"/>
  <text class="dg-faint" x="569" y="254" dy="0.35em" text-anchor="middle">request 2</text>
  <rect class="dg-off" x="382" y="276" width="118" height="28" rx="6"/>
  <text class="dg-faint" x="441" y="290" dy="0.35em" text-anchor="middle">request 3</text>
  <rect class="dg-off" x="510" y="276" width="118" height="28" rx="6"/>
  <text class="dg-faint" x="569" y="290" dy="0.35em" text-anchor="middle">request 4</text>
  <rect class="dg-off" x="382" y="312" width="118" height="28" rx="6"/>
  <text class="dg-faint" x="441" y="326" dy="0.35em" text-anchor="middle">request 5</text>
  <rect class="dg-off" x="510" y="312" width="118" height="28" rx="6"/>
  <text class="dg-faint" x="569" y="326" dy="0.35em" text-anchor="middle">request 6</text>
  <text class="dg-note" x="382" y="366" dy="0.35em">a few KB each, so thousands fit</text>
</svg>
