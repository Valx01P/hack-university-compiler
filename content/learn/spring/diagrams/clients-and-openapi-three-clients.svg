<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>Three HTTP clients, curl, Postman, and code, send the same request to Roombook</title>
  <desc>On the left are three clients: curl in a terminal, Postman with saved requests, and your own code, a script or a service. Each sends its request along a line that joins the others, so one HTTP request, with the same bytes on the wire, reaches the Roombook API on the right.</desc>

  <!-- The three clients. -->
  <rect class="dg-box" x="20" y="20" width="200" height="56" rx="8"/>
  <text x="120" y="39" dy="0.35em" text-anchor="middle">curl
    <tspan class="dg-note" x="120" dy="1.4em">in a terminal</tspan>
  </text>
  <rect class="dg-box" x="20" y="112" width="200" height="56" rx="8"/>
  <text x="120" y="131" dy="0.35em" text-anchor="middle">Postman
    <tspan class="dg-note" x="120" dy="1.4em">saved requests</tspan>
  </text>
  <rect class="dg-box" x="20" y="204" width="200" height="56" rx="8"/>
  <text x="120" y="223" dy="0.35em" text-anchor="middle">Your code
    <tspan class="dg-note" x="120" dy="1.4em">a script or a service</tspan>
  </text>

  <!-- Their requests join into one. -->
  <path class="dg-line" d="M220 48 H280 V140"/>
  <path class="dg-line" d="M220 232 H280 V140"/>
  <path class="dg-line" d="M220 140 H280"/>
  <path class="dg-flow" d="M280 140 H456" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="368" y="118" dy="0.35em" text-anchor="middle">POST /v1/bookings</text>
  <text class="dg-note" x="368" y="162" dy="0.35em" text-anchor="middle">same bytes on the wire</text>

  <!-- The API. -->
  <rect class="dg-hot" x="460" y="104" width="200" height="72" rx="8"/>
  <text class="dg-on-hot" x="560" y="130" dy="0.35em" text-anchor="middle">Roombook API
    <tspan x="560" dy="1.4em">reads one request</tspan>
  </text>
</svg>
