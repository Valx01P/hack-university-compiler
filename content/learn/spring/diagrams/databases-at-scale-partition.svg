<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A network partition: the link between two data centers is down, and side B must choose</title>
  <desc>Data center A holds the primary copy, with a booking made a second ago. Data center B holds a replica that's a second behind. The link between them is down. A client in B asks for Ada's bookings. Choosing consistency, B refuses or waits. Choosing availability, B answers from its own copy, which may be stale.</desc>

  <rect class="dg-frame" x="20" y="20" width="280" height="150" rx="12"/>
  <text class="dg-heading" x="40" y="46" dy="0.35em">Data center A</text>
  <rect class="dg-strong" x="50" y="80" width="220" height="56" rx="8"/>
  <text x="160" y="99" dy="0.35em" text-anchor="middle">primary copy
    <tspan class="dg-note" x="160" dy="1.4em">has the newest booking</tspan>
  </text>

  <rect class="dg-frame" x="380" y="20" width="280" height="150" rx="12"/>
  <text class="dg-heading" x="400" y="46" dy="0.35em">Data center B</text>
  <rect class="dg-box" x="410" y="80" width="220" height="56" rx="8"/>
  <text x="520" y="99" dy="0.35em" text-anchor="middle">replica copy
    <tspan class="dg-note" x="520" dy="1.4em">a second behind</tspan>
  </text>

  <path class="dg-line dg-dashed" d="M270 108 H410"/>
  <text class="dg-faint" x="340" y="92" dy="0.35em" text-anchor="middle">link down</text>

  <rect class="dg-box" x="420" y="196" width="200" height="44" rx="8"/>
  <text x="520" y="218" dy="0.35em" text-anchor="middle">Client asks in B</text>
  <path class="dg-line" d="M520 196 V140" marker-end="url(#arrow)"/>

  <rect class="dg-strong" x="370" y="272" width="140" height="56" rx="8"/>
  <text x="440" y="291" dy="0.35em" text-anchor="middle">Consistency
    <tspan class="dg-note" x="440" dy="1.4em">refuse or wait</tspan>
  </text>
  <rect class="dg-hot" x="520" y="272" width="140" height="56" rx="8"/>
  <text class="dg-on-hot" x="590" y="291" dy="0.35em" text-anchor="middle">Availability
    <tspan x="590" dy="1.4em">answer, maybe stale</tspan>
  </text>
  <path class="dg-line" d="M460 240 V268" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M580 240 V268" marker-end="url(#arrow)"/>
  <text class="dg-note" x="200" y="300" dy="0.35em" text-anchor="middle">B can only do one of these</text>
</svg>
