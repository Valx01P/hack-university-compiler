<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>MVC redrawn for a JSON API: controller, model, and view around one request</title>
  <desc>Step 1: a client's request reaches the controller, the handler that speaks HTTP. Step 2: the controller calls the model, the domain types and rules. Step 3: it passes the result to the view, which shapes the JSON. Step 4: the JSON goes back to the client as the response.</desc>

  <!-- The client. -->
  <rect class="dg-box" x="20" y="100" width="120" height="120" rx="8"/>
  <text x="80" y="160" dy="0.35em" text-anchor="middle">Client</text>

  <!-- The controller, at the center. -->
  <rect class="dg-hot" x="250" y="120" width="160" height="80" rx="8"/>
  <text class="dg-on-hot" x="330" y="150" dy="0.35em" text-anchor="middle">Controller
    <tspan x="330" dy="1.4em">the handler</tspan>
  </text>

  <!-- The model and the view. -->
  <rect class="dg-strong" x="490" y="20" width="170" height="80" rx="8"/>
  <text x="575" y="50" dy="0.35em" text-anchor="middle">Model
    <tspan class="dg-note" x="575" dy="1.4em">domain types, rules</tspan>
  </text>
  <rect class="dg-strong" x="490" y="220" width="170" height="80" rx="8"/>
  <text x="575" y="250" dy="0.35em" text-anchor="middle">View
    <tspan class="dg-note" x="575" dy="1.4em">the JSON shape</tspan>
  </text>

  <!-- 1: the request comes in. -->
  <path class="dg-flow" d="M140 140 H246" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="166" cy="122" r="10"/>
  <text class="dg-on-badge" x="166" y="122" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="210" y="122" dy="0.35em" text-anchor="middle">request</text>

  <!-- 2: the controller calls the model. -->
  <path class="dg-flow" d="M370 120 V60 H486" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="430" cy="42" r="10"/>
  <text class="dg-on-badge" x="430" y="42" dy="0.35em" text-anchor="middle">2</text>

  <!-- 3: the result goes to the view. -->
  <path class="dg-flow" d="M370 200 V260 H486" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="430" cy="242" r="10"/>
  <text class="dg-on-badge" x="430" y="242" dy="0.35em" text-anchor="middle">3</text>

  <!-- 4: the JSON goes back. -->
  <path class="dg-line dg-dashed" d="M490 284 H80 V224" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="166" cy="266" r="10"/>
  <text class="dg-on-badge" x="166" y="266" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="240" y="266" dy="0.35em" text-anchor="middle">JSON response</text>
</svg>
