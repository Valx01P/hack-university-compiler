<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>page.route catches the browser's requests, never the server's fetches</title>
  <desc>Your Playwright test drives the browser and sees every request the browser sends, so page.route can answer the request for the product page. That request reaches the Next.js server, which fetches the cart from the API itself, server to server. That fetch never passes through the browser, so page.route never sees it. To control it, point API_URL at a mock API the test run starts.</desc>

  <!-- What Playwright can reach -->
  <rect class="dg-frame" x="20" y="20" width="320" height="216" rx="12"/>
  <text class="dg-note" x="324" y="40" dy="0.35em" text-anchor="end">page.route reaches here</text>

  <rect class="dg-strong" x="40" y="56" width="200" height="56" rx="8"/>
  <text x="140" y="74" dy="0.35em" text-anchor="middle">Your test
    <tspan class="dg-code" x="140" dy="1.4em">page.route()</tspan>
  </text>
  <path class="dg-line" d="M140 112 H140 V156" marker-end="url(#arrow)"/>
  <text class="dg-note" x="152" y="134" dy="0.35em">sees its requests</text>

  <rect class="dg-box" x="40" y="160" width="200" height="56" rx="8"/>
  <text x="140" y="178" dy="0.35em" text-anchor="middle">Browser
    <tspan class="dg-note" x="140" dy="1.4em">every request it sends</tspan>
  </text>

  <!-- The page request, then the server's own fetch -->
  <path class="dg-flow" d="M140 216 V276" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="152" y="256" dy="0.35em">GET /products/…</text>

  <rect class="dg-box" x="40" y="280" width="200" height="56" rx="8"/>
  <text x="140" y="298" dy="0.35em" text-anchor="middle">Next.js server
    <tspan class="dg-note" x="140" dy="1.4em">renders the page</tspan>
  </text>

  <path class="dg-flow" d="M240 308 H436" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="338" y="292" dy="0.35em" text-anchor="middle">GET /v1/cart</text>
  <text class="dg-note" x="338" y="324" dy="0.35em" text-anchor="middle">page.route never sees this</text>

  <rect class="dg-hot" x="440" y="280" width="220" height="56" rx="8"/>
  <text class="dg-on-hot" x="550" y="298" dy="0.35em" text-anchor="middle">Mock API
    <tspan x="550" dy="1.4em">started by the test run</tspan>
  </text>
  <text class="dg-code" x="550" y="256" dy="0.35em" text-anchor="middle">API_URL points here</text>
</svg>
