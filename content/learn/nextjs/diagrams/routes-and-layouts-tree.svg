<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>Files in the app folder mapped to the URLs they serve</title>
  <desc>Each page.tsx file serves one URL, built from its folders. app/page.tsx serves the root, app/(marketing)/about/page.tsx serves /about because a group in parentheses is left out, app/products/page.tsx serves /products, app/products/[slug]/page.tsx serves any product such as /products/ridge-2p-tent, and app/help/[[...topic]]/page.tsx serves /help and any path under it. A private folder like _components and a layout file serve no URL.</desc>

  <text class="dg-heading" x="20" y="24" dy="0.35em">File</text>
  <text class="dg-heading" x="400" y="24" dy="0.35em">URL it serves</text>

  <text class="dg-code" x="20" y="68" dy="0.35em">app/page.tsx</text>
  <path class="dg-line" d="M300 68 H396" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="400" y="48" width="260" height="40" rx="8"/>
  <text class="dg-code" x="416" y="68" dy="0.35em">/</text>

  <text class="dg-code" x="20" y="116" dy="0.35em">app/(marketing)/about/page.tsx</text>
  <path class="dg-line" d="M300 116 H396" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="400" y="96" width="260" height="40" rx="8"/>
  <text class="dg-code" x="416" y="116" dy="0.35em">/about</text>

  <text class="dg-code" x="20" y="164" dy="0.35em">app/products/page.tsx</text>
  <path class="dg-line" d="M300 164 H396" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="400" y="144" width="260" height="40" rx="8"/>
  <text class="dg-code" x="416" y="164" dy="0.35em">/products</text>

  <text class="dg-code" x="20" y="212" dy="0.35em">app/products/[slug]/page.tsx</text>
  <path class="dg-flow" d="M300 212 H396" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="400" y="192" width="260" height="40" rx="8"/>
  <text class="dg-code dg-on-hot" x="416" y="212" dy="0.35em">/products/ridge-2p-tent</text>

  <text class="dg-code" x="20" y="260" dy="0.35em">app/help/[[...topic]]/page.tsx</text>
  <path class="dg-line" d="M300 260 H396" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="400" y="240" width="260" height="40" rx="8"/>
  <text class="dg-code" x="416" y="260" dy="0.35em">/help, /help/shipping/fees</text>

  <text class="dg-code" x="20" y="308" dy="0.35em">app/products/_components/</text>
  <rect class="dg-off" x="400" y="288" width="260" height="40" rx="8"/>
  <text class="dg-faint" x="416" y="308" dy="0.35em">no URL: a private folder</text>

  <text class="dg-code" x="20" y="356" dy="0.35em">app/products/layout.tsx</text>
  <rect class="dg-off" x="400" y="336" width="260" height="40" rx="8"/>
  <text class="dg-faint" x="416" y="356" dy="0.35em">no URL: wraps the pages below</text>
</svg>
