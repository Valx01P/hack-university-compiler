<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>A secret key travels only on the last hop, from your server to the API</title>
  <desc>The browser asks your Next.js server for the shipping page, with no key. On the server, the rates client in lib/rates.ts reads the secret key from the environment and calls the third-party shipping rates API with an Authorization header. The API answers with rates as JSON, and your server sends the browser HTML that holds the rates and never the key.</desc>

  <!-- The browser -->
  <rect class="dg-strong" x="200" y="20" width="280" height="56" rx="8"/>
  <text x="340" y="38" dy="0.35em" text-anchor="middle">Browser
    <tspan class="dg-note" x="340" dy="1.4em">never sees the key</tspan>
  </text>

  <!-- Your server -->
  <rect class="dg-frame" x="60" y="124" width="560" height="152" rx="12"/>
  <text class="dg-note" x="80" y="146" dy="0.35em">Your Next.js server</text>
  <rect class="dg-hot" x="200" y="164" width="280" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="182" dy="0.35em" text-anchor="middle">Rates client
    <tspan x="340" dy="1.4em">lib/rates.ts reads the key</tspan>
  </text>

  <!-- The third-party API -->
  <rect class="dg-box" x="200" y="320" width="280" height="56" rx="8"/>
  <text x="340" y="338" dy="0.35em" text-anchor="middle">Shipping rates API
    <tspan class="dg-note" x="340" dy="1.4em">a third party, paid per call</tspan>
  </text>

  <!-- Requests go down -->
  <path class="dg-flow" d="M400 76 V160" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="416" y="100" dy="0.35em">GET /shipping?to=94110</text>
  <path class="dg-flow" d="M400 220 V316" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="416" y="246" dy="0.35em">Authorization: Bearer rk_…</text>

  <!-- Answers come back up -->
  <path class="dg-line dg-dashed" d="M260 320 V224" marker-end="url(#arrow)"/>
  <text class="dg-note" x="244" y="246" dy="0.35em" text-anchor="end">rates as JSON</text>
  <path class="dg-line dg-dashed" d="M260 164 V80" marker-end="url(#arrow)"/>
  <text class="dg-note" x="244" y="100" dy="0.35em" text-anchor="end">HTML with the rates</text>
</svg>
