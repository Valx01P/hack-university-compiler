<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Two requests one after another, then the same two side by side</title>
  <desc>One after another, getProduct takes about 200 milliseconds and only then does getReviews start, taking about 900 more, so the page waits about 1,150 milliseconds. Side by side, both start at once, and the page waits only for the slower one, about 940 milliseconds.</desc>

  <!-- One after another. -->
  <text class="dg-heading" x="20" y="28" dy="0.35em">One after another</text>
  <text class="dg-code" x="20" y="68" dy="0.35em">getProduct</text>
  <rect class="dg-box" x="140" y="56" width="90" height="24" rx="4"/>
  <text class="dg-code" x="20" y="104" dy="0.35em">getReviews</text>
  <rect class="dg-box" x="230" y="92" width="398" height="24" rx="4"/>
  <path class="dg-line dg-dashed" d="M230 80 V92"/>
  <path class="dg-line" d="M140 132 H646" marker-end="url(#arrow)"/>
  <text class="dg-note" x="140" y="148" dy="0.35em">page waits 1,149 ms</text>

  <!-- Side by side. -->
  <text class="dg-heading" x="20" y="188" dy="0.35em">Side by side</text>
  <text class="dg-code" x="20" y="228" dy="0.35em">getProduct</text>
  <rect class="dg-hot" x="140" y="216" width="90" height="24" rx="4"/>
  <text class="dg-code" x="20" y="264" dy="0.35em">getReviews</text>
  <rect class="dg-hot" x="140" y="252" width="398" height="24" rx="4"/>
  <path class="dg-flow" d="M140 292 H554" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="140" y="308" dy="0.35em">page waits 943 ms, the slower request</text>

  <!-- Scale. -->
  <text class="dg-note" x="140" y="328" dy="0.35em" text-anchor="middle">0</text>
  <text class="dg-note" x="360" y="328" dy="0.35em" text-anchor="middle">500 ms</text>
  <text class="dg-note" x="580" y="328" dy="0.35em" text-anchor="middle">1,000 ms</text>
</svg>
