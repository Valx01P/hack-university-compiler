<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500">
  <title>A fresh Next.js project's files, each labeled with its job</title>
  <desc>The trailhead folder that create-next-app makes. The app folder holds the routes: layout.tsx wraps every page, page.tsx is the page at the root address, globals.css holds Tailwind and the global styles, and favicon.ico is the tab's icon. The public folder is served as is. Then come next.config.ts for Next.js settings, tsconfig.json for TypeScript and the @/ alias, eslint.config.mjs for lint rules, next-env.d.ts with generated types, package.json, and AGENTS.md. The .next and node_modules folders are generated, and git ignores them.</desc>

  <text class="dg-heading" x="20" y="32" dy="0.35em">trailhead/</text>

  <!-- The app folder, the part that matters most. -->
  <rect class="dg-hot" x="20" y="52" width="640" height="40" rx="8"/>
  <text class="dg-code dg-on-hot" x="40" y="72" dy="0.35em">app/</text>
  <text class="dg-on-hot" x="280" y="72" dy="0.35em">routes: your pages and layouts</text>
  <path class="dg-line" d="M48 92 V196"/>
  <path class="dg-line" d="M48 112 H64"/>
  <text class="dg-code" x="72" y="112" dy="0.35em">layout.tsx</text>
  <text class="dg-note" x="280" y="112" dy="0.35em">wraps every page: html and body</text>
  <path class="dg-line" d="M48 140 H64"/>
  <text class="dg-code" x="72" y="140" dy="0.35em">page.tsx</text>
  <text class="dg-note" x="280" y="140" dy="0.35em">the page at /</text>
  <path class="dg-line" d="M48 168 H64"/>
  <text class="dg-code" x="72" y="168" dy="0.35em">globals.css</text>
  <text class="dg-note" x="280" y="168" dy="0.35em">Tailwind and global styles</text>
  <path class="dg-line" d="M48 196 H64"/>
  <text class="dg-code" x="72" y="196" dy="0.35em">favicon.ico</text>
  <text class="dg-note" x="280" y="196" dy="0.35em">the icon in the browser tab</text>

  <!-- The rest of the project. -->
  <text class="dg-code" x="40" y="236" dy="0.35em">public/</text>
  <text class="dg-note" x="280" y="236" dy="0.35em">files served as is: /next.svg</text>
  <text class="dg-code" x="40" y="264" dy="0.35em">next.config.ts</text>
  <text class="dg-note" x="280" y="264" dy="0.35em">Next.js settings</text>
  <text class="dg-code" x="40" y="292" dy="0.35em">tsconfig.json</text>
  <text class="dg-note" x="280" y="292" dy="0.35em">TypeScript, and the @/ alias</text>
  <text class="dg-code" x="40" y="320" dy="0.35em">eslint.config.mjs</text>
  <text class="dg-note" x="280" y="320" dy="0.35em">lint rules for React and Next.js</text>
  <text class="dg-code" x="40" y="348" dy="0.35em">next-env.d.ts</text>
  <text class="dg-note" x="280" y="348" dy="0.35em">generated types, never edited</text>
  <text class="dg-code" x="40" y="376" dy="0.35em">package.json</text>
  <text class="dg-note" x="280" y="376" dy="0.35em">scripts and dependencies</text>
  <text class="dg-code" x="40" y="404" dy="0.35em">AGENTS.md</text>
  <text class="dg-note" x="280" y="404" dy="0.35em">points AI tools at the bundled docs</text>

  <!-- Generated folders. -->
  <text class="dg-code dg-faint" x="40" y="440" dy="0.35em">.next/</text>
  <text class="dg-faint" x="280" y="440" dy="0.35em">builds and the dev cache, not in git</text>
  <text class="dg-code dg-faint" x="40" y="468" dy="0.35em">node_modules/</text>
  <text class="dg-faint" x="280" y="468" dy="0.35em">installed packages, not in git</text>
</svg>
