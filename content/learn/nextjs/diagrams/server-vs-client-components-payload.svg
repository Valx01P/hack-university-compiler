<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>A Server Component rendered into a payload that points at a client chunk</title>
  <desc>On the server, ProductPage runs, along with getProduct and formatPrice, and none of that code is sent. Its output becomes the RSC payload: rows of plain elements, like the article and its heading, and a reference row that names the QuantityPicker client component and the chunk files that hold it. In the browser, React draws the plain elements as they are, and for the reference it loads the chunk and runs QuantityPicker with its props.</desc>

  <!-- 1. The server. -->
  <circle class="dg-badge" cx="30" cy="48" r="10"/>
  <text class="dg-on-badge" x="30" y="48" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-box" x="52" y="20" width="300" height="56" rx="8"/>
  <text x="68" y="38" dy="0.35em">ProductPage runs on the server
    <tspan class="dg-note" x="68" dy="1.4em">with getProduct and formatPrice</tspan>
  </text>
  <text class="dg-note" x="376" y="48" dy="0.35em">none of this code is sent</text>
  <path class="dg-flow" d="M202 76 V112" marker-end="url(#arrow-flow)"/>

  <!-- 2. The payload. -->
  <circle class="dg-badge" cx="30" cy="144" r="10"/>
  <text class="dg-on-badge" x="30" y="144" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-strong" x="52" y="116" width="608" height="152" rx="8"/>
  <text class="dg-heading" x="68" y="140" dy="0.35em">RSC payload</text>
  <text class="dg-code" x="68" y="172" dy="0.35em">6:["$","article",null,{"children":[</text>
  <text class="dg-code" x="88" y="194" dy="0.35em">["$","h1",null,{…,"children":"Ember Stove"}], …</text>
  <text class="dg-code" x="88" y="216" dy="0.35em">["$","$L1a",null,{"max":10}]]}]</text>
  <text class="dg-code" x="68" y="244" dy="0.35em">1a:I[24757,["$7","$18","$19"],"QuantityPicker"]</text>

  <!-- 3. The browser. -->
  <path class="dg-flow" d="M170 268 V320" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M500 268 V320" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="30" cy="352" r="10"/>
  <text class="dg-on-badge" x="30" y="352" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="52" y="324" width="260" height="56" rx="8"/>
  <text x="182" y="342" dy="0.35em" text-anchor="middle">article, h1, p
    <tspan class="dg-note" x="182" dy="1.4em">drawn as they are</tspan>
  </text>
  <rect class="dg-hot" x="340" y="324" width="320" height="56" rx="8"/>
  <text class="dg-on-hot" x="500" y="342" dy="0.35em" text-anchor="middle">QuantityPicker
    <tspan x="500" dy="1.4em">its chunk loads, then it runs</tspan>
  </text>
</svg>
