<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>A request's path through Next.js: config, then proxy, then routing</title>
  <desc>A request arrives from the browser. Step 1 applies the headers and redirects from next.config.ts. Step 2 runs proxy.ts, which can let the request through, change its headers or the path it goes to, or answer early with a redirect or its own response, like a 401. Step 3 is routing: files in public, then the routes in app. Step 4 is the page or Route Handler that matched, which renders or answers.</desc>

  <rect class="dg-strong" x="140" y="20" width="300" height="44" rx="8"/>
  <text x="290" y="42" dy="0.35em" text-anchor="middle">A request arrives</text>
  <path class="dg-flow" d="M290 64 V96" marker-end="url(#arrow-flow)"/>

  <!-- Step 1 -->
  <rect class="dg-box" x="140" y="100" width="300" height="56" rx="8"/>
  <text class="dg-code" x="290" y="118" dy="0.35em" text-anchor="middle">next.config.ts</text>
  <text class="dg-note" x="290" y="138" dy="0.35em" text-anchor="middle">headers, then redirects</text>
  <path class="dg-flow" d="M290 156 V188" marker-end="url(#arrow-flow)"/>

  <!-- Step 2 -->
  <rect class="dg-hot" x="140" y="192" width="300" height="56" rx="8"/>
  <text class="dg-on-hot dg-code" x="290" y="210" dy="0.35em" text-anchor="middle">proxy.ts</text>
  <text class="dg-on-hot" x="290" y="230" dy="0.35em" text-anchor="middle">runs for every matched path</text>
  <path class="dg-flow" d="M290 248 V280" marker-end="url(#arrow-flow)"/>

  <!-- The early answer -->
  <path class="dg-line" d="M440 220 H496" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="500" y="192" width="160" height="56" rx="8"/>
  <text x="580" y="210" dy="0.35em" text-anchor="middle">Early answer
    <tspan class="dg-note" x="580" dy="1.4em">redirect or 401</tspan>
  </text>

  <!-- Step 3 -->
  <rect class="dg-box" x="140" y="284" width="300" height="56" rx="8"/>
  <text x="290" y="302" dy="0.35em" text-anchor="middle">Routing
    <tspan class="dg-note" x="290" dy="1.4em">public files, then app routes</tspan>
  </text>
  <path class="dg-flow" d="M290 340 V372" marker-end="url(#arrow-flow)"/>

  <!-- Step 4 -->
  <rect class="dg-strong" x="140" y="376" width="300" height="40" rx="8"/>
  <text x="290" y="396" dy="0.35em" text-anchor="middle">The page or Route Handler</text>

  <!-- Step numbers -->
  <circle class="dg-badge" cx="140" cy="100" r="10"/>
  <text class="dg-on-badge" x="140" y="100" dy="0.35em" text-anchor="middle">1</text>
  <circle class="dg-badge" cx="140" cy="192" r="10"/>
  <text class="dg-on-badge" x="140" y="192" dy="0.35em" text-anchor="middle">2</text>
  <circle class="dg-badge" cx="140" cy="284" r="10"/>
  <text class="dg-on-badge" x="140" y="284" dy="0.35em" text-anchor="middle">3</text>
  <circle class="dg-badge" cx="140" cy="376" r="10"/>
  <text class="dg-on-badge" x="140" y="376" dy="0.35em" text-anchor="middle">4</text>
</svg>
