<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A Server Action call: one POST out, the result and the new page back</title>
  <desc>You press Post in the review form. The browser sends a POST to the page's own URL, with a Next-Action header naming the action and the form fields in its body. On the Next.js server, createReview runs: it checks the input, saves the review, and calls updateTag. The page renders again with the fresh reviews, and one response of type text/x-component carries the action's return value and the new RSC payload back. React updates the page without a reload.</desc>

  <!-- The browser -->
  <rect class="dg-frame" x="20" y="20" width="180" height="300" rx="12"/>
  <text class="dg-note" x="110" y="42" dy="0.35em" text-anchor="middle">Browser</text>
  <rect class="dg-strong" x="36" y="64" width="148" height="56" rx="8"/>
  <text x="110" y="82" dy="0.35em" text-anchor="middle">Review form
    <tspan class="dg-note" x="110" dy="1.4em">you press Post</tspan>
  </text>
  <rect class="dg-strong" x="36" y="240" width="148" height="56" rx="8"/>
  <text x="110" y="258" dy="0.35em" text-anchor="middle">Page updates
    <tspan class="dg-note" x="110" dy="1.4em">no reload</tspan>
  </text>

  <!-- The Next.js server -->
  <rect class="dg-frame" x="380" y="20" width="280" height="300" rx="12"/>
  <text class="dg-note" x="520" y="42" dy="0.35em" text-anchor="middle">Next.js server</text>
  <rect class="dg-hot" x="400" y="64" width="240" height="56" rx="8"/>
  <text class="dg-on-hot" x="520" y="82" dy="0.35em" text-anchor="middle">createReview runs
    <tspan x="520" dy="1.4em">checks, saves, updateTag</tspan>
  </text>
  <rect class="dg-box" x="400" y="160" width="240" height="56" rx="8"/>
  <text x="520" y="178" dy="0.35em" text-anchor="middle">The page renders again
    <tspan class="dg-note" x="520" dy="1.4em">with the fresh reviews</tspan>
  </text>
  <path class="dg-flow" d="M520 120 V156" marker-end="url(#arrow-flow)"/>

  <!-- The request -->
  <text class="dg-code" x="290" y="78" dy="0.35em" text-anchor="middle">Next-Action: 701bee…</text>
  <path class="dg-flow" d="M184 92 H396" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="290" y="108" dy="0.35em" text-anchor="middle">POST, with the form fields</text>

  <!-- The response -->
  <path class="dg-line dg-dashed" d="M520 216 V268 H188" marker-end="url(#arrow)"/>
  <text class="dg-code" x="290" y="254" dy="0.35em" text-anchor="middle">text/x-component</text>
  <text class="dg-note" x="290" y="284" dy="0.35em" text-anchor="middle">return value + new payload</text>

  <!-- Step numbers -->
  <circle class="dg-badge" cx="36" cy="64" r="10"/>
  <text class="dg-on-badge" x="36" y="64" dy="0.35em" text-anchor="middle">1</text>
  <circle class="dg-badge" cx="400" cy="64" r="10"/>
  <text class="dg-on-badge" x="400" y="64" dy="0.35em" text-anchor="middle">2</text>
  <circle class="dg-badge" cx="400" cy="160" r="10"/>
  <text class="dg-on-badge" x="400" y="160" dy="0.35em" text-anchor="middle">3</text>
  <circle class="dg-badge" cx="36" cy="240" r="10"/>
  <text class="dg-on-badge" x="36" y="240" dy="0.35em" text-anchor="middle">4</text>
</svg>
