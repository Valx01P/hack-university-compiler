<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500">
  <title>The course's path, from React to a tested Next.js app</title>
  <desc>The course follows the Web and React courses and goes in five stops. One, from React to Next.js: a project, routes and layouts, and server and client components. Two, data and rendering: fetching on the server, caching, and rendering modes. Three, mutations and the server: Server Actions, Route Handlers, proxy, and auth. Four, shipping: metadata, images, fonts, then building and deploying. Five, testing with Vitest, MSW, and Playwright. At the end you can build, ship, and test a full-stack app.</desc>

  <!-- Before the course. -->
  <rect class="dg-off" x="72" y="20" width="460" height="40" rx="8"/>
  <text class="dg-faint" x="92" y="40" dy="0.35em">Before: the Web course, then the React course</text>
  <path class="dg-line dg-dashed" d="M72 40 H40 V82" marker-end="url(#arrow)"/>

  <!-- 1. From React to Next.js. -->
  <circle class="dg-badge" cx="40" cy="96" r="10"/>
  <text class="dg-on-badge" x="40" y="96" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-hot" x="72" y="70" width="460" height="52" rx="8"/>
  <text class="dg-on-hot" x="92" y="87" dy="0.35em">From React to Next.js
    <tspan x="92" dy="1.4em">a project, routes, server and client components</tspan>
  </text>
  <path class="dg-flow" d="M40 106 V154" marker-end="url(#arrow-flow)"/>

  <!-- 2. Data and rendering. -->
  <circle class="dg-badge" cx="40" cy="168" r="10"/>
  <text class="dg-on-badge" x="40" y="168" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="72" y="142" width="460" height="52" rx="8"/>
  <text x="92" y="159" dy="0.35em">Data and rendering
    <tspan class="dg-note" x="92" dy="1.4em">fetching on the server, caching, rendering modes</tspan>
  </text>
  <path class="dg-flow" d="M40 178 V226" marker-end="url(#arrow-flow)"/>

  <!-- 3. Mutations and the server. -->
  <circle class="dg-badge" cx="40" cy="240" r="10"/>
  <text class="dg-on-badge" x="40" y="240" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="72" y="214" width="460" height="52" rx="8"/>
  <text x="92" y="231" dy="0.35em">Mutations and the server
    <tspan class="dg-note" x="92" dy="1.4em">Server Actions, Route Handlers, proxy, and auth</tspan>
  </text>
  <path class="dg-flow" d="M40 250 V298" marker-end="url(#arrow-flow)"/>

  <!-- 4. Shipping. -->
  <circle class="dg-badge" cx="40" cy="312" r="10"/>
  <text class="dg-on-badge" x="40" y="312" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-box" x="72" y="286" width="460" height="52" rx="8"/>
  <text x="92" y="303" dy="0.35em">Shipping
    <tspan class="dg-note" x="92" dy="1.4em">metadata, images, fonts, then build and deploy</tspan>
  </text>
  <path class="dg-flow" d="M40 322 V370" marker-end="url(#arrow-flow)"/>

  <!-- 5. Testing. -->
  <circle class="dg-badge" cx="40" cy="384" r="10"/>
  <text class="dg-on-badge" x="40" y="384" dy="0.35em" text-anchor="middle">5</text>
  <rect class="dg-box" x="72" y="358" width="460" height="52" rx="8"/>
  <text x="92" y="375" dy="0.35em">Testing
    <tspan class="dg-note" x="92" dy="1.4em">Vitest, MSW, and Playwright against a real build</tspan>
  </text>

  <!-- After the course. -->
  <path class="dg-line dg-dashed" d="M40 394 V460 H68" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="72" y="440" width="460" height="40" rx="8"/>
  <text class="dg-faint" x="92" y="460" dy="0.35em">After: a full-stack app you can build, test, and ship</text>
</svg>
