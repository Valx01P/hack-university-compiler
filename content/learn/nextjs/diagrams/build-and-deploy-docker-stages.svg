<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A multi-stage Docker build: deps, then build, then a small runtime image</title>
  <desc>Three stages, left to right. Stage 1, deps, starts from node:24-alpine and runs npm ci to get node_modules with every package. Stage 2, build, copies those modules and the source, then runs npm run build, which writes .next/standalone and .next/static. Stage 3, runtime, starts again from a clean node:24-alpine, copies in only the standalone server, the static files, and public, switches to the node user, and runs node server.js. Only the last stage becomes the image you ship. The first two are thrown away.</desc>

  <!-- Stage 1: deps -->
  <rect class="dg-frame" x="20" y="20" width="200" height="240" rx="12"/>
  <circle class="dg-badge" cx="40" cy="44" r="10"/>
  <text class="dg-on-badge" x="40" y="44" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-heading" x="58" y="44" dy="0.35em">deps</text>
  <rect class="dg-box" x="36" y="68" width="168" height="40" rx="8"/>
  <text class="dg-code" x="120" y="88" dy="0.35em" text-anchor="middle">node:24-alpine</text>
  <path class="dg-line" d="M120 108 V120" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="36" y="124" width="168" height="40" rx="8"/>
  <text class="dg-code" x="120" y="144" dy="0.35em" text-anchor="middle">npm ci</text>
  <path class="dg-line" d="M120 164 V176" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="36" y="180" width="168" height="56" rx="8"/>
  <text class="dg-code" x="120" y="198" dy="0.35em" text-anchor="middle">node_modules
    <tspan class="dg-note" x="120" dy="1.4em">every package</tspan>
  </text>

  <!-- Stage 2: build -->
  <rect class="dg-frame" x="240" y="20" width="200" height="240" rx="12"/>
  <circle class="dg-badge" cx="260" cy="44" r="10"/>
  <text class="dg-on-badge" x="260" y="44" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-heading" x="278" y="44" dy="0.35em">build</text>
  <rect class="dg-box" x="256" y="68" width="168" height="40" rx="8"/>
  <text class="dg-code" x="340" y="88" dy="0.35em" text-anchor="middle">COPY . .</text>
  <path class="dg-line" d="M340 108 V120" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="256" y="124" width="168" height="40" rx="8"/>
  <text class="dg-code" x="340" y="144" dy="0.35em" text-anchor="middle">npm run build</text>
  <path class="dg-line" d="M340 164 V176" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="256" y="180" width="168" height="56" rx="8"/>
  <text class="dg-code" x="340" y="198" dy="0.35em" text-anchor="middle">.next/standalone
    <tspan class="dg-note" x="340" dy="1.4em">and .next/static</tspan>
  </text>

  <!-- Stage 3: runtime -->
  <rect class="dg-frame" x="460" y="20" width="200" height="240" rx="12"/>
  <circle class="dg-badge" cx="480" cy="44" r="10"/>
  <text class="dg-on-badge" x="480" y="44" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-heading" x="498" y="44" dy="0.35em">runtime</text>
  <rect class="dg-box" x="476" y="68" width="168" height="40" rx="8"/>
  <text class="dg-code" x="560" y="88" dy="0.35em" text-anchor="middle">node:24-alpine</text>
  <path class="dg-line" d="M560 108 V120" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="476" y="124" width="168" height="40" rx="8"/>
  <text class="dg-code" x="560" y="144" dy="0.35em" text-anchor="middle">USER node</text>
  <path class="dg-line" d="M560 164 V176" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="476" y="180" width="168" height="56" rx="8"/>
  <text class="dg-on-hot dg-code" x="560" y="198" dy="0.35em" text-anchor="middle">node server.js
    <tspan x="560" dy="1.4em">app files: 42 MB</tspan>
  </text>

  <!-- What moves between stages -->
  <path class="dg-flow" d="M204 208 H230 V144 H252" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M424 208 H472" marker-end="url(#arrow-flow)"/>

  <!-- What survives -->
  <text class="dg-faint" x="120" y="288" dy="0.35em" text-anchor="middle">thrown away</text>
  <text class="dg-faint" x="340" y="288" dy="0.35em" text-anchor="middle">thrown away</text>
  <text class="dg-note" x="560" y="288" dy="0.35em" text-anchor="middle">the image you ship</text>
</svg>
