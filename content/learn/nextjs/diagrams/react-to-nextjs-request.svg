<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580">
  <title>A first visit gets HTML, and a later click gets only the RSC payload</title>
  <desc>Step 1, the browser asks the Next.js server for /products. The server matches the route and renders the page's Server Components. Step 2, it answers with HTML that has the RSC payload inside, and the browser shows the HTML at once. Step 3, the browser downloads the JavaScript for the client components. Step 4, React hydrates them, so the page responds to clicks. Later, step 5, a click on a link sends a request for /about with an RSC header. Step 6, the server answers with the RSC payload alone, and React swaps the page while the layout stays.</desc>

  <!-- The two sides. -->
  <rect class="dg-frame" x="20" y="20" width="200" height="540" rx="12"/>
  <text class="dg-heading" x="120" y="44" dy="0.35em" text-anchor="middle">Browser</text>
  <rect class="dg-frame" x="460" y="20" width="200" height="540" rx="12"/>
  <text class="dg-heading" x="560" y="44" dy="0.35em" text-anchor="middle">Next.js server</text>

  <!-- 1. The first request. -->
  <text class="dg-code" x="340" y="80" dy="0.35em" text-anchor="middle">GET /products</text>
  <path class="dg-flow" d="M220 98 H456" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="238" cy="98" r="10"/>
  <text class="dg-on-badge" x="238" y="98" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-hot" x="476" y="72" width="168" height="56" rx="8"/>
  <text class="dg-on-hot" x="560" y="90" dy="0.35em" text-anchor="middle">Render the page
    <tspan x="560" dy="1.4em">Server Components run</tspan>
  </text>

  <!-- 2. HTML comes back. -->
  <text x="340" y="136" dy="0.35em" text-anchor="middle">HTML, payload inside</text>
  <path class="dg-flow dg-dashed" d="M460 154 H224" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="442" cy="154" r="10"/>
  <text class="dg-on-badge" x="442" y="154" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="36" y="168" width="168" height="56" rx="8"/>
  <text x="120" y="186" dy="0.35em" text-anchor="middle">Show the HTML
    <tspan class="dg-note" x="120" dy="1.4em">readable before any JS</tspan>
  </text>

  <!-- 3. The client JavaScript. -->
  <text class="dg-code" x="340" y="236" dy="0.35em" text-anchor="middle">GET /_next/static/…</text>
  <path class="dg-line" d="M220 254 H456" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="238" cy="254" r="10"/>
  <text class="dg-on-badge" x="238" y="254" dy="0.35em" text-anchor="middle">3</text>
  <path class="dg-line dg-dashed" d="M460 278 H224" marker-end="url(#arrow)"/>

  <!-- 4. Hydration. -->
  <circle class="dg-badge" cx="36" cy="320" r="10"/>
  <text class="dg-on-badge" x="36" y="320" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-box" x="52" y="292" width="152" height="56" rx="8"/>
  <text x="128" y="310" dy="0.35em" text-anchor="middle">Hydrate
    <tspan class="dg-note" x="128" dy="1.4em">clicks now work</tspan>
  </text>

  <!-- Later: a soft navigation. -->
  <path class="dg-line dg-dashed" d="M20 380 H660"/>
  <text class="dg-note" x="340" y="396" dy="0.35em" text-anchor="middle">later, you click a link</text>

  <!-- 5. The payload request. -->
  <text class="dg-code" x="340" y="420" dy="0.35em" text-anchor="middle">GET /about?_rsc=…</text>
  <path class="dg-flow" d="M220 438 H456" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="238" cy="438" r="10"/>
  <text class="dg-on-badge" x="238" y="438" dy="0.35em" text-anchor="middle">5</text>
  <rect class="dg-box" x="476" y="418" width="168" height="40" rx="8"/>
  <text x="560" y="438" dy="0.35em" text-anchor="middle">Render /about</text>

  <!-- 6. Only the payload comes back. -->
  <text x="340" y="468" dy="0.35em" text-anchor="middle">RSC payload only</text>
  <path class="dg-flow dg-dashed" d="M460 486 H224" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="442" cy="486" r="10"/>
  <text class="dg-on-badge" x="442" y="486" dy="0.35em" text-anchor="middle">6</text>
  <rect class="dg-hot" x="36" y="492" width="168" height="56" rx="8"/>
  <text class="dg-on-hot" x="120" y="510" dy="0.35em" text-anchor="middle">Swap the page
    <tspan x="120" dy="1.4em">the layout stays</tspan>
  </text>
</svg>
