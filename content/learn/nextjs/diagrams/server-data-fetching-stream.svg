<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A product page arriving in three chunks over one response</title>
  <desc>Step 1, at about 25 milliseconds, the shell arrives: the header and menus, with a loading message where the product goes. Step 2, at about 230 milliseconds, the product arrives: its name, price, and quantity picker, with a gray skeleton where the reviews go. Step 3, at about 930 milliseconds, the reviews arrive and take the skeleton's place. All three come in one HTTP response that stays open until the last one.</desc>

  <!-- 1. The shell. -->
  <circle class="dg-badge" cx="30" cy="30" r="10"/>
  <text class="dg-on-badge" x="30" y="30" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="48" y="30" dy="0.35em">25 ms</text>
  <rect class="dg-frame" x="20" y="52" width="200" height="200" rx="12"/>
  <rect class="dg-box" x="32" y="64" width="176" height="40" rx="8"/>
  <text x="120" y="84" dy="0.35em" text-anchor="middle">Header, menus</text>
  <rect class="dg-off" x="32" y="116" width="176" height="124" rx="8"/>
  <text class="dg-faint" x="120" y="178" dy="0.35em" text-anchor="middle">Loading product…</text>

  <!-- 2. The product. -->
  <circle class="dg-badge" cx="250" cy="30" r="10"/>
  <text class="dg-on-badge" x="250" y="30" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="268" y="30" dy="0.35em">230 ms</text>
  <rect class="dg-frame" x="240" y="52" width="200" height="200" rx="12"/>
  <rect class="dg-box" x="252" y="64" width="176" height="40" rx="8"/>
  <text x="340" y="84" dy="0.35em" text-anchor="middle">Header, menus</text>
  <rect class="dg-hot" x="252" y="116" width="176" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="134" dy="0.35em" text-anchor="middle">Ember Stove
    <tspan x="340" dy="1.4em">$64.00, picker</tspan>
  </text>
  <rect class="dg-off" x="252" y="184" width="176" height="56" rx="8"/>
  <text class="dg-faint" x="340" y="212" dy="0.35em" text-anchor="middle">reviews skeleton</text>

  <!-- 3. The reviews. -->
  <circle class="dg-badge" cx="470" cy="30" r="10"/>
  <text class="dg-on-badge" x="470" y="30" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="488" y="30" dy="0.35em">930 ms</text>
  <rect class="dg-frame" x="460" y="52" width="200" height="200" rx="12"/>
  <rect class="dg-box" x="472" y="64" width="176" height="40" rx="8"/>
  <text x="560" y="84" dy="0.35em" text-anchor="middle">Header, menus</text>
  <rect class="dg-box" x="472" y="116" width="176" height="56" rx="8"/>
  <text x="560" y="134" dy="0.35em" text-anchor="middle">Ember Stove
    <tspan class="dg-note" x="560" dy="1.4em">$64.00, picker</tspan>
  </text>
  <rect class="dg-hot" x="472" y="184" width="176" height="56" rx="8"/>
  <text class="dg-on-hot" x="560" y="212" dy="0.35em" text-anchor="middle">Reviews</text>

  <!-- One response. -->
  <path class="dg-flow" d="M20 276 H656" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="290" dy="0.35em" text-anchor="middle">one response, kept open until the last chunk</text>
</svg>
