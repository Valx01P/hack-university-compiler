<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>How the special files in one folder nest around its page</title>
  <desc>Inside one route folder, Next.js nests the special files from the outside in: layout.tsx, which stays across navigations, then template.tsx, which remounts, then error.tsx, which catches errors below it, then loading.tsx, shown while what's below it loads, then not-found.tsx, shown when notFound is called below it, and in the middle page.tsx, or the next folder's layout when the URL goes deeper.</desc>

  <rect class="dg-box" x="20" y="20" width="640" height="340" rx="8"/>
  <text class="dg-code" x="36" y="42" dy="0.35em">layout.tsx</text>
  <text class="dg-note" x="644" y="42" dy="0.35em" text-anchor="end">stays across navigations</text>

  <rect class="dg-box" x="40" y="64" width="600" height="280" rx="8"/>
  <text class="dg-code" x="56" y="86" dy="0.35em">template.tsx</text>
  <text class="dg-note" x="624" y="86" dy="0.35em" text-anchor="end">remounts on navigation</text>

  <rect class="dg-strong" x="60" y="108" width="560" height="220" rx="8"/>
  <text class="dg-code" x="76" y="130" dy="0.35em">error.tsx</text>
  <text class="dg-note" x="604" y="130" dy="0.35em" text-anchor="end">shown when anything below throws</text>

  <rect class="dg-box" x="80" y="152" width="520" height="160" rx="8"/>
  <text class="dg-code" x="96" y="174" dy="0.35em">loading.tsx</text>
  <text class="dg-note" x="584" y="174" dy="0.35em" text-anchor="end">shown while what's below loads</text>

  <rect class="dg-box" x="100" y="196" width="480" height="100" rx="8"/>
  <text class="dg-code" x="116" y="218" dy="0.35em">not-found.tsx</text>
  <text class="dg-note" x="564" y="218" dy="0.35em" text-anchor="end">shown on notFound() below</text>

  <rect class="dg-hot" x="120" y="240" width="440" height="40" rx="8"/>
  <text class="dg-on-hot" x="340" y="260" dy="0.35em" text-anchor="middle">page.tsx, or the next folder's layout</text>
</svg>
