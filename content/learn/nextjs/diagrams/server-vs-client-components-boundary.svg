<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>A product page's component tree, split into server and client parts</title>
  <desc>The root layout, the site header, and the product page are Server Components. They run on the server and send no JavaScript. Three leaves are Client Components, each in a file marked use client: NavLink and CartBadge under the header, and QuantityPicker under the product page. Only those three, and what they import, are sent to the browser as JavaScript.</desc>

  <!-- Server components. -->
  <rect class="dg-box" x="250" y="20" width="180" height="40" rx="8"/>
  <text x="340" y="40" dy="0.35em" text-anchor="middle">RootLayout</text>
  <path class="dg-line" d="M340 60 V80 H150 V96"/>
  <path class="dg-line" d="M340 80 H530 V96"/>
  <rect class="dg-box" x="60" y="100" width="180" height="40" rx="8"/>
  <text x="150" y="120" dy="0.35em" text-anchor="middle">SiteHeader</text>
  <rect class="dg-box" x="440" y="100" width="180" height="40" rx="8"/>
  <text x="530" y="120" dy="0.35em" text-anchor="middle">ProductPage</text>
  <text class="dg-note" x="340" y="166" dy="0.35em" text-anchor="middle">Server Components: run on the server, send no JS</text>

  <!-- The boundary. -->
  <path class="dg-line" d="M150 140 V200 H90 V236"/>
  <path class="dg-line" d="M150 200 H230 V236"/>
  <path class="dg-line" d="M530 140 V236"/>
  <rect class="dg-frame" x="20" y="188" width="640" height="152" rx="12"/>
  <text class="dg-code" x="644" y="212" dy="0.35em" text-anchor="end">"use client"</text>

  <!-- Client components. -->
  <rect class="dg-hot" x="30" y="240" width="120" height="40" rx="8"/>
  <text class="dg-on-hot" x="90" y="260" dy="0.35em" text-anchor="middle">NavLink</text>
  <rect class="dg-hot" x="170" y="240" width="120" height="40" rx="8"/>
  <text class="dg-on-hot" x="230" y="260" dy="0.35em" text-anchor="middle">CartBadge</text>
  <rect class="dg-hot" x="440" y="240" width="180" height="40" rx="8"/>
  <text class="dg-on-hot" x="530" y="260" dy="0.35em" text-anchor="middle">QuantityPicker</text>
  <text class="dg-note" x="340" y="310" dy="0.35em" text-anchor="middle">Client Components: HTML from the server, then JS in the browser</text>
</svg>
