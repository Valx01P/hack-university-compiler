<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A cached read, a write that expires its tag, and a fresh read</title>
  <desc>Step 1, the page calls getProduct for the Ember Stove, and the result is stored in the cache with the tag product-ember-stove. Step 2, a Server Action saves a new price to the API and calls updateTag with that tag, which expires the entry. Step 3, the next render finds no fresh entry, so getProduct runs again, reads the new price from the API, and stores a new entry under the same tag.</desc>

  <!-- 1. A cached read. -->
  <circle class="dg-badge" cx="30" cy="30" r="10"/>
  <text class="dg-on-badge" x="30" y="30" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-heading" x="48" y="30" dy="0.35em">Read</text>
  <rect class="dg-box" x="20" y="56" width="200" height="56" rx="8"/>
  <text x="120" y="74" dy="0.35em" text-anchor="middle">getProduct runs
    <tspan class="dg-note" x="120" dy="1.4em">and calls cacheTag</tspan>
  </text>
  <path class="dg-flow" d="M120 112 V156" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="20" y="160" width="200" height="56" rx="8"/>
  <text class="dg-on-hot" x="120" y="178" dy="0.35em" text-anchor="middle">Cache entry
    <tspan x="120" dy="1.4em">$64.00</tspan>
  </text>

  <!-- 2. A write. -->
  <circle class="dg-badge" cx="250" cy="30" r="10"/>
  <text class="dg-on-badge" x="250" y="30" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-heading" x="268" y="30" dy="0.35em">Write</text>
  <rect class="dg-box" x="240" y="56" width="200" height="56" rx="8"/>
  <text x="340" y="74" dy="0.35em" text-anchor="middle">A Server Action
    <tspan class="dg-note" x="340" dy="1.4em">saves the new price</tspan>
  </text>
  <path class="dg-line" d="M340 112 V156" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="240" y="160" width="200" height="56" rx="8"/>
  <text class="dg-faint" x="340" y="178" dy="0.35em" text-anchor="middle">Cache entry
    <tspan x="340" dy="1.4em">expired</tspan>
  </text>

  <!-- 3. A fresh read. -->
  <circle class="dg-badge" cx="470" cy="30" r="10"/>
  <text class="dg-on-badge" x="470" y="30" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-heading" x="488" y="30" dy="0.35em">Next read</text>
  <rect class="dg-box" x="460" y="56" width="200" height="56" rx="8"/>
  <text x="560" y="74" dy="0.35em" text-anchor="middle">getProduct runs
    <tspan class="dg-note" x="560" dy="1.4em">and asks the API again</tspan>
  </text>
  <path class="dg-flow" d="M560 112 V156" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="460" y="160" width="200" height="56" rx="8"/>
  <text class="dg-on-hot" x="560" y="178" dy="0.35em" text-anchor="middle">New entry
    <tspan x="560" dy="1.4em">$59.00</tspan>
  </text>

  <!-- The tag that links them. -->
  <path class="dg-line dg-dashed" d="M20 252 H660"/>
  <text x="200" y="276" dy="0.35em" text-anchor="end">Step 1 tags it</text>
  <text class="dg-code" x="220" y="276" dy="0.35em">cacheTag("product-ember-stove")</text>
  <text x="200" y="300" dy="0.35em" text-anchor="end">Step 2 expires it</text>
  <text class="dg-code" x="220" y="300" dy="0.35em">updateTag("product-ember-stove")</text>
</svg>
