<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>One source image becomes many widths and formats through the optimizer</title>
  <desc>A single 2400 by 1600 WebP photo, trail-pack-45.webp, goes into the Next.js image optimizer at /_next/image, which resizes it with sharp the first time each version is asked for, then caches it. Out come WebP copies at 384, 640, and 1080 pixels wide, six more widths up to 3840, and a JPEG copy for a browser whose Accept header doesn't list WebP.</desc>

  <!-- The source file -->
  <rect class="dg-strong" x="20" y="124" width="180" height="56" rx="8"/>
  <text class="dg-code" x="110" y="142" dy="0.35em" text-anchor="middle">trail-pack-45.webp
    <tspan class="dg-note" x="110" dy="1.4em">2400 × 1600 WebP</tspan>
  </text>
  <path class="dg-flow" d="M200 152 H236" marker-end="url(#arrow-flow)"/>

  <!-- The optimizer -->
  <rect class="dg-hot" x="240" y="124" width="180" height="56" rx="8"/>
  <text class="dg-on-hot" x="330" y="142" dy="0.35em" text-anchor="middle">Image optimizer
    <tspan class="dg-code" x="330" dy="1.4em">/_next/image</tspan>
  </text>
  <text class="dg-note" x="330" y="204" dy="0.35em" text-anchor="middle">made on first request,
    <tspan x="330" dy="1.4em">then cached</tspan>
  </text>

  <!-- The fan of versions -->
  <path class="dg-line" d="M420 152 H450 V40 H486" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M450 96 H486" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M450 152 H486" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M450 152 V208 H486" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M450 208 V284 H486" marker-end="url(#arrow)"/>

  <rect class="dg-box" x="490" y="20" width="170" height="40" rx="8"/>
  <text x="575" y="40" dy="0.35em" text-anchor="middle">384w, WebP</text>
  <rect class="dg-box" x="490" y="76" width="170" height="40" rx="8"/>
  <text x="575" y="96" dy="0.35em" text-anchor="middle">640w, WebP</text>
  <rect class="dg-box" x="490" y="132" width="170" height="40" rx="8"/>
  <text x="575" y="152" dy="0.35em" text-anchor="middle">1080w, WebP</text>
  <rect class="dg-off" x="490" y="188" width="170" height="40" rx="8"/>
  <text class="dg-faint" x="575" y="208" dy="0.35em" text-anchor="middle">6 more, up to 3840w</text>
  <rect class="dg-box" x="490" y="256" width="170" height="56" rx="8"/>
  <text x="575" y="274" dy="0.35em" text-anchor="middle">640w, JPEG
    <tspan class="dg-note" x="575" dy="1.4em">Accept without WebP</tspan>
  </text>
</svg>
