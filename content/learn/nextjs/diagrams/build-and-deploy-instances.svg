<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Three copies of one build behind a load balancer, sharing one cache</title>
  <desc>Browsers reach a load balancer, which checks each server's /api/health and sends requests only to the healthy ones. Three copies of the same Next.js build run behind it. Copies 1 and 2 answer and get traffic. Copy 3 failed its health check, so it gets none. All three read and write one shared cache, such as Redis, so a tag one copy expires is expired for all of them.</desc>

  <!-- Visitors -->
  <rect class="dg-box" x="20" y="126" width="100" height="48" rx="8"/>
  <text x="70" y="150" dy="0.35em" text-anchor="middle">Browsers</text>

  <!-- Load balancer -->
  <rect class="dg-strong" x="150" y="122" width="160" height="56" rx="8"/>
  <text x="230" y="140" dy="0.35em" text-anchor="middle">Load balancer
    <tspan class="dg-note" x="230" dy="1.4em">checks /api/health</tspan>
  </text>
  <path class="dg-flow" d="M120 150 H146" marker-end="url(#arrow-flow)"/>

  <!-- One build, three copies -->
  <rect class="dg-frame" x="340" y="20" width="150" height="260" rx="12"/>
  <text class="dg-note" x="415" y="40" dy="0.35em" text-anchor="middle">one build</text>
  <rect class="dg-box" x="356" y="60" width="118" height="48" rx="8"/>
  <text x="415" y="84" dy="0.35em" text-anchor="middle">Next.js 1</text>
  <rect class="dg-box" x="356" y="126" width="118" height="48" rx="8"/>
  <text x="415" y="150" dy="0.35em" text-anchor="middle">Next.js 2</text>
  <rect class="dg-off" x="356" y="192" width="118" height="56" rx="8"/>
  <text class="dg-faint" x="415" y="210" dy="0.35em" text-anchor="middle">Next.js 3
    <tspan x="415" dy="1.4em">unhealthy</tspan>
  </text>
  <path class="dg-flow" d="M310 140 H330 V84 H352" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M310 150 H352" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M310 160 H330 V220 H352"/>

  <!-- Shared cache -->
  <rect class="dg-hot" x="520" y="122" width="140" height="56" rx="8"/>
  <text class="dg-on-hot" x="590" y="140" dy="0.35em" text-anchor="middle">Shared cache
    <tspan x="590" dy="1.4em">such as Redis</tspan>
  </text>
  <path class="dg-line" d="M474 84 H500 V140 H516" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M474 150 H516" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M474 220 H500 V160 H516" marker-end="url(#arrow)"/>
</svg>
