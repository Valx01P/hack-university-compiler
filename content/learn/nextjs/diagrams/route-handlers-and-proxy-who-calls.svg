<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>Who sends the request decides what answers it</title>
  <desc>Five kinds of caller, each with its answer. Your own page reading data needs no endpoint: a Server Component fetches it. Your own page saving data uses a Server Action. A webhook from another service, another app or site, and a request for a feed, a file, or a stream each get a Route Handler, and another app or site also needs CORS headers.</desc>

  <text class="dg-heading" x="170" y="36" dy="0.35em" text-anchor="middle">Who sends it</text>
  <text class="dg-heading" x="530" y="36" dy="0.35em" text-anchor="middle">What answers it</text>

  <!-- Row 1 -->
  <rect class="dg-box" x="20" y="64" width="300" height="48" rx="8"/>
  <text x="170" y="88" dy="0.35em" text-anchor="middle">Your page, reading data</text>
  <path class="dg-line" d="M320 88 H396" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="400" y="64" width="260" height="48" rx="8"/>
  <text class="dg-faint" x="530" y="88" dy="0.35em" text-anchor="middle">a Server Component, no endpoint</text>

  <!-- Row 2 -->
  <rect class="dg-box" x="20" y="128" width="300" height="48" rx="8"/>
  <text x="170" y="152" dy="0.35em" text-anchor="middle">Your page, saving data</text>
  <path class="dg-line" d="M320 152 H396" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="400" y="128" width="260" height="48" rx="8"/>
  <text x="530" y="152" dy="0.35em" text-anchor="middle">a Server Action</text>

  <!-- Row 3 -->
  <rect class="dg-box" x="20" y="192" width="300" height="48" rx="8"/>
  <text x="170" y="216" dy="0.35em" text-anchor="middle">Another service: a webhook</text>
  <path class="dg-flow" d="M320 216 H396" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="400" y="192" width="260" height="48" rx="8"/>
  <text class="dg-on-hot" x="530" y="216" dy="0.35em" text-anchor="middle">a Route Handler</text>

  <!-- Row 4 -->
  <rect class="dg-box" x="20" y="256" width="300" height="48" rx="8"/>
  <text x="170" y="280" dy="0.35em" text-anchor="middle">Another app or site</text>
  <path class="dg-flow" d="M320 280 H396" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="400" y="256" width="260" height="48" rx="8"/>
  <text class="dg-on-hot" x="530" y="280" dy="0.35em" text-anchor="middle">a Route Handler, with CORS</text>

  <!-- Row 5 -->
  <rect class="dg-box" x="20" y="320" width="300" height="48" rx="8"/>
  <text x="170" y="344" dy="0.35em" text-anchor="middle">Anyone: a feed, file, or stream</text>
  <path class="dg-flow" d="M320 344 H396" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="400" y="320" width="260" height="48" rx="8"/>
  <text class="dg-on-hot" x="530" y="344" dy="0.35em" text-anchor="middle">a Route Handler</text>
</svg>
