<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>Proxy is a quick first check, and the data access layer is the real one</title>
  <desc>A request from any client passes through proxy.ts, which only checks that a session cookie is there, and then reaches a page, a Server Action, or a Route Handler. A request that skips proxy, through a bug or a path the matcher leaves out, reaches the same doors. Every door calls verifySession in lib/dal.ts, which asks the Trailhead API who the cookie belongs to before any data is read.</desc>

  <!-- First row: the way in -->
  <rect class="dg-box" x="20" y="40" width="120" height="56" rx="8"/>
  <text x="80" y="58" dy="0.35em" text-anchor="middle">Request
    <tspan class="dg-note" x="80" dy="1.4em">any client</tspan>
  </text>
  <rect class="dg-box" x="180" y="40" width="200" height="56" rx="8"/>
  <text x="280" y="58" dy="0.35em" text-anchor="middle">proxy.ts
    <tspan class="dg-note" x="280" dy="1.4em">is there a cookie?</tspan>
  </text>
  <rect class="dg-strong" x="420" y="40" width="240" height="56" rx="8"/>
  <text x="540" y="58" dy="0.35em" text-anchor="middle">Page, action, handler
    <tspan class="dg-note" x="540" dy="1.4em">the doors into your app</tspan>
  </text>
  <path class="dg-flow" d="M140 68 H176" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M380 68 H416" marker-end="url(#arrow-flow)"/>

  <!-- A request that never met proxy -->
  <path class="dg-line dg-dashed" d="M80 96 V140 H480 V100" marker-end="url(#arrow)"/>
  <text class="dg-note" x="280" y="160" dy="0.35em" text-anchor="middle">a request that skipped proxy</text>

  <!-- Second row: the real check, then the data -->
  <rect class="dg-hot" x="420" y="200" width="240" height="56" rx="8"/>
  <text class="dg-on-hot" x="540" y="218" dy="0.35em" text-anchor="middle">verifySession()
    <tspan x="540" dy="1.4em">in lib/dal.ts, every time</tspan>
  </text>
  <path class="dg-flow" d="M600 96 V196" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="180" y="200" width="200" height="56" rx="8"/>
  <text x="280" y="218" dy="0.35em" text-anchor="middle">Trailhead API
    <tspan class="dg-note" x="280" dy="1.4em">the data</tspan>
  </text>
  <path class="dg-flow" d="M420 228 H384" marker-end="url(#arrow-flow)"/>
</svg>
