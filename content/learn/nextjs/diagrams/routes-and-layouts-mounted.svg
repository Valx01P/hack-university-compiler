<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Going from the list to a product, the layouts stay and the page changes</title>
  <desc>Before the click, the root layout with the site header wraps the products layout with the category links, which wraps the product list page. After clicking a product, the root layout and the products layout are the same components, still mounted with their state. Only the innermost part changed: the product page replaced the list.</desc>

  <!-- Before: /products. -->
  <text class="dg-code" x="20" y="24" dy="0.35em">/products</text>
  <rect class="dg-box" x="20" y="44" width="280" height="236" rx="8"/>
  <text x="36" y="64" dy="0.35em">Root layout</text>
  <text class="dg-note" x="36" y="84" dy="0.35em">header, nav links</text>
  <rect class="dg-box" x="36" y="104" width="248" height="160" rx="8"/>
  <text x="52" y="124" dy="0.35em">Products layout</text>
  <text class="dg-note" x="52" y="144" dy="0.35em">category links</text>
  <rect class="dg-strong" x="52" y="164" width="216" height="84" rx="8"/>
  <text x="160" y="206" dy="0.35em" text-anchor="middle">List page</text>

  <!-- The click. -->
  <path class="dg-flow" d="M300 206 H376" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="186" dy="0.35em" text-anchor="middle">click</text>

  <!-- After: /products/ridge-2p-tent. -->
  <text class="dg-code" x="380" y="24" dy="0.35em">/products/ridge-2p-tent</text>
  <rect class="dg-box" x="380" y="44" width="280" height="236" rx="8"/>
  <text x="396" y="64" dy="0.35em">Root layout</text>
  <text class="dg-note" x="396" y="84" dy="0.35em">stays mounted</text>
  <rect class="dg-box" x="396" y="104" width="248" height="160" rx="8"/>
  <text x="412" y="124" dy="0.35em">Products layout</text>
  <text class="dg-note" x="412" y="144" dy="0.35em">stays mounted</text>
  <rect class="dg-hot" x="412" y="164" width="216" height="84" rx="8"/>
  <text class="dg-on-hot" x="520" y="196" dy="0.35em" text-anchor="middle">Product page
    <tspan x="520" dy="1.4em">the only new part</tspan>
  </text>
</svg>
