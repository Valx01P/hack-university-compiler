<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The processes inside a browser, and the messages between them</title>
  <desc>The browser process, which draws the tabs and the address bar and sets the rules, sends messages to four other processes. Two renderer processes, one for site A and one for site B, each run Blink and V8 inside a sandbox. The network service does DNS, connections, and HTTP. The GPU process puts the pixels on the screen.</desc>

  <!-- The browser process, in charge. -->
  <rect class="dg-strong" x="20" y="148" width="180" height="56" rx="8"/>
  <text x="110" y="166" dy="0.35em" text-anchor="middle">Browser process
    <tspan class="dg-note" x="110" dy="1.4em">tabs, address bar, rules</tspan>
  </text>

  <!-- The messages: IPC. -->
  <path class="dg-line" d="M200 176 H250"/>
  <text class="dg-note" x="225" y="164" text-anchor="middle">IPC</text>
  <path class="dg-line" d="M250 58 V310"/>
  <path class="dg-line" d="M250 58 H312"/>
  <path class="dg-line" d="M250 146 H312"/>
  <path class="dg-line" d="M250 238 H296"/>
  <path class="dg-line" d="M250 310 H296"/>

  <!-- Site A's renderer, in its sandbox. -->
  <rect class="dg-frame" x="300" y="20" width="360" height="76" rx="12"/>
  <rect class="dg-hot" x="316" y="30" width="220" height="56" rx="8"/>
  <text class="dg-on-hot" x="426" y="48" dy="0.35em" text-anchor="middle">Renderer process
    <tspan x="426" dy="1.4em">site A: Blink and V8</tspan>
  </text>
  <text class="dg-faint" x="644" y="58" dy="0.35em" text-anchor="end">sandbox</text>

  <!-- Site B's renderer, in its sandbox. -->
  <rect class="dg-frame" x="300" y="108" width="360" height="76" rx="12"/>
  <rect class="dg-hot" x="316" y="118" width="220" height="56" rx="8"/>
  <text class="dg-on-hot" x="426" y="136" dy="0.35em" text-anchor="middle">Renderer process
    <tspan x="426" dy="1.4em">site B: Blink and V8</tspan>
  </text>
  <text class="dg-faint" x="644" y="146" dy="0.35em" text-anchor="end">sandbox</text>

  <!-- The network service. -->
  <rect class="dg-box" x="300" y="210" width="236" height="56" rx="8"/>
  <text x="418" y="228" dy="0.35em" text-anchor="middle">Network service
    <tspan class="dg-note" x="418" dy="1.4em">DNS, connections, HTTP</tspan>
  </text>

  <!-- The GPU process. -->
  <rect class="dg-box" x="300" y="282" width="236" height="56" rx="8"/>
  <text x="418" y="300" dy="0.35em" text-anchor="middle">GPU process
    <tspan class="dg-note" x="418" dy="1.4em">puts pixels on the screen</tspan>
  </text>
</svg>
