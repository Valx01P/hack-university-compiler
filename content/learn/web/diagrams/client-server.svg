<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>A browser asks a server for a page and gets one response back</title>
  <desc>Your computer runs a browser, the client. It sends a request, GET /about.html, across the internet to a web server running on another computer. The server reads about.html from its folder of files and sends one response back: 200 OK with the file's contents.</desc>

  <!-- Your computer -->
  <rect class="dg-frame" x="20" y="20" width="200" height="240" rx="12"/>
  <text class="dg-note" x="40" y="48">Your computer</text>
  <rect class="dg-strong" x="40" y="92" width="160" height="64" rx="8"/>
  <text x="120" y="116" dy="0.35em" text-anchor="middle">Browser
    <tspan class="dg-note" x="120" dy="1.4em">the client</tspan>
  </text>

  <!-- Another computer -->
  <rect class="dg-frame" x="440" y="20" width="220" height="240" rx="12"/>
  <text class="dg-note" x="460" y="48">Another computer</text>
  <rect class="dg-hot" x="460" y="92" width="180" height="64" rx="8"/>
  <text class="dg-on-hot" x="550" y="116" dy="0.35em" text-anchor="middle">Web server
    <tspan x="550" dy="1.4em">the program</tspan>
  </text>
  <path class="dg-line" d="M550 156 V172" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="480" y="176" width="140" height="68" rx="8"/>
  <text class="dg-faint" x="496" y="192" dy="0.35em">its files</text>
  <text class="dg-code" x="496" y="211" dy="0.35em">index.html</text>
  <text class="dg-code" x="496" y="229" dy="0.35em">about.html</text>

  <!-- The request, and the response -->
  <text class="dg-code" x="330" y="100" text-anchor="middle">GET /about.html</text>
  <path class="dg-flow" d="M200 112 H456" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M460 140 H204" marker-end="url(#arrow)"/>
  <text class="dg-code" x="330" y="162" text-anchor="middle">200 OK + the file</text>
  <text class="dg-faint" x="330" y="200" text-anchor="middle">over the internet</text>
</svg>
