<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The event loop: a task, its microtasks, a frame, and round again</title>
  <desc>Tasks such as clicks, timers, and scripts wait in the task queue. In step 1 the browser takes one task and runs it to the end. In step 2 it runs every microtask that's waiting, like promise callbacks. In step 3, if a frame is due, it renders: requestAnimationFrame callbacks, style, layout, and paint. In step 4 it goes back to the queue for the next task.</desc>

  <!-- The queue. -->
  <rect class="dg-box" x="20" y="40" width="180" height="56" rx="8"/>
  <text x="110" y="59" dy="0.35em" text-anchor="middle">Task queue
    <tspan class="dg-note" x="110" dy="1.4em">clicks, timers, scripts</tspan>
  </text>
  <path class="dg-flow" d="M200 68 H236" marker-end="url(#arrow-flow)"/>

  <!-- Step 1. -->
  <rect class="dg-hot" x="240" y="40" width="200" height="56" rx="8"/>
  <circle class="dg-badge" cx="262" cy="68" r="10"/>
  <text class="dg-on-badge" x="262" y="68" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-on-hot" x="282" y="59" dy="0.35em">Run one task
    <tspan x="282" dy="1.4em">to the very end</tspan>
  </text>
  <path class="dg-flow" d="M440 68 H560 V136" marker-end="url(#arrow-flow)"/>

  <!-- Step 2. -->
  <rect class="dg-box" x="460" y="140" width="200" height="56" rx="8"/>
  <circle class="dg-badge" cx="482" cy="168" r="10"/>
  <text class="dg-on-badge" x="482" y="168" dy="0.35em" text-anchor="middle">2</text>
  <text x="502" y="159" dy="0.35em">Run microtasks
    <tspan class="dg-note" x="502" dy="1.4em">every one waiting</tspan>
  </text>
  <path class="dg-flow" d="M560 196 V276 H444" marker-end="url(#arrow-flow)"/>

  <!-- Step 3. -->
  <rect class="dg-strong" x="240" y="248" width="200" height="56" rx="8"/>
  <circle class="dg-badge" cx="262" cy="276" r="10"/>
  <text class="dg-on-badge" x="262" y="276" dy="0.35em" text-anchor="middle">3</text>
  <text x="282" y="267" dy="0.35em">Render a frame
    <tspan class="dg-note" x="282" dy="1.4em">if one is due</tspan>
  </text>
  <text class="dg-note" x="340" y="328" dy="0.35em" text-anchor="middle">rAF callbacks, style, layout, paint</text>

  <!-- Step 4: round again. -->
  <path class="dg-flow" d="M240 276 H110 V100" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="110" cy="188" r="10"/>
  <text class="dg-on-badge" x="110" y="188" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="126" y="188" dy="0.35em">next task</text>
</svg>
