<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>An array of three trail objects, numbered from 0</title>
  <desc>The name trails refers to an array with three places, numbered 0, 1, and 2. Each place holds an object: Lake Loop, 5 km, at index 0, Ridge Trail, 12 km, at index 1, and North Loop, 8 km, at index 2. So trails[1].name is Ridge Trail, and trails.length is 3.</desc>

  <!-- The name and the array. -->
  <text class="dg-code" x="20" y="68" dy="0.35em">trails</text>
  <path class="dg-line" d="M68 68 H96" marker-end="url(#arrow)"/>
  <text class="dg-code" x="190" y="24" dy="0.35em" text-anchor="middle">0</text>
  <text class="dg-code" x="370" y="24" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="550" y="24" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="100" y="40" width="180" height="56" rx="8"/>
  <text class="dg-note" x="190" y="68" dy="0.35em" text-anchor="middle">trails[0]</text>
  <rect class="dg-box" x="280" y="40" width="180" height="56" rx="8"/>
  <text class="dg-note" x="370" y="68" dy="0.35em" text-anchor="middle">trails[1]</text>
  <rect class="dg-box" x="460" y="40" width="180" height="56" rx="8"/>
  <text class="dg-note" x="550" y="68" dy="0.35em" text-anchor="middle">trails[2]</text>

  <!-- The objects. -->
  <path class="dg-line" d="M190 96 V136" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="104" y="140" width="172" height="64" rx="8"/>
  <text class="dg-code" x="118" y="160" dy="0.35em">name: "Lake Loop"
    <tspan x="118" dy="1.6em">lengthKm: 5</tspan>
  </text>
  <path class="dg-flow" d="M370 96 V136" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="284" y="140" width="172" height="64" rx="8"/>
  <text class="dg-on-hot dg-code" x="298" y="160" dy="0.35em">name: "Ridge Trail"
    <tspan x="298" dy="1.6em">lengthKm: 12</tspan>
  </text>
  <path class="dg-line" d="M550 96 V136" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="464" y="140" width="172" height="64" rx="8"/>
  <text class="dg-code" x="478" y="160" dy="0.35em">name: "North Loop"
    <tspan x="478" dy="1.6em">lengthKm: 8</tspan>
  </text>

  <!-- Reading one. -->
  <text class="dg-code" x="370" y="244" dy="0.35em" text-anchor="middle">trails[1].name is "Ridge Trail"</text>
  <text class="dg-note" x="370" y="270" dy="0.35em" text-anchor="middle">trails.length is 3, and the last index is 2</text>
</svg>
