<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>Five links in bread.html, and the file each one reaches</title>
  <desc>The page bread.html sits in the recipes folder of the bakery site. Its link ../index.html goes up one folder to the home page. /contact.html starts from the root. #method stays on bread.html itself. cake.html is the file next to it in recipes. images/loaf.jpg is inside the images folder in recipes.</desc>

  <!-- The links, each on the row of the file it reaches. -->
  <text class="dg-heading" x="20" y="36" dy="0.35em">Links in bread.html</text>
  <text class="dg-code" x="240" y="100" dy="0.35em" text-anchor="end">../index.html</text>
  <text class="dg-code" x="240" y="136" dy="0.35em" text-anchor="end">/contact.html</text>
  <text class="dg-code" x="240" y="208" dy="0.35em" text-anchor="end">#method</text>
  <text class="dg-code" x="240" y="244" dy="0.35em" text-anchor="end">cake.html</text>
  <text class="dg-code" x="240" y="316" dy="0.35em" text-anchor="end">images/loaf.jpg</text>
  <path class="dg-line" d="M252 100 H404" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M252 136 H404" marker-end="url(#arrow)"/>
  <path class="dg-flow" d="M252 208 H422" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M252 244 H428" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M252 316 H452" marker-end="url(#arrow)"/>

  <!-- The site's folders. -->
  <rect class="dg-frame" x="380" y="20" width="280" height="320" rx="12"/>
  <text class="dg-heading" x="396" y="36" dy="0.35em">The site's folders</text>
  <text class="dg-code" x="396" y="68" dy="0.35em">bakery/</text>
  <text class="dg-note" x="456" y="68" dy="0.35em">the root, /</text>
  <path class="dg-line" d="M402 78 V172"/>
  <path class="dg-line" d="M402 100 H404"/>
  <text class="dg-code" x="412" y="100" dy="0.35em">index.html</text>
  <text class="dg-code" x="412" y="136" dy="0.35em">contact.html</text>
  <path class="dg-line" d="M402 136 H404"/>
  <path class="dg-line" d="M402 172 H404"/>
  <text class="dg-code" x="412" y="172" dy="0.35em">recipes/</text>
  <path class="dg-line" d="M420 182 V280"/>
  <rect class="dg-hot" x="426" y="198" width="96" height="20" rx="4"/>
  <text class="dg-on-hot dg-code" x="432" y="208" dy="0.35em">bread.html</text>
  <text class="dg-note" x="532" y="208" dy="0.35em">this page</text>
  <text class="dg-code" x="432" y="244" dy="0.35em">cake.html</text>
  <path class="dg-line" d="M420 280 H424"/>
  <text class="dg-code" x="432" y="280" dy="0.35em">images/</text>
  <path class="dg-line" d="M440 290 V316 H446"/>
  <text class="dg-code" x="456" y="316" dy="0.35em">loaf.jpg</text>
</svg>
