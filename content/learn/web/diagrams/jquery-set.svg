<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A jQuery object wraps three list items, and one addClass call changes all three</title>
  <desc>Calling $ with the selector #tasks .task returns a jQuery object with three numbered slots, 0, 1, and 2, and a length of 3. Each slot points at one list item on the page. Calling addClass with seen on the jQuery object adds the class to all three list items at once.</desc>

  <text class="dg-code" x="160" y="36" dy="0.35em" text-anchor="middle">$("#tasks .task")</text>

  <!-- The jQuery object. -->
  <rect class="dg-strong" x="40" y="60" width="240" height="200" rx="12"/>
  <text class="dg-heading" x="60" y="84" dy="0.35em">jQuery object</text>
  <rect class="dg-box" x="60" y="104" width="120" height="36" rx="8"/>
  <text class="dg-code" x="120" y="122" dy="0.35em" text-anchor="middle">[0]</text>
  <rect class="dg-box" x="60" y="148" width="120" height="36" rx="8"/>
  <text class="dg-code" x="120" y="166" dy="0.35em" text-anchor="middle">[1]</text>
  <rect class="dg-box" x="60" y="192" width="120" height="36" rx="8"/>
  <text class="dg-code" x="120" y="210" dy="0.35em" text-anchor="middle">[2]</text>
  <text class="dg-code" x="60" y="244" dy="0.35em">length: 3</text>

  <!-- One call, three changes. -->
  <path class="dg-flow" d="M180 122 H416" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M180 166 H416" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M180 210 H416" marker-end="url(#arrow-flow)"/>

  <!-- The page. -->
  <rect class="dg-frame" x="400" y="60" width="260" height="200" rx="12"/>
  <text class="dg-heading" x="420" y="84" dy="0.35em">The page</text>
  <rect class="dg-hot" x="420" y="104" width="220" height="36" rx="8"/>
  <text class="dg-on-hot dg-code" x="436" y="122" dy="0.35em">li.task.seen</text>
  <rect class="dg-hot" x="420" y="148" width="220" height="36" rx="8"/>
  <text class="dg-on-hot dg-code" x="436" y="166" dy="0.35em">li.task.done.seen</text>
  <rect class="dg-hot" x="420" y="192" width="220" height="36" rx="8"/>
  <text class="dg-on-hot dg-code" x="436" y="210" dy="0.35em">li.task.seen</text>

  <text class="dg-code" x="340" y="292" dy="0.35em" text-anchor="middle">$tasks.addClass("seen")</text>
</svg>
