<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Tailwind reads your files, keeps the class names, and writes CSS for them</title>
  <desc>Step 1: Tailwind reads index.html and src/main.js as plain text. Step 2: of the words it finds, it keeps the ones that are Tailwind classes, like p-6, text-3xl, rounded-md, p-3, and shadow-sm, and drops words like main, class, h1, and Notes. Step 3: it writes output.css with one rule for each class it kept.</desc>

  <!-- Step 1: your files. -->
  <circle class="dg-badge" cx="36" cy="36" r="10"/>
  <text class="dg-on-badge" x="36" y="36" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-heading" x="54" y="36" dy="0.35em">Read your files</text>
  <rect class="dg-box" x="20" y="60" width="210" height="110" rx="8"/>
  <text x="36" y="80" dy="0.35em">index.html</text>
  <text class="dg-code" x="36" y="106" dy="0.35em">&lt;main class="p-6"&gt;</text>
  <text class="dg-code" x="36" y="126" dy="0.35em">&lt;h1 class="text-3xl"&gt;</text>
  <text class="dg-code" x="36" y="146" dy="0.35em">Notes&lt;/h1&gt;</text>
  <rect class="dg-box" x="20" y="186" width="210" height="90" rx="8"/>
  <text x="36" y="206" dy="0.35em">src/main.js</text>
  <text class="dg-code" x="36" y="232" dy="0.35em">"rounded-md p-3"</text>
  <text class="dg-code" x="36" y="252" dy="0.35em">"shadow-sm"</text>
  <path class="dg-flow" d="M230 168 H262" marker-end="url(#arrow-flow)"/>

  <!-- Step 2: the words that are classes. -->
  <circle class="dg-badge" cx="282" cy="36" r="10"/>
  <text class="dg-on-badge" x="282" y="36" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-heading" x="300" y="36" dy="0.35em">Keep classes</text>
  <rect class="dg-strong" x="266" y="60" width="176" height="216" rx="8"/>
  <text class="dg-note" x="282" y="80" dy="0.35em">kept</text>
  <text class="dg-faint" x="384" y="80" dy="0.35em">dropped</text>
  <text class="dg-code" x="282" y="110" dy="0.35em">p-6</text>
  <text class="dg-code" x="282" y="134" dy="0.35em">text-3xl</text>
  <text class="dg-code" x="282" y="158" dy="0.35em">rounded-md</text>
  <text class="dg-code" x="282" y="182" dy="0.35em">p-3</text>
  <text class="dg-code" x="282" y="206" dy="0.35em">shadow-sm</text>
  <text class="dg-faint dg-code" x="384" y="110" dy="0.35em">main</text>
  <text class="dg-faint dg-code" x="384" y="134" dy="0.35em">class</text>
  <text class="dg-faint dg-code" x="384" y="158" dy="0.35em">h1</text>
  <text class="dg-faint dg-code" x="384" y="182" dy="0.35em">Notes</text>
  <path class="dg-flow" d="M442 168 H474" marker-end="url(#arrow-flow)"/>

  <!-- Step 3: the stylesheet. -->
  <circle class="dg-badge" cx="494" cy="36" r="10"/>
  <text class="dg-on-badge" x="494" y="36" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-heading" x="512" y="36" dy="0.35em">Write the CSS</text>
  <rect class="dg-hot" x="478" y="60" width="182" height="216" rx="8"/>
  <text class="dg-on-hot dg-code" x="494" y="80" dy="0.35em">output.css</text>
  <text class="dg-on-hot dg-code" x="494" y="110" dy="0.35em">.p-3 { … }</text>
  <text class="dg-on-hot dg-code" x="494" y="134" dy="0.35em">.p-6 { … }</text>
  <text class="dg-on-hot dg-code" x="494" y="158" dy="0.35em">.rounded-md { … }</text>
  <text class="dg-on-hot dg-code" x="494" y="182" dy="0.35em">.shadow-sm { … }</text>
  <text class="dg-on-hot dg-code" x="494" y="206" dy="0.35em">.text-3xl { … }</text>
</svg>
