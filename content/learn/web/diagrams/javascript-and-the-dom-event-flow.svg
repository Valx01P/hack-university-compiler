<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>A click travels down to its target, then bubbles back up</title>
  <desc>A click on a button inside a list item inside a list. In step 1, the capture phase, the event travels down from the document through the ul and the li. In step 2 it reaches the target, the button. In step 3, the bubbling phase, it travels back up through the li and the ul to the document. Listeners along the way run in that order.</desc>

  <!-- The tree. -->
  <rect class="dg-box" x="240" y="32" width="200" height="48" rx="8"/>
  <text class="dg-code" x="340" y="56" dy="0.35em" text-anchor="middle">document</text>
  <path class="dg-line" d="M340 80 V112"/>
  <rect class="dg-box" x="240" y="112" width="200" height="48" rx="8"/>
  <text class="dg-code" x="340" y="136" dy="0.35em" text-anchor="middle">ul</text>
  <path class="dg-line" d="M340 160 V192"/>
  <rect class="dg-box" x="240" y="192" width="200" height="48" rx="8"/>
  <text class="dg-code" x="340" y="216" dy="0.35em" text-anchor="middle">li</text>
  <path class="dg-line" d="M340 240 V272"/>
  <rect class="dg-hot" x="240" y="272" width="200" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="291" dy="0.35em" text-anchor="middle">button
    <tspan x="340" dy="1.4em">the target</tspan>
  </text>

  <!-- Step 1: capture, down. -->
  <circle class="dg-badge" cx="200" cy="40" r="10"/>
  <text class="dg-on-badge" x="200" y="40" dy="0.35em" text-anchor="middle">1</text>
  <path class="dg-flow" d="M200 56 V292 H236" marker-end="url(#arrow-flow)"/>
  <text x="184" y="160" dy="0.35em" text-anchor="end">capture
    <tspan class="dg-note" x="184" dy="1.4em">top down</tspan>
  </text>

  <!-- Step 2: the target. -->
  <circle class="dg-badge" cx="340" cy="344" r="10"/>
  <text class="dg-on-badge" x="340" y="344" dy="0.35em" text-anchor="middle">2</text>

  <!-- Step 3: bubble, up. -->
  <path class="dg-flow" d="M440 300 H480 V60" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="480" cy="40" r="10"/>
  <text class="dg-on-badge" x="480" y="40" dy="0.35em" text-anchor="middle">3</text>
  <text x="496" y="160" dy="0.35em">bubble
    <tspan class="dg-note" x="496" dy="1.4em">back up</tspan>
  </text>
</svg>
