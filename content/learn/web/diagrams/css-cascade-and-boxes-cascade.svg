<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <title>Four declarations for one color go through the cascade's steps</title>
  <desc>Four rules set the color of the same paragraph: #special green, .menu .price blue, .price crimson, and p gray. In step 1, origin and importance, all four come from your stylesheet, so they tie. In step 2 none is in a style attribute, and in step 3 none is in a layer, so they tie again. In step 4, specificity, #special wins at 1, 0, 0. Step 5, order, isn't needed. The paragraph is green.</desc>

  <!-- The competing declarations. -->
  <rect class="dg-box" x="30" y="20" width="300" height="36" rx="8"/>
  <text class="dg-code" x="180" y="38" dy="0.35em" text-anchor="middle">#special { color: green }</text>
  <rect class="dg-box" x="350" y="20" width="300" height="36" rx="8"/>
  <text class="dg-code" x="500" y="38" dy="0.35em" text-anchor="middle">.menu .price { color: blue }</text>
  <rect class="dg-box" x="30" y="64" width="300" height="36" rx="8"/>
  <text class="dg-code" x="180" y="82" dy="0.35em" text-anchor="middle">.price { color: crimson }</text>
  <rect class="dg-box" x="350" y="64" width="300" height="36" rx="8"/>
  <text class="dg-code" x="500" y="82" dy="0.35em" text-anchor="middle">p { color: gray }</text>
  <path class="dg-flow" d="M340 104 V132" marker-end="url(#arrow-flow)"/>

  <!-- Step 1. -->
  <rect class="dg-box" x="40" y="136" width="600" height="44" rx="8"/>
  <circle class="dg-badge" cx="64" cy="158" r="10"/>
  <text class="dg-on-badge" x="64" y="158" dy="0.35em" text-anchor="middle">1</text>
  <text x="88" y="158" dy="0.35em">Origin and importance</text>
  <text class="dg-note" x="624" y="158" dy="0.35em" text-anchor="end">all four are yours: a tie</text>
  <path class="dg-flow" d="M340 180 V188" marker-end="url(#arrow-flow)"/>

  <!-- Step 2. -->
  <rect class="dg-box" x="60" y="192" width="560" height="44" rx="8"/>
  <circle class="dg-badge" cx="84" cy="214" r="10"/>
  <text class="dg-on-badge" x="84" y="214" dy="0.35em" text-anchor="middle">2</text>
  <text x="108" y="214" dy="0.35em">Style attribute</text>
  <text class="dg-note" x="604" y="214" dy="0.35em" text-anchor="end">none: a tie</text>
  <path class="dg-flow" d="M340 236 V244" marker-end="url(#arrow-flow)"/>

  <!-- Step 3. -->
  <rect class="dg-box" x="80" y="248" width="520" height="44" rx="8"/>
  <circle class="dg-badge" cx="104" cy="270" r="10"/>
  <text class="dg-on-badge" x="104" y="270" dy="0.35em" text-anchor="middle">3</text>
  <text x="128" y="270" dy="0.35em">Layers</text>
  <text class="dg-note" x="584" y="270" dy="0.35em" text-anchor="end">none: a tie</text>
  <path class="dg-flow" d="M340 292 V300" marker-end="url(#arrow-flow)"/>

  <!-- Step 4: decides. -->
  <rect class="dg-hot" x="100" y="304" width="480" height="44" rx="8"/>
  <circle class="dg-badge" cx="124" cy="326" r="10"/>
  <text class="dg-on-badge" x="124" y="326" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-on-hot" x="148" y="326" dy="0.35em">Specificity</text>
  <text class="dg-on-hot" x="564" y="326" dy="0.35em" text-anchor="end">#special wins at (1, 0, 0)</text>

  <!-- Step 5: not needed. -->
  <rect class="dg-off" x="120" y="360" width="440" height="44" rx="8"/>
  <circle class="dg-badge" cx="144" cy="382" r="10"/>
  <text class="dg-on-badge" x="144" y="382" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-faint" x="168" y="382" dy="0.35em">Order</text>
  <text class="dg-faint" x="544" y="382" dy="0.35em" text-anchor="end">not needed this time</text>

  <!-- The winner. -->
  <path class="dg-flow" d="M580 326 H640 V440 H434" marker-end="url(#arrow-flow)"/>
  <rect class="dg-strong" x="250" y="420" width="180" height="40" rx="8"/>
  <text class="dg-code" x="340" y="440" dy="0.35em" text-anchor="middle">color: green</text>
</svg>
