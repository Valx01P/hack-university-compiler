<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>One computer, three ports: each address reaches a different program</title>
  <desc>Inside one computer, the browser sends requests over loopback to three ports. localhost:3000 reaches Hack University, and localhost:8000 reaches Python's small server. localhost:8001 reaches nothing, since no program listens on that port, so the connection is refused. None of these requests leave the computer.</desc>

  <rect class="dg-frame" x="20" y="20" width="640" height="280" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">Your computer</text>

  <!-- The browser, the client. -->
  <rect class="dg-strong" x="40" y="72" width="140" height="200" rx="8"/>
  <text x="110" y="172" dy="0.35em" text-anchor="middle">Browser</text>

  <!-- Port 3000: Hack University. -->
  <text class="dg-code" x="318" y="86" dy="0.35em" text-anchor="middle">localhost:3000</text>
  <path class="dg-line" d="M180 100 H456" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="460" y="72" width="180" height="56" rx="8"/>
  <text x="550" y="91" dy="0.35em" text-anchor="middle">Hack University
    <tspan class="dg-note" x="550" dy="1.4em">port 3000</tspan>
  </text>

  <!-- Port 8000: Python's server. -->
  <text class="dg-code" x="318" y="158" dy="0.35em" text-anchor="middle">localhost:8000</text>
  <path class="dg-flow" d="M180 172 H456" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="460" y="144" width="180" height="56" rx="8"/>
  <text class="dg-on-hot" x="550" y="163" dy="0.35em" text-anchor="middle">Python's server
    <tspan x="550" dy="1.4em">port 8000</tspan>
  </text>

  <!-- Port 8001: nothing listens. -->
  <text class="dg-code" x="318" y="230" dy="0.35em" text-anchor="middle">localhost:8001</text>
  <path class="dg-line" d="M180 244 H456" marker-end="url(#arrow)"/>
  <text class="dg-note" x="318" y="260" dy="0.35em" text-anchor="middle">connection refused</text>
  <rect class="dg-off" x="460" y="216" width="180" height="56" rx="8"/>
  <text class="dg-faint" x="550" y="235" dy="0.35em" text-anchor="middle">nothing listening
    <tspan x="550" dy="1.4em">port 8001</tspan>
  </text>
</svg>
