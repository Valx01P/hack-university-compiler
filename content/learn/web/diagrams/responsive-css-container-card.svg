<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>The same card in a narrow sidebar and in a wide main column</title>
  <desc>One page with two containers. The sidebar is 18rem wide, narrower than the card's 28rem container query, so the card stacks, with its picture above its title and text. The main column is 40rem wide, so the query is true and the same card puts its picture to the left of its text. The window's width is the same for both.</desc>

  <rect class="dg-frame" x="20" y="20" width="640" height="340" rx="12"/>
  <text class="dg-heading" x="40" y="40" dy="0.35em">One page, one window width</text>

  <!-- Sidebar container. -->
  <rect class="dg-frame" x="40" y="64" width="200" height="276" rx="12"/>
  <text class="dg-note" x="56" y="84" dy="0.35em">sidebar, 18rem wide</text>
  <rect class="dg-strong" x="56" y="104" width="168" height="172" rx="8"/>
  <rect class="dg-hot" x="72" y="120" width="136" height="72" rx="8"/>
  <text class="dg-on-hot" x="140" y="156" dy="0.35em" text-anchor="middle">picture</text>
  <text x="72" y="216" dy="0.35em">Lake Loop</text>
  <text class="dg-note" x="72" y="240" dy="0.35em">An easy walk, 5 km</text>
  <text class="dg-note" x="140" y="308" dy="0.35em" text-anchor="middle">under 28rem: stacked</text>

  <!-- Main container. -->
  <rect class="dg-frame" x="260" y="64" width="380" height="276" rx="12"/>
  <text class="dg-note" x="276" y="84" dy="0.35em">main column, 40rem wide</text>
  <rect class="dg-strong" x="276" y="104" width="348" height="120" rx="8"/>
  <rect class="dg-hot" x="292" y="120" width="128" height="88" rx="8"/>
  <text class="dg-on-hot" x="356" y="164" dy="0.35em" text-anchor="middle">picture</text>
  <text x="436" y="148" dy="0.35em">Lake Loop</text>
  <text class="dg-note" x="436" y="172" dy="0.35em">An easy walk, 5 km</text>
  <text class="dg-note" x="450" y="308" dy="0.35em" text-anchor="middle">28rem or wider: side by side</text>
</svg>
