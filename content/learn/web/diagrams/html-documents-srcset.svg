<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Three screens, and the file each one picks from srcset</title>
  <desc>The picture offers cake-400.jpg, cake-800.jpg, and cake-1600.jpg. A small phone 360 pixels wide at density 1 shows it full width and needs 360 pixels, so it picks cake-400.jpg. A phone 390 wide at density 2 needs 780, so it picks cake-800.jpg. A laptop 1440 wide at density 2 shows it at half width, 720, and needs 1440, so it picks cake-1600.jpg.</desc>

  <text class="dg-heading" x="110" y="32" dy="0.35em" text-anchor="middle">Screen</text>
  <text class="dg-heading" x="350" y="32" dy="0.35em" text-anchor="middle">Pixels it needs</text>
  <text class="dg-heading" x="580" y="32" dy="0.35em" text-anchor="middle">File it picks</text>

  <!-- A small phone. -->
  <rect class="dg-box" x="20" y="56" width="180" height="56" rx="8"/>
  <text x="110" y="74" dy="0.35em" text-anchor="middle">Small phone
    <tspan class="dg-note" x="110" dy="1.4em">360 wide, density 1</tspan>
  </text>
  <path class="dg-line" d="M200 84 H256" marker-end="url(#arrow)"/>
  <text class="dg-code" x="350" y="74" dy="0.35em" text-anchor="middle">360 × 1 = 360</text>
  <text class="dg-note" x="350" y="96" dy="0.35em" text-anchor="middle">full width</text>
  <path class="dg-line" d="M444 84 H496" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="500" y="64" width="160" height="40" rx="8"/>
  <text class="dg-code" x="580" y="84" dy="0.35em" text-anchor="middle">cake-400.jpg</text>

  <!-- A phone. -->
  <rect class="dg-box" x="20" y="132" width="180" height="56" rx="8"/>
  <text x="110" y="150" dy="0.35em" text-anchor="middle">Phone
    <tspan class="dg-note" x="110" dy="1.4em">390 wide, density 2</tspan>
  </text>
  <path class="dg-line" d="M200 160 H256" marker-end="url(#arrow)"/>
  <text class="dg-code" x="350" y="150" dy="0.35em" text-anchor="middle">390 × 2 = 780</text>
  <text class="dg-note" x="350" y="172" dy="0.35em" text-anchor="middle">full width</text>
  <path class="dg-line" d="M444 160 H496" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="500" y="140" width="160" height="40" rx="8"/>
  <text class="dg-code" x="580" y="160" dy="0.35em" text-anchor="middle">cake-800.jpg</text>

  <!-- A laptop. -->
  <rect class="dg-box" x="20" y="208" width="180" height="56" rx="8"/>
  <text x="110" y="226" dy="0.35em" text-anchor="middle">Laptop
    <tspan class="dg-note" x="110" dy="1.4em">1440 wide, density 2</tspan>
  </text>
  <path class="dg-line" d="M200 236 H256" marker-end="url(#arrow)"/>
  <text class="dg-code" x="350" y="226" dy="0.35em" text-anchor="middle">720 × 2 = 1440</text>
  <text class="dg-note" x="350" y="248" dy="0.35em" text-anchor="middle">half width</text>
  <path class="dg-flow" d="M444 236 H496" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="500" y="216" width="160" height="40" rx="8"/>
  <text class="dg-on-hot dg-code" x="580" y="236" dy="0.35em" text-anchor="middle">cake-1600.jpg</text>

  <text class="dg-note" x="340" y="284" dy="0.35em" text-anchor="middle">Each picks the smallest file at least as wide as it needs.</text>
</svg>
