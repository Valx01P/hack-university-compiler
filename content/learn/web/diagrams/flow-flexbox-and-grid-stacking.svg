<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>Two stacking contexts: a menu's high z-index stays inside its header</title>
  <desc>The page holds two stacking contexts side by side. The header's group has z-index 1 and holds the header box and a menu with z-index 9999. Main's group has z-index 2. Groups are painted in order of their own z-index, so all of main is painted after the whole header group, and the menu ends up under main despite its 9999.</desc>

  <rect class="dg-frame" x="20" y="20" width="640" height="340" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">The page</text>

  <!-- Header's stacking context. -->
  <rect class="dg-frame" x="40" y="68" width="280" height="216" rx="12"/>
  <text class="dg-heading" x="60" y="92" dy="0.35em">Header's group</text>
  <text class="dg-code" x="300" y="92" dy="0.35em" text-anchor="end">z-index: 1</text>
  <rect class="dg-box" x="60" y="116" width="240" height="56" rx="8"/>
  <text x="180" y="135" dy="0.35em" text-anchor="middle">header
    <tspan class="dg-note" x="180" dy="1.4em">the box itself</tspan>
  </text>
  <rect class="dg-hot" x="60" y="188" width="240" height="56" rx="8"/>
  <text class="dg-on-hot" x="180" y="207" dy="0.35em" text-anchor="middle">menu
    <tspan x="180" dy="1.4em">z-index: 9999</tspan>
  </text>
  <text class="dg-note" x="180" y="264" dy="0.35em" text-anchor="middle">only beats the header's children</text>

  <!-- Main's stacking context. -->
  <rect class="dg-frame" x="360" y="68" width="280" height="216" rx="12"/>
  <text class="dg-heading" x="380" y="92" dy="0.35em">Main's group</text>
  <text class="dg-code" x="620" y="92" dy="0.35em" text-anchor="end">z-index: 2</text>
  <rect class="dg-strong" x="380" y="116" width="240" height="128" rx="8"/>
  <text x="500" y="171" dy="0.35em" text-anchor="middle">main
    <tspan class="dg-note" x="500" dy="1.4em">covers the whole header group</tspan>
  </text>
  <text class="dg-note" x="500" y="264" dy="0.35em" text-anchor="middle">one layer, painted after the header's</text>

  <!-- Paint order. -->
  <path class="dg-flow" d="M60 308 H616" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="60" y="332" dy="0.35em">painted first, underneath</text>
  <text class="dg-note" x="620" y="332" dy="0.35em" text-anchor="end">painted last, on top</text>
</svg>
