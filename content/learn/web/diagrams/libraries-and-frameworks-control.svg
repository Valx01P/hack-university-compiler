<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>You call a library, and a framework calls your code</title>
  <desc>On the left, your code sits on top and calls a library when it needs something, then carries on. On the right, the framework sits on top and calls three pieces of your code when it decides to: when the page starts, when the data changes, and when the reader moves to another page.</desc>

  <!-- A library. -->
  <rect class="dg-frame" x="20" y="20" width="300" height="260" rx="12"/>
  <text class="dg-heading" x="40" y="46" dy="0.35em">Library</text>
  <rect class="dg-hot" x="70" y="72" width="200" height="56" rx="8"/>
  <text class="dg-on-hot" x="170" y="100" dy="0.35em" text-anchor="middle">Your code</text>
  <path class="dg-flow" d="M150 128 V184" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M190 188 V132" marker-end="url(#arrow)"/>
  <text class="dg-note" x="140" y="156" dy="0.35em" text-anchor="end">calls</text>
  <text class="dg-note" x="200" y="156" dy="0.35em">answers</text>
  <rect class="dg-box" x="70" y="188" width="200" height="56" rx="8"/>
  <text x="170" y="216" dy="0.35em" text-anchor="middle">date-fns</text>

  <!-- A framework. -->
  <rect class="dg-frame" x="360" y="20" width="300" height="260" rx="12"/>
  <text class="dg-heading" x="380" y="46" dy="0.35em">Framework</text>
  <rect class="dg-strong" x="410" y="72" width="200" height="56" rx="8"/>
  <text x="510" y="100" dy="0.35em" text-anchor="middle">React</text>
  <path class="dg-flow" d="M510 128 V148 H430 V184" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M510 148 V184" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M510 148 H590 V184" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="380" y="188" width="80" height="56" rx="8"/>
  <text class="dg-on-hot" x="420" y="207" dy="0.35em" text-anchor="middle">your
    <tspan x="420" dy="1.4em">code</tspan>
  </text>
  <rect class="dg-hot" x="470" y="188" width="80" height="56" rx="8"/>
  <text class="dg-on-hot" x="510" y="207" dy="0.35em" text-anchor="middle">your
    <tspan x="510" dy="1.4em">code</tspan>
  </text>
  <rect class="dg-hot" x="560" y="188" width="80" height="56" rx="8"/>
  <text class="dg-on-hot" x="600" y="207" dy="0.35em" text-anchor="middle">your
    <tspan x="600" dy="1.4em">code</tspan>
  </text>
  <text class="dg-note" x="510" y="262" dy="0.35em" text-anchor="middle">it decides when each one runs</text>
</svg>
