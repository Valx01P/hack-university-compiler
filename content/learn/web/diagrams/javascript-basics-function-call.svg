<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Calling a function: an argument goes in, a return value comes out</title>
  <desc>The call shippingCost(42) hands the argument 42 to the function, where it becomes the parameter total. In step 2 the body runs with total as 42, and the condition total at least 50 is false. In step 3, return 5 sends 5 back, and the call is replaced by 5 where it was written.</desc>

  <!-- The call. -->
  <text class="dg-note" x="110" y="108" dy="0.35em" text-anchor="middle">the call</text>
  <rect class="dg-strong" x="20" y="124" width="180" height="56" rx="8"/>
  <text class="dg-code" x="110" y="152" dy="0.35em" text-anchor="middle">shippingCost(42)</text>
  <text class="dg-note" x="110" y="200" dy="0.35em" text-anchor="middle">becomes 5</text>

  <!-- The function. -->
  <rect class="dg-frame" x="300" y="20" width="360" height="260" rx="12"/>
  <text class="dg-code" x="320" y="44" dy="0.35em">function shippingCost(total)</text>
  <rect class="dg-box" x="320" y="68" width="320" height="40" rx="8"/>
  <text class="dg-code" x="480" y="88" dy="0.35em" text-anchor="middle">total = 42</text>
  <rect class="dg-hot" x="320" y="132" width="320" height="56" rx="8"/>
  <text class="dg-on-hot" x="480" y="151" dy="0.35em" text-anchor="middle">the body runs
    <tspan x="480" dy="1.4em">total &gt;= 50 is false</tspan>
  </text>
  <rect class="dg-box" x="320" y="216" width="320" height="40" rx="8"/>
  <text class="dg-code" x="480" y="236" dy="0.35em" text-anchor="middle">return 5</text>

  <!-- Step 1: the argument goes in. -->
  <path class="dg-flow" d="M200 140 H250 V88 H316" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="250" cy="114" r="10"/>
  <text class="dg-on-badge" x="250" y="114" dy="0.35em" text-anchor="middle">1</text>

  <!-- Step 2: the body runs. -->
  <path class="dg-flow" d="M480 108 V128" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="456" cy="118" r="10"/>
  <text class="dg-on-badge" x="456" y="118" dy="0.35em" text-anchor="middle">2</text>
  <path class="dg-line" d="M480 188 V212" marker-end="url(#arrow)"/>

  <!-- Step 3: the value comes back. -->
  <path class="dg-flow dg-dashed" d="M320 236 H250 V164 H204" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="250" cy="200" r="10"/>
  <text class="dg-on-badge" x="250" y="200" dy="0.35em" text-anchor="middle">3</text>
</svg>
