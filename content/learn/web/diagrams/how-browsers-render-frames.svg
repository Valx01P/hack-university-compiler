<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>Frames every 16 milliseconds, and a long task that drops three of them</title>
  <desc>A timeline of eight frame slots, each about 16 milliseconds. In the first three, the main thread does a little work and a frame is ready on time: frames 1, 2, and 3. Then a long task holds the main thread for about 60 milliseconds. The next three frames are dropped, and the screen keeps showing frame 3. When the task ends, frames 4 and 5 are made.</desc>

  <!-- Frame deadlines. -->
  <text class="dg-note" x="190" y="36" dy="0.35em" text-anchor="middle">one frame, 16 ms</text>
  <path class="dg-line dg-dashed" d="M160 52 V172"/>
  <path class="dg-line dg-dashed" d="M220 52 V172"/>
  <path class="dg-line dg-dashed" d="M280 52 V172"/>
  <path class="dg-line dg-dashed" d="M340 52 V172"/>
  <path class="dg-line dg-dashed" d="M400 52 V172"/>
  <path class="dg-line dg-dashed" d="M460 52 V172"/>
  <path class="dg-line dg-dashed" d="M520 52 V172"/>
  <path class="dg-line dg-dashed" d="M580 52 V172"/>
  <path class="dg-line dg-dashed" d="M640 52 V172"/>

  <!-- The main thread. -->
  <text x="20" y="84" dy="0.35em">Main thread</text>
  <rect class="dg-box" x="164" y="68" width="24" height="32" rx="4"/>
  <rect class="dg-box" x="224" y="68" width="24" height="32" rx="4"/>
  <rect class="dg-box" x="284" y="68" width="24" height="32" rx="4"/>
  <rect class="dg-hot" x="344" y="68" width="212" height="32" rx="4"/>
  <text class="dg-on-hot" x="450" y="84" dy="0.35em" text-anchor="middle">long task, 60 ms</text>
  <rect class="dg-box" x="560" y="68" width="16" height="32" rx="4"/>
  <rect class="dg-box" x="584" y="68" width="24" height="32" rx="4"/>

  <!-- The frames. -->
  <text x="20" y="148" dy="0.35em">Frames</text>
  <rect class="dg-strong" x="166" y="128" width="48" height="40" rx="8"/>
  <text x="190" y="148" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-strong" x="226" y="128" width="48" height="40" rx="8"/>
  <text x="250" y="148" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-strong" x="286" y="128" width="48" height="40" rx="8"/>
  <text x="310" y="148" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-off" x="346" y="128" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="370" y="148" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-off" x="406" y="128" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="430" y="148" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-off" x="466" y="128" width="48" height="40" rx="8"/>
  <text class="dg-faint" x="490" y="148" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-strong" x="526" y="128" width="48" height="40" rx="8"/>
  <text x="550" y="148" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-strong" x="586" y="128" width="48" height="40" rx="8"/>
  <text x="610" y="148" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-note" x="430" y="190" dy="0.35em" text-anchor="middle">dropped: frame 3 stays on screen</text>

  <!-- Time. -->
  <path class="dg-line" d="M160 216 H640"/>
  <path class="dg-line" d="M160 212 V220"/>
  <path class="dg-line" d="M340 212 V220"/>
  <path class="dg-line" d="M520 212 V220"/>
  <text class="dg-note" x="160" y="236" dy="0.35em" text-anchor="middle">0</text>
  <text class="dg-note" x="340" y="236" dy="0.35em" text-anchor="middle">50</text>
  <text class="dg-note" x="520" y="236" dy="0.35em" text-anchor="middle">100 ms</text>
</svg>
