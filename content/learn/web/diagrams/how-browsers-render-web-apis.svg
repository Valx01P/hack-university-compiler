<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The JavaScript engine, with the browser's Web APIs around it</title>
  <desc>Inside the browser, the host, the JavaScript engine sits in the middle and runs the language itself. Around it are the Web APIs the browser adds: the DOM, the CSSOM, fetch, and storage above it, and history, timers, workers, and media below it. The event loop hands the engine waiting code to run, one piece at a time. Node.js puts other APIs around the same engine.</desc>

  <rect class="dg-frame" x="20" y="20" width="640" height="320" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">The browser, the host</text>

  <!-- Web APIs, above. -->
  <rect class="dg-box" x="44" y="64" width="136" height="40" rx="8"/>
  <text x="112" y="84" dy="0.35em" text-anchor="middle">DOM</text>
  <rect class="dg-box" x="196" y="64" width="136" height="40" rx="8"/>
  <text x="264" y="84" dy="0.35em" text-anchor="middle">CSSOM</text>
  <rect class="dg-box" x="348" y="64" width="136" height="40" rx="8"/>
  <text x="416" y="84" dy="0.35em" text-anchor="middle">Fetch</text>
  <rect class="dg-box" x="500" y="64" width="136" height="40" rx="8"/>
  <text x="568" y="84" dy="0.35em" text-anchor="middle">Storage</text>
  <path class="dg-line" d="M112 104 V128 H568 V104"/>
  <path class="dg-line" d="M264 104 V128"/>
  <path class="dg-line" d="M416 104 V128"/>
  <path class="dg-line" d="M290 128 V150"/>

  <!-- The engine, and the event loop. -->
  <rect class="dg-hot" x="180" y="150" width="220" height="56" rx="8"/>
  <text class="dg-on-hot" x="290" y="168" dy="0.35em" text-anchor="middle">JavaScript engine
    <tspan x="290" dy="1.4em">the language itself</tspan>
  </text>
  <rect class="dg-strong" x="460" y="150" width="176" height="56" rx="8"/>
  <text x="548" y="168" dy="0.35em" text-anchor="middle">Event loop
    <tspan class="dg-note" x="548" dy="1.4em">runs waiting code</tspan>
  </text>
  <path class="dg-flow" d="M460 178 H404" marker-end="url(#arrow-flow)"/>

  <!-- Web APIs, below. -->
  <path class="dg-line" d="M290 206 V230"/>
  <path class="dg-line" d="M112 252 V230 H568 V252"/>
  <path class="dg-line" d="M264 230 V252"/>
  <path class="dg-line" d="M416 230 V252"/>
  <rect class="dg-box" x="44" y="252" width="136" height="40" rx="8"/>
  <text x="112" y="272" dy="0.35em" text-anchor="middle">History</text>
  <rect class="dg-box" x="196" y="252" width="136" height="40" rx="8"/>
  <text x="264" y="272" dy="0.35em" text-anchor="middle">Timers</text>
  <rect class="dg-box" x="348" y="252" width="136" height="40" rx="8"/>
  <text x="416" y="272" dy="0.35em" text-anchor="middle">Workers</text>
  <rect class="dg-box" x="500" y="252" width="136" height="40" rx="8"/>
  <text x="568" y="272" dy="0.35em" text-anchor="middle">Media</text>
  <text class="dg-note" x="340" y="316" dy="0.35em" text-anchor="middle">Node.js puts other APIs around the same engine</text>
</svg>
