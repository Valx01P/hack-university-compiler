<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <title>The bakery page's DOM, next to the accessibility tree built from it</title>
  <desc>Each element on the left becomes a node on the right with a role and, often, a name. The header becomes the banner landmark, nav becomes navigation, main stays main, and footer becomes contentinfo. The link is a link named Mia's Bakery, the h1 is a heading named Fresh bread daily at level 1, details is a group, and its summary is a disclosure triangle named Opening hours.</desc>

  <rect class="dg-frame" x="20" y="20" width="200" height="420" rx="12"/>
  <text class="dg-heading" x="36" y="44" dy="0.35em">DOM</text>
  <rect class="dg-frame" x="280" y="20" width="380" height="420" rx="12"/>
  <text class="dg-heading" x="296" y="44" dy="0.35em">Accessibility tree</text>

  <text class="dg-code" x="40" y="84" dy="0.35em">header</text>
  <path class="dg-line" d="M224 84 H276" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="292" y="72" width="68" height="24" rx="6"/>
  <text class="dg-on-hot" x="300" y="84" dy="0.35em">banner</text>
  <text class="dg-code" x="58" y="116" dy="0.35em">a</text>
  <path class="dg-line" d="M224 116 H276" marker-end="url(#arrow)"/>
  <text x="318" y="116" dy="0.35em">link</text>
  <text class="dg-note" x="361" y="116" dy="0.35em">"Mia's Bakery"</text>
  <text class="dg-code" x="58" y="148" dy="0.35em">nav</text>
  <path class="dg-line" d="M224 148 H276" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="310" y="136" width="102" height="24" rx="6"/>
  <text class="dg-on-hot" x="318" y="148" dy="0.35em">navigation</text>
  <text class="dg-code" x="76" y="180" dy="0.35em">ul</text>
  <path class="dg-line" d="M224 180 H276" marker-end="url(#arrow)"/>
  <text x="336" y="180" dy="0.35em">list</text>
  <text class="dg-note" x="379" y="180" dy="0.35em">two links inside</text>
  <text class="dg-code" x="40" y="212" dy="0.35em">main</text>
  <path class="dg-line" d="M224 212 H276" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="292" y="200" width="50" height="24" rx="6"/>
  <text class="dg-on-hot" x="300" y="212" dy="0.35em">main</text>
  <text class="dg-code" x="58" y="244" dy="0.35em">h1</text>
  <path class="dg-line" d="M224 244 H276" marker-end="url(#arrow)"/>
  <text x="318" y="244" dy="0.35em">heading</text>
  <text class="dg-note" x="382" y="244" dy="0.35em">"Fresh bread daily", level 1</text>
  <text class="dg-code" x="58" y="276" dy="0.35em">p</text>
  <path class="dg-line" d="M224 276 H276" marker-end="url(#arrow)"/>
  <text x="318" y="276" dy="0.35em">paragraph</text>
  <text class="dg-code" x="58" y="308" dy="0.35em">details</text>
  <path class="dg-line" d="M224 308 H276" marker-end="url(#arrow)"/>
  <text x="318" y="308" dy="0.35em">group</text>
  <text class="dg-code" x="76" y="340" dy="0.35em">summary</text>
  <path class="dg-line" d="M224 340 H276" marker-end="url(#arrow)"/>
  <text x="336" y="340" dy="0.35em">disclosure triangle</text>
  <text class="dg-note" x="487" y="340" dy="0.35em">"Opening hours"</text>
  <text class="dg-code" x="40" y="372" dy="0.35em">footer</text>
  <path class="dg-line" d="M224 372 H276" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="292" y="360" width="111" height="24" rx="6"/>
  <text class="dg-on-hot" x="300" y="372" dy="0.35em">contentinfo</text>
  <text class="dg-code" x="58" y="404" dy="0.35em">p</text>
  <path class="dg-line" d="M224 404 H276" marker-end="url(#arrow)"/>
  <text x="318" y="404" dy="0.35em">paragraph</text>
</svg>
