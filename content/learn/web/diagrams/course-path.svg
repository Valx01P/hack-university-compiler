<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 660">
  <title>The course's path, from how the web works to libraries and frameworks</title>
  <desc>The course in seven stops, in three stretches. To understand how pages reach you: how the web works, then how a browser draws a page. To build: the three languages, HTML for what's on a page, CSS for how it looks, and JavaScript for what it does. To go further: shipping your code with npm and Vite, then libraries and frameworks, Bootstrap, jQuery, and Tailwind. After the course come React, Next.js, and the backend courses.</desc>

  <!-- Understand. -->
  <text class="dg-heading" x="72" y="32" dy="0.35em">Understand <tspan class="dg-note">how pages reach you</tspan></text>
  <circle class="dg-badge" cx="40" cy="78" r="10"/>
  <text class="dg-on-badge" x="40" y="78" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-hot" x="72" y="52" width="380" height="52" rx="8"/>
  <text class="dg-on-hot" x="92" y="68" dy="0.35em">How the web works
    <tspan x="92" dy="1.4em">what happens when you open a page</tspan>
  </text>
  <path class="dg-flow" d="M40 88 V128" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="40" cy="142" r="10"/>
  <text class="dg-on-badge" x="40" y="142" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="72" y="116" width="380" height="52" rx="8"/>
  <text x="92" y="133" dy="0.35em">How a browser draws a page
    <tspan class="dg-note" x="92" dy="1.4em">from the files it gets to pixels on screen</tspan>
  </text>
  <path class="dg-flow" d="M40 152 V232" marker-end="url(#arrow-flow)"/>

  <!-- Build. -->
  <text class="dg-heading" x="72" y="200" dy="0.35em">Build <tspan class="dg-note">the three languages</tspan></text>
  <circle class="dg-badge" cx="40" cy="246" r="10"/>
  <text class="dg-on-badge" x="40" y="246" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="72" y="220" width="380" height="52" rx="8"/>
  <text x="92" y="237" dy="0.35em">HTML
    <tspan class="dg-note" x="92" dy="1.4em">what's on it: text, links, pictures, forms</tspan>
  </text>
  <path class="dg-flow" d="M40 256 V296" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="40" cy="310" r="10"/>
  <text class="dg-on-badge" x="40" y="310" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-box" x="72" y="284" width="380" height="52" rx="8"/>
  <text x="92" y="301" dy="0.35em">CSS
    <tspan class="dg-note" x="92" dy="1.4em">how it looks: color, spacing, layout</tspan>
  </text>
  <path class="dg-flow" d="M40 320 V360" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="40" cy="374" r="10"/>
  <text class="dg-on-badge" x="40" y="374" dy="0.35em" text-anchor="middle">5</text>
  <rect class="dg-box" x="72" y="348" width="380" height="52" rx="8"/>
  <text x="92" y="365" dy="0.35em">JavaScript
    <tspan class="dg-note" x="92" dy="1.4em">what it does: clicks, typing, fresh data</tspan>
  </text>
  <path class="dg-flow" d="M40 384 V464" marker-end="url(#arrow-flow)"/>

  <!-- Go further. -->
  <text class="dg-heading" x="72" y="432" dy="0.35em">Go further <tspan class="dg-note">tools teams use</tspan></text>
  <circle class="dg-badge" cx="40" cy="478" r="10"/>
  <text class="dg-on-badge" x="40" y="478" dy="0.35em" text-anchor="middle">6</text>
  <rect class="dg-box" x="72" y="452" width="380" height="52" rx="8"/>
  <text x="92" y="469" dy="0.35em">Shipping your code
    <tspan class="dg-note" x="92" dy="1.4em">npm and Vite get your files out fast</tspan>
  </text>
  <path class="dg-flow" d="M40 488 V528" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="40" cy="542" r="10"/>
  <text class="dg-on-badge" x="40" y="542" dy="0.35em" text-anchor="middle">7</text>
  <rect class="dg-box" x="72" y="516" width="380" height="52" rx="8"/>
  <text x="92" y="533" dy="0.35em">Libraries and frameworks
    <tspan class="dg-note" x="92" dy="1.4em">Bootstrap, jQuery, and Tailwind</tspan>
  </text>

  <!-- After the course. -->
  <path class="dg-line dg-dashed" d="M40 552 V620 H68" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="72" y="600" width="380" height="40" rx="8"/>
  <text class="dg-faint" x="92" y="620" dy="0.35em">Next: React, Next.js, and the backend courses</text>
</svg>
