<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>Who reads each line of the head</title>
  <desc>Each line of the head, and who uses it. The browser reads the charset, the viewport, the title for the tab, the stylesheet, the icon, and the script. Search engines read the title as the headline, the description as the snippet, and the icon. Link previews read the Open Graph tags for the card, and fall back to the title and the description.</desc>

  <text class="dg-heading" x="340" y="36" dy="0.35em" text-anchor="middle">Browser</text>
  <text class="dg-heading" x="470" y="36" dy="0.35em" text-anchor="middle">Search engine</text>
  <text class="dg-heading" x="600" y="36" dy="0.35em" text-anchor="middle">Link preview</text>

  <text class="dg-code" x="20" y="80" dy="0.35em">&lt;meta charset="utf-8"&gt;</text>
  <rect class="dg-box" x="280" y="66" width="120" height="28" rx="8"/>
  <text class="dg-note" x="340" y="80" dy="0.35em" text-anchor="middle">reads the bytes</text>
  <text class="dg-code" x="20" y="120" dy="0.35em">&lt;meta name="viewport"&gt;</text>
  <rect class="dg-box" x="280" y="106" width="120" height="28" rx="8"/>
  <text class="dg-note" x="340" y="120" dy="0.35em" text-anchor="middle">phone width</text>
  <text class="dg-code" x="20" y="160" dy="0.35em">&lt;title&gt;</text>
  <rect class="dg-box" x="280" y="146" width="120" height="28" rx="8"/>
  <text class="dg-note" x="340" y="160" dy="0.35em" text-anchor="middle">tab, history</text>
  <rect class="dg-box" x="410" y="146" width="120" height="28" rx="8"/>
  <text class="dg-note" x="470" y="160" dy="0.35em" text-anchor="middle">headline</text>
  <rect class="dg-box" x="540" y="146" width="120" height="28" rx="8"/>
  <text class="dg-note" x="600" y="160" dy="0.35em" text-anchor="middle">if no og:title</text>
  <text class="dg-code" x="20" y="200" dy="0.35em">&lt;meta name="description"&gt;</text>
  <rect class="dg-box" x="410" y="186" width="120" height="28" rx="8"/>
  <text class="dg-note" x="470" y="200" dy="0.35em" text-anchor="middle">snippet</text>
  <rect class="dg-box" x="540" y="186" width="120" height="28" rx="8"/>
  <text class="dg-note" x="600" y="200" dy="0.35em" text-anchor="middle">fallback text</text>
  <text class="dg-code" x="20" y="240" dy="0.35em">&lt;link rel="stylesheet"&gt;</text>
  <rect class="dg-box" x="280" y="226" width="120" height="28" rx="8"/>
  <text class="dg-note" x="340" y="240" dy="0.35em" text-anchor="middle">loads the CSS</text>
  <text class="dg-code" x="20" y="280" dy="0.35em">&lt;link rel="icon"&gt;</text>
  <rect class="dg-box" x="280" y="266" width="120" height="28" rx="8"/>
  <text class="dg-note" x="340" y="280" dy="0.35em" text-anchor="middle">tab icon</text>
  <rect class="dg-box" x="410" y="266" width="120" height="28" rx="8"/>
  <text class="dg-note" x="470" y="280" dy="0.35em" text-anchor="middle">next to results</text>
  <text class="dg-code" x="20" y="320" dy="0.35em">&lt;meta property="og:..."&gt;</text>
  <rect class="dg-box" x="540" y="306" width="120" height="28" rx="8"/>
  <text class="dg-note" x="600" y="320" dy="0.35em" text-anchor="middle">card contents</text>
  <text class="dg-code" x="20" y="360" dy="0.35em">&lt;script defer&gt;</text>
  <rect class="dg-box" x="280" y="346" width="120" height="28" rx="8"/>
  <text class="dg-note" x="340" y="360" dy="0.35em" text-anchor="middle">runs it later</text>
</svg>
