<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A CORS preflight, then the real request</title>
  <desc>A page on localhost:8001 sends a JSON POST to the notes server on localhost:8000. In step 1 the browser first sends an OPTIONS request saying its origin and what it wants to send. In step 2 the server answers 204 No Content with the origins, methods, and headers it allows. In step 3 the browser sends the real POST. In step 4 the server answers 201 Created with Access-Control-Allow-Origin, so the page can read it.</desc>

  <rect class="dg-strong" x="20" y="20" width="200" height="56" rx="8"/>
  <text x="120" y="39" dy="0.35em" text-anchor="middle">Browser
    <tspan class="dg-note" x="120" dy="1.4em">page on localhost:8001</tspan>
  </text>
  <rect class="dg-box" x="460" y="20" width="200" height="56" rx="8"/>
  <text x="560" y="39" dy="0.35em" text-anchor="middle">Notes server
    <tspan class="dg-note" x="560" dy="1.4em">localhost:8000</tspan>
  </text>
  <path class="dg-line dg-dashed" d="M120 76 V324"/>
  <path class="dg-line dg-dashed" d="M560 76 V324"/>

  <!-- Step 1. -->
  <circle class="dg-badge" cx="96" cy="116" r="10"/>
  <text class="dg-on-badge" x="96" y="116" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="340" y="102" dy="0.35em" text-anchor="middle">OPTIONS /api/notes</text>
  <path class="dg-flow" d="M120 116 H556" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="132" dy="0.35em" text-anchor="middle">its origin, and the method and headers it wants</text>

  <!-- Step 2. -->
  <circle class="dg-badge" cx="96" cy="176" r="10"/>
  <text class="dg-on-badge" x="96" y="176" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="340" y="162" dy="0.35em" text-anchor="middle">204 No Content</text>
  <path class="dg-line dg-dashed" d="M560 176 H124" marker-end="url(#arrow)"/>
  <text class="dg-note" x="340" y="192" dy="0.35em" text-anchor="middle">the origins, methods, and headers it allows</text>

  <!-- Step 3. -->
  <circle class="dg-badge" cx="96" cy="236" r="10"/>
  <text class="dg-on-badge" x="96" y="236" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="340" y="222" dy="0.35em" text-anchor="middle">POST /api/notes</text>
  <path class="dg-flow" d="M120 236 H556" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="252" dy="0.35em" text-anchor="middle">the real request, with its JSON body</text>

  <!-- Step 4. -->
  <circle class="dg-badge" cx="96" cy="296" r="10"/>
  <text class="dg-on-badge" x="96" y="296" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="340" y="282" dy="0.35em" text-anchor="middle">201 Created</text>
  <path class="dg-line dg-dashed" d="M560 296 H124" marker-end="url(#arrow)"/>
  <text class="dg-note" x="340" y="312" dy="0.35em" text-anchor="middle">with Access-Control-Allow-Origin, so the page can read it</text>
</svg>
