<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <title>Three cards with col-12 col-md-6 col-lg-4, at three screen widths</title>
  <desc>A row is split into 12 parts. Below 768 pixels, each of the three cards takes all 12, so they stack. From 768 pixels, each takes 6, so two share a row and the third wraps below. From 992 pixels, each takes 4, and all three fit in one row.</desc>

  <!-- The 12 parts of a row. -->
  <rect class="dg-off" x="42" y="20" width="46" height="24" rx="4"/>
  <text class="dg-faint" x="65" y="32" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-off" x="92" y="20" width="46" height="24" rx="4"/>
  <text class="dg-faint" x="115" y="32" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-off" x="142" y="20" width="46" height="24" rx="4"/>
  <text class="dg-faint" x="165" y="32" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-off" x="192" y="20" width="46" height="24" rx="4"/>
  <text class="dg-faint" x="215" y="32" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-off" x="242" y="20" width="46" height="24" rx="4"/>
  <text class="dg-faint" x="265" y="32" dy="0.35em" text-anchor="middle">5</text>
  <rect class="dg-off" x="292" y="20" width="46" height="24" rx="4"/>
  <text class="dg-faint" x="315" y="32" dy="0.35em" text-anchor="middle">6</text>
  <rect class="dg-off" x="342" y="20" width="46" height="24" rx="4"/>
  <text class="dg-faint" x="365" y="32" dy="0.35em" text-anchor="middle">7</text>
  <rect class="dg-off" x="392" y="20" width="46" height="24" rx="4"/>
  <text class="dg-faint" x="415" y="32" dy="0.35em" text-anchor="middle">8</text>
  <rect class="dg-off" x="442" y="20" width="46" height="24" rx="4"/>
  <text class="dg-faint" x="465" y="32" dy="0.35em" text-anchor="middle">9</text>
  <rect class="dg-off" x="492" y="20" width="46" height="24" rx="4"/>
  <text class="dg-faint" x="515" y="32" dy="0.35em" text-anchor="middle">10</text>
  <rect class="dg-off" x="542" y="20" width="46" height="24" rx="4"/>
  <text class="dg-faint" x="565" y="32" dy="0.35em" text-anchor="middle">11</text>
  <rect class="dg-off" x="592" y="20" width="46" height="24" rx="4"/>
  <text class="dg-faint" x="615" y="32" dy="0.35em" text-anchor="middle">12</text>

  <!-- Phones: each card takes all 12 parts. -->
  <rect class="dg-frame" x="20" y="60" width="640" height="160" rx="12"/>
  <text class="dg-heading" x="40" y="80" dy="0.35em">Under 768px</text>
  <text class="dg-code" x="640" y="80" dy="0.35em" text-anchor="end">col-12</text>
  <rect class="dg-strong" x="44" y="96" width="592" height="32" rx="6"/>
  <text x="340" y="112" dy="0.35em" text-anchor="middle">Lake Loop</text>
  <rect class="dg-strong" x="44" y="136" width="592" height="32" rx="6"/>
  <text x="340" y="152" dy="0.35em" text-anchor="middle">Ridge Trail</text>
  <rect class="dg-strong" x="44" y="176" width="592" height="32" rx="6"/>
  <text x="340" y="192" dy="0.35em" text-anchor="middle">North Loop</text>

  <!-- From medium screens: 6 parts each, so the third wraps. -->
  <rect class="dg-frame" x="20" y="236" width="640" height="120" rx="12"/>
  <text class="dg-heading" x="40" y="256" dy="0.35em">768px and up</text>
  <text class="dg-code" x="640" y="256" dy="0.35em" text-anchor="end">col-md-6</text>
  <rect class="dg-strong" x="44" y="272" width="292" height="32" rx="6"/>
  <text x="190" y="288" dy="0.35em" text-anchor="middle">Lake Loop</text>
  <rect class="dg-strong" x="344" y="272" width="292" height="32" rx="6"/>
  <text x="490" y="288" dy="0.35em" text-anchor="middle">Ridge Trail</text>
  <rect class="dg-strong" x="44" y="312" width="292" height="32" rx="6"/>
  <text x="190" y="328" dy="0.35em" text-anchor="middle">North Loop</text>

  <!-- From large screens: 4 parts each, all in one row. -->
  <rect class="dg-frame" x="20" y="372" width="640" height="80" rx="12"/>
  <text class="dg-heading" x="40" y="392" dy="0.35em">992px and up</text>
  <text class="dg-code" x="640" y="392" dy="0.35em" text-anchor="end">col-lg-4</text>
  <rect class="dg-strong" x="44" y="408" width="192" height="32" rx="6"/>
  <text x="140" y="424" dy="0.35em" text-anchor="middle">Lake Loop</text>
  <rect class="dg-strong" x="244" y="408" width="192" height="32" rx="6"/>
  <text x="340" y="424" dy="0.35em" text-anchor="middle">Ridge Trail</text>
  <rect class="dg-strong" x="444" y="408" width="192" height="32" rx="6"/>
  <text x="540" y="424" dy="0.35em" text-anchor="middle">North Loop</text>
</svg>
