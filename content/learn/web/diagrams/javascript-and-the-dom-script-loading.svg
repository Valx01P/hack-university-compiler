<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>When a classic, a deferred, and an async script download and run</title>
  <desc>Three timelines for the same page, each with the parser on top and the script below. A classic script stops the parser while it downloads and runs. A deferred script downloads while the parser keeps going, and runs after parsing ends. An async script downloads while the parser keeps going, then runs as soon as it arrives, pausing the parser while it runs.</desc>

  <!-- Classic. -->
  <text x="20" y="76" dy="0.35em">Classic
    <tspan class="dg-note" x="20" dy="1.4em">parser waits</tspan>
  </text>
  <rect class="dg-box" x="140" y="40" width="120" height="40" rx="8"/>
  <text x="200" y="60" dy="0.35em" text-anchor="middle">parse</text>
  <rect class="dg-off" x="260" y="40" width="180" height="40" rx="8"/>
  <text class="dg-faint" x="350" y="60" dy="0.35em" text-anchor="middle">waiting</text>
  <rect class="dg-box" x="440" y="40" width="220" height="40" rx="8"/>
  <text x="550" y="60" dy="0.35em" text-anchor="middle">parse HTML</text>
  <rect class="dg-box" x="260" y="88" width="120" height="40" rx="8"/>
  <text x="320" y="108" dy="0.35em" text-anchor="middle">download</text>
  <rect class="dg-hot" x="380" y="88" width="60" height="40" rx="8"/>
  <text class="dg-on-hot" x="410" y="108" dy="0.35em" text-anchor="middle">run</text>

  <!-- defer. -->
  <text x="20" y="196" dy="0.35em"><tspan class="dg-code">defer</tspan>
    <tspan class="dg-note" x="20" dy="1.4em">runs after</tspan>
  </text>
  <rect class="dg-box" x="140" y="160" width="340" height="40" rx="8"/>
  <text x="310" y="180" dy="0.35em" text-anchor="middle">parse HTML</text>
  <rect class="dg-box" x="260" y="208" width="120" height="40" rx="8"/>
  <text x="320" y="228" dy="0.35em" text-anchor="middle">download</text>
  <rect class="dg-hot" x="480" y="208" width="60" height="40" rx="8"/>
  <text class="dg-on-hot" x="510" y="228" dy="0.35em" text-anchor="middle">run</text>

  <!-- async. -->
  <text x="20" y="316" dy="0.35em"><tspan class="dg-code">async</tspan>
    <tspan class="dg-note" x="20" dy="1.4em">runs when ready</tspan>
  </text>
  <rect class="dg-box" x="140" y="280" width="240" height="40" rx="8"/>
  <text x="260" y="300" dy="0.35em" text-anchor="middle">parse HTML</text>
  <rect class="dg-off" x="380" y="280" width="60" height="40" rx="8"/>
  <rect class="dg-box" x="440" y="280" width="100" height="40" rx="8"/>
  <text x="490" y="300" dy="0.35em" text-anchor="middle">parse</text>
  <rect class="dg-box" x="260" y="328" width="120" height="40" rx="8"/>
  <text x="320" y="348" dy="0.35em" text-anchor="middle">download</text>
  <rect class="dg-hot" x="380" y="328" width="60" height="40" rx="8"/>
  <text class="dg-on-hot" x="410" y="348" dy="0.35em" text-anchor="middle">run</text>

  <!-- Time. -->
  <path class="dg-line" d="M140 392 H656" marker-end="url(#arrow)"/>
  <text class="dg-note" x="140" y="408" dy="0.35em">time</text>
</svg>
