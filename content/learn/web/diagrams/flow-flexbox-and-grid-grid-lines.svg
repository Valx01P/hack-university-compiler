<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>A three-column grid with numbered lines and named areas</title>
  <desc>A grid of three columns and three rows. Four column lines, numbered 1 to 4, run down between and around the columns. The header area spans all three columns, from line 1 to line 4. In the middle row, the sidebar fills the first column, from line 1 to 2, and main spans the other two, from line 2 to 4. The footer spans the whole width.</desc>

  <text class="dg-note" x="60" y="26" dy="0.35em">column lines</text>
  <text class="dg-code" x="60" y="50" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="220" y="50" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="420" y="50" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="620" y="50" dy="0.35em" text-anchor="middle">4</text>
  <path class="dg-line dg-dashed" d="M60 64 V348"/>
  <path class="dg-line dg-dashed" d="M220 64 V348"/>
  <path class="dg-line dg-dashed" d="M420 64 V348"/>
  <path class="dg-line dg-dashed" d="M620 64 V348"/>

  <rect class="dg-hot" x="64" y="72" width="552" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="91" dy="0.35em" text-anchor="middle">header
    <tspan x="340" dy="1.4em">line 1 to line 4</tspan>
  </text>

  <rect class="dg-box" x="64" y="136" width="152" height="148" rx="8"/>
  <text x="140" y="201" dy="0.35em" text-anchor="middle">sidebar
    <tspan class="dg-note" x="140" dy="1.4em">line 1 to line 2</tspan>
  </text>

  <rect class="dg-strong" x="224" y="136" width="392" height="148" rx="8"/>
  <text x="420" y="201" dy="0.35em" text-anchor="middle">main
    <tspan class="dg-note" x="420" dy="1.4em">line 2 to line 4</tspan>
  </text>

  <rect class="dg-box" x="64" y="292" width="552" height="48" rx="8"/>
  <text x="340" y="316" dy="0.35em" text-anchor="middle">footer</text>
</svg>
