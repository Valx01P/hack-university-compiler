<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180">
  <title>The parts of the class md:hover:bg-blue-700</title>
  <desc>The class md:hover:bg-blue-700 splits into four parts. The two variants say when it applies: md: means from 48rem up, and hover: means while the pointer is over it. The utility says what it sets: bg means the background color, and blue-700 is the value, the blue at shade 700.</desc>

  <!-- What the two halves are. -->
  <path class="dg-line" d="M52 58 V48 H298 V58"/>
  <text class="dg-heading" x="175" y="30" dy="0.35em" text-anchor="middle">Variants: when</text>
  <path class="dg-line" d="M312 58 V48 H628 V58"/>
  <text class="dg-heading" x="470" y="30" dy="0.35em" text-anchor="middle">Utility: what</text>

  <!-- The four pieces. -->
  <rect class="dg-hot" x="50" y="70" width="120" height="44" rx="8"/>
  <text class="dg-on-hot dg-code" x="110" y="92" dy="0.35em" text-anchor="middle">md:</text>
  <rect class="dg-hot" x="180" y="70" width="120" height="44" rx="8"/>
  <text class="dg-on-hot dg-code" x="240" y="92" dy="0.35em" text-anchor="middle">hover:</text>
  <rect class="dg-strong" x="310" y="70" width="150" height="44" rx="8"/>
  <text class="dg-code" x="385" y="92" dy="0.35em" text-anchor="middle">bg-</text>
  <rect class="dg-strong" x="470" y="70" width="160" height="44" rx="8"/>
  <text class="dg-code" x="550" y="92" dy="0.35em" text-anchor="middle">blue-700</text>

  <!-- What each piece means. -->
  <text class="dg-note" x="110" y="136" dy="0.35em" text-anchor="middle">from 48rem up</text>
  <text class="dg-note" x="240" y="136" dy="0.35em" text-anchor="middle">while hovered</text>
  <text class="dg-note" x="385" y="136" dy="0.35em" text-anchor="middle">background color</text>
  <text class="dg-note" x="550" y="136" dy="0.35em" text-anchor="middle">blue, shade 700</text>
</svg>
