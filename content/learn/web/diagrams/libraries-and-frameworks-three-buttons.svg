<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>One button styled three ways: component classes, utility classes, and plain CSS</title>
  <desc>Three columns end in the same Save button. With component classes, the HTML says btn btn-primary and the styles come from Bootstrap's whole stylesheet. With utility classes, the HTML lists one class per property and Tailwind writes only the classes used. With plain CSS, the HTML says button and the styles are rules you write yourself.</desc>

  <!-- Component classes. -->
  <text class="dg-heading" x="120" y="36" dy="0.35em" text-anchor="middle">Component classes</text>
  <rect class="dg-box" x="20" y="56" width="200" height="64" rx="8"/>
  <text class="dg-code" x="120" y="88" dy="0.35em" text-anchor="middle">btn btn-primary</text>
  <path class="dg-line" d="M120 120 V144" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="20" y="148" width="200" height="56" rx="8"/>
  <text x="120" y="167" dy="0.35em" text-anchor="middle">Bootstrap's CSS
    <tspan class="dg-note" x="120" dy="1.4em">the whole stylesheet</tspan>
  </text>
  <path class="dg-line" d="M120 204 V228" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="70" y="232" width="100" height="40" rx="8"/>
  <text class="dg-on-hot" x="120" y="252" dy="0.35em" text-anchor="middle">Save</text>

  <!-- Utility classes. -->
  <text class="dg-heading" x="340" y="36" dy="0.35em" text-anchor="middle">Utility classes</text>
  <rect class="dg-box" x="240" y="56" width="200" height="64" rx="8"/>
  <text class="dg-code" x="340" y="79" dy="0.35em" text-anchor="middle">rounded-lg px-4 py-2
    <tspan x="340" dy="1.4em">bg-blue-600 text-white</tspan>
  </text>
  <path class="dg-line" d="M340 120 V144" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="240" y="148" width="200" height="56" rx="8"/>
  <text x="340" y="167" dy="0.35em" text-anchor="middle">Tailwind's output
    <tspan class="dg-note" x="340" dy="1.4em">only the classes used</tspan>
  </text>
  <path class="dg-line" d="M340 204 V228" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="290" y="232" width="100" height="40" rx="8"/>
  <text class="dg-on-hot" x="340" y="252" dy="0.35em" text-anchor="middle">Save</text>

  <!-- Plain CSS. -->
  <text class="dg-heading" x="560" y="36" dy="0.35em" text-anchor="middle">Plain CSS</text>
  <rect class="dg-box" x="460" y="56" width="200" height="64" rx="8"/>
  <text class="dg-code" x="560" y="88" dy="0.35em" text-anchor="middle">button</text>
  <path class="dg-line" d="M560 120 V144" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="460" y="148" width="200" height="56" rx="8"/>
  <text x="560" y="167" dy="0.35em" text-anchor="middle">Your CSS
    <tspan class="dg-note" x="560" dy="1.4em">rules and tokens you write</tspan>
  </text>
  <path class="dg-line" d="M560 204 V228" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="510" y="232" width="100" height="40" rx="8"/>
  <text class="dg-on-hot" x="560" y="252" dy="0.35em" text-anchor="middle">Save</text>
</svg>
