<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Each file's path is its place in the site's folder</title>
  <desc>On the left, a site's folder on the server: my-site holds index.html, about.html, a css folder with style.css, and an images folder with logo.png. On the right, each one's path in an address. The root folder is a lone slash, and asking for it gets index.html. about.html is /about.html, style.css is /css/style.css, and logo.png is /images/logo.png.</desc>

  <!-- The folder on the server. -->
  <rect class="dg-frame" x="20" y="20" width="280" height="296" rx="12"/>
  <text class="dg-heading" x="40" y="48" dy="0.35em">On the server</text>
  <text class="dg-code" x="44" y="92" dy="0.35em">my-site/</text>
  <text class="dg-note" x="116" y="92" dy="0.35em">the root</text>
  <path class="dg-line" d="M56 104 V252"/>
  <path class="dg-line" d="M56 124 H66"/>
  <text class="dg-code" x="72" y="124" dy="0.35em">index.html</text>
  <path class="dg-line" d="M56 156 H66"/>
  <text class="dg-code" x="72" y="156" dy="0.35em">about.html</text>
  <path class="dg-line" d="M56 188 H66"/>
  <text class="dg-code" x="72" y="188" dy="0.35em">css/</text>
  <path class="dg-line" d="M84 200 V220 H94"/>
  <text class="dg-code" x="100" y="220" dy="0.35em">style.css</text>
  <path class="dg-line" d="M56 252 H66"/>
  <text class="dg-code" x="72" y="252" dy="0.35em">images/</text>
  <path class="dg-line" d="M84 264 V284 H94"/>
  <text class="dg-code" x="100" y="284" dy="0.35em">logo.png</text>

  <!-- Each one's path. -->
  <path class="dg-line" d="M308 92 H376" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M308 124 H376" marker-end="url(#arrow)"/>
  <path class="dg-flow" d="M308 156 H376" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M308 188 H376" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M308 220 H376" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M308 252 H376" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M308 284 H376" marker-end="url(#arrow)"/>

  <!-- The address. -->
  <rect class="dg-frame" x="380" y="20" width="280" height="296" rx="12"/>
  <text class="dg-heading" x="400" y="48" dy="0.35em">In the address</text>
  <text class="dg-code" x="400" y="92" dy="0.35em">/</text>
  <text class="dg-note" x="420" y="92" dy="0.35em">the home page, index.html</text>
  <text class="dg-code" x="400" y="124" dy="0.35em">/index.html</text>
  <text class="dg-code" x="400" y="156" dy="0.35em">/about.html</text>
  <text class="dg-code" x="400" y="188" dy="0.35em">/css/</text>
  <text class="dg-code" x="400" y="220" dy="0.35em">/css/style.css</text>
  <text class="dg-code" x="400" y="252" dy="0.35em">/images/</text>
  <text class="dg-code" x="400" y="284" dy="0.35em">/images/logo.png</text>
</svg>
