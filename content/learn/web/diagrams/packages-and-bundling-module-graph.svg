<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>A module graph with a package in it, bundled into one JavaScript file and one stylesheet</title>
  <desc>On the left, the module graph: index.html loads main.js, which imports notes.js, style.css, and date-fns, whose main file imports 304 files of its own. A bundler follows that graph and writes two files on the right: one JavaScript file with the code the page uses, and one stylesheet made from style.css.</desc>

  <!-- The module graph. -->
  <rect class="dg-frame" x="20" y="20" width="420" height="340" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">Module graph</text>
  <rect class="dg-box" x="165" y="64" width="130" height="40" rx="8"/>
  <text class="dg-code" x="230" y="84" dy="0.35em" text-anchor="middle">index.html</text>
  <path class="dg-line" d="M230 104 V132" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="165" y="136" width="130" height="40" rx="8"/>
  <text class="dg-code" x="230" y="156" dy="0.35em" text-anchor="middle">main.js</text>
  <path class="dg-line" d="M230 176 V196 H100 V212" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M230 196 V212" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M230 196 H360 V212" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="40" y="216" width="120" height="40" rx="8"/>
  <text class="dg-code" x="100" y="236" dy="0.35em" text-anchor="middle">notes.js</text>
  <rect class="dg-box" x="170" y="216" width="120" height="40" rx="8"/>
  <text class="dg-code" x="230" y="236" dy="0.35em" text-anchor="middle">style.css</text>
  <rect class="dg-box" x="300" y="216" width="120" height="40" rx="8"/>
  <text class="dg-code" x="360" y="236" dy="0.35em" text-anchor="middle">date-fns</text>
  <path class="dg-line" d="M360 256 V292" marker-end="url(#arrow)"/>
  <!-- A stack of files: the package's own modules. -->
  <rect class="dg-box" x="308" y="304" width="112" height="40" rx="8"/>
  <rect class="dg-box" x="304" y="300" width="112" height="40" rx="8"/>
  <rect class="dg-box" x="300" y="296" width="112" height="40" rx="8"/>
  <text x="356" y="316" dy="0.35em" text-anchor="middle">304 files</text>

  <!-- The bundler's output. -->
  <path class="dg-flow" d="M440 200 H476" marker-end="url(#arrow-flow)"/>
  <rect class="dg-frame" x="480" y="20" width="180" height="340" rx="12"/>
  <text class="dg-heading" x="500" y="44" dy="0.35em">Bundles</text>
  <rect class="dg-hot" x="495" y="144" width="150" height="56" rx="8"/>
  <text class="dg-on-hot" x="570" y="163" dy="0.35em" text-anchor="middle">One JS file
    <tspan x="570" dy="1.4em">what's used</tspan>
  </text>
  <rect class="dg-box" x="495" y="224" width="150" height="56" rx="8"/>
  <text x="570" y="243" dy="0.35em" text-anchor="middle">One stylesheet
    <tspan class="dg-note" x="570" dy="1.4em">from style.css</tspan>
  </text>
</svg>
