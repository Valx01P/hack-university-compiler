<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Which rendering steps each kind of change runs</title>
  <desc>The steps run in order: JavaScript, style, layout, paint, and composite. A change to a size or a position, like width or margin, runs all five. A change to looks alone, like color or background, skips layout. A change to transform or opacity, on a box with its own layer, skips layout and paint, and goes straight from style to composite.</desc>

  <!-- Row 1: size or position. -->
  <text x="20" y="32" dy="0.35em">Size or position <tspan class="dg-code" dx="8">width, margin, font-size</tspan></text>
  <rect class="dg-box" x="20" y="52" width="114" height="40" rx="8"/>
  <text x="77" y="72" dy="0.35em" text-anchor="middle">JavaScript</text>
  <path class="dg-flow" d="M134 72 H179" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="183" y="52" width="72" height="40" rx="8"/>
  <text x="219" y="72" dy="0.35em" text-anchor="middle">Style</text>
  <path class="dg-flow" d="M255 72 H300" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="304" y="52" width="80" height="40" rx="8"/>
  <text class="dg-on-hot" x="344" y="72" dy="0.35em" text-anchor="middle">Layout</text>
  <path class="dg-flow" d="M384 72 H429" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="433" y="52" width="72" height="40" rx="8"/>
  <text x="469" y="72" dy="0.35em" text-anchor="middle">Paint</text>
  <path class="dg-flow" d="M505 72 H550" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="554" y="52" width="106" height="40" rx="8"/>
  <text x="607" y="72" dy="0.35em" text-anchor="middle">Composite</text>

  <!-- Row 2: looks alone. -->
  <text x="20" y="132" dy="0.35em">Looks alone <tspan class="dg-code" dx="8">color, background</tspan></text>
  <rect class="dg-box" x="20" y="152" width="114" height="40" rx="8"/>
  <text x="77" y="172" dy="0.35em" text-anchor="middle">JavaScript</text>
  <path class="dg-flow" d="M134 172 H179" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="183" y="152" width="72" height="40" rx="8"/>
  <text x="219" y="172" dy="0.35em" text-anchor="middle">Style</text>
  <path class="dg-flow" d="M219 192 V208 H469 V196" marker-end="url(#arrow-flow)"/>
  <rect class="dg-off" x="304" y="152" width="80" height="40" rx="8"/>
  <text class="dg-faint" x="344" y="172" dy="0.35em" text-anchor="middle">Layout</text>
  <rect class="dg-box" x="433" y="152" width="72" height="40" rx="8"/>
  <text x="469" y="172" dy="0.35em" text-anchor="middle">Paint</text>
  <path class="dg-flow" d="M505 172 H550" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="554" y="152" width="106" height="40" rx="8"/>
  <text x="607" y="172" dy="0.35em" text-anchor="middle">Composite</text>

  <!-- Row 3: transform or opacity. -->
  <text x="20" y="240" dy="0.35em">Its own layer <tspan class="dg-code" dx="8">transform, opacity</tspan></text>
  <rect class="dg-box" x="20" y="260" width="114" height="40" rx="8"/>
  <text x="77" y="280" dy="0.35em" text-anchor="middle">JavaScript</text>
  <path class="dg-flow" d="M134 280 H179" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="183" y="260" width="72" height="40" rx="8"/>
  <text x="219" y="280" dy="0.35em" text-anchor="middle">Style</text>
  <path class="dg-flow" d="M219 300 V316 H607 V304" marker-end="url(#arrow-flow)"/>
  <rect class="dg-off" x="304" y="260" width="80" height="40" rx="8"/>
  <text class="dg-faint" x="344" y="280" dy="0.35em" text-anchor="middle">Layout</text>
  <rect class="dg-off" x="433" y="260" width="72" height="40" rx="8"/>
  <text class="dg-faint" x="469" y="280" dy="0.35em" text-anchor="middle">Paint</text>
  <rect class="dg-hot" x="554" y="260" width="106" height="40" rx="8"/>
  <text class="dg-on-hot" x="607" y="280" dy="0.35em" text-anchor="middle">Composite</text>
</svg>
