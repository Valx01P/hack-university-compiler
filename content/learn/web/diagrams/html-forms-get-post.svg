<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>One filled form, sent as a GET and as a POST</title>
  <desc>A form with two fields, name set to Sam Lee and loaf set to rye, is written as one string: name=Sam+Lee&amp;loaf=rye. With method get, the string goes on the end of the address, GET /order?name=Sam+Lee&amp;loaf=rye, and there's no body. With method post, the request is POST /order, its headers say the body is URL encoded, and the string is the body.</desc>

  <!-- The form. -->
  <rect class="dg-frame" x="20" y="20" width="640" height="76" rx="12"/>
  <text class="dg-heading" x="40" y="58" dy="0.35em">One filled form</text>
  <rect class="dg-box" x="236" y="38" width="196" height="40" rx="8"/>
  <text class="dg-code" x="334" y="58" dy="0.35em" text-anchor="middle">name: Sam Lee</text>
  <rect class="dg-box" x="448" y="38" width="196" height="40" rx="8"/>
  <text class="dg-code" x="546" y="58" dy="0.35em" text-anchor="middle">loaf: rye</text>

  <!-- The string. -->
  <path class="dg-line" d="M340 96 V120" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="216" y="124" width="248" height="40" rx="8"/>
  <text class="dg-on-hot dg-code" x="340" y="144" dy="0.35em" text-anchor="middle">name=Sam+Lee&amp;loaf=rye</text>
  <path class="dg-flow" d="M340 164 V184 H175 V212" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M340 184 H505 V212" marker-end="url(#arrow-flow)"/>

  <!-- With GET. -->
  <rect class="dg-frame" x="20" y="216" width="310" height="124" rx="12"/>
  <text class="dg-heading" x="36" y="240" dy="0.35em">GET: in the address</text>
  <text class="dg-code" x="36" y="276" dy="0.35em">GET /order?name=Sam+Lee&amp;loaf=rye</text>
  <text class="dg-faint" x="36" y="312" dy="0.35em">no body</text>

  <!-- With POST. -->
  <rect class="dg-frame" x="350" y="216" width="310" height="124" rx="12"/>
  <text class="dg-heading" x="366" y="240" dy="0.35em">POST: in the body</text>
  <text class="dg-code" x="366" y="268" dy="0.35em">POST /order HTTP/1.1</text>
  <text class="dg-note" x="366" y="288" dy="0.35em">headers, then a blank line</text>
  <rect class="dg-hot" x="360" y="300" width="186" height="28" rx="6"/>
  <text class="dg-on-hot dg-code" x="370" y="314" dy="0.35em">name=Sam+Lee&amp;loaf=rye</text>
</svg>
