<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A DNS lookup: the resolver asks the root, then .com, then example.com's name server</title>
  <desc>The browser asks a resolver for example.com. The resolver asks a root server, which points it to the .com servers. A .com server points it to the name server for example.com, which answers with the address 104.20.23.154. The resolver keeps that answer in its cache and passes it back to the browser.</desc>

  <!-- The browser asks once (step 1), and gets the address back. -->
  <rect class="dg-box" x="20" y="142" width="120" height="64" rx="8"/>
  <text x="80" y="165" dy="0.35em" text-anchor="middle">Browser
    <tspan class="dg-note" x="80" dy="1.4em">checks its cache</tspan>
  </text>
  <text class="dg-code" x="210" y="136" dy="0.35em" text-anchor="middle">example.com</text>
  <circle class="dg-badge" cx="160" cy="156" r="10"/>
  <text class="dg-on-badge" x="160" y="156" dy="0.35em" text-anchor="middle">1</text>
  <path class="dg-flow" d="M172 156 H266" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M270 192 H144" marker-end="url(#arrow)"/>
  <text class="dg-code" x="207" y="212" dy="0.35em" text-anchor="middle">104.20.23.154</text>

  <!-- The resolver does the asking, and keeps what it learns. -->
  <rect class="dg-strong" x="270" y="30" width="130" height="280" rx="8"/>
  <text x="335" y="165" dy="0.35em" text-anchor="middle">Resolver
    <tspan class="dg-note" x="335" dy="1.4em">caches answers</tspan>
  </text>

  <!-- Step 2: a root server. -->
  <rect class="dg-box" x="510" y="30" width="150" height="64" rx="8"/>
  <text x="585" y="53" dy="0.35em" text-anchor="middle">Root server
    <tspan class="dg-note" x="585" dy="1.4em">knows .com</tspan>
  </text>
  <circle class="dg-badge" cx="418" cy="48" r="10"/>
  <text class="dg-on-badge" x="418" y="48" dy="0.35em" text-anchor="middle">2</text>
  <path class="dg-flow" d="M430 48 H506" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M510 76 H404" marker-end="url(#arrow)"/>
  <text class="dg-note" x="457" y="92" dy="0.35em" text-anchor="middle">ask .com</text>

  <!-- Step 3: a .com server. -->
  <rect class="dg-box" x="510" y="138" width="150" height="64" rx="8"/>
  <text x="585" y="161" dy="0.35em" text-anchor="middle">.com server
    <tspan class="dg-note" x="585" dy="1.4em">knows example.com</tspan>
  </text>
  <circle class="dg-badge" cx="418" cy="156" r="10"/>
  <text class="dg-on-badge" x="418" y="156" dy="0.35em" text-anchor="middle">3</text>
  <path class="dg-flow" d="M430 156 H506" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M510 184 H404" marker-end="url(#arrow)"/>
  <text class="dg-note" x="457" y="200" dy="0.35em" text-anchor="middle">ask its server</text>

  <!-- Step 4: the domain's own name server, which has the answer. -->
  <rect class="dg-hot" x="510" y="246" width="150" height="64" rx="8"/>
  <text class="dg-on-hot" x="585" y="269" dy="0.35em" text-anchor="middle">Name server
    <tspan x="585" dy="1.4em">for example.com</tspan>
  </text>
  <circle class="dg-badge" cx="418" cy="264" r="10"/>
  <text class="dg-on-badge" x="418" y="264" dy="0.35em" text-anchor="middle">4</text>
  <path class="dg-flow" d="M430 264 H506" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M510 292 H404" marker-end="url(#arrow)"/>
  <text class="dg-code" x="457" y="308" dy="0.35em" text-anchor="middle">104.20.23.154</text>
</svg>
