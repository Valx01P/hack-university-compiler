<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>The DOM and the CSSOM combine into a smaller render tree</title>
  <desc>On the left, the kittens page's DOM: html, with head, title, and link, then body, h1, p, and em. Under it, the CSSOM: the two rules from style.css plus the browser's default styles. Style calculation combines them into the render tree on the right. It leaves out the head, the title, and the link, and keeps body, h1, p, and em, each with its computed style: the h1 purple, 32 pixels, and bold, the p 20 pixels, and the em 20 pixels and italic.</desc>

  <!-- The DOM. -->
  <rect class="dg-frame" x="20" y="20" width="260" height="240" rx="12"/>
  <text class="dg-heading" x="36" y="44" dy="0.35em">DOM</text>
  <text class="dg-code" x="40" y="80" dy="0.35em">html</text>
  <path class="dg-line" d="M48 90 V176"/>
  <path class="dg-line" d="M48 104 H54"/>
  <path class="dg-line" d="M48 176 H54"/>
  <text class="dg-faint dg-code" x="60" y="104" dy="0.35em">head</text>
  <text class="dg-note" x="104" y="104" dy="0.35em">left out, with all inside it</text>
  <path class="dg-line dg-dashed" d="M68 114 V152"/>
  <path class="dg-line dg-dashed" d="M68 128 H74"/>
  <path class="dg-line dg-dashed" d="M68 152 H74"/>
  <text class="dg-faint dg-code" x="80" y="128" dy="0.35em">title</text>
  <text class="dg-faint dg-code" x="80" y="152" dy="0.35em">link</text>
  <text class="dg-code" x="60" y="176" dy="0.35em">body</text>
  <path class="dg-line" d="M68 186 V224"/>
  <path class="dg-line" d="M68 200 H74"/>
  <path class="dg-line" d="M68 224 H74"/>
  <text class="dg-code" x="80" y="200" dy="0.35em">h1</text>
  <text class="dg-code" x="80" y="224" dy="0.35em">p</text>
  <path class="dg-line" d="M88 234 V244 H94"/>
  <text class="dg-code" x="100" y="244" dy="0.35em">em</text>

  <!-- The CSSOM. -->
  <rect class="dg-frame" x="20" y="280" width="260" height="120" rx="12"/>
  <text class="dg-heading" x="36" y="304" dy="0.35em">CSSOM</text>
  <text class="dg-code" x="40" y="334" dy="0.35em">h1 { color: rebeccapurple; }</text>
  <text class="dg-code" x="40" y="356" dy="0.35em">p { font-size: 20px; }</text>
  <text class="dg-note" x="40" y="380" dy="0.35em">plus the browser's default styles</text>

  <!-- Style calculation combines them. -->
  <path class="dg-flow" d="M280 140 H340 V196"/>
  <path class="dg-flow" d="M280 340 H340 V196"/>
  <path class="dg-flow" d="M340 196 H396" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="226" dy="0.35em" text-anchor="middle">style</text>
  <text class="dg-note" x="340" y="244" dy="0.35em" text-anchor="middle">calculation</text>

  <!-- The render tree. -->
  <rect class="dg-frame" x="400" y="20" width="260" height="380" rx="12"/>
  <text class="dg-heading" x="416" y="44" dy="0.35em">Render tree</text>
  <rect class="dg-box" x="416" y="72" width="228" height="40" rx="8"/>
  <text class="dg-code" x="432" y="92" dy="0.35em">body</text>
  <path class="dg-line" d="M428 112 V204"/>
  <path class="dg-line" d="M428 148 H436"/>
  <path class="dg-line" d="M428 204 H436"/>
  <rect class="dg-box" x="440" y="128" width="204" height="40" rx="8"/>
  <text class="dg-code" x="456" y="148" dy="0.35em">h1</text>
  <text class="dg-note" x="484" y="148" dy="0.35em">purple, 32px, bold</text>
  <rect class="dg-box" x="440" y="184" width="204" height="40" rx="8"/>
  <text class="dg-code" x="456" y="204" dy="0.35em">p</text>
  <text class="dg-note" x="476" y="204" dy="0.35em">20px</text>
  <path class="dg-line" d="M452 224 V256 H460"/>
  <rect class="dg-box" x="464" y="236" width="180" height="40" rx="8"/>
  <text class="dg-code" x="480" y="256" dy="0.35em">em</text>
  <text class="dg-note" x="506" y="256" dy="0.35em">20px, italic</text>
  <text class="dg-note" x="416" y="304" dy="0.35em">and the text inside each one</text>
</svg>
