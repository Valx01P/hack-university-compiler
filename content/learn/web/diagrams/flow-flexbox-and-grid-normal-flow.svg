<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
  <title>Normal flow: block boxes stack, inline boxes run along lines</title>
  <desc>A page in normal flow. A heading, a paragraph, and a list are block boxes, each a full row, stacked one below another down the page. Inside the paragraph, the words, a bold phrase, and a link are inline boxes that run along the line and wrap onto the next one, the way words do. The list holds two list items, which are blocks too.</desc>

  <rect class="dg-frame" x="20" y="20" width="480" height="400" rx="12"/>
  <text class="dg-note" x="40" y="42" dy="0.35em">The page, in normal flow</text>

  <!-- h1 -->
  <rect class="dg-box" x="40" y="64" width="440" height="40" rx="8"/>
  <text class="dg-code" x="56" y="84" dy="0.35em">&lt;h1&gt;</text>
  <text x="100" y="84" dy="0.35em">Trail notes</text>
  <text class="dg-note" x="464" y="84" dy="0.35em" text-anchor="end">block</text>

  <!-- p with inline boxes -->
  <rect class="dg-box" x="40" y="120" width="440" height="124" rx="8"/>
  <text class="dg-code" x="56" y="140" dy="0.35em">&lt;p&gt;</text>
  <text class="dg-note" x="464" y="140" dy="0.35em" text-anchor="end">block, with inline boxes inside</text>
  <text x="56" y="180" dy="0.35em">Start at the</text>
  <rect class="dg-hot" x="150" y="160" width="112" height="40" rx="8"/>
  <text class="dg-on-hot" x="206" y="180" dy="0.35em" text-anchor="middle">north gate</text>
  <text x="272" y="180" dy="0.35em">and follow</text>
  <rect class="dg-hot" x="362" y="160" width="96" height="40" rx="8"/>
  <text class="dg-on-hot" x="410" y="180" dy="0.35em" text-anchor="middle">the map</text>
  <text x="56" y="222" dy="0.35em">to the lake.</text>

  <!-- ul with two li -->
  <rect class="dg-box" x="40" y="260" width="440" height="140" rx="8"/>
  <text class="dg-code" x="56" y="280" dy="0.35em">&lt;ul&gt;</text>
  <text class="dg-note" x="464" y="280" dy="0.35em" text-anchor="end">block</text>
  <rect class="dg-box" x="56" y="296" width="408" height="40" rx="8"/>
  <text class="dg-code" x="72" y="316" dy="0.35em">&lt;li&gt;</text>
  <text x="116" y="316" dy="0.35em">Bring water</text>
  <text class="dg-note" x="448" y="316" dy="0.35em" text-anchor="end">block</text>
  <rect class="dg-box" x="56" y="348" width="408" height="40" rx="8"/>
  <text class="dg-code" x="72" y="368" dy="0.35em">&lt;li&gt;</text>
  <text x="116" y="368" dy="0.35em">Wear good shoes</text>
  <text class="dg-note" x="448" y="368" dy="0.35em" text-anchor="end">block</text>

  <!-- Blocks stack down. -->
  <path class="dg-flow" d="M524 84 V372" marker-end="url(#arrow-flow)"/>
  <text x="540" y="212" dy="0.35em">blocks
    <tspan class="dg-note" x="540" dy="1.4em">stack down</tspan>
  </text>
</svg>
