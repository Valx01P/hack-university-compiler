<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <title>A five-line HTML file, and the tree of nodes the parser builds from it</title>
  <desc>On the left, the five lines of index.html. On the right, the DOM built from them. The document holds the html element, which holds head and body. The head holds the title, with its text, and the link. The body holds the h1, with its text, and the p, which holds a text node, the em with its own text, and a last text node. The parser added html, head, and body, and closed the paragraph.</desc>

  <!-- The file. -->
  <rect class="dg-frame" x="20" y="20" width="300" height="176" rx="12"/>
  <text class="dg-heading" x="36" y="44" dy="0.35em">index.html</text>
  <text class="dg-code" x="36" y="80" dy="0.35em">&lt;!doctype html&gt;</text>
  <text class="dg-code" x="36" y="102" dy="0.35em">&lt;title&gt;Kittens&lt;/title&gt;</text>
  <text class="dg-code" x="36" y="124" dy="0.35em">&lt;link href="style.css"&gt;</text>
  <text class="dg-code" x="36" y="146" dy="0.35em">&lt;h1&gt;Kittens&lt;/h1&gt;</text>
  <text class="dg-code" x="36" y="168" dy="0.35em">&lt;p&gt;Kittens sleep &lt;em&gt;a lot&lt;/em&gt;.</text>

  <!-- The parser reads it. -->
  <path class="dg-flow" d="M320 108 H356" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="170" y="220" dy="0.35em" text-anchor="middle">the parser reads it, top to bottom</text>

  <!-- The tree. -->
  <rect class="dg-frame" x="360" y="20" width="300" height="372" rx="12"/>
  <text class="dg-heading" x="376" y="44" dy="0.35em">The DOM</text>

  <text class="dg-code" x="376" y="80" dy="0.35em">document</text>
  <path class="dg-line" d="M384 90 V102 H390"/>

  <rect class="dg-hot" x="394" y="92" width="42" height="20" rx="4"/>
  <text class="dg-on-hot dg-code" x="400" y="102" dy="0.35em">html</text>
  <text class="dg-note" x="446" y="102" dy="0.35em">added by the parser</text>
  <path class="dg-line" d="M408 112 V212"/>
  <path class="dg-line" d="M408 124 H414"/>
  <path class="dg-line" d="M408 212 H414"/>

  <rect class="dg-hot" x="418" y="114" width="42" height="20" rx="4"/>
  <text class="dg-on-hot dg-code" x="424" y="124" dy="0.35em">head</text>
  <text class="dg-note" x="470" y="124" dy="0.35em">added</text>
  <path class="dg-line" d="M432 134 V190"/>
  <path class="dg-line" d="M432 146 H442"/>
  <path class="dg-line" d="M432 190 H442"/>
  <text class="dg-code" x="448" y="146" dy="0.35em">title</text>
  <path class="dg-line" d="M456 156 V168 H466"/>
  <text class="dg-note dg-code" x="472" y="168" dy="0.35em">"Kittens"</text>
  <text class="dg-code" x="448" y="190" dy="0.35em">link</text>

  <rect class="dg-hot" x="418" y="202" width="42" height="20" rx="4"/>
  <text class="dg-on-hot dg-code" x="424" y="212" dy="0.35em">body</text>
  <text class="dg-note" x="470" y="212" dy="0.35em">added</text>
  <path class="dg-line" d="M432 222 V278"/>
  <path class="dg-line" d="M432 234 H442"/>
  <path class="dg-line" d="M432 278 H442"/>
  <text class="dg-code" x="448" y="234" dy="0.35em">h1</text>
  <path class="dg-line" d="M456 244 V256 H466"/>
  <text class="dg-note dg-code" x="472" y="256" dy="0.35em">"Kittens"</text>
  <text class="dg-code" x="448" y="278" dy="0.35em">p</text>
  <text class="dg-note" x="466" y="278" dy="0.35em">closed by the parser</text>
  <path class="dg-line" d="M456 288 V366"/>
  <path class="dg-line" d="M456 300 H466"/>
  <path class="dg-line" d="M456 322 H466"/>
  <path class="dg-line" d="M456 366 H466"/>
  <text class="dg-note dg-code" x="472" y="300" dy="0.35em">"Kittens sleep "</text>
  <text class="dg-code" x="472" y="322" dy="0.35em">em</text>
  <path class="dg-line" d="M480 332 V344 H490"/>
  <text class="dg-note dg-code" x="496" y="344" dy="0.35em">"a lot"</text>
  <text class="dg-note dg-code" x="472" y="366" dy="0.35em">"."</text>
</svg>
