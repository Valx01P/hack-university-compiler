<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>npm install reads package.json, downloads packages, and writes node_modules and the lockfile</title>
  <desc>npm install reads the packages you asked for in package.json. It downloads each one, and the packages they need, from the npm registry. Then it writes their code into the node_modules folder, and their exact versions into package-lock.json.</desc>

  <!-- Step 1: what you asked for. -->
  <rect class="dg-box" x="20" y="40" width="150" height="56" rx="8"/>
  <text x="95" y="59" dy="0.35em" text-anchor="middle"><tspan class="dg-code">package.json</tspan>
    <tspan class="dg-note" x="95" dy="1.4em">your list</tspan>
  </text>
  <circle class="dg-badge" cx="186" cy="68" r="10"/>
  <text class="dg-on-badge" x="186" y="68" dy="0.35em" text-anchor="middle">1</text>
  <path class="dg-flow" d="M198 68 H256" marker-end="url(#arrow-flow)"/>

  <!-- npm itself. -->
  <rect class="dg-hot" x="260" y="40" width="160" height="56" rx="8"/>
  <text class="dg-on-hot dg-code" x="340" y="68" dy="0.35em" text-anchor="middle">npm install</text>

  <!-- Step 2: the registry. -->
  <circle class="dg-badge" cx="436" cy="56" r="10"/>
  <text class="dg-on-badge" x="436" y="56" dy="0.35em" text-anchor="middle">2</text>
  <path class="dg-flow" d="M448 56 H506" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M510 82 H424" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="510" y="40" width="150" height="56" rx="8"/>
  <text x="585" y="59" dy="0.35em" text-anchor="middle">npm registry
    <tspan class="dg-note" x="585" dy="1.4em">npmjs.com</tspan>
  </text>

  <!-- Step 3: what it writes. -->
  <circle class="dg-badge" cx="340" cy="120" r="10"/>
  <text class="dg-on-badge" x="340" y="120" dy="0.35em" text-anchor="middle">3</text>
  <path class="dg-flow" d="M340 130 V150 H210 V176" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M340 150 H470 V176" marker-end="url(#arrow-flow)"/>
  <rect class="dg-strong" x="100" y="180" width="220" height="56" rx="8"/>
  <text x="210" y="199" dy="0.35em" text-anchor="middle"><tspan class="dg-code">node_modules/</tspan>
    <tspan class="dg-note" x="210" dy="1.4em">every package's code</tspan>
  </text>
  <rect class="dg-strong" x="360" y="180" width="220" height="56" rx="8"/>
  <text x="470" y="199" dy="0.35em" text-anchor="middle"><tspan class="dg-code">package-lock.json</tspan>
    <tspan class="dg-note" x="470" dy="1.4em">the exact versions</tspan>
  </text>
</svg>
