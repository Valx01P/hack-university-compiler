<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>A request and its response, with each part labeled</title>
  <desc>On the left, the request curl sent: the request line GET /about.html HTTP/1.1, then headers such as Host and Accept, then a blank line, and no body, since a GET sends none. On the right, the response: the status line HTTP/1.0 200 OK, headers such as Content-type and Content-Length, a blank line, and the body, which is the file itself.</desc>

  <!-- The request. -->
  <rect class="dg-frame" x="20" y="20" width="300" height="340" rx="12"/>
  <text class="dg-heading" x="36" y="42" dy="0.35em">The request</text>
  <rect class="dg-box" x="36" y="64" width="268" height="56" rx="8"/>
  <text class="dg-note" x="52" y="80" dy="0.35em">request line</text>
  <text class="dg-code" x="52" y="102" dy="0.35em">GET /about.html HTTP/1.1</text>
  <rect class="dg-box" x="36" y="132" width="268" height="76" rx="8"/>
  <text class="dg-note" x="52" y="148" dy="0.35em">headers</text>
  <text class="dg-code" x="52" y="170" dy="0.35em">Host: localhost:8000</text>
  <text class="dg-code" x="52" y="190" dy="0.35em">Accept: */*</text>
  <rect class="dg-off" x="36" y="220" width="268" height="36" rx="8"/>
  <text class="dg-faint" x="52" y="238" dy="0.35em">blank line: the headers end</text>
  <rect class="dg-off" x="36" y="268" width="268" height="76" rx="8"/>
  <text class="dg-faint" x="52" y="284" dy="0.35em">body: none, a GET sends nothing</text>

  <!-- Out, and back. -->
  <path class="dg-flow" d="M320 92 H356" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M360 306 H324" marker-end="url(#arrow)"/>

  <!-- The response. -->
  <rect class="dg-frame" x="360" y="20" width="300" height="340" rx="12"/>
  <text class="dg-heading" x="376" y="42" dy="0.35em">The response</text>
  <rect class="dg-box" x="376" y="64" width="268" height="56" rx="8"/>
  <text class="dg-note" x="392" y="80" dy="0.35em">status line</text>
  <text class="dg-code" x="392" y="102" dy="0.35em">HTTP/1.0 200 OK</text>
  <rect class="dg-box" x="376" y="132" width="268" height="76" rx="8"/>
  <text class="dg-note" x="392" y="148" dy="0.35em">headers</text>
  <text class="dg-code" x="392" y="170" dy="0.35em">Content-type: text/html</text>
  <text class="dg-code" x="392" y="190" dy="0.35em">Content-Length: 98</text>
  <rect class="dg-off" x="376" y="220" width="268" height="36" rx="8"/>
  <text class="dg-faint" x="392" y="238" dy="0.35em">blank line: the headers end</text>
  <rect class="dg-hot" x="376" y="268" width="268" height="76" rx="8"/>
  <text class="dg-on-hot" x="392" y="284" dy="0.35em">body: the file itself</text>
  <text class="dg-on-hot dg-code" x="392" y="306" dy="0.35em">&lt;!doctype html&gt;</text>
  <text class="dg-on-hot dg-code" x="392" y="326" dy="0.35em">&lt;title&gt;About me&lt;/title&gt;</text>
</svg>
