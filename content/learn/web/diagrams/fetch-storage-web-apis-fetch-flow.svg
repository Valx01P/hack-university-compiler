<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>From a fetch call to a list on the page, in four steps</title>
  <desc>In step 1, the page's script calls fetch for /api/notes, and the request goes to the notes server. In step 2, the status and headers come back as a Response object. In step 3, response.json() waits for the body and parses it into an array of notes. In step 4, the script puts the notes on the page.</desc>

  <rect class="dg-frame" x="20" y="20" width="380" height="300" rx="12"/>
  <text class="dg-note" x="40" y="34" dy="0.35em">Your page's script</text>

  <!-- Step 1. -->
  <circle class="dg-badge" cx="40" cy="72" r="10"/>
  <text class="dg-on-badge" x="40" y="72" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-hot" x="60" y="48" width="320" height="48" rx="8"/>
  <text class="dg-on-hot dg-code" x="220" y="72" dy="0.35em" text-anchor="middle">await fetch("/api/notes")</text>

  <!-- Step 2. -->
  <circle class="dg-badge" cx="40" cy="140" r="10"/>
  <text class="dg-on-badge" x="40" y="140" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="60" y="112" width="320" height="56" rx="8"/>
  <text x="220" y="131" dy="0.35em" text-anchor="middle">a Response
    <tspan class="dg-note" x="220" dy="1.4em">status 200, ok, headers</tspan>
  </text>

  <!-- Step 3. -->
  <circle class="dg-badge" cx="40" cy="212" r="10"/>
  <text class="dg-on-badge" x="40" y="212" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="60" y="184" width="320" height="56" rx="8"/>
  <text x="220" y="203" dy="0.35em" text-anchor="middle"><tspan class="dg-code">await response.json()</tspan>
    <tspan class="dg-note" x="220" dy="1.4em">the notes, as an array</tspan>
  </text>
  <path class="dg-flow" d="M220 240 V252" marker-end="url(#arrow-flow)"/>

  <!-- Step 4. -->
  <circle class="dg-badge" cx="40" cy="276" r="10"/>
  <text class="dg-on-badge" x="40" y="276" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-strong" x="60" y="256" width="320" height="40" rx="8"/>
  <text x="220" y="276" dy="0.35em" text-anchor="middle">the list on the page</text>

  <!-- The server. -->
  <rect class="dg-box" x="520" y="48" width="140" height="176" rx="8"/>
  <text x="590" y="127" dy="0.35em" text-anchor="middle">Notes server
    <tspan class="dg-note" x="590" dy="1.4em">port 8000</tspan>
  </text>
  <text class="dg-code" x="462" y="58" dy="0.35em" text-anchor="middle">GET /api/notes</text>
  <path class="dg-flow" d="M380 76 H516" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M520 140 H384" marker-end="url(#arrow)"/>
  <text class="dg-note" x="450" y="124" dy="0.35em" text-anchor="middle">status, headers</text>
  <path class="dg-line dg-dashed" d="M520 212 H384" marker-end="url(#arrow)"/>
  <text class="dg-note" x="450" y="196" dy="0.35em" text-anchor="middle">the body</text>
</svg>
