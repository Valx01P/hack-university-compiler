<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>One request to example.com, split into its steps over time</title>
  <desc>A timeline of one request, from curl's real timings. The DNS lookup took 3 milliseconds, since the answer was cached. Connecting took 16 more, the TLS handshake 25 more, and waiting for the server's first byte 24 more. The download took about a tenth of a millisecond. The first byte arrived 69 milliseconds after the start.</desc>

  <!-- When the first byte arrived. -->
  <path class="dg-line dg-dashed" d="M590 56 V264"/>
  <text class="dg-note" x="590" y="40" dy="0.35em" text-anchor="middle">first byte, 69 ms</text>

  <!-- Step 1: DNS. -->
  <circle class="dg-badge" cx="40" cy="80" r="10"/>
  <text class="dg-on-badge" x="40" y="80" dy="0.35em" text-anchor="middle">1</text>
  <text x="60" y="80" dy="0.35em">DNS lookup</text>
  <rect class="dg-strong" x="210" y="70" width="17" height="20" rx="3"/>
  <text class="dg-note" x="235" y="80" dy="0.35em">3 ms</text>

  <!-- Step 2: TCP. -->
  <circle class="dg-badge" cx="40" cy="120" r="10"/>
  <text class="dg-on-badge" x="40" y="120" dy="0.35em" text-anchor="middle">2</text>
  <text x="60" y="120" dy="0.35em">Connect (TCP)</text>
  <rect class="dg-strong" x="227" y="110" width="90" height="20" rx="3"/>
  <text class="dg-note" x="325" y="120" dy="0.35em">16 ms</text>

  <!-- Step 3: TLS. -->
  <circle class="dg-badge" cx="40" cy="160" r="10"/>
  <text class="dg-on-badge" x="40" y="160" dy="0.35em" text-anchor="middle">3</text>
  <text x="60" y="160" dy="0.35em">Secure (TLS)</text>
  <rect class="dg-strong" x="317" y="150" width="140" height="20" rx="3"/>
  <text class="dg-note" x="465" y="160" dy="0.35em">25 ms</text>

  <!-- Step 4: waiting for the server. -->
  <circle class="dg-badge" cx="40" cy="200" r="10"/>
  <text class="dg-on-badge" x="40" y="200" dy="0.35em" text-anchor="middle">4</text>
  <text x="60" y="200" dy="0.35em">Wait for server</text>
  <rect class="dg-hot" x="457" y="190" width="133" height="20" rx="3"/>
  <text class="dg-on-hot" x="523" y="200" dy="0.35em" text-anchor="middle">24 ms</text>

  <!-- Step 5: download. -->
  <circle class="dg-badge" cx="40" cy="240" r="10"/>
  <text class="dg-on-badge" x="40" y="240" dy="0.35em" text-anchor="middle">5</text>
  <text x="60" y="240" dy="0.35em">Download</text>
  <rect class="dg-strong" x="590" y="230" width="4" height="20" rx="1"/>
  <text class="dg-note" x="602" y="240" dy="0.35em">0.1 ms</text>

  <!-- The time axis, in milliseconds. -->
  <path class="dg-line" d="M210 272 H650"/>
  <path class="dg-line" d="M210 268 V276"/>
  <path class="dg-line" d="M320 268 V276"/>
  <path class="dg-line" d="M430 268 V276"/>
  <path class="dg-line" d="M540 268 V276"/>
  <path class="dg-line" d="M650 268 V276"/>
  <text class="dg-note" x="210" y="292" dy="0.35em" text-anchor="middle">0</text>
  <text class="dg-note" x="320" y="292" dy="0.35em" text-anchor="middle">20</text>
  <text class="dg-note" x="430" y="292" dy="0.35em" text-anchor="middle">40</text>
  <text class="dg-note" x="540" y="292" dy="0.35em" text-anchor="middle">60</text>
  <text class="dg-note" x="650" y="292" dy="0.35em" text-anchor="middle">80 ms</text>
</svg>
