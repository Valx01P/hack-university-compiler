<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>Post, redirect, get, and what reload repeats</title>
  <desc>In step 1, the browser sends POST /order. In step 2, the server saves the order and answers 303 See Other with Location /orders/1042. In step 3, the browser follows it with GET /orders/1042. In step 4, the server answers 200 OK with the thank-you page. Pressing reload repeats only the last request, the GET in step 3, so nothing is ordered twice.</desc>

  <!-- Who talks. -->
  <rect class="dg-strong" x="20" y="20" width="160" height="40" rx="8"/>
  <text x="100" y="40" dy="0.35em" text-anchor="middle">Browser</text>
  <rect class="dg-strong" x="500" y="20" width="160" height="40" rx="8"/>
  <text x="580" y="40" dy="0.35em" text-anchor="middle">Server</text>
  <path class="dg-line dg-dashed" d="M100 60 V340"/>
  <path class="dg-line dg-dashed" d="M580 60 V340"/>

  <!-- Step 1: the POST. -->
  <circle class="dg-badge" cx="140" cy="94" r="10"/>
  <text class="dg-on-badge" x="140" y="94" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="160" y="94" dy="0.35em">POST /order</text>
  <path class="dg-line" d="M100 114 H576" marker-end="url(#arrow)"/>

  <!-- Step 2: the redirect. -->
  <circle class="dg-badge" cx="140" cy="154" r="10"/>
  <text class="dg-on-badge" x="140" y="154" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="160" y="154" dy="0.35em">303 See Other, Location: /orders/1042</text>
  <path class="dg-line dg-dashed" d="M580 174 H104" marker-end="url(#arrow)"/>

  <!-- Step 3: the GET. -->
  <circle class="dg-badge" cx="140" cy="214" r="10"/>
  <text class="dg-on-badge" x="140" y="214" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="160" y="214" dy="0.35em">GET /orders/1042</text>
  <path class="dg-flow" d="M100 234 H576" marker-end="url(#arrow-flow)"/>

  <!-- Step 4: the page. -->
  <circle class="dg-badge" cx="140" cy="274" r="10"/>
  <text class="dg-on-badge" x="140" y="274" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-code" x="160" y="274" dy="0.35em">200 OK, the thank-you page</text>
  <path class="dg-line dg-dashed" d="M580 294 H104" marker-end="url(#arrow)"/>

  <!-- Reload repeats step 3. -->
  <path class="dg-flow" d="M100 340 H40 V234 H96" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="20" y="352" width="300" height="32" rx="8"/>
  <text class="dg-on-hot" x="36" y="368" dy="0.35em">Reload repeats step 3, the safe GET</text>
</svg>
