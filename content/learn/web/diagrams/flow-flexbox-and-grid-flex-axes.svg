<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A flex row's two axes: main across, cross down</title>
  <desc>A flex container holds three items in a row, with free space left over at the end. The main axis runs across the row, in the direction the items go, and justify-content places the items along it. The cross axis runs down, across the row, and align-items places the items along it. By default the items stretch to the row's full height.</desc>

  <rect class="dg-frame" x="40" y="40" width="440" height="180" rx="12"/>
  <text class="dg-note" x="60" y="64" dy="0.35em">flex container</text>

  <rect class="dg-hot" x="60" y="92" width="96" height="108" rx="8"/>
  <text class="dg-on-hot" x="108" y="146" dy="0.35em" text-anchor="middle">item 1</text>
  <rect class="dg-box" x="172" y="92" width="96" height="108" rx="8"/>
  <text x="220" y="146" dy="0.35em" text-anchor="middle">item 2</text>
  <rect class="dg-box" x="284" y="92" width="96" height="108" rx="8"/>
  <text x="332" y="146" dy="0.35em" text-anchor="middle">item 3</text>
  <rect class="dg-off" x="392" y="92" width="68" height="108" rx="8"/>
  <text class="dg-faint" x="426" y="137" dy="0.35em" text-anchor="middle">free
    <tspan x="426" dy="1.4em">space</tspan>
  </text>

  <!-- Main axis. -->
  <path class="dg-flow" d="M40 244 H476" marker-end="url(#arrow-flow)"/>
  <text x="40" y="270" dy="0.35em">main axis</text>
  <text class="dg-code" x="476" y="270" dy="0.35em" text-anchor="end">justify-content</text>

  <!-- Cross axis. -->
  <path class="dg-flow" d="M504 40 V216" marker-end="url(#arrow-flow)"/>
  <text x="524" y="116" dy="0.35em">cross axis</text>
  <text class="dg-code" x="524" y="142" dy="0.35em">align-items</text>
</svg>
