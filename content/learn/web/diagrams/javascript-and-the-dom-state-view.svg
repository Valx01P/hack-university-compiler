<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>One state shown in three places, with one update forgotten</title>
  <desc>The state, an array of three tasks with two left to do, is shown in three places: the list, the count, and the tab's title. The handler that added a task updated the list and the count, but nobody updated the tab's title, which still shows the old number.</desc>

  <!-- State. -->
  <rect class="dg-hot" x="20" y="100" width="200" height="96" rx="8"/>
  <text class="dg-on-hot" x="120" y="128" dy="0.35em" text-anchor="middle">State</text>
  <text class="dg-on-hot dg-code" x="120" y="152" dy="0.35em" text-anchor="middle">tasks</text>
  <text class="dg-on-hot" x="120" y="174" dy="0.35em" text-anchor="middle">3 tasks, 2 left</text>

  <!-- The page. -->
  <rect class="dg-frame" x="300" y="20" width="360" height="260" rx="12"/>
  <text class="dg-note" x="320" y="38" dy="0.35em">The page</text>
  <rect class="dg-box" x="320" y="56" width="320" height="56" rx="8"/>
  <text x="480" y="75" dy="0.35em" text-anchor="middle">The list
    <tspan class="dg-note" x="480" dy="1.4em">shows 3 tasks</tspan>
  </text>
  <rect class="dg-box" x="320" y="128" width="320" height="56" rx="8"/>
  <text x="480" y="147" dy="0.35em" text-anchor="middle">The count
    <tspan class="dg-note" x="480" dy="1.4em">2 left to do</tspan>
  </text>
  <rect class="dg-off" x="320" y="200" width="320" height="56" rx="8"/>
  <text class="dg-faint" x="480" y="219" dy="0.35em" text-anchor="middle">The tab's title
    <tspan x="480" dy="1.4em">forgotten: still 1 left</tspan>
  </text>

  <!-- Updates. -->
  <path class="dg-flow" d="M220 124 H260 V84 H316" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M220 156 H316" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M220 176 H260 V228 H316"/>
</svg>
