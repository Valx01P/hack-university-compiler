<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200">
  <title>The parts of a URL, with the origin and what the server is sent</title>
  <desc>The URL https://shop.example.com:8443/search?q=red+shoes&amp;size=9#reviews split into its parts: the scheme https, the host shop.example.com, the port 8443, the path /search, the query string with q and size, and the fragment reviews. The scheme, host, and port together are the origin. The path and query go to the server, and the fragment never leaves the browser.</desc>
  <path class="dg-flow" d="M73.8 70 V62 H315.3 V70"/>
  <text class="dg-heading" x="194.6" y="44" dy="0.35em" text-anchor="middle">origin</text>
  <path class="dg-line" d="M327.3 70 V62 H534.3 V70"/>
  <text class="dg-note" x="430.8" y="44" dy="0.35em" text-anchor="middle">what the request asks for</text>
  <text class="dg-code" x="103.8" y="84" dy="0.35em" text-anchor="middle">https://</text>
  <path class="dg-line" d="M73.8 98 V106 H133.8 V98"/>
  <text x="103.8" y="126" dy="0.35em" text-anchor="middle">scheme</text>
  <text class="dg-note" x="103.8" y="146" dy="0.35em" text-anchor="middle">the protocol</text>
  <text class="dg-code" x="205.8" y="84" dy="0.35em" text-anchor="middle">shop.example.com</text>
  <path class="dg-line" d="M145.8 98 V106 H265.8 V98"/>
  <text x="205.8" y="126" dy="0.35em" text-anchor="middle">host</text>
  <text class="dg-note" x="205.8" y="146" dy="0.35em" text-anchor="middle">the server's name</text>
  <text class="dg-code" x="296.6" y="84" dy="0.35em" text-anchor="middle">:8443</text>
  <path class="dg-line" d="M277.8 98 V106 H315.3 V98"/>
  <text x="296.6" y="126" dy="0.35em" text-anchor="middle">port</text>
  <text class="dg-code" x="353.6" y="84" dy="0.35em" text-anchor="middle">/search</text>
  <path class="dg-line" d="M327.3 98 V106 H379.8 V98"/>
  <text x="353.6" y="126" dy="0.35em" text-anchor="middle">path</text>
  <text class="dg-code" x="463" y="84" dy="0.35em" text-anchor="middle">?q=red+shoes&amp;size=9</text>
  <path class="dg-line" d="M391.8 98 V106 H534.3 V98"/>
  <text x="463" y="126" dy="0.35em" text-anchor="middle">query</text>
  <text class="dg-note" x="463" y="146" dy="0.35em" text-anchor="middle">names and values</text>
  <text class="dg-faint dg-code" x="576.3" y="84" dy="0.35em" text-anchor="middle">#reviews</text>
  <path class="dg-line" d="M546.3 98 V106 H606.3 V98"/>
  <text x="576.3" y="126" dy="0.35em" text-anchor="middle">fragment</text>
  <text class="dg-note" x="576.3" y="146" dy="0.35em" text-anchor="middle">never sent</text>
  <text class="dg-note" x="576.3" y="162" dy="0.35em" text-anchor="middle">to the server</text>
</svg>
