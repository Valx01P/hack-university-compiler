<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The address changes through pushState while one page stays loaded</title>
  <desc>The page loads once at localhost:8000/. Clicking Map calls pushState, and the address becomes ?view=map. Clicking List calls pushState again, and the address becomes ?view=list. All three addresses are shown by the same loaded page, which swaps its view, and the server gets one request, for the page itself.</desc>

  <!-- Addresses. -->
  <text class="dg-note" x="20" y="26" dy="0.35em">the address bar</text>
  <rect class="dg-box" x="20" y="40" width="380" height="48" rx="8"/>
  <text class="dg-code" x="40" y="64" dy="0.35em">localhost:8000/</text>
  <path class="dg-flow" d="M210 88 V128" marker-end="url(#arrow-flow)"/>
  <text x="226" y="100" dy="0.35em"><tspan class="dg-code">pushState</tspan>
    <tspan class="dg-note" x="226" dy="1.4em">after a click on Map</tspan>
  </text>
  <rect class="dg-box" x="20" y="132" width="380" height="48" rx="8"/>
  <text class="dg-code" x="40" y="156" dy="0.35em">localhost:8000/?view=map</text>
  <path class="dg-flow" d="M210 180 V220" marker-end="url(#arrow-flow)"/>
  <text x="226" y="192" dy="0.35em"><tspan class="dg-code">pushState</tspan>
    <tspan class="dg-note" x="226" dy="1.4em">after a click on List</tspan>
  </text>
  <rect class="dg-box" x="20" y="224" width="380" height="48" rx="8"/>
  <text class="dg-code" x="40" y="248" dy="0.35em">localhost:8000/?view=list</text>

  <!-- One page. -->
  <rect class="dg-hot" x="460" y="40" width="200" height="232" rx="8"/>
  <text class="dg-on-hot" x="560" y="147" dy="0.35em" text-anchor="middle">The same page
    <tspan x="560" dy="1.4em">its view swapped</tspan>
  </text>
  <path class="dg-line" d="M400 64 H456" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M400 156 H456" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M400 248 H456" marker-end="url(#arrow)"/>
  <text class="dg-note" x="560" y="296" dy="0.35em" text-anchor="middle">one request: GET /</text>
</svg>
