<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <title>Before the first byte: a TCP handshake, a TLS handshake, then the request</title>
  <desc>A browser and a server trade messages over time. First the TCP handshake connects them: SYN, SYN-ACK, and ACK, one round trip. Then the TLS 1.3 handshake sets up encryption: the browser's ClientHello, the server's hello with its certificate, and Finished from each side, one more round trip. Only then does the browser send GET, and the server answers 200 OK, a third round trip.</desc>

  <!-- The two sides, with time going down. -->
  <rect class="dg-frame" x="20" y="20" width="120" height="420" rx="12"/>
  <text class="dg-heading" x="80" y="46" dy="0.35em" text-anchor="middle">Browser</text>
  <rect class="dg-frame" x="540" y="20" width="120" height="420" rx="12"/>
  <text class="dg-heading" x="600" y="46" dy="0.35em" text-anchor="middle">Server</text>
  <text class="dg-faint" x="80" y="420" dy="0.35em" text-anchor="middle">time runs down</text>

  <circle class="dg-badge" cx="170" cy="84" r="10"/>
  <text class="dg-on-badge" x="170" y="84" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-heading" x="188" y="84" dy="0.35em">Connect (TCP)</text>
  <text class="dg-note" x="520" y="84" dy="0.35em" text-anchor="end">1 round trip</text>
  <text class="dg-code" x="340" y="109" dy="0.35em" text-anchor="middle">SYN</text>
  <path class="dg-line" d="M140 120 H536" marker-end="url(#arrow)"/>
  <text class="dg-code" x="340" y="139" dy="0.35em" text-anchor="middle">SYN-ACK</text>
  <path class="dg-line dg-dashed" d="M540 150 H144" marker-end="url(#arrow)"/>
  <text class="dg-code" x="340" y="169" dy="0.35em" text-anchor="middle">ACK</text>
  <path class="dg-line" d="M140 180 H536" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="170" cy="216" r="10"/>
  <text class="dg-on-badge" x="170" y="216" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-heading" x="188" y="216" dy="0.35em">Encrypt (TLS 1.3)</text>
  <text class="dg-note" x="520" y="216" dy="0.35em" text-anchor="end">1 round trip</text>
  <text class="dg-code" x="340" y="241" dy="0.35em" text-anchor="middle">ClientHello</text>
  <path class="dg-line" d="M140 252 H536" marker-end="url(#arrow)"/>
  <text class="dg-code" x="340" y="271" dy="0.35em" text-anchor="middle">ServerHello, certificate, Finished</text>
  <path class="dg-line dg-dashed" d="M540 282 H144" marker-end="url(#arrow)"/>
  <text class="dg-code" x="340" y="301" dy="0.35em" text-anchor="middle">Finished</text>
  <path class="dg-line" d="M140 312 H536" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="170" cy="348" r="10"/>
  <text class="dg-on-badge" x="170" y="348" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-heading" x="188" y="348" dy="0.35em">Ask (HTTP)</text>
  <text class="dg-note" x="520" y="348" dy="0.35em" text-anchor="end">1 round trip</text>
  <text class="dg-code" x="340" y="373" dy="0.35em" text-anchor="middle">GET / HTTP/2</text>
  <path class="dg-flow" d="M140 384 H536" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="340" y="403" dy="0.35em" text-anchor="middle">200 OK + the page</text>
  <path class="dg-line dg-dashed" d="M540 414 H144" marker-end="url(#arrow)"/>
</svg>
