<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180">
  <title>The pieces of a web address, and which ones reach the server</title>
  <desc>The address https://shop.example.com/search?q=red+shoes#reviews split into its pieces. The scheme https says how to talk. The host shop.example.com names the computer. The path /search says what to get. The query string q=red+shoes adds details. The fragment reviews is a spot on the page. The path and the query string are sent to the server, and the fragment never is.</desc>

  <!-- What the request carries. -->
  <path class="dg-flow" d="M329 62 V54 H499 V62"/>
  <text class="dg-note" x="414" y="38" dy="0.35em" text-anchor="middle">sent to the server</text>

  <!-- The pieces, left to right. -->
  <text class="dg-code" x="123" y="78" dy="0.35em" text-anchor="middle">https://</text>
  <path class="dg-line" d="M93 92 V100 H153 V92"/>
  <text x="123" y="120" dy="0.35em" text-anchor="middle">scheme</text>
  <text class="dg-note" x="123" y="140" dy="0.35em" text-anchor="middle">how to talk</text>

  <text class="dg-code" x="241" y="78" dy="0.35em" text-anchor="middle">shop.example.com</text>
  <path class="dg-line" d="M181 92 V100 H301 V92"/>
  <text x="241" y="120" dy="0.35em" text-anchor="middle">host</text>
  <text class="dg-note" x="241" y="140" dy="0.35em" text-anchor="middle">which computer</text>

  <text class="dg-code" x="355" y="78" dy="0.35em" text-anchor="middle">/search</text>
  <path class="dg-line" d="M329 92 V100 H381 V92"/>
  <text x="355" y="120" dy="0.35em" text-anchor="middle">path</text>
  <text class="dg-note" x="355" y="140" dy="0.35em" text-anchor="middle">what to get</text>

  <text class="dg-code" x="454" y="78" dy="0.35em" text-anchor="middle">?q=red+shoes</text>
  <path class="dg-line" d="M409 92 V100 H499 V92"/>
  <text x="454" y="120" dy="0.35em" text-anchor="middle">query string</text>
  <text class="dg-note" x="454" y="140" dy="0.35em" text-anchor="middle">extra details</text>

  <text class="dg-faint dg-code" x="557" y="78" dy="0.35em" text-anchor="middle">#reviews</text>
  <path class="dg-line" d="M527 92 V100 H587 V92"/>
  <text x="557" y="120" dy="0.35em" text-anchor="middle">fragment</text>
  <text class="dg-note" x="557" y="140" dy="0.35em" text-anchor="middle">a spot on
    <tspan x="557" dy="1.4em">the page</tspan>
  </text>
</svg>
