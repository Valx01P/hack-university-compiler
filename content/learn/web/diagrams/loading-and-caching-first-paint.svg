<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A page load from the HTML's first byte to the first paint and the LCP</title>
  <desc>A timeline of five rows. The HTML arrives first. The stylesheet it links downloads next and blocks the paint. A classic script blocks the parser: it downloads, waits for the stylesheet, then runs. Only then does the screen go from blank to showing text, the First Contentful Paint. The big image was found late at low priority, and when it arrives, the Largest Contentful Paint happens.</desc>

  <!-- The two moments. -->
  <path class="dg-line dg-dashed" d="M452 52 V264"/>
  <text class="dg-note" x="452" y="36" dy="0.35em" text-anchor="middle">FCP</text>
  <path class="dg-line dg-dashed" d="M620 52 V264"/>
  <text class="dg-note" x="620" y="36" dy="0.35em" text-anchor="middle">LCP</text>

  <!-- Step 1: the HTML. -->
  <circle class="dg-badge" cx="40" cy="80" r="10"/>
  <text class="dg-on-badge" x="40" y="80" dy="0.35em" text-anchor="middle">1</text>
  <text x="60" y="80" dy="0.35em">HTML</text>
  <rect class="dg-strong" x="200" y="68" width="130" height="24" rx="4"/>

  <!-- Step 2: the stylesheet. -->
  <circle class="dg-badge" cx="40" cy="120" r="10"/>
  <text class="dg-on-badge" x="40" y="120" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="60" y="120" dy="0.35em">style.css</text>
  <rect class="dg-strong" x="230" y="108" width="190" height="24" rx="4"/>
  <text class="dg-note" x="325" y="120" dy="0.35em" text-anchor="middle">blocks the paint</text>

  <!-- Step 3: the classic script. -->
  <circle class="dg-badge" cx="40" cy="160" r="10"/>
  <text class="dg-on-badge" x="40" y="160" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="60" y="160" dy="0.35em">app.js</text>
  <rect class="dg-strong" x="240" y="148" width="140" height="24" rx="4"/>
  <text class="dg-note" x="310" y="160" dy="0.35em" text-anchor="middle">blocks the parser</text>
  <path class="dg-line dg-dashed" d="M380 160 H420"/>
  <rect class="dg-hot" x="420" y="148" width="30" height="24" rx="4"/>
  <text class="dg-note" x="462" y="160" dy="0.35em">runs, then parsing goes on</text>

  <!-- Step 4: what the screen shows. -->
  <circle class="dg-badge" cx="40" cy="200" r="10"/>
  <text class="dg-on-badge" x="40" y="200" dy="0.35em" text-anchor="middle">4</text>
  <text x="60" y="200" dy="0.35em">First paint</text>
  <rect class="dg-off" x="200" y="188" width="248" height="24" rx="4"/>
  <text class="dg-faint" x="324" y="200" dy="0.35em" text-anchor="middle">blank screen</text>
  <rect class="dg-hot" x="456" y="188" width="160" height="24" rx="4"/>
  <text class="dg-on-hot" x="536" y="200" dy="0.35em" text-anchor="middle">text shows</text>

  <!-- Step 5: the big image. -->
  <circle class="dg-badge" cx="40" cy="240" r="10"/>
  <text class="dg-on-badge" x="40" y="240" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-code" x="60" y="240" dy="0.35em">hero.jpg</text>
  <text class="dg-faint" x="210" y="240" dy="0.35em">found late, low priority</text>
  <rect class="dg-strong" x="456" y="228" width="160" height="24" rx="4"/>

  <!-- Time. -->
  <path class="dg-line" d="M200 284 H636" marker-end="url(#arrow)"/>
  <text class="dg-note" x="200" y="300" dy="0.35em">first byte</text>
  <text class="dg-note" x="640" y="300" dy="0.35em" text-anchor="end">time</text>
</svg>
