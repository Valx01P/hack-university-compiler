<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>The four layers of a box: content, padding, border, and margin</title>
  <desc>A card's box, from the inside out. The content is 300 pixels wide. Around it is 20 pixels of padding on each side, then a 2 pixel border, then a margin that keeps other boxes away. With the default box sizing, the card is 2 plus 20 plus 300 plus 20 plus 2, which is 344 pixels across, not counting the margin.</desc>

  <!-- Margin. -->
  <rect class="dg-off" x="20" y="20" width="640" height="340" rx="12"/>
  <text class="dg-faint" x="36" y="38" dy="0.35em">margin, outside the box</text>

  <!-- Border. -->
  <rect class="dg-strong" x="56" y="56" width="568" height="268" rx="8"/>
  <text class="dg-note" x="72" y="68" dy="0.35em">border</text>
  <text class="dg-note" x="68" y="190" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="612" y="190" dy="0.35em" text-anchor="middle">2</text>

  <!-- Padding. -->
  <rect class="dg-box" x="80" y="80" width="520" height="220" rx="6"/>
  <text class="dg-note" x="96" y="102" dy="0.35em">padding</text>
  <text class="dg-note" x="102" y="190" dy="0.35em" text-anchor="middle">20</text>
  <text class="dg-note" x="578" y="190" dy="0.35em" text-anchor="middle">20</text>

  <!-- Content. -->
  <rect class="dg-hot" x="124" y="124" width="432" height="132" rx="4"/>
  <text class="dg-on-hot" x="340" y="180" dy="0.35em" text-anchor="middle">content
    <tspan class="dg-code" x="340" dy="1.4em">width: 300px</tspan>
  </text>

  <!-- The sum. -->
  <text class="dg-code" x="340" y="342" dy="0.35em" text-anchor="middle">2 + 20 + 300 + 20 + 2 = 344</text>
</svg>
