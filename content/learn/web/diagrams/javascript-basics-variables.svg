<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>Variables are names that refer to values</title>
  <desc>Two variables. The const name trailName refers to the string Lake Loop, and always will. The let name visitors first referred to the number 0. After visitors = 1, it refers to the number 1 instead. The old value isn't changed: the name simply refers to a different value now.</desc>

  <!-- const trailName -->
  <rect class="dg-strong" x="20" y="32" width="220" height="56" rx="8"/>
  <text x="130" y="51" dy="0.35em" text-anchor="middle"><tspan class="dg-code">const trailName</tspan>
    <tspan class="dg-note" x="130" dy="1.4em">always this value</tspan>
  </text>
  <path class="dg-flow" d="M240 60 H376" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="380" y="40" width="140" height="40" rx="8"/>
  <text class="dg-code" x="450" y="60" dy="0.35em" text-anchor="middle">"Lake Loop"</text>
  <text class="dg-note" x="536" y="60" dy="0.35em">a string</text>

  <!-- let visitors -->
  <rect class="dg-strong" x="20" y="148" width="220" height="56" rx="8"/>
  <text x="130" y="167" dy="0.35em" text-anchor="middle"><tspan class="dg-code">let visitors</tspan>
    <tspan class="dg-note" x="130" dy="1.4em">can be assigned again</tspan>
  </text>
  <path class="dg-line dg-dashed" d="M240 164 H300 V148 H376" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="380" y="128" width="140" height="40" rx="8"/>
  <text class="dg-faint" x="450" y="148" dy="0.35em" text-anchor="middle">0</text>
  <text class="dg-note" x="536" y="148" dy="0.35em">before</text>
  <path class="dg-flow" d="M240 188 H300 V204 H376" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="380" y="184" width="140" height="40" rx="8"/>
  <text class="dg-on-hot dg-code" x="450" y="204" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="536" y="204" dy="0.35em">visitors = 1</text>
</svg>
