<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A first visit downloads three files, and a repeat visit makes one small check</title>
  <desc>On the first visit, the browser downloads index.html, the hashed JavaScript bundle, and the hashed stylesheet, each with 200 OK. On the repeat visit, it asks the server whether index.html changed and gets 304 Not Modified, with no body. The two hashed files come straight from the browser's cache, with no request at all.</desc>

  <!-- The first visit. -->
  <rect class="dg-frame" x="20" y="20" width="310" height="300" rx="12"/>
  <text class="dg-heading" x="40" y="46" dy="0.35em">First visit</text>
  <rect class="dg-box" x="40" y="72" width="270" height="56" rx="8"/>
  <text x="56" y="91" dy="0.35em"><tspan class="dg-code">index.html</tspan>
    <tspan class="dg-note" x="56" dy="1.4em">200 OK, downloaded</tspan>
  </text>
  <rect class="dg-box" x="40" y="144" width="270" height="56" rx="8"/>
  <text x="56" y="163" dy="0.35em"><tspan class="dg-code">index-COKNwWg4.js</tspan>
    <tspan class="dg-note" x="56" dy="1.4em">200 OK, downloaded</tspan>
  </text>
  <rect class="dg-box" x="40" y="216" width="270" height="56" rx="8"/>
  <text x="56" y="235" dy="0.35em"><tspan class="dg-code">index-lc8mfrVt.css</tspan>
    <tspan class="dg-note" x="56" dy="1.4em">200 OK, downloaded</tspan>
  </text>
  <text class="dg-note" x="40" y="296" dy="0.35em">three downloads</text>

  <!-- The repeat visit. -->
  <rect class="dg-frame" x="350" y="20" width="310" height="300" rx="12"/>
  <text class="dg-heading" x="370" y="46" dy="0.35em">Repeat visit</text>
  <rect class="dg-hot" x="370" y="72" width="270" height="56" rx="8"/>
  <text class="dg-on-hot" x="386" y="91" dy="0.35em"><tspan class="dg-code">index.html</tspan>
    <tspan x="386" dy="1.4em">checked, 304 Not Modified</tspan>
  </text>
  <rect class="dg-off" x="370" y="144" width="270" height="56" rx="8"/>
  <text class="dg-faint" x="386" y="163" dy="0.35em"><tspan class="dg-code">index-COKNwWg4.js</tspan>
    <tspan x="386" dy="1.4em">from the cache, no request</tspan>
  </text>
  <rect class="dg-off" x="370" y="216" width="270" height="56" rx="8"/>
  <text class="dg-faint" x="386" y="235" dy="0.35em"><tspan class="dg-code">index-lc8mfrVt.css</tspan>
    <tspan x="386" dy="1.4em">from the cache, no request</tspan>
  </text>
  <text class="dg-note" x="370" y="296" dy="0.35em">one small round trip</text>
</svg>
