<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>vite build turns the project's files into hashed files in dist</title>
  <desc>On the left, the project: index.html, main.js, notes.js, the date-fns package, help.js, and style.css. vite build writes the dist folder on the right. index.html becomes a new index.html. main.js, notes.js, and the part of date-fns they use become one bundle, index-COKNwWg4.js, 12.31 kB. help.js becomes its own chunk, loaded on a click, and style.css becomes index-lc8mfrVt.css.</desc>

  <text class="dg-code" x="340" y="44" dy="0.35em" text-anchor="middle">vite build</text>

  <!-- The project. -->
  <rect class="dg-frame" x="20" y="20" width="250" height="340" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">Your project</text>
  <rect class="dg-box" x="40" y="60" width="210" height="36" rx="8"/>
  <text class="dg-code" x="56" y="78" dy="0.35em">index.html</text>
  <rect class="dg-box" x="40" y="108" width="210" height="36" rx="8"/>
  <text class="dg-code" x="56" y="126" dy="0.35em">src/main.js</text>
  <rect class="dg-box" x="40" y="156" width="210" height="36" rx="8"/>
  <text class="dg-code" x="56" y="174" dy="0.35em">src/notes.js</text>
  <rect class="dg-box" x="40" y="204" width="210" height="36" rx="8"/>
  <text class="dg-code" x="56" y="222" dy="0.35em">node_modules/date-fns</text>
  <rect class="dg-box" x="40" y="252" width="210" height="36" rx="8"/>
  <text class="dg-code" x="56" y="270" dy="0.35em">src/help.js</text>
  <rect class="dg-box" x="40" y="300" width="210" height="36" rx="8"/>
  <text class="dg-code" x="56" y="318" dy="0.35em">src/style.css</text>

  <!-- Where each one goes. -->
  <path class="dg-line" d="M250 78 H426" marker-end="url(#arrow)"/>
  <path class="dg-flow" d="M250 126 H330"/>
  <path class="dg-flow" d="M250 174 H330"/>
  <path class="dg-flow" d="M250 222 H330"/>
  <path class="dg-flow" d="M330 126 V222"/>
  <path class="dg-flow" d="M330 144 H426" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M250 270 H350 V224 H426" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M250 318 H370 V304 H426" marker-end="url(#arrow)"/>

  <!-- dist. -->
  <rect class="dg-frame" x="410" y="20" width="250" height="340" rx="12"/>
  <text class="dg-heading" x="640" y="44" dy="0.35em" text-anchor="end">dist</text>
  <rect class="dg-box" x="430" y="60" width="210" height="36" rx="8"/>
  <text class="dg-code" x="446" y="78" dy="0.35em">index.html</text>
  <rect class="dg-hot" x="430" y="116" width="210" height="56" rx="8"/>
  <text class="dg-on-hot" x="446" y="135" dy="0.35em"><tspan class="dg-code">assets/index-COKNwWg4.js</tspan>
    <tspan x="446" dy="1.4em">12.31 kB, the page's code</tspan>
  </text>
  <rect class="dg-box" x="430" y="196" width="210" height="56" rx="8"/>
  <text x="446" y="215" dy="0.35em"><tspan class="dg-code">assets/help-Q_Mjzo9I.js</tspan>
    <tspan class="dg-note" x="446" dy="1.4em">0.24 kB, loaded on a click</tspan>
  </text>
  <rect class="dg-box" x="430" y="276" width="210" height="56" rx="8"/>
  <text x="446" y="295" dy="0.35em"><tspan class="dg-code">assets/index-lc8mfrVt.css</tspan>
    <tspan class="dg-note" x="446" dy="1.4em">0.07 kB</tspan>
  </text>
</svg>
