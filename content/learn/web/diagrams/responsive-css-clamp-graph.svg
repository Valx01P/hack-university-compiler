<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A clamp() font size against the viewport's width</title>
  <desc>A graph of the heading size clamp(1.5rem, 1rem + 2.5vw, 3rem) at the default text size. Up to a viewport 320 pixels wide, the size stays flat at the floor, 24 pixels. From 320 to 1280 pixels wide it rises in a straight line, following 1rem plus 2.5vw. From 1280 pixels on, it stays flat at the ceiling, 48 pixels.</desc>

  <!-- Axes. -->
  <text class="dg-note" x="80" y="24" dy="0.35em">font size (px)</text>
  <path class="dg-line" d="M80 280 V44" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M80 280 H636" marker-end="url(#arrow)"/>
  <text class="dg-note" x="640" y="320" dy="0.35em" text-anchor="end">viewport width (px)</text>

  <!-- Guides. -->
  <path class="dg-line dg-dashed" d="M80 88 H528"/>
  <path class="dg-line dg-dashed" d="M192 184 V280"/>
  <path class="dg-line dg-dashed" d="M528 88 V280"/>
  <text class="dg-code" x="68" y="184" dy="0.35em" text-anchor="end">24</text>
  <text class="dg-code" x="68" y="88" dy="0.35em" text-anchor="end">48</text>
  <text class="dg-code" x="192" y="296" dy="0.35em" text-anchor="middle">320</text>
  <text class="dg-code" x="528" y="296" dy="0.35em" text-anchor="middle">1280</text>

  <!-- The size. -->
  <polyline class="dg-flow" points="80,184 192,184 528,88 632,88"/>
  <text class="dg-code" x="136" y="164" dy="0.35em" text-anchor="middle">1.5rem</text>
  <text class="dg-note" x="136" y="208" dy="0.35em" text-anchor="middle">the floor</text>
  <text class="dg-code" x="396" y="176" dy="0.35em" text-anchor="middle">1rem + 2.5vw</text>
  <text class="dg-note" x="396" y="198" dy="0.35em" text-anchor="middle">grows with the window</text>
  <text class="dg-code" x="580" y="68" dy="0.35em" text-anchor="middle">3rem</text>
  <text class="dg-note" x="580" y="112" dy="0.35em" text-anchor="middle">the ceiling</text>
</svg>
