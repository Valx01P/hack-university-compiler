<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <title>State goes in, an element tree comes out, and React changes only the difference</title>
  <desc>Step 1, the state changes: the count goes from 2 to 3. Step 2, React calls the component again. Step 3, the component returns a new element tree, a header holding an h1 and a span that now says 3. Step 4, React compares it with the last tree and finds one difference. Step 5, React makes one DOM change, setting the span's text to 3, and leaves the rest of the page as it was.</desc>

  <rect class="dg-box" x="20" y="20" width="200" height="56" rx="8"/>
  <circle class="dg-badge" cx="40" cy="48" r="10"/>
  <text class="dg-on-badge" x="40" y="48" dy="0.35em" text-anchor="middle">1</text>
  <text x="60" y="38" dy="0.35em">State changes
    <tspan class="dg-code" x="60" dy="1.4em">count: 2 → 3</tspan>
  </text>
  <path class="dg-flow" d="M220 48 H256" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="260" y="20" width="200" height="56" rx="8"/>
  <circle class="dg-badge" cx="280" cy="48" r="10"/>
  <text class="dg-on-badge" x="280" y="48" dy="0.35em" text-anchor="middle">2</text>
  <text x="300" y="38" dy="0.35em">Component runs
    <tspan class="dg-code" x="300" dy="1.4em">CartBadge()</tspan>
  </text>
  <path class="dg-flow" d="M460 48 H550 V106" marker-end="url(#arrow-flow)"/>

  <!-- The last tree. -->
  <rect class="dg-frame" x="20" y="110" width="220" height="170" rx="12"/>
  <text class="dg-heading" x="36" y="130" dy="0.35em">Last tree</text>
  <rect class="dg-box" x="80" y="148" width="100" height="36" rx="8"/>
  <text class="dg-code" x="130" y="166" dy="0.35em" text-anchor="middle">header</text>
  <path class="dg-line" d="M130 184 V202 H78 V220"/>
  <path class="dg-line" d="M130 202 H182 V220"/>
  <rect class="dg-box" x="36" y="220" width="84" height="36" rx="8"/>
  <text class="dg-code" x="78" y="238" dy="0.35em" text-anchor="middle">h1</text>
  <rect class="dg-box" x="140" y="220" width="84" height="36" rx="8"/>
  <text class="dg-code" x="182" y="238" dy="0.35em" text-anchor="middle">span: 2</text>

  <!-- Compare. -->
  <path class="dg-line dg-dashed" d="M240 195 H440"/>
  <circle class="dg-badge" cx="340" cy="195" r="10"/>
  <text class="dg-on-badge" x="340" y="195" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="340" y="222" dy="0.35em" text-anchor="middle">compare</text>

  <!-- The new tree. -->
  <rect class="dg-frame" x="440" y="110" width="220" height="170" rx="12"/>
  <circle class="dg-badge" cx="466" cy="130" r="10"/>
  <text class="dg-on-badge" x="466" y="130" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-heading" x="484" y="130" dy="0.35em">New tree</text>
  <rect class="dg-box" x="500" y="148" width="100" height="36" rx="8"/>
  <text class="dg-code" x="550" y="166" dy="0.35em" text-anchor="middle">header</text>
  <path class="dg-line" d="M550 184 V202 H498 V220"/>
  <path class="dg-line" d="M550 202 H602 V220"/>
  <rect class="dg-box" x="456" y="220" width="84" height="36" rx="8"/>
  <text class="dg-code" x="498" y="238" dy="0.35em" text-anchor="middle">h1</text>
  <rect class="dg-hot" x="560" y="220" width="84" height="36" rx="8"/>
  <text class="dg-on-hot dg-code" x="602" y="238" dy="0.35em" text-anchor="middle">span: 3</text>

  <!-- The DOM. -->
  <path class="dg-flow" d="M550 280 V316" marker-end="url(#arrow-flow)"/>
  <rect class="dg-off" x="20" y="320" width="380" height="56" rx="8"/>
  <text class="dg-faint" x="40" y="338" dy="0.35em">The rest of the page stays as it was
    <tspan x="40" dy="1.4em">focus, typing, and scroll position survive</tspan>
  </text>
  <rect class="dg-hot" x="420" y="320" width="240" height="56" rx="8"/>
  <circle class="dg-badge" cx="440" cy="348" r="10"/>
  <text class="dg-on-badge" x="440" y="348" dy="0.35em" text-anchor="middle">5</text>
  <text class="dg-on-hot" x="460" y="338" dy="0.35em">One DOM change
    <tspan class="dg-code" x="460" dy="1.4em">span.textContent = "3"</tspan>
  </text>
</svg>
