<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Hydration pairs the server's HTML with the browser's render</title>
  <desc>On the left, the elements that arrived as HTML from the server: the heading, the price, the button, and the reviews list. On the right, the same elements as React renders them in the browser. hydrateRoot matches them up node by node, keeps the existing elements, and attaches the button's onClick handler, so the page starts responding.</desc>

  <rect class="dg-frame" x="20" y="20" width="240" height="280" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">HTML from the server</text>
  <rect class="dg-box" x="40" y="68" width="200" height="40" rx="8"/>
  <text class="dg-code" x="140" y="88" dy="0.35em" text-anchor="middle">&lt;h1&gt;</text>
  <rect class="dg-box" x="40" y="128" width="200" height="40" rx="8"/>
  <text class="dg-code" x="140" y="148" dy="0.35em" text-anchor="middle">&lt;p&gt;$219.00&lt;/p&gt;</text>
  <rect class="dg-box" x="40" y="188" width="200" height="40" rx="8"/>
  <text class="dg-code" x="140" y="208" dy="0.35em" text-anchor="middle">&lt;button&gt;</text>
  <rect class="dg-box" x="40" y="248" width="200" height="40" rx="8"/>
  <text class="dg-code" x="140" y="268" dy="0.35em" text-anchor="middle">&lt;ul&gt; reviews</text>

  <rect class="dg-frame" x="420" y="20" width="240" height="280" rx="12"/>
  <text class="dg-heading" x="440" y="44" dy="0.35em">Render in the browser</text>
  <rect class="dg-box" x="440" y="68" width="200" height="40" rx="8"/>
  <text x="540" y="88" dy="0.35em" text-anchor="middle">h1</text>
  <rect class="dg-box" x="440" y="128" width="200" height="40" rx="8"/>
  <text x="540" y="148" dy="0.35em" text-anchor="middle">p</text>
  <rect class="dg-hot" x="440" y="188" width="200" height="40" rx="8"/>
  <text class="dg-on-hot" x="540" y="208" dy="0.35em" text-anchor="middle">button + onClick</text>
  <rect class="dg-box" x="440" y="248" width="200" height="40" rx="8"/>
  <text x="540" y="268" dy="0.35em" text-anchor="middle">Reviews</text>

  <!-- hydrateRoot matches each pair. -->
  <text class="dg-code" x="340" y="44" dy="0.35em" text-anchor="middle">hydrateRoot</text>
  <path class="dg-line dg-dashed" d="M240 88 H440"/>
  <path class="dg-line dg-dashed" d="M240 148 H440"/>
  <path class="dg-flow" d="M436 208 H244" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="194" dy="0.35em" text-anchor="middle">handler attached</text>
  <path class="dg-line dg-dashed" d="M240 268 H440"/>
</svg>
