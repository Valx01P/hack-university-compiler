<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <title>One update in five steps: trigger, render, commit, paint, effects</title>
  <desc>An update starts with a trigger, like a set function. React renders, calling your components to get a tree of elements, then commits, changing only the parts of the DOM that differ. The browser then works out styles and layout and paints the screen. Last, React runs your effects.</desc>

  <!-- React's work. -->
  <rect class="dg-frame" x="20" y="20" width="640" height="252" rx="12"/>
  <text class="dg-heading" x="640" y="44" dy="0.35em" text-anchor="end">React</text>

  <circle class="dg-badge" cx="48" cy="84" r="10"/>
  <text class="dg-on-badge" x="48" y="84" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-box" x="72" y="60" width="180" height="48" rx="8"/>
  <text x="162" y="84" dy="0.35em" text-anchor="middle">Trigger</text>
  <text class="dg-note" x="276" y="76" dy="0.35em">a set function, or the first render
    <tspan class="dg-code" x="276" dy="1.4em">setCount(1)</tspan>
  </text>

  <path class="dg-line" d="M162 108 V128" marker-end="url(#arrow)"/>

  <circle class="dg-badge" cx="48" cy="156" r="10"/>
  <text class="dg-on-badge" x="48" y="156" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-hot" x="72" y="132" width="180" height="48" rx="8"/>
  <text class="dg-on-hot" x="162" y="156" dy="0.35em" text-anchor="middle">Render</text>
  <text class="dg-note" x="276" y="148" dy="0.35em">calls your components
    <tspan x="276" dy="1.4em">and gets a tree of elements</tspan>
  </text>

  <path class="dg-line" d="M162 180 V200" marker-end="url(#arrow)"/>

  <circle class="dg-badge" cx="48" cy="228" r="10"/>
  <text class="dg-on-badge" x="48" y="228" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-hot" x="72" y="204" width="180" height="48" rx="8"/>
  <text class="dg-on-hot" x="162" y="228" dy="0.35em" text-anchor="middle">Commit</text>
  <text class="dg-note" x="276" y="220" dy="0.35em">compares with the last tree
    <tspan x="276" dy="1.4em">and changes only what differs</tspan>
  </text>

  <!-- The browser's work. -->
  <path class="dg-flow" d="M162 252 V308" marker-end="url(#arrow-flow)"/>
  <rect class="dg-frame" x="20" y="292" width="640" height="76" rx="12"/>
  <text class="dg-heading" x="640" y="316" dy="0.35em" text-anchor="end">Browser</text>
  <circle class="dg-badge" cx="48" cy="336" r="10"/>
  <text class="dg-on-badge" x="48" y="336" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-strong" x="72" y="312" width="180" height="48" rx="8"/>
  <text x="162" y="336" dy="0.35em" text-anchor="middle">Paint</text>
  <text class="dg-note" x="276" y="328" dy="0.35em">style, layout, and paint
    <tspan x="276" dy="1.4em">the new pixels appear</tspan>
  </text>

  <!-- React again. -->
  <path class="dg-line" d="M162 360 V404" marker-end="url(#arrow)"/>
  <rect class="dg-frame" x="20" y="388" width="640" height="76" rx="12"/>
  <text class="dg-heading" x="640" y="412" dy="0.35em" text-anchor="end">React</text>
  <circle class="dg-badge" cx="48" cy="432" r="10"/>
  <text class="dg-on-badge" x="48" y="432" dy="0.35em" text-anchor="middle">5</text>
  <rect class="dg-box" x="72" y="408" width="180" height="48" rx="8"/>
  <text x="162" y="432" dy="0.35em" text-anchor="middle">Effects</text>
  <text class="dg-note" x="276" y="432" dy="0.35em">your useEffect code runs</text>
</svg>
