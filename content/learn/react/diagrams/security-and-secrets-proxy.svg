<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <title>A secret key used only between your server and the payment service</title>
  <desc>The browser sends POST /v1/orders to your API with the shopper's session cookie and no keys. Your API checks the shopper and the cart, reads the secret key from its own environment, and calls the payment service with it. The key never reaches the browser.</desc>

  <rect class="dg-box" x="20" y="60" width="170" height="56" rx="8"/>
  <text x="105" y="79" dy="0.35em" text-anchor="middle">Browser
    <tspan class="dg-note" x="105" dy="1.4em">session cookie only</tspan>
  </text>

  <rect class="dg-strong" x="255" y="60" width="170" height="56" rx="8"/>
  <text x="340" y="79" dy="0.35em" text-anchor="middle">Your API
    <tspan class="dg-note" x="340" dy="1.4em">checks the shopper</tspan>
  </text>

  <rect class="dg-box" x="490" y="60" width="170" height="56" rx="8"/>
  <text x="575" y="88" dy="0.35em" text-anchor="middle">Payment service</text>

  <!-- First hop: no key. -->
  <path class="dg-line" d="M190 88 H251" marker-end="url(#arrow)"/>
  <text class="dg-code" x="222" y="40" dy="0.35em" text-anchor="middle">/v1/orders</text>

  <!-- Last hop: the key. -->
  <path class="dg-flow" d="M425 88 H486" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="457" y="40" dy="0.35em" text-anchor="middle">Bearer sk_…</text>

  <!-- Where the key lives. -->
  <path class="dg-line" d="M340 116 V146"/>
  <rect class="dg-hot" x="250" y="150" width="180" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="169" dy="0.35em" text-anchor="middle">secret key
    <tspan class="dg-code" x="340" dy="1.4em">process.env</tspan>
  </text>
</svg>
