<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>One review, two paths: escaped as text, or parsed as HTML</title>
  <desc>A stranger's review holds an image tag with an onerror attribute. On the top path, the review goes into JSX braces, React escapes it, and it shows on screen as text, so nothing runs. On the bottom path, it goes into dangerouslySetInnerHTML, the browser parses it as HTML, and the onerror code runs as the visitor.</desc>

  <!-- The review a stranger wrote. -->
  <rect class="dg-strong" x="20" y="116" width="190" height="56" rx="8"/>
  <text x="115" y="135" dy="0.35em" text-anchor="middle">A stranger's review
    <tspan class="dg-code" x="115" dy="1.4em">&lt;img onerror=…&gt;</tspan>
  </text>

  <!-- The escaped path. -->
  <path class="dg-flow" d="M210 132 H230 V64 H246" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="250" y="36" width="220" height="56" rx="8"/>
  <text class="dg-on-hot" x="360" y="55" dy="0.35em" text-anchor="middle">React escapes it
    <tspan class="dg-code" x="360" dy="1.4em">{review.body}</tspan>
  </text>
  <path class="dg-flow" d="M470 64 H496" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="500" y="36" width="160" height="56" rx="8"/>
  <text x="580" y="55" dy="0.35em" text-anchor="middle">Shown as text
    <tspan class="dg-note" x="580" dy="1.4em">nothing runs</tspan>
  </text>

  <!-- The unsafe path. -->
  <path class="dg-line" d="M210 156 H230 V224 H246" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="250" y="196" width="220" height="56" rx="8"/>
  <text x="360" y="215" dy="0.35em" text-anchor="middle">Parsed as HTML
    <tspan class="dg-code" x="360" dy="1.4em">dangerouslySetInnerHTML</tspan>
  </text>
  <path class="dg-line" d="M470 224 H496" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="500" y="196" width="160" height="56" rx="8"/>
  <text x="580" y="215" dy="0.35em" text-anchor="middle">onerror runs
    <tspan class="dg-note" x="580" dy="1.4em">as the visitor</tspan>
  </text>
</svg>
