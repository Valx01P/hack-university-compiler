<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Server-side rendering: content first, then hydration</title>
  <desc>A waterfall on the same time scale as client-side rendering. Step 1, the server fetches the data and renders the page, so the first byte waits for it. Step 2, the HTML arrives with the content in it, and the page is visible. Step 3, the browser downloads the JavaScript bundle. Step 4, React hydrates the page, and it becomes interactive. Between steps 2 and 4, the page can be seen but doesn't respond yet.</desc>

  <circle class="dg-badge" cx="36" cy="44" r="10"/>
  <text class="dg-on-badge" x="36" y="44" dy="0.35em" text-anchor="middle">1</text>
  <text x="56" y="44" dy="0.35em">Server renders</text>
  <rect class="dg-box" x="220" y="28" width="120" height="32" rx="8"/>
  <text class="dg-note" x="280" y="44" dy="0.35em" text-anchor="middle">data, then HTML</text>

  <circle class="dg-badge" cx="36" cy="92" r="10"/>
  <text class="dg-on-badge" x="36" y="92" dy="0.35em" text-anchor="middle">2</text>
  <text x="56" y="92" dy="0.35em">HTML arrives</text>
  <rect class="dg-hot" x="340" y="76" width="50" height="32" rx="8"/>

  <circle class="dg-badge" cx="36" cy="140" r="10"/>
  <text class="dg-on-badge" x="36" y="140" dy="0.35em" text-anchor="middle">3</text>
  <text x="56" y="140" dy="0.35em">Download the JS</text>
  <rect class="dg-box" x="390" y="124" width="160" height="32" rx="8"/>

  <circle class="dg-badge" cx="36" cy="188" r="10"/>
  <text class="dg-on-badge" x="36" y="188" dy="0.35em" text-anchor="middle">4</text>
  <text x="56" y="188" dy="0.35em">Hydrate</text>
  <rect class="dg-box" x="550" y="172" width="60" height="32" rx="8"/>

  <path class="dg-line" d="M220 232 H656" marker-end="url(#arrow)"/>
  <text class="dg-note" x="656" y="248" dy="0.35em" text-anchor="end">time</text>
  <rect class="dg-off" x="220" y="256" width="116" height="28" rx="8"/>
  <text class="dg-faint" x="278" y="270" dy="0.35em" text-anchor="middle">blank</text>
  <rect class="dg-off" x="344" y="256" width="262" height="28" rx="8"/>
  <text class="dg-faint" x="475" y="270" dy="0.35em" text-anchor="middle">visible, not interactive yet</text>
  <text class="dg-note" x="636" y="270" dy="0.35em" text-anchor="middle">ready</text>
</svg>
