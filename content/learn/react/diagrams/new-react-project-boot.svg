<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
  <title>How the page boots, in development and in a build</title>
  <desc>Step 1, the browser gets index.html, which has an empty root div and a script tag. In development the script is src/main.tsx, and in a build it's one hashed bundle. Step 2, in development Vite compiles each file when the browser asks for it, while a build sends one file already compiled. Step 3, in development each import loads the same way. Step 4, createRoot and render start React, which calls App and fills the root div. Step 5, the browser paints the page.</desc>

  <text class="dg-heading" x="72" y="24" dy="0.35em">npm run dev</text>
  <text class="dg-heading" x="412" y="24" dy="0.35em">After npm run build</text>

  <circle class="dg-badge" cx="40" cy="78" r="10"/>
  <text class="dg-on-badge" x="40" y="78" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-box" x="72" y="50" width="320" height="56" rx="8"/>
  <text x="88" y="68" dy="0.35em">The browser gets index.html
    <tspan class="dg-code" x="88" dy="1.4em">src="/src/main.tsx"</tspan>
  </text>
  <rect class="dg-box" x="412" y="50" width="248" height="56" rx="8"/>
  <text x="428" y="68" dy="0.35em">The same page, built
    <tspan class="dg-code" x="428" dy="1.4em">/assets/index-GpEN3EET.js</tspan>
  </text>
  <path class="dg-flow" d="M40 88 V140" marker-end="url(#arrow-flow)"/>

  <circle class="dg-badge" cx="40" cy="154" r="10"/>
  <text class="dg-on-badge" x="40" y="154" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="72" y="126" width="320" height="56" rx="8"/>
  <text x="88" y="144" dy="0.35em">Vite compiles main.tsx when asked
    <tspan class="dg-note" x="88" dy="1.4em">JSX becomes calls, and types are removed</tspan>
  </text>
  <rect class="dg-box" x="412" y="126" width="248" height="56" rx="8"/>
  <text x="428" y="144" dy="0.35em">One bundle, compiled
    <tspan class="dg-note" x="428" dy="1.4em">your code and React, minified</tspan>
  </text>
  <path class="dg-flow" d="M40 164 V216" marker-end="url(#arrow-flow)"/>

  <circle class="dg-badge" cx="40" cy="230" r="10"/>
  <text class="dg-on-badge" x="40" y="230" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="72" y="202" width="320" height="56" rx="8"/>
  <text x="88" y="220" dy="0.35em">Each import loads the same way
    <tspan class="dg-code" x="88" dy="1.4em">App.tsx, index.css, react</tspan>
  </text>
  <rect class="dg-off" x="412" y="202" width="248" height="56" rx="8"/>
  <text class="dg-faint" x="428" y="220" dy="0.35em">Already in the bundle
    <tspan x="428" dy="1.4em">no more requests for code</tspan>
  </text>
  <path class="dg-flow" d="M40 240 V292" marker-end="url(#arrow-flow)"/>

  <circle class="dg-badge" cx="40" cy="306" r="10"/>
  <text class="dg-on-badge" x="40" y="306" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-hot" x="72" y="278" width="588" height="56" rx="8"/>
  <text class="dg-on-hot" x="88" y="296" dy="0.35em"><tspan class="dg-code">createRoot(root).render(&lt;App /&gt;)</tspan>
    <tspan x="88" dy="1.4em">React calls App and builds the DOM inside the root div</tspan>
  </text>
  <path class="dg-flow" d="M40 316 V368" marker-end="url(#arrow-flow)"/>

  <circle class="dg-badge" cx="40" cy="382" r="10"/>
  <text class="dg-on-badge" x="40" y="382" dy="0.35em" text-anchor="middle">5</text>
  <rect class="dg-box" x="72" y="354" width="588" height="56" rx="8"/>
  <text x="88" y="372" dy="0.35em">The browser lays out and paints the page
    <tspan class="dg-note" x="88" dy="1.4em">the first thing anyone sees</tspan>
  </text>
</svg>
