<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>A streamed page: the shell first, then the reviews in the same response</title>
  <desc>The server renders the shell and sends it at once, in step 1, and the browser shows the heading, the price, and the Loading reviews fallback while it starts loading the JavaScript. About a second later, in step 2, the reviews are ready and the server sends their HTML in the same response. In step 3, a small script in that chunk swaps the reviews in where the fallback was.</desc>

  <rect class="dg-frame" x="20" y="20" width="200" height="260" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">Server</text>
  <rect class="dg-box" x="40" y="72" width="160" height="56" rx="8"/>
  <text x="120" y="91" dy="0.35em" text-anchor="middle">Renders
    <tspan class="dg-note" x="120" dy="1.4em">everything but reviews</tspan>
  </text>
  <rect class="dg-box" x="40" y="184" width="160" height="56" rx="8"/>
  <text x="120" y="203" dy="0.35em" text-anchor="middle">Reviews ready
    <tspan class="dg-note" x="120" dy="1.4em">a second later</tspan>
  </text>

  <rect class="dg-frame" x="460" y="20" width="200" height="260" rx="12"/>
  <text class="dg-heading" x="480" y="44" dy="0.35em">Browser</text>
  <rect class="dg-box" x="480" y="72" width="160" height="56" rx="8"/>
  <text x="560" y="91" dy="0.35em" text-anchor="middle">Shows the shell
    <tspan class="dg-note" x="560" dy="1.4em">loads the JavaScript</tspan>
  </text>
  <rect class="dg-hot" x="480" y="184" width="160" height="56" rx="8"/>
  <text class="dg-on-hot" x="560" y="203" dy="0.35em" text-anchor="middle">Swaps them in
    <tspan class="dg-code" x="560" dy="1.4em">$RC("B:0","S:0")</tspan>
  </text>

  <!-- Step 1: the shell. -->
  <path class="dg-flow" d="M200 100 H476" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="280" cy="80" r="10"/>
  <text class="dg-on-badge" x="280" y="80" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="296" y="80" dy="0.35em">the shell</text>

  <!-- Step 2: the reviews chunk. -->
  <path class="dg-flow" d="M200 212 H476" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="280" cy="192" r="10"/>
  <text class="dg-on-badge" x="280" y="192" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="296" y="192" dy="0.35em">the reviews chunk</text>

  <!-- Step 3: the swap. -->
  <circle class="dg-badge" cx="480" cy="256" r="10"/>
  <text class="dg-on-badge" x="480" y="256" dy="0.35em" text-anchor="middle">3</text>
</svg>
