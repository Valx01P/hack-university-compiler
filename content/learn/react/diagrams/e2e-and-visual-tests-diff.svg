<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>A visual test compares a baseline and a new screenshot, and marks the diff</title>
  <desc>Three pictures side by side. The baseline is the approved screenshot of the product grid. The new screenshot was taken after the cards' padding grew, so the text inside each card sits a little lower and further in. The diff fades both out and marks every changed pixel in red, which here is the text in every card.</desc>

  <!-- The baseline. -->
  <text class="dg-heading" x="113" y="36" dy="0.35em" text-anchor="middle">Baseline</text>
  <rect class="dg-frame" x="20" y="56" width="186" height="184" rx="12"/>
  <rect class="dg-box" x="36" y="72" width="70" height="70" rx="8"/>
  <rect class="dg-box" x="120" y="72" width="70" height="70" rx="8"/>
  <rect class="dg-box" x="36" y="154" width="70" height="70" rx="8"/>
  <rect class="dg-box" x="120" y="154" width="70" height="70" rx="8"/>
  <path class="dg-line" d="M44 84 H90"/>
  <path class="dg-line" d="M128 84 H174"/>
  <path class="dg-line" d="M44 166 H90"/>
  <path class="dg-line" d="M128 166 H174"/>

  <!-- The new screenshot: the text moved in. -->
  <text class="dg-heading" x="340" y="36" dy="0.35em" text-anchor="middle">New screenshot</text>
  <rect class="dg-frame" x="247" y="56" width="186" height="184" rx="12"/>
  <rect class="dg-box" x="263" y="72" width="70" height="70" rx="8"/>
  <rect class="dg-box" x="347" y="72" width="70" height="70" rx="8"/>
  <rect class="dg-box" x="263" y="154" width="70" height="70" rx="8"/>
  <rect class="dg-box" x="347" y="154" width="70" height="70" rx="8"/>
  <path class="dg-line" d="M275 92 H321"/>
  <path class="dg-line" d="M359 92 H405"/>
  <path class="dg-line" d="M275 174 H321"/>
  <path class="dg-line" d="M359 174 H405"/>

  <!-- The diff: changed pixels marked. -->
  <text class="dg-heading" x="567" y="36" dy="0.35em" text-anchor="middle">Diff</text>
  <rect class="dg-frame" x="474" y="56" width="186" height="184" rx="12"/>
  <rect class="dg-off" x="490" y="72" width="70" height="70" rx="8"/>
  <rect class="dg-off" x="574" y="72" width="70" height="70" rx="8"/>
  <rect class="dg-off" x="490" y="154" width="70" height="70" rx="8"/>
  <rect class="dg-off" x="574" y="154" width="70" height="70" rx="8"/>
  <rect class="dg-hot" x="496" y="80" width="58" height="18" rx="3"/>
  <rect class="dg-hot" x="580" y="80" width="58" height="18" rx="3"/>
  <rect class="dg-hot" x="496" y="162" width="58" height="18" rx="3"/>
  <rect class="dg-hot" x="580" y="162" width="58" height="18" rx="3"/>

  <text class="dg-note" x="340" y="260" dy="0.35em" text-anchor="middle">more padding moved the text in every card</text>
</svg>
