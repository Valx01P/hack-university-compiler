<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>A forged request from another site, sent without the session cookie</title>
  <desc>Sam's browser has two tabs. In step 1, Sam logs in on the shop's tab and the browser stores the th_session cookie, marked SameSite=Lax. In step 2, a page on evil.example posts to the shop's API, and the browser leaves the cookie off, since another site started the request. In step 3, the API sees no session and answers 401.</desc>

  <rect class="dg-frame" x="20" y="20" width="320" height="300" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">Sam's browser</text>

  <!-- The shop's own tab. -->
  <rect class="dg-box" x="40" y="68" width="280" height="56" rx="8"/>
  <text class="dg-code" x="180" y="87" dy="0.35em" text-anchor="middle">shop.trailhead.example</text>
  <text class="dg-note" x="180" y="107" dy="0.35em" text-anchor="middle">Sam is logged in</text>

  <!-- The cookie the browser keeps. -->
  <rect class="dg-off" x="40" y="146" width="280" height="56" rx="8"/>
  <text class="dg-faint" x="180" y="165" dy="0.35em" text-anchor="middle">cookie jar</text>
  <text class="dg-code" x="180" y="185" dy="0.35em" text-anchor="middle">th_session, SameSite=Lax</text>

  <!-- The other site's tab. -->
  <rect class="dg-strong" x="40" y="224" width="280" height="56" rx="8"/>
  <text class="dg-code" x="180" y="243" dy="0.35em" text-anchor="middle">evil.example</text>
  <text class="dg-note" x="180" y="263" dy="0.35em" text-anchor="middle">a page with a script</text>

  <!-- The API. -->
  <rect class="dg-hot" x="480" y="148" width="180" height="56" rx="8"/>
  <text class="dg-on-hot" x="570" y="176" dy="0.35em" text-anchor="middle">Trailhead API</text>

  <!-- Step 1: Sam's own login. -->
  <path class="dg-flow" d="M320 96 H420 V160 H476" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="364" cy="76" r="10"/>
  <text class="dg-on-badge" x="364" y="76" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="380" y="76" dy="0.35em">log in</text>

  <!-- Step 2: the forged post, without the cookie. -->
  <path class="dg-line" d="M320 244 H420 V192 H476" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="364" cy="264" r="10"/>
  <text class="dg-on-badge" x="364" y="264" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="380" y="264" dy="0.35em">POST, no cookie</text>

  <!-- Step 3: the API turns it away. -->
  <path class="dg-line dg-dashed" d="M570 204 V300 H180 V284" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="604" cy="252" r="10"/>
  <text class="dg-on-badge" x="604" y="252" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="620" y="252" dy="0.35em">401</text>
</svg>
