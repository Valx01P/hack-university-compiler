<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>The category state lifted to ProductsPage, the filter and grid's closest common parent</title>
  <desc>App renders Header and ProductsPage. Step 1, ProductsPage holds the category state. Step 2, it passes the category down to CategoryFilter and the matching products down to ProductGrid. Step 3, CategoryFilter calls onChange with the new category, an event that goes back up to ProductsPage. Header doesn't need the category, so the state goes no higher.</desc>

  <!-- App -->
  <rect class="dg-box" x="250" y="20" width="100" height="40" rx="8"/>
  <text x="300" y="40" dy="0.35em" text-anchor="middle">App</text>
  <path class="dg-line" d="M280 60 V80 H120 V96" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M320 60 V80 H420 V96" marker-end="url(#arrow)"/>

  <!-- Header, which doesn't need the state -->
  <rect class="dg-off" x="40" y="100" width="160" height="56" rx="8"/>
  <text class="dg-faint" x="120" y="118" dy="0.35em" text-anchor="middle">Header
    <tspan x="120" dy="1.4em">doesn't need it</tspan>
  </text>

  <!-- Step 1: the parent holds the state -->
  <rect class="dg-hot" x="300" y="100" width="240" height="56" rx="8"/>
  <text class="dg-on-hot" x="420" y="118" dy="0.35em" text-anchor="middle">ProductsPage
    <tspan class="dg-code" x="420" dy="1.4em">category state</tspan>
  </text>
  <circle class="dg-badge" cx="564" cy="128" r="10"/>
  <text class="dg-on-badge" x="564" y="128" dy="0.35em" text-anchor="middle">1</text>

  <!-- Step 2: props down -->
  <path class="dg-flow" d="M340 156 V256" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M500 156 V256" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="364" cy="206" r="10"/>
  <text class="dg-on-badge" x="364" y="206" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="382" y="206" dy="0.35em">category</text>
  <text class="dg-code" x="512" y="206" dy="0.35em">products</text>

  <!-- Step 3: the event goes up -->
  <path class="dg-line dg-dashed" d="M260 260 V128 H296" marker-end="url(#arrow)"/>
  <text class="dg-code" x="248" y="206" dy="0.35em" text-anchor="end">onChange("tents")</text>
  <circle class="dg-badge" cx="104" cy="206" r="10"/>
  <text class="dg-on-badge" x="104" y="206" dy="0.35em" text-anchor="middle">3</text>

  <!-- The children -->
  <rect class="dg-box" x="220" y="260" width="180" height="56" rx="8"/>
  <text x="310" y="288" dy="0.35em" text-anchor="middle">CategoryFilter</text>
  <rect class="dg-box" x="460" y="260" width="180" height="56" rx="8"/>
  <text x="550" y="288" dy="0.35em" text-anchor="middle">ProductGrid</text>
</svg>
