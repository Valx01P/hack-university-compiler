<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>Three moments when HTML can be made, and the strategy that makes it at each</title>
  <desc>Time runs left to right through three moments. At build time, once, static site generation makes every page. Incremental static regeneration builds pages then and rebuilds them on a server now and then. At request time, server-side rendering makes the page for every visit. At browser time, after the JavaScript arrives, client-side rendering makes the page. Pages made on a server still hydrate in the browser.</desc>

  <rect class="dg-frame" x="20" y="16" width="200" height="344" rx="12"/>
  <text class="dg-heading" x="36" y="36" dy="0.35em">Build time</text>
  <text class="dg-note" x="36" y="58" dy="0.35em">once, before anyone visits</text>
  <rect class="dg-frame" x="240" y="16" width="200" height="344" rx="12"/>
  <text class="dg-heading" x="256" y="36" dy="0.35em">Request time</text>
  <text class="dg-note" x="256" y="58" dy="0.35em">on a server, for a visit</text>
  <rect class="dg-frame" x="460" y="16" width="200" height="344" rx="12"/>
  <text class="dg-heading" x="476" y="36" dy="0.35em">Browser time</text>
  <text class="dg-note" x="476" y="58" dy="0.35em">after the JavaScript arrives</text>

  <rect class="dg-box" x="32" y="84" width="176" height="56" rx="8"/>
  <text x="48" y="102" dy="0.35em">SSG
    <tspan class="dg-note" x="48" dy="1.4em">every page, once</tspan>
  </text>
  <path class="dg-line dg-dashed" d="M208 112 H468" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="472" y="92" width="176" height="40" rx="8"/>
  <text class="dg-faint" x="488" y="112" dy="0.35em">hydrate</text>

  <rect class="dg-box" x="32" y="152" width="396" height="56" rx="8"/>
  <text x="48" y="170" dy="0.35em">ISR
    <tspan class="dg-note" x="48" dy="1.4em">built once, then rebuilt on the server now and then</tspan>
  </text>
  <path class="dg-line dg-dashed" d="M428 180 H468" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="472" y="160" width="176" height="40" rx="8"/>
  <text class="dg-faint" x="488" y="180" dy="0.35em">hydrate</text>

  <rect class="dg-box" x="252" y="220" width="176" height="56" rx="8"/>
  <text x="268" y="238" dy="0.35em">SSR
    <tspan class="dg-note" x="268" dy="1.4em">each page, every visit</tspan>
  </text>
  <path class="dg-line dg-dashed" d="M428 248 H468" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="472" y="228" width="176" height="40" rx="8"/>
  <text class="dg-faint" x="488" y="248" dy="0.35em">hydrate</text>

  <rect class="dg-box" x="472" y="288" width="176" height="56" rx="8"/>
  <text x="488" y="306" dy="0.35em">CSR
    <tspan class="dg-note" x="488" dy="1.4em">in each visitor's browser</tspan>
  </text>
</svg>
