<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>A draft review shows during the action, then the saved review or nothing replaces it</title>
  <desc>Step 1, the person presses Post and the action starts. Step 2, while the request is on its way, the list shows the draft review, Fast boil, marked as posting, above the older review. If the server saves it, the refetched list holds the real Fast boil review and the draft is dropped. If the server refuses, the draft is dropped with nothing in its place, and the form shows that the review didn't post.</desc>

  <!-- Step 1: press Post -->
  <circle class="dg-badge" cx="36" cy="112" r="10"/>
  <text class="dg-on-badge" x="36" y="112" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-box" x="20" y="132" width="140" height="56" rx="8"/>
  <text x="90" y="150" dy="0.35em" text-anchor="middle">Press Post
    <tspan class="dg-note" x="90" dy="1.4em">the action starts</tspan>
  </text>
  <path class="dg-flow" d="M160 160 H196" marker-end="url(#arrow-flow)"/>

  <!-- Step 2: the list during the action -->
  <circle class="dg-badge" cx="216" cy="50" r="10"/>
  <text class="dg-on-badge" x="216" y="50" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-frame" x="200" y="70" width="220" height="180" rx="12"/>
  <text class="dg-note" x="216" y="90" dy="0.35em">During the action</text>
  <rect class="dg-hot" x="216" y="110" width="188" height="36" rx="8"/>
  <text class="dg-on-hot" x="228" y="128" dy="0.35em">Fast boil</text>
  <text class="dg-on-hot" x="392" y="128" dy="0.35em" text-anchor="end">posting…</text>
  <rect class="dg-box" x="216" y="156" width="188" height="36" rx="8"/>
  <text x="228" y="174" dy="0.35em">Carries well</text>
  <text class="dg-note" x="310" y="222" dy="0.35em" text-anchor="middle">the request is on its way</text>

  <!-- If the server saves it -->
  <path class="dg-flow" d="M420 130 H440 V85 H456" marker-end="url(#arrow-flow)"/>
  <rect class="dg-frame" x="460" y="20" width="200" height="130" rx="12"/>
  <text class="dg-heading" x="476" y="40" dy="0.35em">Saved</text>
  <rect class="dg-strong" x="476" y="58" width="168" height="36" rx="8"/>
  <text x="488" y="76" dy="0.35em">Fast boil</text>
  <rect class="dg-box" x="476" y="102" width="168" height="36" rx="8"/>
  <text x="488" y="120" dy="0.35em">Carries well</text>

  <!-- If the server refuses -->
  <path class="dg-line" d="M420 190 H440 V235 H456" marker-end="url(#arrow)"/>
  <rect class="dg-frame" x="460" y="170" width="200" height="130" rx="12"/>
  <text class="dg-heading" x="476" y="190" dy="0.35em">Refused</text>
  <rect class="dg-box" x="476" y="208" width="168" height="36" rx="8"/>
  <text x="488" y="226" dy="0.35em">Carries well</text>
  <text class="dg-note" x="476" y="270" dy="0.35em">Your review didn't post.</text>
</svg>
