<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Two requests race, and the older, slower answer arrives last and wins</title>
  <desc>ProductDetails asks the server for the Trail Pack, then, after a switch, for the Ember Stove. The Ember Stove answers after 0.2 seconds and the page shows it. The Trail Pack answers after 1.5 seconds, and its late answer replaces the Ember Stove, so the page shows the wrong product.</desc>

  <!-- Who is in the conversation -->
  <text class="dg-heading" x="105" y="40" dy="0.35em" text-anchor="middle">Page shows</text>
  <rect class="dg-strong" x="230" y="20" width="160" height="40" rx="8"/>
  <text x="310" y="40" dy="0.35em" text-anchor="middle">ProductDetails</text>
  <rect class="dg-box" x="520" y="20" width="140" height="40" rx="8"/>
  <text x="590" y="40" dy="0.35em" text-anchor="middle">Server</text>
  <path class="dg-line" d="M310 60 V284"/>
  <path class="dg-line" d="M590 60 V284"/>

  <!-- Step 1: ask for the Trail Pack -->
  <rect class="dg-off" x="20" y="92" width="170" height="36" rx="8"/>
  <text class="dg-faint" x="105" y="110" dy="0.35em" text-anchor="middle">Loading…</text>
  <circle class="dg-badge" cx="210" cy="110" r="10"/>
  <text class="dg-on-badge" x="210" y="110" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="450" y="98" dy="0.35em" text-anchor="middle">GET …/trail-pack-45</text>
  <path class="dg-flow" d="M310 110 H586" marker-end="url(#arrow-flow)"/>

  <!-- Step 2: switch, and ask for the Ember Stove -->
  <rect class="dg-off" x="20" y="142" width="170" height="36" rx="8"/>
  <text class="dg-faint" x="105" y="160" dy="0.35em" text-anchor="middle">Loading…</text>
  <circle class="dg-badge" cx="210" cy="160" r="10"/>
  <text class="dg-on-badge" x="210" y="160" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="450" y="148" dy="0.35em" text-anchor="middle">GET …/ember-stove</text>
  <path class="dg-flow" d="M310 160 H586" marker-end="url(#arrow-flow)"/>

  <!-- Step 3: the Ember Stove answers first -->
  <rect class="dg-box" x="20" y="192" width="170" height="36" rx="8"/>
  <text x="105" y="210" dy="0.35em" text-anchor="middle">Ember Stove</text>
  <circle class="dg-badge" cx="210" cy="210" r="10"/>
  <text class="dg-on-badge" x="210" y="210" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-note" x="450" y="198" dy="0.35em" text-anchor="middle">Ember Stove, after 0.2 s</text>
  <path class="dg-line dg-dashed" d="M590 210 H314" marker-end="url(#arrow)"/>

  <!-- Step 4: the Trail Pack answers last, and wins -->
  <rect class="dg-hot" x="20" y="242" width="170" height="36" rx="8"/>
  <text class="dg-on-hot" x="105" y="260" dy="0.35em" text-anchor="middle">Trail Pack 45L</text>
  <circle class="dg-badge" cx="210" cy="260" r="10"/>
  <text class="dg-on-badge" x="210" y="260" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="450" y="248" dy="0.35em" text-anchor="middle">Trail Pack, after 1.5 s</text>
  <path class="dg-line dg-dashed" d="M590 260 H314" marker-end="url(#arrow)"/>
</svg>
