<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220">
  <title>A form action from submit, through pending, to its result</title>
  <desc>Step 1, the form submits and React calls the action with the previous state and the form data. Step 2, while the action runs, isPending and the button's pending are true, so the button is disabled and says Logging in. Step 3, the action returns a new state with the error and the email, React shows the message, then resets the form so each field goes back to its defaultValue.</desc>

  <!-- Step 1: submit -->
  <circle class="dg-badge" cx="32" cy="30" r="10"/>
  <text class="dg-on-badge" x="32" y="30" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-heading" x="52" y="30" dy="0.35em">Submit</text>
  <rect class="dg-box" x="20" y="56" width="170" height="56" rx="8"/>
  <text x="105" y="74" dy="0.35em" text-anchor="middle">Form submits
    <tspan class="dg-note" x="105" dy="1.4em">React calls the action</tspan>
  </text>
  <text class="dg-code" x="105" y="136" dy="0.35em" text-anchor="middle">logIn(prev, formData)</text>

  <!-- Step 2: pending -->
  <circle class="dg-badge" cx="267" cy="30" r="10"/>
  <text class="dg-on-badge" x="267" y="30" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-heading" x="287" y="30" dy="0.35em">Pending</text>
  <rect class="dg-hot" x="255" y="56" width="170" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="74" dy="0.35em" text-anchor="middle">Button disabled
    <tspan x="340" dy="1.4em">Logging in…</tspan>
  </text>
  <text class="dg-code" x="340" y="136" dy="0.35em" text-anchor="middle">isPending: true</text>
  <text class="dg-code" x="340" y="156" dy="0.35em" text-anchor="middle">pending: true</text>

  <!-- Step 3: the result, then the reset -->
  <circle class="dg-badge" cx="502" cy="30" r="10"/>
  <text class="dg-on-badge" x="502" y="30" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-heading" x="522" y="30" dy="0.35em">Result</text>
  <rect class="dg-box" x="490" y="56" width="170" height="56" rx="8"/>
  <text x="575" y="74" dy="0.35em" text-anchor="middle">New state
    <tspan class="dg-code" x="575" dy="1.4em">{ error, email }</tspan>
  </text>
  <path class="dg-line" d="M575 112 V140" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="490" y="144" width="170" height="56" rx="8"/>
  <text x="575" y="162" dy="0.35em" text-anchor="middle">Form resets
    <tspan class="dg-note" x="575" dy="1.4em">to each defaultValue</tspan>
  </text>

  <!-- The order of the steps -->
  <path class="dg-flow" d="M190 84 H251" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M425 84 H486" marker-end="url(#arrow-flow)"/>
</svg>
