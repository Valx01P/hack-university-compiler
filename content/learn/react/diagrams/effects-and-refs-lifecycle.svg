<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>An effect's setup and cleanup across mount, update, and unmount</title>
  <desc>Three columns in time order. Step 1, mount with slug trail-pack-45: React renders and commits, then runs setup for trail-pack-45. Step 2, an update to ember-stove: React renders and commits, runs the cleanup for trail-pack-45, then setup for ember-stove. Step 3, unmount: React removes the elements, then runs the cleanup for ember-stove. Each setup connects to the one cleanup that undoes it.</desc>

  <!-- Step 1: mount -->
  <circle class="dg-badge" cx="40" cy="36" r="10"/>
  <text class="dg-on-badge" x="40" y="36" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-heading" x="60" y="36" dy="0.35em">Mount</text>
  <text class="dg-code" x="30" y="66" dy="0.35em">slug: trail-pack-45</text>
  <rect class="dg-box" x="20" y="88" width="190" height="40" rx="8"/>
  <text x="115" y="108" dy="0.35em" text-anchor="middle">Render and commit</text>
  <path class="dg-line" d="M115 128 V164" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="20" y="168" width="190" height="56" rx="8"/>
  <text class="dg-on-hot" x="115" y="186" dy="0.35em" text-anchor="middle">setup
    <tspan class="dg-code" x="115" dy="1.4em">trail-pack-45</tspan>
  </text>

  <!-- Step 2: update -->
  <circle class="dg-badge" cx="265" cy="36" r="10"/>
  <text class="dg-on-badge" x="265" y="36" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-heading" x="285" y="36" dy="0.35em">Update</text>
  <text class="dg-code" x="255" y="66" dy="0.35em">slug: ember-stove</text>
  <rect class="dg-box" x="245" y="88" width="190" height="40" rx="8"/>
  <text x="340" y="108" dy="0.35em" text-anchor="middle">Render and commit</text>
  <path class="dg-line" d="M340 128 V164" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="245" y="168" width="190" height="56" rx="8"/>
  <text x="340" y="186" dy="0.35em" text-anchor="middle">cleanup
    <tspan class="dg-code" x="340" dy="1.4em">trail-pack-45</tspan>
  </text>
  <path class="dg-line" d="M340 224 V260" marker-end="url(#arrow)"/>
  <rect class="dg-hot" x="245" y="264" width="190" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="282" dy="0.35em" text-anchor="middle">setup
    <tspan class="dg-code" x="340" dy="1.4em">ember-stove</tspan>
  </text>

  <!-- Step 3: unmount -->
  <circle class="dg-badge" cx="490" cy="36" r="10"/>
  <text class="dg-on-badge" x="490" y="36" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-heading" x="510" y="36" dy="0.35em">Unmount</text>
  <text class="dg-note" x="480" y="66" dy="0.35em">it leaves the page</text>
  <rect class="dg-box" x="470" y="88" width="190" height="40" rx="8"/>
  <text x="565" y="108" dy="0.35em" text-anchor="middle">Remove from DOM</text>
  <path class="dg-line" d="M565 128 V260" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="470" y="264" width="190" height="56" rx="8"/>
  <text x="565" y="282" dy="0.35em" text-anchor="middle">cleanup
    <tspan class="dg-code" x="565" dy="1.4em">ember-stove</tspan>
  </text>

  <!-- Each setup to the cleanup that undoes it -->
  <path class="dg-flow dg-dashed" d="M210 196 H241" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow dg-dashed" d="M435 292 H466" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="340" y="344" dy="0.35em" text-anchor="middle">Dashed arrows: each setup, and the cleanup that undoes it</text>
</svg>
