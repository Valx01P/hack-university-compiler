<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>Nested routes: each matching route renders inside its parent's Outlet</title>
  <desc>For the address /products/ridge-2p-tent, three routes match: the root route with RootLayout, the products route with no component, and the :slug route with ProductPage. On the page, RootLayout draws the header, nav, and footer, and its Outlet holds ProductPage.</desc>

  <text class="dg-code" x="340" y="36" dy="0.35em" text-anchor="middle">/products/ridge-2p-tent</text>

  <!-- The routes that match. -->
  <rect class="dg-frame" x="20" y="60" width="260" height="300" rx="12"/>
  <text class="dg-heading" x="40" y="84" dy="0.35em">Routes that match</text>
  <rect class="dg-strong" x="40" y="108" width="220" height="56" rx="8"/>
  <text x="150" y="128" dy="0.35em" text-anchor="middle"><tspan class="dg-code">/</tspan>
    <tspan class="dg-note" x="150" dy="1.4em">RootLayout</tspan>
  </text>
  <path class="dg-line" d="M56 164 V212 H72"/>
  <rect class="dg-box" x="72" y="184" width="188" height="56" rx="8"/>
  <text x="166" y="204" dy="0.35em" text-anchor="middle"><tspan class="dg-code">products</tspan>
    <tspan class="dg-note" x="166" dy="1.4em">no component</tspan>
  </text>
  <path class="dg-line" d="M88 240 V288 H104"/>
  <rect class="dg-hot" x="104" y="260" width="156" height="56" rx="8"/>
  <text class="dg-on-hot" x="182" y="280" dy="0.35em" text-anchor="middle">:slug
    <tspan x="182" dy="1.4em">ProductPage</tspan>
  </text>

  <!-- What renders on the page. -->
  <rect class="dg-frame" x="300" y="60" width="360" height="300" rx="12"/>
  <text class="dg-heading" x="320" y="84" dy="0.35em">What renders</text>
  <rect class="dg-strong" x="320" y="104" width="320" height="240" rx="8"/>
  <text x="336" y="124" dy="0.35em">RootLayout</text>
  <rect class="dg-box" x="336" y="144" width="288" height="40" rx="8"/>
  <text x="480" y="164" dy="0.35em" text-anchor="middle">header and nav</text>
  <rect class="dg-frame" x="336" y="196" width="288" height="88" rx="8"/>
  <text class="dg-note" x="352" y="212" dy="0.35em">Outlet</text>
  <rect class="dg-hot" x="352" y="224" width="256" height="48" rx="8"/>
  <text class="dg-on-hot" x="480" y="248" dy="0.35em" text-anchor="middle">ProductPage</text>
  <rect class="dg-box" x="336" y="292" width="288" height="40" rx="8"/>
  <text x="480" y="312" dy="0.35em" text-anchor="middle">footer</text>
</svg>
