<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Comparing two trees: same type is kept, a new type is rebuilt</title>
  <desc>Before, ShopPage renders a Header and a ProductGrid with three ProductCards. After, it renders a Header and a ProductTable with three ProductRows. ShopPage and Header have the same type in the same place, so React keeps them and their state. ProductGrid and ProductTable differ, so the whole grid branch is destroyed and the table is built new.</desc>

  <!-- Before. -->
  <rect class="dg-frame" x="20" y="20" width="310" height="288" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">Before</text>
  <rect class="dg-box" x="110" y="64" width="130" height="56" rx="8"/>
  <text x="175" y="84" dy="0.35em" text-anchor="middle">ShopPage
    <tspan class="dg-note" x="175" dy="1.4em">its state</tspan>
  </text>
  <path class="dg-line" d="M175 120 V135 H91 V150"/>
  <path class="dg-line" d="M175 135 H240 V150"/>
  <rect class="dg-box" x="36" y="150" width="110" height="56" rx="8"/>
  <text x="91" y="170" dy="0.35em" text-anchor="middle">Header
    <tspan class="dg-note" x="91" dy="1.4em">its state</tspan>
  </text>
  <rect class="dg-off" x="166" y="150" width="148" height="56" rx="8"/>
  <text class="dg-faint" x="240" y="170" dy="0.35em" text-anchor="middle">ProductGrid
    <tspan x="240" dy="1.4em">destroyed</tspan>
  </text>
  <path class="dg-line dg-dashed" d="M240 206 V236"/>
  <rect class="dg-off" x="165" y="236" width="150" height="56" rx="8"/>
  <text class="dg-faint" x="240" y="256" dy="0.35em" text-anchor="middle">ProductCard ×3
    <tspan x="240" dy="1.4em">destroyed</tspan>
  </text>

  <!-- After. -->
  <rect class="dg-frame" x="350" y="20" width="310" height="288" rx="12"/>
  <text class="dg-heading" x="370" y="44" dy="0.35em">After</text>
  <rect class="dg-box" x="440" y="64" width="130" height="56" rx="8"/>
  <text x="505" y="84" dy="0.35em" text-anchor="middle">ShopPage
    <tspan class="dg-note" x="505" dy="1.4em">kept</tspan>
  </text>
  <path class="dg-line" d="M505 120 V135 H421 V150"/>
  <path class="dg-line" d="M505 135 H570 V150"/>
  <rect class="dg-box" x="366" y="150" width="110" height="56" rx="8"/>
  <text x="421" y="170" dy="0.35em" text-anchor="middle">Header
    <tspan class="dg-note" x="421" dy="1.4em">kept</tspan>
  </text>
  <rect class="dg-hot" x="496" y="150" width="148" height="56" rx="8"/>
  <text class="dg-on-hot" x="570" y="170" dy="0.35em" text-anchor="middle">ProductTable
    <tspan x="570" dy="1.4em">built new</tspan>
  </text>
  <path class="dg-line" d="M570 206 V236"/>
  <rect class="dg-hot" x="495" y="236" width="150" height="56" rx="8"/>
  <text class="dg-on-hot" x="570" y="256" dy="0.35em" text-anchor="middle">ProductRow ×3
    <tspan x="570" dy="1.4em">built new</tspan>
  </text>
</svg>
