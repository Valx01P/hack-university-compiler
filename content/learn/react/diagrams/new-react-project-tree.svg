<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560">
  <title>A new Vite React project, each file with its job</title>
  <desc>The trailhead folder holds index.html, the page with the root div. Next to it are package.json and its lockfile, vite.config.ts, three tsconfig files, the linter's rules, and .gitignore. The public folder holds files copied as they are, like the favicon. The src folder holds your code: main.tsx starts React, App.tsx is the top component, index.css styles the page, and assets holds files your code imports. node_modules holds installed packages.</desc>
  <text class="dg-code" x="40" y="32" dy="0.35em">trailhead/</text>
  <rect class="dg-hot" x="58" y="49" width="602" height="24" rx="8"/>
  <path class="dg-line" d="M48 42 V61 H54"/>
  <text class="dg-on-hot dg-code" x="68" y="61" dy="0.35em">index.html</text>
  <text class="dg-on-hot" x="330" y="61" dy="0.35em">the page, with the root div</text>
  <path class="dg-line" d="M48 42 V90 H54"/>
  <text class="dg-code" x="68" y="90" dy="0.35em">package.json</text>
  <text class="dg-note" x="330" y="90" dy="0.35em">name, scripts, dependencies</text>
  <path class="dg-line" d="M48 42 V119 H54"/>
  <text class="dg-code" x="68" y="119" dy="0.35em">package-lock.json</text>
  <text class="dg-note" x="330" y="119" dy="0.35em">the exact version of every package</text>
  <path class="dg-line" d="M48 42 V148 H54"/>
  <text class="dg-code" x="68" y="148" dy="0.35em">vite.config.ts</text>
  <text class="dg-note" x="330" y="148" dy="0.35em">Vite's settings and plugins</text>
  <path class="dg-line" d="M48 42 V177 H54"/>
  <text class="dg-code" x="68" y="177" dy="0.35em">tsconfig.json</text>
  <text class="dg-note" x="330" y="177" dy="0.35em">points to the two below</text>
  <path class="dg-line" d="M48 42 V206 H54"/>
  <text class="dg-code" x="68" y="206" dy="0.35em">tsconfig.app.json</text>
  <text class="dg-note" x="330" y="206" dy="0.35em">type settings for src/</text>
  <path class="dg-line" d="M48 42 V235 H54"/>
  <text class="dg-code" x="68" y="235" dy="0.35em">tsconfig.node.json</text>
  <text class="dg-note" x="330" y="235" dy="0.35em">type settings for vite.config.ts</text>
  <path class="dg-line" d="M48 42 V264 H54"/>
  <text class="dg-code" x="68" y="264" dy="0.35em">.oxlintrc.json</text>
  <text class="dg-note" x="330" y="264" dy="0.35em">the linter's rules</text>
  <path class="dg-line" d="M48 42 V293 H54"/>
  <text class="dg-code" x="68" y="293" dy="0.35em">.gitignore</text>
  <text class="dg-note" x="330" y="293" dy="0.35em">what Git leaves out</text>
  <path class="dg-line" d="M48 42 V322 H54"/>
  <text class="dg-code" x="68" y="322" dy="0.35em">public/</text>
  <text class="dg-note" x="330" y="322" dy="0.35em">copied as is, served from /</text>
  <path class="dg-line" d="M76 332 V351 H82"/>
  <text class="dg-code" x="96" y="351" dy="0.35em">favicon.svg</text>
  <text class="dg-note" x="330" y="351" dy="0.35em">the browser tab's icon</text>
  <path class="dg-line" d="M48 42 V380 H54"/>
  <text class="dg-code" x="68" y="380" dy="0.35em">src/</text>
  <text class="dg-note" x="330" y="380" dy="0.35em">your code, which Vite builds</text>
  <rect class="dg-hot" x="86" y="397" width="574" height="24" rx="8"/>
  <path class="dg-line" d="M76 390 V409 H82"/>
  <text class="dg-on-hot dg-code" x="96" y="409" dy="0.35em">main.tsx</text>
  <text class="dg-on-hot" x="330" y="409" dy="0.35em">starts React in the root div</text>
  <rect class="dg-hot" x="86" y="426" width="574" height="24" rx="8"/>
  <path class="dg-line" d="M76 390 V438 H82"/>
  <text class="dg-on-hot dg-code" x="96" y="438" dy="0.35em">App.tsx</text>
  <text class="dg-on-hot" x="330" y="438" dy="0.35em">the top component</text>
  <path class="dg-line" d="M76 390 V467 H82"/>
  <text class="dg-code" x="96" y="467" dy="0.35em">index.css</text>
  <text class="dg-note" x="330" y="467" dy="0.35em">styles for the whole page</text>
  <path class="dg-line" d="M76 390 V496 H82"/>
  <text class="dg-code" x="96" y="496" dy="0.35em">assets/</text>
  <text class="dg-note" x="330" y="496" dy="0.35em">files your code imports</text>
  <path class="dg-line" d="M48 42 V525 H54"/>
  <text class="dg-faint dg-code" x="68" y="525" dy="0.35em">node_modules/</text>
  <text class="dg-faint" x="330" y="525" dy="0.35em">installed packages, never edited</text>
</svg>
