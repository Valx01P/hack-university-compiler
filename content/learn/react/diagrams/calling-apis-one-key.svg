<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Three components read one query key, so the cache sends one request</title>
  <desc>A product heading, a price tag, and an add-to-cart button each read the product with the same query key. All three point at one entry in the query cache, under the key products, detail, hip-pack-5. That one entry sends one request to the Trailhead API, and every component gets the same answer.</desc>

  <!-- Three components, one key -->
  <rect class="dg-box" x="40" y="20" width="160" height="56" rx="8"/>
  <text x="120" y="38" dy="0.35em" text-anchor="middle">ProductHeading
    <tspan class="dg-note" x="120" dy="1.4em">reads the name</tspan>
  </text>
  <rect class="dg-box" x="260" y="20" width="160" height="56" rx="8"/>
  <text x="340" y="38" dy="0.35em" text-anchor="middle">PriceTag
    <tspan class="dg-note" x="340" dy="1.4em">reads the price</tspan>
  </text>
  <rect class="dg-box" x="480" y="20" width="160" height="56" rx="8"/>
  <text x="560" y="38" dy="0.35em" text-anchor="middle">AddToCartButton
    <tspan class="dg-note" x="560" dy="1.4em">reads the stock</tspan>
  </text>
  <path class="dg-line" d="M120 76 V142" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M340 76 V142" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M560 76 V142" marker-end="url(#arrow)"/>

  <!-- The cache, with one entry -->
  <rect class="dg-frame" x="80" y="104" width="520" height="116" rx="12"/>
  <text class="dg-note" x="96" y="120" dy="0.35em">Query cache</text>
  <rect class="dg-hot" x="100" y="146" width="480" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="164" dy="0.35em" text-anchor="middle">One entry
    <tspan class="dg-code" x="340" dy="1.4em">["products", "detail", "hip-pack-5"]</tspan>
  </text>

  <!-- One request -->
  <path class="dg-flow" d="M340 202 V276" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="352" y="244" dy="0.35em">GET /v1/products/hip-pack-5</text>
  <rect class="dg-box" x="260" y="280" width="160" height="40" rx="8"/>
  <text x="340" y="300" dy="0.35em" text-anchor="middle">Trailhead API</text>
</svg>
