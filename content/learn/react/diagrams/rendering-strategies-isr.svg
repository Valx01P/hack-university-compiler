<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <title>Incremental static regeneration: three visitors to one cached page</title>
  <desc>A page is built at 0:00 and stays fresh for 60 seconds. Visitor 1, at 0:30, gets the fresh copy. At 1:00 the copy goes stale. Visitor 2, at 1:30, still gets the stale copy at once, and that visit starts a rebuild of the page in the background. Visitor 3, a few seconds later, gets the new page.</desc>

  <rect class="dg-box" x="60" y="20" width="140" height="56" rx="8"/>
  <text x="80" y="38" dy="0.35em">Visitor 1
    <tspan class="dg-note" x="80" dy="1.4em">fresh copy</tspan>
  </text>
  <rect class="dg-box" x="360" y="20" width="140" height="56" rx="8"/>
  <text x="380" y="38" dy="0.35em">Visitor 2
    <tspan class="dg-note" x="380" dy="1.4em">stale copy, at once</tspan>
  </text>
  <rect class="dg-hot" x="520" y="20" width="140" height="56" rx="8"/>
  <text class="dg-on-hot" x="540" y="38" dy="0.35em">Visitor 3
    <tspan x="540" dy="1.4em">the new page</tspan>
  </text>

  <path class="dg-line dg-dashed" d="M130 76 V136"/>
  <path class="dg-line dg-dashed" d="M430 76 V136"/>
  <path class="dg-line dg-dashed" d="M590 76 V136"/>

  <path class="dg-line" d="M20 140 H656" marker-end="url(#arrow)"/>
  <circle class="dg-box" cx="40" cy="140" r="5"/>
  <circle class="dg-box" cx="130" cy="140" r="5"/>
  <circle class="dg-box" cx="270" cy="140" r="5"/>
  <circle class="dg-box" cx="430" cy="140" r="5"/>
  <circle class="dg-hot" cx="590" cy="140" r="5"/>
  <text class="dg-code" x="40" y="164" dy="0.35em" text-anchor="middle">0:00</text>
  <text class="dg-code" x="130" y="164" dy="0.35em" text-anchor="middle">0:30</text>
  <text class="dg-code" x="270" y="164" dy="0.35em" text-anchor="middle">1:00</text>
  <text class="dg-code" x="430" y="164" dy="0.35em" text-anchor="middle">1:30</text>
  <text class="dg-code" x="590" y="164" dy="0.35em" text-anchor="middle">1:35</text>
  <text class="dg-note" x="200" y="124" dy="0.35em" text-anchor="middle">fresh</text>
  <text class="dg-note" x="350" y="124" dy="0.35em" text-anchor="middle">stale</text>
  <text class="dg-note" x="270" y="186" dy="0.35em" text-anchor="middle">goes stale</text>

  <path class="dg-line" d="M40 145 V216"/>
  <rect class="dg-box" x="20" y="220" width="180" height="56" rx="8"/>
  <text x="40" y="238" dy="0.35em">Built at deploy
    <tspan class="dg-code" x="40" dy="1.4em">s-maxage=60</tspan>
  </text>
  <path class="dg-flow" d="M430 145 V216" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="330" y="220" width="200" height="56" rx="8"/>
  <text x="350" y="238" dy="0.35em">Rebuilt in the
    <tspan x="350" dy="1.4em">background</tspan>
  </text>
  <path class="dg-flow" d="M530 248 H636 V80" marker-end="url(#arrow-flow)"/>
</svg>
