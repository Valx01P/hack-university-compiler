<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>An end-to-end test drives a real browser, a real build, and a real API</title>
  <desc>The Playwright test runner drives Chromium, opening a fresh context and a page for each test. The page loads the built shop from vite preview on port 4173. The shop's /v1 requests go through the preview server's proxy to the Trailhead API on port 4010, which runs with seed data. Playwright's webServer setting starts both servers.</desc>

  <rect class="dg-box" x="20" y="60" width="140" height="56" rx="8"/>
  <text x="90" y="79" dy="0.35em" text-anchor="middle">Test runner
    <tspan class="dg-note" x="90" dy="1.4em">Playwright</tspan>
  </text>

  <rect class="dg-hot" x="190" y="60" width="140" height="56" rx="8"/>
  <text class="dg-on-hot" x="260" y="79" dy="0.35em" text-anchor="middle">Chromium
    <tspan x="260" dy="1.4em">context, page</tspan>
  </text>

  <rect class="dg-box" x="360" y="60" width="140" height="56" rx="8"/>
  <text x="430" y="79" dy="0.35em" text-anchor="middle">vite preview
    <tspan class="dg-code" x="430" dy="1.4em">:4173 dist/</tspan>
  </text>

  <rect class="dg-box" x="530" y="60" width="130" height="56" rx="8"/>
  <text x="595" y="79" dy="0.35em" text-anchor="middle">Trailhead API
    <tspan class="dg-code" x="595" dy="1.4em">:4010</tspan>
  </text>

  <path class="dg-flow" d="M160 88 H186" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M330 88 H356" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M500 88 H526" marker-end="url(#arrow-flow)"/>
  <text class="dg-note" x="173" y="40" dy="0.35em" text-anchor="middle">drives</text>
  <text class="dg-code" x="343" y="40" dy="0.35em" text-anchor="middle">GET /</text>
  <text class="dg-code" x="513" y="40" dy="0.35em" text-anchor="middle">/v1/*</text>

  <!-- webServer starts both servers. -->
  <rect class="dg-frame" x="350" y="160" width="320" height="76" rx="12"/>
  <text class="dg-code" x="510" y="186" dy="0.35em" text-anchor="middle">webServer</text>
  <text class="dg-note" x="510" y="210" dy="0.35em" text-anchor="middle">starts both, then stops them</text>
  <path class="dg-line dg-dashed" d="M430 160 V120"/>
  <path class="dg-line dg-dashed" d="M595 160 V120"/>
</svg>
