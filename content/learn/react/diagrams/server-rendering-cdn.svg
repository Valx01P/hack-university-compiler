<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220">
  <title>A CDN serving cached HTML, and refreshing it in the background</title>
  <desc>A visitor asks the CDN for a page. In step 1, while the CDN's copy is under 60 seconds old, it answers at once without asking your server. In step 2, when the copy is stale but under 360 seconds old, the CDN still answers at once and starts a refresh. In step 3, your server renders a fresh page in the background, and the CDN keeps it for the next visitor.</desc>

  <rect class="dg-box" x="20" y="96" width="150" height="56" rx="8"/>
  <text x="95" y="124" dy="0.35em" text-anchor="middle">Visitor</text>

  <rect class="dg-hot" x="265" y="96" width="150" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="115" dy="0.35em" text-anchor="middle">CDN
    <tspan x="340" dy="1.4em">keeps a copy</tspan>
  </text>

  <rect class="dg-box" x="510" y="96" width="150" height="56" rx="8"/>
  <text x="585" y="115" dy="0.35em" text-anchor="middle">Your server
    <tspan class="dg-note" x="585" dy="1.4em">renders the page</tspan>
  </text>

  <!-- Step 1: the visit, answered from the copy. -->
  <path class="dg-flow" d="M170 116 H261" marker-end="url(#arrow-flow)"/>
  <path class="dg-line dg-dashed" d="M265 136 H174" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="186" cy="72" r="10"/>
  <text class="dg-on-badge" x="186" y="72" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="202" y="72" dy="0.35em">fresh: answered</text>

  <!-- Step 2: a stale copy, sent anyway. -->
  <circle class="dg-badge" cx="286" cy="184" r="10"/>
  <text class="dg-on-badge" x="286" y="184" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="302" y="184" dy="0.35em">stale: sent, then refreshed</text>

  <!-- Step 3: the refresh in the background. -->
  <path class="dg-line dg-dashed" d="M415 116 H506" marker-end="url(#arrow)"/>
  <path class="dg-line dg-dashed" d="M510 136 H419" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="432" cy="72" r="10"/>
  <text class="dg-on-badge" x="432" y="72" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-note" x="448" y="72" dy="0.35em">new page</text>
</svg>
