<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560">
  <title>Sorting a keyed list moves its nodes, and index keys rewrite every row instead</title>
  <desc>A list of three products, sorted by price. With each product's slug as its key, React sees the same three items in a new order and moves their existing nodes, so what's in each one stays with its product. With the index as the key, positions 0, 1, and 2 still exist, so React keeps the nodes in place and rewrites the text in every row.</desc>

  <!-- Keys from the data. -->
  <rect class="dg-frame" x="20" y="20" width="640" height="248" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">Keyed by slug: React moves the nodes</text>
  <text class="dg-note" x="40" y="80" dy="0.35em">Before</text>
  <text class="dg-note" x="420" y="80" dy="0.35em">After sorting by price</text>

  <rect class="dg-box" x="40" y="100" width="200" height="40" rx="8"/>
  <text class="dg-code" x="56" y="120" dy="0.35em">trail-pack-45</text>
  <text class="dg-note" x="224" y="120" dy="0.35em" text-anchor="end">$189</text>
  <rect class="dg-box" x="40" y="152" width="200" height="40" rx="8"/>
  <text class="dg-code" x="56" y="172" dy="0.35em">camp-kettle-1l</text>
  <text class="dg-note" x="224" y="172" dy="0.35em" text-anchor="end">$34</text>
  <rect class="dg-box" x="40" y="204" width="200" height="40" rx="8"/>
  <text class="dg-code" x="56" y="224" dy="0.35em">hip-pack-5</text>
  <text class="dg-note" x="224" y="224" dy="0.35em" text-anchor="end">$39</text>

  <rect class="dg-strong" x="420" y="100" width="220" height="40" rx="8"/>
  <text class="dg-code" x="436" y="120" dy="0.35em">camp-kettle-1l</text>
  <text class="dg-note" x="624" y="120" dy="0.35em" text-anchor="end">$34</text>
  <rect class="dg-strong" x="420" y="152" width="220" height="40" rx="8"/>
  <text class="dg-code" x="436" y="172" dy="0.35em">hip-pack-5</text>
  <text class="dg-note" x="624" y="172" dy="0.35em" text-anchor="end">$39</text>
  <rect class="dg-strong" x="420" y="204" width="220" height="40" rx="8"/>
  <text class="dg-code" x="436" y="224" dy="0.35em">trail-pack-45</text>
  <text class="dg-note" x="624" y="224" dy="0.35em" text-anchor="end">$189</text>

  <path class="dg-flow" d="M240 112 H300 V232 H416" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M240 164 H340 V128 H416" marker-end="url(#arrow-flow)"/>
  <path class="dg-flow" d="M240 216 H380 V180 H416" marker-end="url(#arrow-flow)"/>

  <!-- Keys from the position. -->
  <rect class="dg-frame" x="20" y="288" width="640" height="252" rx="12"/>
  <text class="dg-heading" x="40" y="312" dy="0.35em">Keyed by index: React rewrites every row</text>
  <text class="dg-note" x="40" y="348" dy="0.35em">Before</text>
  <text class="dg-note" x="420" y="348" dy="0.35em">After sorting by price</text>

  <rect class="dg-box" x="40" y="368" width="200" height="40" rx="8"/>
  <text class="dg-code" x="56" y="388" dy="0.35em">0</text>
  <text x="80" y="388" dy="0.35em">Trail Pack 45L</text>
  <rect class="dg-box" x="40" y="420" width="200" height="40" rx="8"/>
  <text class="dg-code" x="56" y="440" dy="0.35em">1</text>
  <text x="80" y="440" dy="0.35em">Camp Kettle 1L</text>
  <rect class="dg-box" x="40" y="472" width="200" height="40" rx="8"/>
  <text class="dg-code" x="56" y="492" dy="0.35em">2</text>
  <text x="80" y="492" dy="0.35em">Hip Pack 5L</text>

  <rect class="dg-box" x="420" y="368" width="220" height="40" rx="8"/>
  <text class="dg-code" x="436" y="388" dy="0.35em">0</text>
  <text x="460" y="388" dy="0.35em">Camp Kettle 1L</text>
  <rect class="dg-box" x="420" y="420" width="220" height="40" rx="8"/>
  <text class="dg-code" x="436" y="440" dy="0.35em">1</text>
  <text x="460" y="440" dy="0.35em">Hip Pack 5L</text>
  <rect class="dg-box" x="420" y="472" width="220" height="40" rx="8"/>
  <text class="dg-code" x="436" y="492" dy="0.35em">2</text>
  <text x="460" y="492" dy="0.35em">Trail Pack 45L</text>

  <path class="dg-line" d="M240 388 H416" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M240 440 H416" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M240 492 H416" marker-end="url(#arrow)"/>
  <text class="dg-note" x="330" y="378" text-anchor="middle">text rewritten</text>
  <text class="dg-note" x="330" y="430" text-anchor="middle">text rewritten</text>
  <text class="dg-note" x="330" y="482" text-anchor="middle">text rewritten</text>
  <text class="dg-faint" x="340" y="526" dy="0.35em" text-anchor="middle">anything typed in a row stays at its position, with the wrong product</text>
</svg>
