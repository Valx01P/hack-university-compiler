<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>One change to the cart, written out by hand to four places on the page</title>
  <desc>A call to addToCart is one change to the cart's data. By hand, it has to update four places on the page. The code updates the header badge, the cart total, and the Add button. Nobody wrote the update for the free shipping banner, so it still asks for $16.00 more after the order already ships free.</desc>

  <rect class="dg-hot" x="20" y="140" width="200" height="56" rx="8"/>
  <text class="dg-on-hot" x="120" y="158" dy="0.35em" text-anchor="middle"><tspan class="dg-code">addToCart(pack)</tspan>
    <tspan x="120" dy="1.4em">one change to the cart</tspan>
  </text>

  <path class="dg-line" d="M220 168 H320"/>
  <path class="dg-line" d="M320 48 V208"/>
  <path class="dg-line" d="M320 48 H416" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M320 128 H416" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M320 208 H416" marker-end="url(#arrow)"/>

  <rect class="dg-box" x="420" y="20" width="240" height="56" rx="8"/>
  <text x="440" y="38" dy="0.35em">Header badge
    <tspan class="dg-code" x="440" dy="1.4em">Cart: 2</tspan>
  </text>
  <rect class="dg-box" x="420" y="100" width="240" height="56" rx="8"/>
  <text x="440" y="118" dy="0.35em">Cart total
    <tspan class="dg-code" x="440" dy="1.4em">$223.00</tspan>
  </text>
  <rect class="dg-box" x="420" y="180" width="240" height="56" rx="8"/>
  <text x="440" y="198" dy="0.35em">Add button
    <tspan class="dg-code" x="440" dy="1.4em">Added</tspan>
  </text>
  <rect class="dg-off" x="420" y="260" width="240" height="56" rx="8"/>
  <text class="dg-faint" x="440" y="278" dy="0.35em">Free shipping banner
    <tspan class="dg-code" x="440" dy="1.4em">Spend $16.00 more</tspan>
  </text>
  <text class="dg-faint" x="400" y="288" dy="0.35em" text-anchor="end">no update written</text>
</svg>
