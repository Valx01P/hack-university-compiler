<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <title>MSW catches a request and answers it from a handler</title>
  <desc>In step 1, ProductList's query calls fetch for /v1/products, as it does in the app. In step 2, MSW, a Service Worker in the browser or an interceptor in Node, finds the handler whose method and path match. In step 3, the handler's response returns to fetch as if it came from the network. The real API is never asked.</desc>

  <rect class="dg-box" x="20" y="40" width="170" height="56" rx="8"/>
  <text x="105" y="59" dy="0.35em" text-anchor="middle">ProductList
    <tspan class="dg-code" x="105" dy="1.4em">fetch(…)</tspan>
  </text>

  <rect class="dg-hot" x="250" y="40" width="180" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="59" dy="0.35em" text-anchor="middle">MSW
    <tspan x="340" dy="1.4em">catches the request</tspan>
  </text>

  <rect class="dg-box" x="490" y="40" width="170" height="56" rx="8"/>
  <text x="575" y="59" dy="0.35em" text-anchor="middle">Handler
    <tspan class="dg-code" x="575" dy="1.4em">http.get(…)</tspan>
  </text>

  <!-- Step 1: the request goes out as usual. -->
  <path class="dg-flow" d="M190 68 H246" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="218" cy="24" r="10"/>
  <text class="dg-on-badge" x="218" y="24" dy="0.35em" text-anchor="middle">1</text>

  <!-- Step 2: a matching handler. -->
  <path class="dg-flow" d="M430 68 H486" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="458" cy="24" r="10"/>
  <text class="dg-on-badge" x="458" y="24" dy="0.35em" text-anchor="middle">2</text>

  <!-- Step 3: the response comes back. -->
  <path class="dg-line dg-dashed" d="M575 96 V140 H105 V100" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="340" cy="140" r="10"/>
  <text class="dg-on-badge" x="340" y="140" dy="0.35em" text-anchor="middle">3</text>
  <text class="dg-code" x="360" y="160" dy="0.35em">HttpResponse.json(…)</text>

  <!-- The real API, never reached. -->
  <rect class="dg-off" x="250" y="196" width="180" height="56" rx="8"/>
  <text class="dg-faint" x="340" y="215" dy="0.35em" text-anchor="middle">Real API
    <tspan x="340" dy="1.4em">never asked</tspan>
  </text>
</svg>
