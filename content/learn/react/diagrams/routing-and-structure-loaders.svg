<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>Fetching in effects makes a waterfall. Loaders fetch in parallel first</title>
  <desc>With effects, the layout renders, then fetches the user, then the product page renders and only then fetches the product, so the page with data appears late. With loaders, both requests start at the click, at the same time, and the page renders once, with its data, much sooner.</desc>

  <!-- Fetching in effects. -->
  <rect class="dg-frame" x="20" y="20" width="640" height="150" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">Fetching in effects</text>
  <rect class="dg-box" x="40" y="68" width="84" height="40" rx="8"/>
  <text x="82" y="88" dy="0.35em" text-anchor="middle">render</text>
  <rect class="dg-strong" x="128" y="68" width="144" height="40" rx="8"/>
  <text x="200" y="88" dy="0.35em" text-anchor="middle">fetch user</text>
  <text class="dg-note" x="300" y="88" dy="0.35em">each request waits for a render</text>
  <rect class="dg-box" x="276" y="116" width="84" height="40" rx="8"/>
  <text x="318" y="136" dy="0.35em" text-anchor="middle">render</text>
  <rect class="dg-strong" x="364" y="116" width="156" height="40" rx="8"/>
  <text x="442" y="136" dy="0.35em" text-anchor="middle">fetch product</text>
  <rect class="dg-hot" x="524" y="116" width="116" height="40" rx="8"/>
  <text class="dg-on-hot" x="582" y="136" dy="0.35em" text-anchor="middle">page</text>

  <!-- Loaders. -->
  <rect class="dg-frame" x="20" y="190" width="640" height="150" rx="12"/>
  <text class="dg-heading" x="40" y="214" dy="0.35em">Loaders</text>
  <rect class="dg-strong" x="40" y="238" width="144" height="40" rx="8"/>
  <text x="112" y="258" dy="0.35em" text-anchor="middle">fetch user</text>
  <rect class="dg-strong" x="40" y="286" width="156" height="40" rx="8"/>
  <text x="118" y="306" dy="0.35em" text-anchor="middle">fetch product</text>
  <rect class="dg-hot" x="200" y="262" width="116" height="40" rx="8"/>
  <text class="dg-on-hot" x="258" y="282" dy="0.35em" text-anchor="middle">page</text>
  <text class="dg-note" x="340" y="262" dy="0.35em">both requests start at the click</text>
  <text class="dg-note" x="340" y="302" dy="0.35em">the page renders once, with its data</text>

  <!-- Time. -->
  <text class="dg-note" x="40" y="360" dy="0.35em">time</text>
  <path class="dg-line" d="M80 360 H636" marker-end="url(#arrow)"/>
</svg>
