<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <title>A JSX tag becomes a function call, the call makes an element, and React DOM makes the node</title>
  <desc>Four steps. On your computer, you write a JSX tag, an h1 with a className, and the compiler turns it into a call to jsx with the tag name and an object of props. In the browser, that call returns an element, a plain object with a type and props, and React DOM reads the element and makes a real h1 node on the page, with a class attribute.</desc>

  <!-- On your computer. -->
  <rect class="dg-frame" x="64" y="20" width="604" height="200" rx="12"/>
  <text class="dg-note" x="84" y="42" dy="0.35em">On your computer, when Vite compiles your code</text>

  <circle class="dg-badge" cx="36" cy="88" r="10"/>
  <text class="dg-on-badge" x="36" y="88" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-box" x="80" y="60" width="572" height="56" rx="8"/>
  <text x="100" y="79" dy="0.35em">You write JSX
    <tspan class="dg-code" x="100" dy="1.4em">&lt;h1 className="title"&gt;Trail gear&lt;/h1&gt;</tspan>
  </text>
  <path class="dg-flow" d="M36 98 V158" marker-end="url(#arrow-flow)"/>

  <circle class="dg-badge" cx="36" cy="172" r="10"/>
  <text class="dg-on-badge" x="36" y="172" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-hot" x="80" y="144" width="572" height="56" rx="8"/>
  <text class="dg-on-hot" x="100" y="163" dy="0.35em">The compiler turns it into a call
    <tspan class="dg-code" x="100" dy="1.4em">jsx("h1", { className: "title", children: "Trail gear" })</tspan>
  </text>
  <path class="dg-flow" d="M36 182 V294" marker-end="url(#arrow-flow)"/>

  <!-- In the browser. -->
  <rect class="dg-frame" x="64" y="240" width="604" height="200" rx="12"/>
  <text class="dg-note" x="84" y="262" dy="0.35em">In the browser, when that code runs</text>

  <circle class="dg-badge" cx="36" cy="308" r="10"/>
  <text class="dg-on-badge" x="36" y="308" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="80" y="280" width="572" height="56" rx="8"/>
  <text x="100" y="299" dy="0.35em">The call returns an element, a plain object
    <tspan class="dg-code" x="100" dy="1.4em">{ type: "h1", props: { className: "title", children: "Trail gear" } }</tspan>
  </text>
  <path class="dg-flow" d="M36 318 V378" marker-end="url(#arrow-flow)"/>

  <circle class="dg-badge" cx="36" cy="392" r="10"/>
  <text class="dg-on-badge" x="36" y="392" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-box" x="80" y="364" width="572" height="56" rx="8"/>
  <text x="100" y="383" dy="0.35em">React DOM makes a real node on the page
    <tspan class="dg-code" x="100" dy="1.4em">&lt;h1 class="title"&gt;Trail gear&lt;/h1&gt;</tspan>
  </text>
</svg>
