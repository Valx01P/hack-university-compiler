<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>The src folder by feature, with imports flowing one way</title>
  <desc>At the top, the app folder holds the router, layouts, and error pages. It imports from the features folder, which holds products, cart, auth, and checkout, each used only through its index.ts. The features import from the shared folders at the bottom: components/ui, hooks, and lib.</desc>

  <!-- app -->
  <rect class="dg-strong" x="200" y="20" width="280" height="56" rx="8"/>
  <text x="340" y="40" dy="0.35em" text-anchor="middle"><tspan class="dg-code">app/</tspan>
    <tspan class="dg-note" x="340" dy="1.4em">router, layouts, error pages</tspan>
  </text>
  <path class="dg-flow" d="M340 76 V108" marker-end="url(#arrow-flow)"/>

  <!-- features -->
  <rect class="dg-frame" x="20" y="112" width="640" height="120" rx="12"/>
  <text class="dg-code" x="40" y="136" dy="0.35em">features/</text>
  <text class="dg-note" x="120" y="136" dy="0.35em">each one used only through its index.ts</text>
  <rect class="dg-hot" x="40" y="160" width="136" height="56" rx="8"/>
  <text class="dg-code dg-on-hot" x="108" y="180" dy="0.35em" text-anchor="middle">products/
    <tspan x="108" dy="1.4em">index.ts</tspan>
  </text>
  <rect class="dg-box" x="192" y="160" width="136" height="56" rx="8"/>
  <text class="dg-code" x="260" y="180" dy="0.35em" text-anchor="middle">cart/
    <tspan x="260" dy="1.4em">index.ts</tspan>
  </text>
  <rect class="dg-box" x="344" y="160" width="136" height="56" rx="8"/>
  <text class="dg-code" x="412" y="180" dy="0.35em" text-anchor="middle">auth/
    <tspan x="412" dy="1.4em">index.ts</tspan>
  </text>
  <rect class="dg-box" x="496" y="160" width="136" height="56" rx="8"/>
  <text class="dg-code" x="564" y="180" dy="0.35em" text-anchor="middle">checkout/
    <tspan x="564" dy="1.4em">index.ts</tspan>
  </text>
  <path class="dg-flow" d="M340 232 V264" marker-end="url(#arrow-flow)"/>

  <!-- shared -->
  <rect class="dg-box" x="40" y="268" width="184" height="56" rx="8"/>
  <text x="132" y="288" dy="0.35em" text-anchor="middle"><tspan class="dg-code">components/ui/</tspan>
    <tspan class="dg-note" x="132" dy="1.4em">Button, PageSpinner</tspan>
  </text>
  <rect class="dg-box" x="248" y="268" width="184" height="56" rx="8"/>
  <text x="340" y="288" dy="0.35em" text-anchor="middle"><tspan class="dg-code">hooks/</tspan>
    <tspan class="dg-note" x="340" dy="1.4em">shared custom hooks</tspan>
  </text>
  <rect class="dg-box" x="456" y="268" width="184" height="56" rx="8"/>
  <text x="548" y="288" dy="0.35em" text-anchor="middle"><tspan class="dg-code">lib/</tspan>
    <tspan class="dg-note" x="548" dy="1.4em">formatPrice, no React</tspan>
  </text>
</svg>
