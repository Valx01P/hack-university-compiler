<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>One operation and the shared components its $ref pointers use</title>
  <desc>The setCartItem operation, PUT /cart/items/{slug}, has a path parameter, a request body, and responses for 200, 409, and 422. Each points with $ref to a shared component: the Slug parameter, the CartItemInput schema, the Cart schema, the OutOfStockProblem schema, and the ValidationFailed response, which uses ValidationProblem.</desc>

  <rect class="dg-frame" x="20" y="20" width="260" height="340" rx="12"/>
  <text class="dg-code" x="36" y="44" dy="0.35em">PUT /cart/items/{slug}</text>
  <rect class="dg-box" x="36" y="68" width="228" height="40" rx="8"/>
  <text class="dg-code" x="52" y="88" dy="0.35em">parameters</text>
  <rect class="dg-box" x="36" y="124" width="228" height="40" rx="8"/>
  <text class="dg-code" x="52" y="144" dy="0.35em">requestBody</text>
  <rect class="dg-box" x="36" y="180" width="228" height="40" rx="8"/>
  <text class="dg-code" x="52" y="200" dy="0.35em">'200'</text>
  <rect class="dg-strong" x="36" y="236" width="228" height="40" rx="8"/>
  <text class="dg-code" x="52" y="256" dy="0.35em">'409'</text>
  <rect class="dg-box" x="36" y="292" width="228" height="40" rx="8"/>
  <text class="dg-code" x="52" y="312" dy="0.35em">'422'</text>

  <rect class="dg-frame" x="380" y="20" width="280" height="340" rx="12"/>
  <text class="dg-code" x="396" y="44" dy="0.35em">components</text>
  <rect class="dg-box" x="396" y="68" width="248" height="40" rx="8"/>
  <text class="dg-code" x="412" y="88" dy="0.35em">Slug</text>
  <text class="dg-note" x="628" y="88" dy="0.35em" text-anchor="end">parameter</text>
  <rect class="dg-box" x="396" y="124" width="248" height="40" rx="8"/>
  <text class="dg-code" x="412" y="144" dy="0.35em">CartItemInput</text>
  <text class="dg-note" x="628" y="144" dy="0.35em" text-anchor="end">schema</text>
  <rect class="dg-box" x="396" y="180" width="248" height="40" rx="8"/>
  <text class="dg-code" x="412" y="200" dy="0.35em">Cart</text>
  <text class="dg-note" x="628" y="200" dy="0.35em" text-anchor="end">schema</text>
  <rect class="dg-hot" x="396" y="236" width="248" height="40" rx="8"/>
  <text class="dg-on-hot dg-code" x="412" y="256" dy="0.35em">OutOfStockProblem</text>
  <rect class="dg-box" x="396" y="292" width="248" height="40" rx="8"/>
  <text class="dg-code" x="412" y="312" dy="0.35em">ValidationFailed</text>
  <text class="dg-note" x="628" y="312" dy="0.35em" text-anchor="end">response</text>

  <!-- The $ref pointers. -->
  <path class="dg-line" d="M264 88 H392" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M264 144 H392" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M264 200 H392" marker-end="url(#arrow)"/>
  <path class="dg-flow" d="M264 256 H392" marker-end="url(#arrow-flow)"/>
  <text class="dg-code" x="328" y="236" dy="0.35em" text-anchor="middle">$ref</text>
  <path class="dg-line" d="M264 312 H392" marker-end="url(#arrow)"/>
</svg>
