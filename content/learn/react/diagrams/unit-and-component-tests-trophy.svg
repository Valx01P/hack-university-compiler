<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>The testing trophy: static, unit, integration, and end-to-end</title>
  <desc>Four layers stacked like a trophy. Static checks, types and lint, form the base. Above them, unit tests cover logic with many cases. The widest layer is integration tests, which check features the way users meet them, and get the most tests. A narrow top holds a few end-to-end tests for whole journeys. Going up, tests get slower and closer to what users do.</desc>

  <!-- End-to-end: the narrow top. -->
  <rect class="dg-box" x="200" y="20" width="200" height="56" rx="8"/>
  <text x="300" y="39" dy="0.35em" text-anchor="middle">End-to-end
    <tspan class="dg-note" x="300" dy="1.4em">a few journeys</tspan>
  </text>

  <!-- Integration: the widest part. -->
  <rect class="dg-hot" x="90" y="88" width="420" height="72" rx="8"/>
  <text class="dg-on-hot" x="300" y="113" dy="0.35em" text-anchor="middle">Integration
    <tspan x="300" dy="1.4em">the most: features as users meet them</tspan>
  </text>

  <!-- Unit. -->
  <rect class="dg-box" x="170" y="172" width="260" height="56" rx="8"/>
  <text x="300" y="191" dy="0.35em" text-anchor="middle">Unit
    <tspan class="dg-note" x="300" dy="1.4em">logic with many cases</tspan>
  </text>

  <!-- Static: the base. -->
  <rect class="dg-strong" x="130" y="240" width="340" height="56" rx="8"/>
  <text x="300" y="259" dy="0.35em" text-anchor="middle">Static
    <tspan class="dg-note" x="300" dy="1.4em">types and lint</tspan>
  </text>

  <!-- Speed and realism. -->
  <path class="dg-line" d="M560 292 V28" marker-end="url(#arrow)"/>
  <text class="dg-note" x="576" y="40" dy="0.35em">slower</text>
  <text class="dg-note" x="576" y="58" dy="0.35em">more real</text>
  <text class="dg-note" x="576" y="262" dy="0.35em">faster</text>
  <text class="dg-note" x="576" y="280" dy="0.35em">cheaper</text>
</svg>
