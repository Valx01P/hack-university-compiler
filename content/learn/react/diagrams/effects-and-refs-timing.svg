<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <title>When layout effects and ordinary effects run, around the browser's paint</title>
  <desc>Five steps from top to bottom. Step 1, React renders. Step 2, React commits and the DOM is up to date. Step 3, useLayoutEffect runs, where you can measure and set state. Step 4, the browser paints and you see the frame. Step 5, useEffect runs. Nothing new reaches the screen during steps 1 to 3, and a state change in step 3 renders again before the paint.</desc>

  <!-- Steps 1 to 3 happen before anything new is on screen -->
  <rect class="dg-frame" x="20" y="20" width="640" height="212" rx="12"/>
  <text class="dg-note" x="436" y="44" dy="0.35em">the screen hasn't changed yet</text>

  <!-- Step 1 -->
  <circle class="dg-badge" cx="56" cy="76" r="10"/>
  <text class="dg-on-badge" x="56" y="76" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-box" x="80" y="56" width="300" height="40" rx="8"/>
  <text x="100" y="76" dy="0.35em">Render: call the components</text>
  <path class="dg-line" d="M230 96 V114" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <circle class="dg-badge" cx="56" cy="138" r="10"/>
  <text class="dg-on-badge" x="56" y="138" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="80" y="118" width="300" height="40" rx="8"/>
  <text x="100" y="138" dy="0.35em">Commit: update the DOM</text>
  <path class="dg-line" d="M230 158 V176" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <circle class="dg-badge" cx="56" cy="200" r="10"/>
  <text class="dg-on-badge" x="56" y="200" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-hot" x="80" y="180" width="300" height="40" rx="8"/>
  <text class="dg-on-hot dg-code" x="100" y="200" dy="0.35em">useLayoutEffect</text>
  <text class="dg-note" x="400" y="190" dy="0.35em">measure, then set state:</text>
  <text class="dg-note" x="400" y="210" dy="0.35em">React renders again first</text>
  <path class="dg-line dg-dashed" d="M380 200 H392 V76 H384" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M230 220 V250" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <circle class="dg-badge" cx="56" cy="274" r="10"/>
  <text class="dg-on-badge" x="56" y="274" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-strong" x="80" y="254" width="300" height="40" rx="8"/>
  <text x="100" y="274" dy="0.35em">The browser paints</text>
  <text class="dg-note" x="400" y="274" dy="0.35em">you see the new frame</text>
  <path class="dg-line" d="M230 294 V312" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <circle class="dg-badge" cx="56" cy="336" r="10"/>
  <text class="dg-on-badge" x="56" y="336" dy="0.35em" text-anchor="middle">5</text>
  <rect class="dg-box" x="80" y="316" width="300" height="40" rx="8"/>
  <text class="dg-code" x="100" y="336" dy="0.35em">useEffect</text>
  <text class="dg-note" x="400" y="336" dy="0.35em">timers, listeners, connections</text>
</svg>
