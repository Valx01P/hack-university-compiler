<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600">
  <title>The React course's path, from why React exists to testing a whole app</title>
  <desc>The course in six stretches, in three groups. To understand: why React exists and where a page's HTML is made. To build: React basics, then state and performance, then building an app with routing, APIs, forms, and security. To ship: rendering on the server, then testing. Beside each stretch is what the Trailhead shop gains in it. After the course, the Next.js course builds the same shop with a framework.</desc>

  <!-- Column heading for what the shop gains. -->
  <text class="dg-heading" x="452" y="32" dy="0.35em">Trailhead gains</text>

  <!-- Understand. -->
  <text class="dg-heading" x="72" y="32" dy="0.35em">Understand <tspan class="dg-note">the why</tspan></text>
  <circle class="dg-badge" cx="40" cy="78" r="10"/>
  <text class="dg-on-badge" x="40" y="78" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-hot" x="72" y="52" width="360" height="52" rx="8"/>
  <text class="dg-on-hot" x="92" y="68" dy="0.35em">Why React
    <tspan x="92" dy="1.4em">why it exists, and where HTML is made</tspan>
  </text>
  <text class="dg-note" x="452" y="78" dy="0.35em">the ideas, before any code</text>
  <path class="dg-flow" d="M40 88 V168" marker-end="url(#arrow-flow)"/>

  <!-- Build. -->
  <text class="dg-heading" x="72" y="136" dy="0.35em">Build <tspan class="dg-note">from one component to an app</tspan></text>
  <circle class="dg-badge" cx="40" cy="182" r="10"/>
  <text class="dg-on-badge" x="40" y="182" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="72" y="156" width="360" height="52" rx="8"/>
  <text x="92" y="173" dy="0.35em">React Basics
    <tspan class="dg-note" x="92" dy="1.4em">components, a new project, state, effects</tspan>
  </text>
  <text class="dg-note" x="452" y="182" dy="0.35em">product cards, a cart button</text>
  <path class="dg-flow" d="M40 192 V232" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="40" cy="246" r="10"/>
  <text class="dg-on-badge" x="40" y="246" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-box" x="72" y="220" width="360" height="52" rx="8"/>
  <text x="92" y="237" dy="0.35em">State and Performance
    <tspan class="dg-note" x="92" dy="1.4em">sharing state, and keeping screens fast</tspan>
  </text>
  <text class="dg-note" x="452" y="246" dy="0.35em">a cart all pages share</text>
  <path class="dg-flow" d="M40 256 V296" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="40" cy="310" r="10"/>
  <text class="dg-on-badge" x="40" y="310" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-box" x="72" y="284" width="360" height="52" rx="8"/>
  <text x="92" y="301" dy="0.35em">Building an App
    <tspan class="dg-note" x="92" dy="1.4em">routing, APIs, forms, and security</tspan>
  </text>
  <text class="dg-note" x="452" y="310" dy="0.35em">pages, data, login, checkout</text>
  <path class="dg-flow" d="M40 320 V400" marker-end="url(#arrow-flow)"/>

  <!-- Ship. -->
  <text class="dg-heading" x="72" y="368" dy="0.35em">Ship <tspan class="dg-note">render it fast, and prove it works</tspan></text>
  <circle class="dg-badge" cx="40" cy="414" r="10"/>
  <text class="dg-on-badge" x="40" y="414" dy="0.35em" text-anchor="middle">5</text>
  <rect class="dg-box" x="72" y="388" width="360" height="52" rx="8"/>
  <text x="92" y="405" dy="0.35em">Rendering on the Server
    <tspan class="dg-note" x="92" dy="1.4em">server rendering, hydration, Server Components</tspan>
  </text>
  <text class="dg-note" x="452" y="414" dy="0.35em">pages that arrive ready-made</text>
  <path class="dg-flow" d="M40 424 V464" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="40" cy="478" r="10"/>
  <text class="dg-on-badge" x="40" y="478" dy="0.35em" text-anchor="middle">6</text>
  <rect class="dg-box" x="72" y="452" width="360" height="52" rx="8"/>
  <text x="92" y="469" dy="0.35em">Testing
    <tspan class="dg-note" x="92" dy="1.4em">Vitest, Testing Library, MSW, Playwright</tspan>
  </text>
  <text class="dg-note" x="452" y="478" dy="0.35em">tests for every journey</text>

  <!-- After the course. -->
  <path class="dg-line dg-dashed" d="M40 488 V556 H68" marker-end="url(#arrow)"/>
  <rect class="dg-off" x="72" y="536" width="360" height="40" rx="8"/>
  <text class="dg-faint" x="92" y="556" dy="0.35em">Next: Next.js builds the same shop</text>
</svg>
