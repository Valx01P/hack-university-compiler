<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <title>From jQuery to the React Compiler, 2006 to 2025</title>
  <desc>A timeline. jQuery in 2006 made DOM steps shorter. Backbone and AngularJS in 2010 tied views to models, then added two-way binding. React in 2013 had you describe the UI and changed only the difference. React Native followed in 2015, Hooks in 2019, concurrent rendering in React 18 in 2022, Actions and Server Components in React 19 in 2024, and the React Compiler 1.0 in 2025.</desc>

  <path class="dg-line" d="M110 40 V432"/>

  <circle class="dg-box" cx="110" cy="40" r="7"/>
  <text class="dg-heading" x="86" y="40" dy="0.35em" text-anchor="end">2006</text>
  <text x="136" y="30" dy="0.35em">jQuery
    <tspan class="dg-note" x="136" dy="1.4em">shorter DOM steps that work in every browser</tspan>
  </text>

  <circle class="dg-box" cx="110" cy="96" r="7"/>
  <text class="dg-heading" x="86" y="96" dy="0.35em" text-anchor="end">2010</text>
  <text x="136" y="86" dy="0.35em">Backbone and AngularJS
    <tspan class="dg-note" x="136" dy="1.4em">views tied to models, then two-way binding</tspan>
  </text>

  <rect class="dg-hot" x="126" y="126" width="440" height="52" rx="8"/>
  <circle class="dg-hot" cx="110" cy="152" r="7"/>
  <text class="dg-heading" x="86" y="152" dy="0.35em" text-anchor="end">2013</text>
  <text class="dg-on-hot" x="142" y="142" dy="0.35em">React
    <tspan x="142" dy="1.4em">describe the UI, and React changes the difference</tspan>
  </text>

  <circle class="dg-box" cx="110" cy="208" r="7"/>
  <text class="dg-heading" x="86" y="208" dy="0.35em" text-anchor="end">2015</text>
  <text x="136" y="198" dy="0.35em">React Native
    <tspan class="dg-note" x="136" dy="1.4em">the same React, for phone apps</tspan>
  </text>

  <circle class="dg-box" cx="110" cy="264" r="7"/>
  <text class="dg-heading" x="86" y="264" dy="0.35em" text-anchor="end">2019</text>
  <text x="136" y="254" dy="0.35em">Hooks
    <tspan class="dg-note" x="136" dy="1.4em">state in plain function components</tspan>
  </text>

  <circle class="dg-box" cx="110" cy="320" r="7"/>
  <text class="dg-heading" x="86" y="320" dy="0.35em" text-anchor="end">2022</text>
  <text x="136" y="310" dy="0.35em">React 18
    <tspan class="dg-note" x="136" dy="1.4em">concurrent rendering: urgent updates go first</tspan>
  </text>

  <circle class="dg-box" cx="110" cy="376" r="7"/>
  <text class="dg-heading" x="86" y="376" dy="0.35em" text-anchor="end">2024</text>
  <text x="136" y="366" dy="0.35em">React 19
    <tspan class="dg-note" x="136" dy="1.4em">Actions for forms, and Server Components</tspan>
  </text>

  <circle class="dg-box" cx="110" cy="432" r="7"/>
  <text class="dg-heading" x="86" y="432" dy="0.35em" text-anchor="end">2025</text>
  <text x="136" y="422" dy="0.35em">React Compiler 1.0
    <tspan class="dg-note" x="136" dy="1.4em">skips work you used to skip by hand</tspan>
  </text>
</svg>
