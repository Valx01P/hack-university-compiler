<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>What a test does: call your code, then compare the result</title>
  <desc>In step 1, the test calls formatPrice with 18900. In step 2, formatPrice returns the text $189.00. In step 3, the test compares that result with the value it expected, using toBe. If they match the test passes, and if not it fails and shows both values.</desc>

  <rect class="dg-box" x="40" y="60" width="220" height="56" rx="8"/>
  <text x="150" y="79" dy="0.35em" text-anchor="middle">The test
    <tspan class="dg-code" x="150" dy="1.4em">format.test.ts</tspan>
  </text>

  <rect class="dg-hot" x="420" y="60" width="220" height="56" rx="8"/>
  <text class="dg-on-hot" x="530" y="79" dy="0.35em" text-anchor="middle">Your code
    <tspan class="dg-code" x="530" dy="1.4em">formatPrice</tspan>
  </text>

  <!-- Step 1: the input. -->
  <path class="dg-flow" d="M260 76 H416" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="296" cy="50" r="10"/>
  <text class="dg-on-badge" x="296" y="50" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="314" y="50" dy="0.35em">18900</text>

  <!-- Step 2: the result. -->
  <path class="dg-line dg-dashed" d="M420 100 H264" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="296" cy="126" r="10"/>
  <text class="dg-on-badge" x="296" y="126" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="314" y="126" dy="0.35em">"$189.00"</text>

  <!-- Step 3: the comparison. -->
  <path class="dg-flow" d="M150 116 V176" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="172" cy="148" r="10"/>
  <text class="dg-on-badge" x="172" y="148" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-strong" x="40" y="180" width="220" height="56" rx="8"/>
  <text x="150" y="199" dy="0.35em" text-anchor="middle">Compare
    <tspan class="dg-code" x="150" dy="1.4em">toBe("$189.00")</tspan>
  </text>

  <path class="dg-line" d="M260 208 H416" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="420" y="180" width="220" height="56" rx="8"/>
  <text x="530" y="199" dy="0.35em" text-anchor="middle">Pass or fail
    <tspan class="dg-note" x="530" dy="1.4em">a failure shows both values</tspan>
  </text>
</svg>
