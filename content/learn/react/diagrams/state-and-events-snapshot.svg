<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <title>Two renders, each with its own quantity, and a timer started in the first</title>
  <desc>In render 1, quantity is 1 and the screen shows 1. Step 1: clicking Add to cart starts a three-second timer, made during render 1, so it holds quantity 1. Step 2: clicking One more calls setQuantity(2), which starts render 2. Step 3: in render 2, quantity is 2 and the screen shows 2. Step 4: the timer fires and logs Added 1 to the cart, the value from its own render.</desc>

  <!-- Render 1. -->
  <rect class="dg-frame" x="20" y="20" width="260" height="200" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">Render 1 <tspan class="dg-note">quantity is 1</tspan></text>
  <rect class="dg-box" x="60" y="72" width="200" height="40" rx="8"/>
  <text x="160" y="92" dy="0.35em" text-anchor="middle">Screen shows 1</text>
  <circle class="dg-badge" cx="40" cy="160" r="10"/>
  <text class="dg-on-badge" x="40" y="160" dy="0.35em" text-anchor="middle">1</text>
  <rect class="dg-strong" x="60" y="132" width="200" height="56" rx="8"/>
  <text x="160" y="150" dy="0.35em" text-anchor="middle">Add to cart handler
    <tspan class="dg-note" x="160" dy="1.4em">its timer holds 1</tspan>
  </text>

  <!-- The click that sets state. -->
  <text class="dg-note" x="340" y="84" dy="0.35em" text-anchor="middle">click One more</text>
  <path class="dg-flow" d="M280 110 H396" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="340" cy="110" r="10"/>
  <text class="dg-on-badge" x="340" y="110" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-code" x="340" y="136" dy="0.35em" text-anchor="middle">setQuantity(2)</text>

  <!-- Render 2. -->
  <rect class="dg-frame" x="400" y="20" width="260" height="200" rx="12"/>
  <text class="dg-heading" x="420" y="44" dy="0.35em">Render 2 <tspan class="dg-note">quantity is 2</tspan></text>
  <circle class="dg-badge" cx="420" cy="92" r="10"/>
  <text class="dg-on-badge" x="420" y="92" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-hot" x="440" y="72" width="200" height="40" rx="8"/>
  <text class="dg-on-hot" x="540" y="92" dy="0.35em" text-anchor="middle">Screen shows 2</text>
  <rect class="dg-box" x="440" y="132" width="200" height="56" rx="8"/>
  <text x="540" y="150" dy="0.35em" text-anchor="middle">New handlers
    <tspan class="dg-note" x="540" dy="1.4em">they see 2</tspan>
  </text>

  <!-- The old timer, three seconds later. -->
  <path class="dg-line dg-dashed" d="M160 188 V252 H540 V276" marker-end="url(#arrow)"/>
  <text class="dg-note" x="300" y="270" dy="0.35em" text-anchor="middle">three seconds later</text>
  <circle class="dg-badge" cx="420" cy="308" r="10"/>
  <text class="dg-on-badge" x="420" y="308" dy="0.35em" text-anchor="middle">4</text>
  <rect class="dg-hot" x="440" y="280" width="200" height="56" rx="8"/>
  <text class="dg-on-hot" x="540" y="298" dy="0.35em" text-anchor="middle">The timer logs
    <tspan class="dg-code" x="540" dy="1.4em">Added 1 to the cart</tspan>
  </text>
</svg>
