<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Client-side routing: one click swaps one component, with no HTML request</title>
  <desc>In the browser, you click a Link on the product list. The router changes the address to /products/ridge-2p-tent with pushState, and renders ProductPage in place of ProductsPage. The header and footer stay as they were, and the server is never asked for a new HTML page.</desc>

  <!-- The browser. -->
  <rect class="dg-frame" x="20" y="20" width="420" height="296" rx="12"/>
  <text class="dg-heading" x="40" y="44" dy="0.35em">Browser</text>
  <rect class="dg-box" x="40" y="64" width="380" height="40" rx="8"/>
  <text class="dg-code" x="56" y="84" dy="0.35em">/products/ridge-2p-tent</text>
  <circle class="dg-badge" cx="396" cy="84" r="10"/>
  <text class="dg-on-badge" x="396" y="84" dy="0.35em" text-anchor="middle">2</text>
  <rect class="dg-box" x="40" y="120" width="380" height="40" rx="8"/>
  <text x="230" y="140" dy="0.35em" text-anchor="middle">Header</text>

  <rect class="dg-off" x="40" y="176" width="160" height="64" rx="8"/>
  <text class="dg-faint" x="112" y="198" dy="0.35em" text-anchor="middle">ProductsPage
    <tspan x="112" dy="1.4em">the list</tspan>
  </text>
  <circle class="dg-badge" cx="184" cy="192" r="10"/>
  <text class="dg-on-badge" x="184" y="192" dy="0.35em" text-anchor="middle">1</text>
  <path class="dg-flow" d="M200 220 H256" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="228" cy="196" r="10"/>
  <text class="dg-on-badge" x="228" y="196" dy="0.35em" text-anchor="middle">3</text>
  <rect class="dg-hot" x="260" y="176" width="160" height="64" rx="8"/>
  <text class="dg-on-hot" x="340" y="198" dy="0.35em" text-anchor="middle">ProductPage
    <tspan x="340" dy="1.4em">one product</tspan>
  </text>

  <rect class="dg-box" x="40" y="256" width="380" height="40" rx="8"/>
  <text x="230" y="276" dy="0.35em" text-anchor="middle">Footer</text>

  <!-- The steps. -->
  <circle class="dg-badge" cx="476" cy="84" r="10"/>
  <text class="dg-on-badge" x="476" y="84" dy="0.35em" text-anchor="middle">1</text>
  <text x="496" y="84" dy="0.35em">Click a Link</text>
  <circle class="dg-badge" cx="476" cy="132" r="10"/>
  <text class="dg-on-badge" x="476" y="132" dy="0.35em" text-anchor="middle">2</text>
  <text x="496" y="124" dy="0.35em">Address changes
    <tspan class="dg-note" x="496" dy="1.4em">by pushState</tspan>
  </text>
  <circle class="dg-badge" cx="476" cy="188" r="10"/>
  <text class="dg-on-badge" x="476" y="188" dy="0.35em" text-anchor="middle">3</text>
  <text x="496" y="180" dy="0.35em">One part swaps
    <tspan class="dg-note" x="496" dy="1.4em">the rest stays</tspan>
  </text>

  <!-- The server, not asked. -->
  <rect class="dg-off" x="460" y="240" width="200" height="56" rx="8"/>
  <text class="dg-faint" x="560" y="260" dy="0.35em" text-anchor="middle">Server
    <tspan x="560" dy="1.4em">not asked for HTML</tspan>
  </text>
</svg>
