<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260">
  <title>Three set calls in one click, queued and applied in order</title>
  <desc>Two rows, each starting from quantity 1. In the first, the handler passes a value three times. Each call was worked out from the same snapshot, so each says set to 2, and the result is 2. In the second, the handler passes the updater q => q + 1 three times. React runs each one on the result of the one before, so 1 becomes 2, then 3, then 4, and the result is 4.</desc>

  <!-- Passing a value. -->
  <text class="dg-heading" x="20" y="32" dy="0.35em">Passing a value <tspan class="dg-note">worked out from the snapshot, where quantity is 1</tspan></text>
  <rect class="dg-box" x="20" y="60" width="60" height="40" rx="8"/>
  <text x="50" y="80" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="50" y="116" dy="0.35em" text-anchor="middle">start</text>
  <text class="dg-note" x="100" y="68" dy="0.35em" text-anchor="middle">1</text>
  <path class="dg-line" d="M80 80 H116" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="120" y="60" width="120" height="40" rx="8"/>
  <text x="180" y="80" dy="0.35em" text-anchor="middle">set to 2</text>
  <text class="dg-note" x="260" y="68" dy="0.35em" text-anchor="middle">2</text>
  <path class="dg-line" d="M240 80 H276" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="280" y="60" width="120" height="40" rx="8"/>
  <text x="340" y="80" dy="0.35em" text-anchor="middle">set to 2</text>
  <text class="dg-note" x="420" y="68" dy="0.35em" text-anchor="middle">2</text>
  <path class="dg-line" d="M400 80 H436" marker-end="url(#arrow)"/>
  <rect class="dg-box" x="440" y="60" width="120" height="40" rx="8"/>
  <text x="500" y="80" dy="0.35em" text-anchor="middle">set to 2</text>
  <text class="dg-note" x="580" y="68" dy="0.35em" text-anchor="middle">2</text>
  <path class="dg-line" d="M560 80 H596" marker-end="url(#arrow)"/>
  <rect class="dg-strong" x="600" y="60" width="60" height="40" rx="8"/>
  <text x="630" y="80" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="630" y="116" dy="0.35em" text-anchor="middle">result</text>

  <!-- Passing an updater. -->
  <text class="dg-heading" x="20" y="160" dy="0.35em">Passing an updater <tspan class="dg-note">each one gets the value before it</tspan></text>
  <rect class="dg-box" x="20" y="188" width="60" height="40" rx="8"/>
  <text x="50" y="208" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-note" x="50" y="244" dy="0.35em" text-anchor="middle">start</text>
  <text class="dg-note" x="100" y="196" dy="0.35em" text-anchor="middle">1</text>
  <path class="dg-flow" d="M80 208 H116" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="120" y="188" width="120" height="40" rx="8"/>
  <text class="dg-code" x="180" y="208" dy="0.35em" text-anchor="middle">q =&gt; q + 1</text>
  <text class="dg-note" x="260" y="196" dy="0.35em" text-anchor="middle">2</text>
  <path class="dg-flow" d="M240 208 H276" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="280" y="188" width="120" height="40" rx="8"/>
  <text class="dg-code" x="340" y="208" dy="0.35em" text-anchor="middle">q =&gt; q + 1</text>
  <text class="dg-note" x="420" y="196" dy="0.35em" text-anchor="middle">3</text>
  <path class="dg-flow" d="M400 208 H436" marker-end="url(#arrow-flow)"/>
  <rect class="dg-box" x="440" y="188" width="120" height="40" rx="8"/>
  <text class="dg-code" x="500" y="208" dy="0.35em" text-anchor="middle">q =&gt; q + 1</text>
  <text class="dg-note" x="580" y="196" dy="0.35em" text-anchor="middle">4</text>
  <path class="dg-flow" d="M560 208 H596" marker-end="url(#arrow-flow)"/>
  <rect class="dg-hot" x="600" y="188" width="60" height="40" rx="8"/>
  <text class="dg-on-hot" x="630" y="208" dy="0.35em" text-anchor="middle">4</text>
  <text class="dg-note" x="630" y="244" dy="0.35em" text-anchor="middle">result</text>
</svg>
