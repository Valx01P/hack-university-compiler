<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>Kubb turns one spec into six kinds of generated code</title>
  <desc>openapi.yaml goes into Kubb, which runs its plugins and writes six folders under src/api/gen: TypeScript types, zod schemas, a client function per operation, TanStack Query hooks, faker factories for fake data, and MSW handlers. All six come from the same definitions, so they agree with each other and with the API.</desc>

  <rect class="dg-box" x="20" y="132" width="160" height="56" rx="8"/>
  <text class="dg-code" x="100" y="160" dy="0.35em" text-anchor="middle">openapi.yaml</text>

  <rect class="dg-hot" x="230" y="132" width="140" height="56" rx="8"/>
  <text class="dg-on-hot" x="300" y="151" dy="0.35em" text-anchor="middle">Kubb
    <tspan x="300" dy="1.4em">7 plugins</tspan>
  </text>

  <path class="dg-flow" d="M180 160 H226" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M370 160 H400"/>
  <path class="dg-line" d="M400 40 V280"/>

  <rect class="dg-box" x="440" y="20" width="220" height="40" rx="8"/>
  <text class="dg-code" x="456" y="40" dy="0.35em">types/</text>
  <text class="dg-note" x="644" y="40" dy="0.35em" text-anchor="end">TypeScript</text>
  <path class="dg-line" d="M400 40 H436" marker-end="url(#arrow)"/>

  <rect class="dg-box" x="440" y="68" width="220" height="40" rx="8"/>
  <text class="dg-code" x="456" y="88" dy="0.35em">zod/</text>
  <text class="dg-note" x="644" y="88" dy="0.35em" text-anchor="end">schemas</text>
  <path class="dg-line" d="M400 88 H436" marker-end="url(#arrow)"/>

  <rect class="dg-box" x="440" y="116" width="220" height="40" rx="8"/>
  <text class="dg-code" x="456" y="136" dy="0.35em">clients/</text>
  <text class="dg-note" x="644" y="136" dy="0.35em" text-anchor="end">one per operation</text>
  <path class="dg-line" d="M400 136 H436" marker-end="url(#arrow)"/>

  <rect class="dg-box" x="440" y="164" width="220" height="40" rx="8"/>
  <text class="dg-code" x="456" y="184" dy="0.35em">hooks/</text>
  <text class="dg-note" x="644" y="184" dy="0.35em" text-anchor="end">TanStack Query</text>
  <path class="dg-line" d="M400 184 H436" marker-end="url(#arrow)"/>

  <rect class="dg-box" x="440" y="212" width="220" height="40" rx="8"/>
  <text class="dg-code" x="456" y="232" dy="0.35em">mocks/</text>
  <text class="dg-note" x="644" y="232" dy="0.35em" text-anchor="end">faker data</text>
  <path class="dg-line" d="M400 232 H436" marker-end="url(#arrow)"/>

  <rect class="dg-box" x="440" y="260" width="220" height="40" rx="8"/>
  <text class="dg-code" x="456" y="280" dy="0.35em">handlers/</text>
  <text class="dg-note" x="644" y="280" dy="0.35em" text-anchor="end">MSW</text>
  <path class="dg-line" d="M400 280 H436" marker-end="url(#arrow)"/>
</svg>
