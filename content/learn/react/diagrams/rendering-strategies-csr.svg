<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>Client-side rendering: five steps before the content appears</title>
  <desc>A waterfall over time. Step 1, the HTML shell arrives quickly, with an empty root div. Step 2, the browser downloads the JavaScript bundle. Step 3, it runs, and React renders the app, with no data yet. Step 4, the app fetches its data from an API. Step 5, React renders again with the data, and the content appears. Until step 5, the screen is blank or shows a spinner.</desc>

  <circle class="dg-badge" cx="36" cy="44" r="10"/>
  <text class="dg-on-badge" x="36" y="44" dy="0.35em" text-anchor="middle">1</text>
  <text x="56" y="44" dy="0.35em">HTML shell</text>
  <rect class="dg-box" x="220" y="28" width="50" height="32" rx="8"/>

  <circle class="dg-badge" cx="36" cy="92" r="10"/>
  <text class="dg-on-badge" x="36" y="92" dy="0.35em" text-anchor="middle">2</text>
  <text x="56" y="92" dy="0.35em">Download the JS</text>
  <rect class="dg-box" x="270" y="76" width="160" height="32" rx="8"/>

  <circle class="dg-badge" cx="36" cy="140" r="10"/>
  <text class="dg-on-badge" x="36" y="140" dy="0.35em" text-anchor="middle">3</text>
  <text x="56" y="140" dy="0.35em">Run it, render</text>
  <rect class="dg-box" x="430" y="124" width="60" height="32" rx="8"/>

  <circle class="dg-badge" cx="36" cy="188" r="10"/>
  <text class="dg-on-badge" x="36" y="188" dy="0.35em" text-anchor="middle">4</text>
  <text x="56" y="188" dy="0.35em">Fetch the data</text>
  <rect class="dg-box" x="490" y="172" width="110" height="32" rx="8"/>
  <text class="dg-code" x="545" y="188" dy="0.35em" text-anchor="middle">GET /api</text>

  <circle class="dg-badge" cx="36" cy="236" r="10"/>
  <text class="dg-on-badge" x="36" y="236" dy="0.35em" text-anchor="middle">5</text>
  <text x="56" y="236" dy="0.35em">Render with data</text>
  <rect class="dg-hot" x="600" y="220" width="60" height="32" rx="8"/>

  <path class="dg-line" d="M220 276 H656" marker-end="url(#arrow)"/>
  <text class="dg-note" x="656" y="292" dy="0.35em" text-anchor="end">time</text>
  <rect class="dg-off" x="220" y="300" width="376" height="28" rx="8"/>
  <text class="dg-faint" x="408" y="314" dy="0.35em" text-anchor="middle">blank screen, or a spinner</text>
  <text class="dg-note" x="630" y="314" dy="0.35em" text-anchor="middle">content</text>
</svg>
