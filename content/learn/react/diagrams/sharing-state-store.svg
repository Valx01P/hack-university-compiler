<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <title>One Zustand store, three subscribed components, and only one renders after a change</title>
  <desc>Step 1, QuickAddButton calls addItem on the cart store. Step 2, the store updates its items and runs the selector of each subscribed component. Step 3, only CartBadge's result changed, its count going from 1 to 2, so only CartBadge renders. QuickAddButton's selector returns the same addItem function, and CheckoutLink's still says there are items, so both skip rendering.</desc>

  <!-- The store -->
  <rect class="dg-hot" x="220" y="20" width="240" height="56" rx="8"/>
  <text class="dg-on-hot" x="340" y="38" dy="0.35em" text-anchor="middle">Cart store
    <tspan class="dg-code" x="340" dy="1.4em">items</tspan>
  </text>
  <circle class="dg-badge" cx="484" cy="48" r="10"/>
  <text class="dg-on-badge" x="484" y="48" dy="0.35em" text-anchor="middle">2</text>
  <text class="dg-note" x="502" y="48" dy="0.35em">runs each selector</text>

  <!-- The store tells each subscriber -->
  <path class="dg-flow" d="M240 76 V150 H120 V216" marker-end="url(#arrow-flow)"/>
  <path class="dg-line" d="M320 76 V216" marker-end="url(#arrow)"/>
  <path class="dg-line" d="M440 76 V150 H560 V216" marker-end="url(#arrow)"/>
  <circle class="dg-badge" cx="100" cy="186" r="10"/>
  <text class="dg-on-badge" x="100" y="186" dy="0.35em" text-anchor="middle">3</text>

  <!-- Step 1: the button changes the store -->
  <path class="dg-flow dg-dashed" d="M380 220 V80" marker-end="url(#arrow-flow)"/>
  <circle class="dg-badge" cx="400" cy="186" r="10"/>
  <text class="dg-on-badge" x="400" y="186" dy="0.35em" text-anchor="middle">1</text>
  <text class="dg-code" x="418" y="186" dy="0.35em">addItem(slug)</text>

  <!-- The three subscribers -->
  <rect class="dg-strong" x="20" y="220" width="200" height="56" rx="8"/>
  <text x="120" y="248" dy="0.35em" text-anchor="middle">CartBadge</text>
  <text class="dg-code" x="120" y="296" dy="0.35em" text-anchor="middle">count: 1 → 2</text>
  <text class="dg-note" x="120" y="318" dy="0.35em" text-anchor="middle">changed, renders</text>

  <rect class="dg-off" x="240" y="220" width="200" height="56" rx="8"/>
  <text class="dg-faint" x="340" y="248" dy="0.35em" text-anchor="middle">QuickAddButton</text>
  <text class="dg-code" x="340" y="296" dy="0.35em" text-anchor="middle">addItem: same</text>
  <text class="dg-note" x="340" y="318" dy="0.35em" text-anchor="middle">skips</text>

  <rect class="dg-off" x="460" y="220" width="200" height="56" rx="8"/>
  <text class="dg-faint" x="560" y="248" dy="0.35em" text-anchor="middle">CheckoutLink</text>
  <text class="dg-code" x="560" y="296" dy="0.35em" text-anchor="middle">hasItems: true</text>
  <text class="dg-note" x="560" y="318" dy="0.35em" text-anchor="middle">skips</text>
</svg>
