# What a single-file FastAPI program gets in hu/python (the fastapi recipe's
# baked venv), and, with the dev and build groups, every package the FastAPI
# templates install, at the versions architecture.md 2.4 and
# outlines/fastapi.md section 1 pin. uv.lock beside it fills the image's cache.
[project]
name = "hu-fastapi-scripts"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
  "alembic==1.20.0",
  "anyio==4.15.1",
  "asyncpg==0.32.0",
  "fastapi[standard-no-fastapi-cloud-cli]==0.148.0",
  "httpx2==2.14.0",
  "psycopg[binary]==3.3.6",
  "pwdlib[argon2]==0.3.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "pyjwt==2.15.1",
  "sqlalchemy[asyncio]==2.1.5",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.1",
]
build = [
  "uv-build==0.13.1",
]

[tool.uv]
package = false
# The course's package snapshot: what PyPI held when these pins were read.
# hu/python sets UV_EXCLUDE_NEWER to the same instant, so a learner's uv add
# resolves to versions the image's cache holds.
exclude-newer = "2026-10-19T17:00:00Z"
