# Hack University's tmux, for the compiler's Terminal (runner/host-tmux.ts).
# It's only there to keep your shell running while the app is closed or
# restarting, so it stays out of sight: its own server (tmux -L
# hack-university), so your own tmux, its sessions, and its config are never
# touched, no status bar, and no keys of its own (Ctrl+B and the rest go to
# your programs).

set -g prefix None
set -g prefix2 None
unbind-key -a -T prefix
set -g status off
set -g mouse off
set -g escape-time 0
set -g history-limit 10000
set -g focus-events on
set -g set-clipboard on
set -g set-titles off
set -g allow-rename off
set -g window-size latest
set -g destroy-unattached off

# The runner reads this file again into a server that's already running
# (loadTmuxConfig), so the lists below take their entries by number, the
# same each time, never appended.

# Drawn on the terminal's normal screen, not the alternate one, so what
# scrolls off the top goes into the browser terminal's own scrollback, and
# its wheel scrolling and selection work as without tmux.
set -s "terminal-overrides[90]" "xterm*:smcup@:rmcup@"
# 24-bit color passes through (Claude Code, and other programs, use it), and
# redraws come as synchronized updates (DEC mode 2026), marked where they
# start and end, so the browser terminal draws each one whole: a resize's
# redraw lands in one frame (lib/terminal-bridge.ts).
set -s "terminal-features[90]" "xterm*:RGB:sync"

# What programs inside see as TERM: tmux's own when this computer knows it,
# else screen's, which every system has.
if-shell "infocmp tmux-256color >/dev/null 2>&1" "set -g default-terminal tmux-256color" "set -g default-terminal screen-256color"
